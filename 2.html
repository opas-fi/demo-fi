  <script>
    const verses = [{"verse":1,"commentary_en":"This verse consists of three Arabic letters. In Islamic belief, these letters, which begin several chapters of the Qur’an, are part of the divine revelation. While their exact meaning is known only to Allah, one perspective is that they highlight that the Qur’an is composed of the same letters used in the Arabic language known to its first audience. Despite this, the Qur’an is considered a miraculous and unparalleled work that humans cannot replicate, challenging anyone to produce something similar.","commentary_fi":"Tämä jae koostuu kolmesta arabialaisesta kirjaimesta. Islamilaisen uskon mukaan nämä kirjaimet, jotka aloittavat useita Koraanin lukuja, ovat osa jumalallista ilmoitusta. Vaikka niiden tarkka merkitys on tiedossa vain Allahilla, eräs näkökulma on, että ne korostavat Koraanin koostuvan samoista kirjaimista, joita sen ensimmäinen yleisö tunsi arabian kielessä. Tästä huolimatta Koraania pidetään ihmeellisenä ja verrattomana teoksena, jota ihmiset eivät voi jäljitellä, ja se haastaa kenet tahansa tuottamaan jotain vastaavaa.","arabic":"الم","commentary":"Tämä jae koostuu kolmesta arabialaisesta kirjaimesta. Islamilaisen uskon mukaan nämä kirjaimet, jotka aloittavat useita Koraanin lukuja, ovat osa jumalallista ilmoitusta. Vaikka niiden tarkka merkitys on tiedossa vain Allahilla, eräs näkökulma on, että ne korostavat Koraanin koostuvan samoista kirjaimista, joita sen ensimmäinen yleisö tunsi arabian kielessä. Tästä huolimatta Koraania pidetään ihmeellisenä ja verrattomana teoksena, jota ihmiset eivät voi jäljitellä, ja se haastaa kenet tahansa tuottamaan jotain vastaavaa.","translations":{"opas":"Alif. Laam. Miim. Tämä Pyhä kirja, siitä ei ole epäilystäkään on","clear":"Alif-Lãm-Mĩm."}},{"verse":2,"commentary_en":"Following the opening letters, this verse declares that the Qur’an is a Book of certain guidance. It is not for everyone indiscriminately, but specifically for those who are mindful of Allah (often translated as \"fear Allah\"). Being mindful of Allah means having a sensitive conscience, being alert to life's challenges and temptations, and striving to stay on the right path, much like carefully navigating a thorny road to avoid harm. This state of mind makes one receptive to the Qur’an's light and wisdom.","commentary_fi":"Avauskirjainten jälkeen tämä jae ilmoittaa, että Koraani on kirja, joka tarjoaa varman opastuksen. Se ei ole tarkoitettu kaikille umpimähkäisesti, vaan erityisesti niille, jotka ovat tietoisia Allahista (usein käännetty \"pelkäävät Allahia\"). Ollakseen tietoinen Allahista tarkoittaa, että on herkkä omatunto, valpas elämän haasteille ja houkutuksille sekä pyrkii pysymään oikealla tiellä, aivan kuten varovaisesti kuljettaisiin piikikkäällä tiellä vahinkojen välttämiseksi. Tällainen mielentila tekee vastaanottavaiseksi Koraanin valolle ja viisaudelle.","arabic":"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِلْمُتَّقِينَ","commentary":"Avauskirjainten jälkeen tämä jae ilmoittaa, että Koraani on kirja, joka tarjoaa varman opastuksen. Se ei ole tarkoitettu kaikille umpimähkäisesti, vaan erityisesti niille, jotka ovat tietoisia Allahista (usein käännetty \"pelkäävät Allahia\"). Ollakseen tietoinen Allahista tarkoittaa, että on herkkä omatunto, valpas elämän haasteille ja houkutuksille sekä pyrkii pysymään oikealla tiellä, aivan kuten varovaisesti kuljettaisiin piikikkäällä tiellä vahinkojen välttämiseksi. Tällainen mielentila tekee vastaanottavaiseksi Koraanin valolle ja viisaudelle.","translations":{"opas":"opastus jumalaapelkääväisille ja pahaa karttaville ,","clear":"Tämä on Kirja! Siitä ei ole epäilystäkään – opas niille, jotka ovat tietoisia [Allahista],"}},{"verse":3,"commentary_en":"This verse begins a description of the qualities of those who benefit from the Qur’an's guidance mentioned in the previous verse. The first quality is belief in the Unseen – matters beyond normal human perception, such as Allah Himself, angels, and the Hereafter. This belief elevates human consciousness beyond the purely physical world. The verse also mentions establishing prayer, which connects the believer directly to Allah, and spending charitably from what Allah has provided. This spending is seen as acknowledging that wealth is a trust from Allah and fosters compassion and community.","commentary_fi":"Tämä jae aloittaa kuvauksen niiden ominaisuuksista, jotka hyötyvät edellisessä jakeessa mainitusta Koraanin ohjauksesta. Ensimmäinen ominaisuus on usko Näkymättömään – asioihin, jotka ylittävät normaalin ihmistajunnan, kuten Allah itse, enkelit ja Tuonpuoleinen. Tämä usko kohottaa ihmisen tietoisuutta puhtaasti fyysisen maailman yläpuolelle. Jae mainitsee myös rukouksen säännöllisen suorittamisen, joka yhdistää uskovan suoraan Allahiin, sekä hyväntekeväisyyteen antamisen siitä, mitä Allah on heille suonut. Tämä antaminen nähdään tunnustuksena siitä, että vauraus on luottamus Allahilta, ja se edistää myötätuntoa ja yhteisöllisyyttä.","arabic":"الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ","commentary":"Tämä jae aloittaa kuvauksen niiden ominaisuuksista, jotka hyötyvät edellisessä jakeessa mainitusta Koraanin ohjauksesta. Ensimmäinen ominaisuus on usko Näkymättömään – asioihin, jotka ylittävät normaalin ihmistajunnan, kuten Allah itse, enkelit ja Tuonpuoleinen. Tämä usko kohottaa ihmisen tietoisuutta puhtaasti fyysisen maailman yläpuolelle. Jae mainitsee myös rukouksen säännöllisen suorittamisen, joka yhdistää uskovan suoraan Allahiin, sekä hyväntekeväisyyteen antamisen siitä, mitä Allah on heille suonut. Tämä antaminen nähdään tunnustuksena siitä, että vauraus on luottamus Allahilta, ja se edistää myötätuntoa ja yhteisöllisyyttä.","translations":{"opas":"niille, jotka uskovat siihen, mikä ei näy, elävät rukoillen ja tuovat uhria siitä, mitä Me olemme heille suoneet,","clear":"jotka uskovat näkymättömään, suorittavat rukouksen ja lahjoittavat siitä, mitä Me olemme heille antaneet,"}},{"verse":4,"commentary_en":"Continuing the description from Verse 3, these verses describe the believers as those who accept the revelation given to Prophet Muhammad and all previous divine revelations sent to prophets before him. This highlights the Islamic belief in the unity of Allah's message throughout history. Furthermore, they have certainty in the Hereafter (the life to come), which provides a sense of purpose beyond this world and assurance of ultimate justice.","commentary_fi":"Jatkuen jakeen 3 kuvauksesta, nämä jakeet kuvaavat uskovaisia niiksi, jotka hyväksyvät profeetta Muhammadille annetun ilmoituksen ja kaikki aikaisemmat jumalalliset ilmoitukset, jotka on lähetetty profeetoille ennen häntä. Tämä korostaa islamilaista uskoa Allahin sanoman ykseyteen läpi historian. Lisäksi heillä on varmuus Tuonpuoleisesta (tulevasta elämästä), mikä antaa tarkoituksen tunteen tämän maailman ulkopuolella ja varmuuden lopullisesta oikeudenmukaisuudesta.","arabic":"وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ","commentary":"Jatkuen jakeen 3 kuvauksesta, nämä jakeet kuvaavat uskovaisia niiksi, jotka hyväksyvät profeetta Muhammadille annetun ilmoituksen ja kaikki aikaisemmat jumalalliset ilmoitukset, jotka on lähetetty profeetoille ennen häntä. Tämä korostaa islamilaista uskoa Allahin sanoman ykseyteen läpi historian. Lisäksi heillä on varmuus Tuonpuoleisesta (tulevasta elämästä), mikä antaa tarkoituksen tunteen tämän maailman ulkopuolella ja varmuuden lopullisesta oikeudenmukaisuudesta.","translations":{"opas":"niille, jotka uskovat siihen, mikä on ylhäältä ilmoitettu sinulle (Muhammed), sekä siihen, mikä on ilmoitettu ennen sinua, ja jotka varmassa luottamuksessa odottavat tulevaista elämää.","clear":"ja jotka uskovat siihen, mikä on sinulle [oi Profeetta] ilmoitettu ja mikä ilmoitettiin ennen sinua, ja joilla on varma usko Tuonpuoleiseen."}},{"verse":5,"commentary_en":"This verse concludes the description of the believers, affirming that because they possess the qualities mentioned in the preceding verses (3 and 4), they are indeed on true guidance from Allah. It states that it is these people who will ultimately be successful and prosperous. This verse serves as a direct consequence of the description of the true believers.","commentary_fi":"Tämä jae päättää kuvauksen uskovaisista, vahvistaen, että koska heillä on edellisissä jakeissa (3 ja 4) mainitut ominaisuudet, he ovat todella oikealla ohjauksella Allahilta. Se toteaa, että juuri nämä ihmiset tulevat lopulta menestymään ja olemaan onnekkaita. Tämä jae toimii suorana seurauksena todellisten uskovien kuvauksesta.","arabic":"أُولَٰئِكَ عَلَىٰ هُدًى مِنْ رَبِّهِمْ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ","commentary":"Tämä jae päättää kuvauksen uskovaisista, vahvistaen, että koska heillä on edellisissä jakeissa (3 ja 4) mainitut ominaisuudet, he ovat todella oikealla ohjauksella Allahilta. Se toteaa, että juuri nämä ihmiset tulevat lopulta menestymään ja olemaan onnekkaita. Tämä jae toimii suorana seurauksena todellisten uskovien kuvauksesta.","translations":{"opas":"Nämä elävät Herransa johdatuksessa; nämä ovat onnellisia.","clear":"Juuri he ovat Herransa johdatuksessa, ja juuri he menestyvät."}},{"verse":6,"commentary_en":"This verse introduces a contrasting group: those who reject faith. Unlike the receptive believers described earlier, the verse states that for these individuals, warnings are ineffective. It signifies their complete unwillingness or inability to accept the truth, no matter how clearly it is presented.","commentary_fi":"Tämä jae esittelee vastakkaisen ryhmän: ne, jotka torjuvat uskon. Toisin kuin aiemmin kuvatut vastaanottavaiset uskovaiset, jae toteaa, että näille yksilöille varoitukset ovat tehottomia. Se merkitsee heidän täydellistä haluttomuuttaan tai kyvyttömyyttään hyväksyä totuus, riippumatta siitä, kuinka selvästi se esitetään.","arabic":"إِنَّ الَّذِينَ كَفَرُوا سَوَاءٌ عَلَيْهِمْ أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ لَا يُؤْمِنُونَ","commentary":"Tämä jae esittelee vastakkaisen ryhmän: ne, jotka torjuvat uskon. Toisin kuin aiemmin kuvatut vastaanottavaiset uskovaiset, jae toteaa, että näille yksilöille varoitukset ovat tehottomia. Se merkitsee heidän täydellistä haluttomuuttaan tai kyvyttömyyttään hyväksyä totuus, riippumatta siitä, kuinka selvästi se esitetään.","translations":{"opas":"Jumalattomille taasen on totisesti samantekevää, varoitatko heitä vai et; he eivät usko.","clear":"Niiden osalta, jotka pysyvät epäuskoisina, on aivan sama, varoitatko heitä vai et – he eivät koskaan usko."}},{"verse":7,"commentary_en":"Following the description of the rejecters of faith in Verse 6, this verse explains their condition as a consequence of their obstinacy. It states that Allah has set a seal on their hearts and hearing and placed a veil on their eyes, meaning they are unable to comprehend or respond to guidance. This state is described as leading to a great penalty, highlighting the severe consequences of persistent rejection of truth.","commentary_fi":"Jatkona jakeen 6 uskontoa torjuvien kuvaukselle, tämä jae selittää heidän tilansa heidän itsepäisyytensä seurauksena. Se toteaa, että Allah on sinetöinyt heidän sydämensä ja kuulonsa ja asettanut verhon heidän silmiensä eteen, tarkoittaen, että he eivät kykene ymmärtämään tai reagoimaan ohjaukseen. Tätä tilaa kuvataan johtavan suureen rangaistukseen, mikä korostaa pysyvän totuuden torjumisen vakavia seurauksia.","arabic":"خَتَمَ اللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰ أَبْصَارِهِمْ غِشَاوَةٌ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌ","commentary":"Jatkona jakeen 6 uskontoa torjuvien kuvaukselle, tämä jae selittää heidän tilansa heidän itsepäisyytensä seurauksena. Se toteaa, että Allah on sinetöinyt heidän sydämensä ja kuulonsa ja asettanut verhon heidän silmiensä eteen, tarkoittaen, että he eivät kykene ymmärtämään tai reagoimaan ohjaukseen. Tätä tilaa kuvataan johtavan suureen rangaistukseen, mikä korostaa pysyvän totuuden torjumisen vakavia seurauksia.","translations":{"opas":"Jumala on sinetillä sulkenut heidän sydämensä ja korvansa, ja heidän silmiään peittää verho; niin, heitä kohtaa kammottava rangaistus.","clear":"Jumala on sinetöinyt heidän sydämensä ja kuulonsa, ja heidän näkönsä on peitetty. He kärsivät valtavan rangaistuksen."}},{"verse":8,"commentary_en":"Moving beyond the clear-cut categories of believers and outright rejecters, this verse introduces a third group: those who outwardly claim to believe but lack sincere faith inwardly. This group describes the hypocrites, whose words do not align with their true state. While these hypocrites appeared during the time the Qur'an was being revealed in Medina, they represent a type found in every generation. This verse paves the way for a more detailed examination of their behavior in the verses that follow.","commentary_fi":"Siirtyen selkeistä uskovien ja avoimien kieltäjien kategorioista, tämä jae tuo esiin kolmannen ryhmän: ne, jotka ulkoisesti väittävät uskovansa, mutta joilta puuttuu vilpitön usko sisimmässään. Tämä ryhmä kuvaa hypokriittejä, joiden sanat eivät vastaa heidän todellista tilaansa. Vaikka nämä hypokriitit esiintyivät Koraanin ilmoituksen aikaan Medinassa, he edustavat tyyppiä, jota löytyy kaikista sukupolvista. Tämä jae avaa tietä yksityiskohtaisemmalle tarkastelulle heidän käyttäytymisestään seuraavissa jakeissa.","arabic":"وَمِنَ النَّاسِ مَنْ يَقُولُ آمَنَّا بِاللَّهِ وَبِالْيَوْمِ الْآخِرِ وَمَا هُمْ بِمُؤْمِنِينَ","commentary":"Siirtyen selkeistä uskovien ja avoimien kieltäjien kategorioista, tämä jae tuo esiin kolmannen ryhmän: ne, jotka ulkoisesti väittävät uskovansa, mutta joilta puuttuu vilpitön usko sisimmässään. Tämä ryhmä kuvaa hypokriittejä, joiden sanat eivät vastaa heidän todellista tilaansa. Vaikka nämä hypokriitit esiintyivät Koraanin ilmoituksen aikaan Medinassa, he edustavat tyyppiä, jota löytyy kaikista sukupolvista. Tämä jae avaa tietä yksityiskohtaisemmalle tarkastelulle heidän käyttäytymisestään seuraavissa jakeissa.","translations":{"opas":"Muutamat ihmiset sanovat kyllä: »Me uskomme Jumalaan ja Viimeiseen päivään», eivätkä kuitenkaan usko.","clear":"Ja on olemassa niitä, jotka sanovat: ”Me uskomme Jumalaan ja Viimeiseen Päivään”, mutta he eivät ole ˹todellisia˺ uskovia."}},{"verse":9,"commentary_en":"Expanding on the nature of the hypocrites introduced in Verse 8, this verse describes their attempt to deceive Allah and the believers. However, the verse immediately points out the futility of their efforts, stating that they are only deceiving themselves, even if they are unaware of it. It also subtly implies that Allah is aware of their intentions.","commentary_fi":"Laajentaen jakeessa 8 esitellyn tekopyhien luonnetta, tämä jae kuvaa heidän yritystään pettää Allahia ja uskovaisia. Kuitenkin jae osoittaa välittömästi heidän ponnistelujensa turhuuden, todeten, että he pettävät vain itseään, vaikka he eivät olisi siitä tietoisia. Se viittaa myös hienovaraisesti siihen, että Allah on tietoinen heidän aikeistaan.","arabic":"يُخَادِعُونَ اللَّهَ وَالَّذِينَ آمَنُوا وَمَا يَخْدَعُونَ إِلَّا أَنْفُسَهُمْ وَمَا يَشْعُرُونَ","commentary":"Laajentaen jakeessa 8 esitellyn tekopyhien luonnetta, tämä jae kuvaa heidän yritystään pettää Allahia ja uskovaisia. Kuitenkin jae osoittaa välittömästi heidän ponnistelujensa turhuuden, todeten, että he pettävät vain itseään, vaikka he eivät olisi siitä tietoisia. Se viittaa myös hienovaraisesti siihen, että Allah on tietoinen heidän aikeistaan.","translations":{"opas":"He tahtovat pettää Jumalaa ja niitä, jotka uskovat, mutta he eivät petä ketään muita kuin itsensä, eivätkä käsitä sitä.","clear":"He pyrkivät pettämään Jumalaa ja uskovia, mutta he pettävät vain itseään, mutta he eivät sitä ymmärrä."}},{"verse":10,"commentary_en":"This verse explains the underlying reason for the hypocrites' behavior described in verses 8 and 9: they have a spiritual or moral \"disease\" in their hearts. The verse states that Allah increases this disease, meaning their insincerity and deceptive actions lead to a worsening of their spiritual condition. Because of their falsehood, they face a painful punishment, connecting their character flaws directly to their fate.","commentary_fi":"Tämä jae selittää taustalla olevan syyn jakeissa 8 ja 9 kuvatulle tekopyhien käyttäytymiselle: heillä on henkinen tai moraalinen \"sairaus\" sydämissään. Jae toteaa, että Allah lisää tätä sairautta, mikä tarkoittaa, että heidän epävilpittömyytensä ja petolliset tekonsa johtavat heidän henkisen tilansa pahenemiseen. Heidän valheellisuutensa vuoksi he kohtaavat tuskallisen rangaistuksen, yhdistäen suoraan heidän luonteenpiirteensä heidän kohtaloonsa.","arabic":"فِي قُلُوبِهِمْ مَرَضٌ فَزَادَهُمُ اللَّهُ مَرَضًا ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْذِبُونَ","commentary":"Tämä jae selittää taustalla olevan syyn jakeissa 8 ja 9 kuvatulle tekopyhien käyttäytymiselle: heillä on henkinen tai moraalinen \"sairaus\" sydämissään. Jae toteaa, että Allah lisää tätä sairautta, mikä tarkoittaa, että heidän epävilpittömyytensä ja petolliset tekonsa johtavat heidän henkisen tilansa pahenemiseen. Heidän valheellisuutensa vuoksi he kohtaavat tuskallisen rangaistuksen, yhdistäen suoraan heidän luonteenpiirteensä heidän kohtaloonsa.","translations":{"opas":"Sairaus turmelee heidän sydämensä, ja Jumala pahentaa heidän sairautensa; niin, heitä odottaa tuskallinen rangaistus, koska he ovat valehdelleet.","clear":"Heidän sydämessään on sairaus, ja Jumala ˹vain˺ antaa heidän sairautensa lisääntyä. He kärsivät tuskallisen rangaistuksen valheistaan."}},{"verse":11,"commentary_en":"This verse describes a characteristic of the hypocrites: when asked to cease causing trouble or disruption on Earth, they falsely claim they are working towards peace. This highlights their deceptive nature and their distorted perception of their own actions. The verse introduces the theme of their self-deception and denial, which is further explored in the verses that follow.","commentary_fi":"Tämä jae kuvaa hypokriittien ominaispiirteen. Kun heiltä pyydetään lopettamaan maan häiritseminen tai levottomuuden aiheuttaminen, he väittävät valheellisesti työskentelevänsä rauhan puolesta. Tämä korostaa heidän petollista luonteenpiirrettään ja vääristynyttä käsitystään omista teoistaan. Tämä jae tuo esiin heidän itsepetoksensa ja kieltämisensä teeman, jota käsitellään tarkemmin seuraavissa jakeissa.","arabic":"وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا فِي الْأَرْضِ قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ","commentary":"Tämä jae kuvaa hypokriittien ominaispiirteen. Kun heiltä pyydetään lopettamaan maan häiritseminen tai levottomuuden aiheuttaminen, he väittävät valheellisesti työskentelevänsä rauhan puolesta. Tämä korostaa heidän petollista luonteenpiirrettään ja vääristynyttä käsitystään omista teoistaan. Tämä jae tuo esiin heidän itsepetoksensa ja kieltämisensä teeman, jota käsitellään tarkemmin seuraavissa jakeissa.","translations":{"opas":"Kun heille sanotaan: »Alkää aiheuttako pahennusta maan päällä», he vastaavat: »Mehän vain uudistamme asiat oikeiksi.»","clear":"Kun heille sanotaan: ”Älkää levittäkö turmelusta maahan”, he vastaavat: ”Me olemme vain rauhanrakentajia!”"}},{"verse":12,"commentary_en":"This verse directly refutes the claim made in the previous verse. It states clearly that these individuals are, in fact, the ones who are causing disruption, even though they do not understand or admit this reality about themselves. Their sickness of heart and lack of sincerity towards Allah distorts their view of right and wrong, leading them to believe their harmful actions are beneficial. This continues the depiction of their self-deception and adds the dimension of their being unaware of the true nature and consequences of their deeds.","commentary_fi":"Tämä jae kumoaa suoraan edellisessä jakeessa esitetyn väitteen. Se toteaa selvästi, että nämä henkilöt ovat itse asiassa niitä, jotka aiheuttavat häiriötä, vaikka he eivät ymmärrä tai tunnusta tätä todellisuutta itsestään. Heidän sydämensä sairaus ja epävilpittömyys Allahia kohtaan vääristävät heidän näkemystään oikeasta ja väärästä, mikä johtaa heitä uskomaan, että heidän vahingolliset tekonsa ovat hyödyllisiä. Tämä jatkaa heidän itsepetoksensa kuvausta ja lisää ulottuvuuden siitä, että he eivät ole tietoisia tekojensa todellisesta luonteesta ja seurauksista.","arabic":"أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ وَلَٰكِنْ لَا يَشْعُرُونَ","commentary":"Tämä jae kumoaa suoraan edellisessä jakeessa esitetyn väitteen. Se toteaa selvästi, että nämä henkilöt ovat itse asiassa niitä, jotka aiheuttavat häiriötä, vaikka he eivät ymmärrä tai tunnusta tätä todellisuutta itsestään. Heidän sydämensä sairaus ja epävilpittömyys Allahia kohtaan vääristävät heidän näkemystään oikeasta ja väärästä, mikä johtaa heitä uskomaan, että heidän vahingolliset tekonsa ovat hyödyllisiä. Tämä jatkaa heidän itsepetoksensa kuvausta ja lisää ulottuvuuden siitä, että he eivät ole tietoisia tekojensa todellisesta luonteesta ja seurauksista.","translations":{"opas":"ivätkö juuri sellaiset tosiaan ole niitä, joista paha paisuu? Mutta he eivät sitä tajua.","clear":"Totisesti, juuri he ovat turmelijoita, mutta he eivät sitä ymmärrä."}},{"verse":13,"commentary_en":"This verse reveals another trait of these individuals: their arrogance and contempt for sincere believers. When asked to have faith in the way others have sincerely believed, they dismiss the believers as fools. The Qur'an directly responds by stating that it is *they* who are truly the fools, precisely because they lack the awareness or insight to recognize their own misguided state. This links to the previous verses by showing how their distorted perception extends to judging others and their own understanding.","commentary_fi":"Tämä jae paljastaa toisen näiden yksilöiden piirteen: heidän ylimielisyytensä ja halveksuntansa vilpittömiä uskovia kohtaan. Kun heitä pyydetään uskomaan samalla tavalla kuin muut ovat vilpittömästi uskoneet, he torjuvat uskovat narreina. Koraani vastaa suoraan toteamalla, että juuri *he* ovat todella narreja, juuri siksi, että heiltä puuttuu tietoisuus tai oivallus tunnistaa oma harhaantunut tilansa. Tämä liittyy edellisiin jakeisiin osoittamalla, kuinka heidän vääristynyt käsityksensä ulottuu muiden ja oman ymmärryksensä tuomitsemiseen.","arabic":"وَإِذَا قِيلَ لَهُمْ آمِنُوا كَمَا آمَنَ النَّاسُ قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ ۗ أَلَا إِنَّهُمْ هُمُ السُّفَهَاءُ وَلَٰكِنْ لَا يَعْلَمُونَ","commentary":"Tämä jae paljastaa toisen näiden yksilöiden piirteen: heidän ylimielisyytensä ja halveksuntansa vilpittömiä uskovia kohtaan. Kun heitä pyydetään uskomaan samalla tavalla kuin muut ovat vilpittömästi uskoneet, he torjuvat uskovat narreina. Koraani vastaa suoraan toteamalla, että juuri *he* ovat todella narreja, juuri siksi, että heiltä puuttuu tietoisuus tai oivallus tunnistaa oma harhaantunut tilansa. Tämä liittyy edellisiin jakeisiin osoittamalla, kuinka heidän vääristynyt käsityksensä ulottuu muiden ja oman ymmärryksensä tuomitsemiseen.","translations":{"opas":"Ja kun heille sanotaan: »Uskokaa kuten nuo ihmiset uskovat», he vastaavat: »Onko meidän uskottava kuten hullut uskovat?» Mutta eivätkö todellisuudessa juuri he itse ole hulluja? Vaan sitäkään he eivät älyä.","clear":"Ja kun heille sanotaan: ”Uskokaa kuten muut uskovat”, he vastaavat: ”Uskommeko me kuten tyhmät uskovat?” Totisesti, juuri he ovat tyhmiä, mutta he eivät tiedä."}},{"verse":14,"commentary_en":"This verse exposes the double-faced behavior of these hypocritical individuals. When they encounter the sincere believers, they falsely claim to have faith, seeking acceptance and perhaps wanting to cause trouble from within the community. However, when they are in private with their close companions, described in the verse as \"evil ones,\" they reveal their true stance, affirming their loyalty to their companions and admitting their outward profession of faith was merely mockery or pretense. This illustrates their lack of sincerity and their cunning nature. The description of their companions as \"evil ones\" reflects the perspective that these allies encouraged or shared their negative behavior.","commentary_fi":"Tämä jae paljastaa näiden tekopyhien yksilöiden kaksinaamaisen käytöksen. Kun he tapaavat vilpittömiä uskovia, he väittävät valheellisesti uskovansa, tavoitellen hyväksyntää ja ehkä haluten aiheuttaa ongelmia yhteisön sisältä. Kuitenkin, kun he ovat yksin lähimpien kumppaneidensa kanssa, joita jakeessa kuvataan \"pahaksi\", he paljastavat todellisen kantansa, vahvistaen uskollisuutensa kumppaneilleen ja myöntäen, että heidän ulkoinen uskon julistuksensa oli pelkkää pilkkaa tai teeskentelyä. Tämä osoittaa heidän epävilpittömyytensä ja ovelan luonteensa. Heidän kumppaneidensa kuvaus \"pahaksi\" heijastaa näkemystä, että nämä liittolaiset kannustivat tai jakoivat heidän negatiivista käytöstään.","arabic":"وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَوْا إِلَىٰ شَيَاطِينِهِمْ قَالُوا إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِئُونَ","commentary":"Tämä jae paljastaa näiden tekopyhien yksilöiden kaksinaamaisen käytöksen. Kun he tapaavat vilpittömiä uskovia, he väittävät valheellisesti uskovansa, tavoitellen hyväksyntää ja ehkä haluten aiheuttaa ongelmia yhteisön sisältä. Kuitenkin, kun he ovat yksin lähimpien kumppaneidensa kanssa, joita jakeessa kuvataan \"pahaksi\", he paljastavat todellisen kantansa, vahvistaen uskollisuutensa kumppaneilleen ja myöntäen, että heidän ulkoinen uskon julistuksensa oli pelkkää pilkkaa tai teeskentelyä. Tämä osoittaa heidän epävilpittömyytensä ja ovelan luonteensa. Heidän kumppaneidensa kuvaus \"pahaksi\" heijastaa näkemystä, että nämä liittolaiset kannustivat tai jakoivat heidän negatiivista käytöstään.","translations":{"opas":"Kohdatessaan uskovaisia he sanovat: »Me uskomme», mutta kun he erkanevat taas saatanainsa pariin, he selittävät: »Tietysti olemme teikäläisiä, me vain teimme pilkkaa.»","clear":"Kun he tapaavat uskovia, he sanovat: ”Me uskomme.” Mutta ollessaan yksin pahan kumppaneidensa kanssa, he sanovat: ”Me olemme ehdottomasti teidän kanssanne; me vain pilkkasimme.”"}},{"verse":15,"commentary_en":"This verse describes Allah's response to the deceptive and mocking behavior of the hypocrites. It states that Allah will turn their mockery back upon them, essentially allowing their own schemes and insincerity to become their undoing. He gives them temporary leeway in their wrongdoing, but this only leads them further into misguidance, causing them to stumble blindly and lose direction. This verse serves as a stern warning about the consequences of hypocrisy and highlights Allah's power over their affairs, contrasting with their belief in their own cleverness.","commentary_fi":"Tämä jae kuvaa Allahin vastausta tekopyhien petolliseen ja pilkkaavaan käytökseen. Se toteaa, että Allah kääntää heidän pilkkansa takaisin heihin, pohjimmiltaan antaen heidän omien juoniensa ja epävilpittömyytensä johtaa heidän tuhoonsa. Hän antaa heille tilapäistä liikkumavaraa väärinteoissaan, mutta tämä johtaa heidät vain syvemmälle harhaan, saaden heidät vaeltamaan sokeina ja menettämään suuntansa. Tämä jae toimii ankarana varoituksena tekopyhyyden seurauksista ja korostaa Allahin valtaa heidän asioidensa yli, vastakohtana heidän uskolleen omasta oveluudestaan.","arabic":"اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ","commentary":"Tämä jae kuvaa Allahin vastausta tekopyhien petolliseen ja pilkkaavaan käytökseen. Se toteaa, että Allah kääntää heidän pilkkansa takaisin heihin, pohjimmiltaan antaen heidän omien juoniensa ja epävilpittömyytensä johtaa heidän tuhoonsa. Hän antaa heille tilapäistä liikkumavaraa väärinteoissaan, mutta tämä johtaa heidät vain syvemmälle harhaan, saaden heidät vaeltamaan sokeina ja menettämään suuntansa. Tämä jae toimii ankarana varoituksena tekopyhyyden seurauksista ja korostaa Allahin valtaa heidän asioidensa yli, vastakohtana heidän uskolleen omasta oveluudestaan.","translations":{"opas":"Mutta Jumala tekeekin pilkkaa heistä itsestään, jättää heidät yltymään pahuudessaan ja vaeltamaan sokeasti yhä syvempään häpeään.","clear":"Jumala heittää heidän pilkkansa takaisin heille, jättäen heidät jatkamaan sokeasti vaeltamista uhmassaan."}},{"verse":16,"commentary_en":"This verse provides a summary of the state of the hypocrites described in the preceding verses. It uses the metaphor of a transaction, saying they have exchanged true guidance for misguidance or error. However, this trade has brought them no benefit; their endeavor is described as \"profitless,\" and they have completely lost their way. This verse underscores the ultimate failure of their path, linking their deceptive actions and arrogance to a fundamental loss of direction in life.","commentary_fi":"Tämä jae tarjoaa yhteenvedon edellisissä jakeissa kuvattujen tekopyhien tilasta. Se käyttää vertauskuvaa kaupankäynnistä sanoen, että he ovat vaihtaneet todellisen opastuksen harhaantuneisuuteen tai virheeseen. Tämä kauppa ei kuitenkaan ole tuonut heille mitään hyötyä; heidän yritystään kuvataan \"voitottomaksi\", ja he ovat täysin menettäneet suuntansa. Tämä jae korostaa heidän polkunsa lopullista epäonnistumista, liittäen heidän petolliset tekonsa ja ylimielisyytensä perustavanlaatuiseen suunnan menettämiseen elämässä.","arabic":"أُولَٰئِكَ الَّذِينَ اشْتَرَوُا الضَّلَالَةَ بِالْهُدَىٰ فَمَا رَبِحَتْ تِجَارَتُهُمْ وَمَا كَانُوا مُهْتَدِينَ","commentary":"Tämä jae tarjoaa yhteenvedon edellisissä jakeissa kuvattujen tekopyhien tilasta. Se käyttää vertauskuvaa kaupankäynnistä sanoen, että he ovat vaihtaneet todellisen opastuksen harhaantuneisuuteen tai virheeseen. Tämä kauppa ei kuitenkaan ole tuonut heille mitään hyötyä; heidän yritystään kuvataan \"voitottomaksi\", ja he ovat täysin menettäneet suuntansa. Tämä jae korostaa heidän polkunsa lopullista epäonnistumista, liittäen heidän petolliset tekonsa ja ylimielisyytensä perustavanlaatuiseen suunnan menettämiseen elämässä.","translations":{"opas":"He ovat niitä, jotka oikean johdatuksen vaihtavat harhatiehen, eikä se vaihtokauppa ole heille voittoa tuottava, vaan he jäävät kokonaan ilman Jumalan Opastusta.","clear":"He ovat niitä, jotka vaihtavat johdatuksen harhaanjohtamiseen. Mutta tämä kauppa on hyödytön, eivätkä he ole ˹oikein˺ johdatettuja."}},{"verse":17,"commentary_en":"This verse presents the first of two parables used to illustrate the condition of the hypocrites. It compares them to someone who lights a fire: for a moment, the fire provides light, enabling them to see—but then Allah takes the light away, leaving them in total darkness, unable to perceive anything. This reflects the situation of the hypocrites: they may have had some exposure to the truth or guidance (kindling the fire), and perhaps even understood it briefly (when it lit up around them). However, because they rejected or turned away from it, Allah removed that light, leaving them lost in darkness. This parable underscores the consequences of  rejecting guidance after having had the opportunity to grasp it.","commentary_fi":"Tämä jae esittää ensimmäisen kahdesta vertauksesta, joita käytetään kuvaamaan tekopyhien tilaa. Heitä verrataan henkilöön, joka sytyttää tulen: hetken ajan tuli valaisee ympäristön ja antaa mahdollisuuden nähdä, mutta sitten Allah ottaa valon pois, jättäen heidät täydelliseen pimeyteen, kykenemättöminä näkemään mitään. Tämä heijastaa tekopyhien tilannetta: he ovat saattaneet saada jonkinlaista kosketusta totuuteen tai johdatukseen (kuin tulen sytyttäminen), ja ehkä jopa ymmärtäneet sitä hetken ajan (kun valo ympäröi heitä). Kuitenkin, koska he hylkäsivät sen tai kääntyivät siitä pois, Allah otti valon pois ja jätti heidät pimeyteen. Tämä vertaus korostaa sitä seurausta, joka syntyy tietoisesta johdatuksen hylkäämisestä sen jälkeen, kun heillä oli tilaisuus nähdä totuus.","arabic":"مَثَلُهُمْ كَمَثَلِ الَّذِي اسْتَوْقَدَ نَارًا فَلَمَّا أَضَاءَتْ مَا حَوْلَهُ ذَهَبَ اللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِي ظُلُمَاتٍ لَا يُبْصِرُونَ","commentary":"Tämä jae esittää ensimmäisen kahdesta vertauksesta, joita käytetään kuvaamaan tekopyhien tilaa. Heitä verrataan henkilöön, joka sytyttää tulen: hetken ajan tuli valaisee ympäristön ja antaa mahdollisuuden nähdä, mutta sitten Allah ottaa valon pois, jättäen heidät täydelliseen pimeyteen, kykenemättöminä näkemään mitään. Tämä heijastaa tekopyhien tilannetta: he ovat saattaneet saada jonkinlaista kosketusta totuuteen tai johdatukseen (kuin tulen sytyttäminen), ja ehkä jopa ymmärtäneet sitä hetken ajan (kun valo ympäröi heitä). Kuitenkin, koska he hylkäsivät sen tai kääntyivät siitä pois, Allah otti valon pois ja jätti heidät pimeyteen. Tämä vertaus korostaa sitä seurausta, joka syntyy tietoisesta johdatuksen hylkäämisestä sen jälkeen, kun heillä oli tilaisuus nähdä totuus.","translations":{"opas":"Heidän laitansa on kuin niiden, jotka sytyttävät itselleen tulen, mutta kun se on valaissut mitä heidän ympärillään on, tempaa Jumala pois valon ja jättää kaikki pimeyteen, niin etteivät he voi nähdä; Hän jättää heidät","clear":"Heidän esimerkkinsä on kuin sellaisen, joka sytyttää tulen, mutta kun se valaisee heidän ympärillään, Allah ottaa pois heidän valonsa jättäen heidät täydelliseen pimeyteen – kykenemättöminä näkemään."}},{"verse":18,"commentary_en":"Following the first parable, this verse describes the state of the hypocrites left in darkness. Having rejected the light, they are portrayed as deaf to the truth, dumb (unable or unwilling to speak it), and blind to guidance. This suggests that their rejection has led them to a condition in which they are no longer capable of finding their way back to the right path. Their senses—once potential channels for receiving guidance—are effectively shut off. This verse reinforces the hopelessness of their condition after having turned away from the light.","commentary_fi":"Ensimmäisen vertauksen jälkeen tämä jae kuvaa tekopyhien tilaa, kun heidät on jätetty pimeyteen. Hylättyään valon heidät esitetään kuuroina totuudelle, mykkinä (kykenemättöminä tai haluttomina puhumaan sitä) ja sokeina johdatukselle. Tämä viittaa siihen, että heidän torjuntansa on johtanut heidät tilaan, jossa he eivät enää kykene palaamaan oikealle tielle. Heidän aistinsa – jotka olisivat voineet toimia johdatuksen väylinä – ovat käytännössä sulkeutuneet. Tämä jae korostaa heidän toivottomaa tilaansa sen jälkeen, kun he ovat kääntyneet pois valosta.","arabic":"صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ","commentary":"Ensimmäisen vertauksen jälkeen tämä jae kuvaa tekopyhien tilaa, kun heidät on jätetty pimeyteen. Hylättyään valon heidät esitetään kuuroina totuudelle, mykkinä (kykenemättöminä tai haluttomina puhumaan sitä) ja sokeina johdatukselle. Tämä viittaa siihen, että heidän torjuntansa on johtanut heidät tilaan, jossa he eivät enää kykene palaamaan oikealle tielle. Heidän aistinsa – jotka olisivat voineet toimia johdatuksen väylinä – ovat käytännössä sulkeutuneet. Tämä jae korostaa heidän toivottomaa tilaansa sen jälkeen, kun he ovat kääntyneet pois valosta.","translations":{"opas":"mykiksi, kuuroiksi ja sokeiksi, niin etteivät he voi palata.","clear":"He ovat ˹tahallaan˺ kuuroja, mykkiä ja sokeita, joten he eivät koskaan palaa ˹oikealle polulle˺."}},{"verse":19,"commentary_en":"This verse presents a second parable to illustrate the condition of the hypocrites. It compares their situation to being caught in a severe storm: a dark cloud with heavy rain, thunder, and lightning. The storm represents the trials, challenges, and perhaps moments of truth or warnings that come their way. The darkness, thunder, and lightning evoke fear and confusion. They react by trying to block out the terrifying sounds of thunder, fearful for their lives. This depicts their panic and desperate attempts to avoid the overwhelming reality of their situation and the consequences of their disbelief. The statement \"But Allah is ever round the rejecters of Faith!\" serves as a reminder that they cannot escape Allah's power and ultimate judgment, emphasizing that He is fully aware of and in control of their situation, even amidst their turmoil.","commentary_fi":"Tämä jae esittää toisen vertauskuvan havainnollistamaan tekopyhien tilaa. Se vertaa heidän tilannettaan joutumiseen vakavaan myrskyyn: tummaan pilveen, jossa on rankkasadetta, ukkosta ja salamaa. Myrsky edustaa koettelemuksia, haasteita ja ehkä hetkiä totuudesta tai varoituksia, jotka kohtaavat heitä. Pimeys, ukkonen ja salama herättävät pelkoa ja hämmennystä. He reagoivat yrittämällä tukkia korvansa pelottavilta ukkosääniltä, peläten henkeään. Tämä kuvaa heidän paniikkiaan ja epätoivoisia yrityksiään välttää tilanteensa ylivoimaista todellisuutta ja epäuskon seurauksia. Lausunto \"Mutta Allah on aina uskosta kieltäytyjien ympärillä!\" toimii muistutuksena siitä, etteivät he voi paeta Allahin valtaa ja lopullista tuomiota, korostaen, että Hän on täysin tietoinen heidän tilanteestaan ja hallitsee sitä, jopa heidän myrskynsä keskellä.","arabic":"أَوْ كَصَيِّبٍ مِنَ السَّمَاءِ فِيهِ ظُلُمَاتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَابِعَهُمْ فِي آذَانِهِمْ مِنَ الصَّوَاعِقِ حَذَرَ الْمَوْتِ ۚ وَاللَّهُ مُحِيطٌ بِالْكَافِرِينَ","commentary":"Tämä jae esittää toisen vertauskuvan havainnollistamaan tekopyhien tilaa. Se vertaa heidän tilannettaan joutumiseen vakavaan myrskyyn: tummaan pilveen, jossa on rankkasadetta, ukkosta ja salamaa. Myrsky edustaa koettelemuksia, haasteita ja ehkä hetkiä totuudesta tai varoituksia, jotka kohtaavat heitä. Pimeys, ukkonen ja salama herättävät pelkoa ja hämmennystä. He reagoivat yrittämällä tukkia korvansa pelottavilta ukkosääniltä, peläten henkeään. Tämä kuvaa heidän paniikkiaan ja epätoivoisia yrityksiään välttää tilanteensa ylivoimaista todellisuutta ja epäuskon seurauksia. Lausunto \"Mutta Allah on aina uskosta kieltäytyjien ympärillä!\" toimii muistutuksena siitä, etteivät he voi paeta Allahin valtaa ja lopullista tuomiota, korostaen, että Hän on täysin tietoinen heidän tilanteestaan ja hallitsee sitä, jopa heidän myrskynsä keskellä.","translations":{"opas":"Tai kuten on ukkossateen yllättäessä, joka tuo mukanaan pimeyden, jyrinän ja salaman; he tukkivat sormin korvansa ukkosen jylinältä ja pelkäävät saavansa kuoliniskun salamoista - Jumalalla on uskottomat vallassaan - ja","clear":"Tai ˹ne, jotka ovat joutuneet˺ taivaalta laskeutuvaan myrskyyn, jossa on pimeyttä, ukkosta ja salamoita. He painavat sormensa korviinsa jokaisen ukkosenjyrähdyksen kohdalla kuolemanpelosta. Ja Allah ympäröi epäuskoiset ˹voimallaan˺."}},{"verse":20,"commentary_en":"This verse continues the second parable, detailing the hypocrites' erratic behavior during the storm. The lightning flashes intensely, almost blinding them, yet provides fleeting moments of light. During these brief moments, they manage to move forward tentatively, but when the darkness returns between flashes, they stop, paralyzed by fear and uncertainty. This illustrates their unstable and inconsistent approach; they only react or move towards guidance when it's immediately apparent and seems advantageous, but freeze or turn away when faced with difficulty or uncertainty. The verse concludes by stating Allah's absolute power, noting that if He willed, He could permanently remove their ability to hear or see, reinforcing the idea that their faculties and their fate are entirely within His control.","commentary_fi":"Tämä jae jatkaa toista vertauskuvaa, yksityiskohtaisesti kuvaten tekopyhien epävakaata käytöstä myrskyn aikana. Salama välähtää voimakkaasti, melkein sokaisi heidät, mutta tarjoaa ohikiitäviä valon hetkiä. Näinä lyhyinä hetkinä he onnistuvat liikkumaan eteenpäin varovaisesti, mutta kun pimeys palaa välähdysten välillä, he pysähtyvät, pelon ja epävarmuuden lamaannuttamina. Tämä kuvaa heidän epävakaata ja epäjohdonmukaista lähestymistapaansa; he reagoivat tai liikkuvat opastusta kohti vain silloin, kun se on välittömästi ilmeistä ja tuntuu edulliselta, mutta jähmettyvät tai kääntyvät pois kohdatessaan vaikeuksia tai epävarmuutta. Jae päättyy toteamalla Allahin ehdottoman vallan, huomauttaen, että jos Hän tahtoisi, Hän voisi pysyvästi poistaa heidän kykynsä kuulla tai nähdä, mikä vahvistaa ajatusta siitä, että heidän kykynsä ja kohtalonsa ovat täysin Hänen hallinnassaan.","arabic":"يَكَادُ الْبَرْقُ يَخْطَفُ أَبْصَارَهُمْ ۖ كُلَّمَا أَضَاءَ لَهُمْ مَشَوْا فِيهِ وَإِذَا أَظْلَمَ عَلَيْهِمْ قَامُوا ۚ وَلَوْ شَاءَ اللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَارِهِمْ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","commentary":"Tämä jae jatkaa toista vertauskuvaa, yksityiskohtaisesti kuvaten tekopyhien epävakaata käytöstä myrskyn aikana. Salama välähtää voimakkaasti, melkein sokaisi heidät, mutta tarjoaa ohikiitäviä valon hetkiä. Näinä lyhyinä hetkinä he onnistuvat liikkumaan eteenpäin varovaisesti, mutta kun pimeys palaa välähdysten välillä, he pysähtyvät, pelon ja epävarmuuden lamaannuttamina. Tämä kuvaa heidän epävakaata ja epäjohdonmukaista lähestymistapaansa; he reagoivat tai liikkuvat opastusta kohti vain silloin, kun se on välittömästi ilmeistä ja tuntuu edulliselta, mutta jähmettyvät tai kääntyvät pois kohdatessaan vaikeuksia tai epävarmuutta. Jae päättyy toteamalla Allahin ehdottoman vallan, huomauttaen, että jos Hän tahtoisi, Hän voisi pysyvästi poistaa heidän kykynsä kuulla tai nähdä, mikä vahvistaa ajatusta siitä, että heidän kykynsä ja kohtalonsa ovat täysin Hänen hallinnassaan.","translations":{"opas":"salama on riistämäisillään heiltä näön. Niin usein kuin se välähtää, liikkuvat he sen valossa, mutta kun pimeys taas lankeaa heidän ylitsensä, pysähtyvät he. Jos Jumala tahtoisi, voisi Hän ottaa heiltä kokonaan kuulon ja näön; katso, Jumala on totisesti kaikkivaltias.","clear":"On kuin salama olisi anastamassa heidän näkönsä. Aina kun salama iskee, he kulkevat sen valossa, mutta kun pimeys peittää heidät, he seisovat paikallaan. Jos Allah olisi tahtonut, Hän olisi voinut ottaa pois heidän kuulonsa ja näkönsä. Varmasti Allah on kaikkivoipa kaikessa."}},{"verse":21,"commentary_en":"This verse begins a universal call to all people. It asks everyone to worship Allah, their Creator and Sustainer. We are reminded that Allah created not only us but also all the generations before us. The purpose of this worship, according to this verse, is so that we may develop mindfulness of Allah and live righteously. It sets the stage by establishing Allah's fundamental relationship with humanity as the Creator.","commentary_fi":"Tämä jae aloittaa yleisen kutsun kaikille ihmisille. Se pyytää jokaista palvomaan Allahia, heidän Luojaansa ja Ylläpitäjäänsä. Meille muistutetaan, että Allah loi paitsi meidät myös kaikki sukupolvet ennen meitä. Tämän palvonnan tarkoitus, tämän jakeen mukaan, on se, että voimme kehittää jumalanpelkoa ja elää vanhurskaasti. Se asettaa näyttämön vakiinnuttamalla Allahin perustavanlaatuisen suhteen ihmiskuntaan Luojana.","arabic":"يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","commentary":"Tämä jae aloittaa yleisen kutsun kaikille ihmisille. Se pyytää jokaista palvomaan Allahia, heidän Luojaansa ja Ylläpitäjäänsä. Meille muistutetaan, että Allah loi paitsi meidät myös kaikki sukupolvet ennen meitä. Tämän palvonnan tarkoitus, tämän jakeen mukaan, on se, että voimme kehittää jumalanpelkoa ja elää vanhurskaasti. Se asettaa näyttämön vakiinnuttamalla Allahin perustavanlaatuisen suhteen ihmiskuntaan Luojana.","translations":{"opas":"Oi, ihmiset, palvelkaa Herraanne, joka on luonut sekä teidät että ne, jotka ovat eläneet ennen teitä, jotta pelastuisitte pahasta!","clear":"Oi ihmiskunta! Palvokaa Herraanne, joka loi teidät ja ne, jotka olivat ennen teitä, jotta teistä tulisi tietoisia ˹Hänestä˺."}},{"verse":22,"commentary_en":"Following the call to worship the Creator, this verse provides reasons why Allah alone deserves worship. It highlights some of Allah's immense blessings: making the earth a comfortable and habitable place like a resting-place for us, and making the sky above us like a protective and orderly roof. It also mentions the sending down of rain from the sky, which brings forth fruits and sustenance for us. These are presented as clear signs of Allah's power and provision. Because we know these facts – that Allah is the Creator and Provider of all these things – the verse concludes with a directive not to associate partners or equals with Him in worship. This verse emphasizes recognizing Allah's unique role in creation and provision as the basis for exclusive worship.","commentary_fi":"Seuraten kutsua palvoa Luojaa, tämä jae antaa syitä siihen, miksi ainoastaan Allah ansaitsee palvonnan. Se korostaa joitakin Allahin valtavia siunauksia: tekemällä maasta mukavan ja asuttavan paikan, kuten lepopaikan meille, ja tekemällä taivaasta yläpuolellamme suojaavan ja järjestetyn katon. Se mainitsee myös sateen laskeutumisen taivaasta, joka tuo esiin hedelmiä ja ravintoa meille. Nämä esitetään selvinä merkkeinä Allahin voimasta ja huolenpidosta. Koska tunnemme nämä tosiasiat – että Allah on kaiken tämän Luoja ja Huolenpitäjä – jae päättyy ohjeeseen olla asettamatta vertaisia tai kumppaneita Hänen rinnalleen palvonnassa. Tämä jae korostaa Allahin ainutlaatuisen roolin tunnistamista luomisessa ja huolenpidossa yksinomaisen palvonnan perustana.","arabic":"الَّذِي جَعَلَ لَكُمُ الْأَرْضَ فِرَاشًا وَالسَّمَاءَ بِنَاءً وَأَنْزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَكُمْ ۖ فَلَا تَجْعَلُوا لِلَّهِ أَنْدَادًا وَأَنْتُمْ تَعْلَمُونَ","commentary":"Seuraten kutsua palvoa Luojaa, tämä jae antaa syitä siihen, miksi ainoastaan Allah ansaitsee palvonnan. Se korostaa joitakin Allahin valtavia siunauksia: tekemällä maasta mukavan ja asuttavan paikan, kuten lepopaikan meille, ja tekemällä taivaasta yläpuolellamme suojaavan ja järjestetyn katon. Se mainitsee myös sateen laskeutumisen taivaasta, joka tuo esiin hedelmiä ja ravintoa meille. Nämä esitetään selvinä merkkeinä Allahin voimasta ja huolenpidosta. Koska tunnemme nämä tosiasiat – että Allah on kaiken tämän Luoja ja Huolenpitäjä – jae päättyy ohjeeseen olla asettamatta vertaisia tai kumppaneita Hänen rinnalleen palvonnassa. Tämä jae korostaa Allahin ainutlaatuisen roolin tunnistamista luomisessa ja huolenpidossa yksinomaisen palvonnan perustana.","translations":{"opas":"Jumala on tehnyt maan teille lepopaikaksi ja kaartanut taivaan ylitsenne, Hän antaa vettä taivaasta ja sillä kasvattaa hedelmiä ravinnoksenne. Älkää siis asettako Jumalan rinnalle muita Hänen vertaisikseen vastoin parempaa tietoanne.","clear":"˹Hän on Se˺, joka on tehnyt maasta asuinpaikan teille ja taivaan katokseksi; ja lähettää taivaasta sadetta saaden hedelmiä kasvamaan ravinnoksi teille. Älkää siis tietoisesti asettako Allahille vertaisia ˹palvonnassa˺."}},{"verse":23,"commentary_en":"Transitioning from the call to worship based on creation, this verse addresses those who have doubts about the divine origin of the Qur’an, which was revealed to Prophet Muhammad. It presents a challenge: if you doubt that this is from Allah, then produce a single chapter (Sura) that is comparable to it in quality and nature. You are invited to seek help from anyone or anything you wish, other than Allah, to meet this challenge. This is presented as a proof of the Qur’an's unique nature and source.","commentary_fi":"Siirtyen luomiseen perustuvasta palvonnan kutsusta, tämä jae osoittaa niille, jotka epäilevät Koraanin jumalallista alkuperää, joka ilmoitettiin Profeetta Muhammadille. Se esittää haasteen: jos epäilette, että tämä on Allahilta, tuokaa esiin yksi luku (Suura), joka on laadultaan ja luonteeltaan siihen verrattavissa. Teidät kutsutaan pyytämään apua keneltä tai miltä tahansa haluatte, paitsi Allahilta, vastatakseen tähän haasteeseen. Tämä esitetään todisteena Koraanin ainutlaatuisesta luonteesta ja lähteestä.","arabic":"وَإِنْ كُنْتُمْ فِي رَيْبٍ مِمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا بِسُورَةٍ مِنْ مِثْلِهِ وَادْعُوا شُهَدَاءَكُمْ مِنْ دُونِ اللَّهِ إِنْ كُنْتُمْ صَادِقِينَ","commentary":"Siirtyen luomiseen perustuvasta palvonnan kutsusta, tämä jae osoittaa niille, jotka epäilevät Koraanin jumalallista alkuperää, joka ilmoitettiin Profeetta Muhammadille. Se esittää haasteen: jos epäilette, että tämä on Allahilta, tuokaa esiin yksi luku (Suura), joka on laadultaan ja luonteeltaan siihen verrattavissa. Teidät kutsutaan pyytämään apua keneltä tai miltä tahansa haluatte, paitsi Allahilta, vastatakseen tähän haasteeseen. Tämä esitetään todisteena Koraanin ainutlaatuisesta luonteesta ja lähteestä.","translations":{"opas":"jos epäilette sitä, mitä Me ilmoitamme palvelijallemme (Muhammedille), niin aikaansaakaa tämän kaltainen kirjoitus ja kutsukaa Jumalan vertaisia todistajia, jos tahdotte pysyä totuudessa;","clear":"Ja jos olette epävarmoja siitä, mitä olemme palvelijallemme ilmoittanut, niin tuottakaa sen kaltainen suura ja kutsukaa avuksi muita kuin Allahia, jos se, mitä sanotte, on totta."}},{"verse":24,"commentary_en":"This verse directly follows the challenge in the previous one. It asserts with certainty that the challenge (to produce a chapter like the Qur'an) cannot be met. It then presents a warning of the consequences for those who reject the truth after this evidence and challenge have been presented. It describes a fearsome punishment in the Fire, whose fuel includes people and stones, indicating its intensity. This fire is stated to be prepared for those who reject faith. This verse serves as a stern reminder of accountability for rejecting the divine message.","commentary_fi":"Tämä jae seuraa suoraan edellisen jakeen haastetta. Se vahvistaa varmuudella, että haasteeseen (tuottaa Koraanin kaltainen luku) ei voida vastata. Sitten se esittää varoituksen seurauksista niille, jotka hylkäävät totuuden sen jälkeen, kun tämä todiste ja haaste on esitetty. Se kuvaa pelottavaa rangaistusta Tulessa, jonka polttoainetta ovat ihmiset ja kivet, osoittaen sen voimakkuuden. Tämän Tulen sanotaan olevan valmistettu niitä varten, jotka hylkäävät uskon. Tämä jae toimii ankarana muistutuksena vastuullisuudesta jumalallisen sanoman hylkäämisestä.","arabic":"فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا فَاتَّقُوا النَّارَ الَّتِي وَقُودُهَا النَّاسُ وَالْحِجَارَةُ ۖ أُعِدَّتْ لِلْكَافِرِينَ","commentary":"Tämä jae seuraa suoraan edellisen jakeen haastetta. Se vahvistaa varmuudella, että haasteeseen (tuottaa Koraanin kaltainen luku) ei voida vastata. Sitten se esittää varoituksen seurauksista niille, jotka hylkäävät totuuden sen jälkeen, kun tämä todiste ja haaste on esitetty. Se kuvaa pelottavaa rangaistusta Tulessa, jonka polttoainetta ovat ihmiset ja kivet, osoittaen sen voimakkuuden. Tämän Tulen sanotaan olevan valmistettu niitä varten, jotka hylkäävät uskon. Tämä jae toimii ankarana muistutuksena vastuullisuudesta jumalallisen sanoman hylkäämisestä.","translations":{"opas":"mutta jollette tee niin - ja sitä ette koskaan voi tehdä silloin kavahtakaa tulta, joka on valmistettu uskottomille ja jonka polttoaineena ovat ihmiset ja kivet.","clear":"Mutta jos ette pysty siihen – ettekä koskaan pysty siihen – niin pelätkää tulta, jonka polttoaineena ovat ihmiset ja kivet, joka on valmistettu epäuskoisille."}},{"verse":25,"commentary_en":"In sharp contrast to the warning of punishment for rejecters in the previous verse, this verse offers joyful news for those who believe and live righteously. It describes their reward as Gardens in Paradise, flowing with rivers. When they are given fruits there, they recognize a familiarity, saying it is like what they received before, though the reality is different. This hints at a delightful experience where things appear similar yet are uniquely pleasurable. The verse also mentions having pure companions and dwelling in this state eternally. It paints a picture of ultimate peace, joy, and permanence for the believers.","commentary_fi":"Jyrkässä ristiriidassa edellisen jakeen varoituksen kanssa, tämä jae tarjoaa iloista sanomaa niille, jotka uskovat ja elävät vanhurskaasti. Se kuvaa heidän palkintonaan Paratiisin Puutarhat, joiden lomitse virtaavat joet. Kun heille annetaan hedelmiä siellä, he tunnistavat tuttuuden, sanoen sen olevan kuin mitä he saivat aiemmin, vaikka todellisuus onkin erilainen. Tämä antaa vihjeen ihastuttavasta kokemuksesta, jossa asiat näyttävät samankaltaisilta mutta ovat ainutlaatuisen miellyttäviä. Jae mainitsee myös puhtaiden kumppaneiden saamisen ja asumisen tässä tilassa ikuisesti. Se maalaa kuvan äärimmäisestä rauhasta, ilosta ja pysyvyydestä uskoville.","arabic":"وَبَشِّرِ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أَنَّ لَهُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ۖ كُلَّمَا رُزِقُوا مِنْهَا مِنْ ثَمَرَةٍ رِزْقًا ۙ قَالُوا هَٰذَا الَّذِي رُزِقْنَا مِنْ قَبْلُ ۖ وَأُتُوا بِهِ مُتَشَابِهًا ۖ وَلَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ ۖ وَهُمْ فِيهَا خَالِدُونَ","commentary":"Jyrkässä ristiriidassa edellisen jakeen varoituksen kanssa, tämä jae tarjoaa iloista sanomaa niille, jotka uskovat ja elävät vanhurskaasti. Se kuvaa heidän palkintonaan Paratiisin Puutarhat, joiden lomitse virtaavat joet. Kun heille annetaan hedelmiä siellä, he tunnistavat tuttuuden, sanoen sen olevan kuin mitä he saivat aiemmin, vaikka todellisuus onkin erilainen. Tämä antaa vihjeen ihastuttavasta kokemuksesta, jossa asiat näyttävät samankaltaisilta mutta ovat ainutlaatuisen miellyttäviä. Jae mainitsee myös puhtaiden kumppaneiden saamisen ja asumisen tässä tilassa ikuisesti. Se maalaa kuvan äärimmäisestä rauhasta, ilosta ja pysyvyydestä uskoville.","translations":{"opas":"julista niille (oi Muhammed), jotka uskovat ja tekevät hyviä töitä, se riemullinen sanoma, että heitä odottavat huvitarhat, joissa purot solisevat. Niin usein kuin he nauttivat hedelmiä sieltä ravinnokseen, he sanovat: »Tämä oli muinoin meidän ruokaamme» - vaikkakin heille tarjotaan se vain samankaltaisena.Siellä odottavat heitä puhtaat puolisot ja siellä he viihtyvät ikuisesti.","clear":"Anna hyvät sanomat, oi Profeetta, niille, jotka uskovat ja tekevät hyvää, että heillä on puutarhoja, joiden alla virrat virtaavat. Aina kun heille tarjotaan hedelmiä, he sanovat: ”Tämä on sitä, mitä meille on annettu ennenkin”, sillä heille tarjotaan hedelmiä, jotka näyttävät samanlaisilta, mutta maistuvat erilaisilta. Heillä on puhtaat puolisot, ja he ovat siellä ikuisesti."}},{"verse":26,"commentary_en":"This verse addresses potential questions or objections raised about the use of parables or comparisons in the Qur'an, particularly those involving seemingly insignificant things (like a gnat, as later examples in the Qur'an show, although not specifically in this verse). It explains that Allah does not hesitate to use comparisons involving anything, from the smallest to the greatest, because all creation reflects His power and wisdom. It contrasts the reactions of believers and those who reject faith. Believers accept these parables as truth from Allah, understanding that there is wisdom in them. Those who reject faith, however, question the purpose of such parables, showing a lack of reverence and understanding. The verse explains that these parables serve as a test: they guide those who are receptive to truth but cause those who are already inclined to stray to drift further away.","commentary_fi":"Tämä jae käsittelee mahdollisia kysymyksiä tai vastaväitteitä, jotka on esitetty Koraanissa käytettyjen vertausten tai rinnastusten suhteen, erityisesti sellaisten, jotka koskevat näennäisen merkityksettömiä asioita (kuten hyttynen, kuten myöhemmät esimerkit Koraanissa osoittavat, vaikka ei tässä jakeessa). Se selittää, että Allah ei epäröi käyttää vertauksia mistä tahansa, pienimmästä suurimpaan, koska koko luomakunta heijastaa Hänen voimaansa ja viisauttaan. Se vertaa uskovien ja uskon hylkäävien reaktioita. Uskovat hyväksyvät nämä vertaukset totuutena Allahilta, ymmärtäen, että niissä on viisautta. Uskon hylkäävät puolestaan kyseenalaistavat tällaisten vertausten tarkoituksen, osoittaen kunnioituksen ja ymmärryksen puutetta. Jae selittää, että nämä vertaukset palvelevat koettelemuksena: ne opastavat niitä, jotka ovat vastaanottavaisia totuudelle, mutta saavat ne, jotka ovat jo taipuvaisia eksymään, harhautumaan kauemmas.","arabic":"إِنَّ اللَّهَ لَا يَسْتَحْيِي أَنْ يَضْرِبَ مَثَلًا مَا بَعُوضَةً فَمَا فَوْقَهَا ۚ فَأَمَّا الَّذِينَ آمَنُوا فَيَعْلَمُونَ أَنَّهُ الْحَقُّ مِنْ رَبِّهِمْ ۖ وَأَمَّا الَّذِينَ كَفَرُوا فَيَقُولُونَ مَاذَا أَرَادَ اللَّهُ بِهَٰذَا مَثَلًا ۘ يُضِلُّ بِهِ كَثِيرًا وَيَهْدِي بِهِ كَثِيرًا ۚ وَمَا يُضِلُّ بِهِ إِلَّا الْفَاسِقِينَ","commentary":"Tämä jae käsittelee mahdollisia kysymyksiä tai vastaväitteitä, jotka on esitetty Koraanissa käytettyjen vertausten tai rinnastusten suhteen, erityisesti sellaisten, jotka koskevat näennäisen merkityksettömiä asioita (kuten hyttynen, kuten myöhemmät esimerkit Koraanissa osoittavat, vaikka ei tässä jakeessa). Se selittää, että Allah ei epäröi käyttää vertauksia mistä tahansa, pienimmästä suurimpaan, koska koko luomakunta heijastaa Hänen voimaansa ja viisauttaan. Se vertaa uskovien ja uskon hylkäävien reaktioita. Uskovat hyväksyvät nämä vertaukset totuutena Allahilta, ymmärtäen, että niissä on viisautta. Uskon hylkäävät puolestaan kyseenalaistavat tällaisten vertausten tarkoituksen, osoittaen kunnioituksen ja ymmärryksen puutetta. Jae selittää, että nämä vertaukset palvelevat koettelemuksena: ne opastavat niitä, jotka ovat vastaanottavaisia totuudelle, mutta saavat ne, jotka ovat jo taipuvaisia eksymään, harhautumaan kauemmas.","translations":{"opas":"Jumala ei häpeä käyttää vertauskuvana vaikkapa hyttystä tai jotakin sen yläpuolella olevaa . Ne jotka uskovat, tietävät, että siinä on heidän Herransa ilmoittama totuus, kun taas uskottomat kummastelevat: »Mitähän Jumala tarkoittaa moisella vertauksella?» Hän sillä eksyttää monta ja opastaa monta, mutta muut eivät eksy eivätkä joudu kadotukseen kuin jumalattomat,","clear":"Totisesti, Allah ei häpeä käyttää vertauskuvana hyttystä tai jotain vielä pienempää. Uskovat tietävät, että se on totuus heidän Herraltansa. Mutta uskottomat väittävät: ”Mitä Allah tarkoittaa sellaisella vertauskuvalla?” Tämän (koetuksen) kautta Hän antaa monien harhautua ja ohjaa monia. Eikä Hän anna harhautua ketään muuta kuin kapinalliset –"}},{"verse":27,"commentary_en":"This verse further describes the characteristics of those who \"forsake the path\" mentioned at the end of the previous verse. These are identified as evildoers who suffer loss. Their defining traits are listed: they break the commitments they made to Allah after affirming them; they sever the connections that Allah has commanded to be maintained (which can include relationships with Allah, family ties, and bonds within humanity); and they spread corruption or disruption on earth. The verse concludes by emphasizing that the harm from these actions ultimately falls back on themselves, leading to their own loss and detriment.","commentary_fi":"Tämä jae kuvaa edelleen niiden piirteitä, jotka \"jättävät polun\", kuten edellisen jakeen lopussa mainittiin. Nämä tunnistetaan pahantekijöiksi, jotka kärsivät tappion. Heidän määräävät piirteensä luetellaan: he rikkovat Allahille antamansa sitoumukset sen vahvistettuaan; he katkaisevat yhteydet, jotka Allah on käskenyt ylläpitää (mukaan lukien suhteet Allahiin, perhesiteet ja ihmiskunnan väliset yhteydet); ja he levittävät turmelusta tai häiriötä maan päällä. Jae päättyy korostaen, että näiden tekojen haitta lankeaa lopulta takaisin heille itselleen, johtaen heidän omaan tappioonsa ja vahinkoonsa.","arabic":"الَّذِينَ يَنْقُضُونَ عَهْدَ اللَّهِ مِنْ بَعْدِ مِيثَاقِهِ وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ وَيُفْسِدُونَ فِي الْأَرْضِ ۚ أُولَٰئِكَ هُمُ الْخَاسِرُونَ","commentary":"Tämä jae kuvaa edelleen niiden piirteitä, jotka \"jättävät polun\", kuten edellisen jakeen lopussa mainittiin. Nämä tunnistetaan pahantekijöiksi, jotka kärsivät tappion. Heidän määräävät piirteensä luetellaan: he rikkovat Allahille antamansa sitoumukset sen vahvistettuaan; he katkaisevat yhteydet, jotka Allah on käskenyt ylläpitää (mukaan lukien suhteet Allahiin, perhesiteet ja ihmiskunnan väliset yhteydet); ja he levittävät turmelusta tai häiriötä maan päällä. Jae päättyy korostaen, että näiden tekojen haitta lankeaa lopulta takaisin heille itselleen, johtaen heidän omaan tappioonsa ja vahinkoonsa.","translations":{"opas":"jotka rikkovat liiton Jumalan kanssa, sen jälkeen kuin se on vahvistettu, erottavat, mitä Jumala on määrännyt yhdistettäväksi, ja aiheuttavat pahaa maan päällä, he ovat niitä, jotka joutuvat onnettomuuteen.","clear":"ne, jotka rikkovat Allahin liiton sen vahvistamisen jälkeen, rikkovat kaiken, mitä Allah on määrännyt ylläpidettäväksi, ja levittävät turmelusta maassa. Juuri he ovat (todellisia) häviäjiä."}},{"verse":28,"commentary_en":"This verse directly questions how anyone can reject faith in Allah when presented with undeniable facts about life itself. It points to the cycle of human existence: we were once without life, then Allah gave us life; He will cause us to die, and then He will bring us back to life again (on the Day of Resurrection). Finally, we will return to Him for accountability. This verse uses the profound and observable reality of life, death, and the promise of resurrection as a powerful sign of Allah's power and a reason to believe in Him and not reject faith.","commentary_fi":"Tämä jae kyseenalaistaa suoraan, miten kukaan voi hylätä uskon Allahiin, kun hänelle esitetään kiistattomia tosiasioita elämästä itsestään. Se osoittaa ihmisen olemassaolon kiertokulkuun: olimme kerran ilman elämää, sitten Allah antoi meille elämän; Hän saa meidät kuolemaan, ja sitten Hän tuo meidät jälleen takaisin elämään (Ylösnousemuksen päivänä). Lopulta me palaamme Hänen luokseen tilintekoa varten. Tämä jae käyttää elämän, kuoleman ja ylösnousemuksen lupauksen syvällistä ja havaittavissa olevaa todellisuutta voimakkaana merkkinä Allahin voimasta ja syynä uskoa Häneen eikä hylätä uskoa.","arabic":"كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنْتُمْ أَمْوَاتًا فَأَحْيَاكُمْ ۖ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ","commentary":"Tämä jae kyseenalaistaa suoraan, miten kukaan voi hylätä uskon Allahiin, kun hänelle esitetään kiistattomia tosiasioita elämästä itsestään. Se osoittaa ihmisen olemassaolon kiertokulkuun: olimme kerran ilman elämää, sitten Allah antoi meille elämän; Hän saa meidät kuolemaan, ja sitten Hän tuo meidät jälleen takaisin elämään (Ylösnousemuksen päivänä). Lopulta me palaamme Hänen luokseen tilintekoa varten. Tämä jae käyttää elämän, kuoleman ja ylösnousemuksen lupauksen syvällistä ja havaittavissa olevaa todellisuutta voimakkaana merkkinä Allahin voimasta ja syynä uskoa Häneen eikä hylätä uskoa.","translations":{"opas":"Kuinka voitte kieltää Jumalan te, jotka olitte kuolleita ja joille Hän antoi elämän? Aikanaan Hän antaa teidän kuolla, sitten Hän herättää taas teidät elämään, ja lopulta palajatte jälleen Hänen luoksensa.","clear":"Kuinka voitte kieltää Allahin? Te olitte elottomia ja Hän antoi teille elämän, sitten Hän antaa teidän kuolla ja taas antaa teille elämän, ja sitten Hänen luokseen te (kaikki) palataan."}},{"verse":29,"commentary_en":"Building upon the theme of Allah's power in the previous verse, this one further emphasizes His role as Creator. It states that Allah created everything on Earth for our benefit, highlighting His grace and the value He has placed on humanity by making the resources of the world available to us. It then mentions His creation of the heavens, stating that He fashioned them into seven heavens, bringing order and perfection to them. The verse concludes by affirming that Allah has complete knowledge of all things. The verse mentions that Allah \"comprehended the heavens\" and \"fashioned it into seven heavens.\" In Islamic belief, such attributes are affirmed as they appear in the Qur’an, without likening Allah to His creation or explaining how they occur. Rather, they reflect His majesty and uniqueness in a way beyond human comprehension. This verse serves to reinforce Allah's absolute power and knowledge over all creation, both on Earth and in the vastness of the heavens.","commentary_fi":"Rakentuen edellisen jakeen teemaan Allahin voimasta, tämä jae korostaa edelleen Hänen rooliaan Luojana. Se toteaa, että Allah loi kaiken maan päällä teidän hyväksenne, korostaen Hänen armoaan ja ihmiskunnalle asettamaansa arvoa saattamalla maailman resurssit saatavillemme. Sitten se mainitsee Hänen luomansa taivaat, todeten, että Hän muovasi ne seitsemäksi taivaaksi, tuoden niihin järjestyksen ja täydellisyyden. Jae päättyy vahvistamalla, että Allahilla on täydellinen tieto kaikesta. Jae mainitsee, että Allah \"käsitti taivaat\" ja \"muovasi ne seitsemäksi taivaaksi\". Islamilaisten uskomusten mukaan tällaiset ominaisuudet vahvistetaan sellaisenaan kuin ne ilmestyvät Koraanissa, vertaamatta Allahia Hänen luomaansa tai selittämättä, miten ne tapahtuvat. Pikemminkin ne heijastavat Hänen majesteettiuttaan ja ainutlaatuisuuttaan tavalla, joka ylittää ihmisen ymmärryksen. Tämä jae pyrkii vahvistamaan Allahin ehdotonta voimaa ja tietoa koko luomakunnasta, sekä maan päällä että taivaiden laajuudessa.","arabic":"هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعًا ثُمَّ اسْتَوَىٰ إِلَى السَّمَاءِ فَسَوَّاهُنَّ سَبْعَ سَمَاوَاتٍ ۚ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ","commentary":"Rakentuen edellisen jakeen teemaan Allahin voimasta, tämä jae korostaa edelleen Hänen rooliaan Luojana. Se toteaa, että Allah loi kaiken maan päällä teidän hyväksenne, korostaen Hänen armoaan ja ihmiskunnalle asettamaansa arvoa saattamalla maailman resurssit saatavillemme. Sitten se mainitsee Hänen luomansa taivaat, todeten, että Hän muovasi ne seitsemäksi taivaaksi, tuoden niihin järjestyksen ja täydellisyyden. Jae päättyy vahvistamalla, että Allahilla on täydellinen tieto kaikesta. Jae mainitsee, että Allah \"käsitti taivaat\" ja \"muovasi ne seitsemäksi taivaaksi\". Islamilaisten uskomusten mukaan tällaiset ominaisuudet vahvistetaan sellaisenaan kuin ne ilmestyvät Koraanissa, vertaamatta Allahia Hänen luomaansa tai selittämättä, miten ne tapahtuvat. Pikemminkin ne heijastavat Hänen majesteettiuttaan ja ainutlaatuisuuttaan tavalla, joka ylittää ihmisen ymmärryksen. Tämä jae pyrkii vahvistamaan Allahin ehdotonta voimaa ja tietoa koko luomakunnasta, sekä maan päällä että taivaiden laajuudessa.","translations":{"opas":"Hän on se, joka on luonut teille kaiken, mitä on maan päällä. Sitten Hän nousi taivaaseen ja muodosti sen seitsemäksi taivaaksi; niin, Hän on kaikkitietävä.","clear":"Hän on se, joka loi kaiken maan päällä teitä varten. Sitten Hän kääntyi kohti taivasta, muodostaen sen seitsemäksi taivaaksi. Ja Hänellä on (täydellinen) tieto kaikesta."}},{"verse":30,"commentary_en":"This verse begins the narrative about the creation of humanity. Allah announced to the angels His intention to appoint a vicegerent on earth. This indicates that humanity (represented by Adam) was given a significant role to manage and develop the earth according to Allah's will. The angels responded by questioning this decision, wondering if this creation would cause corruption and bloodshed, especially since the angels already dedicate themselves entirely to praising and glorifying Allah. Allah replied by stating that He knew things the angels did not, hinting at a deeper purpose and potential within humanity that went beyond the angels' understanding at that moment. This sets the stage for understanding humanity's unique status and responsibility on earth.","commentary_fi":"Tämä jae aloittaa kertomuksen ihmiskunnan luomisesta. Allah ilmoitti enkeleille aikomuksestaan asettaa sijainen maahan. Tämä osoittaa, että ihmiskunnalle (jota edustaa Adam) annettiin merkittävä rooli hallita ja kehittää maata Allahin tahdon mukaisesti. Enkelit vastasivat kyseenalaistamalla tämän päätöksen ja ihmettelivät, aiheuttaisiko tämä luomus turmelusta ja verenvuodatusta, varsinkin kun enkelit jo omistautuivat täysin Allahin ylistämiseen ja pyhittämiseen. Allah vastasi sanomalla, että Hän tiesi asioita, joita enkelit eivät tienneet, vihjaten ihmiskunnan syvempään tarkoitukseen ja potentiaaliin, joka ylitti enkelien ymmärryksen sillä hetkellä. Tämä luo perustan ihmiskunnan ainutlaatuisen aseman ja vastuun ymmärtämiselle maan päällä.","arabic":"وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً ۖ قَالُوا أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّي أَعْلَمُ مَا لَا تَعْلَمُونَ","commentary":"Tämä jae aloittaa kertomuksen ihmiskunnan luomisesta. Allah ilmoitti enkeleille aikomuksestaan asettaa sijainen maahan. Tämä osoittaa, että ihmiskunnalle (jota edustaa Adam) annettiin merkittävä rooli hallita ja kehittää maata Allahin tahdon mukaisesti. Enkelit vastasivat kyseenalaistamalla tämän päätöksen ja ihmettelivät, aiheuttaisiko tämä luomus turmelusta ja verenvuodatusta, varsinkin kun enkelit jo omistautuivat täysin Allahin ylistämiseen ja pyhittämiseen. Allah vastasi sanomalla, että Hän tiesi asioita, joita enkelit eivät tienneet, vihjaten ihmiskunnan syvempään tarkoitukseen ja potentiaaliin, joka ylitti enkelien ymmärryksen sillä hetkellä. Tämä luo perustan ihmiskunnan ainutlaatuisen aseman ja vastuun ymmärtämiselle maan päällä.","translations":{"opas":"Ja kun Herrasi puhui enkeleille: »Katso, Minä aion totisesti asettaa sijaisen maan päälle», he kysyivät: »Aiotko asettaa sinne jonkun, joka siellä aiheuttaa vääryyttä ja vuodattaa verta, meidän ylistäessämme Sinua ja julistaessamme Sinun pyhyyttäsi?» Hän vastasi: »Minä tiedän totisesti, mitä te ette tiedä.»","clear":"Muista, kun Herrasi sanoi enkeleille: ”Minä asetan maan päälle seuraavan ˹ihmisen˺ vallanpitäjän.” He kysyivät ˹Allahilta˺: ”Asetatko sinne jonkun, joka levittää turmelusta ja vuodattaa verta, samalla kun me ylistämme Sinua ja julistamme Sinun pyhyyttäsi?” Allah vastasi: ”Minä tiedän, mitä te ette tiedä.”"}},{"verse":31,"commentary_en":"Following the initial announcement and the angels' question, Allah demonstrated a key ability He bestowed upon Adam. He taught Adam the \"names\" of all things – a capacity for knowledge, cognition, and communication through symbols and language. Allah then presented these things to the angels and challenged them to identify them by name if their perspective (expressed in the previous verse) was complete. This test was to show the angels something unique about Adam's capabilities.","commentary_fi":"Ensimmäisen ilmoituksen ja enkelien kysymyksen jälkeen Allah osoitti keskeisen kyvyn, jonka Hän oli suonut Adamille. Hän opetti Adamille kaikkien asioiden \"nimet\" – kyvyn tietoon, kognitioon ja kommunikaatioon symbolien ja kielen avulla. Sitten Allah asetti nämä asiat enkelien eteen ja haastoi heidät tunnistamaan ne nimeltä, jos heidän näkemyksensä (joka ilmaistiin edellisessä jakeessa) oli täydellinen. Tämä testi oli osoittaa enkeleille jotain ainutlaatuista Adamin kyvyistä.","arabic":"وَعَلَّمَ آدَمَ الْأَسْمَاءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى الْمَلَائِكَةِ فَقَالَ أَنْبِئُونِي بِأَسْمَاءِ هَٰؤُلَاءِ إِنْ كُنْتُمْ صَادِقِينَ","commentary":"Ensimmäisen ilmoituksen ja enkelien kysymyksen jälkeen Allah osoitti keskeisen kyvyn, jonka Hän oli suonut Adamille. Hän opetti Adamille kaikkien asioiden \"nimet\" – kyvyn tietoon, kognitioon ja kommunikaatioon symbolien ja kielen avulla. Sitten Allah asetti nämä asiat enkelien eteen ja haastoi heidät tunnistamaan ne nimeltä, jos heidän näkemyksensä (joka ilmaistiin edellisessä jakeessa) oli täydellinen. Tämä testi oli osoittaa enkeleille jotain ainutlaatuista Adamin kyvyistä.","translations":{"opas":"Ja Hän opetti ihmiselle (Aadamille) kaikki nimet ja nimitettävät; sitten näytti Hän kaikki enkeleille ja sanoi: »Lausukaa näiden nimet Minulle, jos olette todellisuudesta selvillä.»","clear":"Hän opetti Aadamille kaikkien asioiden nimet, sitten Hän esitti ne enkeleille ja sanoi: ”Kertokaa Minulle näiden nimet, jos se, mitä sanotte, on totta?”"}},{"verse":32,"commentary_en":"In response to Allah's challenge in the previous verse, the angels humbly admitted their inability to name the things. They acknowledged that their knowledge was limited to only what Allah had taught them and affirmed that only Allah possesses perfect and comprehensive knowledge and wisdom. This highlights the angels' recognition of Allah's absolute superiority in knowledge and wisdom.","commentary_fi":"Vastauksena Allahin haasteeseen edellisessä jakeessa, enkelit myönsivät nöyrästi kyvyttömyytensä nimetä asioita. He tunnustivat, että heidän tietonsa rajoittui vain siihen, mitä Allah oli heille opettanut, ja vahvistivat, että vain Allahilla on täydellinen ja kattava tieto ja viisaus. Tämä korostaa enkelien tunnustusta Allahin ehdottomasta ylivertaisuudesta tiedossa ja viisaudessa.","arabic":"قَالُوا سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ","commentary":"Vastauksena Allahin haasteeseen edellisessä jakeessa, enkelit myönsivät nöyrästi kyvyttömyytensä nimetä asioita. He tunnustivat, että heidän tietonsa rajoittui vain siihen, mitä Allah oli heille opettanut, ja vahvistivat, että vain Allahilla on täydellinen ja kattava tieto ja viisaus. Tämä korostaa enkelien tunnustusta Allahin ehdottomasta ylivertaisuudesta tiedossa ja viisaudessa.","translations":{"opas":"He vastasivat: »Sinulle yksin kunnia! Meillä ei ole muuta tietoa, kuin minkä olet opettanut meille, Sinä ainoa olet totisesti Tietäjä, Viisas.»","clear":"He vastasivat: ”Kunnia olkoon Sinulle! Meillä ei ole tietoa, paitsi sen, mitä Sinä olet meille opettanut. Totisesti, Sinä olet Kaikkitietävä, Kaikkiviisas.”"}},{"verse":33,"commentary_en":"After the angels admitted their limitation (verse 32), Allah instructed Adam to tell them the names of the things. Adam was able to do so, demonstrating the special knowledge he had been granted (verse 31). Following Adam's success, Allah reminded the angels of His vast knowledge, encompassing not just what is apparent but also the hidden secrets of the heavens and the earth, and even what they revealed or concealed (referring back to their earlier questioning and underlying thoughts in verse 30). This affirmed Allah's wisdom in choosing Adam for the role of vicegerent, possessing capabilities the angels did not.","commentary_fi":"Sen jälkeen kun enkelit olivat myöntäneet rajoituksensa (jae 32), Allah käski Adamia kertomaan heille asioiden nimet. Adam kykeni tekemään niin osoittaen erityistiedon, joka hänelle oli suotu (jae 31). Adamin onnistumisen jälkeen Allah muistutti enkeleitä laajasta tietämyksestään, joka kattaa paitsi ilmeisen, myös taivaiden ja maan piilotetut salaisuudet, ja jopa sen, mitä he paljastivat tai salailivat (viitaten heidän aikaisempaan kysymykseensä ja taustalla oleviin ajatuksiinsa jakeessa 30). Tämä vahvisti Allahin viisauden Adamin valitsemisessa sijaiseksi, jolla oli kykyjä, joita enkeleillä ei ollut.","arabic":"قَالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ ۖ فَلَمَّا أَنْبَأَهُمْ بِأَسْمَائِهِمْ قَالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَمَا كُنْتُمْ تَكْتُمُونَ","commentary":"Sen jälkeen kun enkelit olivat myöntäneet rajoituksensa (jae 32), Allah käski Adamia kertomaan heille asioiden nimet. Adam kykeni tekemään niin osoittaen erityistiedon, joka hänelle oli suotu (jae 31). Adamin onnistumisen jälkeen Allah muistutti enkeleitä laajasta tietämyksestään, joka kattaa paitsi ilmeisen, myös taivaiden ja maan piilotetut salaisuudet, ja jopa sen, mitä he paljastivat tai salailivat (viitaten heidän aikaisempaan kysymykseensä ja taustalla oleviin ajatuksiinsa jakeessa 30). Tämä vahvisti Allahin viisauden Adamin valitsemisessa sijaiseksi, jolla oli kykyjä, joita enkeleillä ei ollut.","translations":{"opas":"Silloin Hän sanoi: »Ihminen (Aadam), lausu niiden nimet heille!» ja kun hän lausui niiden nimet heille, sanoi Hän: »Enkö ole teille sanonut, että Minä tunnen totisesti salat taivaassa ja maan päällä, ja Minä tiedän, mitä te ilmaisette ja mitä salaatte?»","clear":"Allah sanoi: ”Oi Aadam! Ilmoita heille näiden nimet.” Kun Aadam oli sen tehnyt, Allah sanoi: ”Enkö Minä sanonut teille, että Minä tunnen taivaiden ja maan salaisuudet, ja Minä tiedän, mitä te ilmaisette ja mitä te salaatte?”"}},{"verse":34,"commentary_en":"As a further sign of the honour bestowed upon Adam, Allah commanded the angels to prostrate before him. The angels obeyed, but one being named Iblis (often referred to as Satan) refused out of arrogance. This refusal, rooted in pride, marked him as one who rejects faith. This verse introduces Iblis as an antagonist to humanity, emerging from his refusal to acknowledge the honour Allah gave Adam. In Islamic belief, Iblis is not an angel; he is clearly described elsewhere in the Qur'an (verse 18:50) as being from the Jinn—a distinct and independent creation, separate from the angels.","commentary_fi":"Lisäksi merkkinä Aadamin saamasta kunniasta Allah käski enkeleitä kumartamaan häntä. Enkelit tottelivat, mutta yksi olento nimeltä Iblis (usein kutsuttu Saatanaksi) kieltäytyi ylpeyden vuoksi. Tämä kieltäytyminen, joka juonsi juurensa ylimielisyydestä, teki hänestä uskonsa hylkääjän. Tämä jae esittelee Iblisin ihmiskunnan vastustajana, joka nousi siitä, ettei hän suostunut tunnustamaan Aadamin saamaa arvoa. Islamilaisen uskon mukaan Iblis ei ole enkeli; hänet kuvataan selvästi Koraanissa (jae 18:50) olevan jinneistä – erillinen ja itsenäinen luomakunta, joka eroaa enkeleistä.","arabic":"وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ أَبَىٰ وَاسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ","commentary":"Lisäksi merkkinä Aadamin saamasta kunniasta Allah käski enkeleitä kumartamaan häntä. Enkelit tottelivat, mutta yksi olento nimeltä Iblis (usein kutsuttu Saatanaksi) kieltäytyi ylpeyden vuoksi. Tä
