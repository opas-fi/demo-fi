he previous verse, this verse offers further clarification about accountability. It teaches that Allah does not hold people accountable for oaths made thoughtlessly or spoken out of habit, where there was no firm or deliberate intention behind the words. These casual or reflexive expressions—common in everyday speech—are not treated as binding. However, when an oath is made with conscious intent and true commitment in the heart, a person becomes morally and spiritually accountable for it. This emphasizes the central Islamic principle that intent (niyyah) is a key factor in determining responsibility and judgment. The verse ends by highlighting two of Allah’s names: Al-Ghafūr (the Most Forgiving) and Al-Ḥalīm (the Most Forbearing), underscoring His mercy and leniency towards His servants. These attributes reassure believers that Allah pardons unintentional mistakes and provides a path for redemption through atonement when needed. This verse serves as both a warning about the weight of intentional speech and a comfort in Allah’s compassion.","commentary_fi":"Edellisen jakeen yleisen vala-periaatteen jälkeen tämä jae tarjoaa lisäselvennystä vastuullisuudesta. Siinä opetetaan, ettei Allah pidä ihmisiä vastuullisina kevytmielisesti lausutuista valoista – sellaisista, jotka sanotaan tottumuksesta tai ajattelematta, ilman todellista aikomusta. Tällaisia arkikielessä esiintyviä ilmaisuja ei pidetä sitovina valkoina. Sen sijaan, jos vala annetaan tietoisella aikomuksella ja vakaalla sydämen päätöksellä, siitä tulee moraalinen ja hengellinen vastuu. Tämä korostaa islamilaisessa opetuksessa keskeistä periaatetta: aikomus (niyyah) on ratkaiseva tekijä vastuun määrittämisessä. Jae päättyy mainitsemalla kaksi Allahin nimeä: Al-Ghafūr (Anteeksiantava) ja Al-Ḥalīm (Pitkämielinen), jotka korostavat Hänen armoaan ja suvaitsevaisuuttaan palvelijoitaan kohtaan. Nämä ominaisuudet tuovat lohtua uskoville, sillä Allah antaa anteeksi tahattomat virheet ja tarjoaa keinon sovittaa vahingolliset valat. Tämä jae toimii sekä varoituksena harkitun puheen painosta että muistutuksena Allahin myötätunnosta.","arabic":"لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِنْ يُؤَاخِذُكُمْ بِمَا كَسَبَتْ قُلُوبُكُمْ ۗ وَاللَّهُ غَفُورٌ حَلِيمٌ","commentary":"Edellisen jakeen yleisen vala-periaatteen jälkeen tämä jae tarjoaa lisäselvennystä vastuullisuudesta. Siinä opetetaan, ettei Allah pidä ihmisiä vastuullisina kevytmielisesti lausutuista valoista – sellaisista, jotka sanotaan tottumuksesta tai ajattelematta, ilman todellista aikomusta. Tällaisia arkikielessä esiintyviä ilmaisuja ei pidetä sitovina valkoina. Sen sijaan, jos vala annetaan tietoisella aikomuksella ja vakaalla sydämen päätöksellä, siitä tulee moraalinen ja hengellinen vastuu. Tämä korostaa islamilaisessa opetuksessa keskeistä periaatetta: aikomus (niyyah) on ratkaiseva tekijä vastuun määrittämisessä. Jae päättyy mainitsemalla kaksi Allahin nimeä: Al-Ghafūr (Anteeksiantava) ja Al-Ḥalīm (Pitkämielinen), jotka korostavat Hänen armoaan ja suvaitsevaisuuttaan palvelijoitaan kohtaan. Nämä ominaisuudet tuovat lohtua uskoville, sillä Allah antaa anteeksi tahattomat virheet ja tarjoaa keinon sovittaa vahingolliset valat. Tämä jae toimii sekä varoituksena harkitun puheen painosta että muistutuksena Allahin myötätunnosta.","translations":{"opas":"Jumala ei rankaise teitä ajattelemattomasta sanasta valoissanne , vaan hän rankaisee teitä siitä, minkä teidän sydämenne on omaksunut, sillä Jumala on sääliväinen ja lempeä.","clear":"Allah ei ota teitä tilille tahattomista valoista, vaan siitä, mitä olette sydämessänne tarkoittaneet. Ja Allah on Kaikkinäkevä, Kaikkikärsivällinen."}},{"verse":226,"commentary_en":"This verse addresses a specific type of oath in the context of marriage: when a husband swears to abstain from sexual relations with his wife. In pre-Islamic times, such oaths—known as īlāʾ—were sometimes used as a means of emotional punishment or control, leaving the wife in a state of uncertainty and neglect. Islam places firm boundaries on this practice by establishing a maximum waiting period of four months. This period serves as a cooling-off phase and a test of the relationship. If during or after these four months the husband chooses to resume marital relations, it is allowed and even encouraged. The verse assures that Allah is Oft-Forgiving and Most Merciful, signaling that returning to marital intimacy after such a break is not sinful but can be a step toward reconciliation. This ruling ensures fairness and protection for the wife, preventing prolonged emotional harm or abandonment. It reflects Islam’s emphasis on responsibility, compassion, and the maintenance of family harmony, while limiting harmful practices inherited from earlier traditions.","commentary_fi":"Tämä jae käsittelee tietynlaista valaa avioliitossa: kun mies vannoo pidättäytyvänsä seksuaalisista suhteista vaimonsa kanssa. Ennen islamia tällaisia valoja – joita kutsutaan īlāʾiksi – käytettiin toisinaan keinona henkiseen rangaistukseen tai painostukseen, jättäen vaimon epätietoiseen ja hylättyyn asemaan. Islam asettaa tälle käytännölle selkeät rajat määräämällä enimmäisajaksi neljä kuukautta. Tämä aika toimii sekä rauhoittumisjaksona että suhteen koetuksena. Jos aviomies päättää tänä aikana tai sen jälkeen palata normaaliin aviolliseen elämään, se on sallittua ja jopa suositeltavaa. Jae muistuttaa, että Allah on Anteeksiantava ja Armollinen, mikä osoittaa, että paluu suhteeseen tällaisen valan jälkeen ei ole synti vaan voi olla rakentava askel kohti sovintoa. Tämä säädös suojaa vaimoa epäoikeudenmukaiselta kohtelulta ja estää pitkitetyn hylkäämisen. Se heijastaa islamin painotusta vastuullisuuteen, myötätuntoon ja perheyksikön eheyteen, sekä rajoittaa haitallisia käytäntöjä menneisyydestä.","arabic":"لِلَّذِينَ يُؤْلُونَ مِنْ نِسَائِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ ۖ فَإِنْ فَاءُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ","commentary":"Tämä jae käsittelee tietynlaista valaa avioliitossa: kun mies vannoo pidättäytyvänsä seksuaalisista suhteista vaimonsa kanssa. Ennen islamia tällaisia valoja – joita kutsutaan īlāʾiksi – käytettiin toisinaan keinona henkiseen rangaistukseen tai painostukseen, jättäen vaimon epätietoiseen ja hylättyyn asemaan. Islam asettaa tälle käytännölle selkeät rajat määräämällä enimmäisajaksi neljä kuukautta. Tämä aika toimii sekä rauhoittumisjaksona että suhteen koetuksena. Jos aviomies päättää tänä aikana tai sen jälkeen palata normaaliin aviolliseen elämään, se on sallittua ja jopa suositeltavaa. Jae muistuttaa, että Allah on Anteeksiantava ja Armollinen, mikä osoittaa, että paluu suhteeseen tällaisen valan jälkeen ei ole synti vaan voi olla rakentava askel kohti sovintoa. Tämä säädös suojaa vaimoa epäoikeudenmukaiselta kohtelulta ja estää pitkitetyn hylkäämisen. Se heijastaa islamin painotusta vastuullisuuteen, myötätuntoon ja perheyksikön eheyteen, sekä rajoittaa haitallisia käytäntöjä menneisyydestä.","translations":{"opas":"Ne, jotka vannovat pysyvänsä erillään vaimoistaan, odottakoot neljän kuukauden ajan; jos he muuttavat mielensä, niin on Jumala totisesti sääliväinen ja laupias.","clear":"Niiden, jotka vannovat pidättyvänsä yhdynnästä vaimojensa kanssa, on odotettava neljä kuukautta. Jos he muuttavat mielensä, niin Allah on varmasti Kaikkinäkevä, Armollisin."}},{"verse":227,"commentary_en":"This verse continues the legal and ethical guidance from the previous verse concerning the īlāʾ—the oath of abstention in marriage. It specifies that if, after the four-month waiting period mentioned in verse 2:226, the husband does not resume marital relations and instead intends to end the marriage, then this intention constitutes a formal decision for divorce. The verse confirms that such a decision leads to the dissolution of the marriage, making it clear that a husband cannot leave his wife in limbo indefinitely. The verse concludes by emphasizing that Allah is All-Hearing and All-Knowing, reminding believers that Allah is fully aware of both actions and intentions. \nThis guidance ensures the protection of the wife's rights, prevents emotional harm through prolonged uncertainty, and upholds justice and clarity in marital relationships. It reinforces Islam’s concern for fairness and accountability in family life.","commentary_fi":"Tämä jae jatkaa edellisen jakeen (īlāʾ) ohjeistusta aviollisesta pidättäytymisvalasta. Se selventää, että jos mies ei neljän kuukauden odotusajan (joka mainitaan jakeessa 2:226) jälkeen palaa aviollisiin suhteisiin ja aikoo päättää avioliiton, tämä aikomus lasketaan muodolliseksi päätökseksi erosta. Tällöin avioliitto purkautuu, eikä miestä sallita pitää vaimoaan epävarmassa tilanteessa määräämättömän ajan. Jae päättyy muistutuksella siitä, että Allah kuulee ja tietää kaiken – viitaten siihen, että sekä teot että sydämen aikomukset ovat Hänen tiedossaan. Tämä ohjeistus suojaa vaimon oikeuksia, ehkäisee henkistä vahinkoa ja edistää oikeudenmukaisuutta ja selkeyttä perhesuhteissa. Se heijastaa islamin painotusta vastuuseen ja reiluuteen avioliiton ja eron tilanteissa.","arabic":"وَإِنْ عَزَمُوا الطَّلَاقَ فَإِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ","commentary":"Tämä jae jatkaa edellisen jakeen (īlāʾ) ohjeistusta aviollisesta pidättäytymisvalasta. Se selventää, että jos mies ei neljän kuukauden odotusajan (joka mainitaan jakeessa 2:226) jälkeen palaa aviollisiin suhteisiin ja aikoo päättää avioliiton, tämä aikomus lasketaan muodolliseksi päätökseksi erosta. Tällöin avioliitto purkautuu, eikä miestä sallita pitää vaimoaan epävarmassa tilanteessa määräämättömän ajan. Jae päättyy muistutuksella siitä, että Allah kuulee ja tietää kaiken – viitaten siihen, että sekä teot että sydämen aikomukset ovat Hänen tiedossaan. Tämä ohjeistus suojaa vaimon oikeuksia, ehkäisee henkistä vahinkoa ja edistää oikeudenmukaisuutta ja selkeyttä perhesuhteissa. Se heijastaa islamin painotusta vastuuseen ja reiluuteen avioliiton ja eron tilanteissa.","translations":{"opas":"Mutta jos he pysyvät eropäätöksessään, niin on Jumala totisesti kuuleva, tietävä.","clear":"Mutta jos he päättävät avioeron, niin Allah on totisesti Kaikkikuuleva, Kaikkitietävä."}},{"verse":228,"commentary_en":"This verse introduces foundational rulings concerning divorce in Islam, beginning with the `iddah—the waiting period a divorced woman must observe. It stipulates that a woman who is divorced must wait for three menstrual cycles (or periods of purity, according to some jurists) before she can remarry. This waiting period serves multiple purposes: it allows for the detection of a possible pregnancy, ensures clarity regarding lineage, and provides a window for reflection and potential reconciliation. During this time, it is strictly prohibited for a woman to conceal a pregnancy, should one exist. This command is reinforced by appealing to her belief in Allah and the Last Day, highlighting the moral and spiritual seriousness of such concealment. The verse also grants the husband the right to take his wife back during this waiting period if his intention is genuine reconciliation. In this case, no new marriage contract is required. This right is restricted to the initial two divorces and must not be used as a means of manipulation. Importantly, the verse states that women have rights comparable to the obligations placed upon them, in a just and balanced manner. However, it acknowledges that men have a \"degree\" over women in certain aspects—such as initiating divorce and the legal authority to resume the marriage during the `iddah. This \"degree\" is not a blanket superiority, but rather a functional distinction within the structure of Islamic family law. The verse ends by affirming that Allah is Exalted in Might and Wise, underscoring that these rulings are grounded in divine justice and wisdom.","commentary_fi":"Tämä jae esittelee islamilaisen avioeron keskeisiä säädöksiä ja aloittaa käsitteellä `iddah – eli odotusaika, jota eronnut nainen on velvollinen noudattamaan. Jae määrää, että eronneen naisen on odotettava kolme kuukautiskiertoa (tai puhtausjaksoa – riippuen oikeusoppineiden tulkinnasta), ennen kuin hän voi mennä uudelleen naimisiin. Tämä aika palvelee useita tarkoituksia: mahdollisen raskauden toteaminen, sukulinjan selkeys sekä mahdollisuus harkintaan ja mahdolliseen sovintoon. Tänä aikana naiselle on ehdottomasti kiellettyä salata raskaus, jos hän on raskaana. Tämä kielto ankkuroidaan hänen uskoonsa Allahiin ja Viimeiseen päivään, korostaen teon moraalista ja hengellistä painoarvoa. Jae myöntää aviomiehelle oikeuden ottaa vaimonsa takaisin odotusaikana, jos tarkoituksena on vilpitön sovinto. Uutta avioliittosopimusta ei silloin tarvita. Tämä oikeus koskee vain ensimmäisiä kahta eroa, eikä sitä saa käyttää manipuloinnin välineenä. Jae korostaa myös, että naisilla on oikeuksia miehiään kohtaan samalla tavoin kuin miehillä on velvollisuuksia heitä kohtaan – oikeudenmukaisuuden periaatteen mukaisesti. Samalla se toteaa, että miehillä on ”asteen verran etuoikeutta” tietyissä asioissa – kuten eron aloittamisessa tai oikeudessa palata avioliittoon odotusaikana. Tämä etuoikeus ei ole yleinen ylemmyys, vaan käytännöllinen järjestely islamilaisen perheoikeuden sisällä. Jae päättyy toteamalla, että Allah on Mahtava ja Viisas, mikä muistuttaa, että nämä säädökset perustuvat täydelliseen oikeudenmukaisuuteen ja jumalalliseen viisauteen.","arabic":"وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ ۚ وَلَا يَحِلُّ لَهُنَّ أَنْ يَكْتُمْنَ مَا خَلَقَ اللَّهُ فِي أَرْحَامِهِنَّ إِنْ كُنَّ يُؤْمِنَّ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۚ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِي ذَٰلِكَ إِنْ أَرَادُوا إِصْلَاحًا ۚ وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ","commentary":"Tämä jae esittelee islamilaisen avioeron keskeisiä säädöksiä ja aloittaa käsitteellä `iddah – eli odotusaika, jota eronnut nainen on velvollinen noudattamaan. Jae määrää, että eronneen naisen on odotettava kolme kuukautiskiertoa (tai puhtausjaksoa – riippuen oikeusoppineiden tulkinnasta), ennen kuin hän voi mennä uudelleen naimisiin. Tämä aika palvelee useita tarkoituksia: mahdollisen raskauden toteaminen, sukulinjan selkeys sekä mahdollisuus harkintaan ja mahdolliseen sovintoon. Tänä aikana naiselle on ehdottomasti kiellettyä salata raskaus, jos hän on raskaana. Tämä kielto ankkuroidaan hänen uskoonsa Allahiin ja Viimeiseen päivään, korostaen teon moraalista ja hengellistä painoarvoa. Jae myöntää aviomiehelle oikeuden ottaa vaimonsa takaisin odotusaikana, jos tarkoituksena on vilpitön sovinto. Uutta avioliittosopimusta ei silloin tarvita. Tämä oikeus koskee vain ensimmäisiä kahta eroa, eikä sitä saa käyttää manipuloinnin välineenä. Jae korostaa myös, että naisilla on oikeuksia miehiään kohtaan samalla tavoin kuin miehillä on velvollisuuksia heitä kohtaan – oikeudenmukaisuuden periaatteen mukaisesti. Samalla se toteaa, että miehillä on ”asteen verran etuoikeutta” tietyissä asioissa – kuten eron aloittamisessa tai oikeudessa palata avioliittoon odotusaikana. Tämä etuoikeus ei ole yleinen ylemmyys, vaan käytännöllinen järjestely islamilaisen perheoikeuden sisällä. Jae päättyy toteamalla, että Allah on Mahtava ja Viisas, mikä muistuttaa, että nämä säädökset perustuvat täydelliseen oikeudenmukaisuuteen ja jumalalliseen viisauteen.","translations":{"opas":"Hylättyjen vaimojen tulee odottaa kolme puhdistusaikaa, eikä heidän ole sallittu salata, mitä Jumala ehkä on luonut heidän kohdussaan, jos he uskovat Jumalaan ja Viimeiseen päivään, ja heidän miestensä tulisi mieluimmin ottaa heidät takaisin tänä aikana, jos he toivovat sovintoa. Naisilla on sama oikeus miehiin nähden kuin miehillä heihin, kuten on kohtuullista; kuitenkin ovat miehet naisiin verrattuina korkeammassa asemassa. Niin, Jumala on mahtava ja viisas.","clear":"Eronneiden naisten on odotettava kolme kuukautiskierrosta ˹ennen kuin he voivat mennä uudelleen naimisiin˺. Heidän ei ole luvallista salata sitä, mitä Allah on luonut heidän kohtuihinsa, jos he ˹todella˺ uskovat Allahin ja Viimeiseen Päivään. Ja heidän aviomiehillään on oikeus ottaa heidät takaisin tänä aikana, jos he haluavat sovinnon. Naisilla on samanlaiset oikeudet kuin miehillä tasapuolisesti, vaikka miehillä onkin hieman enemmän ˹vastuuta˺. Ja Allah on Kaikkivoipa, Kaikkiviisas."}},{"verse":229,"commentary_en":"This verse explains how divorce works in Islam and sets clear boundaries to prevent its misuse. It allows a husband to divorce and take back his wife two times. However, if he divorces her a third time, the separation becomes final, and they cannot remarry unless certain conditions are met. The purpose of this rule is to protect both spouses, especially women, from emotional harm. Before Islam came, some men would repeatedly divorce and take back their wives out of anger, without any real intention to maintain a respectful and lasting relationship. This verse puts an end to that by limiting how often divorce can be reversed. It also teaches fairness when parting ways. A husband should not take back any gifts or dowry he gave his wife, even after divorce. Islam encourages kindness and respect, especially during difficult times like separation. There’s also a special case called khul’, where a woman can request a divorce if she feels the marriage cannot continue peacefully. In this case, she may offer compensation to the husband, like returning part of the dowry. This ensures that women also have a way out of unhappy marriages, while keeping the process fair for both sides. The verse ends by reminding people to respect these boundaries, as they are meant to ensure justice, dignity, and stability in family life.","commentary_fi":"Tämä jae selittää, miten avioero toimii islamissa, ja asettaa selvät rajat sen väärinkäytön estämiseksi. Aviomiehellä on oikeus erota ja ottaa vaimonsa takaisin kahdesti. Jos hän eroaa kolmannen kerran, ero on lopullinen, eikä avioliittoa voi jatkaa ilman erityisiä ehtoja. Tämä sääntö suojelee molempia osapuolia, erityisesti naisia, henkiseltä vahingolta. Ennen islamin tuloa jotkut miehet erosivat ja ottivat vaimonsa takaisin toistuvasti vihassa, ilman aitoa aikomusta ylläpitää kunnioittavaa ja kestävää suhdetta. Tämä jae estää sen rajoittamalla peruutettavien erojen määrää. Jaessa korostetaan myös oikeudenmukaisuutta eron hetkellä. Aviomiehen ei tule vaatia takaisin antamiaan lahjoja tai myötäjäisiä. Islam korostaa ystävällisyyttä ja kunnioitusta, erityisesti eron kaltaisissa vaikeissa tilanteissa. On olemassa myös erityistapaus nimeltä khul', jossa nainen voi pyytää avioeroa, jos kokee, ettei avioliittoa voi jatkaa rauhanomaisesti. Tällöin hän voi antaa miehelle korvauksen, esimerkiksi palauttaa osan myötäjäisistä. Näin myös naisella on mahdollisuus päästä pois epätyydyttävästä liitosta reilulla tavalla. Jae päättyy muistutukseen siitä, että näitä rajoja tulee kunnioittaa, sillä ne on asetettu oikeudenmukaisuuden, arvokkuuden ja perhe-elämän vakauden turvaamiseksi.","arabic":"الطَّلَاقُ مَرَّتَانِ ۖ فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ ۗ وَلَا يَحِلُّ لَكُمْ أَنْ تَأْخُذُوا مِمَّا آتَيْتُمُوهُنَّ شَيْئًا إِلَّا أَنْ يَخَافَا أَلَّا يُقِيمَا حُدُودَ اللَّهِ ۖ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ اللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا افْتَدَتْ بِهِ ۗ تِلْكَ حُدُودُ اللَّهِ فَلَا تَعْتَدُوهَا ۚ وَمَنْ يَتَعَدَّ حُدُودَ اللَّهِ فَأُولَٰئِكَ هُمُ الظَّالِمُونَ","commentary":"Tämä jae selittää, miten avioero toimii islamissa, ja asettaa selvät rajat sen väärinkäytön estämiseksi. Aviomiehellä on oikeus erota ja ottaa vaimonsa takaisin kahdesti. Jos hän eroaa kolmannen kerran, ero on lopullinen, eikä avioliittoa voi jatkaa ilman erityisiä ehtoja. Tämä sääntö suojelee molempia osapuolia, erityisesti naisia, henkiseltä vahingolta. Ennen islamin tuloa jotkut miehet erosivat ja ottivat vaimonsa takaisin toistuvasti vihassa, ilman aitoa aikomusta ylläpitää kunnioittavaa ja kestävää suhdetta. Tämä jae estää sen rajoittamalla peruutettavien erojen määrää. Jaessa korostetaan myös oikeudenmukaisuutta eron hetkellä. Aviomiehen ei tule vaatia takaisin antamiaan lahjoja tai myötäjäisiä. Islam korostaa ystävällisyyttä ja kunnioitusta, erityisesti eron kaltaisissa vaikeissa tilanteissa. On olemassa myös erityistapaus nimeltä khul', jossa nainen voi pyytää avioeroa, jos kokee, ettei avioliittoa voi jatkaa rauhanomaisesti. Tällöin hän voi antaa miehelle korvauksen, esimerkiksi palauttaa osan myötäjäisistä. Näin myös naisella on mahdollisuus päästä pois epätyydyttävästä liitosta reilulla tavalla. Jae päättyy muistutukseen siitä, että näitä rajoja tulee kunnioittaa, sillä ne on asetettu oikeudenmukaisuuden, arvokkuuden ja perhe-elämän vakauden turvaamiseksi.","translations":{"opas":"Tällainen koe-ero on sallittu kaksi kertaa; sitten joko pitäkää vaimo luonanne kunniallisesti tai antakaa hänen mennä runsain lahjoin. Teidän ei ole sallittu pidättää mitään siitä, mitä olette heille antaneet, paitsi jos molemmat pelkäävät, etteivät he (jatkuvassa yhdyselämässä) voi noudattaa Jumalan säädöksiä (vastenmielisyyden ja riitojen tähden). jos te todellakin pelkäätte, että kumpikaan ei voi (jatkuvassa yhdyselämässä) noudattaa Jumalan säädöksiä, niin ei ole synniksi kummallekaan, vaikka vaimo ostaa itsensä vapaaksi. Nämä ovat Jumalan säädöksiä, siksi älkää rikkoko niitä, sillä ne, jotka rikkovat Jumalan säädöksiä vastaan, ovat väärintekijöitä.","clear":"Avioero voidaan peruuttaa kahdesti, sitten aviomiehen on pidettävä ˹vaimonsa˺ kunnioittaen tai erottava ˹hänestä˺ armollisesti. Aviomiesten ei ole luvallista ottaa takaisin mitään vaimoilleen annettua myötäjäistä, ellei pari pelkää, ettei pysty pitämään kiinni Allahin asettamista rajoista. Joten jos pelkäätte, että he eivät pysty pitämään kiinni Allahin asettamista rajoista, ei ole moitittavaa, jos vaimo korvaa aviomiehelle saadakseen avioeron. Nämä ovat Allahin asettamat rajat, joten älkää ylittäkö niitä. Ja ne, jotka ylittävät Allahin asettamat rajat, ovat ˹todellisia˺ väärintekijöitä."}},{"verse":230,"commentary_en":"This verse explains what happens after a third divorce. If a husband divorces his wife for the third time, the separation becomes final and cannot be reversed. They are not allowed to remarry immediately. For the couple to marry again, the wife must first marry another man, and that second marriage must end naturally—either through divorce or the husband's passing. Only after this, and after completing her waiting period (iddah), can she remarry her first husband. This is only allowed if both sincerely believe they can now respect the boundaries set by Allah and live together in a healthy, committed way. This strict condition serves as a serious warning. It encourages couples to think carefully before choosing divorce, especially a second or third time. It helps prevent using divorce lightly or as a means of manipulation. The verse ends by reminding us that these are Allah’s clear boundaries, given for those who are willing to think and understand. It emphasizes the wisdom behind these limits and their role in protecting the dignity and stability of marriage.","commentary_fi":"Tässä jakeessa selitetään, mitä tapahtuu kolmannen avioeron jälkeen. Jos mies eroaa vaimostaan kolmannen kerran, ero on lopullinen eikä sitä voida peruuttaa. He eivät saa mennä uudelleen naimisiin heti. Jotta pari voisi avioitua uudelleen, vaimon on ensin mentävä naimisiin toisen miehen kanssa, ja tämän toisen avioliiton on päätyttävä luonnollisesti— joko eroon tai toisen aviomiehen kuolemaan. Vasta tämän jälkeen, ja kun vaimo on suorittanut odotusajan (‘iddah), hän voi avioitua ensimmäisen aviomiehensä kanssa uudelleen. Tämä on sallittua vain, jos molemmat uskovat vilpittömästi voivansa nyt kunnioittaa Allahin asettamia rajoja ja elää yhdessä terveessä ja sitoutuneessa suhteessa. Tämä tiukka ehto toimii vakavana varoituksena. Se rohkaisee pariskuntia harkitsemaan tarkasti ennen kuin he valitsevat eron, erityisesti toisen tai kolmannen kerran. Se estää avioeron käyttämistä kevyesti tai keinona manipuloida suhdetta. Jae päättyy muistutukseen siitä, että nämä ovat Allahin selkeitä rajoja, annettu niille, jotka haluavat ajatella ja ymmärtää. Se korostaa näiden sääntöjen viisautta ja niiden merkitystä avioliiton arvokkuuden ja vakauden suojelemisessa.","arabic":"فَإِنْ طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّىٰ تَنْكِحَ زَوْجًا غَيْرَهُ ۗ فَإِنْ طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَا أَنْ يَتَرَاجَعَا إِنْ ظَنَّا أَنْ يُقِيمَا حُدُودَ اللَّهِ ۗ وَتِلْكَ حُدُودُ اللَّهِ يُبَيِّنُهَا لِقَوْمٍ يَعْلَمُونَ","commentary":"Tässä jakeessa selitetään, mitä tapahtuu kolmannen avioeron jälkeen. Jos mies eroaa vaimostaan kolmannen kerran, ero on lopullinen eikä sitä voida peruuttaa. He eivät saa mennä uudelleen naimisiin heti. Jotta pari voisi avioitua uudelleen, vaimon on ensin mentävä naimisiin toisen miehen kanssa, ja tämän toisen avioliiton on päätyttävä luonnollisesti— joko eroon tai toisen aviomiehen kuolemaan. Vasta tämän jälkeen, ja kun vaimo on suorittanut odotusajan (‘iddah), hän voi avioitua ensimmäisen aviomiehensä kanssa uudelleen. Tämä on sallittua vain, jos molemmat uskovat vilpittömästi voivansa nyt kunnioittaa Allahin asettamia rajoja ja elää yhdessä terveessä ja sitoutuneessa suhteessa. Tämä tiukka ehto toimii vakavana varoituksena. Se rohkaisee pariskuntia harkitsemaan tarkasti ennen kuin he valitsevat eron, erityisesti toisen tai kolmannen kerran. Se estää avioeron käyttämistä kevyesti tai keinona manipuloida suhdetta. Jae päättyy muistutukseen siitä, että nämä ovat Allahin selkeitä rajoja, annettu niille, jotka haluavat ajatella ja ymmärtää. Se korostaa näiden sääntöjen viisautta ja niiden merkitystä avioliiton arvokkuuden ja vakauden suojelemisessa.","translations":{"opas":"Jos joku siis erottaa vaimonsa (kolmannen kerran), ei hänen ole sallittu jälkeenpäin ottaa vaimoa takaisin, ennenkuin tämä on ollut naimisissa toisen miehen kanssa; mutta jos tämä hylkää vaimon, niin eivät entiset aviopuolisot tee syntiä, jos he palaavat toistensa luo, mikäli uskovat voivansa noudattaa Jumalan säädöksiä. Nämä ovat Jumalan säädökset; Hän selittää ne ihmisille, joilla on ymmärrys.","clear":"Joten jos aviomies eroaa vaimostaan ˹kolme kertaa˺, niin hänelle ei ole luvallista mennä hänen kanssaan uudelleen naimisiin, ennen kuin tämä on mennyt naimisiin toisen miehen kanssa ja sitten eronnut. Sitten heillä on lupa yhdistyä, kunhan he tuntevat pystyvänsä pitämään kiinni Allahin asettamista rajoista. Nämä ovat Allahin asettamat rajat, jotka Hän tekee selväksi tietäville ihmisille."}},{"verse":231,"commentary_en":"This verse guides what should happen near the end of the waiting period (iddah) after a divorce. It tells husbands that when this period is almost over, they must make a sincere choice: either take their wife back into the marriage in a fair and respectful way, or let her go with kindness and dignity. This verse deals with a specific situation—when a man has divorced his wife, and her waiting period is almost complete. He still has time to either reconcile or part ways peacefully. The following verse (2:232) addresses what happens after the waiting period ends. Importantly, this verse strictly forbids taking the wife back just to cause harm or to manipulate her. Such behavior is unjust and considered a wrongdoing against oneself, as it goes against the guidance of Allah. The verse also gives a strong reminder: do not treat the commands of Allah lightly. It urges believers to be thankful for the blessings Allah has given them—especially the Qur’an and the wisdom it contains. These are meant to guide people toward fairness and integrity. It ends by reminding everyone that Allah is fully aware of all actions, encouraging sincerity, justice, and mindfulness in handling sensitive matters. This connects directly to the earlier verses about divorce, reinforcing that the process must be completed with honesty and respect.","commentary_fi":"Tämä jae antaa ohjeita siitä, mitä tulee tehdä, kun avioeron jälkeinen odotusaika (iddah) on loppumassa. Se kehottaa aviomiehiä tekemään selkeän ja vilpittömän päätöksen: joko ottaa vaimo takaisin avioliittoon oikeudenmukaisesti ja kunnioittavasti, tai päästää hänet menemään ystävällisesti ja arvokkaasti. Tässä jakeessa käsitellään tilannetta, jossa mies on eronnut vaimostaan, mutta tämän odotusaika on lähes lopussa. Miehellä on vielä mahdollisuus joko sovintoon tai hyvään eroamiseen. Seuraava jae (2:232) käsittelee tilannetta, kun odotusaika on jo päättynyt. Jae kieltää jyrkästi sen, että mies ottaisi vaimon takaisin vain vahingoittaakseen häntä tai saadakseen etua. Tällainen käytös on epäoikeudenmukaista ja vääryyttä omaa itseä kohtaan, sillä se rikkoo Allahin ohjeita. Jae antaa myös vakavan muistutuksen: Allahin käskyjä ei tule ottaa kevyesti. Se kehottaa olemaan kiitollinen niistä siunauksista, jotka Allah on antanut – erityisesti Koraanista ja sen sisältämästä viisaudesta, joka ohjaa ihmisiä oikeudenmukaisuuteen ja rehellisyyteen. Jae päättyy muistutukseen siitä, että Allah tietää kaiken, mitä teemme. Tämä kannustaa vilpittömyyteen, oikeudenmukaisuuteen ja harkintaan erityisesti näin herkissä asioissa. Jaen sanoma liittyy aiempiin avioeroa koskeviin jakeisiin ja korostaa, että prosessi on vietävä päätökseen rehellisesti ja kunnioittavasti.","arabic":"وَإِذَا طَلَّقْتُمُ النِّسَاءَ فَبَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ سَرِّحُوهُنَّ بِمَعْرُوفٍ ۚ وَلَا تُمْسِكُوهُنَّ ضِرَارًا لِتَعْتَدُوا ۚ وَمَنْ يَفْعَلْ ذَٰلِكَ فَقَدْ ظَلَمَ نَفْسَهُ ۚ وَلَا تَتَّخِذُوا آيَاتِ اللَّهِ هُزُوًا ۚ وَاذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ وَمَا أَنْزَلَ عَلَيْكُمْ مِنَ الْكِتَابِ وَالْحِكْمَةِ يَعِظُكُمْ بِهِ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ","commentary":"Tämä jae antaa ohjeita siitä, mitä tulee tehdä, kun avioeron jälkeinen odotusaika (iddah) on loppumassa. Se kehottaa aviomiehiä tekemään selkeän ja vilpittömän päätöksen: joko ottaa vaimo takaisin avioliittoon oikeudenmukaisesti ja kunnioittavasti, tai päästää hänet menemään ystävällisesti ja arvokkaasti. Tässä jakeessa käsitellään tilannetta, jossa mies on eronnut vaimostaan, mutta tämän odotusaika on lähes lopussa. Miehellä on vielä mahdollisuus joko sovintoon tai hyvään eroamiseen. Seuraava jae (2:232) käsittelee tilannetta, kun odotusaika on jo päättynyt. Jae kieltää jyrkästi sen, että mies ottaisi vaimon takaisin vain vahingoittaakseen häntä tai saadakseen etua. Tällainen käytös on epäoikeudenmukaista ja vääryyttä omaa itseä kohtaan, sillä se rikkoo Allahin ohjeita. Jae antaa myös vakavan muistutuksen: Allahin käskyjä ei tule ottaa kevyesti. Se kehottaa olemaan kiitollinen niistä siunauksista, jotka Allah on antanut – erityisesti Koraanista ja sen sisältämästä viisaudesta, joka ohjaa ihmisiä oikeudenmukaisuuteen ja rehellisyyteen. Jae päättyy muistutukseen siitä, että Allah tietää kaiken, mitä teemme. Tämä kannustaa vilpittömyyteen, oikeudenmukaisuuteen ja harkintaan erityisesti näin herkissä asioissa. Jaen sanoma liittyy aiempiin avioeroa koskeviin jakeisiin ja korostaa, että prosessi on vietävä päätökseen rehellisesti ja kunnioittavasti.","translations":{"opas":"Ja kun olette erottaneet vaimon ja tämä on odottanut määrätyn aikansa, niin joko pitäkää hänet luonanne kunniallisesti tai antakaa hänen mennä sovinnossa. Älkää pidättäkö häntä väkivalloin eikä tehden vääryyttä, sillä niin menettelevä tekee väärin omaa sieluaan kohtaan. Älkää pilkatko Jumalan tunnusmerkkejä, vaan muistakaa osaksenne tullutta Jumalan armoa, älkääkä unohtako Pyhää kirjaa ja viisautta, jonka Hän on antanut teille varoittaakseen teitä. Pelätkää Jumalaa ja tietäkää, että Jumala on kaikesta selvillä.","clear":"Kun avioeroatte naisia ja he ovat ˹melkein˺ saavuttaneet odotusaikansa lopun, joko pitäkää heidät kunniallisesti tai päästäkää heidät menemään kunniallisesti. Älkää kuitenkaan pitäkö heitä ˹vain˺ vahingoittaaksenne heitä ˹tai˺ käyttääksenne heitä hyväksi. Joka niin tekee, tekee varmasti väärin omalle sielulleen. Älkää suhtautuko Allahin ilmoituksiin kevyesti. Muistakaa Allahin suosionosoitukset teitä kohtaan sekä Kirja ja viisaus, jonka Hän on lähettänyt johdatukseksenne. Olkaa tietoisia Allahista ja tietäkää, että Allahilla on ˹täydellinen˺ tieto kaikista asioista."}},{"verse":232,"commentary_en":"This verse follows the previous guidance about the end of the waiting period (iddah) after divorce. It shifts focus to the woman’s family or guardians. If a divorced woman and her former husband mutually wish to remarry on respectful and honorable terms, her guardians are instructed not to prevent it. This command is directed toward those who truly believe in Allah and the Last Day, reminding them that supporting such a decision reflects sincere faith. The verse highlights that allowing the couple to reunite is the most upright and pure choice. It ends by affirming that Allah knows best, even when people may not fully understand the wisdom behind His guidance.","commentary_fi":"Tämä jae jatkaa edellisen ohjeen linjaa koskien odotusajan (iddah) päättymistä avioeron jälkeen. Tässä keskitytään naisen perheeseen tai holhoojiin. Jos eronnut nainen ja hänen entinen aviomiehensä haluavat vilpittömästi mennä uudelleen naimisiin kunniallisesti ja oikeudenmukaisesti, perheen ei tule estää tätä. Tämä ohje on suunnattu niille, jotka uskovat vilpittömästi Allahiin ja Viimeiseen päivään. Se muistuttaa, että tällaisen päätöksen tukeminen on osoitus aidosta uskosta. Jae korostaa, että parin salliminen palata yhteen on puhtain ja oikeamielisin ratkaisu. Jae päättyy toteamalla, että Allah tietää parhaiten, vaikka ihmiset eivät aina ymmärrä Hänen viisauttaan.","arabic":"وَإِذَا طَلَّقْتُمُ النِّسَاءَ فَبَلَغْنَ أَجَلَهُنَّ فَلَا تَعْضُلُوهُنَّ أَنْ يَنْكِحْنَ أَزْوَاجَهُنَّ إِذَا تَرَاضَوْا بَيْنَهُمْ بِالْمَعْرُوفِ ۗ ذَٰلِكَ يُوعَظُ بِهِ مَنْ كَانَ مِنْكُمْ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۗ ذَٰلِكُمْ أَزْكَىٰ لَكُمْ وَأَطْهَرُ ۗ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ","commentary":"Tämä jae jatkaa edellisen ohjeen linjaa koskien odotusajan (iddah) päättymistä avioeron jälkeen. Tässä keskitytään naisen perheeseen tai holhoojiin. Jos eronnut nainen ja hänen entinen aviomiehensä haluavat vilpittömästi mennä uudelleen naimisiin kunniallisesti ja oikeudenmukaisesti, perheen ei tule estää tätä. Tämä ohje on suunnattu niille, jotka uskovat vilpittömästi Allahiin ja Viimeiseen päivään. Se muistuttaa, että tällaisen päätöksen tukeminen on osoitus aidosta uskosta. Jae korostaa, että parin salliminen palata yhteen on puhtain ja oikeamielisin ratkaisu. Jae päättyy toteamalla, että Allah tietää parhaiten, vaikka ihmiset eivät aina ymmärrä Hänen viisauttaan.","translations":{"opas":"Ja kun olette eronneet vaimoista ja nämä ovat odottaneet määrätyn aikansa, älkää estäkö heitä menemästä naimisiin uusien miestensä kanssa, jos he keskenään ovat siitä sopineet, kuten kohtuullista on. Tämä on varoitus sille teistä, joka uskoo Jumalaan ja Viimeiseen päivään. Tämä on sopivinta ja puhtainta teille itsellenne. Sen Jumala tietää; te ette tiedä.","clear":"Kun olette avioeronneet naisista ja he ovat saavuttaneet odotusaikansa lopun, älkää estäkö heitä menemästä uudelleen naimisiin entisten aviomiestensä kanssa, jos he pääsevät kunnialliseen sopimukseen. Tämä on säädetty jokaiselle, joka uskoo Allahin ja Viimeiseen Päivään. Tämä on puhtaampaa ja kunnioittavampaa teille. Allah tietää, mutta te ette tiedä."}},{"verse":233,"commentary_en":"This verse addresses the responsibilities of parents after divorce, focusing on the care of young children—especially breastfeeding. It says that mothers may nurse their children for up to two full years if they choose to complete the full period of breastfeeding. During this time, the father is responsible for supporting the mother by providing her with food and clothing in a fair and appropriate way. The verse sets a general principle: no one should be burdened beyond their capacity, and neither parent should suffer unfairly because of their child. If the father has passed away, his legal heir must take over this responsibility. Parents are also allowed to make mutual decisions based on what is best for the child. If, after discussion, they agree to wean the child before two years, it is permitted. Likewise, hiring a wet nurse is allowed, as long as she is compensated fairly. This verse places the child's well-being at the center of all decisions and concludes with a reminder to remain mindful of Allah, who sees all that we do. It encourages fairness, cooperation, and integrity in parenting responsibilities.","commentary_fi":"Tässä jakeessa siirrytään käsittelemään vanhempien vastuuta avioeron jälkeen, erityisesti pienen lapsen hoitoa ja imetystä. Jae sanoo, että äidit voivat imettää lapsiaan jopa kahden vuoden ajan, jos he haluavat täydentää koko imetyskauden. Tänä aikana isä on velvollinen huolehtimaan äidin toimeentulosta tarjoamalla hänelle ruokaa ja vaatteita kohtuullisella ja oikeudenmukaisella tavalla. Jae asettaa tärkeän periaatteen: ketään ei tule rasittaa yli hänen kykynsä, eikä kumpikaan vanhemmista saa joutua epäoikeudenmukaisesti kärsimään lapsen vuoksi. Jos isä on kuollut, hänen perillisensä ottaa vastuun äidin tukemisesta lapsen hyvinvoinnin vuoksi. Vanhemmat voivat myös sopia yhdessä lapsen parhaaksi. Jos he yhteisymmärryksessä päättävät vieroittaa lapsen ennen kahta vuotta, se on sallittua. Samoin on sallittua palkata imettäjä, kunhan hänelle maksetaan sovittu korvaus reilusti. Jae asettaa lapsen hyvinvoinnin kaiken keskiöön ja päättyy muistutukseen olla tietoinen Allahista, joka näkee kaiken. Se kehottaa hoitamaan vanhemmuuden velvollisuudet oikeudenmukaisesti ja vastuullisesti.","arabic":"وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ ۖ لِمَنْ أَرَادَ أَنْ يُتِمَّ الرَّضَاعَةَ ۚ وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ ۚ لَا تُكَلَّفُ نَفْسٌ إِلَّا وُسْعَهَا ۚ لَا تُضَارَّ وَالِدَةٌ بِوَلَدِهَا وَلَا مَوْلُودٌ لَهُ بِوَلَدِهِ ۚ وَعَلَى الْوَارِثِ مِثْلُ ذَٰلِكَ ۗ فَإِنْ أَرَادَا فِصَالًا عَنْ تَرَاضٍ مِنْهُمَا وَتَشَاوُرٍ فَلَا جُنَاحَ عَلَيْهِمَا ۗ وَإِنْ أَرَدْتُمْ أَنْ تَسْتَرْضِعُوا أَوْلَادَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُمْ مَا آتَيْتُمْ بِالْمَعْرُوفِ ۗ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ","commentary":"Tässä jakeessa siirrytään käsittelemään vanhempien vastuuta avioeron jälkeen, erityisesti pienen lapsen hoitoa ja imetystä. Jae sanoo, että äidit voivat imettää lapsiaan jopa kahden vuoden ajan, jos he haluavat täydentää koko imetyskauden. Tänä aikana isä on velvollinen huolehtimaan äidin toimeentulosta tarjoamalla hänelle ruokaa ja vaatteita kohtuullisella ja oikeudenmukaisella tavalla. Jae asettaa tärkeän periaatteen: ketään ei tule rasittaa yli hänen kykynsä, eikä kumpikaan vanhemmista saa joutua epäoikeudenmukaisesti kärsimään lapsen vuoksi. Jos isä on kuollut, hänen perillisensä ottaa vastuun äidin tukemisesta lapsen hyvinvoinnin vuoksi. Vanhemmat voivat myös sopia yhdessä lapsen parhaaksi. Jos he yhteisymmärryksessä päättävät vieroittaa lapsen ennen kahta vuotta, se on sallittua. Samoin on sallittua palkata imettäjä, kunhan hänelle maksetaan sovittu korvaus reilusti. Jae asettaa lapsen hyvinvoinnin kaiken keskiöön ja päättyy muistutukseen olla tietoinen Allahista, joka näkee kaiken. Se kehottaa hoitamaan vanhemmuuden velvollisuudet oikeudenmukaisesti ja vastuullisesti.","translations":{"opas":"Äidit imettäkööt lapsiaan kahden täyden vuoden ajan, jos isä tahtoo imettämiskauden tulevan umpeen. Isän velvollisuus on ruokkia ja pukea heidät, kuten kohtuullista on: ketään ei ole velvoitettava yli hänen mahdollisuuksiensa, äidin ei tarvitse kärsiä mitään pakkoa lapsensa tähden, eikä isän lapsensa tähden, ja sama koskee isän perijää. Mutta jos he molemminpuolisen sopimuksen ja neuvottelujen jälkeen sopivat lapsen vieroittamisesta, niin siinä ei kumpikaan tee mitään syntiä. Ja jos haluatte antaa vieraan imettää lapsianne, niin ette syntiä tee, kun maksatte mitä teidän kohtuuden mukaisesti on suoritettava; pelätkää Jumalaa ja tietäkää, että Jumala näkee teidän tekonne.","clear":"˹Avioerossa olevat˺ äidit imettävät jälkeläisiään kaksi täyttä vuotta niiden osalta, jotka haluavat suorittaa imetyksen ˹loppuun˺. Lapsen isä huolehtii kohtuullisesta elatuksesta ja vaatetuksesta äidille ˹tuona aikana˺. Ketään ei velvoiteta enempään kuin mihin hän pystyy. Äitiä tai isää ei saa panna kärsimään lapsensa vuoksi. ˹Isän˺ perilliset ovat saman velvollisuuden alaisia. Mutta jos molemmat osapuolet päättävät – keskinäisen neuvottelun ja suostumuksen jälkeen – vieroittaa lapsen, niin heitä ei ole syyttäminen. Ja jos päätätte, että lastanne hoitaa imettäjä, se on sallittua, kunhan maksatte oikeudenmukaisesti. Olkaa tietoisia Allahista ja tietäkää, että Allah näkee kaiken, mitä te teette."}},{"verse":234,"commentary_en":"Moving from divorce to the situation of widows, this verse establishes a waiting period for women whose husbands have passed away. They are to wait for four months and ten days. This waiting period serves multiple purposes, including ascertaining whether the widow is pregnant and providing a period of mourning and adjustment. Once this specific period is over, the verse states that there is no blame upon the guardians or community if the widow then makes decisions about her life, such as remarrying, in a just and appropriate manner according to Islamic teachings. This instruction helped abolish harsh pre-Islamic customs regarding widows. The verse ends by reminding everyone that Allah is fully aware of all actions, emphasizing accountability.","commentary_fi":"Siirtyen avieroista leskien tilanteeseen, tämä jae määrittää odotusajan naisille, joiden aviomiehet ovat kuolleet. Heidän tulee odottaa neljä kuukautta ja kymmenen päivää. Tämä odotusaika palvelee useita tarkoituksia, mukaan lukien varmistaa, onko leski raskaana, ja antaa aikaa surulle ja sopeutumiselle. Kun tämä tietty aika on ohi, jae toteaa, ettei ole moitetta huoltajille tai yhteisölle, jos leski sen jälkeen tekee päätöksiä elämästään, kuten uudelleen avioituminen, oikeudenmukaisella ja asianmukaisella tavalla islamilaisten opetusten mukaan. Tämä ohje auttoi poistamaan ankarat esiintilaamiset tavat leskiä kohtaan. Jae päättyy muistutukseen siitä, että Allah on täysin tietoinen kaikista teoista, korostaen vastuullisuutta.","arabic":"وَالَّذِينَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُونَ أَزْوَاجًا يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِي أَنْفُسِهِنَّ بِالْمَعْرُوفِ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ","commentary":"Siirtyen avieroista leskien tilanteeseen, tämä jae määrittää odotusajan naisille, joiden aviomiehet ovat kuolleet. Heidän tulee odottaa neljä kuukautta ja kymmenen päivää. Tämä odotusaika palvelee useita tarkoituksia, mukaan lukien varmistaa, onko leski raskaana, ja antaa aikaa surulle ja sopeutumiselle. Kun tämä tietty aika on ohi, jae toteaa, ettei ole moitetta huoltajille tai yhteisölle, jos leski sen jälkeen tekee päätöksiä elämästään, kuten uudelleen avioituminen, oikeudenmukaisella ja asianmukaisella tavalla islamilaisten opetusten mukaan. Tämä ohje auttoi poistamaan ankarat esiintilaamiset tavat leskiä kohtaan. Jae päättyy muistutukseen siitä, että Allah on täysin tietoinen kaikista teoista, korostaen vastuullisuutta.","translations":{"opas":"Jos jotkut keskuudestanne kuolevat ja jättävät vaimoja, niin odottakoot nämä neljä kuukautta ja kymmenen päivää omissa oloissaan; mutta kun ovat odottaneet määrätyn aikansa, niin ei teille lueta synniksi sitä, miten he säädyllisesti itseensä nähden menettelevät. Jumala on tietoinen teidän teoistanne.","clear":"Mitä niihin teistä tulee, jotka kuolevat ja jättävät jälkeensä leskiä, he noudattakoot neljän kuukauden ja kymmenen päivän odotusaikaa. Kun he ovat saavuttaneet tämän ajanjakson lopun, silloin te ette ole vastuussa siitä, mitä he päättävät itselleen kohtuullisella tavalla. Ja Allah on tietoinen kaikesta, mitä teette."}},{"verse":235,"commentary_en":"This verse continues addressing the situation of widows after the death of their husbands, specifically regarding marriage proposals. It states that there is no blame on someone who hints at a marriage offer after the widow’s waiting period has ended, or even if they merely keep such an intention in their heart during the waiting period. Allah is fully aware of what people think and feel. However, the verse strictly prohibits making a secret or binding marriage agreement during the waiting period or finalizing the marriage before that time is complete. Any interaction should be conducted respectfully and honorably. It emphasizes the need to remain mindful of Allah, who knows what is in people’s hearts, and reminds believers that Allah is Most Forgiving and Most Forbearing. The verse encourages adherence to these guidelines while recognizing human emotions.","commentary_fi":"Tämä jae jatkaa leskien tilanteen käsittelyä aviomiehen kuoleman jälkeen, erityisesti avioliittotarjousten osalta. Jae sanoo, ettei ole moitittavaa siinä, jos joku vihjaa avioliittoa leskelle tämän odotusajan jälkeen, tai jos henkilö vain pitää tällaisen aikomuksen sydämessään odotusajan aikana. Allah tietää ihmisten ajatukset ja tunteet. Silti jae kieltää selvästi salaisten tai sitovien avioliittosopimusten tekemisen odotusaikana sekä avioliiton solmimisen ennen kuin tämä aika on päättynyt. Kaiken viestinnän tulee tapahtua kunnioittavasti ja arvokkaasti. Jae korostaa Allahin tietoisuutta ihmisten sisimmistä tunteista ja muistuttaa, että Allah on Anteeksiantava ja Lempeä. Se kehottaa noudattamaan näitä ohjeita samalla kun tunnistaa inhimillisten tunteiden olemassaolon.","arabic":"وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُمْ بِهِ مِنْ خِطْبَةِ النِّسَاءِ أَوْ أَكْنَنْتُمْ فِي أَنْفُسِكُمْ ۚ عَلِمَ اللَّهُ أَنَّكُمْ سَتَذْكُرُونَهُنَّ وَلَٰكِنْ لَا تُوَاعِدُوهُنَّ سِرًّا إِلَّا أَنْ تَقُولُوا قَوْلًا مَعْرُوفًا ۚ وَلَا تَعْزِمُوا عُقْدَةَ النِّكَاحِ حَتَّىٰ يَبْلُغَ الْكِتَابُ أَجَلَهُ ۚ وَاعْلَمُوا أَنَّ اللَّهَ يَعْلَمُ مَا فِي أَنْفُسِكُمْ فَاحْذَرُوهُ ۚ وَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ حَلِيمٌ","commentary":"Tämä jae jatkaa leskien tilanteen käsittelyä aviomiehen kuoleman jälkeen, erityisesti avioliittotarjousten osalta. Jae sanoo, ettei ole moitittavaa siinä, jos joku vihjaa avioliittoa leskelle tämän odotusajan jälkeen, tai jos henkilö vain pitää tällaisen aikomuksen sydämessään odotusajan aikana. Allah tietää ihmisten ajatukset ja tunteet. Silti jae kieltää selvästi salaisten tai sitovien avioliittosopimusten tekemisen odotusaikana sekä avioliiton solmimisen ennen kuin tämä aika on päättynyt. Kaiken viestinnän tulee tapahtua kunnioittavasti ja arvokkaasti. Jae korostaa Allahin tietoisuutta ihmisten sisimmistä tunteista ja muistuttaa, että Allah on Anteeksiantava ja Lempeä. Se kehottaa noudattamaan näitä ohjeita samalla kun tunnistaa inhimillisten tunteiden olemassaolon.","translations":{"opas":"Eikä teille lueta synniksi, jos näille naisille naimatarjouksenne esitätte julkisesti tai sitä mielessänne haudotte. Jumala tietää, että te heitä ajattelette, mutta älkää kuitenkaan heidän kanssaan salassa jutelko, ellette lausu tavanmukaista naimatarjousta. Älkää solmiko aviollista liittoa, ennenkuin määrätty aika on umpeen kulunut, ja tietäkää, että Jumala näkee, mitä teillä on mielessä. Sentähden kavahtakaa Häntä ja tietäkää, että Jumala on armahtavainen ja lempeä.","clear":"Teitä ei soimata siitä, että hienovaraisesti osoitatte kiinnostusta ˹eronneisiin tai leskeksi jääneisiin˺ naisiin tai piilotatte ˹aikeen˺ sydämessänne. Allah tietää, että harkitsette heitä ˹avioliittoon˺. Mutta älkää tehkö heidän kanssaan salaista sitoumusta – voitte vain osoittaa kiinnostusta heitä kohtaan asianmukaisesti. Älkää sitoutuko avioliittoon ennen kuin odotusaika päättyy. Tietäkää, että Allah on tietoinen siitä, mitä sydämessänne on, joten olkaa varovaisia Hänen suhteen. Ja tietäkää, että Allah on Kaikkialla Antava, Erittäin Kärsivällinen."}},{"verse":236,"commentary_en":"This verse deals with a situation where a couple is formally married, but the marriage ends in divorce before they have been intimate, and before a dowry (mahr) has been fixed. In such a case, the Qur'an states that there is no sin on the man for initiating the divorce. However, to uphold dignity and kindness, he is still encouraged to offer a parting gift to the woman. The amount of this gift is not fixed; it depends on what he can afford—whether he is wealthy or has limited means. This gesture shows compassion and ensures that even in brief or incomplete marriages, the woman is not left without honor or support. It also encourages men to act with fairness, generosity, and moral integrity.","commentary_fi":"Tämä jae käsittelee tilannetta, jossa pari on solminut avioliiton, mutta ero tapahtuu ennen kuin he ovat olleet fyysisesti yhdessä ja ennen kuin myötäjäisistä (mahr) on sovittu. Tällöin miestä ei moitita itse avioerosta, mutta hänen tulee silti antaa naiselle eroajalla lahja. Tämän lahjan määrä ei ole tarkkaan määrätty, vaan sen tulee perustua hänen varallisuuteensa – varakas antaa varallisuutensa mukaisesti, ja vähävarainen kykyjensä mukaan. Tämä ele osoittaa myötätuntoa ja varmistaa, että nainen saa arvon ja kunnioituksen, vaikka avioliitto olisi päättynyt varhaisessa vaiheessa. Samalla se rohkaisee miehiä toimimaan oikeudenmukaisesti, anteliaasti ja hyvällä moraalilla.","arabic":"لَا جُنَاحَ عَلَيْكُمْ إِنْ طَلَّقْتُمُ النِّسَاءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا لَهُنَّ فَرِيضَةً ۚ وَمَتِّعُوهُنَّ عَلَى الْمُوسِعِ قَدَرُهُ وَعَلَى الْمُقْتِرِ قَدَرُهُ مَتَاعًا بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُحْسِنِينَ","commentary":"Tämä jae käsittelee tilannetta, jossa pari on solminut avioliiton, mutta ero tapahtuu ennen kuin he ovat olleet fyysisesti yhdessä ja ennen kuin myötäjäisistä (mahr) on sovittu. Tällöin miestä ei moitita itse avioerosta, mutta hänen tulee silti antaa naiselle eroajalla lahja. Tämän lahjan määrä ei ole tarkkaan määrätty, vaan sen tulee perustua hänen varallisuuteensa – varakas antaa varallisuutensa mukaisesti, ja vähävarainen kykyjensä mukaan. Tämä ele osoittaa myötätuntoa ja varmistaa, että nainen saa arvon ja kunnioituksen, vaikka avioliitto olisi päättynyt varhaisessa vaiheessa. Samalla se rohkaisee miehiä toimimaan oikeudenmukaisesti, anteliaasti ja hyvällä moraalilla.","translations":{"opas":"Ette tee mitään syntiä, jos hylkäätte vaimon, johon ette ole koskeneet tai jolle ette ole suorittaneet huomenlahjaksi määrättyä osaa. Mutta huolehtikaa sellaisten tarpeista (rikas varojensa mukaan ja köyhä varojensa mukaan), niinkuin on katsottava kohtuulliseksi niille, jotka hyvää tekevät.","clear":"Ei ole moitittavaa, jos erotatte naiset ennen avioliiton täyttymistä tai myötäjäisten sopimista. Mutta antakaa heille ˹sopiva˺ korvaus – rikkaat varojensa mukaan ja köyhät varojensa mukaan. Kohtuullinen korvaus on velvollisuus hyvää tekeville."}},{"verse":237,"commentary_en":"This verse continues from the previous one, addressing the case where a couple is divorced before consummation, but a dowry (mahr) was already agreed upon. In such a case, the woman is entitled to half of the agreed amount. However, this can be adjusted through generosity—either the woman may choose to give up her share, or the one who holds authority over the marriage bond may choose to relinquish it. The verse praises such acts of kindness as closer to righteousness. It ends by encouraging both sides to act with grace and not forget generosity, even in separation, and reminds that Allah is fully aware of all actions.","commentary_fi":"Tämä jae jatkaa edellisestä ja käsittelee tilannetta, jossa pari eroaa ennen avioliiton täyttymistä, mutta myötäjäisestä (mahr) on jo sovittu. Tässä tapauksessa nainen on oikeutettu puoleen sovitusta summasta. Tätä voi kuitenkin muuttaa anteliaisuus—nainen voi luopua osuudestaan, tai se, jolla on valta avioliittosidoksen suhteen, voi luopua siitä. Jae kehuu tällaista ystävällisyyttä ja pitää sitä lähempänä hurskautta. Lopuksi muistutetaan molempia osapuolia toimimaan armollisesti ja muistamaan anteliaisuus myös erotilanteessa, sekä että Allah tietää kaiken, mitä teemme.","arabic":"وَإِنْ طَلَّقْتُمُوهُنَّ مِنْ قَبْلِ أَنْ تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةً فَنِصْفُ مَا فَرَضْتُمْ إِلَّا أَنْ يَعْفُونَ أَوْ يَعْفُوَ الَّذِي بِيَدِهِ عُقْدَةُ النِّكَاحِ ۚ وَأَنْ تَعْفُوا أَقْرَبُ لِلتَّقْوَىٰ ۚ وَلَا تَنْسَوُا الْفَضْلَ بَيْنَكُمْ ۚ إِنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ","commentary":"Tämä jae jatkaa edellisestä ja käsittelee tilannetta, jossa pari eroaa ennen avioliiton täyttymistä, mutta myötäjäisestä (mahr) on jo sovittu. Tässä tapauksessa nainen on oikeutettu puoleen sovitusta summasta. Tätä voi kuitenkin muuttaa anteliaisuus—nainen voi luopua osuudestaan, tai se, jolla on valta avioliittosidoksen suhteen, voi luopua siitä. Jae kehuu tällaista ystävällisyyttä ja pitää sitä lähempänä hurskautta. Lopuksi muistutetaan molempia osapuolia toimimaan armollisesti ja muistamaan anteliaisuus myös erotilanteessa, sekä että Allah tietää kaiken, mitä teemme.","translations":{"opas":"Jos te eroatte heistä, ennenkuin olette heihin koskeneet, mutta olette suorittaneet määrätyn osuuden heille, niin kuuluu heille puolet siitä, mitä olette suorittaneet, jolleivät he itse tai mies, jonka toimesta avioliitto solmittiin, tee jotain myönnytystä. Tekemällä myönnytyksiä lähestytte totista jumalisuutta; älkääkä unohtako olla jalomielisiä toisianne kohtaan. Jumala näkee, mitä te teette.","clear":"Ja jos erotatte heidät ennen avioliiton täyttymistä, mutta myötäjäisistä on päätetty, maksakaa puolet myötäjäisistä, ellei vaimo armollisesti luovu siitä tai aviomies armollisesti maksa täyttä summaa. Armeliaisuus on lähempänä vanhurskautta. Älkääkä unohtako ystävällisyyttä keskenänne. Totisesti, Allah näkee kaiken, mitä teette."}},{"verse":238,"commentary_en":"This verse shifts focus from family matters to the fundamental act of worship in Islam: prayer. It commands believers to be diligent and consistent in observing their prayers, singling out the \"Middle Prayer\" for special emphasis (which Muslims understand refers to the 'Asr or mid-afternoon prayer, a time when people might be easily distracted). It instructs believers to stand before Allah in prayer with a state of devout obedience and humility. This interjection of prayer within verses about family law highlights that all aspects of a Muslim's life, including personal and social relations, are connected to the worship and remembrance of Allah, showing that adherence to these divine laws is itself an act of devotion.","commentary_fi":"Tämä jae siirtää huomion perheasioista islamin perustavanlaatuiseen palvontatekoon: rukoukseen. Se käskee uskovaisia olemaan ahkeria ja johdonmukaisia rukoustensa noudattamisessa, erityisesti korostaen \"keskirukousta\" (jonka muslimit ymmärtävät viittaavan 'Asr- tai iltapäivän rukoukseen, aikaan, jolloin ihmiset saattavat helposti häiriytyä). Se kehottaa uskovaisia seisomaan Allahin edessä rukouksessa antaumuksellisessa kuuliaisuuden ja nöyryyden tilassa. Tämä rukouksen lisääminen perhelakia käsittelevien jakeiden keskelle korostaa, että muslimin elämän kaikkiin puoliin, mukaan lukien henkilökohtaiset ja sosiaaliset suhteet, liittyy Allahin palvontaan ja muistamiseen, osoittaen, että näiden jumalallisten lakien noudattaminen on itsessään antaumuksen teko.","arabic":"حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ","commentary":"Tämä jae siirtää huomion perheasioista islamin perustavanlaatuiseen palvontatekoon: rukoukseen. Se käskee uskovaisia olemaan ahkeria ja johdonmukaisia rukoustensa noudattamisessa, erityisesti korostaen \"keskirukousta\" (jonka muslimit ymmärtävät viittaavan 'Asr- tai iltapäivän rukoukseen, aikaan, jolloin ihmiset saattavat helposti häiriytyä). Se kehottaa uskovaisia seisomaan Allahin edessä rukouksessa antaumuksellisessa kuuliaisuuden ja nöyryyden tilassa. Tämä rukouksen lisääminen perhelakia käsittelevien jakeiden keskelle korostaa, että muslimin elämän kaikkiin puoliin, mukaan lukien henkilökohtaiset ja sosiaaliset suhteet, liittyy Allahin palvontaan ja muistamiseen, osoittaen, että näiden jumalallisten lakien noudattaminen on itsessään antaumuksen teko.","translations":{"opas":"Pitäkää vaari rukouksistanne, myös keskimmäisestä, ja olkaa hartaina Jumalan edessä.","clear":"Noudattakaa rukouksia, erityisesti keskimmäistä rukousta, ja olkaa hartaita Allahille."}},{"verse":239,"commentary_en":"Continuing the theme of prayer from the previous verse, this verse offers guidance for performing prayer during times of fear or danger, such as when facing an enemy. It allows flexibility—permitting prayer while walking or riding, in any posture that is safe and practical under the circumstances, even if it deviates from the usual form. Once safety is restored, however, believers are instructed to return to performing prayer fully and properly, in the complete manner Allah has taught. This underscores the constant importance of prayer and remembrance of Allah in all conditions—from peace to peril—while also acknowledging human limitations and the mercy built into divine guidance.","commentary_fi":"Jatkaen edellisen jakeen rukousteemaa, tämä jae antaa ohjeita rukouksen suorittamiseen pelon tai vaaran aikana, kuten vihollisen kohtaamisen yhteydessä. Se sallii joustavuuden—rukouksen voi suorittaa kävellessä tai ratsastaessa, missä tahansa asennossa, joka on olosuhteisiin nähden turvallinen ja käytännöllinen, vaikka se poikkeaisi tavallisesta rukoustavasta. Kun turvallisuus palautuu, uskovia kehotetaan palaamaan rukoukseen täydellisesti ja oikein, sillä tavoin kuin Allah on sen opettanut. Tämä korostaa rukouksen ja Allahin muistamisen jatkuvaa merkitystä kaikissa olosuhteissa—rauhassa ja vaarassa—sekä tunnustaa inhimilliset rajoitukset ja Allahin johdatukseen sisältyvän armon.","arabic":"فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًا ۖ فَإِذَا أَمِنْتُمْ فَاذْكُرُوا اللَّهَ كَمَا عَلَّمَكُمْ مَا لَمْ تَكُونُوا تَعْلَمُونَ","commentary":"Jatkaen edellisen jakeen rukousteemaa, tämä jae antaa ohjeita rukouksen suorittamiseen pelon tai vaaran aikana, kuten vihollisen kohtaamisen yhteydessä. Se sallii joustavuuden—rukouksen voi suorittaa kävellessä tai ratsastaessa, missä tahansa asennossa, joka on olosuhteisiin nähden turvallinen ja käytännöllinen, vaikka se poikkeaisi tavallisesta rukoustavasta. Kun turvallisuus palautuu, uskovia kehotetaan palaamaan rukoukseen täydellisesti ja oikein, sillä tavoin kuin Allah on sen opettanut. Tämä korostaa rukouksen ja Allahin muistamisen jatkuvaa merkitystä kaikissa olosuhteissa—rauhassa ja vaarassa—sekä tunnustaa inhimilliset rajoitukset ja Allahin johdatukseen sisältyvän armon.","translations":{"opas":"Jos teillä on vaaran pelko, niin rukoilkaa vaikkapa käydessänne tai ratsun selässä, mutta kun olette turvassa, niin rukoilkaa Jumalaa siten, kuin Hän on opettanut teille sen, mitä ette ennen tietäneet.","clear":"Jos olette vaarassa, rukoilkaa jalkaisin tai ratsastaessanne. Mutta kun olette turvassa, muistakaa Allahia siitä, että Hän on opettanut teille sellaista, mitä ette tienneet."}},{"verse":240,"commentary_en":"This verse returns to the subject of widows and outlines a compassionate directive for husbands nearing death. It instructs such men to make a will that provides their wives with maintenance and residence for one year. This bequest offered widows the right to stay in their deceased husband's home without being evicted, supported financially for that time. However, if the widow chooses to leave the residence after completing her waiting period—four months and ten days as mandated in verse 2:234—then there is no blame on the family or community for what she lawfully chooses to do with her life. This verse establishes two layers of guidance. The first is obligatory: the widow must observe a waiting period of four months and ten days. The second is a recommended provision—staying for up to a year if the husband has bequeathed it. This one-year stay is not compulsory, and the widow is free to leave earlier if she wishes, as long as her choice is made freely and without pressure. The instruction reflects both compassion and flexibility in addressing the widow’s emotional and practical needs. It’s also important to note that this guidance applies when the home has not already been formally inherited by the widow under the inheritance laws described in Surah 4:12. If she has inherited the home or a share in it, then her right to residence would follow from that legal ownership. The verse ends by affirming that Allah is Exalted in Might and Wise, highlighting that these rulings are not arbitrary, but are based on divine wisdom and mercy. They aim to balance justice, emotional well-being, and practical support for those dealing with loss.","commentary_fi":"Tässä jakeessa palataan leskien asemaan ja annetaan myötätuntoinen ohje niille miehille, jotka ovat kuoleman partaalla. Jakeessa käsketään heitä laatimaan testamentti, jossa määrätään, että vaimo saa elatusta ja asuinpaikan vuoden ajaksi. Tämä oli leskelle oikeus jäädä edesmenneen aviomiehensä kotiin asumaan ilman, että häntä ajetaan pois, ja saada taloudellista tukea tuon vuoden ajan. Jos leski kuitenkin päättää lähteä kodista odotusajan jälkeen — joka on neljä kuukautta ja kymmenen päivää, kuten jakeessa 2:234 mainitaan — ei ole moitittavaa hänen perheelleen tai yhteisölle siinä, mitä hän laillisesti päättää tehdä. Jae sisältää kaksi ohjeen tasoa. Ensimmäinen on pakollinen: lesken on odotettava neljä kuukautta ja kymmenen päivää. Toinen on suositus: mahdollisuus jäädä vuodeksi, jos aviomies on sen määrännyt testamentissaan. Tämä vuoden asuminen ei ole pakollinen, ja leski voi halutessaan lähteä aiemmin, kunhan päätös on hänen oma ja tehty ilman painostusta. Ohje kuvastaa sekä myötätuntoa että joustavuutta lesken tunteellisten ja käytännöllisten tarpeiden huomioimiseksi. On myös tärkeää huomata, että tämä ohje koskee tilanteita, joissa leski ei ole perinyt kotia aviomiehensä jälkeen — kuten Koraanin jakeessa 4:12 säädetään. Mikäli koti tai osa siitä on määrätty hänelle perintönä, hänen asumisoikeutensa perustuu tuohon lailliseen omistukseen. Jae päättyy muistutukseen siitä, että Allah on Ylhäinen ja Viisas. Tämä korostaa, että nämä määräykset eivät ole mielivaltaisia, vaan perustuvat jumalalliseen viisauteen ja armoon. Ne pyrkivät tasapainottamaan oikeudenmukaisuuden, henkisen hyvinvoinnin ja käytännön tuen surun keskellä oleville.","arabic":"وَالَّذِينَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُونَ أَزْوَاجًا وَصِيَّةً لِأَزْوَاجِهِمْ مَتَاعًا إِلَى الْحَوْلِ غَيْرَ إِخْرَاجٍ ۚ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِي مَا فَعَلْنَ فِي أَنْفُسِهِنَّ مِنْ مَعْرُوفٍ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ","commentary":"Tässä jakeessa palataan leskien asemaan ja annetaan myötätuntoinen ohje niille miehille, jotka ovat kuoleman partaalla. Jakeessa käsketään heitä laatimaan testamentti, jossa määrätään, että vaimo saa elatusta ja asuinpaikan vuoden ajaksi. Tämä oli leskelle oikeus jäädä edesmenneen aviomiehensä kotiin asumaan ilman, että häntä ajetaan pois, ja saada taloudellista tukea tuon vuoden ajan. Jos leski kuitenkin päättää lähteä kodista odotusajan jälkeen — joka on neljä kuukautta ja kymmenen päivää, kuten jakeessa 2:234 mainitaan — ei ole moitittavaa hänen perheelleen tai yhteisölle siinä, mitä hän laillisesti päättää tehdä. Jae sisältää kaksi ohjeen tasoa. Ensimmäinen on pakollinen: lesken on odotettava neljä kuukautta ja kymmenen päivää. Toinen on suositus: mahdollisuus jäädä vuodeksi, jos aviomies on sen määrännyt testamentissaan. Tämä vuoden asuminen ei ole pakollinen, ja leski voi halutessaan lähteä aiemmin, kunhan päätös on hänen oma ja tehty ilman painostusta. Ohje kuvastaa sekä myötätuntoa että joustavuutta lesken tunteellisten ja käytännöllisten tarpeiden huomioimiseksi. On myös tärkeää huomata, että tämä ohje koskee tilanteita, joissa leski ei ole perinyt kotia aviomiehensä jälkeen — kuten Koraanin jakeessa 4:12 säädetään. Mikäli koti tai osa siitä on määrätty hänelle perintönä, hänen asumisoikeutensa perustuu tuohon lailliseen omistukseen. Jae päättyy muistutukseen siitä, että Allah on Ylhäinen ja Viisas. Tämä korostaa, että nämä määräykset eivät ole mielivaltaisia, vaan perustuvat jumalalliseen viisauteen ja armoon. Ne pyrkivät tasapainottamaan oikeudenmukaisuuden, henkisen hyvinvoinnin ja käytännön tuen surun keskellä oleville.","translations":{"opas":"Ne teistä, jotka ovat kuolemaisillaan ja joilta jää vaimoja, testamentatkoot vaimoineen toimeentulon yhdeksi vuodeksi, jottei heidän tarvitse lähteä muualle; mutta jos he itse lähtevät, niin ei teille lueta synniksi sitä, miten he asianmukaisesti itseensä nähden menettelevät; onhan Jumala mahtava ja viisas.","clear":"Niiden teistä, jotka kuolevat jättäen jälkeensä leskiä, tulee testamentata heille vuoden ylläpito pakottamatta heitä lähtemään. Mutta jos he haluavat lähteä, te ette ole vastuussa siitä, mitä he kohtuullisesti päättävät itsensä puolesta. Ja Allah on Kaikkivoipa, Kaikkiviisas."}},{"verse":241,"commentary_en":"This verse follows the detailed rulings on divorce. It emphasizes the right of divorced women to receive fair support or provisions from their former husbands. This isn't just about financial maintenance; it's intended to help ease the difficulties and emotional impact of separation. Providing this support justly is considered a duty, especially for those who strive to live righteously and are mindful of Allah. The provision might lessen the bitterness and sadness that can come with divorce, highlighting Islam's emphasis on kindness and fairness even when a marriage has ended.","commentary_fi":"Tämä jae seuraa yksityiskohtaisia sääntöjä avioerosta. Se korostaa eronneiden naisten oikeutta saada kohtuullista tukea entisiltä aviomiehiltään. Kyse ei ole pelkästään taloudellisesta avustuksesta, vaan tarkoitus on helpottaa eron aiheuttamia vaikeuksia ja tunteellista kuormitusta. Tämän tuen oikeudenmukainen tarjoaminen nähdään velvollisuutena erityisesti niille, jotka pyrkivät elämään hurskaasti ja ovat tietoisia Allahista. Tämä apu voi lievittää eron aiheuttamaa katkeruutta ja surua, ja korostaa islamin painotusta lempeyteen ja oikeudenmukaisuuteen myös silloin, kun avioliitto on päättynyt.","arabic":"وَلِلْمُطَلَّقَاتِ مَتَاعٌ بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُتَّقِينَ","commentary":"Tämä jae seuraa yksityiskohtaisia sääntöjä avioerosta. Se korostaa eronneiden naisten oikeutta saada kohtuullista tukea entisiltä aviomiehiltään. Kyse ei ole pelkästään taloudellisesta avustuksesta, vaan tarkoitus on helpottaa eron aiheuttamia vaikeuksia ja tunteellista kuormitusta. Tämän tuen oikeudenmukainen tarjoaminen nähdään velvollisuutena erityisesti niille, jotka pyrkivät elämään hurskaasti ja ovat tietoisia Allahista. Tämä apu voi lievittää eron aiheuttamaa katkeruutta ja surua, ja korostaa islamin painotusta lempeyteen ja oikeudenmukaisuuteen myös silloin, kun avioliitto on päättynyt.","translations":{"opas":"Erotetuille vaimoille samaten kuuluu riittävä huolto, koska tämä on jumalaapelkääväisten velvollisuus.","clear":"Eronneille naisille tulee järjestää kohtuulliset elatukset – velvollisuus niille, jotka ovat tietoisia Allahista."}},{"verse":242,"commentary_en":"This verse serves as a concluding statement for the preceding set of rulings, including those on marriage, divorce, and related matters. It highlights that Allah makes His guidelines clear and understandable for humanity. The purpose behind making these rules clear is so that people can grasp their meaning and significance. It reminds us that Allah presents His laws clearly, fairly, and effectively, inviting us to reflect on their value and recognize His guidance and mercy in them. These teachings are meant to bring harmony and understanding to our relationships and society, emphasizing that following Allah's commands is beneficial for our lives, both individually and collectively.","commentary_fi":"Tämä jae toimii päätöslausekkeena edelliselle määräyskokoelmalle, mukaan lukien avioliittoa, avioeroa ja niihin liittyviä asioita koskevat. Se korostaa, että Allah tekee ohjeensa selviksi ja ymmärrettäviksi ihmiskunnalle. Näiden sääntöjen selväksi tekemisen tarkoitus on se, että ihmiset voivat ymmärtää niiden merkityksen ja tärkeyden. Se muistuttaa meitä siitä, että Allah esittää lakinsa selvästi, oikeudenmukaisesti ja tehokkaasti, kutsuen meitä pohtimaan niiden arvoa ja tunnistamaan Hänen johdatuksensa ja armonsa niissä. Nämä opetukset on tarkoitettu tuomaan harmoniaa ja ymmärrystä suhteisiimme ja yhteiskuntaan, korostaen, että Allahin käskyjen noudattaminen on hyödyllistä elämällemme, sekä yksilöllisesti että yhteisesti.","arabic":"كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَعْقِلُونَ","commentary":"Tämä jae toimii päätöslausekkeena edelliselle määräyskokoelmalle, mukaan lukien avioliittoa, avioeroa ja niihin liittyviä asioita koskevat. Se korostaa, että Allah tekee ohjeensa selviksi ja ymmärrettäviksi ihmiskunnalle. Näiden sääntöjen selväksi tekemisen tarkoitus on se, että ihmiset voivat ymmärtää niiden merkityksen ja tärkeyden. Se muistuttaa meitä siitä, että Allah esittää lakinsa selvästi, oikeudenmukaisesti ja tehokkaasti, kutsuen meitä pohtimaan niiden arvoa ja tunnistamaan Hänen johdatuksensa ja armonsa niissä. Nämä opetukset on tarkoitettu tuomaan harmoniaa ja ymmärrystä suhteisiimme ja yhteiskuntaan, korostaen, että Allahin käskyjen noudattaminen on hyödyllistä elämällemme, sekä yksilöllisesti että yhteisesti.","translations":{"opas":"Niin selittää Jumala tunnusmerkkejään teille, jotta toimisitte ymmärtäväisesti.","clear":"Näin Allah tekee ilmoituksensa selväksi teille, jotta kenties ymmärtäisitte."}},{"verse":243,"commentary_en":"This verse invites us to reflect on a story from the past: a large group of people who left their homes in great numbers because they were afraid of dying. The Qur’an doesn’t specify exactly what they feared—it could have been a deadly disease or an enemy threat. That detail isn’t the focus. What matters is that they tried to escape death. Despite their efforts, they still died. The verse makes it clear: no one can escape what Allah has decreed. Then, in a powerful sign, Allah brought them back to life—so that they, and others after them, could learn a lesson. It shows that life and death are completely in Allah’s hands. Human efforts cannot stop what Allah has already destined. By leaving out names, places, and specific times, the Qur’an turns this story into a timeless message. It’s not limited to one group of people—it speaks to everyone. The verse ends by reminding us that Allah gives many blessings to humanity, but many people are still ungrateful.","commentary_fi":"Tämä jae kehottaa meitä pohtimaan kertomusta menneisyydestä: suuresta ihmisjoukosta, joka lähti kodeistaan joukolla, koska he pelkäsivät kuolemaa. Koraanissa ei kerrota tarkalleen, mitä he pelkäsivät—ehkä tappavaa tautia tai vihollista. Tällä ei kuitenkaan ole merkitystä. Olennaista on, että he yrittivät paeta kuolemaa. Silti kuolema kohtasi heidät. Ja tämä osoittaa, ettei kukaan voi paeta sitä, minkä Allah on säätänyt. Sitten Allah toi heidät takaisin eloon—osoituksena voimastaan ja opetuksena heille ja muille. Se korostaa, että elämä ja kuolema ovat täysin Allahin käsissä. Ihmisen ponnistelut eivät voi muuttaa Allahin päätöksiä. Koska kertomuksessa ei mainita nimiä, paikkoja tai ajankohtaa, se muuttuu ajattomaksi opetukseksi. Se ei koske vain yhtä kansaa tai aikaa, vaan kaikkia ihmisiä. Jakeen lopussa muistutetaan, että Allah antaa ihmisille monia siunauksia, mutta silti moni on kiittämätön.","arabic":"أَلَمْ تَرَ إِلَى الَّذِينَ خَرَجُوا مِنْ دِيَارِهِمْ وَهُمْ أُلُوفٌ حَذَرَ الْمَوْتِ فَقَالَ لَهُمُ اللَّهُ مُوتُوا ثُمَّ أَحْيَاهُمْ ۚ إِنَّ اللَّهَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَشْكُرُونَ","commentary":"Tämä jae kehottaa meitä pohtimaan kertomusta menneisyydestä: suuresta ihmisjoukosta, joka lähti kodeistaan joukolla, koska he pelkäsivät kuolemaa. Koraanissa ei kerrota tarkalleen, mitä he pelkäsivät—ehkä tappavaa tautia tai vihollista. Tällä ei kuitenkaan ole merkitystä. Olennaista on, että he yrittivät paeta kuolemaa. Silti kuolema kohtasi heidät. Ja tämä osoittaa, ettei kukaan voi paeta sitä, minkä Allah on säätänyt. Sitten Allah toi heidät takaisin eloon—osoituksena voimastaan ja opetuksena heille ja muille. Se korostaa, että elämä ja kuolema ovat täysin Allahin käsissä. Ihmisen ponnistelut eivät voi muuttaa Allahin päätöksiä. Koska kertomuksessa ei mainita nimiä, paikkoja tai ajankohtaa, se muuttuu ajattomaksi opetukseksi. Se ei koske vain yhtä kansaa tai aikaa, vaan kaikkia ihmisiä. Jakeen lopussa muistutetaan, että Allah antaa ihmisille monia siunauksia, mutta silti moni on kiittämätön.","translations":{"opas":"Etkö pidä mielessäsi niitä, jotka muinoin tuhatlukuisina lähtivät kodeistaan peläten kuolemaa? Jumala sanoi heille: »Kuolkaa!» ja herätti heidät sitten eloon taas. Jumala totisesti antaa runsaita armolahjoja ihmisille, mutta useimmat ihmiset ovat kiittämättömiä.","clear":"Etkö ole nähnyt, oi Profeetta, niitä, jotka pakenivat kotoaan tuhansittain kuoleman pelossa? Allah sanoi heille: ”Kuolkaa!” sitten Hän antoi heille elämän. Totisesti Allah on aina runsaskätinen ihmiskunnalle, mutta useimmat ihmiset ovat kiittämättömiä."}},{"verse":244,"commentary_en":"Following the previous verse which showed Allah's absolute control over life and death, this verse directly addresses believers, encouraging them to strive and fight for the cause of Allah. It implies that since life and death are in Allah's hands anyway, the fear of death should not hold back someone who is committed to Allah's path. When striving for Allah's cause, believers are reminded that Allah hears their prayers and their intentions, and He knows all things, including their actions and their sincerity.","commentary_fi":"Seuraten edellistä jaetta, joka osoitti Allahin ehdottoman hallinnan elämään ja kuolemaan, tämä jae puhuu suoraan uskoville, kannustaen heitä ponnistelemaan ja taistelemaan Allahin asian puolesta. Se vihjaa, että koska elämä ja kuolema ovat joka tapauksessa Allahin käsissä, kuolemanpelon ei pitäisi pidätellä ketään, joka on omistautunut Allahin tielle. Kun ponnistellaan Allahin asian puolesta, uskovia muistutetaan, että Allah kuulee heidän rukouksensa ja aikeensa, ja Hän tietää kaiken, mukaan lukien heidän tekonsa ja vilpittömyytensä.","arabic":"وَقَاتِلُوا فِي سَبِيلِ اللَّهِ وَاعْلَمُوا أَنَّ اللَّهَ سَمِيعٌ عَلِيمٌ","commentary":"Seuraten edellistä jaetta, joka osoitti Allahin ehdottoman hallinnan elämään ja kuolemaan, tämä jae puhuu suoraan uskoville, kannustaen heitä ponnistelemaan ja taistelemaan Allahin asian puolesta. Se vihjaa, että koska elämä ja kuolema ovat joka tapauksessa Allahin käsissä, kuolemanpelon ei pitäisi pidätellä ketään, joka on omistautunut Allahin tielle. Kun ponnistellaan Allahin asian puolesta, uskovia muistutetaan, että Allah kuulee heidän rukouksensa ja aikeensa, ja Hän tietää kaiken, mukaan lukien heidän tekonsa ja vilpittömyytensä.","translations":{"opas":"Taistelkaa Jumalan retkellä ja tietäkää, että Jumala on kuuleva, tietävä.","clear":"Taistelkaa Allahin asian puolesta ja tietäkää, että Allah on Kaikkikuuleva, Kaikkitietävä."}},{"verse":245,"commentary_en":"This verse continues the theme of striving and sacrifice from the previous verse, but now it focuses on financial giving for the sake of Allah. It asks a rhetorical question: \"Who will give a good loan to Allah?\" Of course, Allah does not need anything from us—so this is symbolic language. It refers to giving wealth with pure intentions, to support causes that are pleasing to Allah. The phrase “goodly loan” means giving selflessly, without expecting anything in return from people. It must be sincere, done purely for Allah’s sake—not for praise, recognition, or personal gain. The verse promises that Allah will repay such giving with multiplied rewards. In fact, Allah considers what a person gives in this way as if it were given directly to Him, and He guarantees to return it many times over. The verse also reminds us that wealth comes from Allah—whether in large or small amounts—and that eventually, everything we have, and we ourselves, will return to Him. This teaches that wealth is not something we truly own; it is a trust from Allah, meant to be used responsibly and generously in ways that earn His pleasure.","commentary_fi":"Tämä jae jatkaa edellisen jakeen teemaa ponnistelusta ja uhrauksesta, mutta keskittyy nyt taloudelliseen antamiseen Allahin vuoksi. Jae esittää retorisen kysymyksen: \"Kuka antaa Allahille hyvän lainan?\" Tietenkään Allah ei tarvitse meiltä mitään—tämä on symbolinen ilmaisu. Se tarkoittaa rahan antamista vilpittömin aikomuksin ja Allahin mielen mukaan. Ilmaisu “hyvä laina” viittaa siihen, että ihminen antaa varoja epäitsekkyydellä, odottamatta vastalahjaa tai mainetta. Antamisen on oltava vilpitöntä ja tarkoitettu vain Allahin vuoksi. Jae lupaa, että Allah palkitsee tällaisen antamisen moninkertaisesti. Allah pitää tällaista lahjoitusta kuin se olisi annettu Hänelle itselleen, ja Hän sitoutuu maksamaan sen takaisin moninkertaisesti. Jae muistuttaa myös, että varallisuus tulee Allahilta—olipa se paljon tai vähän—ja lopulta kaikki, mitä meillä on, samoin kuin me itse, palaamme Allahin luo. Tämä opettaa, että varallisuus ei ole oikeasti meidän omaisuuttamme; se on luottamustehtävä Allahilta, jota tulee käyttää vastuullisesti ja anteliaasti tavalla, joka miellyttää Häntä.","arabic":"مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً ۚ وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ","commentary":"Tämä jae jatkaa edellisen jakeen teemaa ponnistelusta ja uhrauksesta, mutta keskittyy nyt taloudelliseen antamiseen Allahin vuoksi. Jae esittää retorisen kysymyksen: \"Kuka antaa Allahille hyvän lainan?\" Tietenkään Allah ei tarvitse meiltä mitään—tämä on symbolinen ilmaisu. Se tarkoittaa rahan antamista vilpittömin aikomuksin ja Allahin mielen mukaan. Ilmaisu “hyvä laina” viittaa siihen, että ihminen antaa varoja epäitsekkyydellä, odottamatta vastalahjaa tai mainetta. Antamisen on oltava vilpitöntä ja tarkoitettu vain Allahin vuoksi. Jae lupaa, että Allah palkitsee tällaisen antamisen moninkertaisesti. Allah pitää tällaista lahjoitusta kuin se olisi annettu Hänelle itselleen, ja Hän sitoutuu maksamaan sen takaisin moninkertaisesti. Jae muistuttaa myös, että varallisuus tulee Allahilta—olipa se paljon tai vähän—ja lopulta kaikki, mitä meillä on, samoin kuin me itse, palaamme Allahin luo. Tämä opettaa, että varallisuus ei ole oikeasti meidän omaisuuttamme; se on luottamustehtävä Allahilta, jota tulee käyttää vastuullisesti ja anteliaasti tavalla, joka miellyttää Häntä.","translations":{"opas":"Kuka antaa Jumalalle jalon lainan, jotta Hän saisi tilaisuuden palauttaa sen moninkertaisella? Sillä Jumalasta riippuu, pidättääkö Hän vai avaa runsautensa, ja Hänen luokseen te tulette palajamaan.","clear":"Kuka lainaisi Allahille hyvän lainan, jonka Allah moninkertaistaisi? Allah ˹yksin˺ vähentää ja lisää ˹varallisuutta˺. Ja Hänen luokseen te ˹kaikki˺ palataan."}},{"verse":246,"commentary_en":"This verse shifts to recount a story from the history of the Children of Israel after the time of Prophet Moses. It tells of a time when their elders asked a prophet among them to appoint a king to lead them in fighting for Allah's cause, claiming they had been driven from their homes and families. The prophet questioned their sincerity, asking if they might refuse to fight if it were actually commanded. Despite their strong declaration of readiness due to their suffering, when fighting was ordained, most of them turned away, except for a small group. The verse concludes by stating t
