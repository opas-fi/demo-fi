 وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ","commentary":"Tämä jae vie meidät suoraan kohtaukseen, jossa profeetta Abraham ja profeetta Ishmael yhdessä nostavat Ka’aban perustuksia. Tämän merkittävän tehtävän aikana he esittivät vilpittömän rukouksen. Ensimmäinen pyyntö oli, että Allah hyväksyisi heidän työnsä. He tunnustivat Allahin Kaikkikuulevaksi ja Kaikkitietäväksi, ymmärtäen, että Hän kuulee heidän rukouksensa ja on täysin tietoinen heidän aikeistaan ja ponnisteluistaan. Tämä osoittaa heidän nöyryytensä ja omistautumisensa tekemään työn pelkästään Allahin tähden, toivoen Hänen hyväksyntäänsä. Tämä rukous aloittaa sarjan rukouksia, jotka on tallennettu seuraavissa jakeissa, kaikki esitetty heidän rakentaessaan pyhää Taloa.","translations":{"opas":"Kun Aabraham ja Ismael laskivat Herran huoneen perustuksen, sanoivat he: »Herramme, ota vastaan tämä meiltä! Sinä, yksin Sinä, suljet kaiken kuuloosi ja tietoosi.","clear":"Ja ˹muista˺, kun Abraham kohotti talon perustan yhdessä Ismaelin kanssa, ˹molemmat rukoillen:˺ ”Herramme! Hyväksy ˹tämä˺ meiltä. Sinä totisesti olet Kaikkikuuleva, Kaikkitietävä.”"}},{"verse":128,"commentary_en":"Continuing their prayer while building the Ka'bah, Prophet Abraham and Prophet Ishmael asked Allah to make them people who submit fully to His will – this is the meaning of \"Muslim\" in Arabic. They also prayed for their descendants to be a community that submits to Allah's will. This shows their deep concern that the faith would continue through their lineage. They further asked Allah to guide them and show them the correct ways to perform the religious rites. Finally, they prayed for Allah's mercy and forgiveness, acknowledging that Allah is the Oft-Returning (accepting repentance) and Most Merciful. This part of the prayer emphasizes the importance of submission to Allah and the desire for future generations to uphold this faith.","commentary_fi":"Jatkaessaan rukoustaan Ka’abaa rakentaessaan profeetta Abraham ja profeetta Ishmael pyysivät Allahia tekemään heistä ihmisiä, jotka alistuvat täysin Hänen tahtoonsa — mikä on arabian kielen sana \"muslim\" tarkoittaa. He rukoilivat myös, että heidän jälkeläisistään tulisi yhteisö, joka alistuu Allahin tahtoon. Tämä heijastaa heidän syvää huoltaan uskonnon jatkumisesta heidän suvussaan. He pyysivät lisäksi Allahia opastamaan heitä ja näyttämään oikeat tavat suorittaa uskonnollisia rituaaleja. Lopuksi he rukoilivat Allahin armoa ja anteeksiantoa, tunnustaen, että Allah on usein armahtava (hyväksyy katumuksen) ja armollisin. Tämä rukouksen osa korostaa alistumisen merkitystä Allahille ja toivoa, että tulevat sukupolvet säilyttävät tämän uskon.","arabic":"رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِنْ ذُرِّيَّتِنَا أُمَّةً مُسْلِمَةً لَكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا ۖ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","commentary":"Jatkaessaan rukoustaan Ka’abaa rakentaessaan profeetta Abraham ja profeetta Ishmael pyysivät Allahia tekemään heistä ihmisiä, jotka alistuvat täysin Hänen tahtoonsa — mikä on arabian kielen sana \"muslim\" tarkoittaa. He rukoilivat myös, että heidän jälkeläisistään tulisi yhteisö, joka alistuu Allahin tahtoon. Tämä heijastaa heidän syvää huoltaan uskonnon jatkumisesta heidän suvussaan. He pyysivät lisäksi Allahia opastamaan heitä ja näyttämään oikeat tavat suorittaa uskonnollisia rituaaleja. Lopuksi he rukoilivat Allahin armoa ja anteeksiantoa, tunnustaen, että Allah on usein armahtava (hyväksyy katumuksen) ja armollisin. Tämä rukouksen osa korostaa alistumisen merkitystä Allahille ja toivoa, että tulevat sukupolvet säilyttävät tämän uskon.","translations":{"opas":"Herra, tee meidät molemmat Sinulle alamaisiksi (muslimeiksi) ja tee jälkeläisemme yhdeksi kansaksi ja seurakunnaksi, joka on Sinulle alamainen. Osoita meille hartaudenharjoituksemme ja sääli meitä. Sinä yksin olet totisesti sääliväinen, Armahtaja.","clear":"Herramme! Tee meistä molemmista ˹täysin˺ Sinulle alistuvia ja jälkeläisistämme kansa, joka alistuu Sinulle. Näytä meille rituaalimme ja käänny meidän puoleemme armossa. Sinä olet totisesti Katumuksen Hyväksyjä, Kaikkein Armollisin."}},{"verse":129,"commentary_en":"Concluding their prayer while building the Ka'bah, Prophet Abraham and Prophet Ishmael made a specific request for their future descendants. They asked Allah to send a Messenger from among their own people who would recite Allah's revelations to them, teach them the scripture and wisdom, and purify them. They acknowledged Allah's power and wisdom in this request, stating He is the Exalted in Might and the Wise. Muslims understand this prayer as a prophecy and a request for the coming of Prophet Muhammad, who was a direct descendant of Prophet Ishmael and was sent to teach and purify humanity. This prayer, made during the building of the Ka'bah, highlights the continuity of the message of submission to Allah through the line of Abraham and Ishmael.","commentary_fi":"Päättäen rukouksensa rakentaessaan Ka'baa, Profeetta Abraham ja Profeetta Ishmael esittivät erityisen pyynnön tuleville jälkeläisilleen. He pyysivät Allahia lähettämään heidän omasta keskuudestaan Lähettilään, joka lausuisi heille Allahin ilmoitukset, opettaisi heille Kirjoitusta ja viisautta, ja puhdistaisi heidät. He tunnustivat Allahin vallan ja viisauden tässä pyynnössä, sanoen, että Hän on Kaikkein Korkeimmassa Voimassa ja Viisas. Muslimit ymmärtävät tämän rukouksen profetiana ja pyyntönä Profeetta Muhammadin tulemiselle, joka oli Profeetta Ishmaelin suora jälkeläinen ja joka lähetettiin opettamaan ja puhdistamaan ihmiskuntaa. Tämä rukous, joka esitettiin Ka'ban rakentamisen aikana, korostaa sanoman jatkuvuutta Allahille alistumisesta Abrahamin ja Ishmaelin sukulinjan kautta.","arabic":"رَبَّنَا وَابْعَثْ فِيهِمْ رَسُولًا مِنْهُمْ يَتْلُو عَلَيْهِمْ آيَاتِكَ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَيُزَكِّيهِمْ ۚ إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ","commentary":"Päättäen rukouksensa rakentaessaan Ka'baa, Profeetta Abraham ja Profeetta Ishmael esittivät erityisen pyynnön tuleville jälkeläisilleen. He pyysivät Allahia lähettämään heidän omasta keskuudestaan Lähettilään, joka lausuisi heille Allahin ilmoitukset, opettaisi heille Kirjoitusta ja viisautta, ja puhdistaisi heidät. He tunnustivat Allahin vallan ja viisauden tässä pyynnössä, sanoen, että Hän on Kaikkein Korkeimmassa Voimassa ja Viisas. Muslimit ymmärtävät tämän rukouksen profetiana ja pyyntönä Profeetta Muhammadin tulemiselle, joka oli Profeetta Ishmaelin suora jälkeläinen ja joka lähetettiin opettamaan ja puhdistamaan ihmiskuntaa. Tämä rukous, joka esitettiin Ka'ban rakentamisen aikana, korostaa sanoman jatkuvuutta Allahille alistumisesta Abrahamin ja Ishmaelin sukulinjan kautta.","translations":{"opas":"Herra, lähetä myös profeetta heidän omasta keskuudestaan heidän luokseen julistamaan heille ihmeelliset ilmoituksesi, tunnusmerkkisi, opettamaan heille Pyhää kirjaa sekä viisautta ja tekemään heidät puhtaaksi. Sillä Sinä yksin olet totisesti mahtava, viisas.»","clear":"Herramme! Herätä heidän joukostaan sanansaattaja, joka lausuu heille Sinun ilmoituksiasi, opettaa heille Kirjaa ja viisautta ja puhdistaa heidät. Totisesti, Sinä ˹yksin˺ olet Kaikkivaltias, Kaikkiviisas.”"}},{"verse":130,"commentary_en":"This verse shifts focus slightly to emphasize the importance and clarity of Prophet Abraham's faith. It asks rhetorically who would turn away from his religion except someone who has foolishly degraded themselves. Prophet Abraham's religion was fundamentally about pure submission to Allah, which is what the word \"Islam\" means. The verse reaffirms Prophet Abraham's high status, stating that Allah chose him, purified him in this life, and that he will be among the righteous in the Hereafter. This serves as a strong statement about the true nature of Prophet Abraham's faith, contrasting it with any later deviations or claims.","commentary_fi":"Tämä jae siirtää painopistettä hieman korostaakseen Profeetta Abrahamin uskon tärkeyttä ja selkeyttä. Se kysyy retorisesti, kuka kääntyisi pois hänen uskonnostaan, paitsi sellainen, joka on typerästi halventanut itseään. Profeetta Abrahamin uskonto oli pohjimmiltaan puhdasta alistumista Allahille – tätä sana \"Islam\" tarkoittaa. Jae vahvistaa Profeetta Abrahamin korkean aseman, sanoen, että Allah valitsi hänet, puhdisti hänet tässä elämässä ja että hän tulee olemaan vanhurskaiden joukossa Tuonpuoleisessa. Tämä on vahva lausunto Profeetta Abrahamin uskon todellisesta luonteesta, kontrastina myöhemmille poikkeamille tai väitteille.","arabic":"وَمَنْ يَرْغَبُ عَنْ مِلَّةِ إِبْرَاهِيمَ إِلَّا مَنْ سَفِهَ نَفْسَهُ ۚ وَلَقَدِ اصْطَفَيْنَاهُ فِي الدُّنْيَا ۖ وَإِنَّهُ فِي الْآخِرَةِ لَمِنَ الصَّالِحِينَ","commentary":"Tämä jae siirtää painopistettä hieman korostaakseen Profeetta Abrahamin uskon tärkeyttä ja selkeyttä. Se kysyy retorisesti, kuka kääntyisi pois hänen uskonnostaan, paitsi sellainen, joka on typerästi halventanut itseään. Profeetta Abrahamin uskonto oli pohjimmiltaan puhdasta alistumista Allahille – tätä sana \"Islam\" tarkoittaa. Jae vahvistaa Profeetta Abrahamin korkean aseman, sanoen, että Allah valitsi hänet, puhdisti hänet tässä elämässä ja että hän tulee olemaan vanhurskaiden joukossa Tuonpuoleisessa. Tämä on vahva lausunto Profeetta Abrahamin uskon todellisesta luonteesta, kontrastina myöhemmille poikkeamille tai väitteille.","translations":{"opas":"Kukapa muu hylkää Aabrahamin uskonnon kuin se, joka pitää houkkana itseään? Olemmehan Me valinnut hänet tässä elämässä, ja kuoleman jälkeen on Aabraham totisesti kuuluva vanhurskasten joukkoon.","clear":"Kuka hylkäisikään Abrahamin uskon paitsi tyhmä! Me valitsimme hänet totisesti tässä elämässä, ja Tuonpuoleisessa hän on varmasti vanhurskaiden joukossa."}},{"verse":131,"commentary_en":"Following the statement about Prophet Abraham's faith, this verse gives a direct example of his pure submission. It recounts a moment when Allah commanded him to \"Submit\" or \"Bow your will to Me.\" Prophet Abraham's immediate and complete response was, \"I submit my will to the Lord of the Universe.\" This simple yet profound exchange perfectly illustrates the essence of his faith – total and willing surrender to the Creator and Sustainer of everything that exists.","commentary_fi":"Seuraten mainintaa profeetta Abrahamin uskosta, tämä jae antaa suoran esimerkin hänen puhtaasta alistumisestaan. Siinä kerrotaan hetkestä, jolloin Allah käski häntä: \"Alistu\" eli \"Alista tahtosi Minulle.\" Profeetta Abraham vastasi välittömästi ja täydellisesti: \"Alistan tahtoni maailmankaikkeuden Herralle.\" Tämä yksinkertainen mutta syvällinen vuoropuhelu kuvastaa täydellisesti hänen uskonsa ydintä – täydellistä ja vapaaehtoista alistumista kaiken olevaisen Luojalle ja Ylläpitäjälle.","arabic":"إِذْ قَالَ لَهُ رَبُّهُ أَسْلِمْ ۖ قَالَ أَسْلَمْتُ لِرَبِّ الْعَالَمِينَ","commentary":"Seuraten mainintaa profeetta Abrahamin uskosta, tämä jae antaa suoran esimerkin hänen puhtaasta alistumisestaan. Siinä kerrotaan hetkestä, jolloin Allah käski häntä: \"Alistu\" eli \"Alista tahtosi Minulle.\" Profeetta Abraham vastasi välittömästi ja täydellisesti: \"Alistan tahtoni maailmankaikkeuden Herralle.\" Tämä yksinkertainen mutta syvällinen vuoropuhelu kuvastaa täydellisesti hänen uskonsa ydintä – täydellistä ja vapaaehtoista alistumista kaiken olevaisen Luojalle ja Ylläpitäjälle.","translations":{"opas":"Kun hänen Herransa sanoi hänelle: »Alistu!» hän vastasi: »Olen antautunut maailmojen Herran alamaiseksi».","clear":"Kun hänen Herransa käski häntä: ”Alistu ˹Minun tahtooni˺”, hän vastasi: ”Minä alistun kaikkien maailmojen Herralle.”"}},{"verse":132,"commentary_en":"This verse shows how the faith of pure submission (Islam) was passed down through generations. It states that Prophet Abraham left this faith as a legacy to his sons. Similarly, his grandson, Prophet Jacob (also known as Israel), left the same counsel to his children. Their message was a strong urging: \"Allah has chosen this Faith for you; therefore, make sure you do not die except in a state of submission to Allah.\" This emphasizes that the religion of submission was not just for them, but was intended to be a continuous inheritance for their descendants, stressing its divine origin and importance until the very end of life. This connects directly to Prophet Abraham's own example of submission shown in the previous verse.","commentary_fi":"Tämä jae osoittaa, miten puhtaan alistumisen (Islamin) usko siirtyi sukupolvelta toiselle. Se sanoo, että Profeetta Abraham jätti tämän uskon perinnöksi pojilleen. Samoin hänen pojanpoikansa, Profeetta Jaakob (tunnettu myös nimellä Israel), jätti saman neuvon lapsilleen. Heidän viestinsä oli voimakas kehotus: \"Allah on valinnut tämän Uskon teille; älkää siis kuolko muuten kuin Islamin uskossa (alistuneena Allahille).\" Tämä korostaa, että alistumisen uskonto ei ollut vain heille, vaan sen oli tarkoitus olla jatkuva perintö heidän jälkeläisilleen, korostaen sen jumalallista alkuperää ja tärkeyttä aina elämän loppuun asti. Tämä liittyy suoraan Profeetta Abrahamin edellisessä jakeessa osoittamaan alistumisen esimerkkiin.","arabic":"وَوَصَّىٰ بِهَا إِبْرَاهِيمُ بَنِيهِ وَيَعْقُوبُ يَا بَنِيَّ إِنَّ اللَّهَ اصْطَفَىٰ لَكُمُ الدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ","commentary":"Tämä jae osoittaa, miten puhtaan alistumisen (Islamin) usko siirtyi sukupolvelta toiselle. Se sanoo, että Profeetta Abraham jätti tämän uskon perinnöksi pojilleen. Samoin hänen pojanpoikansa, Profeetta Jaakob (tunnettu myös nimellä Israel), jätti saman neuvon lapsilleen. Heidän viestinsä oli voimakas kehotus: \"Allah on valinnut tämän Uskon teille; älkää siis kuolko muuten kuin Islamin uskossa (alistuneena Allahille).\" Tämä korostaa, että alistumisen uskonto ei ollut vain heille, vaan sen oli tarkoitus olla jatkuva perintö heidän jälkeläisilleen, korostaen sen jumalallista alkuperää ja tärkeyttä aina elämän loppuun asti. Tämä liittyy suoraan Profeetta Abrahamin edellisessä jakeessa osoittamaan alistumisen esimerkkiin.","translations":{"opas":"Ja Aabraham velvoitti poikansakin tähän, ja samoin Jaakob sanoen:»Poikani, Jumala on totisesti valinnut (tosi) uskonnon teille; älkää siis kuolko, ennenkuin olette siihen alistuneet» .","clear":"Tämä oli Abrahamin – sekä Jaakobin – neuvo lapsilleen, ˹sanoen˺: ”Totisesti, Allah on valinnut teille tämän uskon, joten älkää kuolko paitsi ˹täyden˺ alistumisen tilassa.”"}},{"verse":133,"commentary_en":"This verse paints a powerful and moving scene of Prophet Jacob (also known as Israel) on his deathbed. Addressing people who lived much later, the verse uses a rhetorical question, \"Were you witnesses...?\", to emphasize the truth of the event it describes. Prophet Jacob's greatest concern as his life was ending was the faith his children would follow. He asked them directly, \"Whom will you worship after me?\" Their reply was a source of great reassurance: they declared they would worship the same God he worshipped, the God of his fathers, Prophet Abraham, Prophet Ishmael, and Prophet Isaac – the one true Allah. They affirmed their commitment, saying, \"To Him we bow (in Islam),\" meaning they submit to Allah. This verse shows the strong chain of faith passed down from Prophet Abraham through Prophet Isaac and Prophet Jacob, with the children affirming their commitment to the pure submission to Allah, linking them to the legacy mentioned in the previous verse.","commentary_fi":"Tämä jae maalaa voimakkaan ja liikuttavan kuvan Profeetta Jaakobista (tunnettu myös nimellä Israel) kuolinvuoteellaan. Jae käyttää retorista kysymystä \"Olitko todistamassa...?\", korostaakseen kuvatun tapahtuman totuutta. Profeetta Jaakobin suurin huoli elämän lähestyessä loppuaan oli usko, jota hänen lapsensa seuraisivat. Hän kysyi heiltä suoraan: \"Ketä palvotte minun jälkeeni?\" Heidän rauhoittava vastauksensa oli suuri helpotus: he ilmoittivat palvovansa samaa Jumalaa, jota hän palvoi, isänsä Jumalaa, Profeetta Abrahamin, Profeetta Ishmaelin ja Profeetta Iisakin Jumalaa – yhtä tosi Allahia. He vahvistivat sitoumuksensa sanoen: \"Hänelle me alistumme (Islamissa)\", tarkoittaen, että he alistuvat Allahille. Tämä jae osoittaa vahvan uskon ketjun, joka kulki Profeetta Abrahamista Profeetta Iisakin ja Profeetta Jaakobin kautta, lasten vahvistaessa sitoumuksensa puhtaaseen alistumiseen, yhdistäen heidät edellisessä jakeessa mainittuun perintöön.","arabic":"أَمْ كُنْتُمْ شُهَدَاءَ إِذْ حَضَرَ يَعْقُوبَ الْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنْ بَعْدِي قَالُوا نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ آبَائِكَ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ إِلَٰهًا وَاحِدًا وَنَحْنُ لَهُ مُسْلِمُونَ","commentary":"Tämä jae maalaa voimakkaan ja liikuttavan kuvan Profeetta Jaakobista (tunnettu myös nimellä Israel) kuolinvuoteellaan. Jae käyttää retorista kysymystä \"Olitko todistamassa...?\", korostaakseen kuvatun tapahtuman totuutta. Profeetta Jaakobin suurin huoli elämän lähestyessä loppuaan oli usko, jota hänen lapsensa seuraisivat. Hän kysyi heiltä suoraan: \"Ketä palvotte minun jälkeeni?\" Heidän rauhoittava vastauksensa oli suuri helpotus: he ilmoittivat palvovansa samaa Jumalaa, jota hän palvoi, isänsä Jumalaa, Profeetta Abrahamin, Profeetta Ishmaelin ja Profeetta Iisakin Jumalaa – yhtä tosi Allahia. He vahvistivat sitoumuksensa sanoen: \"Hänelle me alistumme (Islamissa)\", tarkoittaen, että he alistuvat Allahille. Tämä jae osoittaa vahvan uskon ketjun, joka kulki Profeetta Abrahamista Profeetta Iisakin ja Profeetta Jaakobin kautta, lasten vahvistaessa sitoumuksensa puhtaaseen alistumiseen, yhdistäen heidät edellisessä jakeessa mainittuun perintöön.","translations":{"opas":"Tai olitteko läsnä todistajina, kun Jaakobin kuolema lähestyi ja hän sanoi pojalleen: »Ketä te aiotte palvella kuolemani jälkeen?» He vastasivat: »Me palvelemme sinun ja isiesi Aabrahamin, Ismaelin ja Iisakin Jumalaa, yhtä ainoata Jumalaa, ja olemme Hänelle alamaisia.»","clear":"Vai olitteko todistamassa, kun kuolema kohtasi Jaakobin? Hän kysyi lapsiltaan: ”Ketä palvotte kuolemani jälkeen?” He vastasivat: ”Me ˹jatkamme˺ sinun Jumalasi, esi-isiesi – Abrahamin, Ismaelin ja Iisakin – Jumalan palvomista, joka on Yksi Jumala. Ja Hänelle me ˹kaikki˺ alistumme.”"}},{"verse":134,"commentary_en":"Following the historical accounts of Prophet Jacob and his children affirming their commitment to Allah, this verse makes an important distinction. It emphasizes that past generations, like the descendants of Jacob previously mentioned, are accountable only for their own deeds. Their actions, whether good or bad, are recorded for them alone. Likewise, every generation is responsible for its own actions. You will not be questioned about what those before you did. This highlights a core principle in Islam: accountability is individual and not based on one's lineage or ancestral history. It also sets the stage for the discussion that follows about the true foundation of faith.","commentary_fi":"Seuraten kertomuksia profeetta Jaakobista ja hänen lapsistaan, jotka vahvistivat sitoutumisensa Allahiin, tämä jae tekee tärkeän erottelun. Se korostaa, että menneet sukupolvet, kuten aiemmin mainitut Jaakobin jälkeläiset, ovat vastuussa vain omista teoistaan. Heidän tekonsa, olivatpa ne hyviä tai pahoja, kirjataan heidän omaksi osakseen. Samoin jokainen sukupolvi on vastuussa omista teoistaan. Teitä ei tulla kysymään siitä, mitä aiemmat ihmiset tekivät. Tämä tuo esiin islamin keskeisen periaatteen: vastuu on yksilöllinen, eikä perustu sukuun tai esivanhempien historiaan. Samalla tämä valmistaa tietä seuraavalle keskustelulle uskon todellisesta perustasta.","arabic":"تِلْكَ أُمَّةٌ قَدْ خَلَتْ ۖ لَهَا مَا كَسَبَتْ وَلَكُمْ مَا كَسَبْتُمْ ۖ وَلَا تُسْأَلُونَ عَمَّا كَانُوا يَعْمَلُونَ","commentary":"Seuraten kertomuksia profeetta Jaakobista ja hänen lapsistaan, jotka vahvistivat sitoutumisensa Allahiin, tämä jae tekee tärkeän erottelun. Se korostaa, että menneet sukupolvet, kuten aiemmin mainitut Jaakobin jälkeläiset, ovat vastuussa vain omista teoistaan. Heidän tekonsa, olivatpa ne hyviä tai pahoja, kirjataan heidän omaksi osakseen. Samoin jokainen sukupolvi on vastuussa omista teoistaan. Teitä ei tulla kysymään siitä, mitä aiemmat ihmiset tekivät. Tämä tuo esiin islamin keskeisen periaatteen: vastuu on yksilöllinen, eikä perustu sukuun tai esivanhempien historiaan. Samalla tämä valmistaa tietä seuraavalle keskustelulle uskon todellisesta perustasta.","translations":{"opas":"Se sukupolvi on siirtynyt pois. He saivat, mitä olivat ansainneet. Te saatte, mitä te ansaitsette, ettekä vastaa siitä, mitä he tekivät.","clear":"Se oli yhteisö, joka oli jo mennyt edeltä. Heidän on se, minkä he ansaitsivat, ja teidän on se, minkä olette ansainneet. Eikä teitä pidetä vastuussa siitä, mitä he ovat tehneet."}},{"verse":135,"commentary_en":"Building on the principle of individual accountability rather than inherited merit, this verse addresses the claims made by some from earlier religious communities who asserted that others needed to follow their specific religious path in order to be rightly guided. Allah instructs Prophet Muhammad to respond by declaring that the true path is the way of Prophet Abraham, who was purely devoted to Allah alone and did not associate any partners with Him. This connects the faith of Muslims directly to Prophet Abraham, highlighting that the core message throughout history has been the pure worship of Allah alone.","commentary_fi":"Perustuen periaatteeseen yksilöllisestä vastuusta eikä peritystä ansiosta, tämä jae käsittelee joidenkin aiempien uskonnollisten yhteisöjen jäsenten väitteitä, joiden mukaan muiden täytyisi omaksua juuri heidän uskonnollinen polkunsa ollakseen oikealla tiellä. Allah käskee profeetta Muhammadia vastaamaan, että todellinen tie on profeetta Abrahamin tie, joka oli täysin omistautunut yksin Allahille eikä asettanut Hänelle kumppaneita. Tämä yhdistää muslimien uskon suoraan profeetta Abrahamiin ja korostaa, että ydinsanoma kautta historian on ollut puhdas Allahin palvonta.","arabic":"وَقَالُوا كُونُوا هُودًا أَوْ نَصَارَىٰ تَهْتَدُوا ۗ قُلْ بَلْ مِلَّةَ إِبْرَاهِيمَ حَنِيفًا ۖ وَمَا كَانَ مِنَ الْمُشْرِكِينَ","commentary":"Perustuen periaatteeseen yksilöllisestä vastuusta eikä peritystä ansiosta, tämä jae käsittelee joidenkin aiempien uskonnollisten yhteisöjen jäsenten väitteitä, joiden mukaan muiden täytyisi omaksua juuri heidän uskonnollinen polkunsa ollakseen oikealla tiellä. Allah käskee profeetta Muhammadia vastaamaan, että todellinen tie on profeetta Abrahamin tie, joka oli täysin omistautunut yksin Allahille eikä asettanut Hänelle kumppaneita. Tämä yhdistää muslimien uskon suoraan profeetta Abrahamiin ja korostaa, että ydinsanoma kautta historian on ollut puhdas Allahin palvonta.","translations":{"opas":"Sanovatpa he: »Kääntykää juutalaisiksi tai kristityiksi, niin tulette oikealle tielle.» Vastatkaa: »Ei, me seuraamme Aabrahamin oppia, koska hän oli oikeauskoinen (haniifi) eikä kuulunut monijumalaisiin.»","clear":"Juutalaiset ja kristityt sanovat kumpikin: \"Seuratkaa uskoamme, niin saatte johdatuksen.\" Sano: »Ei! Me seuraamme Abrahamin uskoa, oikeamielisen, joka ei ollut monijumalainen.»"}},{"verse":136,"commentary_en":"This verse outlines the comprehensive belief held by Muslims. It declares belief in Allah, in the revelation given to Prophet Muhammad (the Qur'an), and in the revelations sent to all the prophets before him, including Prophet Abraham, Prophet Ishmael, Prophet Isaac, Prophet Jacob, the tribes  who  descended from Jacob, Prophet Moses, Prophet Jesus, and all other prophets sent by Allah. A key principle emphasized here is that Muslims believe in and respect all of Allah's prophets, making no distinction between them in terms of accepting their divine mission. This universal acceptance of all prophets and their revelations is central to Islam and signifies submission to Allah alone. The verse follows the call to follow the path of Abraham by clarifying that this includes belief in the continuity of divine guidance through all of Allah’s prophets.","commentary_fi":"Tämä jae esittelee muslimien kattavan uskonkäsityksen. Siinä julistetaan usko Allahiin, profeetta Muhammadille (Koraani) annettuun ilmestykseen sekä kaikkiin aikaisemmin lähetettyihin profeettoihin ja heidän saamansa ilmoitukset – mukaan lukien profeetta Abraham, profeetta Ismael, profeetta Iisak, profeetta Jaakob, Jaakobin jälkeläiset, profeetta Mooses, profeetta Jeesus sekä kaikki muut Allahin lähettämät profeetat. Keskeinen periaate tässä on, että muslimit uskovat kaikkiin Allahin profeettoihin ja kunnioittavat heitä, tekemättä eroa heidän jumalallisen tehtävänsä hyväksymisessä. Tämä kaikkien profeettojen ja ilmoitusten universaali hyväksyminen on islamin ydintä ja merkitsee alistumista yksin Allahille. Jae jatkaa kehotusta seurata Abrahamin tietä, tarkentaen että siihen sisältyy usko Allahin jatkuvaan ohjaukseen kaikkien Hänen profeettojensa kautta.","arabic":"قُولُوا آمَنَّا بِاللَّهِ وَمَا أُنْزِلَ إِلَيْنَا وَمَا أُنْزِلَ إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالْأَسْبَاطِ وَمَا أُوتِيَ مُوسَىٰ وَعِيسَىٰ وَمَا أُوتِيَ النَّبِيُّونَ مِنْ رَبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْهُمْ وَنَحْنُ لَهُ مُسْلِمُونَ","commentary":"Tämä jae esittelee muslimien kattavan uskonkäsityksen. Siinä julistetaan usko Allahiin, profeetta Muhammadille (Koraani) annettuun ilmestykseen sekä kaikkiin aikaisemmin lähetettyihin profeettoihin ja heidän saamansa ilmoitukset – mukaan lukien profeetta Abraham, profeetta Ismael, profeetta Iisak, profeetta Jaakob, Jaakobin jälkeläiset, profeetta Mooses, profeetta Jeesus sekä kaikki muut Allahin lähettämät profeetat. Keskeinen periaate tässä on, että muslimit uskovat kaikkiin Allahin profeettoihin ja kunnioittavat heitä, tekemättä eroa heidän jumalallisen tehtävänsä hyväksymisessä. Tämä kaikkien profeettojen ja ilmoitusten universaali hyväksyminen on islamin ydintä ja merkitsee alistumista yksin Allahille. Jae jatkaa kehotusta seurata Abrahamin tietä, tarkentaen että siihen sisältyy usko Allahin jatkuvaan ohjaukseen kaikkien Hänen profeettojensa kautta.","translations":{"opas":"Sanokaa: »Me uskomme Jumalaan ja siihen, mikä on ilmoitettu meille ja mikä on ilmoitettu Aabrahamille, Ismaelille, Iisakille ja Jaakobille ja Israelin sukukunnille,","clear":"Sanokaa, oi uskovaiset: »Me uskomme Allahiin ja siihen, mitä meille on ilmoitettu, ja siihen, mitä on ilmoitettu Abrahamille, Ismaelille, Iisakille, Jaakobille ja hänen jälkeläisilleen, ja siihen, mitä on annettu Moosekselle, Jeesukselle ja muille profeetoille heidän Herraltaan. Me emme tee eroa heidän välillään. Ja Allahille me kaikki alistumme.»"}},{"verse":137,"commentary_en":"Following the declaration of belief in all prophets and revelations, this verse presents the outcome of accepting or rejecting this unified understanding of faith. It states that if others accept this belief in Allah and all His messengers, as Muslims do, then they are rightly guided. However, if they turn away from this comprehensive belief, they are creating division and distancing themselves from the core truth. The verse offers reassurance by affirming that Allah is sufficient to protect the Prophet and the believers against such opposition. He is All-Hearing and All-Knowing, fully aware of their disputes.","commentary_fi":"Seuraten julistusta uskosta kaikkiin profeettoihin ja ilmoituksiin, tämä jae esittää seuraukset tämän yhtenäisen uskonkäsityksen hyväksymisestä tai hylkäämisestä. Siinä todetaan, että jos muut hyväksyvät tämän uskon Allahiin ja kaikkiin Hänen lähettiläisiinsä, kuten muslimit tekevät, he ovat oikealla tiellä. Mutta jos he kääntyvät pois tästä kokonaisvaltaisesta uskosta, he aiheuttavat eripuraa ja etääntyvät totuuden ytimestä. Jae tarjoaa lohdutuksen vakuuttamalla, että Allah riittää suojelemaan profeettaa ja uskovia tällaista vastustusta vastaan. Hän on Kaikkikuuleva ja Kaikkitietävä, täysin tietoinen heidän kiistoistaan.","arabic":"فَإِنْ آمَنُوا بِمِثْلِ مَا آمَنْتُمْ بِهِ فَقَدِ اهْتَدَوْا ۖ وَإِنْ تَوَلَّوْا فَإِنَّمَا هُمْ فِي شِقَاقٍ ۖ فَسَيَكْفِيكَهُمُ اللَّهُ ۚ وَهُوَ السَّمِيعُ الْعَلِيمُ","commentary":"Seuraten julistusta uskosta kaikkiin profeettoihin ja ilmoituksiin, tämä jae esittää seuraukset tämän yhtenäisen uskonkäsityksen hyväksymisestä tai hylkäämisestä. Siinä todetaan, että jos muut hyväksyvät tämän uskon Allahiin ja kaikkiin Hänen lähettiläisiinsä, kuten muslimit tekevät, he ovat oikealla tiellä. Mutta jos he kääntyvät pois tästä kokonaisvaltaisesta uskosta, he aiheuttavat eripuraa ja etääntyvät totuuden ytimestä. Jae tarjoaa lohdutuksen vakuuttamalla, että Allah riittää suojelemaan profeettaa ja uskovia tällaista vastustusta vastaan. Hän on Kaikkikuuleva ja Kaikkitietävä, täysin tietoinen heidän kiistoistaan.","translations":{"opas":"siihen, mitä Mooses ja Jeesus ovat (Jumalalta ilmoitettavaksi) saaneet ja mitä profeetat ovat saaneet julistettavaksi Herraltansa. Emme tee mitään erotusta yhdenkään heidän välillään, olemme antautuneet Hänelle alamaisiksi.» Jos he sitten uskovat samoin kuin te, niin he ovat oikealla tiellä, mutta jos he kääntyvät pois, niin he ovat luopioita. Jumala on oleva riittävä suojasi heitä vastaan, sillä Hän on kuuleva ja tietävä.","clear":"Jos he siis uskovat siihen, mihin te uskotte, niin he ovat totisesti johdatettuja. Mutta jos he kääntyvät pois, he vastustavat yksinkertaisesti totuutta. Mutta Allah säästää teidät heidän pahuudeltaan. Sillä Hän on Kaikkikuuleva, Kaikkitietävä."}},{"verse":138,"commentary_en":"This verse describes faith as having a distinct \"color\" or \"hue.\" It signifies that the religion originates from Allah, giving it a unique and pure quality that surpasses anything else. It is like a spiritual dye or purification that comes directly from the Divine Source. The verse poses a rhetorical question: who can provide a better 'color' or purification than Allah? This highlights that true worship and submission belong to Allah alone, the One from whom this unique spiritual identity is derived. Notably, the Qur'anic style here blends Allah's declaration of the faith’s divine origin with the believers’ affirmation of worshiping Him alone, reflecting the close and direct connection between them.","commentary_fi":"Tämä jae kuvaa uskoa erityislaatuisena \"värinä\" tai \"sävynä\". Se merkitsee sitä, että uskonto on peräisin Allahilta, mikä antaa sille ainutlaatuisen ja puhtaan laadun, joka ylittää kaiken muun. Se on kuin hengellinen väri tai puhdistus, joka tulee suoraan jumalallisesta lähteestä. Jae esittää retorisen kysymyksen: kuka voi antaa paremman 'värin' tai puhdistuksen kuin Allah? Tämä korostaa, että todellinen palvonta ja alistuminen kuuluvat yksin Allahille, Hänelle, jolta tämä ainutlaatuinen hengellinen identiteetti on peräisin. Huomionarvoista on Koraanin tyyli tässä kohdassa, jossa Allahin julistus uskon jumalallisesta alkuperästä yhdistyy uskovien vahvistukseen palvoa yksin Häntä, mikä kuvastaa heidän läheistä ja suoraa yhteyttään Häneen.","arabic":"صِبْغَةَ اللَّهِ ۖ وَمَنْ أَحْسَنُ مِنَ اللَّهِ صِبْغَةً ۖ وَنَحْنُ لَهُ عَابِدُونَ","commentary":"Tämä jae kuvaa uskoa erityislaatuisena \"värinä\" tai \"sävynä\". Se merkitsee sitä, että uskonto on peräisin Allahilta, mikä antaa sille ainutlaatuisen ja puhtaan laadun, joka ylittää kaiken muun. Se on kuin hengellinen väri tai puhdistus, joka tulee suoraan jumalallisesta lähteestä. Jae esittää retorisen kysymyksen: kuka voi antaa paremman 'värin' tai puhdistuksen kuin Allah? Tämä korostaa, että todellinen palvonta ja alistuminen kuuluvat yksin Allahille, Hänelle, jolta tämä ainutlaatuinen hengellinen identiteetti on peräisin. Huomionarvoista on Koraanin tyyli tässä kohdassa, jossa Allahin julistus uskon jumalallisesta alkuperästä yhdistyy uskovien vahvistukseen palvoa yksin Häntä, mikä kuvastaa heidän läheistä ja suoraa yhteyttään Häneen.","translations":{"opas":"Me olemme Jumalan merkitsemiä, ja keneltä on parempi saada tuntomerkkinsä kuin Jumalalta? Me olemme Hänen palvelijoitaan.","clear":"Tämä on Allahin luonnollinen tie. Ja kuka on parempi kuin Allah tien määrääjänä? Ja me palvelemme Häntä ˹ainoastaan˺."}},{"verse":139,"commentary_en":"This verse continues the discussion by challenging any attempt to dispute the fundamental truth about Allah. It highlights the inconsistency of arguing over Allah, since He is universally acknowledged as the Lord of all people, whether they are Muslims or not. The verse also reinforces the principle of individual accountability, previously emphasized in Verse 134—that each person is responsible for their own actions. Additionally, it underlines the believers’ sincere devotion to Allah alone. By focusing on these shared beliefs (Allah as the universal Lord) and core Islamic principles (personal responsibility, sincere worship), the verse addresses the underlying causes of religious differences.","commentary_fi":"Tämä jae jatkaa keskustelua haastamalla kaikki yritykset kiistää perustavaa totuutta Allahista. Se tuo esiin ristiriidan siinä, että Allahista väitellään, vaikka Hänet tunnustetaan kaikkien ihmisten, niin muslimien kuin muidenkin, Herraksi. Jae vahvistaa myös henkilökohtaisen vastuullisuuden periaatteen, joka korostettiin aiemmin jakeessa 134 – että jokainen on vastuussa omista teoistaan. Lisäksi se korostaa uskovien vilpitöntä antautumista yksin Allahille. Keskittymällä näihin yhteisiin uskomuksiin (Allah universaalina Herrana) ja islamin ydinarvoihin (henkilökohtainen vastuu, vilpitön palvonta), jae käsittelee uskonnollisten erimielisyyksien taustalla olevia syitä.","arabic":"قُلْ أَتُحَاجُّونَنَا فِي اللَّهِ وَهُوَ رَبُّنَا وَرَبُّكُمْ وَلَنَا أَعْمَالُنَا وَلَكُمْ أَعْمَالُكُمْ وَنَحْنُ لَهُ مُخْلِصُونَ","commentary":"Tämä jae jatkaa keskustelua haastamalla kaikki yritykset kiistää perustavaa totuutta Allahista. Se tuo esiin ristiriidan siinä, että Allahista väitellään, vaikka Hänet tunnustetaan kaikkien ihmisten, niin muslimien kuin muidenkin, Herraksi. Jae vahvistaa myös henkilökohtaisen vastuullisuuden periaatteen, joka korostettiin aiemmin jakeessa 134 – että jokainen on vastuussa omista teoistaan. Lisäksi se korostaa uskovien vilpitöntä antautumista yksin Allahille. Keskittymällä näihin yhteisiin uskomuksiin (Allah universaalina Herrana) ja islamin ydinarvoihin (henkilökohtainen vastuu, vilpitön palvonta), jae käsittelee uskonnollisten erimielisyyksien taustalla olevia syitä.","translations":{"opas":"Sano (Pyhät kirjoitukset omaaville): »Kiistelittekö kanssamme Jumalasta, kun hän on sekä meidän Herramme että teidän Herranne? Meillä on omat tekomme ja teillä on omat tekonne, ja me turvaudumme Häneen vilpittömästi.»","clear":"Sano: ”Riitelisittekö meidän kanssamme Allahista, vaikka Hän on meidän Herramme ja teidän Herranne? Me olemme vastuussa teoistamme ja te omistanne. Ja me olemme omistautuneet Hänelle ˹yksin˺."}},{"verse":140,"commentary_en":"This verse presents a direct question to those who claim that early prophets such as Prophet Abraham, Prophet Ishmael, Prophet Isaac, Prophet Jacob, and the tribes descended from Jacob were followers of Judaism or Christianity. It points out that these prophets lived long before Judaism and Christianity emerged as distinct religions. Therefore, attributing these later religious identities to them is historically incorrect. The verse then poses a rhetorical challenge: \"Do you know better than Allah?\", confronting those who make such claims with the reality of divine knowledge. It further highlights the serious wrongdoing of those who knowingly conceal or distort the truth revealed by Allah, reminding them that Allah is fully aware of all that people do, including efforts to hide the truth. This verse reinforces the argument made in Verse 135, emphasizing the call to follow the pure monotheism of Abraham, distinct from later religious labels and divisions.","commentary_fi":"Tämä jae esittää suoran kysymyksen niille, jotka väittävät, että varhaiset profeetat, kuten profeetta Abraham, profeetta Ismael, profeetta Iisak, profeetta Jaakob ja Jaakobin jälkeläisistä muodostuneet heimot, olisivat olleet juutalaisia tai kristittyjä. Jae osoittaa, että nämä profeetat elivät kauan ennen kuin juutalaisuus ja kristinusko syntyivät erillisinä uskontoina. Siksi heidän liittäminen näihin myöhempiin uskontoihin on historiallisesti virheellistä. Jae esittää retorisen haasteen: \"Tiedättekö te paremmin kuin Allah?\", haastamalla näin ne, jotka tekevät tällaisia väitteitä, kohtaamaan jumalallisen tiedon todellisuuden. Lisäksi jae tuo esiin vakavan vääryyden, jonka tekevät ne, jotka tietoisesti salaavat tai vääristelevät Allahin ilmoittamaa totuutta, muistuttaen heitä siitä, että Allah tietää kaiken, mitä ihmiset tekevät, mukaan lukien totuuden kätkemisen. Tämä jae vahvistaa jakeessa 135 esitetyn argumentin, korostaen kehotusta seurata Abrahamin puhdasta monoteismia, joka eroaa myöhemmistä uskonnollisista nimikkeistä ja jakolinjoista.","arabic":"أَمْ تَقُولُونَ إِنَّ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالْأَسْبَاطَ كَانُوا هُودًا أَوْ نَصَارَىٰ ۗ قُلْ أَأَنْتُمْ أَعْلَمُ أَمِ اللَّهُ ۗ وَمَنْ أَظْلَمُ مِمَّنْ كَتَمَ شَهَادَةً عِنْدَهُ مِنَ اللَّهِ ۗ وَمَا اللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ","commentary":"Tämä jae esittää suoran kysymyksen niille, jotka väittävät, että varhaiset profeetat, kuten profeetta Abraham, profeetta Ismael, profeetta Iisak, profeetta Jaakob ja Jaakobin jälkeläisistä muodostuneet heimot, olisivat olleet juutalaisia tai kristittyjä. Jae osoittaa, että nämä profeetat elivät kauan ennen kuin juutalaisuus ja kristinusko syntyivät erillisinä uskontoina. Siksi heidän liittäminen näihin myöhempiin uskontoihin on historiallisesti virheellistä. Jae esittää retorisen haasteen: \"Tiedättekö te paremmin kuin Allah?\", haastamalla näin ne, jotka tekevät tällaisia väitteitä, kohtaamaan jumalallisen tiedon todellisuuden. Lisäksi jae tuo esiin vakavan vääryyden, jonka tekevät ne, jotka tietoisesti salaavat tai vääristelevät Allahin ilmoittamaa totuutta, muistuttaen heitä siitä, että Allah tietää kaiken, mitä ihmiset tekevät, mukaan lukien totuuden kätkemisen. Tämä jae vahvistaa jakeessa 135 esitetyn argumentin, korostaen kehotusta seurata Abrahamin puhdasta monoteismia, joka eroaa myöhemmistä uskonnollisista nimikkeistä ja jakolinjoista.","translations":{"opas":"Vai sanotteko: »Aabraham, Ismael, Iisak ja jaakob ja Israelin sukukunnat olivat totisesti joko juutalaisia tai kristittyjä?» Sano: »Kumpi tietää paremmin, te vai Jumala? Ja kuka on väärämielisempi kuin se, joka salaa todistuksen, jonka on saanut Jumalalta? Eikä Jumala ole välinpitämätön siitä, mitä te teette.»","clear":"Vai väitättekö, että Abraham, Ismael, Iisak, Jaakob ja hänen jälkeläisensä olivat kaikki juutalaisia tai kristittyjä?” Sano: ”Kuka on tietävämpi: te vai Allah?” Kuka tekee enemmän väärin kuin ne, jotka kätkevät todistuksen, jonka he ovat saaneet Allahilta? Eikä Allah ole koskaan tietämätön siitä, mitä te teette."}},{"verse":141,"commentary_en":"This verse repeats the statement made in Verse 134. By repeating it after the discussion about the prophets and the claims of later religious groups, it powerfully reinforces the central theme: lineage or historical association does not guarantee salvation or special status. The deeds of those past generations are for them, and your deeds are for you. You are not responsible for their actions, nor do their merits automatically benefit you. This serves as a concluding statement to this section, bringing the argument back to the core Islamic principle of individual accountability before Allah, separate from ancestral or historical group identity.","commentary_fi":"Tämä jae toistaa jakeessa 134 esitetyn väitteen. Toistamalla sen profeettoja ja myöhempien uskonnollisten ryhmien väitteitä koskevan keskustelun jälkeen, se vahvistaa voimakkaasti keskeisen sanoman: sukujuuret tai historiallinen yhteys eivät takaa pelastusta tai erityisasemaa. Menneiden sukupolvien teot kuuluvat heille, ja sinun tekosi kuuluvat sinulle. Et ole vastuussa heidän teoistaan, etkä heidän ansionsa automaattisesti hyödytä sinua. Tämä jae toimii tämän osion päättävänä muistutuksena, vahvistaen islamin ydinkäsitteen yksilön vastuullisuudesta Allahin edessä, erillään esi-isien tai ryhmän identiteetistä.","arabic":"تِلْكَ أُمَّةٌ قَدْ خَلَتْ ۖ لَهَا مَا كَسَبَتْ وَلَكُمْ مَا كَسَبْتُمْ ۖ وَلَا تُسْأَلُونَ عَمَّا كَانُوا يَعْمَلُونَ","commentary":"Tämä jae toistaa jakeessa 134 esitetyn väitteen. Toistamalla sen profeettoja ja myöhempien uskonnollisten ryhmien väitteitä koskevan keskustelun jälkeen, se vahvistaa voimakkaasti keskeisen sanoman: sukujuuret tai historiallinen yhteys eivät takaa pelastusta tai erityisasemaa. Menneiden sukupolvien teot kuuluvat heille, ja sinun tekosi kuuluvat sinulle. Et ole vastuussa heidän teoistaan, etkä heidän ansionsa automaattisesti hyödytä sinua. Tämä jae toimii tämän osion päättävänä muistutuksena, vahvistaen islamin ydinkäsitteen yksilön vastuullisuudesta Allahin edessä, erillään esi-isien tai ryhmän identiteetistä.","translations":{"opas":"Se sukupolvi on siirtynyt pois. Se on saanut, mitä oli ansainnut; te saatte, mitä te ansaitsette. Ettekä te joudu vastaamaan siitä, mitä he tekivät.","clear":"Se oli yhteisö, joka oli jo mennyt. Heille kuuluu se, minkä he ovat ansainneet, ja teille se, minkä olette ansainneet. Eikä teitä pidetä vastuussa siitä, mitä he ovat tehneet."}},{"verse":142,"commentary_en":"This verse anticipates questions that people might raise about a change in the direction Muslims face during prayer. Previously, Muslims in Madinah prayed facing Jerusalem, which was also the direction for Jewish and Christian prayer. This verse refers to those who might question why Muslims would change this direction. It directs Prophet Muhammad to respond by stating that all directions, east and west, belong to Allah. This emphasizes Allah's absolute sovereignty and that He guides whomever He wills to the correct path. The significance of a direction for prayer (Qibla) comes from Allah's designation, not from any inherent quality of the direction itself. This serves to immediately address potential objections and set the stage for the subsequent verses.","commentary_fi":"Tämä jae ennakoi kysymyksiä, joita ihmiset saattaisivat esittää muutoksesta siihen suuntaan, johon muslimit kääntyvät rukouksen aikana. Aikaisemmin muslimit Medinassa rukoilivat kohti Jerusalemia, joka oli myös juutalaisten ja kristittyjen rukoussuunta. Tämä jae viittaa niihin, jotka saattaisivat kyseenalaistaa, miksi muslimit muuttaisivat tätä suuntaa. Se ohjaa profeetta Muhammadia vastaamaan todeten, että kaikki suunnat, itä ja länsi, kuuluvat Allahille. Tämä korostaa Allahin ehdotonta suvereniteettia ja sitä, että Hän ohjaa kenet tahtoo oikealle tielle. Rukoussuunnan (Qibla) merkitys tulee Allahin määräyksestä, ei itse suunnan luontaisesta ominaisuudesta. Tämä palvelee välittömästi potentiaalisten vastalauseiden käsittelyä ja pohjustaa seuraavia jakeita.","arabic":"سَيَقُولُ السُّفَهَاءُ مِنَ النَّاسِ مَا وَلَّاهُمْ عَنْ قِبْلَتِهِمُ الَّتِي كَانُوا عَلَيْهَا ۚ قُلْ لِلَّهِ الْمَشْرِقُ وَالْمَغْرِبُ ۚ يَهْدِي مَنْ يَشَاءُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ","commentary":"Tämä jae ennakoi kysymyksiä, joita ihmiset saattaisivat esittää muutoksesta siihen suuntaan, johon muslimit kääntyvät rukouksen aikana. Aikaisemmin muslimit Medinassa rukoilivat kohti Jerusalemia, joka oli myös juutalaisten ja kristittyjen rukoussuunta. Tämä jae viittaa niihin, jotka saattaisivat kyseenalaistaa, miksi muslimit muuttaisivat tätä suuntaa. Se ohjaa profeetta Muhammadia vastaamaan todeten, että kaikki suunnat, itä ja länsi, kuuluvat Allahille. Tämä korostaa Allahin ehdotonta suvereniteettia ja sitä, että Hän ohjaa kenet tahtoo oikealle tielle. Rukoussuunnan (Qibla) merkitys tulee Allahin määräyksestä, ei itse suunnan luontaisesta ominaisuudesta. Tämä palvelee välittömästi potentiaalisten vastalauseiden käsittelyä ja pohjustaa seuraavia jakeita.","translations":{"opas":"Mielettömät ihmiset tulevat sanomaan: »Mikä on kääntänyt heidät pois heidän kiblastaan, jota päin he ennen suuntautuivat rukoillessaan?» Sano: »Jumalalle kuuluu Itä ja Länsi. Hän johtaa kenet tahtoo oikealle tielle.»","clear":"Tyhmät ihmiset tulevat kysymään: \"Miksi he kääntyivät pois siitä rukoussuunnasta, johon he olivat tottuneet?\" Sano, oi Profeetta: \"Itä ja länsi kuuluvat vain Jumalalle. Hän johdattaa kenet tahtoo suoralle tielle.\""}},{"verse":143,"commentary_en":"This verse connects the change in the direction of prayer (Qibla) to the identity and role of the Muslim community, called an *Ummah* in the Qur'an. Allah states that He has made this community a \"justly balanced Ummah.\" This means they are meant to be moderate, upright, and a model for humanity, positioned to bear witness to truth and justice among all people. Prophet Muhammad serves as a witness over this community, guiding and setting the standard for their actions and beliefs. The verse then clarifies that the *previous* direction of prayer (Jerusalem) was a test. It was intended to distinguish those who truly followed the Messenger from those whose faith was shallow. This change was difficult, except for those whom Allah guided. The verse reassures believers that Allah would never cause their earlier prayers or their faith to be wasted, confirming His compassion and mercy.","commentary_fi":"Tämä jae yhdistää rukoussuunnan (Qibla) muutoksen muslimiyhteisön, jota Koraanissa kutsutaan nimellä *Ummah*, identiteettiin ja rooliin. Allah sanoo, että Hän on tehnyt tästä yhteisöstä \"oikeudenmukaisesti tasapainotetun Ummahin\". Tämä tarkoittaa, että heidän on tarkoitus olla maltillisia, rehellisiä ja ihmiskunnan malli, jotka ovat valmiita todistamaan totuudesta ja oikeudenmukaisuudesta kaikkien ihmisten keskuudessa. Profeetta Muhammad toimii todistajana tämän yhteisön yllä, ohjaten ja asettaen standardin heidän teoilleen ja uskomuksilleen. Jae selventää sitten, että *edellinen* rukoussuunta (Jerusalem) oli koe. Sen tarkoituksena oli erottaa ne, jotka todella seurasivat Lähettilästä, niistä, joiden usko oli pinnallista. Tämä muutos oli vaikea, paitsi niille, jotka Allah ohjasi. Jae vakuuttaa uskovaisille, että Allah ei koskaan antaisi heidän aikaisempien rukoustensa tai uskonsa mennä hukkaan, vahvistaen Hänen myötätuntonsa ja armonsa.","arabic":"وَكَذَٰلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا لِتَكُونُوا شُهَدَاءَ عَلَى النَّاسِ وَيَكُونَ الرَّسُولُ عَلَيْكُمْ شَهِيدًا ۗ وَمَا جَعَلْنَا الْقِبْلَةَ الَّتِي كُنْتَ عَلَيْهَا إِلَّا لِنَعْلَمَ مَنْ يَتَّبِعُ الرَّسُولَ مِمَّنْ يَنْقَلِبُ عَلَىٰ عَقِبَيْهِ ۚ وَإِنْ كَانَتْ لَكَبِيرَةً إِلَّا عَلَى الَّذِينَ هَدَى اللَّهُ ۗ وَمَا كَانَ اللَّهُ لِيُضِيعَ إِيمَانَكُمْ ۚ إِنَّ اللَّهَ بِالنَّاسِ لَرَءُوفٌ رَحِيمٌ","commentary":"Tämä jae yhdistää rukoussuunnan (Qibla) muutoksen muslimiyhteisön, jota Koraanissa kutsutaan nimellä *Ummah*, identiteettiin ja rooliin. Allah sanoo, että Hän on tehnyt tästä yhteisöstä \"oikeudenmukaisesti tasapainotetun Ummahin\". Tämä tarkoittaa, että heidän on tarkoitus olla maltillisia, rehellisiä ja ihmiskunnan malli, jotka ovat valmiita todistamaan totuudesta ja oikeudenmukaisuudesta kaikkien ihmisten keskuudessa. Profeetta Muhammad toimii todistajana tämän yhteisön yllä, ohjaten ja asettaen standardin heidän teoilleen ja uskomuksilleen. Jae selventää sitten, että *edellinen* rukoussuunta (Jerusalem) oli koe. Sen tarkoituksena oli erottaa ne, jotka todella seurasivat Lähettilästä, niistä, joiden usko oli pinnallista. Tämä muutos oli vaikea, paitsi niille, jotka Allah ohjasi. Jae vakuuttaa uskovaisille, että Allah ei koskaan antaisi heidän aikaisempien rukoustensa tai uskonsa mennä hukkaan, vahvistaen Hänen myötätuntonsa ja armonsa.","translations":{"opas":"Siten Me olemme tehnyt teidät (arabialaiset) välittäjäkansaksi, että te olisitte todistajia ihmisten edessä ja profeetta Muhammed olisi todistajana teidän edessänne. Kiblan, johon te ennen suuntauduitte, määräsimme ainoastaan erottaaksemme sen, joka seuraa profeettaa, siitä, joka peräytyy hänen luotaan takaisin. ja se oli totisesti vaikea koetus, paitsi niille, joita Jumala johtaa; mutta Jumalan tarkoitus ei ollut tehdä uskoanne turhaksi, sillä Jumala on totisesti lempeä ja laupias ihmisiä kohtaan.","clear":"Ja niin Me olemme tehneet teistä, uskovaiset, oikeamielisen yhteisön, jotta te olisitte todistajia ihmiskunnalle ja jotta Lähettiläs olisi todistaja teille. Me määräsimme entisen rukoussuuntanne vain erottaaksemme ne, jotka pysyisivät uskollisina Lähettiläälle, niistä, jotka menettäisivät uskonsa. Se oli todella vaikea koe paitsi niille, jotka Jumala on johdattanut oikein. Ja Jumala ei koskaan aliarvioisi uskoanne edellisistä teoistanne. Totisesti, Jumala on aina armollinen ja kaikkein armollisin ihmiskunnalle."}},{"verse":144,"commentary_en":"This verse describes Prophet Muhammad's unspoken desire for a different direction of prayer, showing him looking towards the heavens. Allah acknowledges this desire and states that He will now turn him to a Qibla that will be pleasing to him. This new, permanent direction is specified as the Sacred Mosque (the Ka'bah) in Mecca. The instruction is universal: wherever Muslims are, they should turn their faces towards this direction in prayer. The verse adds that the people who received earlier revelations know that this designation is the truth from their Lord, implying its historical and religious significance. It also assures believers that Allah is fully aware of the actions of all. This verse marks the formal institution of the Ka'bah as the permanent Qibla for Muslims worldwide.","commentary_fi":"Tämä jae kuvaa profeetta Muhammadin sanomatonta toivetta eri rukoussuunnasta, näyttäen hänet katsomassa taivaalle. Allah tunnustaa tämän toiveen ja sanoo, että Hän kääntää hänet nyt Qiblaan, joka miellyttää häntä. Tämä uusi, pysyvä suunta on määritelty Pyhäksi Moskeijaksi (Ka'ba) Mekassa. Ohje on universaali: missä tahansa muslimit ovatkin, heidän tulee kääntää kasvonsa tähän suuntaan rukouksessa. Jae lisää, että ihmiset, jotka saivat aikaisemmat ilmestykset, tietävät tämän määräyksen olevan totuus heidän Herraltaan, mikä viittaa sen historialliseen ja uskonnolliseen merkitykseen. Se myös vakuuttaa uskovaisille, että Allah on täysin tietoinen kaikkien teoista. Tämä jae merkitsee Ka'ban muodollista asettamista pysyväksi Qiblaksi muslimeille maailmanlaajuisesti.","arabic":"قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ ۖ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَاهَا ۚ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ ۚ وَحَيْثُ مَا كُنْتُمْ فَوَلُّوا وُجُوهَكُمْ شَطْرَهُ ۗ وَإِنَّ الَّذِينَ أُوتُوا الْكِتَابَ لَيَعْلَمُونَ أَنَّهُ الْحَقُّ مِنْ رَبِّهِمْ ۗ وَمَا اللَّهُ بِغَافِلٍ عَمَّا يَعْمَلُونَ","commentary":"Tämä jae kuvaa profeetta Muhammadin sanomatonta toivetta eri rukoussuunnasta, näyttäen hänet katsomassa taivaalle. Allah tunnustaa tämän toiveen ja sanoo, että Hän kääntää hänet nyt Qiblaan, joka miellyttää häntä. Tämä uusi, pysyvä suunta on määritelty Pyhäksi Moskeijaksi (Ka'ba) Mekassa. Ohje on universaali: missä tahansa muslimit ovatkin, heidän tulee kääntää kasvonsa tähän suuntaan rukouksessa. Jae lisää, että ihmiset, jotka saivat aikaisemmat ilmestykset, tietävät tämän määräyksen olevan totuus heidän Herraltaan, mikä viittaa sen historialliseen ja uskonnolliseen merkitykseen. Se myös vakuuttaa uskovaisille, että Allah on täysin tietoinen kaikkien teoista. Tämä jae merkitsee Ka'ban muodollista asettamista pysyväksi Qiblaksi muslimeille maailmanlaajuisesti.","translations":{"opas":"Olemme nähnyt, kuinka kasvosi (rukoillessasi) harhailivat sinne tänne taivasta kohti, mutta vastedes tahdomme totisesti kääntää kasvosi Kiblaan päin, joka on sinua tyydyttävä. Käännä siis kasvosi Rauhoitetun temppelin suuntaan. Ja te, muslimit, missä olettekaan, kääntäkää rukoillessaane kasvonne sinne. Katso, ne jotka Pyhän kirjan ovat saaneet, tietävät totisesti,että tämä (ilmoitus) on heidän Herraltansa, eikä Jumala ole välinpitämätön siitä, mitä he tekevät. Vaikka sinä näytätkin niille, jotka ovat Pyhän kirjan saaneet, kaikkia mahdollisia tunnusmerkkejä, eivät he suuntaudu sinun kiblasi mukaan.","clear":"Totisesti, Me näemme sinun, oi Profeetta, kääntävän kasvosi kohti taivasta. Nyt Me saamme sinut kääntymään kohti rukoussuuntaa, joka miellyttää sinua. Käännä siis kasvosi kohti Pyhää Moskeijaa Mekassa – missä tahansa olettekin, kääntäkää kasvonne sitä kohti. Ne, joille Kirja annettiin, tietävät varmasti tämän olevan totuus heidän Herraltaan. Eikä Jumala ole koskaan tietämätön siitä, mitä he tekevät."}},{"verse":145,"commentary_en":"Following the instruction to face the Sacred Mosque, this verse addresses the differing perspectives and challenges that arose. It states that even if Prophet Muhammad were to present every possible sign, the people of earlier revelations would not follow the Muslim Qibla. It also makes it clear that the Prophet is not to follow their Qibla. Furthermore, it highlights that even among themselves, the various groups among the people of earlier revelations do not agree on a single direction for prayer. The verse concludes with a strong warning to the Prophet (and by extension, to all Muslims) that following the desires of others after receiving clear knowledge from Allah would be a clear deviation from the right path. This emphasizes the distinct identity of the Muslim faith and the importance of adhering strictly to divine guidance.","commentary_fi":"Pyhää Moskeijaa kohti kääntymisen ohjeen jälkeen tämä jae käsittelee erilaisia näkökulmia ja haasteita, jotka syntyivät. Se toteaa, että vaikka profeetta Muhammad toisi kaikki mahdolliset merkit, aikaisempien ilmestyksien kansa ei seuraisi muslimien Qiblaa. Se tekee myös selväksi, että profeetta ei saa seurata heidän Qiblaansa. Lisäksi se korostaa, että jopa heidän keskuudessaan, aikaisempien ilmestyksien kansan eri ryhmät eivät ole yhtä mieltä yhdestä rukoussuunnasta. Jae päättyy voimakkaaseen varoitukseen profeetta (ja laajennuksena kaikille muslimeille), että muiden toiveiden seuraaminen sen jälkeen, kun selkeä tieto Allahilta on saapunut, olisi selvä poikkeama oikealta tieltä. Tämä korostaa muslimiuskon selkeää identiteettiä ja jumalallisen ohjauksen tiukan noudattamisen tärkeyttä.","arabic":"وَلَئِنْ أَتَيْتَ الَّذِينَ أُوتُوا الْكِتَابَ بِكُلِّ آيَةٍ مَا تَبِعُوا قِبْلَتَكَ ۚ وَمَا أَنْتَ بِتَابِعٍ قِبْلَتَهُمْ ۚ وَمَا بَعْضُهُمْ بِتَابِعٍ قِبْلَةَ بَعْضٍ ۚ وَلَئِنِ اتَّبَعْتَ أَهْوَاءَهُمْ مِنْ بَعْدِ مَا جَاءَكَ مِنَ الْعِلْمِ ۙ إِنَّكَ إِذًا لَمِنَ الظَّالِمِينَ","commentary":"Pyhää Moskeijaa kohti kääntymisen ohjeen jälkeen tämä jae käsittelee erilaisia näkökulmia ja haasteita, jotka syntyivät. Se toteaa, että vaikka profeetta Muhammad toisi kaikki mahdolliset merkit, aikaisempien ilmestyksien kansa ei seuraisi muslimien Qiblaa. Se tekee myös selväksi, että profeetta ei saa seurata heidän Qiblaansa. Lisäksi se korostaa, että jopa heidän keskuudessaan, aikaisempien ilmestyksien kansan eri ryhmät eivät ole yhtä mieltä yhdestä rukoussuunnasta. Jae päättyy voimakkaaseen varoitukseen profeetta (ja laajennuksena kaikille muslimeille), että muiden toiveiden seuraaminen sen jälkeen, kun selkeä tieto Allahilta on saapunut, olisi selvä poikkeama oikealta tieltä. Tämä korostaa muslimiuskon selkeää identiteettiä ja jumalallisen ohjauksen tiukan noudattamisen tärkeyttä.","translations":{"opas":"Sinäkään et voi suuntautua heidän kiblansa mukaan, eivät eräät heistäkään suuntaudu toisten kiblan mukaan, mutta jos sinä suuntaudut heidän toivomustensa mukaan kaiken sen tiedon jälkeen, mikä osaksesi on tullut, niin kuulut totisesti väärämielisiin.","clear":"Vaikka toisitkin jokaisen todisteen Kirjan ihmisille, he eivät hyväksyisi rukoussuuntaasi, etkä sinäkään hyväksyisi heidän suuntaansa; eivätkä heistäkään kukaan hyväksyisi toisen rukoussuuntaa. Ja jos seuraisit heidän halujaan kaiken sen tiedon jälkeen, joka on tullut sinulle, olisit varmasti yksi väärintekijöistä."}},{"verse":146,"commentary_en":"This verse asserts that those who received earlier revelations possess certain knowledge about the truth of Prophet Muhammad's message, including the significance of the Sacred Mosque—that is, the Ka'bah, which was built by Prophet Abraham. It employs a powerful comparison, stating that they recognize this truth as clearly as they recognize their own children. The phrase \"to recognize something as well as one recognizes one's sons\" is an Arabic idiom, used to describe knowledge that is beyond any doubt or uncertainty. Despite this inner certainty, the verse highlights that some among them deliberately conceal this truth. This explains why, as mentioned in the previous verse, they refuse to accept or follow the Muslim Qibla, despite knowing its authenticity.","commentary_fi":"Tämä jae toteaa, että ne, joille aiemmat ilmoitukset on annettu, omaavat varman tiedon profeetta Muhammadin sanoman totuudesta, mukaan lukien Pyhän moskeijan eli Kaaban merkityksen, jonka profeetta Abraham rakensi. Jae käyttää voimakasta vertausta todeten, että he tunnistavat tämän totuuden yhtä selvästi kuin tunnistavat omat lapsensa. Ilmaisu \"tunnistaa jokin yhtä hyvin kuin omat poikansa\" on arabialainen idiomi, jota käytetään asioista, jotka tunnetaan täysin varmuudella ilman pienintäkään epäilystä. Tästä sisäisestä varmuudesta huolimatta jae korostaa, että jotkut heistä tietoisesti salaavat tämän totuuden. Tämä selittää, miksi he, kuten edellisessä jakeessa mainittiin, kieltäytyvät hyväksymästä tai seuraamasta muslimien qiblaa, vaikka he tietävät sen aitouden.","arabic":"الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَعْرِفُونَهُ كَمَا يَعْرِفُونَ أَبْنَاءَهُمْ ۖ وَإِنَّ فَرِيقًا مِنْهُمْ لَيَكْتُمُونَ الْحَقَّ وَهُمْ يَعْلَمُونَ","commentary":"Tämä jae toteaa, että ne, joille aiemmat ilmoitukset on annettu, omaavat varman tiedon profeetta Muhammadin sanoman totuudesta, mukaan lukien Pyhän moskeijan eli Kaaban merkityksen, jonka profeetta Abraham rakensi. Jae käyttää voimakasta vertausta todeten, että he tunnistavat tämän totuuden yhtä selvästi kuin tunnistavat omat lapsensa. Ilmaisu \"tunnistaa jokin yhtä hyvin kuin omat poikansa\" on arabialainen idiomi, jota käytetään asioista, jotka tunnetaan täysin varmuudella ilman pienintäkään epäilystä. Tästä sisäisestä varmuudesta huolimatta jae korostaa, että jotkut heistä tietoisesti salaavat tämän totuuden. Tämä selittää, miksi he, kuten edellisessä jakeessa mainittiin, kieltäytyvät hyväksymästä tai seuraamasta muslimien qiblaa, vaikka he tietävät sen aitouden.","translations":{"opas":"Ne (profeetat), joille olemme Pyhän kirjan antanut, tuntevat sen yhtä hyvin, kuin he tuntevat omat poikansa, mutta osa heistä salaa totuuden vastoin parempaa tietoaan.","clear":"Ne, joille olemme antaneet Pyhät kirjoitukset, tuntevat tämän ˹profeetan˺ yhtä hyvin kuin omat lapsensa. Kuitenkin osa heistä salaa totuuden tietoisesti."}},{"verse":147,"commentary_en":"This verse directly addresses Prophet Muhammad, reaffirming the message from the previous verses. It confirms that what has been revealed to him is the absolute truth, originating solely from Allah. The Prophet is instructed to harbor no doubt whatsoever regarding this truth. Although the address is to the Prophet, it also serves as a reassurance to all believers and as a firm response to any doubts or challenges raised by others. The verse underscores the ultimate authority, clarity, and certainty of Allah's revelation.","commentary_fi":"Tämä jae osoitetaan suoraan profeetta Muhammadille, vahvistaen aiemmissa jakeissa esitetyn sanoman. Se vahvistaa, että hänelle ilmoitettu on ehdoton totuus, joka on peräisin yksinomaan Allahilta. Profeettaa kehotetaan olemaan epäilemättä lainkaan tätä totuutta. Vaikka osoitus on suunnattu profeetalle, se toimii myös lohdutuksena kaikille uskoville sekä selkeänä vastauksena kaikkiin muihin esitettyihin epäilyksiin tai haasteisiin. Jae korostaa Allahin ilmoituksen lopullista auktoriteettia, selkeyttä ja varmuutta.","arabic":"الْحَقُّ مِنْ رَبِّكَ ۖ فَلَا تَكُونَنَّ مِنَ الْمُمْتَرِينَ","commentary":"Tämä jae osoitetaan suoraan profeetta Muhammadille, vahvistaen aiemmissa jakeissa esitetyn sanoman. Se vahvistaa, että hänelle ilmoitettu on ehdoton totuus, joka on peräisin yksinomaan Allahilta. Profeettaa kehotetaan olemaan epäilemättä lainkaan tätä totuutta. Vaikka osoitus on suunnattu profeetalle, se toimii myös lohdutuksena kaikille uskoville sekä selkeänä vastauksena kaikkiin muihin esitettyihin epäilyksiin tai haasteisiin. Jae korostaa Allahin ilmoituksen lopullista auktoriteettia, selkeyttä ja varmuutta.","translations":{"opas":"Totuus tulee Herraltasi; siksi älä kuulu epäilijöiden joukkoon.","clear":"˹Tämä on˺ totuus Herraltasi, älä siis koskaan ole epäilijöiden joukossa."}},{"verse":148,"commentary_en":"After addressing the specific issue of the Qibla and the differing perspectives, this verse offers a broader perspective. It acknowledges that different communities may have different directions they turn towards. However, it then immediately shifts the focus for Muslims: instead of being distracted by these differences or engaging in futile arguments, they are urged to compete with one another in doing good deeds. This redirects their energy towards positive action and moral excellence. It reassures them that no matter where they are, Allah has the power to bring them together, emphasizing the unity of the Muslim community and Allah's complete power over all things.\n\nAfter addressing the specific issue of the Qibla and the differing perspectives, this verse offers a broader lesson. It acknowledges that different communities may have their own directions of prayer. However, it redirects the focus of Muslims away from becoming preoccupied with these differences or falling into unproductive arguments. Instead, they are encouraged to strive with one another in performing good deeds, channeling their energy into positive action and moral excellence. The verse further reassures them that wherever they may be, Allah has the power to gather them together, emphasizing Allah's absolute control over all things.","commentary_fi":"Tässä jakeessa siirrytään pois pelkästä keskustelusta qiblan suunnasta ja siihen liittyvistä näkemyseroista ja tarjotaan laajempi opetus. Siinä tunnustetaan, että eri yhteisöillä voi olla omat rukoussunnat. Kuitenkin muslimien huomiota ohjataan pois siitä, että he jäisivät kiinni näihin eroavaisuuksiin tai ajautuisivat hedelmättömiin väittelyihin. Sen sijaan heitä kehotetaan kilvoittelemaan toistensa kanssa hyvien tekojen tekemisessä ja suuntaamaan energiansa positiivisiin tekoihin ja moraaliseen erinomaisuuteen. Jae antaa heille myös varmuutta siitä, että missä he sitten ovatkin, Allahilla on valta koota heidät yhteen, korostaen Allahin täydellistä herruutta kaikkeen.","arabic":"وَلِكُلٍّ وِجْهَةٌ هُوَ مُوَلِّيهَا ۖ فَاسْتَبِقُوا الْخَيْرَاتِ ۚ أَيْنَ مَا تَكُونُوا يَأْتِ بِكُمُ اللَّهُ جَمِيعًا ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","commentary":"Tässä jakeessa siirrytään pois pelkästä keskustelusta qiblan suunnasta ja siihen liittyvistä näkemyseroista ja tarjotaan laajempi opetus. Siinä tunnustetaan, että eri yhteisöillä voi olla omat rukoussunnat. Kuitenkin muslimien huomiota ohjataan pois siitä, että he jäisivät kiinni näihin eroavaisuuksiin tai ajautuisivat hedelmättömiin väittelyihin. Sen sijaan heitä kehotetaan kilvoittelemaan toistensa kanssa hyvien tekojen tekemisessä ja suuntaamaan energiansa positiivisiin tekoihin ja moraaliseen erinomaisuuteen. Jae antaa heille myös varmuutta siitä, että missä he sitten ovatkin, Allahilla on valta koota heidät yhteen, korostaen Allahin täydellistä herruutta kaikkeen.","translations":{"opas":"Jokaisella on nyt määrätty suunta, johon hän kääntyy (rukoillessaan); niin kilpailkaa nyt siis toistenne kanssa hyvissä teoissa. Missä olettekin, on Jumala johdattava teidät yhteen; Jumala on totisesti kaikkivaltias.","clear":"Jokainen kääntyy omaan rukoussuuntaansa. Kilpailkaa siis toistenne kanssa hyvän tekemisessä. Missä tahansa olettekin, Jumala kokoaa teidät kaikki yhteen ˹tuomiolle˺. Totisesti, Jumala on kaikkivoipa kaikessa."}},{"verse":149,"commentary_en":"This verse reiterates the command given in Verse 144 regarding the direction of prayer. It emphasizes again, \"From wherever you may come forth,\" meaning from any location or starting point, Prophet Muhammad and thus all Muslims are to turn their face towards the Sacred Mosque during prayer. It stresses that this is undeniably \"the truth from your Lord.\" The verse concludes by reminding believers that Allah is fully aware of everything they do, serving as a reminder of accountability and sincerity in following His commands. This repetition underscores the importance  of this instruction.","commentary_fi":"Tämä jae toistaa jakeessa 144 annetun käskyn rukoussuunnan suhteen. Se korostaa jälleen: \"Mistä tahansa lähdetkin liikkeelle\", tarkoittaen mistä tahansa sijainnista tai lähtökohdasta, profeetta Muhammadin ja siten kaikkien muslimien on käännettävä kasvonsa Pyhää Moskeijaa kohti rukouksen aikana. Se korostaa, että tämä on kiistatta \"totuus Herraltasi\". Jae päättyy muistuttamalla uskovaisia siitä, että Allah on täysin tietoinen kaikesta, mitä he tekevät, toimien muistutuksena vastuullisuudesta ja vilpittömyydestä Hänen käskyjensä noudattamisessa. Tämä toisto korostaa tämän ohjeen tärkeyttä.","arabic":"وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ ۖ وَإِنَّهُ لَلْحَقُّ مِنْ رَبِّكَ ۗ وَمَا اللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ","commentary":"Tämä jae toistaa jakeessa 144 annetun käskyn rukoussuunnan suhteen. Se korostaa jälleen: \"Mistä tahansa lähdetkin liikkeelle\", tarkoittaen mistä tahansa sijainnista tai lähtökohdasta, profeetta Muhammadin ja siten kaikkien muslimien on käännettävä kasvonsa Pyhää Moskeijaa kohti rukouksen aikana. Se korostaa, että tämä on kiistatta \"totuus Herraltasi\". Jae päättyy muistuttamalla uskovaisia siitä, että Allah on täysin tietoinen kaikesta, mitä he tekevät, toimien muistutuksena vastuullisuudesta ja vilpittömyydestä Hänen käskyjensä noudattamisessa. Tämä toisto korostaa tämän ohjeen tärkeyttä.","translations":{"opas":"Mistä tuletkin, käännä kasvosi Rauhoitetun temppelin suuntaan, sillä tämä on totuus Herraltasi, eikä Jumala ole välinpitämätön siitä, mitä te teette.","clear":"Missä tahansa oletkin, ˹oi profeetta˺, käännä kasvosi kohti Pyhää Moskeijaa. Tämä on varmasti totuus Herraltasi. Ja Jumala ei koskaan ole tietämätön siitä, mitä te ˹kaikki˺ teette."}},{"verse":150,"commentary_en":"This is the third time the command to face the Sacred Mosque in prayer is given, underscoring its great importance. In this repetition, the directive is extended universally to all Muslims, regardless of where they are. A key reason provided is to eliminate any argument others might have against them. By establishing a clear and divinely appointed Qibla connected to the legacy of Prophet Abraham, Muslims are given a strong foundation that leaves no room for legitimate criticism regarding their direction of worship. The verse notes that only those who persist in wrongdoing will continue to argue. It then instructs Muslims not to fear such detractors but to fear Allah alone. This guidance is tied to Allah's completion of His favor upon them and His commitment to guide them. Overall, the verse reinforces the formation of a distinct Muslim identity, rooted in obedience to Allah and supported by His protection and guidance.","commentary_fi":"Tämä on kolmas kerta, kun käsky kääntyä kohti Pyhää Moskeijaa rukouksessa annetaan, mikä korostaa sen suurta merkitystä. Tällä kertaa ohje annetaan yleisesti kaikille muslimeille, riippumatta siitä, missä he ovat. Yksi keskeinen syy on poistaa muilta mahdollisuus esittää väitteitä heitä vastaan. Määrittelemällä selkeä ja Jumalan asettama qibla, joka liittyy profeetta Aabrahamin perintöön, muslimeille annetaan vahva perusta, joka ei jätä tilaa oikeutetulle kritiikille heidän rukoussunnastaan. Jae toteaa, että vain ne, jotka pysyvät väärintekijöinä, jatkavat kiistelyä. Sitten muslimeille neuvotaan olemaan pelkäämättä tällaisia vastustajia, vaan pelkäämään ainoastaan Allahia. Tämä ohje liittyy Allahin siunauksen täydentämiseen heitä kohtaan ja Hänen johdatukseensa. Kaiken kaikkiaan jae vahvistaa muslimien oman identiteetin rakentamista, joka perustuu Allahin tottelemiseen ja jota tukee Hänen suojeluksensa ja johdatuksensa.","arabic":"وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ ۚ وَحَيْثُ مَا كُنْتُمْ فَوَلُّوا وُجُوهَكُمْ شَطْرَهُ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَيْكُمْ حُجَّةٌ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ فَلَا تَخْشَوْهُمْ وَاخْشَوْنِي وَلِأُتِمَّ نِعْمَتِي عَلَيْكُمْ وَلَعَلَّكُمْ تَهْتَدُونَ","commentary":"Tämä on kolmas kerta, kun käsky kääntyä kohti Pyhää Moskeijaa rukouksessa annetaan, mikä korostaa sen suurta merkitystä. Tällä kertaa ohje annetaan yleisesti kaikille muslimeille, riippumatta siitä, missä he ovat. Yksi keskeinen syy on poistaa muilta mahdollisuus esittää väitteitä heitä vastaan. Määrittelemällä selkeä ja Jumalan asettama qibla, joka liittyy profeetta Aabrahamin perintöön, muslimeille annetaan vahva perusta, joka ei jätä tilaa oikeutetulle kritiikille heidän rukoussunnastaan. Jae toteaa, että vain ne, jotka pysyvät väärintekijöinä, jatkavat kiistelyä. Sitten muslimeille neuvotaan olemaan pelkäämättä tällaisia vastustajia, vaan pelkäämään ainoastaan Allahia. Tämä ohje liittyy Allahin siunauksen täydentämiseen heitä kohtaan ja Hänen johdatukseensa. Kaiken kaikkiaan jae vahvistaa muslimien oman identiteetin rakentamista, joka perustuu Allahin tottelemiseen ja jota tukee Hänen suojeluksensa ja johdatuksensa.","translations":{"opas":"Mistä tuletkin, käännä kasvosi Rauhoitetun temppelin suuntaan, ja missä olettekin, muslimit, kääntäkää kasvonne sinne rukoillessanne, jottei muille ihmisille jäisi mitään sanomista teitä vastaan, paitsi sellaisille, jotka väärin tekevät. Mutta älkää pelätkö heitä, vaan pelätkää Minua ja tehkää tämä siksi, että Minä voisin saattaa suosioni teille täydelliseksi, jotta te pysyisitte oikealla tiellä.","clear":"Missä tahansa oletkin, ˹oi profeetta˺, käännä kasvosi kohti Pyhää Moskeijaa. Ja missä tahansa te ˹uskovat˺ olettekin, kääntykää sitä kohti, jotta ihmisillä ei olisi teitä vastaan väitteitä, paitsi väärintekijöillä heidän joukossaan. Älkää pelätkö heitä; pelätkää Minua, jotta voisin ˹jatkaa˺ täydellistää suosioni teitä kohtaan ja jotta teidät johdatettaisiin ˹oikein˺."}},{"verse":151,"commentary_en":"This verse broadens the focus while remaining connected to the theme of Allah's favor upon the Muslim community, as mentioned at the end of the previous verse. It reminds them of a great blessing already bestowed: the sending of a Messenger, Prophet Muhammad, from among themselves. Significantly, this verse echoes the very words of Prophet Abraham’s prayer (Verse 129), establishing a direct and meaningful link between the two prophets and their shared message. This affirms that Islam was not a newly invented faith or a response to circumstance, but rather has its roots firmly established in history. Similarly, the direction of prayer being established was not chosen randomly, but as a direct response to Abraham’s passionate and sincere prayers. The mission of Prophet Muhammad involves several crucial roles—reciting Allah's verses (the Qur'an), purifying them from wrong beliefs and conduct, teaching them the Scripture and wisdom, and instructing them in knowledge they did not previously possess. This highlights the transformative impact of Prophet Muhammad's mission on the early Muslim community, elevating them from ignorance and misguided practices to a state of knowledge, purity, and wisdom, preparing them for the important role they are meant to play.","commentary_fi":"Tämä jae laajentaa näkökulmaa säilyttäen kuitenkin yhteyden edellisen jakeen lopussa mainittuun Allahin suosioon muslimiyhteisöä kohtaan. Siinä muistutetaan suuresta siunauksesta, joka on jo annettu: Lähettilään, profeetta Muhammadin, lähettämisestä heidän omiensa joukosta. Merkittävää on, että tämä jae toistaa profeetta Abrahamin rukouksen sanat (jae 129), luoden näin suoran ja merkittävän yhteyden näiden kahden profeetan ja heidän yhteisen sanomansa välille. Tämä vahvistaa, ettei islam ole uusi tai tilanteen sanelemana syntynyt uskonto, vaan sillä on syvät juuret historiassa. Samoin rukoussunnan määrääminen ei ollut sattumanvaraista, vaan suora vastaus Abrahamin palavasti ja vilpittömästi esittämään rukoukseen. Profeetta Muhammadin tehtävä sisältää useita tärkeitä rooleja: Allahin merkkien (Koraanin) resitointi, yhteisön puhdistaminen vääristä uskomuksista ja käytöksestä, Kirjoituksen ja viisauden opettaminen sekä uuden tiedon välittäminen, jota he eivät aiemmin tienneet. Tämä korostaa profeetta Muhammadin tehtävän mullistavaa vaikutusta varhaiseen muslimiyhteisöön, joka hänen johdollaan nousi tietämättömyydestä ja harhautuneista tavoista tiedon, puhtauden ja viisauden tilaan valmistautuakseen tärkeään rooliinsa.","arabic":"كَمَا أَرْسَلْنَا فِيكُمْ رَسُولًا مِنْكُمْ يَتْلُو عَلَيْكُمْ آيَاتِنَا وَيُزَكِّيكُمْ وَيُعَلِّمُكُمُ الْكِتَابَ وَالْحِكْمَةَ وَيُعَلِّمُكُمْ مَا لَمْ تَكُونُوا تَعْلَمُونَ","commentary":"Tämä jae laajentaa näkökulmaa säilyttäen kuitenkin yhteyden edellisen jakeen lopussa mainittuun Allahin suosioon muslimiyhteisöä kohtaan. Siinä muistutetaan suuresta siunauksesta, joka on jo annettu: Lähettilään, profeetta Muhammadin, lähettämisestä heidän omiensa joukosta. Merkittävää on, että tämä jae toistaa profeetta Abrahamin rukouksen sanat (jae 129), luoden näin suoran ja merkittävän yhteyden näiden kahden profeetan ja heidän yhteisen sanomansa välille. Tämä vahvistaa, ettei islam ole uusi tai tilanteen sanelemana syntynyt uskonto, vaan sillä on syvät juuret historiassa. Samoin rukoussunnan määrääminen ei ollut sattumanvaraista, vaan suora vastaus Abrahamin palavasti ja vilpittömästi esittämään rukoukseen. Profeetta Muhammadin tehtävä sisältää useita tärkeitä rooleja: Allahin merkkien (Koraanin) resitointi, yhteisön puhdistaminen vääristä uskomuksista ja käytöksestä, Kirjoituksen ja viisauden opettaminen sekä uuden tiedon välittäminen, jota he eivät aiemmin tienneet. Tämä korostaa profeetta Muhammadin tehtävän mullistavaa vaikutusta varhaiseen muslimiyhteisöön, joka hänen johdollaan nousi tietämättömyydestä ja harhautuneista tavoista tiedon, puhtauden ja viisauden tilaan valmistautuakseen tärkeään rooliinsa.","translations":{"opas":"Me olemme lähettäneet profeetan teidän omasta keskuudestanne luoksenne, jotta hän julistaisi teille tunnusmerkkimme ja tekisi teidät puhtaaksi, opettaisi teille Pyhää kirjaa sekä viisautta ja opettaisi teille, mitä ette ennen tietäneet.","clear":"Koska olemme lähettäneet teille sanansaattajan omasta keskuudestanne – lukien teille ilmestyksiämme, puhdistaen teidät, opettaen teille Kirjaa ja viisautta sekä opettaen teille sitä, mitä ette koskaan tienneet –"}},{"verse":152,"commentary_en":"Following the discussion of Allah's favours, such as sending a Messenger (Prophet Muhammad) and guiding the believers, this verse invites believers into an intimate, living connection with their Creator through both remembrance and gratitude. Remembering Allah is not merely a ritual but an act that uplifts, purifies, and anchors the believer, bringing tranquility and inviting His special mercy. Expressing gratitude deepens this bond, reminding the believer to acknowledge Allah’s endless favors through obedience, humility, and service. At the same time, the verse carries a subtle yet serious warning: neglecting gratitude and remembrance can lead to spiritual blindness, estrangement, and even denial of the One who bestows all blessings. In a world of distractions and competing narratives, this balance of remembrance and gratitude becomes a shield that preserves the believer’s faith, identity, and connection to Allah—the true source of strength and guidance.","commentary_fi":"Seuraten keskustelua Allahin suosiosta, kuten Lähettäjän (Profeetta Muhammadin) lähettämisestä ja uskovaisten johdattamisesta, tämä jae kutsuu uskovia intiimiin, elävään yhteyteen Luojansa kanssa sekä muistamalla että osoittamalla kiitollisuutta. Allahin muistaminen ei ole vain rituaali, vaan teko, joka kohottaa, puhdistaa ja ankkuroi uskovan, tuoden sydämeen tyyneyttä ja houkutellen Hänen erityistä armoaan. Kiitollisuuden osoittaminen syventää tätä sidettä muistuttamalla uskovaa Allahin loputtomista siunauksista, joita tulisi osoittaa kuuliaisuuden, nöyryyden ja palvelemisen kautta. Samalla jae sisältää hienovaraisen mutta vakavan varoituksen: kiitollisuuden ja muistamisen laiminlyönti voi johtaa hengelliseen sokeuteen, vieraantumiseen ja jopa kieltämään Hänet, joka antaa kaikki siunaukset. Maailmassa, joka on täynnä häiriötekijöitä ja kilpailevia kertomuksia, tämä muiston ja kiitollisuuden tasapaino toimii kilpenä, joka säilyttää uskovan uskon, identiteetin ja yhteyden Allahiin – todelliseen voiman ja johdatuksen lähteeseen.","arabic":"فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ","commentary":"Seuraten keskustelua Allahin suosiosta, kuten Lähettäjän (Profeetta Muhammadin) lähettämisestä ja uskovaisten johdattamisesta, tämä jae kutsuu uskovia intiimiin, elävään yhteyteen Luojansa kanssa sekä muistamalla että osoittamalla kiitollisuutta. Allahin muistaminen ei ole vain rituaali, vaan teko, joka kohottaa, puhdistaa ja ankkuroi uskovan, tuoden sydämeen tyyneyttä ja houkutellen Hänen erityistä armoaan. Kiitollisuuden osoittaminen syventää tätä sidettä muistuttamalla uskovaa Allahin loputtomista siunauksista, joita tulisi osoittaa kuuliaisuuden, nöyryyden ja palvelemisen kautta. Samalla jae sisältää hienovaraisen mutta vakavan varoituksen: kiitollisuuden ja muistamisen laiminlyönti voi johtaa hengelliseen sokeuteen, vieraantumiseen ja jopa kieltämään Hänet, joka antaa kaikki siunaukset. Maailmassa, joka on täynnä häiriötekijöitä ja kilpailevia kertomuksia, tämä muiston ja kiitollisuuden tasapaino toimii kilpenä, joka säilyttää uskovan uskon, identiteetin ja yhteyden Allahiin – todelliseen voiman ja johdatuksen lähteeseen.","translations":{"opas":"Muistakaa siis Minua, niin Minä olen muistava teitä. Osoittakaa Minulle kiitollisuutta älkääkä kieltäkö minua.","clear":"muistakaa Minua; Minä muistan teitä. Ja kiittäkää Minua älkääkä koskaan olko kiittämättömiä."}},{"verse":153,"commentary_en":"This verse speaks directly to believers, encouraging them to seek strength and support through two important means: patience and prayer. We are reminded that patience and prayer are essential tools, especially when facing the challenges and difficulties inherent in life and in striving to live according to divine guidance. These two qualities are highlighted as primary ways to find help, because Allah is with those who are patient. This is a source of great reassurance, indicating divine support for those who endure patiently. This verse follows broader instructions about the Muslim community's identity and role, providing practical guidance on how to uphold that role through personal discipline and connection with Allah.","commentary_fi":"Tämä jae on osoitettu suoraan uskoville ja kannustaa heitä etsimään voimaa ja tukea kahden tärkeän keinon, kärsivällisyyden ja rukouksen, avulla. Meille muistutetaan, että kärsivällisyys ja rukous ovat välttämättömiä työkaluja erityisesti kohdatessa elämän haasteita ja vaikeuksia sekä pyrkiessä elämään jumalallisen johdatuksen mukaisesti. Nämä kaksi ominaisuutta korostetaan ensisijaisina tapoina löytää apua, sillä Allah on kärsivällisten kanssa. Tämä on suuri lohdutuksen lähde, joka osoittaa jumalallista tukea kärsivällisesti kestäville. Tämä jae tulee laajemman ohjeistuksen jälkeen, joka koskee muslimiyhteisön identiteettiä ja roolia, tarjoten käytännön opastusta tämän roolin ylläpitämiseen henkilökohtaisen kurin ja yhteyden kautta Allahiin.","arabic":"يَا أَيُّهَا الَّذِين
