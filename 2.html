 a powerful reminder of accountability to Allah, who is the ultimate witness and judge of people's actions, especially concerning fulfilling trusts and upholding justice regarding the deceased's property.","commentary_fi":"Tämä jae käsittelee edellisessä jakeessa mainitun testamentin koskemattomuutta. Se varoittaa, että jos henkilö, jolla on tieto testamentista, muuttaa sen sisältöä sen tehneen henkilön kuoleman jälkeen, synti ja vastuu tästä muutoksesta lankeaa kokonaan sille, joka tekee muutoksen. Kuollut henkilö, täytettyään velvollisuutensa testamentin tekemällä, ei kanna syytä myöhemmistä luvattomista muokkauksista. Jae vahvistaa tämän toteamalla, että Allah kuulee kaiken ja tietää kaiken. Tämä tarkoittaa, että Allah on tietoinen testomentin tekijän alkuperäisistä aikomuksista, testamenttia peukaloivien teoista ja kaikista piilotetuista asioista. Muslimit uskovat, että Allahin ominaisuudet, kuten kaiken kuuleminen ja tietäminen, vahvistetaan sellaisina kuin ne esiintyvät Koraanissa, vertaamatta Allahia Hänen luomakuntaansa tai selittämättä, miten ne tapahtuvat. Pikemminkin ne heijastavat Hänen majesteettiuttaan ja ainutlaatuisuuttaan tavalla, joka ylittää ihmisen ymmärryksen. Tämä toimii voimakkaana muistutuksena vastuullisuudesta Allahille, joka on lopullinen todistaja ja tuomari ihmisten teoille, erityisesti luottamusten täyttämisen ja kuolleen omaisuutta koskevan oikeudenmukaisuuden noudattamisen suhteen.","arabic":"فَمَنْ بَدَّلَهُ بَعْدَمَا سَمِعَهُ فَإِنَّمَا إِثْمُهُ عَلَى الَّذِينَ يُبَدِّلُونَهُ ۚ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ","commentary":"Tämä jae käsittelee edellisessä jakeessa mainitun testamentin koskemattomuutta. Se varoittaa, että jos henkilö, jolla on tieto testamentista, muuttaa sen sisältöä sen tehneen henkilön kuoleman jälkeen, synti ja vastuu tästä muutoksesta lankeaa kokonaan sille, joka tekee muutoksen. Kuollut henkilö, täytettyään velvollisuutensa testamentin tekemällä, ei kanna syytä myöhemmistä luvattomista muokkauksista. Jae vahvistaa tämän toteamalla, että Allah kuulee kaiken ja tietää kaiken. Tämä tarkoittaa, että Allah on tietoinen testomentin tekijän alkuperäisistä aikomuksista, testamenttia peukaloivien teoista ja kaikista piilotetuista asioista. Muslimit uskovat, että Allahin ominaisuudet, kuten kaiken kuuleminen ja tietäminen, vahvistetaan sellaisina kuin ne esiintyvät Koraanissa, vertaamatta Allahia Hänen luomakuntaansa tai selittämättä, miten ne tapahtuvat. Pikemminkin ne heijastavat Hänen majesteettiuttaan ja ainutlaatuisuuttaan tavalla, joka ylittää ihmisen ymmärryksen. Tämä toimii voimakkaana muistutuksena vastuullisuudesta Allahille, joka on lopullinen todistaja ja tuomari ihmisten teoille, erityisesti luottamusten täyttämisen ja kuolleen omaisuutta koskevan oikeudenmukaisuuden noudattamisen suhteen.","translations":{"opas":"Jos joku muuttaa testamenttia, sen jälkeen kuin on sen kuullut, luetaan se synniksi vain niille, jotka sitä muuttavat. Katso, Jumala on totisesti kuuleva, tietävä.","clear":"Mutta kuka tahansa muuttaa testamentin kuultuaan sen, syy on vain niillä, jotka tekivät muutoksen. Totisesti, Allah on Kaikkikuuleva, Kaikkitietävä."}},{"verse":182,"commentary_en":"While the previous verse firmly prohibits altering a will, this verse offers important clarification regarding situations where fairness may be at stake. If the executor sincerely believes that the testator made an error or acted unjustly—perhaps by favoring certain heirs over others—and takes steps to mediate and guide the outcome toward a more equitable and peaceful resolution, they are not considered sinful. When such action is motivated by the desire to uphold justice and prevent conflict among family members, it is not only permitted but viewed positively. This reflects Islam’s broader moral framework: preserving family harmony, addressing potential wrongs, and fostering compassion. The verse concludes by affirming that Allah is Most Forgiving, Most Merciful, highlighting that striving for justice and reconciliation, even in delicate matters like inheritance, aligns with divine mercy and guidance. As with the rulings on retribution and bequests, this guidance ultimately points back to the core values of God-consciousness and ethical responsibility.","commentary_fi":"Vaikka edellinen jae kieltää ehdottomasti testamentin muuttamisen, tämä jae tuo tärkeää selkeytystä tilanteisiin, joissa oikeudenmukaisuus saattaa olla vaakalaudalla. Mikäli testamentin toimeenpanija vilpittömästi uskoo, että testamentintekijä on tehnyt virheen tai toiminut epäoikeudenmukaisesti—ehkä suosinut joitakin perillisiä toisten kustannuksella—ja ryhtyy toimiin ohjatakseen asianmukaisen ja rauhanomaisen ratkaisun suuntaan, häntä ei pidetä syntisenä. Kun tällainen toiminta kumpuaa halusta turvata oikeudenmukaisuus ja estää perheensisäiset ristiriidat, sitä ei ainoastaan sallita, vaan sitä pidetään myönteisenä. Tämä heijastaa islamin laajempaa moraalista viitekehystä: perhesovun vaalimista, mahdollisten vääryyksien korjaamista ja myötätunnon edistämistä. Jaen lopussa vahvistetaan, että Allah on Anteeksiantava, Armahtava—korostaen, että oikeudenmukisuuden ja sovinnon tavoittelu, jopa herkissä kysymyksissä kuten perintöasiat, on linjassa jumalallisen armon ja ohjauksen kanssa. Kuten kostoa ja testamentteja koskevissa säännöissä, myös tässä ohjauksessa palataan lopulta jumalatietoisuuden ja eettisen vastuun perusarvoihin.","arabic":"فَمَنْ خَافَ مِنْ مُوصٍ جَنَفًا أَوْ إِثْمًا فَأَصْلَحَ بَيْنَهُمْ فَلَا إِثْمَ عَلَيْهِ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ","commentary":"Vaikka edellinen jae kieltää ehdottomasti testamentin muuttamisen, tämä jae tuo tärkeää selkeytystä tilanteisiin, joissa oikeudenmukaisuus saattaa olla vaakalaudalla. Mikäli testamentin toimeenpanija vilpittömästi uskoo, että testamentintekijä on tehnyt virheen tai toiminut epäoikeudenmukaisesti—ehkä suosinut joitakin perillisiä toisten kustannuksella—ja ryhtyy toimiin ohjatakseen asianmukaisen ja rauhanomaisen ratkaisun suuntaan, häntä ei pidetä syntisenä. Kun tällainen toiminta kumpuaa halusta turvata oikeudenmukaisuus ja estää perheensisäiset ristiriidat, sitä ei ainoastaan sallita, vaan sitä pidetään myönteisenä. Tämä heijastaa islamin laajempaa moraalista viitekehystä: perhesovun vaalimista, mahdollisten vääryyksien korjaamista ja myötätunnon edistämistä. Jaen lopussa vahvistetaan, että Allah on Anteeksiantava, Armahtava—korostaen, että oikeudenmukisuuden ja sovinnon tavoittelu, jopa herkissä kysymyksissä kuten perintöasiat, on linjassa jumalallisen armon ja ohjauksen kanssa. Kuten kostoa ja testamentteja koskevissa säännöissä, myös tässä ohjauksessa palataan lopulta jumalatietoisuuden ja eettisen vastuun perusarvoihin.","translations":{"opas":"Mutta jos joku pelkää testamentin tekijän olevan harhassa tai väärässä ja oikoo asioita rakentaakseen rauhaa (perillisten välillä), niin ei sitä lueta hänelle synniksi. Jumala on totisesti armahtavainen ja laupias.","clear":"Se, joka epäilee testamentissa virhettä tai epäoikeudenmukaisuutta ja saa aikaan ˹oikeudenmukaisen˺ sovinnon osapuolten kesken, ei tee syntiä. Totisesti, Allah on Kaikkia Anteeksiantava, Kaikkein Armollisin."}},{"verse":183,"commentary_en":"This verse transitions from social and legal matters to a significant religious practice: fasting. It addresses believers directly, highlighting their identity in faith as the basis for accepting this command. It states that fasting has been made obligatory for them, just as it was for communities before them. This indicates that fasting is a universal form of worship with historical roots in monotheistic traditions. The primary purpose given for fasting is to achieve self-restraint or God-consciousness (taqwa). Fasting involves abstaining from food, drink, and other permissible actions during specific hours, which helps individuals gain control over their desires and habits. This discipline strengthens one's will power and increases awareness of Allah, making a person more mindful of His commands and prohibitions in all aspects of life. This connection to taqwa links the practice of fasting back to the overall theme of righteousness and awareness of Allah's presence that runs through this section of the Qur'an.","commentary_fi":"Tämä jae siirtyy sosiaalisista ja oikeudellisista asioista merkittävään uskonnolliseen käytäntöön: paastoon. Se puhuttelee suoraan uskovaisia, korostaen heidän uskon identiteettiään perustana tämän käskyn hyväksymiselle. Se toteaa, että paasto on tehty heille pakolliseksi, aivan kuten se oli pakollinen sitä edeltäville yhteisöille. Tämä osoittaa, että paasto on universaali palvonnan muoto, jolla on historialliset juuret monoteistisissa perinteissä. Paaston ensisijainen tarkoitus on saavuttaa itsehillintä tai Jumalan tietoisuus (*taqwa*). Paastoaminen sisältää pidättymisen ruoasta, juomasta ja muista sallituista teoista tietyin tunnein, mikä auttaa yksilöitä saamaan hallinnan halujensa ja tottumustensa yli. Tämä kuri vahvistaa tahdonvoimaa ja lisää tietoisuutta Allahista, tehden ihmisestä tarkkaavaisemman Hänen käskyjään ja kieltojaan kohtaan kaikilla elämän alueilla. Tämä yhteys *taqwaan* sitoo paaston käytännön takaisin yleiseen vanhurskauden ja Allahin läsnäolon tietoisuuden teemaan, joka kulkee tämän Koraanin osan läpi.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","commentary":"Tämä jae siirtyy sosiaalisista ja oikeudellisista asioista merkittävään uskonnolliseen käytäntöön: paastoon. Se puhuttelee suoraan uskovaisia, korostaen heidän uskon identiteettiään perustana tämän käskyn hyväksymiselle. Se toteaa, että paasto on tehty heille pakolliseksi, aivan kuten se oli pakollinen sitä edeltäville yhteisöille. Tämä osoittaa, että paasto on universaali palvonnan muoto, jolla on historialliset juuret monoteistisissa perinteissä. Paaston ensisijainen tarkoitus on saavuttaa itsehillintä tai Jumalan tietoisuus (*taqwa*). Paastoaminen sisältää pidättymisen ruoasta, juomasta ja muista sallituista teoista tietyin tunnein, mikä auttaa yksilöitä saamaan hallinnan halujensa ja tottumustensa yli. Tämä kuri vahvistaa tahdonvoimaa ja lisää tietoisuutta Allahista, tehden ihmisestä tarkkaavaisemman Hänen käskyjään ja kieltojaan kohtaan kaikilla elämän alueilla. Tämä yhteys *taqwaan* sitoo paaston käytännön takaisin yleiseen vanhurskauden ja Allahin läsnäolon tietoisuuden teemaan, joka kulkee tämän Koraanin osan läpi.","translations":{"opas":"Teidän, jotka uskotte, tulee paastota, samoin kuin piti paastota niidenkin, jotka ennen teitä elivät, jotta karttaisitte pahaa.","clear":"Oi uskovaiset! Paasto on määrätty teille – kuten se oli määrätty niille, jotka olivat ennen teitä – jotta ehkä tulisit tietoisiksi ˹Allahista˺."}},{"verse":184,"commentary_en":"Building on the previous verse, this explains some initial details about the obligation of fasting. It clarifies that fasting is required for a specific, limited number of days, not continuously. It then provides exemptions: if a person is ill or on a journey, they are excused from fasting during that time but are required to make up the missed days later when they are well or have returned home. This shows Allah's concern for easing hardship. For those for whom fasting is excessively difficult even when not ill or traveling (such as the elderly or those with chronic illnesses), an alternative is provided: compensating by feeding one needy person for each day of fasting missed. The verse also encourages voluntary good deeds beyond the minimum requirement, stating that feeding more than the minimum is better. Finally, it emphasizes the greater benefit of fasting itself, encouraging believers to understand that fasting is ultimately good for them, hinting at its spiritual, disciplinary, and possibly physical advantages. These details illustrate the flexibility and compassion within the divine command, ensuring that the core purpose of attaining God-consciousness remains accessible.","commentary_fi":"Edelliseen jakeeseen perustuen tämä selittää joitakin alustavia yksityiskohtia paastovelvoitteesta. Se selventää, että paasto vaaditaan tietyksi, rajoitetuksi päivämääräksi, ei jatkuvasti. Sitten se antaa poikkeuksia: jos henkilö on sairas tai matkalla, hän on vapautettu paastoamisesta tuona aikana, mutta hänen on korvattava menetetyt päivät myöhemmin, kun hän on terve tai palannut kotiin. Tämä osoittaa Allahin huolen helpottaa vaikeuksia. Niille, joille paasto on kohtuuttoman vaikeaa, vaikka he eivät olisikaan sairaita tai matkalla (kuten vanhukset tai kroonisesti sairaat), tarjotaan vaihtoehto: korvaus antamalla ruokaa yhdelle köyhälle henkilölle jokaista paastopäivää kohden. Jae myös kannustaa vapaaehtoisiin hyviin tekoihin vähimmäisvaatimuksen yli, todeten, että enemmän kuin vähimmäismäärän ruokkiminen on parempi. Lopuksi se korostaa itse paaston suurempaa hyötyä, kannustaen uskovaisia ymmärtämään, että paasto on lopulta heille hyväksi, vihjaten sen hengellisiin, kurinpidollisiin ja mahdollisesti fyysisiin etuihin. Nämä yksityiskohdat kuvaavat jumalallisen käskyn joustavuutta ja myötätuntoa, varmistaen, että Jumalan tietoisuuden saavuttamisen ydintarkoitus pysyy saavutettavissa.","arabic":"أَيَّامًا مَعْدُودَاتٍ ۚ فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ ۚ وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ ۖ فَمَنْ تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَهُ ۚ وَأَنْ تَصُومُوا خَيْرٌ لَكُمْ ۖ إِنْ كُنْتُمْ تَعْلَمُونَ","commentary":"Edelliseen jakeeseen perustuen tämä selittää joitakin alustavia yksityiskohtia paastovelvoitteesta. Se selventää, että paasto vaaditaan tietyksi, rajoitetuksi päivämääräksi, ei jatkuvasti. Sitten se antaa poikkeuksia: jos henkilö on sairas tai matkalla, hän on vapautettu paastoamisesta tuona aikana, mutta hänen on korvattava menetetyt päivät myöhemmin, kun hän on terve tai palannut kotiin. Tämä osoittaa Allahin huolen helpottaa vaikeuksia. Niille, joille paasto on kohtuuttoman vaikeaa, vaikka he eivät olisikaan sairaita tai matkalla (kuten vanhukset tai kroonisesti sairaat), tarjotaan vaihtoehto: korvaus antamalla ruokaa yhdelle köyhälle henkilölle jokaista paastopäivää kohden. Jae myös kannustaa vapaaehtoisiin hyviin tekoihin vähimmäisvaatimuksen yli, todeten, että enemmän kuin vähimmäismäärän ruokkiminen on parempi. Lopuksi se korostaa itse paaston suurempaa hyötyä, kannustaen uskovaisia ymmärtämään, että paasto on lopulta heille hyväksi, vihjaten sen hengellisiin, kurinpidollisiin ja mahdollisesti fyysisiin etuihin. Nämä yksityiskohdat kuvaavat jumalallisen käskyn joustavuutta ja myötätuntoa, varmistaen, että Jumalan tietoisuuden saavuttamisen ydintarkoitus pysyy saavutettavissa.","translations":{"opas":"(Paastottava on) määrätyt päivät. Mutta jos joku teistä on sairas tai matkoilla, on hänen paastottava joinakin muina päivinä, ja niiden, jotka siihen pystyvät, on paaston korvaukseksi ravittava joitakin köyhiä. Jos joku vapaaehtoisesti tekee hyvän työn, on se hänelle parempi. Mutta paastoaminen on teille kuitenkin kaikkein parasta (s.o. paastoamalla parhaiten täytätte Jumalan tahdon); tämä olkoon sanottu teille tiedoksi.","clear":"˹Paastotkaa˺ määrätty määrä päiviä. Mutta kuka teistä on sairas tai matkalla, niin ˹paastotkoon˺ saman määrän päiviä ˹Ramadanin jälkeen˺. Niiden, jotka voivat paastota vain äärimmäisen vaikeasti, korvaukseksi voidaan antaa ruokaa tarvitsevalle ˹jokaisesta paastoamattomasta päivästä˺. Mutta kuka vapaaehtoisesti antaa enemmän, se on hänelle parempi. Ja paastoaminen on teille parempi, jos vain tietäisitte."}},{"verse":185,"commentary_en":"This verse specifies the month during which the obligatory fasting, mentioned in the previous verses, is to be observed: Ramadan. It highlights the significance of Ramadan as the month in which the Qur'an was first revealed. The Qur'an is described as a guidance for all humanity, containing clear proofs of that guidance and the criterion for distinguishing between right and wrong. Because of this profound connection to the divine revelation, Muslims are commanded to fast the entire month if they are present (not ill or traveling). The exemption for the ill and the traveler, requiring them to make up the days later, is reiterated. The verse then beautifully states a core principle of Islamic law: \"Allah intends ease for you; He does not want to put you to difficulties.\" This confirms that religious obligations are meant to be manageable, not excessively burdensome. The purposes of completing the fast are then given: to fulfill the prescribed number of days, to glorify Allah for having guided believers through the Qur'an and Islam, and to express gratitude for this guidance and all of Allah's favors. This verse underscores the spiritual depth of fasting, linking it to the blessing of the Qur'an and the cultivation of gratitude and awareness of Allah.","commentary_fi":"Tämä jae määrittää kuukauden, jolloin edellisissä jakeissa mainittua pakollista paastoa on noudatettava: Ramadan. Se korostaa Ramadanin merkitystä kuukautena, jona Koraani ensimmäisen kerran ilmoitettiin. Koraania kuvataan kaikkien ihmiskunnan oppaaksi, joka sisältää selviä todisteita tästä opastuksesta ja kriteerin oikean ja väärän erottamiseen. Tämän syvällisen yhteyden vuoksi jumalalliseen ilmoitukseen, muslimeita käsketään paastoamaan koko kuukauden, jos he ovat paikalla (eivät sairaita tai matkalla). Poikkeus sairaille ja matkailijoille, vaatien heitä korvaamaan päivät myöhemmin, toistetaan. Jae toteaa sitten kauniisti islamilaisen lain ydineperiaatteen: \"Allah haluaa teille helppoutta; Hän ei halua asettaa teille vaikeuksia.\" Tämä vahvistaa, että uskonnolliset velvoitteet on tarkoitettu hallittaviksi, ei kohtuuttoman kuormittaviksi. Paaston suorittamisen tarkoitukset annetaan sitten: täyttää määrätty päivien lukumäärä, ylistää Allahia siitä, että Hän on ohjannut uskovaisia Koraanin ja Islamin kautta, ja ilmaista kiitollisuutta tästä ohjauksesta ja kaikista Allahin suosionosoituksista. Tämä jae korostaa paaston hengellistä syvyyttä, yhdistäen sen Koraanin siunaukseen ja kiitollisuuden ja Allahin tietoisuuden kasvattamiseen.","arabic":"شَهْرُ رَمَضَانَ الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ هُدًى لِلنَّاسِ وَبَيِّنَاتٍ مِنَ الْهُدَىٰ وَالْفُرْقَانِ ۚ فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ ۖ وَمَنْ كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ ۗ يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ","commentary":"Tämä jae määrittää kuukauden, jolloin edellisissä jakeissa mainittua pakollista paastoa on noudatettava: Ramadan. Se korostaa Ramadanin merkitystä kuukautena, jona Koraani ensimmäisen kerran ilmoitettiin. Koraania kuvataan kaikkien ihmiskunnan oppaaksi, joka sisältää selviä todisteita tästä opastuksesta ja kriteerin oikean ja väärän erottamiseen. Tämän syvällisen yhteyden vuoksi jumalalliseen ilmoitukseen, muslimeita käsketään paastoamaan koko kuukauden, jos he ovat paikalla (eivät sairaita tai matkalla). Poikkeus sairaille ja matkailijoille, vaatien heitä korvaamaan päivät myöhemmin, toistetaan. Jae toteaa sitten kauniisti islamilaisen lain ydineperiaatteen: \"Allah haluaa teille helppoutta; Hän ei halua asettaa teille vaikeuksia.\" Tämä vahvistaa, että uskonnolliset velvoitteet on tarkoitettu hallittaviksi, ei kohtuuttoman kuormittaviksi. Paaston suorittamisen tarkoitukset annetaan sitten: täyttää määrätty päivien lukumäärä, ylistää Allahia siitä, että Hän on ohjannut uskovaisia Koraanin ja Islamin kautta, ja ilmaista kiitollisuutta tästä ohjauksesta ja kaikista Allahin suosionosoituksista. Tämä jae korostaa paaston hengellistä syvyyttä, yhdistäen sen Koraanin siunaukseen ja kiitollisuuden ja Allahin tietoisuuden kasvattamiseen.","translations":{"opas":"»Ramadaan» on se kuukausi, jolloin Koraani annettiin opastukseksi ihmisille ja selväksi todistukseksi (Jumalan) johdatuksesta, jotta hylättäisiin paha ja valittaisiin hyvä; tämän kuukauden aikana paastotkoon se teistä, joka on kotioloissaan, mutta jos joku on sairas tai, matkoilla, on hänen sen sijaan (muuna aikana) paastottava yhtä monta muuta päivää. Jumala tahtoo tehdä sen teille helpoksi eikä tarkoita sitä teille taakaksi, - jotta paastopäivienne luku täyttyisi ja te ylistäisitte Jumalaa Hänen johdatuksensa tähden sekä olisitte Hänelle kiitollisia.","clear":"Ramadan on kuukausi, jolloin Koraani ilmoitettiin oppaana ihmiskunnalle selvin todistein johdatuksesta ja mittapuu ˹oikean ja väärän erottamiseksi˺. Joten kuka on läsnä tänä kuukautena, paastotkoon. Mutta kuka on sairas tai matkalla, niin ˹paastotkoon˺ saman määrän päiviä ˹Ramadanin jälkeen˺. Allah tahtoo teille helppoutta, ei vaikeuksia, jotta voitte täyttää määrätyn ajan ja julistaa Allahin suuruutta johdatuksestaan, ja ehkä olette kiitollisia."}},{"verse":186,"commentary_en":"Placed within the verses detailing the rules of fasting, this verse offers immense comfort and reassurance. When Prophet Muhammad's followers ask about Allah, Allah Himself provides the answer directly: \"I am indeed close (to them).\" This emphasizes Allah's immediate accessibility to His servants, without any intermediaries. The verse adds that Allah listens to and answers the prayer (du'a) of everyone who calls upon Him. This signifies Allah's constant attention and responsiveness to the sincere supplications of His servants, especially relevant during times of worship like fasting. In return, Allah calls upon His servants to respond to Him and believe in Him. Responding to Allah means obeying His commands and prohibitions, including those related to fasting and prayer. Believing in Him is the foundation of faith. The verse explains that by responding to Allah and believing in Him, people will be guided to the right way. This intimate dialogue highlights the personal connection available to every believer and encourages them to turn to Allah in prayer, confident in His closeness and readiness to respond, which is particularly empowering during the discipline of fasting.","commentary_fi":"Sijoitettu paaston sääntöjä yksityiskohtaisesti käsittelevien jakeiden yhteyteen, tämä jae tarjoaa valtavan lohdutuksen ja vakuutuksen. Kun profeetta Muhammedin seuraajat kysyvät Allahista, Allah itse antaa vastauksen suoraan: \"Minä olen tosiaan lähellä heitä.\" Tämä korostaa Allahin välitöntä saavutettavuutta Hänen palvelijoilleen, ilman mitään välittäjiä. Jae lisää, että Allah kuuntelee ja vastaa jokaisen anojan rukoukseen (*du'a*), kun tämä kutsuu Häntä. Tämä merkitsee Allahin jatkuvaa tarkkaavaisuutta ja reagointia Hänen palvelijoidensa vilpittömiin anomuksiin, mikä on erityisen merkityksellistä palvonnan aikoina kuten paaston aikana. Vastineeksi Allah kutsuu palvelijoitaan vastaamaan Hänelle ja uskomaan Häneen. Allahille vastaaminen tarkoittaa Hänen käskyjensä ja kieltojensa noudattamista, mukaan lukien ne, jotka liittyvät paastoon ja rukoukseen. Usko Häneen on uskon perusta. Jae selittää, että vastaamalla Allahille ja uskomalla Häneen ihmiset ohjataan oikealle tielle. Tämä intiimi vuoropuhelu korostaa henkilökohtaista yhteyttä, joka on kaikkien uskovaisten ulottuvilla, ja kannustaa heitä kääntymään Allahin puoleen rukouksessa, luottaen Hänen läheisyyteensä ja valmiuteensa vastata, mikä on erityisen voimaannuttavaa paaston kuriin liittyen.","arabic":"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ ۖ فَلْيَسْتَجِيبُوا لِي وَلْيُؤْمِنُوا بِي لَعَلَّهُمْ يَرْشُدُونَ","commentary":"Sijoitettu paaston sääntöjä yksityiskohtaisesti käsittelevien jakeiden yhteyteen, tämä jae tarjoaa valtavan lohdutuksen ja vakuutuksen. Kun profeetta Muhammedin seuraajat kysyvät Allahista, Allah itse antaa vastauksen suoraan: \"Minä olen tosiaan lähellä heitä.\" Tämä korostaa Allahin välitöntä saavutettavuutta Hänen palvelijoilleen, ilman mitään välittäjiä. Jae lisää, että Allah kuuntelee ja vastaa jokaisen anojan rukoukseen (*du'a*), kun tämä kutsuu Häntä. Tämä merkitsee Allahin jatkuvaa tarkkaavaisuutta ja reagointia Hänen palvelijoidensa vilpittömiin anomuksiin, mikä on erityisen merkityksellistä palvonnan aikoina kuten paaston aikana. Vastineeksi Allah kutsuu palvelijoitaan vastaamaan Hänelle ja uskomaan Häneen. Allahille vastaaminen tarkoittaa Hänen käskyjensä ja kieltojensa noudattamista, mukaan lukien ne, jotka liittyvät paastoon ja rukoukseen. Usko Häneen on uskon perusta. Jae selittää, että vastaamalla Allahille ja uskomalla Häneen ihmiset ohjataan oikealle tielle. Tämä intiimi vuoropuhelu korostaa henkilökohtaista yhteyttä, joka on kaikkien uskovaisten ulottuvilla, ja kannustaa heitä kääntymään Allahin puoleen rukouksessa, luottaen Hänen läheisyyteensä ja valmiuteensa vastata, mikä on erityisen voimaannuttavaa paaston kuriin liittyen.","translations":{"opas":"Kun palvelijana sinulta kysyvät jotakin Minusta, olen totisesti lähellä; Minä kuulen anovaisen rukouksen, kun hän huutaa Minua avukseen. Niin kuulkoot hekin Minun kutsuni ja luottakoot Minuun, jotta he seuraisivat oikeata Johdatusta.","clear":"Kun palvelijani kysyvät sinulta ˹Oi Profeetta˺ Minusta: Olen totisesti lähellä. Vastaan rukoukseen, kun he kutsuvat Minua. Joten vastatkoon he ˹totellessaan˺ Minua ja uskokoot Minuun, ehkä heidät johdatetaan ˹oikealle tielle˺."}},{"verse":187,"commentary_en":"This verse provides further practical details about the rules of fasting in Ramadan, specifically concerning the nights. It clarifies that during the nights of the fasting month (between sunset and dawn), it is permissible for married individuals to have sexual intimacy with their spouses. It uses a beautiful metaphor to describe the relationship between spouses: \"They are your garments, and you are their garments.\" Just as a garment provides covering, protection, and comfort, spouses provide the same for each other. The verse acknowledges that before this rule was clarified, some Muslims may have had the misconception that during the fasting period, all sexual intercourse should be avoided—even at night, when eating and drinking are allowed. This verse removes that misconception. It is now explicitly permitted to be intimate and to \"seek what Allah has ordained,\" which includes seeking offspring through this relationship. The verse also defines the time for eating and drinking during Ramadan: it is permitted until the true dawn becomes clearly distinguishable from the darkness of night. The fast then begins at dawn and lasts until nightfall (sunset). A specific prohibition is mentioned for those observing i'tikaf (spiritual retreat, usually in a mosque): sexual intimacy with spouses is forbidden during this period of intense devotion. The verse concludes by emphasizing that these are limits set by Allah, and believers should not even approach these limits but rather maintain a safe distance from anything that might lead to transgression. This serves as a reminder to respect divine boundaries and, like the instruction to fast itself, is given so that people may increase their self-restraint and God-consciousness (taqwa).","commentary_fi":"Tämä jae antaa lisätietoa Ramadania koskevista paastosäännöistä, erityisesti öihin liittyen. Se selventää, että paastokuukauden öinä (auringonlaskun ja aamunkoiton välillä) on sallittua, että aviopuolisot ovat seksuaalisesti läheisiä keskenään. Jaetta koristaa kaunis vertaus avioliitosta: \"He ovat teidän vaatteenne, ja te olette heidän vaatteensa.\" Aivan kuten vaate suojaa, peittää ja tuo mukavuutta, myös puoliso toimii samalla tavoin toiselleen. Jae tunnustaa, että ennen tämän säännön selventämistä jotkut muslimit saattoivat erehtyä luulemaan, että koko paaston ajan – myös öisin, jolloin syöminen ja juominen on sallittua – tulisi pidättäytyä kaikesta seksuaalisesta kanssakäymisestä (Razi). Tämä jae poistaa tuon väärinkäsityksen. Nyt on nimenomaisesti sallittua olla intiimissä kanssakäymisessä ja \"etsivä sitä, minkä Allah on säätänyt\", mikä sisältää myös jälkeläisten tavoittelun aviollisessa suhteessa. Jae määrittelee myös ajan, jona syöminen ja juominen on sallittua Ramadanin aikana: se on sallittua siihen asti, kunnes aamun valkea juova käy selvästi erottuvaksi yön pimeydestä. Paasto alkaa siis aamunkoitteessa ja kestää auringonlaskuun asti. Erityinen kielto koskee niitä, jotka viettävät iʿtikāfia (henkistä vetäytymistä, yleensä moskeijassa): tämän syvän omistautumisen aikana seksuaalinen kanssakäyminen puolison kanssa on kielletty. Jae päättyy painotukseen siitä, että nämä ovat Allahin asettamia rajoja, eikä uskovien tule edes lähestyä niitä, vaan pysyä turvallisen välimatkan päässä kaikesta, mikä voisi johtaa rikkomukseen. Tämä toimii muistutuksena siitä, että jumalallisia rajoja tulee kunnioittaa – ja aivan kuten itse paaston käsky – se on annettu, jotta ihmiset kasvattaisivat itsehillintää ja jumalatietoisuutta (taqwa).","arabic":"أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَىٰ نِسَائِكُمْ ۚ هُنَّ لِبَاسٌ لَكُمْ وَأَنْتُمْ لِبَاسٌ لَهُنَّ ۗ عَلِمَ اللَّهُ أَنَّكُمْ كُنْتُمْ تَخْتَانُونَ أَنْفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنْكُمْ ۖ فَالْآنَ بَاشِرُوهُنَّ وَابْتَغُوا مَا كَتَبَ اللَّهُ لَكُمْ ۚ وَكُلُوا وَاشْرَبُوا حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ ۖ ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ ۚ وَلَا تُبَاشِرُوهُنَّ وَأَنْتُمْ عَاكِفُونَ فِي الْمَسَاجِدِ ۗ تِلْكَ حُدُودُ اللَّهِ فَلَا تَقْرَبُوهَا ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ آيَاتِهِ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ","commentary":"Tämä jae antaa lisätietoa Ramadania koskevista paastosäännöistä, erityisesti öihin liittyen. Se selventää, että paastokuukauden öinä (auringonlaskun ja aamunkoiton välillä) on sallittua, että aviopuolisot ovat seksuaalisesti läheisiä keskenään. Jaetta koristaa kaunis vertaus avioliitosta: \"He ovat teidän vaatteenne, ja te olette heidän vaatteensa.\" Aivan kuten vaate suojaa, peittää ja tuo mukavuutta, myös puoliso toimii samalla tavoin toiselleen. Jae tunnustaa, että ennen tämän säännön selventämistä jotkut muslimit saattoivat erehtyä luulemaan, että koko paaston ajan – myös öisin, jolloin syöminen ja juominen on sallittua – tulisi pidättäytyä kaikesta seksuaalisesta kanssakäymisestä (Razi). Tämä jae poistaa tuon väärinkäsityksen. Nyt on nimenomaisesti sallittua olla intiimissä kanssakäymisessä ja \"etsivä sitä, minkä Allah on säätänyt\", mikä sisältää myös jälkeläisten tavoittelun aviollisessa suhteessa. Jae määrittelee myös ajan, jona syöminen ja juominen on sallittua Ramadanin aikana: se on sallittua siihen asti, kunnes aamun valkea juova käy selvästi erottuvaksi yön pimeydestä. Paasto alkaa siis aamunkoitteessa ja kestää auringonlaskuun asti. Erityinen kielto koskee niitä, jotka viettävät iʿtikāfia (henkistä vetäytymistä, yleensä moskeijassa): tämän syvän omistautumisen aikana seksuaalinen kanssakäyminen puolison kanssa on kielletty. Jae päättyy painotukseen siitä, että nämä ovat Allahin asettamia rajoja, eikä uskovien tule edes lähestyä niitä, vaan pysyä turvallisen välimatkan päässä kaikesta, mikä voisi johtaa rikkomukseen. Tämä toimii muistutuksena siitä, että jumalallisia rajoja tulee kunnioittaa – ja aivan kuten itse paaston käsky – se on annettu, jotta ihmiset kasvattaisivat itsehillintää ja jumalatietoisuutta (taqwa).","translations":{"opas":"Paastonaikana teidän on sallittu öisin olla vaimojenne luona; he ovat teidän verhonne, ja te olette heidän verhonsa. Jumala tietää, että te aikaisemmin kiusasitte itseänne pidättyväisyydellä; siksi on Hän säälinyt teitä, Hän on suvaitsevainen. Olkaa siis yhteydessä heidän kanssaan ja etsikää sitä, minkä Jmala on teille määrännyt; syökää ja juokaa aamuhämäriin asti, kunnes vaalea lanka selvästi erottuu mustasta. Mutta sitten noudattakaa tarkoin paastoa yön tuloon saakka älkääkä koskeko heihin, vaan omistautukaa hartaudenharjoituksille rukoushuoneissa. Nämä ovat Jumalan asettamat rajat; älkää siis sinä aikana koskeko heihin. Niin selittää Jumala ihmisille tunnusmerkkinsä, jotta te karttaisitte pahaa.","clear":"Teidän on sallittua olla intiimissä suhteessa vaimojenne kanssa paastoa edeltävinä öinä. Puolisot ovat teille kuin vaate, ja te olette heille. Jumala tietää, että olette pettäneet itsenne. Niinpä Hän on hyväksynyt katumuksenne ja antanut teille anteeksi. Nyt voitte siis olla intiimissä suhteessa heidän kanssaan ja tavoitella sitä, mitä Jumala on teille säätänyt. Syökää ja juokaa, kunnes aamun valo erottaa yön pimeyden, ja suorittakaa sitten paasto loppuun asti yöhön. Älkää olko intiimissä suhteessa puolisoidenne kanssa, kun olette mietiskelemässä moskeijoissa. Nämä ovat Jumalan asettamat rajat, joten älkää ylittäkö niitä. Näin Jumala tekee ilmoituksensa selväksi ihmisille, jotta heistä tulisi tietoisia Hänestä."}},{"verse":188,"commentary_en":"This verse follows the discussion on fasting and maintaining a close relationship with Allah by addressing matters of social conduct and financial honesty. It prohibits Muslims from unjustly consuming each other's wealth or property.\n\nThe verse specifically warns against using wealth to bribe judges or using deceptive tactics in legal proceedings to unjustly take what rightfully belongs to others, even if it seems like a small amount. It emphasizes doing this \"wrongfully and knowingly,\" highlighting the deliberate nature of the injustice.\n\nThis instruction connects directly to the themes of setting boundaries and being mindful of Allah, which were mentioned in the preceding verses about fasting. It shows that righteousness and fearing Allah (*taqwa*) involve not only performing religious rituals but also upholding justice and honesty in dealings with others, particularly regarding property and legal rights. It underscores that accountability is not just to human judges, but ultimately to Allah, who knows everything. As the Prophet Muhammad taught, while a judge might rule based on outward evidence, if someone takes something that is not rightfully theirs, they are accepting a severe consequence from Allah. This illustrates that ethical behavior and social justice are integral parts of a Muslim's faith and relationship with Allah.","commentary_fi":"Tämä jae seuraa keskustelua paastoamisesta ja läheisen suhteen ylläpitämisestä Allahiin käsittelemällä sosiaalisen käyttäytymisen ja taloudellisen rehellisyyden kysymyksiä. Se kieltää muslimeja kuluttamasta epäoikeudenmukaisesti toistensa varallisuutta tai omaisuutta.","arabic":"وَلَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ لِتَأْكُلُوا فَرِيقًا مِنْ أَمْوَالِ النَّاسِ بِالْإِثْمِ وَأَنْتُمْ تَعْلَمُونَ","commentary":"Tämä jae seuraa keskustelua paastoamisesta ja läheisen suhteen ylläpitämisestä Allahiin käsittelemällä sosiaalisen käyttäytymisen ja taloudellisen rehellisyyden kysymyksiä. Se kieltää muslimeja kuluttamasta epäoikeudenmukaisesti toistensa varallisuutta tai omaisuutta.","translations":{"opas":"Älkää keskenänne kuluttako omaisuuttanne turhuuteen älkääkä sillä lahjoko tuomareita, jotta syntisesti ja vastoin parempaa tietoanne saisitte nauttia jotakin toisten omaisuudesta.","clear":"Älkää kuluttako toistenne omaisuutta vääryydellä, älkääkä tarkoituksellisesti lahjoko viranomaisia, jotta voisitte anastaa osan toisten omaisuudesta, tietäen sen olevan syntiä."}},{"verse":189,"commentary_en":"This verse addresses questions about the new moons and their purpose. It explains that the phases of the moon serve as markers for time, helping people determine fixed periods for their activities and for religious duties like the Pilgrimage (Hajj). Following this, the verse dismisses a pre-Islamic custom where people would enter their houses from the rear on certain occasions, particularly after pilgrimage, believing it was a sign of righteousness. The verse clarifies that true righteousness is not about such outward forms or superstitions, but about having consciousness and fear of Allah. It instructs people to enter houses normally, through their proper doors, and reiterates that fearing Allah leads to prosperity. This connects the practical function of the moon phases for Hajj timing with the principle that true piety is inward, centered on awareness of Allah, rather than outward, empty gestures.","commentary_fi":"Tämä jae käsittelee kysymyksiä uusista kuukausista ja niiden tarkoituksesta. Se selittää, että kuun vaiheet toimivat ajan merkitsijöinä, auttaen ihmisiä määrittämään kiinteät ajanjaksot toimilleen ja uskonnollisille velvollisuuksille, kuten pyhiinvaellukselle (Hajj). Tämän jälkeen jae hylkää esiintyneen tavan, jossa ihmiset astuivat taloonsa takakautta tietyissä tilanteissa, erityisesti pyhiinvaelluksen jälkeen, uskoen sen olevan merkki vanhurskaudesta. Jae selventää, että todellinen vanhurskaus ei liity tällaisiin ulkoisiin muotoihin tai taikauskoon, vaan on tietoisuutta ja pelkoa Allahia kohtaan. Se ohjeistaa ihmisiä menemään taloonsa normaalisti, oikeiden ovien kautta, ja toistaa, että Allahin pelkääminen johtaa menestykseen. Tämä yhdistää kuun vaiheiden käytännöllisen toiminnon Hajjin ajoituksessa periaatteeseen, että todellinen hurskaus on sisäistä, keskittynyt tietoisuuteen Allahista, pikemmin kuin ulkoisiin, tyhjiin eleisiin.","arabic":"يَسْأَلُونَكَ عَنِ الْأَهِلَّةِ ۖ قُلْ هِيَ مَوَاقِيتُ لِلنَّاسِ وَالْحَجِّ ۗ وَلَيْسَ الْبِرُّ بِأَنْ تَأْتُوا الْبُيُوتَ مِنْ ظُهُورِهَا وَلَٰكِنَّ الْبِرَّ مَنِ اتَّقَىٰ ۗ وَأْتُوا الْبُيُوتَ مِنْ أَبْوَابِهَا ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ","commentary":"Tämä jae käsittelee kysymyksiä uusista kuukausista ja niiden tarkoituksesta. Se selittää, että kuun vaiheet toimivat ajan merkitsijöinä, auttaen ihmisiä määrittämään kiinteät ajanjaksot toimilleen ja uskonnollisille velvollisuuksille, kuten pyhiinvaellukselle (Hajj). Tämän jälkeen jae hylkää esiintyneen tavan, jossa ihmiset astuivat taloonsa takakautta tietyissä tilanteissa, erityisesti pyhiinvaelluksen jälkeen, uskoen sen olevan merkki vanhurskaudesta. Jae selventää, että todellinen vanhurskaus ei liity tällaisiin ulkoisiin muotoihin tai taikauskoon, vaan on tietoisuutta ja pelkoa Allahia kohtaan. Se ohjeistaa ihmisiä menemään taloonsa normaalisti, oikeiden ovien kautta, ja toistaa, että Allahin pelkääminen johtaa menestykseen. Tämä yhdistää kuun vaiheiden käytännöllisen toiminnon Hajjin ajoituksessa periaatteeseen, että todellinen hurskaus on sisäistä, keskittynyt tietoisuuteen Allahista, pikemmin kuin ulkoisiin, tyhjiin eleisiin.","translations":{"opas":"He tiedustelevat sinulta, Muhammed, uuden kuun merkitystä. Sano: Kuunvaiheet ovat määrätyt ihmisten ajanlaskua ja toivioretkiä varten. Hurskautta ei ole se, että te menette taloon takatietä (kuten taikojen palvojat ajoittain), vaan hurskaita ovat ne, jotka karttavat pahaa. Käykää taloon portin kautta ja pelätkää Jumalaa, jotta menestyisitte.","clear":"He kysyvät sinulta, oi Profeetta, kuun vaiheista. Sano: ”Ne ovat keino ihmisille määrittää aika ja pyhiinvaellus.” Vanhurskaus ei ole tulla taloihinne takakautta. Vanhurskaus on pikemminkin olla tietoinen Jumalasta. Menkää siis koteihinne niiden asianmukaisten ovien kautta ja olkaa tietoisia Jumalasta, jotta menestyisitte."}},{"verse":190,"commentary_en":"Following the discussion of timekeeping and piety, this verse introduces the topic of fighting. It gives permission to fight in the cause of Allah against those who initiate aggression by fighting you. However, it immediately sets a crucial limit, stating that one must not transgress or exceed proper bounds in fighting, because Allah does not love those who do so. This might have been among the first verses revealed concerning fighting in Islam, establishing the principle of fighting in self-defense against those who initiate hostilities, while emphasizing ethical restrictions.","commentary_fi":"Seuraten keskustelua ajanlaskusta ja hurskaudesta, tämä jae esittelee taistelemisen aiheen. Se antaa luvan taistella Allahin asian puolesta niitä vastaan, jotka aloittavat aggression taistelemalla teitä vastaan. Kuitenkin se asettaa välittömästi ratkaisevan rajoituksen, todeten, että ei saa ylittää tai rikkoa asianmukaisia rajoja taistelussa, koska Allah ei rakasta niitä, jotka tekevät niin. Tämä saattaa olla ollut yksi ensimmäisistä taistelua koskevista jakeista, joka vakiinnuttaa periaatteen puolustautumisesta niitä vastaan, jotka aloittavat vihollisuudet, samalla korostaen eettisiä rajoituksia.","arabic":"وَقَاتِلُوا فِي سَبِيلِ اللَّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلَا تَعْتَدُوا ۚ إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ","commentary":"Seuraten keskustelua ajanlaskusta ja hurskaudesta, tämä jae esittelee taistelemisen aiheen. Se antaa luvan taistella Allahin asian puolesta niitä vastaan, jotka aloittavat aggression taistelemalla teitä vastaan. Kuitenkin se asettaa välittömästi ratkaisevan rajoituksen, todeten, että ei saa ylittää tai rikkoa asianmukaisia rajoja taistelussa, koska Allah ei rakasta niitä, jotka tekevät niin. Tämä saattaa olla ollut yksi ensimmäisistä taistelua koskevista jakeista, joka vakiinnuttaa periaatteen puolustautumisesta niitä vastaan, jotka aloittavat vihollisuudet, samalla korostaen eettisiä rajoituksia.","translations":{"opas":"Taistelkaa Jumalan retkellä niitä vastaan, jotka vastaanne sotaa käyvät, mutta itse älkää aiheetta hyökätkö. Totisesti Jumala ei rakasta rauhanrikkojia.","clear":"Taistelkaa Jumalan asian puolesta vain niitä vastaan, jotka käyvät sotaa teitä vastaan, mutta älkää ylittäkö rajoja. Totisesti Jumala ei pidä rikkojista."}},{"verse":191,"commentary_en":"Continuing the rules of engagement introduced in the previous verse, this verse permits fighting and driving out those who had persecuted Muslims and driven them from their homes. It highlights that \"tumult and oppression\" (or suppression of faith) are considered worse than killing, justifying the defensive action against those who had committed such acts. This perspective reflects the gravity of religious persecution: forcing someone to abandon their faith (oppression) is a severe violation of a fundamental human right and is considered a more serious offense than murder. However, a specific restriction is mentioned: fighting is not allowed near the Sacred Mosque in Makkah unless the enemy initiates combat there. If attacked at the Sacred Mosque, defensive fighting is permitted.","commentary_fi":"Jatkaen edellisessä jakeessa esiteltyjä taistelusääntöjä, tämä jae sallii taistelun ja karkottamisen niitä vastaan, jotka ovat vainonneet muslimeja ja ajaneet heidät pois kodeistaan. Siinä korostetaan, että \"meteli ja sorto\" (tai uskonnonvapauden tukahduttaminen) ovat pahempia kuin tappaminen, mikä oikeuttaa puolustuksellisen toiminnan niitä kohtaan, jotka ovat tehneet tällaisia tekoja. Tämä näkökulma heijastaa uskonnollisen vainon vakavuutta: toisen pakottaminen luopumaan uskostaan (sorto) on vakava perusoikeuksien loukkaus ja katsotaan vakavammaksi rikokseksi kuin murha. Jakeessa mainitaan kuitenkin selkeä rajoitus: taistelu ei ole sallittua Pyhän moskeijan alueella Mekassa, ellei vihollinen aloita taistelua siellä. Jos hyökkäys tapahtuu Pyhän moskeijan alueella, puolustuksellinen taistelu on sallittu.","arabic":"وَاقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُمْ مِنْ حَيْثُ أَخْرَجُوكُمْ ۚ وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ ۚ وَلَا تُقَاتِلُوهُمْ عِنْدَ الْمَسْجِدِ الْحَرَامِ حَتَّىٰ يُقَاتِلُوكُمْ فِيهِ ۖ فَإِنْ قَاتَلُوكُمْ فَاقْتُلُوهُمْ ۗ كَذَٰلِكَ جَزَاءُ الْكَافِرِينَ","commentary":"Jatkaen edellisessä jakeessa esiteltyjä taistelusääntöjä, tämä jae sallii taistelun ja karkottamisen niitä vastaan, jotka ovat vainonneet muslimeja ja ajaneet heidät pois kodeistaan. Siinä korostetaan, että \"meteli ja sorto\" (tai uskonnonvapauden tukahduttaminen) ovat pahempia kuin tappaminen, mikä oikeuttaa puolustuksellisen toiminnan niitä kohtaan, jotka ovat tehneet tällaisia tekoja. Tämä näkökulma heijastaa uskonnollisen vainon vakavuutta: toisen pakottaminen luopumaan uskostaan (sorto) on vakava perusoikeuksien loukkaus ja katsotaan vakavammaksi rikokseksi kuin murha. Jakeessa mainitaan kuitenkin selkeä rajoitus: taistelu ei ole sallittua Pyhän moskeijan alueella Mekassa, ellei vihollinen aloita taistelua siellä. Jos hyökkäys tapahtuu Pyhän moskeijan alueella, puolustuksellinen taistelu on sallittu.","translations":{"opas":"Surmatkaa heidät, missä heidät tapaattekin, ja karkoittakaa heidät joka paikasta, mistä he ajoivat pois teidät, sillä pakanuuteen käännyttäminen on pahempi kuin murha. Mutta älkää taistelko heitä vastaan Rauhoitetun temppelin lähellä, jolleivät he hyökkää päällenne siellä; mutta jos he hyökkäävät, niin tappakaa heidät. Sellainen on oleva uskottomien palkka.","clear":"Tappakaa heidät missä ikinä heidät kohtaattekin, ja karkottakaa heidät niistä paikoista, joista he ovat teidät karkottaneet. Sillä vainoaminen on paljon pahempaa kuin tappaminen. Älkääkä taistelko heitä vastaan pyhässä moskeijassa, elleivät he hyökkää siellä teidän kimppuunne. Jos he niin tekevät, taistelkaa heitä vastaan – se on epäuskoisten palkka."}},{"verse":192,"commentary_en":"This verse follows directly from the previous one and offers a condition for the cessation of hostilities. It states that if the enemies cease their aggression and oppression, Allah is greatly forgiving and merciful.","commentary_fi":"Tämä jae seuraa suoraan edellistä ja tarjoaa ehdon vihollisuuksien lopettamiselle. Se toteaa, että jos viholliset lakkaavat aggression ja sorron harjoittamisesta, Allah on suuresti anteeksiantava ja armollinen.","arabic":"فَإِنِ انْتَهَوْا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ","commentary":"Tämä jae seuraa suoraan edellistä ja tarjoaa ehdon vihollisuuksien lopettamiselle. Se toteaa, että jos viholliset lakkaavat aggression ja sorron harjoittamisesta, Allah on suuresti anteeksiantava ja armollinen.","translations":{"opas":"Mutta jos he lakkaavat taistelemasta, niin on Jumala totisesti armahtavainen ja laupias.","clear":"Mutta jos he lakkaavat, niin totisesti Allah on Kaikkia Antava, Kaikkein Armollisin."}},{"verse":193,"commentary_en":"Building on the preceding verses, this verse outlines the deeper objective of fighting in Islam: to bring an end to any system of coercion or domination that prevents people from obeying and worshiping Allah freely and exclusively. The term fitnah here refers to a state in which human beings impose their authority over others in place of God's sovereignty. The verse instructs that fighting must continue until such oppressive control is dismantled and the religion—meaning obedience and submission—is sincerely and solely for Allah. However, if the aggressors desist from their hostility and no longer seek to enforce man-made authority over God's law, then fighting must also cease. Hostility is to be directed only against those who persist in wrongdoing and oppression.","commentary_fi":"Edellisiin jakeisiin pohjautuen tämä jae kuvaa taistelun syvempää tarkoitusta islamissa: lopettaa kaikki sorto tai alistaminen, joka estää ihmisiä palvomasta ja tottelemasta Allahia vapaasti ja yksinomaan. Termi fitnah viittaa tilanteeseen, jossa ihmiset asettavat oman valtansa toisten yläpuolelle Jumalan suvereniteetin sijaan. Jakeessa käsketään, että taistelu on jatkuva, kunnes tällainen sortava valta on murskattu ja uskonto — eli tottelevaisuus ja alistuminen — on aidosti ja pelkästään Allahille kuuluvaa. Jos hyökkääjät lakkaavat vihamielisyydestään eivätkä enää yritä pakottaa ihmisiä ihmisten laatimien lakien alle Jumalan lain sijaan, taistelun on myös loputtava. Vihamielisyys on suunnattava vain niitä vastaan, jotka jatkavat vääryyttä ja sortoa.","arabic":"وَقَاتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّينُ لِلَّهِ ۖ فَإِنِ انْتَهَوْا فَلَا عُدْوَانَ إِلَّا عَلَى الظَّالِمِينَ","commentary":"Edellisiin jakeisiin pohjautuen tämä jae kuvaa taistelun syvempää tarkoitusta islamissa: lopettaa kaikki sorto tai alistaminen, joka estää ihmisiä palvomasta ja tottelemasta Allahia vapaasti ja yksinomaan. Termi fitnah viittaa tilanteeseen, jossa ihmiset asettavat oman valtansa toisten yläpuolelle Jumalan suvereniteetin sijaan. Jakeessa käsketään, että taistelu on jatkuva, kunnes tällainen sortava valta on murskattu ja uskonto — eli tottelevaisuus ja alistuminen — on aidosti ja pelkästään Allahille kuuluvaa. Jos hyökkääjät lakkaavat vihamielisyydestään eivätkä enää yritä pakottaa ihmisiä ihmisten laatimien lakien alle Jumalan lain sijaan, taistelun on myös loputtava. Vihamielisyys on suunnattava vain niitä vastaan, jotka jatkavat vääryyttä ja sortoa.","translations":{"opas":"Taistelkaa heitä vastaan, kunnes pakanuuden viettelys lakkaa ja keskuudessamme vakiintuu ainoan Jumalan palveleminen. Mutta jos he herkeävät, älköön vallitko vihollisuutta muita kuin uskottomia vastaan.","clear":"Taistelkaa heitä vastaan, kunnes vainoamista ei enää ole, ja ˹teidän˺ antaumuksenne on Allahille ˹yksin˺. Jos he lakkaavat ˹vainoamasta teitä˺, älköön vihamielisyyttä olko paitsi hyökkääjiä vastaan."}},{"verse":194,"commentary_en":"This verse addresses fighting during the sacred months. It establishes a principle of reciprocity, particularly regarding violations of sanctities such as the sacred months. If an enemy transgresses by fighting during a prohibited time or in a sacred area, the Muslim community is permitted to respond in kind. However, this permission is balanced with a strong command to fear Allah and to remember that Allah is with those who exercise self-restraint—emphasizing that retaliation must be measured and kept within limits.","commentary_fi":"Tämä jae käsittelee taistelua pyhinä kuukausina. Siinä vahvistetaan vastavuoroisuuden periaate, erityisesti tilanteissa, joissa rikotaan pyhiä asioita, kuten pyhiä kuukausia. Jos vihollinen rikkoo tätä sääntöä taistelemalla kiellettynä aikana tai pyhällä alueella, muslimiyhteisölle sallitaan vastata samalla tavalla. Tätä lupaa kuitenkin tasapainottaa vahva kehotus pelätä Allahia ja muistaa, että Allah on niiden kanssa, jotka hillitsevät itseään—korostaen, että kosto on oltava harkittua ja pysyttävä rajoissaan.","arabic":"الشَّهْرُ الْحَرَامُ بِالشَّهْرِ الْحَرَامِ وَالْحُرُمَاتُ قِصَاصٌ ۚ فَمَنِ اعْتَدَىٰ عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَىٰ عَلَيْكُمْ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ","commentary":"Tämä jae käsittelee taistelua pyhinä kuukausina. Siinä vahvistetaan vastavuoroisuuden periaate, erityisesti tilanteissa, joissa rikotaan pyhiä asioita, kuten pyhiä kuukausia. Jos vihollinen rikkoo tätä sääntöä taistelemalla kiellettynä aikana tai pyhällä alueella, muslimiyhteisölle sallitaan vastata samalla tavalla. Tätä lupaa kuitenkin tasapainottaa vahva kehotus pelätä Allahia ja muistaa, että Allah on niiden kanssa, jotka hillitsevät itseään—korostaen, että kosto on oltava harkittua ja pysyttävä rajoissaan.","translations":{"opas":"Rauhoitettu kuukausi kostetaan (sen rikkojille) rauhoitetulla kuukaudella ja pyhitetyt paikat vastaavilla. ja jos joku ryhtyy sotaan teitä vastaan, niin ahdistakaa häntä samalla tavalla, kuin hän ahdisti teitä. Täyttäkää velvollisuutenne Jumalaa kohtaan ja tietäkää, että Jumala on niiden kanssa, jotka karttavat pahaa.","clear":"˹Kostoa toteutetaan˺ pyhässä kuukaudessa ˹rikkomuksesta˺ pyhässä kuukaudessa, ja kaikki rikkomukset tuovat koston. Joten jos joku hyökkää kimppuunne, kostakaa samalla tavalla. ˹Mutta˺ olkaa tietoisia Allahista ja tietäkää, että Allah on niiden kanssa, jotka ovat tietoisia ˹Hänestä˺."}},{"verse":195,"commentary_en":"Following the verses on fighting, this verse urges believers to spend their wealth generously in the cause of Allah. \"Spending in the way of Allah\" refers to making financial sacrifices to help establish His religion. Neglecting this duty out of attachment to personal interests can lead to ruin in both this world and the Hereafter. Such neglect invites both divine punishment and worldly consequences, including weakness in the face of opposition. The verse warns that miserliness not only harms individuals but also weakens the community’s ability to uphold the faith. It concludes by calling believers to strive for excellence through ihsan—doing good with sincerity and devotion, always mindful that Allah sees all actions.","commentary_fi":"Taistelua käsittelevien jakeiden jälkeen tämä jae kehottaa uskovia käyttämään omaisuuttaan anteliaasti Allahin tähden. \"Allahin tiellä antaminen\" tarkoittaa taloudellista uhrausta Jumalan uskonnon vahvistamiseksi. Tämän velvollisuuden laiminlyönti ja kiintymys omiin etuihin voivat johtaa turmioon sekä tässä maailmassa että Tuonpuoleisessa. Tällainen välinpitämättömyys tuo mukanaan sekä Jumalan rangaistuksen että ajallisia seurauksia, kuten heikkoutta vastustajien edessä. Jaessa varoitetaan, että saituus ei vahingoita ainoastaan yksilöä, vaan heikentää koko yhteisön kykyä tukea uskoa. Jaen lopussa uskovia kehotetaan pyrkimään hengelliseen huippuosaamiseen eli ihsaniin—tekemään hyvää vilpittömästi ja antaumuksella, tietoisina siitä, että Allah näkee kaikki teot.","arabic":"وَأَنْفِقُوا فِي سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ ۛ وَأَحْسِنُوا ۛ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ","commentary":"Taistelua käsittelevien jakeiden jälkeen tämä jae kehottaa uskovia käyttämään omaisuuttaan anteliaasti Allahin tähden. \"Allahin tiellä antaminen\" tarkoittaa taloudellista uhrausta Jumalan uskonnon vahvistamiseksi. Tämän velvollisuuden laiminlyönti ja kiintymys omiin etuihin voivat johtaa turmioon sekä tässä maailmassa että Tuonpuoleisessa. Tällainen välinpitämättömyys tuo mukanaan sekä Jumalan rangaistuksen että ajallisia seurauksia, kuten heikkoutta vastustajien edessä. Jaessa varoitetaan, että saituus ei vahingoita ainoastaan yksilöä, vaan heikentää koko yhteisön kykyä tukea uskoa. Jaen lopussa uskovia kehotetaan pyrkimään hengelliseen huippuosaamiseen eli ihsaniin—tekemään hyvää vilpittömästi ja antaumuksella, tietoisina siitä, että Allah näkee kaikki teot.","translations":{"opas":"Uhratkaa omaisuuttanne Jumalan asian hyväksi; älkää syöksykö turmioon, tehkää hyvää. Katso, Jumala rakastaa hyväntekijöitä.","clear":"Käyttäkää varojanne Allahin asian hyväksi, älkääkä heittäkö itseänne tuhoon ˹pidättäytymällä antamasta˺. Ja tehkää hyvää, sillä Allah totisesti rakastaa hyväntekijöitä."}},{"verse":196,"commentary_en":"Transitioning from earlier themes of fighting and charitable spending, this verse introduces detailed rules concerning the pilgrimage to Mecca—both the major pilgrimage (Hajj) and the lesser pilgrimage (‘Umrah). It instructs believers to complete these sacred journeys once they have been undertaken, and to do so sincerely for the sake of God. If a pilgrim is prevented from completing the rites—due to illness, obstruction, or other valid reasons—a sacrificial animal should be offered instead. In such cases, the pilgrim is allowed to exit the state of consecration (known as ihram, a special spiritual state with physical and behavioral restrictions) without completing all the rites. However, pilgrims should not shave their heads, a symbolic act of completion, until the sacrifice reaches its destination. An exception is made for those suffering from illness or a condition affecting the head, who may shave during ihram, but they must offer compensation—either by fasting, feeding the poor, or making a sacrifice. For those performing the combined pilgrimage (Tamattu', where both ‘Umrah and Hajj are performed in one trip during the Hajj season), a sacrifice is also required. However, if someone cannot afford this, they must fast ten days—three during the pilgrimage and seven after returning home. This rule specifically applies to those who do not live near the Sacred Mosque in Mecca. The verse ends with a reminder to fear God and remain mindful of His strict accountability, underlining the importance of properly fulfilling these religious obligations.","commentary_fi":"Siirtyen aiemmista aiheista, kuten taistelusta ja almuista, tämä jae esittelee yksityiskohtaiset säännöt Mekan pyhiinvaelluksesta – sekä suuresta pyhiinvaelluksesta (Hajj) että pienemmästä pyhiinvaelluksesta (‘Umrah). Siinä kehotetaan uskovia suorittamaan nämä pyhät matkat loppuun asti vilpittömästi Jumalan tähden, kun ne on kerran aloitettu. Jos pyhiinvaeltaja ei pysty suorittamaan rituaaleja loppuun – esimerkiksi sairauden, esteiden tai muiden pätevien syiden vuoksi – hänen tulee uhrata eläin hyvitykseksi. Tällöin pyhiinvaeltaja saa poistua pyhyyden tilasta (ihram, erityinen hengellinen tila, jossa noudatetaan tiettyjä fyysisiä ja käyttäytymissääntöjä) ilman, että kaikki rituaalit on suoritettu. Kuitenkin päätä ei tule ajaa paljaaksi – symbolinen teko, joka merkitsee pyhiinvaelluksen päättymistä – ennen kuin uhrieläin on saavuttanut määräpaikkansa. Poikkeus tehdään niille, jotka sairastavat tai joilla on pään alueen vaiva: he saavat ajaa päänsä ihramin aikana, mutta heidän on tehtävä hyvitys joko paastoamalla, ruokkimalla köyhiä tai uhraamalla eläin. Niiden, jotka suorittavat yhdistetyn pyhiinvaelluksen (Tamattu', jossa sekä ‘Umrah että Hajj tehdään samalla matkalla pyhiinvaelluskauden aikana), on myös uhrattava eläin. Jos tähän ei ole varaa, on paastottava kymmenen päivää – kolme matkan aikana ja seitsemän kotiin paluun jälkeen. Tämä sääntö koskee erityisesti niitä, jotka eivät asu Läheisen moskeijan (Mekan pyhän moskeijan) läheisyydessä. Jae päättyy muistutukseen Jumalan pelosta ja Hänen ankaruudestaan rangaistuksessa, mikä korostaa näiden uskonnollisten velvoitteiden huolellisen noudattamisen tärkeyttä.","arabic":"وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ ۚ فَإِنْ أُحْصِرْتُمْ فَمَا اسْتَيْسَرَ مِنَ الْهَدْيِ ۖ وَلَا تَحْلِقُوا رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ الْهَدْيُ مَحِلَّهُ ۚ فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَوْ بِهِ أَذًى مِنْ رَأْسِهِ فَفِدْيَةٌ مِنْ صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ ۚ فَإِذَا أَمِنْتُمْ فَمَنْ تَمَتَّعَ بِالْعُمْرَةِ إِلَى الْحَجِّ فَمَا اسْتَيْسَرَ مِنَ الْهَدْيِ ۚ فَمَنْ لَمْ يَجِدْ فَصِيَامُ ثَلَاثَةِ أَيَّامٍ فِي الْحَجِّ وَسَبْعَةٍ إِذَا رَجَعْتُمْ ۗ تِلْكَ عَشَرَةٌ كَامِلَةٌ ۗ ذَٰلِكَ لِمَنْ لَمْ يَكُنْ أَهْلُهُ حَاضِرِي الْمَسْجِدِ الْحَرَامِ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ","commentary":"Siirtyen aiemmista aiheista, kuten taistelusta ja almuista, tämä jae esittelee yksityiskohtaiset säännöt Mekan pyhiinvaelluksesta – sekä suuresta pyhiinvaelluksesta (Hajj) että pienemmästä pyhiinvaelluksesta (‘Umrah). Siinä kehotetaan uskovia suorittamaan nämä pyhät matkat loppuun asti vilpittömästi Jumalan tähden, kun ne on kerran aloitettu. Jos pyhiinvaeltaja ei pysty suorittamaan rituaaleja loppuun – esimerkiksi sairauden, esteiden tai muiden pätevien syiden vuoksi – hänen tulee uhrata eläin hyvitykseksi. Tällöin pyhiinvaeltaja saa poistua pyhyyden tilasta (ihram, erityinen hengellinen tila, jossa noudatetaan tiettyjä fyysisiä ja käyttäytymissääntöjä) ilman, että kaikki rituaalit on suoritettu. Kuitenkin päätä ei tule ajaa paljaaksi – symbolinen teko, joka merkitsee pyhiinvaelluksen päättymistä – ennen kuin uhrieläin on saavuttanut määräpaikkansa. Poikkeus tehdään niille, jotka sairastavat tai joilla on pään alueen vaiva: he saavat ajaa päänsä ihramin aikana, mutta heidän on tehtävä hyvitys joko paastoamalla, ruokkimalla köyhiä tai uhraamalla eläin. Niiden, jotka suorittavat yhdistetyn pyhiinvaelluksen (Tamattu', jossa sekä ‘Umrah että Hajj tehdään samalla matkalla pyhiinvaelluskauden aikana), on myös uhrattava eläin. Jos tähän ei ole varaa, on paastottava kymmenen päivää – kolme matkan aikana ja seitsemän kotiin paluun jälkeen. Tämä sääntö koskee erityisesti niitä, jotka eivät asu Läheisen moskeijan (Mekan pyhän moskeijan) läheisyydessä. Jae päättyy muistutukseen Jumalan pelosta ja Hänen ankaruudestaan rangaistuksessa, mikä korostaa näiden uskonnollisten velvoitteiden huolellisen noudattamisen tärkeyttä.","translations":{"opas":"Suorittakaa pyhiinvaelluksenne, käykää Jumalan kunniaksi pyhässä paikassa (Mekassa). Mutta jos olette estetyt, niin lähettäkää jotakin uhrattavaa, mikä on helposti saatavissa; älkääkä ajelko päätänne, ennenkuin uhrinne on tullut perille määräpaikkaansa. Mutta jos joku teistä on sairas tai päässä olevan vamman vaivaama, niin hän hyvittäköön saman paastolla, almujenannolla tai uhrina. Ja kun sitten olette turvassa vihollisilta, niin se, joka rajoittuu käyntiin pyhäkössä, lykäten pyhiinvaelluksensa, antakoon jonkun uhrin, joka on helposti saatavissa; se taas, joka sitä ei voi hankkia, paastotkoon kolme päivää (vastaisen pyhiinvaelluksensa aikana) ja seitsemän palattuaan,yhteensä kymmenen päivää. Tämä koskee sitä, jonka omaiset eivät ole Rauhoitetun pyhäkön alueella; täyttäkää velvollisuutenne Jumalaa kohtaan ja tietäkää, että Jumala on ankara rangaistessaan.","clear":"Suorittakaa pyhiinvaellus ja pienempi pyhiinvaellus Allahin vuoksi. Mutta jos teidät estetään ˹jatkamasta˺, niin ˹uhratkaa˺ sen verran uhrieläimiä kuin teillä on varaa. Älkääkä ajelko päitänne ennen kuin uhrieläin saavuttaa määränpäänsä. Mutta jos joku teistä on sairas tai hänellä on päänahan vaiva ˹joka vaatii ajelua˺, niin korvatkaa joko paastolla, hyväntekeväisyydellä tai uhrieläimellä. Rauhan aikana voitte yhdistää pyhiinvaelluksen ja pienemmän pyhiinvaelluksen ja tehdä sitten sen uhrieläimen, johon teillä on varaa. Joka ei kykene siihen ˹uhriin˺, paastotkoon kolme päivää pyhiinvaelluksen aikana ja seitsemän palattuaan ˹kotiin˺ – tehden yhteensä kymmenen. Nämä uhrilahjat ovat niille, jotka eivät asu lähellä Pyhää Taloa. Olkaa tietoisia Allahista, ja tietäkää, että Allah on ankara rankaisija."}},{"verse":197,"commentary_en":"Continuing the discussion on Hajj from the previous verse, this verse states that the pilgrimage takes place during well-known, designated months. During this sacred time, specific behavioral guidelines apply. Pilgrims are instructed to avoid lewdness—including sexual activity, suggestive behavior, and even flirtatious speech—sinful conduct, and disputes. Even lawful intimacy between spouses must be avoided during the pilgrimage, reflecting the seriousness and spiritual focus of the journey. While some of these behaviors may be acceptable outside of Hajj, they are not permitted during it, as this period calls for heightened self-restraint and devotion. Transgression—committing morally or spiritually wrong actions—is prohibited at all times, including during Hajj. The verse reassures pilgrims that Allah is fully aware of any good they do, encouraging sincere effort in both outward behavior and inner intention. Pilgrims are advised to take practical provisions for their journey, but the verse emphasizes that the best provision is righteousness—conduct rooted in deep awareness and reverence for Allah. It concludes by urging people of understanding to remain mindful of Allah, underscoring that spiritual preparation is just as important as physical readiness when undertaking this sacred journey.","commentary_fi":"Jatkaen edellisen jakeen Hajjista kertovaa opetusta, tässä jakeessa todetaan, että pyhiinvaellus suoritetaan tiettyinä, hyvin tunnettuina kuukausina. Tänä pyhänä aikana sovelletaan erityisiä käyttäytymissääntöjä. Pyhiinvaeltajia kehotetaan pidättäytymään siveettömyydestä – mukaan lukien seksuaalinen kanssakäyminen, vihjaileva käytös ja jopa flirttaileva puhe – synnillisestä käytöksestä ja riidoista. Vaikka puolisoiden välinen intiimiys on sallittua muulloin, Hajjissa se on kielletty, mikä heijastaa matkan vakavuutta ja hengellistä keskittymistä. Jotkin näistä käytöksistä voivat olla sallittuja Hajin ulkopuolella, mutta ne eivät ole sopivia pyhiinvaelluksen aikana, joka vaatii korostettua itsehillintää ja omistautumista. Rikkomukset – moraalisesti tai hengellisesti väärät teot – ovat kiellettyjä aina, myös Hajjissa. Jae vakuuttaa pyhiinvaeltajille, että Allah tietää kaiken hyvän, mitä he tekevät, ja kannustaa vilpittömään pyrkimykseen sekä ulkoisessa käyttäytymisessä että sisäisessä aikomuksessa. Pyhiinvaeltajia neuvotaan ottamaan käytännön tarvikkeita matkalleen, mutta jae korostaa, että paras varustus on hurskaus – käytös, joka perustuu syvään tietoisuuteen ja kunnioitukseen Allahia kohtaan. Jaen lopussa kehotetaan ymmärtäväisiä ihmisiä pysymään tietoisina Allahista, mikä korostaa, että hengellinen valmistautuminen on yhtä tärkeää kuin fyysinen valmistautuminen tätä pyhää matkaa varten.","arabic":"الْحَجُّ أَشْهُرٌ مَعْلُومَاتٌ ۚ فَمَنْ فَرَضَ فِيهِنَّ الْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي الْحَجِّ ۗ وَمَا تَفْعَلُوا مِنْ خَيْرٍ يَعْلَمْهُ اللَّهُ ۗ وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ ۚ وَاتَّقُونِ يَا أُولِي الْأَلْبَابِ","commentary":"Jatkaen edellisen jakeen Hajjista kertovaa opetusta, tässä jakeessa todetaan, että pyhiinvaellus suoritetaan tiettyinä, hyvin tunnettuina kuukausina. Tänä pyhänä aikana sovelletaan erityisiä käyttäytymissääntöjä. Pyhiinvaeltajia kehotetaan pidättäytymään siveettömyydestä – mukaan lukien seksuaalinen kanssakäyminen, vihjaileva käytös ja jopa flirttaileva puhe – synnillisestä käytöksestä ja riidoista. Vaikka puolisoiden välinen intiimiys on sallittua muulloin, Hajjissa se on kielletty, mikä heijastaa matkan vakavuutta ja hengellistä keskittymistä. Jotkin näistä käytöksistä voivat olla sallittuja Hajin ulkopuolella, mutta ne eivät ole sopivia pyhiinvaelluksen aikana, joka vaatii korostettua itsehillintää ja omistautumista. Rikkomukset – moraalisesti tai hengellisesti väärät teot – ovat kiellettyjä aina, myös Hajjissa. Jae vakuuttaa pyhiinvaeltajille, että Allah tietää kaiken hyvän, mitä he tekevät, ja kannustaa vilpittömään pyrkimykseen sekä ulkoisessa käyttäytymisessä että sisäisessä aikomuksessa. Pyhiinvaeltajia neuvotaan ottamaan käytännön tarvikkeita matkalleen, mutta jae korostaa, että paras varustus on hurskaus – käytös, joka perustuu syvään tietoisuuteen ja kunnioitukseen Allahia kohtaan. Jaen lopussa kehotetaan ymmärtäväisiä ihmisiä pysymään tietoisina Allahista, mikä korostaa, että hengellinen valmistautuminen on yhtä tärkeää kuin fyysinen valmistautuminen tätä pyhää matkaa varten.","translations":{"opas":"Pyhiinvaellus tapahtuu vain määrättyinä kuukausina; jos joku päättää suorittaa pyhän matkan näiden kuukausien aikana, olkoon häneltä yhteys naiseen, laittomuus ja riita pyhiinvaelluksen aikana kielletty. Mitä hyvää teettekään, Jumala tietää sen. Ja varustautukaa matkaeväillä. Paras matkaeväs on jumalanpelko; täyttäkää velvollisuutenne Minua kohtaan te, joilla on ymmärrys.","clear":"Pyhiinvaellukseen sitoudutaan määrättyinä kuukausina. Joka sitoutuu pyhiinvaelluksen suorittamiseen, pysyköön erossa intiimeistä suhteista, sopimattomasta kielenkäytöstä ja riidoista pyhiinvaelluksen aikana. Kaiken hyvän, mitä teette, Allah tietää ˹täysin˺. Ottakaa ˹tarpeelliset˺ eväät ˹matkalle˺ – totisesti paras eväs on hurskaus. Ja olkaa minua kohtaan tietoisia, te järjen ihmiset!"}},{"verse":198,"commentary_en":"Building on the rules and conduct of Hajj, this verse clarifies that it is permissible to seek Allah’s bounty during the pilgrimage—such as through trade or commercial activity. This addresses a previous concern some had about combining acts of worship with earning a livelihood during Hajj. Engaging in trade while on pilgrimage is not only allowed but can also be seen as beneficial, as it helps meet the needs of fellow pilgrims. If those who provide goods and services were prohibited from doing so, who would support the practical needs of the pilgrims? The verse then describes a key ritual: remembering Allah at al-Mash‘ar al-Haram (the Sacred Monument at Muzdalifah) after departing from ‘Arafat, as an act of acknowledging Allah’s guidance. It reminds believers of the misguidance they were in before being guided through Islam, prompting a deep sense of gratitude.","commentary_fi":"Rakentaen Hajjia koskevien sääntöjen ja käyttäytymisohjeiden varaan, tämä jae selventää, että on sallittua etsiä Allahin antamaa siunausta pyhiinvaelluksen aikana – esimerkiksi käymällä kauppaa tai harjoittamalla liiketoimintaa. Tämä vastaa aiempaan huoleen siitä, voiko palvontaa yhdistää elannon hankkimiseen Hajjissa. Kaupankäynti pyhiinvaelluksen aikana ei ole ainoastaan sallittua, vaan se voi myös olla hyödyllistä, sillä se auttaa täyttämään toisten pyhiinvaeltajien tarpeita. Jos tavaroiden ja palvelujen tarjoaminen kiellettäisiin, kuka silloin huolehtisi pyhiinvaeltajien käytännön tarpeista? Jae kuvailee sitten tärkeää rituaalia: Allahin muistamista al-Mash'ar al-Haramissa (pyhällä muistopaikalla Muzdalifahissa) lähdettäessä ’Arafatilta – tämä toimii Allahin johdatuksen tunnustamisena. Se muistuttaa uskovia siitä eksyksissä olleesta tilasta, jossa he olivat ennen islamin tuomaa ohjausta, ja kehottaa kiitollisuuteen.","arabic":"لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَبْتَغُوا فَضْلًا مِنْ رَبِّكُمْ ۚ فَإِذَا أَفَضْتُمْ مِنْ عَرَفَاتٍ فَاذْكُرُوا اللَّهَ عِنْدَ الْمَشْعَرِ الْحَرَامِ ۖ وَاذْكُرُوهُ كَمَا هَدَاكُمْ وَإِنْ كُنْتُمْ مِنْ قَبْلِهِ لَمِنَ الضَّالِّينَ","commentary":"Rakentaen Hajjia koskevien sääntöjen ja käyttäytymisohjeiden varaan, tämä jae selventää, että on sallittua etsiä Allahin antamaa siunausta pyhiinvaelluksen aikana – esimerkiksi käymällä kauppaa tai harjoittamalla liiketoimintaa. Tämä vastaa aiempaan huoleen siitä, voiko palvontaa yhdistää elannon hankkimiseen Hajjissa. Kaupankäynti pyhiinvaelluksen aikana ei ole ainoastaan sallittua, vaan se voi myös olla hyödyllistä, sillä se auttaa täyttämään toisten pyhiinvaeltajien tarpeita. Jos tavaroiden ja palvelujen tarjoaminen kiellettäisiin, kuka silloin huolehtisi pyhiinvaeltajien käytännön tarpeista? Jae kuvailee sitten tärkeää rituaalia: Allahin muistamista al-Mash'ar al-Haramissa (pyhällä muistopaikalla Muzdalifahissa) lähdettäessä ’Arafatilta – tämä toimii Allahin johdatuksen tunnustamisena. Se muistuttaa uskovia siitä eksyksissä olleesta tilasta, jossa he olivat ennen islamin tuomaa ohjausta, ja kehottaa kiitollisuuteen.","translations":{"opas":"Ei ole mikään synti koettaa hankkia (kaupanteolla) itsellenne jotakin Herranne rikkauksista. Mutta kun te joukoissa kiiruhdatte alas Arafaatilta, niin rukoilkaa Jumalaa rauhoitetulla muistopaikalla. Muistakaa Häntä silloin Hänen johdatuksensa tähden, sillä ennen te totisesti kuuluitte eksyneisiin.","clear":"Teitä ei syytetä Herranne hyvyyden etsimisestä ˹tämän matkan aikana˺. Kun palaatte ’Arafâtista, ylistäkää Allahia pyhän paikan lähellä ja ylistäkää Häntä siitä, että Hän on johdattanut teitä, sillä varmasti ennen tätä ˹johdatusta˺ olitte harhateillä."}},{"verse":199,"commentary_en":"This verse addresses a pre-Islamic custom in which a certain group believed they held special status during the pilgrimage, granting themselves the privilege of setting out from a different location than the rest. The verse abolishes this distinction, instructing all pilgrims to depart from the same place, thereby reinforcing the principle of equality before Allah—a core value in Islam. After this shared act of remembrance and movement, the verse calls upon pilgrims to seek Allah’s forgiveness. It serves as a reminder that Allah is abundantly Forgiving and Merciful. This highlights that, regardless of one’s past mistakes or shortcomings, Allah’s pardon is always within reach for those who sincerely turn to Him.","commentary_fi":"Tämä jae käsittelee esi-islamilaista käytäntöä, jossa tietty ryhmä uskoi omaavansa erityisaseman pyhiinvaelluksen aikana ja antoi itselleen luvan lähteä liikkeelle eri paikasta kuin muut. Jae kumoaa tämän erottelun ja kehottaa kaikkia pyhiinvaeltajia lähtemään samasta paikasta, vahvistaen näin islamin keskeisen periaatteen: kaikkien tasa-arvon Allahin edessä. Tämän yhteisen muiston ja liikkeellelähdön jälkeen jae kehottaa pyhiinvaeltajia pyytämään Allahilta anteeksiantoa. Se muistuttaa, että Allah on ylen määrin Anteeksiantava ja Armahtava. Tämä korostaa sitä, että riippumatta menneistä virheistä tai puutteista, Allahin anteeksianto on aina mahdollinen niille, jotka vilpittömästi kääntyvät Hänen puoleensa.","arabic":"ثُمَّ أَفِيضُوا مِنْ حَيْثُ أَفَاضَ النَّاسُ وَاسْتَغْفِرُوا اللَّهَ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ","commentary":"Tämä jae käsittelee esi-islamilaista käytäntöä, jossa tietty ryhmä uskoi omaavansa erityisaseman pyhiinvaelluksen aikana ja antoi itselleen luvan lähteä liikkeelle eri paikasta kuin muut. Jae kumoaa tämän erottelun ja kehottaa kaikkia pyhiinvaeltajia lähtemään samasta paikasta, vahvistaen näin islamin keskeisen periaatteen: kaikkien tasa-arvon Allahin edessä. Tämän yhteisen muiston ja liikkeellelähdön jälkeen jae kehottaa pyhiinvaeltajia pyytämään Allahilta anteeksiantoa. Se muistuttaa, että Allah on ylen määrin Anteeksiantava ja Armahtava. Tämä korostaa sitä, että riippumatta menneistä virheistä tai puutteista, Allahin anteeksianto on aina mahdollinen niille, jotka vilpittömästi kääntyvät Hänen puoleensa.","translations":{"opas":"Kiiruhtakaa sitten eteenpäin samasta paikasta kuin vaeltajain joukot ja rukoilkaa Jumalalta anteeksiantoa. Katso, Jumala on armahtavainen ja laupias.","clear":"Menkää sitten eteenpäin muiden pyhiinvaeltajien kanssa. Ja pyytäkää Allahin anteeksiantoa. Varmasti Allah on kaiken anteeksiantava, armollisin."}},{"verse":200,"commentary_en":"This verse marks a transition from detailing specific pilgrimage rituals to addressing the inner state and spiritual focus after those rites are completed. It instructs Muslims to remember Allah with deep and sincere devotion, in contrast to the pre-Islamic custom where people would boast about their ancestors after pilgrimage. This shift underscores the transformation Islam introduced: moving from glorifying worldly lineage and past achievements to engaging in heartfelt remembrance of Allah. The verse then highlights a certain type of person—one who, even in supplication, is solely concerned with gaining the pleasures of this worldly life. Their prayers are limited to material gains, with no aspiration toward what is eternal or spiritually uplifting. This narrow focus reveals a lack of deeper faith. Allah makes this point clear at the end of the verse: “And among the people is he who says, ‘Our Lord, give us in this world,’ and he will have no share in the Hereafter.” This warns that by confining one’s desires to the present life, one risks forfeiting any reward in the life to come. Importantly, this verse leads into the next, which provides a more balanced perspective.","commentary_fi":"Tämä jae merkitsee siirtymää pyhiinvaelluksen yksityiskohtaisista rituaaleista sydämen tilaan ja henkiseen keskittymiseen sen jälkeen, kun rituaalit on suoritettu. Muslimeja kehotetaan muistamaan Allahia syvällä ja vilpittömällä hartaudella – toisin kuin esi-islamilaisessa perinteessä, jossa ihmiset ylistivät esi-isiään pyhiinvaelluksen jälkeen. Tämä muutos korostaa sitä hengellistä uudistusta, jonka islam toi mukanaan: maallisen syntyperän ja menneiden saavutusten korostamisesta siirrytään kohti aitoa Allahin muistamista. Jae kuvaa sitten tietynlaista ihmistä – sellaista, joka pyytää rukouksissaan vain tämän maailman nautintoja. Hänen anomuksensa rajoittuvat aineellisiin etuihin, vailla kaipuuta pysyvään tai hengellisesti kohottavaan. Tällainen kapea keskittyminen paljastaa uskon puutetta. Allah tekee tämän selväksi jaen lopussa: \"Ja ihmisten joukossa on se, joka sanoo: 'Herramme, anna meille tässä maailmassa', mutta hänellä ei ole osuutta Tuonpuoleisessa.\" Tämä varoittaa, että rajoittamalla toiveensa vain nykyhetkeen, ihminen vaarantaa kaiken, mitä iankaikkinen elämä voisi tarjota. Tämä jae johdattaa seuraavaan, joka esittelee tasapainoisemman näkökulman.","arabic":"فَإِذَا قَضَيْتُمْ مَنَاسِكَكُمْ فَاذْكُرُوا اللَّهَ كَذِكْرِكُمْ آبَاءَكُمْ أَوْ أَشَدَّ ذِكْرًا ۗ فَمِنَ النَّاسِ مَنْ يَقُولُ رَبَّنَا آتِنَا فِي الدُّنْيَا وَمَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ","commentary":"Tämä jae merkitsee siirtymää pyhiinvaelluksen yksityiskohtaisista rituaaleista sydämen tilaan ja henkiseen keskittymiseen sen jälkeen, kun rituaalit on suoritettu. Muslimeja kehotetaan muistamaan Allahia syvällä ja vilpittömällä hartaudella – toisin kuin esi-islamilaisessa perinteessä, jossa ihmiset ylistivät esi-isiään pyhiinvaelluksen jälkeen. Tämä muutos korostaa sitä hengellistä uudistusta, jonka islam toi mukanaan: maallisen syntyperän ja menneiden saavutusten korostamisesta siirrytään kohti aitoa Allahin muistamista. Jae kuvaa sitten tietynlaista ihmistä – sellaista, joka pyytää rukouksissaan vain tämän maailman nautintoja. Hänen anomuksensa rajoittuvat aineellisiin etuihin, vailla kaipuuta pysyvään tai hengellisesti kohottavaan. Tällainen kapea keskittyminen paljastaa uskon puutetta. Allah tekee tämän selväksi jaen lopussa: \"Ja ihmisten joukossa on se, joka sanoo: 'Herramme, anna meille tässä maailmassa', mutta hänellä ei ole osuutta Tuonpuoleisessa.\" Tämä varoittaa, että rajoittamalla toiveensa vain nykyhetkeen, ihminen vaarantaa kaiken, mitä iankaikkinen elämä voisi tarjota. Tämä jae johdattaa seuraavaan, joka esittelee tasapainoisemman näkökulman.","translations":{"opas":"Ja kun olette suorittaneet hartaudenharjoituksenne, niin muistakaa Jumalaa, samoinkuin muistelitte isiänne , jopa vielä hartaammin. Ihmisten joukossa on sellaisia, jotka sanovat: »Herramme, anna meille kaikkea tässä elämässä!» Nämä eivät saa mitään osaa tulevassa.","clear":"Kun olette täyttäneet pyhät rituaalienne, ylistäkää Allahia niin kuin ennen tapoitte ylistää esi-isianne ˹ennen islamia˺, tai jopa intohimoisemmin. On olemassa joitakin, jotka sanovat: ”Herramme! Anna meille ˹lahjasi˺ tässä maailmassa”, mutta heillä ei ole osuutta Tuonpuoleisessa."}},{"verse":201,"commentary_en":"Following the description of those who seek only worldly gain, this verse presents a contrasting type of person. These are individuals whose prayers and aspirations are more balanced and comprehensive. They seek goodness not just in this life, but also in the Hereafter. This prayer acknowledges the importance of wellbeing in the present world while maintaining a strong connection to the eternal life and seeking protection from punishment in the afterlife. This demonstrates a broader vision and deeper understanding of existence and its purpose.","commentary_fi":"Kuvaillessaan niitä, jotka etsivät vain maallista hyötyä, tämä jae esittelee vastakkaisen ihmistyypin. Nämä ovat yksilöitä, joiden rukoukset ja pyrkimykset ovat tasapainoisempia ja kattavampia. He etsivät hyvää paitsi tässä elämässä, myös tuonpuoleisessa. Tämä rukous tunnustaa hyvinvoinnin tärkeyden nykyisessä maailmassa samalla kun ylläpidetään vahva yhteys ikuiseen elämään ja pyritään suojautumaan tuonpuoleisen rangaistukselta. Tämä osoittaa laajemman näkemyksen ja syvemmän ymmärryksen olemassaolosta ja sen tarkoituksesta.","arabic":"وَمِنْهُمْ مَنْ يَقُولُ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","commentary":"Kuvaillessaan niitä, jotka etsivät vain maallista hyötyä, tämä jae esittelee vastakkaisen ihmistyypin. Nämä ovat yksilöitä, joiden rukoukset ja pyrkimykset ovat tasapainoisempia ja kattavampia. He etsivät hyvää paitsi tässä elämässä, myös tuonpuoleisessa. Tämä rukous tunnustaa hyvinvoinnin tärkeyden nykyisessä maailmassa samalla kun ylläpidetään vahva yhteys ikuiseen elämään ja pyritään suojautumaan tuonpuoleisen rangaistukselta. Tämä osoittaa laajemman näkemyksen ja syvemmän ymmärryksen olemassaolosta ja sen tarkoituksesta.","translations":{"opas":"Mutta on sellaisiakin, jotka sanovat: »Herra, anna meille hyvää tässä elämässä ja hyvää tulevassa ja varjele meitä Tulen rangaistuksesta!»","clear":"Kuitenkin on olemassa toisia, jotka sanovat: ”Herramme! Anna meille tämän maailman ja Tuonpuoleisen hyvyys ja suojele meitä Tulen piinalta.”"}},{"verse":202,"commentary_en":"This verse highlights the reward for those who adopt the balanced perspective described in the previous verse—those who seek what is good both in this world and in the Hereafter. It assures that such individuals will be granted their reward in both realms, reflecting Allah’s justice and generosity. The verse also describes Allah as “swift in account,” serving as a powerful re
