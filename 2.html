mä kieltäytyminen, joka juonsi juurensa ylimielisyydestä, teki hänestä uskonsa hylkääjän. Tämä jae esittelee Iblisin ihmiskunnan vastustajana, joka nousi siitä, ettei hän suostunut tunnustamaan Aadamin saamaa arvoa. Islamilaisen uskon mukaan Iblis ei ole enkeli; hänet kuvataan selvästi Koraanissa (jae 18:50) olevan jinneistä – erillinen ja itsenäinen luomakunta, joka eroaa enkeleistä.","translations":{"opas":"Ja kun Me sanoimme enkeleille: »Kumartukaa maahan Ihmisen (Aadamin) edessä», heittäytyivät he maahan kaikki paitsi Saatana. Hän kieltäytyi ylpeyksissään ja joutui jumalattomien lukuun.","clear":"Ja ˹muistakaa˺, kun Me sanoimme enkeleille: ”Kumartukaa Aadamin edessä,” niin he kaikki tekivät niin – paitsi Iblis, joka kieltäytyi ja toimi ylimielisesti, muuttuen uskottomaksi."}},{"verse":35,"commentary_en":"After being honoured and tested, Adam and his wife were allowed to dwell in a Garden. They were given freedom to enjoy its abundant provisions, with only one prohibition: not to approach a specific tree. This single restriction served as a test of their obedience and willpower, symbolic of the boundaries set by Allah that humanity would face on Earth.","commentary_fi":"Kunniaa ja koetta suoritettuaan, Adam ja hänen vaimonsa saivat asua Puutarhassa. Heille annettiin vapaus nauttia sen runsaista antimista, vain yhden kiellon kera: he eivät saaneet lähestyä tiettyä puuta. Tämä yksi rajoitus palveli heidän kuuliaisuutensa ja tahdonvoimansa kokeena, symboloiden Allahin asettamia rajoja, joita ihmiskunta kohtaisi maan päällä.","arabic":"وَقُلْنَا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ","commentary":"Kunniaa ja koetta suoritettuaan, Adam ja hänen vaimonsa saivat asua Puutarhassa. Heille annettiin vapaus nauttia sen runsaista antimista, vain yhden kiellon kera: he eivät saaneet lähestyä tiettyä puuta. Tämä yksi rajoitus palveli heidän kuuliaisuutensa ja tahdonvoimansa kokeena, symboloiden Allahin asettamia rajoja, joita ihmiskunta kohtaisi maan päällä.","translations":{"opas":"Me sanoimme vielä: »Aadam, asu Paratiisissa, sinä ja vaimosi, ja nauttikaa sieltä vapaasti ravintoa, mistä haluatte, mutta älkää lähestykö tätä puuta, jottette tulisi väärintekijöiksi.»","clear":"Me varoitimme: ”Oi Aadam! Asu vaimosi kanssa Paratiisissa ja syökää vapaasti niin paljon kuin haluatte, mutta älkää lähestykö tätä puuta, tai muuten olette väärintekijöitä.”"}},{"verse":36,"commentary_en":"Satan (Iblis), having refused to honour Adam (verse 34), now actively tempted Adam and his wife, causing them to disobey Allah by approaching the forbidden tree (verse 35). This act led to their removal from the Garden. Allah then decreed that they, and their descendants, would descend to Earth. This marked the beginning of human life on earth, the place appointed for humanity's role as vicegerent (verse 30). The descent also signifies the ongoing struggle between humanity and Satan, with Earth being their temporary home and source of sustenance.","commentary_fi":"Sitten Saatana (Iblis), kieltäydyttyään kunnioittamasta Adamia (jae 34), aktiivisesti houkutteli Adamia ja hänen vaimoaan saaden heidät tottelemaan Allahia vastaan lähestymällä kiellettyä puuta (jae 35). Tämä teko johti heidän poistamiseensa Puutarhasta. Allah sitten määräsi, että he, ja heidän jälkeläisensä, laskeutuisivat Maahan. Tämä merkitsi ihmiselämän alkua maan päällä, paikassa, joka oli määrätty ihmiskunnan roolille sijaisena (jae 30). Laskeutuminen symboloi myös jatkuvaa taistelua ihmiskunnan ja Saatanan välillä, Maan ollessa heidän väliaikainen kotinsa ja elannon lähteensä.","arabic":"فَأَزَلَّهُمَا الشَّيْطَانُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِ ۖ وَقُلْنَا اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ وَلَكُمْ فِي الْأَرْضِ مُسْتَقَرٌّ وَمَتَاعٌ إِلَىٰ حِينٍ","commentary":"Sitten Saatana (Iblis), kieltäydyttyään kunnioittamasta Adamia (jae 34), aktiivisesti houkutteli Adamia ja hänen vaimoaan saaden heidät tottelemaan Allahia vastaan lähestymällä kiellettyä puuta (jae 35). Tämä teko johti heidän poistamiseensa Puutarhasta. Allah sitten määräsi, että he, ja heidän jälkeläisensä, laskeutuisivat Maahan. Tämä merkitsi ihmiselämän alkua maan päällä, paikassa, joka oli määrätty ihmiskunnan roolille sijaisena (jae 30). Laskeutuminen symboloi myös jatkuvaa taistelua ihmiskunnan ja Saatanan välillä, Maan ollessa heidän väliaikainen kotinsa ja elannon lähteensä.","translations":{"opas":"Mutta Saatana sai heidät poikkeamaan tästä ja vietteli heidät ulos siitä autuaasta olotilasta, jossa he olivat, ja Me sanoimme: »Syöksykää alas! Toinen teistä olkoon toisen vihollinen! Kuitenkin saatte ajallisen olinpaikan ja toimeentulonne maan päällä.»","clear":"Mutta Saatana petti heidät – johtaen heidän putoamiseensa ˹autuaasta˺ tilasta, jossa he olivat, ja Me sanoimme: ”Laskeutukaa taivaista ˹maahan˺ toistenne vihollisina. Te löydätte maasta asuinpaikan ja elatuksen määrätyksi ajaksenne.”"}},{"verse":37,"commentary_en":"After committing the error (as mentioned in verse 36), Allah, in His mercy, taught Adam words of repentance or prayer. When Adam used these words, Allah accepted his repentance. This highlights the concept that Allah is always ready to accept the sincere repentance of those who turn back to Him, demonstrating His attributes as the Oft-Returning (to His creation in mercy) and the Most Merciful. This verse offers hope for humanity after making mistakes.","commentary_fi":"Tehtyään virheen (kuten jakeessa 36 mainitaan), Allah opetti Aadamille armossaan katumuksen sanoja eli rukouksen. Kun Aadam lausui nämä sanat, Allah hyväksyi hänen katumuksensa. Tämä korostaa käsitystä siitä, että Allah on aina valmis hyväksymään vilpittömän katumuksen niiltä, jotka palaavat Hänen luokseen. Se osoittaa Hänen ominaisuutensa olla usein palaava (luotujensa luo armossa) ja Ylimmän armollinen. Tämä jae antaa toivoa ihmiselle virheiden jälkeen.","arabic":"فَتَلَقَّىٰ آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ","commentary":"Tehtyään virheen (kuten jakeessa 36 mainitaan), Allah opetti Aadamille armossaan katumuksen sanoja eli rukouksen. Kun Aadam lausui nämä sanat, Allah hyväksyi hänen katumuksensa. Tämä korostaa käsitystä siitä, että Allah on aina valmis hyväksymään vilpittömän katumuksen niiltä, jotka palaavat Hänen luokseen. Se osoittaa Hänen ominaisuutensa olla usein palaava (luotujensa luo armossa) ja Ylimmän armollinen. Tämä jae antaa toivoa ihmiselle virheiden jälkeen.","translations":{"opas":"Tällöin vastaanotti Aadam ilmestyksen sanat Herraltansa, ja tämä sääli häntä: katso, Hän on totisesti sääliväinen, laupias.","clear":"Sitten Aadam sai Herraltaan ˹rukouksen˺ sanat, joten Hän hyväksyi hänen katumuksensa. Totisesti, Hän on Katumuksen Hyväksyjä, Armollisin."}},{"verse":38,"commentary_en":"Confirming humanity's dwelling on Earth (verse 36), Allah reiterated that guidance would come to them. This verse provides the fundamental promise: whoever follows Allah's guidance will be secure, free from fear and grief. It sets the condition for human success and well-being on Earth, linking it directly to adhering to the divine guidance that would be revealed.","commentary_fi":"Vahvistaen ihmiskunnan asumisen maan päällä (jae 36), Allah toisti, että johdatus tulisi heille. Tämä jae antaa perustavanlaatuisen lupauksen: kuka tahansa seuraa Allahin johdatusta, heillä ei ole pelkoa eikä he tule suremaan. Se asettaa ehdon ihmisen menestykselle ja hyvinvoinnille maan päällä, linkittäen sen suoraan jumalalliseen johdatukseen, joka ilmoitettaisiin.","arabic":"قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا ۖ فَإِمَّا يَأْتِيَنَّكُمْ مِنِّي هُدًى فَمَنْ تَبِعَ هُدَايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","commentary":"Vahvistaen ihmiskunnan asumisen maan päällä (jae 36), Allah toisti, että johdatus tulisi heille. Tämä jae antaa perustavanlaatuisen lupauksen: kuka tahansa seuraa Allahin johdatusta, heillä ei ole pelkoa eikä he tule suremaan. Se asettaa ehdon ihmisen menestykselle ja hyvinvoinnille maan päällä, linkittäen sen suoraan jumalalliseen johdatukseen, joka ilmoitettaisiin.","translations":{"opas":"Me sanoimme: »Syöksykää täältä alas kaikki!» Totisesti tulee teille Minulta kuitenkin vielä Johdatus, ja jotka Minun johdatustani seuraavat, niitä ei mikään pelko valtaa, eikä heidän tarvitse murehtia.","clear":"Me sanoimme: ”Laskeutukaa kaikki! Sitten kun ohjausta tulee Minulta teille, niin ne, jotka sitä seuraavat, eivät pelkää eivätkä murehdi."}},{"verse":39,"commentary_en":"This verse presents the alternative outcome to the promise made in verse 38. While following Allah's guidance leads to peace and security, rejecting faith and denying His signs results in severe consequences. Those who follow this path will face the Fire and remain there permanently. It establishes the ultimate consequence of disobedience and denial in contrast to the guidance offered by Allah.","commentary_fi":"Tämä jae esittää vaihtoehtoisen lopputuloksen jakeessa 38 annetulle lupaukselle. Vaikka Allahin johdatuksen seuraaminen johtaa rauhaan ja turvallisuuteen, uskon hylkääminen ja Hänen merkkien kieltäminen johtavat vakaviin seurauksiin. Ne, jotka kulkevat tätä tietä, joutuvat Tuleen ja jäävät sinne pysyvästi. Tämä jae osoittaa tottelemattomuuden ja kieltämisen lopullisen seurauksen verrattuna Allahin tarjoamaan johdatukseen.","arabic":"وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ","commentary":"Tämä jae esittää vaihtoehtoisen lopputuloksen jakeessa 38 annetulle lupaukselle. Vaikka Allahin johdatuksen seuraaminen johtaa rauhaan ja turvallisuuteen, uskon hylkääminen ja Hänen merkkien kieltäminen johtavat vakaviin seurauksiin. Ne, jotka kulkevat tätä tietä, joutuvat Tuleen ja jäävät sinne pysyvästi. Tämä jae osoittaa tottelemattomuuden ja kieltämisen lopullisen seurauksen verrattuna Allahin tarjoamaan johdatukseen.","translations":{"opas":"Mutta ne, jotka ovat uskottomia ja pitävät ilmestyksemme valheena, ovat Tulen omia ja pysyvät siinä iankaikkisesti.","clear":"Mutta ne, jotka eivät usko ja kieltävät tunnusmerkkimme, ovat Tulen asukkaita. He tulevat olemaan siellä ikuisesti.”"}},{"verse":40,"commentary_en":"This verse begins a significant address in the Qur'an directed at the Children of Israel, recalling the many blessings Allah has historically granted them. It calls upon them to remember these special favors. The verse then emphasizes the importance of fulfilling their covenant with Allah. In return, Allah promises to fulfill His covenant with them. This highlights a reciprocal relationship based on obedience and remembrance. Finally, it instructs them to fear only Allah, emphasizing His ultimate authority and power, setting the stage for the commands and reminders that follow.","commentary_fi":"Tämä jae aloittaa merkittävän puheenvuoron Koraanissa, joka on suunnattu Israelin lapsille, muistuttaen heitä monista siunauksista, jotka Allah on heille historiallisesti suonut. Se kehottaa heitä muistamaan nämä erityiset suosionosoitukset. Jae korostaa sitten heidän liittonsa täyttämisen tärkeyttä Allahin kanssa. Vastineeksi Allah lupaa täyttää liittonsa heidän kanssaan. Tämä korostaa vastavuoroista suhdetta, joka perustuu kuuliaisuuteen ja muistamiseen. Lopuksi se ohjeistaa heitä pelkäämään vain Allahia, korostaen Hänen lopullista auktoriteettiaan ja voimaansa, luoden pohjan seuraaville käskyille ja muistutuksille.","arabic":"يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا بِعَهْدِي أُوفِ بِعَهْدِكُمْ وَإِيَّايَ فَارْهَبُونِ","commentary":"Tämä jae aloittaa merkittävän puheenvuoron Koraanissa, joka on suunnattu Israelin lapsille, muistuttaen heitä monista siunauksista, jotka Allah on heille historiallisesti suonut. Se kehottaa heitä muistamaan nämä erityiset suosionosoitukset. Jae korostaa sitten heidän liittonsa täyttämisen tärkeyttä Allahin kanssa. Vastineeksi Allah lupaa täyttää liittonsa heidän kanssaan. Tämä korostaa vastavuoroista suhdetta, joka perustuu kuuliaisuuteen ja muistamiseen. Lopuksi se ohjeistaa heitä pelkäämään vain Allahia, korostaen Hänen lopullista auktoriteettiaan ja voimaansa, luoden pohjan seuraaville käskyille ja muistutuksille.","translations":{"opas":"Israelilaiset, muistakaa Minun mielisuosiotani, jonka olen antanut tulla osaksenne, ja täyttäkää osuutenne liitossa, niin olen Minä täyttävä oman osani liitossa, ja peljätkää yksin Minua","clear":"Oi Israelin lapset! Muistakaa suosioni teitä kohtaan. Täyttäkää liittonne, niin Minä täytän omani, ja pelätkää Minua ˹ainoaa˺."}},{"verse":41,"commentary_en":"Building on the call to remember Allah's favors and fulfill the covenant, this verse specifically instructs the Children of Israel to believe in the revelation sent down to Prophet Muhammad. It points out that this new revelation confirms and aligns with the scriptures they already possess (like the Torah). They are urged not to be among the first to disbelieve in it. The verse warns against rejecting Allah's revelations for any worldly gain or trivial benefit, describing such gain as a \"small price\" when compared to the value of faith and obedience. It reiterates the command to fear only Allah, reinforcing the message of the previous verse.","commentary_fi":"Jatkamalla kehotusta muistaa Allahin suosionosoitukset ja täyttää liitto, tämä jae erityisesti ohjeistaa Israelin lapsia uskomaan profeetta Muhammadille lähetettyyn ilmoitukseen. Se huomauttaa, että tämä uusi ilmoitus vahvistaa ja vastaa heillä jo olevia kirjoituksia (kuten Tooraa). Heitä kehotetaan olemaan ensimmäisten joukossa, jotka eivät usko siihen. Jae varoittaa hylkäämästä Allahin merkkejä tai ilmoituksia minkään maallisen hyödyn tai vähäpätöisen edun vuoksi, kuvaten tällaista hyötyä \"pieneksi hinnaksi\" verrattuna uskon ja kuuliaisuuden arvoon. Se toistaa käskyn pelätä vain Allahia, vahvistaen edellisen jakeen viestiä.","arabic":"وَآمِنُوا بِمَا أَنْزَلْتُ مُصَدِّقًا لِمَا مَعَكُمْ وَلَا تَكُونُوا أَوَّلَ كَافِرٍ بِهِ ۖ وَلَا تَشْتَرُوا بِآيَاتِي ثَمَنًا قَلِيلًا وَإِيَّايَ فَاتَّقُونِ","commentary":"Jatkamalla kehotusta muistaa Allahin suosionosoitukset ja täyttää liitto, tämä jae erityisesti ohjeistaa Israelin lapsia uskomaan profeetta Muhammadille lähetettyyn ilmoitukseen. Se huomauttaa, että tämä uusi ilmoitus vahvistaa ja vastaa heillä jo olevia kirjoituksia (kuten Tooraa). Heitä kehotetaan olemaan ensimmäisten joukossa, jotka eivät usko siihen. Jae varoittaa hylkäämästä Allahin merkkejä tai ilmoituksia minkään maallisen hyödyn tai vähäpätöisen edun vuoksi, kuvaten tällaista hyötyä \"pieneksi hinnaksi\" verrattuna uskon ja kuuliaisuuden arvoon. Se toistaa käskyn pelätä vain Allahia, vahvistaen edellisen jakeen viestiä.","translations":{"opas":"ja uskokaa siihen, minkä olen ilmoittanut (Muhammedille), vahvistaen sillä ennestään teillä jo olevat Pyhät kirjoitukset; älkää olko ensimmäisiä epäuskossa älkääkä vaihtako Minun ilmoitustani mitättömiin arvoihin, vaan kunnioittaen peljätkää yksin Minua.","clear":"Uskokaa ilmoituksiini, jotka vahvistavat pyhät kirjoituksenne. Älkää olko ensimmäisiä kieltämässä niitä älkääkä vaihtako niitä ohimenevään hyötyyn. Ja olkaa tietoisia Minusta."}},{"verse":42,"commentary_en":"Following the command to believe in the revelation sent down to Prophet Muhammad, this verse addresses specific actions. It forbids deliberately mixing truth with falsehood, as this leads to confusion and distorts understanding. It also prohibits concealing the truth, especially when one is fully aware of it. This includes actions such as deliberately misinterpreting earlier scriptures or misleading others about the authenticity of the new revelation from Allah.","commentary_fi":"Tämän jakeen mukaan, sen jälkeen kun ihmisille on annettu käsky uskoa profeetta Muhammadin kautta lähetettyyn ilmestykseen, käsitellään tiettyjä tekoja. Jae kieltää totuuden ja valheen tahallisen sekoittamisen, sillä se aiheuttaa sekaannusta ja vääristää ymmärrystä. Lisäksi kielletään totuuden salaaminen, erityisesti silloin kun siihen liittyvä tieto on hyvin tiedossa. Tähän sisältyvät teot, kuten aiempien pyhien kirjojen tahallinen väärintulkinta tai muiden harhauttaminen koskien Allahin uuden ilmestyksen aitoutta.","arabic":"وَلَا تَلْبِسُوا الْحَقَّ بِالْبَاطِلِ وَتَكْتُمُوا الْحَقَّ وَأَنْتُمْ تَعْلَمُونَ","commentary":"Tämän jakeen mukaan, sen jälkeen kun ihmisille on annettu käsky uskoa profeetta Muhammadin kautta lähetettyyn ilmestykseen, käsitellään tiettyjä tekoja. Jae kieltää totuuden ja valheen tahallisen sekoittamisen, sillä se aiheuttaa sekaannusta ja vääristää ymmärrystä. Lisäksi kielletään totuuden salaaminen, erityisesti silloin kun siihen liittyvä tieto on hyvin tiedossa. Tähän sisältyvät teot, kuten aiempien pyhien kirjojen tahallinen väärintulkinta tai muiden harhauttaminen koskien Allahin uuden ilmestyksen aitoutta.","translations":{"opas":"Älkää verhotko totuutta valheella älkääkä salatko totuutta vastoin parempaa tietoanne,","clear":"Älkää sekoittako totuutta valheeseen älkääkä piilottako totuutta tietoisesti."}},{"verse":43,"commentary_en":"This verse invites the Children of Israel to engage in fundamental acts of worship and community life in Islam. It calls for establishing regular prayer (Salat) and giving purifying charity (Zakat - a form of obligatory regular charity), which are central pillars of Islamic practice. The command to \"bow down with those who bow down\" is an invitation to join the community of believers who submit to Allah in worship, encouraging unity and shared practice. This serves as a practical invitation to integrate into the Muslim community and its way of life. This verse introduces the acts of worship that followers of Allah's message undertake.","commentary_fi":"Tämä jae kutsuu Israelin lapsia osallistumaan perusmuotoisiin palvontatekoihin ja yhteisöelämään islamissa. Se kehottaa suorittamaan säännölliset rukoukset (Salat) ja antamaan puhdistavan almu (Zakat - pakollisena säännöllisenä almu), jotka ovat islamin keskeisiä pilareita. Käsky \"kumartaa niiden kanssa, jotka kumartavat\" on kutsu liittyä uskovien yhteisöön, jotka alistuvat Allahille palvonnassa, rohkaisten yhtenäisyyttä ja yhteistä käytäntöä. Tämä toimii käytännöllisenä kutsuna integroitua muslimiyhteisöön ja sen elämäntapaan. Tämä jae esittelee palvontateot, joihin Allahin sanoman seuraajat ryhtyvät.","arabic":"وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ","commentary":"Tämä jae kutsuu Israelin lapsia osallistumaan perusmuotoisiin palvontatekoihin ja yhteisöelämään islamissa. Se kehottaa suorittamaan säännölliset rukoukset (Salat) ja antamaan puhdistavan almu (Zakat - pakollisena säännöllisenä almu), jotka ovat islamin keskeisiä pilareita. Käsky \"kumartaa niiden kanssa, jotka kumartavat\" on kutsu liittyä uskovien yhteisöön, jotka alistuvat Allahille palvonnassa, rohkaisten yhtenäisyyttä ja yhteistä käytäntöä. Tämä toimii käytännöllisenä kutsuna integroitua muslimiyhteisöön ja sen elämäntapaan. Tämä jae esittelee palvontateot, joihin Allahin sanoman seuraajat ryhtyvät.","translations":{"opas":"vaan harjoittakaa rukoilemista, antakaa almuja ja kumartakaa yhdessä niiden kanssa, jotka Minua kumartavat.","clear":"Suorittakaa rukous, maksakaa almuvero ja kumartakaa yhdessä niiden kanssa, jotka kumartavat."}},{"verse":44,"commentary_en":"This verse transitions to a direct questioning of the Children of Israel's actions. It points out a potential inconsistency: instructing others towards righteous conduct while neglecting to practice it themselves, despite having their own scriptures that teach righteousness. This highlights the importance of aligning one's actions with one's words, particularly for those who have knowledge of religious teachings. It questions their understanding, suggesting that true understanding of scripture should lead to personal practice and consistency. This verse is a reflection on the responsibility that comes with knowledge and preaching.","commentary_fi":"Tämä jae siirtyy suoraan kyseenalaistamaan Israelin lasten tekoja. Se osoittaa mahdollisen ristiriidan: kehottaa muita oikeamieliseen käytökseen samalla kun laiminlyö sen noudattamisen itse, vaikka heillä on omat kirjoituksensa, jotka opettavat oikeamielisyyttä. Tämä korostaa sanojen ja tekojen yhdenmukaisuuden tärkeyttä, erityisesti niille, joilla on tietoa uskonnollisista opetuksista. Se kyseenalaistaa heidän ymmärryksensä, viitaten siihen, että kirjoitusten todellinen ymmärrys tulisi johtaa henkilökohtaiseen käytäntöön ja johdonmukaisuuteen. Tämä jae on pohdintaa tiedon ja saarnaamisen mukanaan tuomasta vastuusta.","arabic":"أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُمْ وَأَنْتُمْ تَتْلُونَ الْكِتَابَ ۚ أَفَلَا تَعْقِلُونَ","commentary":"Tämä jae siirtyy suoraan kyseenalaistamaan Israelin lasten tekoja. Se osoittaa mahdollisen ristiriidan: kehottaa muita oikeamieliseen käytökseen samalla kun laiminlyö sen noudattamisen itse, vaikka heillä on omat kirjoituksensa, jotka opettavat oikeamielisyyttä. Tämä korostaa sanojen ja tekojen yhdenmukaisuuden tärkeyttä, erityisesti niille, joilla on tietoa uskonnollisista opetuksista. Se kyseenalaistaa heidän ymmärryksensä, viitaten siihen, että kirjoitusten todellinen ymmärrys tulisi johtaa henkilökohtaiseen käytäntöön ja johdonmukaisuuteen. Tämä jae on pohdintaa tiedon ja saarnaamisen mukanaan tuomasta vastuusta.","translations":{"opas":"Kuinka te kehoittaisitte ihmisiä vanhurskauteen, itse unohtaessanne oman sielunne? Tehän tutkitte Pyhää kirjaa, eikö teillä ole ymmärrystä?","clear":"Saarnaatteko vanhurskautta ja jätätte sen itse harjoittamatta, vaikka luette Kirjoituksia? Ettekö ymmärrä?"}},{"verse":45,"commentary_en":"Recognizing the difficulty in aligning words and deeds, and perhaps the challenge of accepting the new message, this verse offers guidance on finding strength. It advises seeking help from Allah through patient perseverance (sabr) and prayer. These two are presented as essential tools for facing challenges and staying firm in faith. The verse acknowledges that this path can be difficult, but notes that it is made easier for those who possess a humble spirit and are truly devoted to Allah. This provides a way forward for those who might find the previous verses' calls challenging.","commentary_fi":"Tunnustaen sanojen ja tekojen yhdenmukaisuuden vaikeuden, ja ehkä uuden sanoman hyväksymisen haasteen, tämä jae tarjoaa ohjeita voiman löytämiseen. Se neuvoo etsimään apua Allahilta kärsivällisen sinnikkyyden (sabr) ja rukouksen avulla. Nämä kaksi esitetään olennaisina välineinä haasteisiin vastaamiseen ja uskon vahvana pitämiseen. Jae tunnustaa, että tämä polku voi olla vaikea, mutta toteaa, että se on helpompaa niille, joilla on nöyrä henki ja jotka ovat aidosti omistautuneet Allahille. Tämä tarjoaa tien eteenpäin niille, joille edellisten jakeiden kehotukset saattavat tuntua haastavilta.","arabic":"وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِينَ","commentary":"Tunnustaen sanojen ja tekojen yhdenmukaisuuden vaikeuden, ja ehkä uuden sanoman hyväksymisen haasteen, tämä jae tarjoaa ohjeita voiman löytämiseen. Se neuvoo etsimään apua Allahilta kärsivällisen sinnikkyyden (sabr) ja rukouksen avulla. Nämä kaksi esitetään olennaisina välineinä haasteisiin vastaamiseen ja uskon vahvana pitämiseen. Jae tunnustaa, että tämä polku voi olla vaikea, mutta toteaa, että se on helpompaa niille, joilla on nöyrä henki ja jotka ovat aidosti omistautuneet Allahille. Tämä tarjoaa tien eteenpäin niille, joille edellisten jakeiden kehotukset saattavat tuntua haastavilta.","translations":{"opas":"Etsikää apua kärsivällisyydestä ja rukouksesta. Tämä on totisesti vaikea tehtävä muille paitsi nöyräsydämisille,","clear":"Ja etsikää apua kärsivällisyyden ja rukouksen kautta. Totisesti, se on taakka paitsi nöyrille –"}},{"verse":46,"commentary_en":"This verse describes the characteristic of those who find strength in patience and prayer (mentioned in the previous verse). They are individuals who live with the certain knowledge that they will ultimately meet their Lord, Allah, and return to Him. This awareness of accountability in the hereafter provides perspective and motivation to endure hardships, remain patient, and turn to Allah in prayer. It connects the acts of worship and patience with the belief in the afterlife and judgment.","commentary_fi":"Tämä jae kuvaa niiden piirteitä, jotka löytävät voimaa kärsivällisyydestä ja rukouksesta (mainittu edellisessä jakeessa). He ovat yksilöitä, jotka elävät varmana tietoisuudesta, että he lopulta tapaavat Herransa, Allahin, ja palaavat Hänen luokseen. Tämä tietoisuus tuonpuoleisesta tilivelvollisuudesta antaa perspektiiviä ja motivaatiota kestää vaikeuksia, pysyä kärsivällisenä ja kääntyä Allahin puoleen rukouksessa. Se yhdistää palvonnan teot ja kärsivällisyyden uskoon tuonpuoleisessa elämässä ja tuomiossa.","arabic":"الَّذِينَ يَظُنُّونَ أَنَّهُمْ مُلَاقُو رَبِّهِمْ وَأَنَّهُمْ إِلَيْهِ رَاجِعُونَ","commentary":"Tämä jae kuvaa niiden piirteitä, jotka löytävät voimaa kärsivällisyydestä ja rukouksesta (mainittu edellisessä jakeessa). He ovat yksilöitä, jotka elävät varmana tietoisuudesta, että he lopulta tapaavat Herransa, Allahin, ja palaavat Hänen luokseen. Tämä tietoisuus tuonpuoleisesta tilivelvollisuudesta antaa perspektiiviä ja motivaatiota kestää vaikeuksia, pysyä kärsivällisenä ja kääntyä Allahin puoleen rukouksessa. Se yhdistää palvonnan teot ja kärsivällisyyden uskoon tuonpuoleisessa elämässä ja tuomiossa.","translations":{"opas":"jotka tietävät, että he kohtaavat Herransa ja että he palaavat Hänen luokseen.","clear":"niille, jotka ovat varmoja siitä, että he kohtaavat Herransa ja Hänen luokseen he palaavat."}},{"verse":47,"commentary_en":"Returning to a theme introduced in verse 40, this verse again addresses the Children of Israel and reminds them of the special favors Allah bestowed upon them. It explicitly mentions that, at a certain time, they were chosen and preferred by Allah to carry His message to humanity. This serves as a reminder of their historical privilege and responsibility, contrasting it with their attitude towards the new revelation. It sets the stage for recounting specific historical events where these favors were shown, which begins in the next verse.","commentary_fi":"Palaten jakeessa 40 esiteltyyn teemaan, tämä jae jälleen osoittaa sanansa Israelin lapsille ja muistuttaa heitä erityisistä suosionosoituksista, jotka Allah on heille suonut. Se mainitsee selvästi, että tiettynä aikana Allah valitsi ja suosi heitä kantamaan Hänen sanomansa ihmiskunnalle. Tämä toimii muistutuksena heidän historiallisesta etuoikeudestaan ja vastuustaan, vastakohtana heidän suhtautumiselleen uuteen ilmoitukseen. Se luo pohjan kertomukselle tietyistä historiallisista tapahtumista, joissa näitä suosionosoituksia osoitettiin, mikä alkaa seuraavassa jakeessa.","arabic":"يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَنِّي فَضَّلْتُكُمْ عَلَى الْعَالَمِينَ","commentary":"Palaten jakeessa 40 esiteltyyn teemaan, tämä jae jälleen osoittaa sanansa Israelin lapsille ja muistuttaa heitä erityisistä suosionosoituksista, jotka Allah on heille suonut. Se mainitsee selvästi, että tiettynä aikana Allah valitsi ja suosi heitä kantamaan Hänen sanomansa ihmiskunnalle. Tämä toimii muistutuksena heidän historiallisesta etuoikeudestaan ja vastuustaan, vastakohtana heidän suhtautumiselleen uuteen ilmoitukseen. Se luo pohjan kertomukselle tietyistä historiallisista tapahtumista, joissa näitä suosionosoituksia osoitettiin, mikä alkaa seuraavassa jakeessa.","translations":{"opas":"Israelilaiset! Muistakaa armoani, jota olen teille osoittanut, ja että olen suosinut teitä ja korottanut teidät yli kaikkien kansojen.","clear":"Oi Israelin lapset! Muistakaa ˹kaikki˺ ne suosionosoitukset, jotka Minä annoin teille ja kuinka Minä kunnioitin teitä enemmän kuin muita."}},{"verse":48,"commentary_en":"Following the reminder of past favors and the responsibility that came with them, this verse issues a solemn warning about the Day of Judgment. It stresses that on that day, no soul will be able to help another, intercession (seeking forgiveness or favor on behalf of another) will not be accepted, no ransom or compensation can be offered, and no external help will be available. This emphasizes individual accountability before Allah and highlights the critical importance of one's own faith and deeds in this life. It links the remembrance of Allah's past dealings with them to the ultimate consequence of their actions in the future.","commentary_fi":"Seuraten muistutusta menneistä suosionosoituksista ja niihin liittyvästä vastuusta, tämä jae antaa juhlallisen varoituksen tuomiopäivästä. Se korostaa, että sinä päivänä yksikään sielu ei voi auttaa toista, esirukous (jonkun toisen puolesta anteeksiantamuksen tai suosion pyytäminen) ei hyväksytä, lunastusta tai korvausta ei voi tarjota, eikä ulkopuolista apua ole saatavilla. Tämä korostaa yksilöllistä vastuuta Allahin edessä ja korostaa oman uskon ja tekojen kriittistä tärkeyttä tässä elämässä. Se yhdistää Allahin menneiden toimien muistamisen heidän tekojensa lopulliseen seuraukseen tulevaisuudessa.","arabic":"وَاتَّقُوا يَوْمًا لَا تَجْزِي نَفْسٌ عَنْ نَفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا شَفَاعَةٌ وَلَا يُؤْخَذُ مِنْهَا عَدْلٌ وَلَا هُمْ يُنْصَرُونَ","commentary":"Seuraten muistutusta menneistä suosionosoituksista ja niihin liittyvästä vastuusta, tämä jae antaa juhlallisen varoituksen tuomiopäivästä. Se korostaa, että sinä päivänä yksikään sielu ei voi auttaa toista, esirukous (jonkun toisen puolesta anteeksiantamuksen tai suosion pyytäminen) ei hyväksytä, lunastusta tai korvausta ei voi tarjota, eikä ulkopuolista apua ole saatavilla. Tämä korostaa yksilöllistä vastuuta Allahin edessä ja korostaa oman uskon ja tekojen kriittistä tärkeyttä tässä elämässä. Se yhdistää Allahin menneiden toimien muistamisen heidän tekojensa lopulliseen seuraukseen tulevaisuudessa.","translations":{"opas":"Ja varokaa sitä päivää, jolloin yksikään sielu ei voi suorittaa vähäisintäkään hyvitystä toisen puolesta, jolloin ei mitään välitystä hyväksytä eikä mitään lunnaita vastaanoteta, eikä kukaan saa toisen apua.","clear":"Varokaa sitä päivää, jolloin kukaan sielu ei ole avuksi toiselle. Mitään välitystä ei hyväksytä, mitään lunnaat eivät kelpaa, eikä apua anneta."}},{"verse":49,"commentary_en":"Beginning the enumeration of specific historical favors, this verse calls upon the Children of Israel to remember their deliverance from the tyrannical rule of Pharaoh and his people in Egypt. It vividly describes the severe suffering they endured under Pharaoh, including forced labor, harsh punishments, and the killing of their male children while sparing the females. The verse concludes by stating that this entire experience was a significant trial from Allah. This specific historical event serves as the first example in a series of reminders of Allah's grace and intervention in their history, setting the context for lessons drawn from their subsequent actions and reactions.","commentary_fi":"Aloittaen historiallisten suosionosoitusten luettelon, tämä jae kutsuu Israelin lapsia muistamaan pelastuksensa faraon ja hänen kansansa tyrannimaisesta hallinnosta Egyptissä. Se kuvailee elävästi heidän kärsimäänsä vakavaa tuskaa faraon alaisuudessa, mukaan lukien pakkotyön, ankarat rangaistukset ja heidän miespuolisten lastensa tappamisen naispuolisten säästämisen ohella. Jae päättyy toteamukseen, että koko tämä kokemus oli merkittävä koettelemus Allahilta. Tämä erityinen historiallinen tapahtuma toimii ensimmäisenä esimerkkinä sarjassa muistutuksia Allahin armosta ja puuttumisesta heidän historiaansa, luoden kontekstin opetuksille, jotka on johdettu heidän myöhemmistä teoistaan ja reaktioistaan.","arabic":"وَإِذْ نَجَّيْنَاكُمْ مِنْ آلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوءَ الْعَذَابِ يُذَبِّحُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ ۚ وَفِي ذَٰلِكُمْ بَلَاءٌ مِنْ رَبِّكُمْ عَظِيمٌ","commentary":"Aloittaen historiallisten suosionosoitusten luettelon, tämä jae kutsuu Israelin lapsia muistamaan pelastuksensa faraon ja hänen kansansa tyrannimaisesta hallinnosta Egyptissä. Se kuvailee elävästi heidän kärsimäänsä vakavaa tuskaa faraon alaisuudessa, mukaan lukien pakkotyön, ankarat rangaistukset ja heidän miespuolisten lastensa tappamisen naispuolisten säästämisen ohella. Jae päättyy toteamukseen, että koko tämä kokemus oli merkittävä koettelemus Allahilta. Tämä erityinen historiallinen tapahtuma toimii ensimmäisenä esimerkkinä sarjassa muistutuksia Allahin armosta ja puuttumisesta heidän historiaansa, luoden kontekstin opetuksille, jotka on johdettu heidän myöhemmistä teoistaan ja reaktioistaan.","translations":{"opas":"ja muistakaa, kuinka Me pelastimme teidät faraon kansan käsistä, egyptiläisten käsistä, jotka vaivasivat teitä julmilla rasituksilla, tappoivat poikanne ja antoivat vain tytärtenne elää. Tämä oli Herranne sallima kauhea koettelemus.","clear":"Muistakaa, kuinka Me pelastimme teidät faraon kansasta, joka ahdisti teitä kauhealla kidutuksella, teurastaen poikanne ja jättäen naisenne eloon. Se oli ankara koetus Herraltanne."}},{"verse":50,"commentary_en":"Picking up the narrative of the Israelites' journey, this verse recounts a major event: Allah's intervention to save them from the tyranny of Pharaoh. It reminds the audience of the dramatic moment when Allah caused the sea to part, creating a path for the Israelites to cross to safety, while the pursuing forces of Pharaoh were drowned before their eyes. This act is highlighted as a significant favor from Allah, a clear demonstration of His power and protection, immediately following a period of intense suffering and trial mentioned just before this verse. It emphasizes that their deliverance was a direct act of divine grace.","commentary_fi":"Jatkaen kertomusta israelilaisten matkasta, tämä jae kertoo suuresta tapahtumasta: Allahin väliintulosta pelastaakseen heidät faraon tyrannialta. Se muistuttaa lukijaa dramaattisesta hetkestä, jolloin Allah sai meren jakautumaan, luoden polun israelilaisille ylittää turvaan, kun taas faraon takaa-ajavat joukot hukkuivat heidän silmiensä edessä. Tämä teko korostetaan merkittävänä Allahin suosionosoituksena, selkeänä osoituksena Hänen voimastaan ja suojeluksestaan, välittömästi ennen tätä jaetta mainitun intensiivisen kärsimyksen ja koettelemuksen jälkeen. Se korostaa, että heidän vapautumisensa oli suora jumalallisen armon teko.","arabic":"وَإِذْ فَرَقْنَا بِكُمُ الْبَحْرَ فَأَنْجَيْنَاكُمْ وَأَغْرَقْنَا آلَ فِرْعَوْنَ وَأَنْتُمْ تَنْظُرُونَ","commentary":"Jatkaen kertomusta israelilaisten matkasta, tämä jae kertoo suuresta tapahtumasta: Allahin väliintulosta pelastaakseen heidät faraon tyrannialta. Se muistuttaa lukijaa dramaattisesta hetkestä, jolloin Allah sai meren jakautumaan, luoden polun israelilaisille ylittää turvaan, kun taas faraon takaa-ajavat joukot hukkuivat heidän silmiensä edessä. Tämä teko korostetaan merkittävänä Allahin suosionosoituksena, selkeänä osoituksena Hänen voimastaan ja suojeluksestaan, välittömästi ennen tätä jaetta mainitun intensiivisen kärsimyksen ja koettelemuksen jälkeen. Se korostaa, että heidän vapautumisensa oli suora jumalallisen armon teko.","translations":{"opas":"Entä kun Me jaoimme meren kahtia edessänne ja pelastimme teidät, mutta hukutimme faraon kansan silmienne nähden?","clear":"Ja muistakaa, kun Me erotimme meren, pelastimme teidät ja hukutimme faraon kansan silmienne edessä."}},{"verse":51,"commentary_en":"Following their miraculous rescue and having received such a great favor, the narrative shifts to illustrate the Israelites' immediate response. It recalls that while Prophet Moses was away for forty nights, having been appointed by Allah to receive divine guidance, his people turned to worship a golden calf. This action is described as a severe transgression considering they had just been saved from a people who were idolaters themselves. This verse highlights a rapid turn from deliverance to disobedience.","commentary_fi":"Seuraten heidän ihmeellistä pelastumistaan ja saamaansa suurta suosiota, kertomus siirtyy kuvaamaan israelilaisten välitöntä reaktiota. Se muistuttaa, että kun Profeetta Mooses oli poissa neljäkymmentä yötä, ollen Allahin nimittämä vastaanottamaan jumalallista ohjausta, hänen kansansa kääntyi palvomaan kultaista vasikkaa. Tätä tekoa kuvataan vakavana rikkomuksena kun ottaa huomioon, että heidät oli juuri pelastettu kansalta, joka itse oli epäjumalanpalvelijoita. Tämä jae korostaa nopeaa siirtymää pelastuksesta tottelemattomuuteen.","arabic":"وَإِذْ وَاعَدْنَا مُوسَىٰ أَرْبَعِينَ لَيْلَةً ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِنْ بَعْدِهِ وَأَنْتُمْ ظَالِمُونَ","commentary":"Seuraten heidän ihmeellistä pelastumistaan ja saamaansa suurta suosiota, kertomus siirtyy kuvaamaan israelilaisten välitöntä reaktiota. Se muistuttaa, että kun Profeetta Mooses oli poissa neljäkymmentä yötä, ollen Allahin nimittämä vastaanottamaan jumalallista ohjausta, hänen kansansa kääntyi palvomaan kultaista vasikkaa. Tätä tekoa kuvataan vakavana rikkomuksena kun ottaa huomioon, että heidät oli juuri pelastettu kansalta, joka itse oli epäjumalanpalvelijoita. Tämä jae korostaa nopeaa siirtymää pelastuksesta tottelemattomuuteen.","translations":{"opas":"Entä kun Me määräsimme Mooseksen viipymään edessämme neljäkymmentä vuorokautta, ja sillä aikaa kun hän oli poissa, te valitsitte (epäjumalaksenne) vasikan, koska olitte uppiniskaisia?","clear":"Ja muistakaa, kun Me määräsimme Moosekselle neljäkymmentä yötä, ja sitten te palvoitte vasikkaa hänen poissa ollessaan, toimien väärin."}},{"verse":52,"commentary_en":"Despite the worship of the calf mentioned in the previous verse, this verse emphasizes Allah's immense mercy. It states that even after such a grave act of polytheism, Allah forgave them. This forgiveness offered an opportunity to show gratitude for His grace, both in saving them from Pharaoh and pardoning their transgression. It illustrates a consistent pattern of divine forgiveness following human error, offering a chance for repentance and thankfulness.","commentary_fi":"Huolimatta edellisessä jakeessa mainitusta vasikanpalvonnasta, tämä jae korostaa Allahin suurta armollisuutta. Siinä todetaan, että jopa näin vakavan monijumalaisuuden teon jälkeen Allah antoi heille anteeksi. Tämä anteeksianto tarjosi heille mahdollisuuden osoittaa kiitollisuutta Hänen armostaan – sekä siitä, että Hän pelasti heidät faraolta että siitä, että Hän antoi heidän rikkomuksensa anteeksi. Tämä osoittaa jumalallisen anteeksiannon jatkuvan mallin ihmisen erehdyksen jälkeen ja tarjoaa mahdollisuuden katumukseen ja kiitollisuuteen.","arabic":"ثُمَّ عَفَوْنَا عَنْكُمْ مِنْ بَعْدِ ذَٰلِكَ لَعَلَّكُمْ تَشْكُرُونَ","commentary":"Huolimatta edellisessä jakeessa mainitusta vasikanpalvonnasta, tämä jae korostaa Allahin suurta armollisuutta. Siinä todetaan, että jopa näin vakavan monijumalaisuuden teon jälkeen Allah antoi heille anteeksi. Tämä anteeksianto tarjosi heille mahdollisuuden osoittaa kiitollisuutta Hänen armostaan – sekä siitä, että Hän pelasti heidät faraolta että siitä, että Hän antoi heidän rikkomuksensa anteeksi. Tämä osoittaa jumalallisen anteeksiannon jatkuvan mallin ihmisen erehdyksen jälkeen ja tarjoaa mahdollisuuden katumukseen ja kiitollisuuteen.","translations":{"opas":"Senkin jälkeen annoimme teille anteeksi, josta teidän olisi oltava kiitollisia.","clear":"Silloinkin Me annoimme teille anteeksi, jotta ehkä olisitte kiitollisia."}},{"verse":53,"commentary_en":"Continuing to recount Allah's favors upon the Israelites after the incident of the calf, this verse reminds them that Allah bestowed upon Prophet Moses the Scripture – the Torah – along with the Criterion, which serves to distinguish between right and wrong, truth and falsehood. This was given as a source of guidance for them. It highlights that receiving this divine law offered them a clear path to be rightly guided, presenting another opportunity for them to correct their ways and live according to Allah's commands following their pardon.","commentary_fi":"Jatkaen Allahin suosionosoitusten kertomista israelilaisille vasikatapauksen jälkeen, tämä jae muistuttaa, että Allah lahjoitti Profeetta Moosekselle Kirjoituksen – Tooran – sekä Kriteerin, joka erottaa oikean väärästä, totuuden valheesta. Tämä annettiin heille ohjauksen lähteeksi. Se korostaa, että jumalallisen lain vastaanottaminen tarjosi heille selkeän polun tulla oikein johdetuiksi, esittäen heille uuden mahdollisuuden korjata tapansa ja elää Allahin käskyjen mukaisesti anteeksiannon jälkeen.","arabic":"وَإِذْ آتَيْنَا مُوسَى الْكِتَابَ وَالْفُرْقَانَ لَعَلَّكُمْ تَهْتَدُونَ","commentary":"Jatkaen Allahin suosionosoitusten kertomista israelilaisille vasikatapauksen jälkeen, tämä jae muistuttaa, että Allah lahjoitti Profeetta Moosekselle Kirjoituksen – Tooran – sekä Kriteerin, joka erottaa oikean väärästä, totuuden valheesta. Tämä annettiin heille ohjauksen lähteeksi. Se korostaa, että jumalallisen lain vastaanottaminen tarjosi heille selkeän polun tulla oikein johdetuiksi, esittäen heille uuden mahdollisuuden korjata tapansa ja elää Allahin käskyjen mukaisesti anteeksiannon jälkeen.","translations":{"opas":"Entä silloin, kun annoimme Moosekselle Lain, jotta oppisitte hylkäämään pahan ja valitsemaan hyvän ja teidät ohjattaisiin oikeata tietä,","clear":"Ja muistakaa, kun Me annoimme Moosekselle Kirjoitukset – standardin erottamaan oikean väärästä – jotta ehkä olisitte (oikein) ohjattuja."}},{"verse":54,"commentary_en":"This verse describes Prophet Moses's address to his people after their calf worship, conveying Allah's command for repentance and purification. Moses tells them they have greatly harmed themselves through this act and instructs them to turn back to their Creator. The severe command to \"slay yourselves\" is understood as a stringent form of atonement, where those most responsible for the idolatry were to be executed by others within the community as a means of cleansing and purifying the whole group from the sin. This was a heavy responsibility, but necessary to preserve the community's purity. The verse concludes by stating that Allah accepted their repentance after this act, emphasizing that He is indeed the One who accepts repentance and is Most Merciful, reinforcing the theme of forgiveness mentioned earlier (Verse 52).","commentary_fi":"Tämä jae kuvaa Profeetta Mooseksen puhetta kansalleen vasikan palvonnan jälkeen, välittäen Allahin käskyn parannukseen ja puhdistukseen. Mooses kertoo heille, että he ovat vahingoittaneet itseään suuresti tällä teolla ja kehottaa heitä kääntymään takaisin Luojaansa. Vakava käsky \"tappakaa itsenne\" ymmärretään ankarana sovituksen muotona, jossa ne, jotka olivat eniten vastuussa epäjumalanpalveluksesta, teloitettiin muiden yhteisön jäsenten toimesta keinona puhdistaa koko ryhmä synnistä. Tämä oli raskas vastuu, mutta välttämätön yhteisön puhtauden säilyttämiseksi. Jae päättyy toteamukseen, että Allah hyväksyi heidän parannuksensa tämän teon jälkeen, korostaen, että Hän on todellakin Se, joka hyväksyy parannuksen ja on Kaikkein Armollisin, vahvistaen aiemmin mainittua anteeksiannon teemaa (jae 52).","arabic":"وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ يَا قَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنْفُسَكُمْ بِاتِّخَاذِكُمُ الْعِجْلَ فَتُوبُوا إِلَىٰ بَارِئِكُمْ فَاقْتُلُوا أَنْفُسَكُمْ ذَٰلِكُمْ خَيْرٌ لَكُمْ عِنْدَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ","commentary":"Tämä jae kuvaa Profeetta Mooseksen puhetta kansalleen vasikan palvonnan jälkeen, välittäen Allahin käskyn parannukseen ja puhdistukseen. Mooses kertoo heille, että he ovat vahingoittaneet itseään suuresti tällä teolla ja kehottaa heitä kääntymään takaisin Luojaansa. Vakava käsky \"tappakaa itsenne\" ymmärretään ankarana sovituksen muotona, jossa ne, jotka olivat eniten vastuussa epäjumalanpalveluksesta, teloitettiin muiden yhteisön jäsenten toimesta keinona puhdistaa koko ryhmä synnistä. Tämä oli raskas vastuu, mutta välttämätön yhteisön puhtauden säilyttämiseksi. Jae päättyy toteamukseen, että Allah hyväksyi heidän parannuksensa tämän teon jälkeen, korostaen, että Hän on todellakin Se, joka hyväksyy parannuksen ja on Kaikkein Armollisin, vahvistaen aiemmin mainittua anteeksiannon teemaa (jae 52).","translations":{"opas":"ja kun Mooses sanoi kansallensa: »Kansani, totisesti olette langenneet syntiin tekemällä itsellenne vasikan; kääntykää siis katuen Luojanne puoleen ja surmatkaa syylliset keskuudessanne. Siten on teidän parempi Luojanne edessä, ja Hän armahtaa teitä, Hän on totisesti armollinen ja laupias.»","clear":"Ja muistakaa, kun Mooses sanoi kansalleen: ”Oi kansani! Totisesti olette tehneet vääryyttä itsellenne palvomalla vasikkaa, joten kääntykää parannuksessa Luojanne puoleen ja teloittakaa (vasikanpalvojat keskuudessanne). Se on teille parasta Luojanne silmissä.” Sitten Hän hyväksyi parannuksenne. Totisesti Hän on Parannuksen Hyväksyjä, Armollisin."}},{"verse":55,"commentary_en":"Despite the forgiveness and guidance they received, the narrative highlights another instance of the Israelites' challenging nature. This verse recounts how a group among them made an audacious demand: they declared they would not believe unless they saw Allah directly with their own eyes. Such a demand reflects a deep lack of faith and understanding of Allah's nature. The consequence was that they were struck by a thunderbolt, as a direct response to their inappropriate request. This incident is presented as an example of their stubbornness and is linked to similar demands for impossible proofs made by some people towards Prophet Muhammad.","commentary_fi":"Huolimatta saamastaan anteeksiannosta ja ohjauksesta, kertomus korostaa uutta esimerkkiä israelilaisten haastavasta luonteesta. Tämä jae kertoo, kuinka joukko heistä esittivät röyhkeän vaatimuksen: he julistivat, että he eivät uskoisi, elleivät näkisi Allahia suoraan omin silmin. Tällainen vaatimus heijastaa syvää uskon puutetta ja ymmärrystä Allahin luonteesta. Seurauksena oli, että heihin iski ukkonen, suorana vastauksena heidän sopimattomaan pyyntöönsä. Tämä tapaus esitetään esimerkkinä heidän itsepäisyydestään ja linkittää sen samanlaisiin mahdottomien todisteiden vaatimuksiin, joita jotkut esittivät Profeetta Muhammadille.","arabic":"وَإِذْ قُلْتُمْ يَا مُوسَىٰ لَنْ نُؤْمِنَ لَكَ حَتَّىٰ نَرَى اللَّهَ جَهْرَةً فَأَخَذَتْكُمُ الصَّاعِقَةُ وَأَنْتُمْ تَنْظُرُونَ","commentary":"Huolimatta saamastaan anteeksiannosta ja ohjauksesta, kertomus korostaa uutta esimerkkiä israelilaisten haastavasta luonteesta. Tämä jae kertoo, kuinka joukko heistä esittivät röyhkeän vaatimuksen: he julistivat, että he eivät uskoisi, elleivät näkisi Allahia suoraan omin silmin. Tällainen vaatimus heijastaa syvää uskon puutetta ja ymmärrystä Allahin luonteesta. Seurauksena oli, että heihin iski ukkonen, suorana vastauksena heidän sopimattomaan pyyntöönsä. Tämä tapaus esitetään esimerkkinä heidän itsepäisyydestään ja linkittää sen samanlaisiin mahdottomien todisteiden vaatimuksiin, joita jotkut esittivät Profeetta Muhammadille.","translations":{"opas":"Entä kun te sanoitte: »Mooses, me emme usko sinua, ennenkuin silmillämme näemme Jumalan», ja taivaan tuli yllätti teidät tuijottaessanne,","clear":"Ja muistakaa, kun sanoitte: ”Oi Mooses! Emme koskaan usko sinua, ennen kuin näemme Allahin omin silmin”, joten salama iski teihin teidän katsellessanne."}},{"verse":56,"commentary_en":"Following the severe consequence of their demand to see Allah mentioned in the previous verse (55), this verse recounts Allah's continued mercy. It states that after being struck down by the thunderbolt, Allah brought them back to life. This act of revival after death was another profound sign of Allah's power and grace, offering them yet another opportunity to recognize His favors and be grateful for the life and chances He provided them.","commentary_fi":"Seurauksena edellisessä jakeessa (55) mainitulle vakavalle seuraamukselle heidän vaatimuksestaan nähdä Allah, tämä jae kertoo Allahin jatkuvasta armosta. Siinä todetaan, että salamaniskun seurauksena kuoleman kohdanneet tuotiin takaisin eloon Allahin toimesta. Tämä elvyttämisen teko oli jälleen yksi syvällinen osoitus Allahin voimasta ja armosta – ja tarjosi heille vielä yhden mahdollisuuden tunnistaa Hänen suosionosoituksensa ja olla kiitollisia elämästä ja niistä tilaisuuksista, jotka Hän heille antoi.","arabic":"ثُمَّ بَعَثْنَاكُمْ مِنْ بَعْدِ مَوْتِكُمْ لَعَلَّكُمْ تَشْكُرُونَ","commentary":"Seurauksena edellisessä jakeessa (55) mainitulle vakavalle seuraamukselle heidän vaatimuksestaan nähdä Allah, tämä jae kertoo Allahin jatkuvasta armosta. Siinä todetaan, että salamaniskun seurauksena kuoleman kohdanneet tuotiin takaisin eloon Allahin toimesta. Tämä elvyttämisen teko oli jälleen yksi syvällinen osoitus Allahin voimasta ja armosta – ja tarjosi heille vielä yhden mahdollisuuden tunnistaa Hänen suosionosoituksensa ja olla kiitollisia elämästä ja niistä tilaisuuksista, jotka Hän heille antoi.","translations":{"opas":"ja sitten Me sallimme salamanlyömien tointua eloon, jotta ehkä oppisitte olemaan kiitollisia.","clear":"Sitten Me herätimme teidät henkiin kuolemanne jälkeen, jotta ehkä olisitte kiitollisia."}},{"verse":57,"commentary_en":"This verse continues listing Allah’s favors upon the Israelites during their time in the wilderness after leaving Egypt. It recalls how Allah provided them with shade from clouds to protect them from the desert heat and sent down special sustenance: manna (a unique food) and quails. These were given as good things for them to eat—provisions from Allah’s bounty. Yet, despite these continued blessings, they showed no gratitude and acted rebelliously. The verse concludes by emphasizing that their actions did not harm Allah in any way; rather, they only harmed themselves. Their ingratitude and disobedience ultimately deprived them of further blessings and brought negative consequences upon them.","commentary_fi":"Tämä jae jatkaa Israelin kansalle annettujen Allahin suosionosoitusten luettelemista heidän vaelluksensa aikana erämaassa Egyptistä lähdön jälkeen. Siinä muistutetaan, kuinka Allah antoi heille pilvistä varjoa suojaksi aavikon kuumuutta vastaan ja lähetti heille erityistä ravintoa: mannaa (ainutlaatuista ruokaa) ja viiriäisiä. Nämä annettiin heille hyvänä ravintona – suoraan Allahin anteliaisuudesta. Siitä huolimatta, että he saivat jatkuvasti näitä siunauksia, he eivät osoittaneet kiitollisuutta vaan käyttäytyivät kapinallisesti. Jae päättyy toteamukseen, ettei heidän toimintansa vahingoittanut Allahia millään tavalla – sen sijaan he vahingoittivat vain itseään. Kiittämättömyys ja tottelemattomuus riistivät heiltä lisäsiunaukset ja toivat mukanaan kielteisiä seurauksia.","arabic":"وَظَلَّلْنَا عَلَيْكُمُ الْغَمَامَ وَأَنْزَلْنَا عَلَيْكُمُ الْمَنَّ وَالسَّلْوَىٰ ۖ كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ ۖ وَمَا ظَلَمُونَا وَلَٰكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ","commentary":"Tämä jae jatkaa Israelin kansalle annettujen Allahin suosionosoitusten luettelemista heidän vaelluksensa aikana erämaassa Egyptistä lähdön jälkeen. Siinä muistutetaan, kuinka Allah antoi heille pilvistä varjoa suojaksi aavikon kuumuutta vastaan ja lähetti heille erityistä ravintoa: mannaa (ainutlaatuista ruokaa) ja viiriäisiä. Nämä annettiin heille hyvänä ravintona – suoraan Allahin anteliaisuudesta. Siitä huolimatta, että he saivat jatkuvasti näitä siunauksia, he eivät osoittaneet kiitollisuutta vaan käyttäytyivät kapinallisesti. Jae päättyy toteamukseen, ettei heidän toimintansa vahingoittanut Allahia millään tavalla – sen sijaan he vahingoittivat vain itseään. Kiittämättömyys ja tottelemattomuus riistivät heiltä lisäsiunaukset ja toivat mukanaan kielteisiä seurauksia.","translations":{"opas":"Ja Me levitimme suojaksenne pilven ja lähetimme teille mannaa ja viiriäisiä. »Syökää sitä hyvää, mitä olemme teille suoneet.» Eivät israelilaiset synnillänsä Meitä vahingoittaneet vaan itseänsä.","clear":"Ja muistakaa, kun varjoitimme teitä pilvillä ja lähetimme alas teille mannaa ja viiriäisiä, (sanoen): ”Syökää hyvistä asioista, joita olemme teille antaneet.” Pahantekijät (todellakin) eivät tehneet vääryyttä Meille, vaan tekivät vääryyttä itselleen."}},{"verse":58,"commentary_en":"The narrative moves forward to another command given to the Israelites. They were instructed to enter a specific town (often understood to be Jerusalem), a place of plenty, and were told they could eat from its abundance as they desired. However, this entry came with specific instructions: they were to enter the gate with humility, showing submission in their physical posture and their spoken words. By doing so, Allah promised to forgive their sins and increase the reward for those among them who performed good deeds. This verse presents another opportunity for the Israelites to show obedience and humility and receive Allah's forgiveness and bounty.","commentary_fi":"Kertomus etenee toiseen israelilaisille annettuun käskyyn. Heidät ohdettiin menemään tiettyyn kaupunkiin (usein ymmärretty Jerusalemiksi), paikkaan, jossa on runsaasti, ja heille sanottiin, että he saavat syödä sen yltäkylläisyydestä mielensä mukaan. Kuitenkin tämä sisäänpääsy tuli tiettyjen ohjeiden kanssa: heidän oli mentävä portista sisään nöyrästi, osoittaen alistumista fyysisessä asennossaan ja puhutuissa sanoissaan. Tekemällä niin, Allah lupasi antaa heidän virheensä anteeksi ja lisätä niiden osuutta, jotka tekivät hyvää. Tämä jae esittää uuden mahdollisuuden israelilaisille osoittaa tottelevaisuutta ja nöyryyttä ja vastaanottaa Allahin anteeksiannon ja runsauden.","arabic":"وَإِذْ قُلْنَا ادْخُلُوا هَٰذِهِ الْقَرْيَةَ فَكُلُوا مِنْهَا حَيْثُ شِئْتُمْ رَغَدًا وَادْخُلُوا الْبَابَ سُجَّدًا وَقُولُوا حِطَّةٌ نَغْفِرْ لَكُمْ خَطَايَاكُمْ ۚ وَسَنَزِيدُ الْمُحْسِنِينَ","commentary":"Kertomus etenee toiseen israelilaisille annettuun käskyyn. Heidät ohdettiin menemään tiettyyn kaupunkiin (usein ymmärretty Jerusalemiksi), paikkaan, jossa on runsaasti, ja heille sanottiin, että he saavat syödä sen yltäkylläisyydestä mielensä mukaan. Kuitenkin tämä sisäänpääsy tuli tiettyjen ohjeiden kanssa: heidän oli mentävä portista sisään nöyrästi, osoittaen alistumista fyysisessä asennossaan ja puhutuissa sanoissaan. Tekemällä niin, Allah lupasi antaa heidän virheensä anteeksi ja lisätä niiden osuutta, jotka tekivät hyvää. Tämä jae esittää uuden mahdollisuuden israelilaisille osoittaa tottelevaisuutta ja nöyryyttä ja vastaanottaa Allahin anteeksiannon ja runsauden.","translations":{"opas":"Entä kun Me sanoimme: »Astukaa tähän kaupunkiin ja nauttikaa runsaasti löytämäänne ravintoa»? Astukaa sisään portista kumartaen nöyrästi ja sanokaa: » (Synti) taakkamme lievennettäköön!» jotta antaisimme teille synnit anteeksi ja siunaisimme niitä, jotka tekevät hyvää.","clear":"Ja muistakaa, kun Me sanoimme: ”Menkää tähän kaupunkiin ja syökää vapaasti, mistä tahansa haluattekin; menkää portista nöyrinä sanoen: ’Anna meille anteeksi.’ Me annamme syntinne anteeksi ja moninkertaistamme hyvää tekevien palkkion.”"}},{"verse":59,"commentary_en":"This verse recounts the consequence of the Israelites' disobedience to the command given in the previous verse (58). Instead of following the instructions to enter the town with humility and speaking the words they were commanded, the wrongdoers among them deliberately substituted the words. Because of this transgression and their repeated defiance of Allah's commands, Allah sent a plague from the heavens upon the wrongdoers as a punishment. This highlights the serious outcome of willful disobedience and altering Allah's instructions.","commentary_fi":"Tämä jae kertoo israelilaisten tottelemattomuuden seurauksesta edellisessä jakeessa annettuun käskyyn (jae 58). Sen sijaan, että he olisivat noudattaneet ohjeita (mennä sisään nöyrästi ja puhua tietyt sanat), väärintekijät heidän joukossaan tarkoituksellisesti vaihtoivat sanat. Tämän rikkomuksen ja heidän toistuvien Allahin käskyjen uhmaamisen vuoksi, Allah lähetti taivaasta vitsauksen väärintekijöiden ylle rangaistukseksi. Tämä korostaa tahallisen tottelemattomuuden ja Allahin ohjeiden muuttamisen vakavaa seurausta.","arabic":"فَبَدَّلَ الَّذِينَ ظَلَمُوا قَوْلًا غَيْرَ الَّذِي قِيلَ لَهُمْ فَأَنْزَلْنَا عَلَى الَّذِينَ ظَلَمُوا رِجْزًا مِنَ السَّمَاءِ بِمَا كَانُوا يَفْسُقُونَ","commentary":"Tämä jae kertoo israelilaisten tottelemattomuuden seurauksesta edellisessä jakeessa annettuun käskyyn (jae 58). Sen sijaan, että he olisivat noudattaneet ohjeita (mennä sisään nöyrästi ja puhua tietyt sanat), väärintekijät heidän joukossaan tarkoituksellisesti vaihtoivat sanat. Tämän rikkomuksen ja heidän toistuvien Allahin käskyjen uhmaamisen vuoksi, Allah lähetti taivaasta vitsauksen väärintekijöiden ylle rangaistukseksi. Tämä korostaa tahallisen tottelemattomuuden ja Allahin ohjeiden muuttamisen vakavaa seurausta.","translations":{"opas":"Mutta ne,jotka rikkoivat (Jumalan käskyn), vaihtoivat tämän sanan toiseen, kuin mikä oli sanottu heille, ja näille me lähetimme rangaistuksen taivaasta, koska he olivat uppiniskaisia.","clear":"Mutta väärintekijät muuttivat sanoja, jotka heille oli käsketty sanoa. Niinpä Me lähetimme heidän ylleen taivaista rangaistuksen heidän uppiniskaisuutensa tähden."}},{"verse":60,"commentary_en":"This verse recounts a specific event when the Israelites needed water. Prophet Moses prayed to Allah on their behalf, and in response, Allah instructed him to strike a rock with his staff. When he did, twelve springs gushed out—one for each tribe, ensuring everyone had access to water. This is presented as an act of Allah's grace. After this provision, they were instructed to enjoy the sustenance Allah had provided, but were warned against spreading corruption on the earth. This highlights Allah's power to provide and His command for responsible behavior.","commentary_fi":"Tässä jakeessa kerrotaan erityinen tilanne, jolloin israelilaiset tarvitsivat vettä. Profeetta Mooses rukoili Allahilta heidän puolestaan, ja vastauksena Allah käski häntä iskeä sauvallaan kiveä. Kun hän teki niin, kaksitoista lähdettä suihkusi kivestä – yksi jokaiselle heimolle – varmistaen, että kaikilla oli pääsy veteen. Tämä esitetään Allahin armona. Tämän ravinnon jälkeen heille annettiin ohjeet nauttia Allahin antamasta elatuksesta, mutta heitä varoitettiin levittämästä turmelusta maassa. Tämä korostaa Allahin kykyä antaa elatusta ja Hänen käskyään vastuulliselle käytökselle.","arabic":"وَإِذِ اسْتَسْقَىٰ مُوسَىٰ لِقَوْمِهِ فَقُلْنَا اضْرِبْ بِعَصَاكَ الْحَجَرَ ۖ فَانْفَجَرَتْ مِنْهُ اثْنَتَا عَشْرَةَ عَيْنًا ۖ قَدْ عَلِمَ كُلُّ أُنَاسٍ مَشْرَبَهُمْ ۖ كُلُوا وَاشْرَبُوا مِنْ رِزْقِ اللَّهِ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ","commentary":"Tässä jakeessa kerrotaan erityinen tilanne, jolloin israelilaiset tarvitsivat vettä. Profeetta Mooses rukoili Allahilta heidän puolestaan, ja vastauksena Allah käski häntä iskeä sauvallaan kiveä. Kun hän teki niin, kaksitoista lähdettä suihkusi kivestä – yksi jokaiselle heimolle – varmistaen, että kaikilla oli pääsy veteen. Tämä esitetään Allahin armona. Tämän ravinnon jälkeen heille annettiin ohjeet nauttia Allahin antamasta elatuksesta, mutta heitä varoitettiin levittämästä turmelusta maassa. Tämä korostaa Allahin kykyä antaa elatusta ja Hänen käskyään vastuulliselle käytökselle.","translations":{"opas":"Entä kun Mooses pyysi vettä janoiselle kansalleen, ja Me sanoimme: »Lyö sauvallasi kallioon!» ja kaksitoista lähdettä pulppusi kivestä, niin että joka sukukunta tiesi juomapaikkansa? »Syökää ja juokaa Jumalan antimista, älkääkä kavalasti saako aikaan pahennusta maan päällä.»","clear":"Ja muistakaa, kun Mooses rukoili vettä kansalleen, Me sanoimme: ”Lyö kallioon sauvallasi.” Silloin 12 lähdettä pulppusi esiin, ja jokainen heimo tiesi juomapaikkansa. ˹Sitten sanoimme˺: ”Syökää ja juokaa Jumalan antimista älkääkä kulkeko levittämässä turmelusta maan päällä.”"}},{"verse":61,"commentary_en":"Following the account of receiving water, this verse describes another interaction. Despite being provided with food like manna and quails in the desert, the people grew tired of it and asked Prophet Moses to pray to Allah for more variety, specifically asking for vegetables like cucumbers, garlic, lentils, and onions. Prophet Moses responded by pointing out that they were asking to trade something superior (the specially provided food) for something common and readily available in towns. This incident, along with their history of rejecting Allah's signs, killing prophets, and disobeying commands, led to them incurring humiliation, misery, and Allah's wrath. This verse contrasts Allah's continuous provision with the people's ingratitude and demanding attitude.","commentary_fi":"Veden saannin kertomuksen jälkeen tämä jae kuvaa toista vuorovaikutusta. Vaikka heille oli tarjottu ruokaa, kuten mannaa ja viiriäisiä aavikolla, kansa kyllästyi siihen ja pyysi profeetta Moosekselta rukoilemaan Allahia monipuolisemman ruoan puolesta, pyytäen erityisesti vihanneksia, kuten kurkkuja, valkosipulia, linssejä ja sipuleita. Profeetta Mooses vastasi huomauttamalla, että he pyytävät vaihtamaan jotain ylivoimaista (erityisesti tarjotun ruoan) johonkin yleiseen ja kaupungeissa helposti saatavilla olevaan. Tämä tapaus, yhdessä heidän historiansa kanssa Allahin merkkien kieltämisestä, profeettojen tappamisesta ja käskyjen tottelemattomuudesta, johti heidät kohtaamaan nöyryytyksen, kurjuuden ja Allahin vihan. Tämä jae asettaa vastakkain Allahin jatkuvan varustuksen ja kansan kiittämättömyyden ja vaativan asenteen.","arabic":"وَإِذْ قُلْتُمْ يَا مُوسَىٰ لَنْ نَصْبِرَ عَلَىٰ طَعَامٍ وَاحِدٍ فَادْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنْبِتُ الْأَرْضُ مِنْ بَقْلِهَا وَقِثَّائِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا ۖ قَالَ أَتَسْتَبْدِلُونَ الَّذِي هُوَ أَدْنَىٰ بِالَّذِي هُوَ خَيْرٌ ۚ اهْبِطُوا مِصْرًا فَإِنَّ لَكُمْ مَا سَأَلْتُمْ ۗ وَضُرِبَتْ عَلَيْهِمُ الذِّلَّةُ وَالْمَسْكَنَةُ وَبَاءُوا بِغَضَبٍ مِنَ اللَّهِ ۗ ذَٰلِكَ بِأَنَّهُمْ كَانُوا يَكْفُرُونَ بِآيَاتِ اللَّهِ وَيَقْتُلُونَ النَّبِيِّينَ بِغَيْرِ الْحَقِّ ۗ ذَٰلِكَ بِمَا عَصَوْا وَكَانُوا يَعْتَدُونَ","commentary":"Veden saannin kertomuksen jälkeen tämä jae kuvaa toista vuorovaikutusta. Vaikka heille oli tarjottu ruokaa, kuten mannaa ja viiriäisiä aavikolla, kansa kyllästyi siihen ja pyysi profeetta Moosekselta rukoilemaan Allahia monipuolisemman ruoan puolesta, pyytäen erityisesti vihanneksia, kuten kurkkuja, valkosipulia, linssejä ja sipuleita. Profeetta Mooses vastasi huomauttamalla, että he pyytävät vaihtamaan jotain ylivoimaista (erityisesti tarjotun ruoan) johonkin yleiseen ja kaupungeissa helposti saatavilla olevaan. Tämä tapaus, yhdessä heidän historiansa kanssa Allahin merkkien kieltämisestä, profeettojen tappamisesta ja käskyjen tottelemattomuudesta, johti heidät kohtaamaan nöyryytyksen, kurjuuden ja Allahin vihan. Tämä jae asettaa vastakkain Allahin jatkuvan varustuksen ja kansan kiittämättömyyden ja vaativan asenteen.","translations":{"opas":"Entä kun te sanoitte: »Mooses, me emme jaksa syödä aina samaa ravintoa; huuda siksi Herraasi puolestamme, että hän anaisi meille, mitä maa kasvaa, kuten vihanneksia, kurkkuja, leipäviljaa, herneitä ja punasipulia»? Hän vastasi: »Haluatteko saada huonompaa paremman sijasta? Menkää alas Egyptiin, siellä voitte saada mitä haluatte.» Viheliäisyys ja kurjuus kasaantuivat heidän päällensä, ja he joutuivat Jumalan vihan alaisiksi. Tämä tapahtui siksi, että he kielsivät Jumalan ilmoituksen ja vääryydessään surmasivat profeetat; siksi että he olivat tottelemattomia ja kapinallisia.","clear":"Ja muistakaa, kun te sanoitte: ”Oi Mooses! Me emme kestä samaa ateriaa ˹joka päivä˺. Kutsu siis Herrasi meidän puolestamme, Hän tuokoon meille jotain siitä, mitä maa tuottaa: yrttejä, kurkkuja, valkosipulia, linssejä ja sipuleita.” Mooses moitti ˹heitä˺: ”Vaihdattako te paremman huonompaan? ˹Voitte˺ mennä mihin tahansa kylään, niin löydätte sen, mitä olette pyytäneet.” Heidät lyötiin häpeällä ja kurjuudella, ja he kutsuivat ylleen Jumalan tyytymättömyyden hylättyään Jumalan merkit ja surmaten profeettoja väärin perustein. Tämä on ˹oikeudenmukainen palkkio˺ heidän tottelemattomuudestaan ja rikkomuksistaan."}},{"verse":62,"commentary_en":"This verse marks a shift from recounting specific historical events to emphasizing a core principle in Islam regarding salvation. It challenges the assumption—held by some among the Children of Israel—that salvation is guaranteed solely by belonging to a particular group. They believed that their identity ensured a special and exclusive relationship with God, regardless of personal belief or conduct. The verse corrects this notion by affirming that what truly matters before Allah is sincere faith and righteous actions, not mere affiliation or labels. Salvation is accessible to all who believe in Allah, the Last Day, and do good deeds—whether they follow the Qur'an or earlier revelations, including the Jews, Christians, or Sabians. It underscores that Allah judges individuals based on merit, not on formal religious identity. Those who meet these conditions will be rewarded and will have no fear or sorrow in the Hereafter. This message stands in contrast to the previous verses, which outlined the consequences of disobedience during the time of Prophet Moses.","commentary_fi":"Tämä jae merkitsee siirtymää historiallisten tapahtumien kertomisesta islamin keskeisen pelastusta koskevan periaatteen esille tuomiseen. Se kyseenalaistaa oletuksen – jota jotkut israelilaiset pitivät totena – että pelastus olisi taattu pelkästään kuulumalla tiettyyn ryhmään. He uskoivat, että heidän identiteettinsä takasi erityisen ja yksinoikeutetun suhteen Jumalaan, riippumatta henkilökohtaisesta uskosta tai teoista. Jaessa korjataan tämä käsitys ja korostetaan, että Jumalan silmissä ratkaisevaa on vilpitön usko ja hyvät teot – ei pelkkä kuuluminen johonkin uskonnolliseen yhteisöön tai nimellinen identiteetti. Pelastus on avoin kaikille, jotka uskovat Allahiin, Viimeiseen päivään ja tekevät hyviä tekoja – olipa kyseessä Koraanin seuraajat tai aiempien ilmoitusten seuraajat, kuten juutalaiset, kristityt tai sabiilaiset. Jaessa painotetaan, että Allah tuomitsee ihmiset yksilöllisten ansioiden perusteella, ei uskonnollisen nimikkeen mukaan. Ne, jotka täyttävät nämä ehdot, saavat palkkionsa Allahilta, eikä heidän tarvitse pelätä tai surra tuonpuoleisessa. Tämä viesti on ristiriidassa edellisten jakeiden kanssa, joissa korostettiin Mooseksen ajan tottelemattomuuden seurauksia.","arabic":"إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالنَّصَارَىٰ وَالصَّابِئِينَ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَعَمِلَ صَالِحًا فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","commentary":"Tämä jae merkitsee siirtymää historiallisten tapahtumien kertomisesta islamin keskeisen pelastusta koskevan periaatteen esille tuomiseen. Se kyseenalaistaa oletuksen – jota jotkut israelilaiset pitivät totena – että pelastus olisi taattu pelkästään kuulumalla tiettyyn ryhmään. He uskoivat, että heidän identiteettinsä takasi erityisen ja yksinoikeutetun suhteen Jumalaan, riippumatta henkilökohtaisesta uskosta tai teoista. Jaessa korjataan tämä käsitys ja korostetaan, että Jumalan silmissä ratkaisevaa on vilpitön usko ja hyvät teot – ei pelkkä kuuluminen johonkin uskonnolliseen yhteisöön tai nimellinen identiteetti. Pelastus on avoin kaikille, jotka uskovat Allahiin, Viimeiseen päivään ja tekevät hyviä tekoja – olipa kyseessä Koraanin seuraajat tai aiempien ilmoitusten seuraajat, kuten juutalaiset, kristityt tai sabiilaiset. Jaessa painotetaan, että Allah tuomitsee ihmiset yksilöllisten ansioiden perusteella, ei uskonnollisen nimikkeen mukaan. Ne, jotka täyttävät nämä ehdot, saavat palkkionsa Allahilta, eikä heidän tarvitse pelätä tai surra tuonpuoleisessa. Tämä viesti on ristiriidassa edellisten jakeiden kanssa, joissa korostettiin Mooseksen ajan tottelemattomuuden seurauksia.","translations":{"opas":"(Koraaniin) uskovat ja myöskin ne jotka ovat juutalaisia, kristittyjä, saabalaisia, jos he uskovat Jumalaan ja Viimeiseen päivään ja elävät hurskaasti, saavat totisesti palkkansa Herransa luona; ei mikään pelko valtaa heitä, eikä heidän tarvitse murehtia.","clear":"Totisesti, uskovaiset, juutalaiset, kristityt ja saabilaiset – jotka ˹todella˺ uskovat Allahiin ja Viimeiseen päivään ja tekevät hyvää, saavat palkintonsa Herransa luona. Eikä heidän tarvitse pelätä, eivätkä he murehdi."}},{"verse":63,"commentary_en":"Returning to historical accounts, this verse reminds the people of Prophet Moses about the solemn covenant Allah made with them. It mentions that Allah raised Mount Sinai above them as this covenant was given, an image emphasizing the seriousness and weight of the agreement. The command given was to hold firmly to what Allah had revealed (the Torah) and to constantly remember its contents, so that they might become God-fearing. This highlights the importance of commitment and remembrance in upholding one's pledge to Allah.","commentary_fi":"Ja muistakaa, että Me otimme teiltä liiton ja kohotimme yläpuolellanne Siinain vuoren (tornimainen korkeus): (Sanoen): \"Pitäkää lujasti kiinni siitä, minkä Me olemme antaneet teille, ja muistakaa aina, mitä siinä on: ehkä te pelkäätte Allahia.\"","arabic":"وَإِذْ أَخَذْنَا مِيثَاقَكُمْ وَرَفَعْنَا فَوْقَكُمُ الطُّورَ خُذُوا مَا آتَيْنَاكُمْ بِقُوَّةٍ وَاذْكُرُوا مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ","commentary":"Ja muistakaa, että Me otimme teiltä liiton ja kohotimme yläpuolellanne Siinain vuoren (tornimainen korkeus): (Sanoen): \"Pitäkää lujasti kiinni siitä, minkä Me olemme antaneet teille, ja muistakaa aina, mitä siinä on: ehkä te pelkäätte Allahia.\"","translations":{"opas":"Muistakaa, kuinka Me teimme liiton kanssanne (Siinain) vuoren kohotessa ylitsenne ja sanoimme: »Pitäkää lujasti kiinni siitä, minkä olemme antanut teille, ja muistakaa mitä se sisältää, jotta karttaisitte pahaa.»","clear":"Ja ˹muistakaa˺, kun teimme liiton kanssanne ja nostimme vuoren yllenne ˹sanoen˺: ”Pitäkää lujasti kiinni siitä ˹Kirjoituksesta˺, jonka olemme teille antaneet, ja noudattakaa sen opetuksia, jotta ehkä tulisitte tietoisiksi ˹Allahista˺.”"}},{"verse":64,"commentary_en":"Following the reminder of the solemn covenant in the previous verse, this verse states that despite the gravity of the pledge and the command to hold firmly to it, they turned away from it afterwards. Had it not been for Allah's grace and mercy towards them, they would have been among those who are ruined or lost. This emphasizes Allah's immense mercy.","commentary_fi":"Seuraten muistutusta juhlallisesta liitosta edellisessä jakeessa, tämä jae toteaa, että liiton vakavuudesta ja käskystä pitää siitä lujasti kiinni huolimatta he kääntyivät pois siitä jälkikäteen. Kommentaari huomauttaa, että heidän kääntymisensä pois oli merkittävää, ja ellei Allahin armo ja laupeus olisi ollut heitä kohtaan, he olisivat varmasti olleet tuhoutuneiden tai kadotettujen joukossa. Tämä korostaa Allahin valtavaa laupeutta.","arabic":"ثُمَّ تَوَلَّيْتُمْ مِنْ بَعْدِ ذَٰلِكَ ۖ فَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ لَكُنْتُمْ مِنَ الْخَاسِرِينَ","commentary":"Seuraten muistutusta juhlallisesta liitosta edellisessä jakeessa, tämä jae toteaa, että liiton vakavuudesta ja käskystä pitää siitä lujasti kiinni huolimatta he kääntyivät pois siitä jälkikäteen. Kommentaari huomauttaa, että heidän kääntymisensä pois oli merkittävää, ja ellei Allahin armo ja laupeus olisi ollut heitä kohtaan, he olisivat varmasti olleet tuhoutuneiden tai kadotettujen joukossa. Tämä korostaa Allahin valtavaa laupeutta.","translations":{"opas":"Tämänkin jälkeen te käännyitte pois, ja ilman Jumalan armoa ja laupeutta olisitte joutuneet kadotettujen joukkoon.","clear":"Silti te käännyitte pois sen jälkeen. Jos Allahin armoa ja laupeutta ei olisi ollut yllänne, olisitte varmasti olleet häviäjiä."}},{"verse":65,"commentary_en":"This verse recounts another act of disobedience, focusing on the violation of the Sabbath. Allah had designated Saturday as a day of rest for them, during which they were not permitted to work for their livelihood. As a test, fish would appear in abundance specifically on the Sabbath but not on other days. Motivated by greed, some among them devised ways to circumvent the command—setting traps on the Sabbath and collecting the fish afterward. As a consequence of this transgression, Allah described them as being turned into \"despicable apes.\" Some scholars interpret this as a metaphorical transformation, indicating a moral and spiritual degradation due to their lack of self-discipline and defiance, rather than a literal physical change. This illustrates how their behavior led to their own debasement.","commentary_fi":"Tämä jae kuvaa toista tottelemattomuuden tapausta, joka liittyy sapattikäskyn rikkomiseen. Allah oli määrännyt lauantain lepopäiväksi, jolloin heidän ei sallittu tehdä työtä toimeentulonsa eteen. Koetukseksi kalat ilmestyivät runsaasti juuri sapatin aikana, mutta eivät muina päivinä. Ahneuden ajamina jotkut heistä yrittivät kiertää käskyä – he virittivät pyydyksiä sapatin aikana ja keräsivät kalat vasta myöhemmin. Tämän rikkomuksen seurauksena Allah kuvasi heidät muuttuneiksi \"halveksituiksi apinoiksi\". Osa oppineista tulkitsee tämän kuvaannolliseksi muutokseksi, joka viittaa moraaliseen ja hengelliseen rappeutumiseen itsehillinnän puutteen ja uhmakkuuden seurauksena, eikä välttämättä fyysiseen muutokseen. Tämä osoittaa, kuinka heidän käytöksensä johti heidän omaan alennustilaansa.","arabic":"وَلَقَدْ عَلِمْتُمُ الَّذِينَ اعْتَدَوْا مِنْكُمْ فِي السَّبْتِ فَقُلْنَا لَهُمْ كُونُوا قِرَدَةً خَاسِئِينَ","commentary":"Tämä jae kuvaa toista tottelemattomuuden tapausta, joka liittyy sapattikäskyn rikkomiseen. Allah oli määrännyt lauantain lepopäiväksi, jolloin heidän ei sallittu tehdä työtä toimeentulonsa eteen. Koetukseksi kalat ilmestyivät runsaasti juuri sapatin aikana, mutta eivät muina päivinä. Ahneuden ajamina jotkut heistä yrittivät kiertää käskyä – he virittivät pyydyksiä sapatin aikana ja keräsivät kalat vasta myöhemmin. Tämän rikkomuksen seurauksena Allah kuvasi heidät muuttuneiksi \"halveksituiksi apinoiksi\". Osa oppineista tulkitsee tämän kuvaannolliseksi muutokseksi, joka viittaa moraaliseen ja hengelliseen rappeutumiseen itsehillinnän puutteen ja uhmakkuuden seurauksena, eikä välttämättä fyysiseen muutokseen. Tämä osoittaa, kuinka heidän käytöksensä johti heidän omaan alennustilaansa.","translations":{"opas":"Tehän tiedätte joukossanne ne, jotka rikkovat sapatin ja joille Me sanoimme: »Muuttukaa halveksituiksi apinoiksi!»","clear":"Olette jo tietoisia niistä keskuudessanne, jotka rikkoivat sapattia. Me sanoimme heille: ”Olkaa häväistyjä apinoita!”"}},{"verse":66,"commentary_en":"This verse explains the purpose behind the consequence described in the previous verse regarding the Sabbath breakers. Allah made this event a clear example for the people living at that time and for future generations. It serves as a warning and a lesson, particularly for those who are God-fearing, about the consequences of disobeying Allah's commands and prioritizing worldly gain over divine directives. It connects their historical experience to a timeless lesson for believers.","commentary_fi":"Tämä jae selittää edellisessä jakeessa kuvatun seurauksen tarkoituksen sapatinrikkojia kohtaan. Allah teki tästä tapahtumasta selkeän esimerkin silloin eläneille ihmisille ja tuleville sukupolville. Se toimii varoituksena ja oppituntina, erityisesti jumalaapelkääville, Allahin käskyjen tottelemattomuuden seurauksista ja maallisen hyödyn priorisoimisesta jumalallisten ohjeiden yli. Se yhdistää heidän historiallisen kokemuksensa ajattomaan oppituntiin uskoville.","arabic":"فَجَعَلْنَاهَا نَكَالًا لِمَا بَيْنَ يَدَيْهَا وَمَا خَلْفَهَا وَمَوْعِظَةً لِلْمُتَّقِينَ","commentary":"Tämä jae selittää edellisessä jakeessa kuvatun seurauksen tarkoituksen sapatinrikkojia kohtaan. Allah teki tästä tapahtumasta selkeän esimerkin silloin eläneille ihmisille ja tuleville sukupolville. Se toimii varoituksena ja oppituntina, erityisesti jumalaapelkääville, Allahin käskyjen tottelemattomuuden seurauksista ja maallisen hyödyn priorisoimisesta jumalallisten ohjeiden yli. Se yhdistää heidän historiallisen kokemuksensa ajattomaan oppituntiin uskoville.","translations":{"opas":"Niin teimme heistä pelottavan esimerkin nykyiselle sukupolvelle ja tuleville sekä varoituksen jumalaapelkääväisille.","clear":"Niinpä teimme heidän kohtalostaan esimerkin nykyisille ja tuleville sukupolville, ja opetuksen Jumalaa pelkääville."}},{"verse":67,"commentary_en":"This verse begins the account of the cow (heifer) incident. Prophet Moses conveyed a simple command from Allah to his people: sacrifice a heifer. Instead of complying directly, their immediate reaction was to ask if he was making fun of them, showing a lack of trust or perhaps reluctance to accept the command. Prophet Moses responded by seeking refuge in Allah from being ignorant, indicating that mocking others, especially in the context of conveying divine commands, is an act of ignorance and unbefitting of someone who knows Allah's position. This initial exchange sets the tone for their subsequent interactions regarding this command.","commentary_fi":"Tämä jae aloittaa kertomuksen lehmä (hieho) tapauksesta. Profeetta Mooses välitti kansalleen yksinkertaisen käskyn Allahilta: uhratkaa hieho. Sen sijaan, että olisivat noudattaneet suoraan, heidän välitön reaktionsa oli kysyä, pilkkaako hän heitä, osoittaen luottamuksen puutetta tai ehkä haluttomuutta hyväksyä käskyä. Profeetta Mooses vastasi turvautumalla Allahiin tietämättömyydestä, osoittaen, että toisten pilkkaaminen, erityisesti jumalallisten käskyjen välittämisen yhteydessä, on tietämättömyyden teko ja sopimatonta jollekin, joka tuntee Allahin aseman. Tämä alkukeskustelu asettaa sävyn heidän myöhemmälle vuorovaikutukselleen tämän käskyn suhteen.","arabic":"وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تَذْبَحُوا بَقَرَةً ۖ قَالُوا أَتَتَّخِذُنَا هُزُوًا ۖ قَالَ أَعُوذُ بِاللَّهِ أَنْ أَكُونَ مِنَ الْجَاهِلِينَ","commentary":"Tämä jae aloittaa kertomuksen lehmä (hieho) tapauksesta. Profeetta Mooses välitti kansalleen yksinkertaisen käskyn Allahilta: uhratkaa hieho. Sen sijaan, että olisivat noudattaneet suoraan, heidän välitön reaktionsa oli kysyä, pilkkaako hän heitä, osoittaen luottamuksen puutetta tai ehkä haluttomuutta hyväksyä käskyä. Profeetta Mooses vastasi turvautumalla Allahiin tietämättömyydestä, osoittaen, että toisten pilkkaaminen, erityisesti jumalallisten käskyjen välittämisen yhteydessä, on tietämättömyyden teko ja sopimatonta jollekin, joka tuntee Allahin aseman. Tämä alkukeskustelu asettaa sävyn heidän myöhemmälle vuorovaikutukselleen tämän käskyn suhteen.","translations":{"opas":"Entä kun Mooses sanoi kansalleen: »Jumala käskee teitä uhraamaan hiehon\"»? He kysyivät: »Teetkö pilkkaa meistä?» Hän vastasi: »Jumala varjelkoon minua olemasta niin hullu.» ,","clear":"Ja ˹muistakaa˺ kun Mooses sanoi kansalleen: ”Allah käskee teidän uhrata lehmän.” He vastasivat: ”Pilkkaatko sinä meitä?” Mooses vastasi: ”Etsin turvaa Allahista toimiakseni tyhmästi!”"}},{"verse":68,"commentary_en":"Following their initial question in the previous verse, the people of Prophet Moses asked him to pray to Allah to specify what kind of heifer they should sacrifice. This shows they were making the matter more complicated than the initial command required. Prophet Moses conveyed Allah's response: the heifer should be neither too old nor too young, but of an age in between. He then reiterated the command: \"Now do what you are commanded!\" Despite the clarification, they continued to seek more details rather than simply carrying out the task.","commentary_fi":"Seuraten heidän alkup
