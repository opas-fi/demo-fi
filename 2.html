َ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ","commentary":"Tämä jae on osoitettu suoraan uskoville ja kannustaa heitä etsimään voimaa ja tukea kahden tärkeän keinon, kärsivällisyyden ja rukouksen, avulla. Meille muistutetaan, että kärsivällisyys ja rukous ovat välttämättömiä työkaluja erityisesti kohdatessa elämän haasteita ja vaikeuksia sekä pyrkiessä elämään jumalallisen johdatuksen mukaisesti. Nämä kaksi ominaisuutta korostetaan ensisijaisina tapoina löytää apua, sillä Allah on kärsivällisten kanssa. Tämä on suuri lohdutuksen lähde, joka osoittaa jumalallista tukea kärsivällisesti kestäville. Tämä jae tulee laajemman ohjeistuksen jälkeen, joka koskee muslimiyhteisön identiteettiä ja roolia, tarjoten käytännön opastusta tämän roolin ylläpitämiseen henkilökohtaisen kurin ja yhteyden kautta Allahiin.","translations":{"opas":"Te jotka uskotte, etsikää apua kärsivällisyydestä ja rukouksesta. Jumala on totisesti kärsivällisten kanssa.","clear":"Oi uskovat! Etsikää lohtua kärsivällisyydestä ja rukouksesta. Jumala on totisesti kärsivällisten kanssa."}},{"verse":154,"commentary_en":"This verse addresses a specific, difficult aspect of striving for Allah's cause: the sacrifice of lives. It instructs us not to consider those who are killed while striving in Allah's way as merely \"dead.\" It states clearly that they are, in fact, alive, even if this life is not something we can perceive in our ordinary understanding. This challenges the conventional view of death and emphasizes a deeper reality related to sacrifice for a higher purpose. It connects to the previous verse about patience and prayer by acknowledging that the path requires significant sacrifice, and it offers a profound perspective on the status of those who make the ultimate sacrifice, highlighting their continued existence in a way beyond our immediate perception.","commentary_fi":"Tämä jae käsittelee erityistä, vaikeaa näkökohtaa pyrkimisessä Allahin asian puolesta: elämien uhraamista. Se ohjeistaa meitä olemaan pitämättä niitä, jotka surmataan pyrkiessään Allahin tiellä, pelkästään \"kuolleina\". Se toteaa selvästi, että he ovat itse asiassa elossa, vaikka tämä elämä ei olisikaan jotain, jonka voimme havaita tavallisella ymmärryksellämme. Tämä haastaa tavanomaisen kuoleman käsityksen ja korostaa syvempää todellisuutta, joka liittyy uhraukseen korkeamman tarkoituksen puolesta. Se kytkeytyy edelliseen jakeeseen kärsivällisyydestä ja rukouksesta tunnustamalla, että polku vaatii merkittävää uhrausta, ja se tarjoaa syvällisen näkökulman niiden asemaan, jotka tekevät äärimmäisen uhrauksen, korostaen heidän jatkuvaa olemassaoloaan tavalla, joka on välittömän havaintomme ulottumattomissa.","arabic":"وَلَا تَقُولُوا لِمَنْ يُقْتَلُ فِي سَبِيلِ اللَّهِ أَمْوَاتٌ ۚ بَلْ أَحْيَاءٌ وَلَٰكِنْ لَا تَشْعُرُونَ","commentary":"Tämä jae käsittelee erityistä, vaikeaa näkökohtaa pyrkimisessä Allahin asian puolesta: elämien uhraamista. Se ohjeistaa meitä olemaan pitämättä niitä, jotka surmataan pyrkiessään Allahin tiellä, pelkästään \"kuolleina\". Se toteaa selvästi, että he ovat itse asiassa elossa, vaikka tämä elämä ei olisikaan jotain, jonka voimme havaita tavallisella ymmärryksellämme. Tämä haastaa tavanomaisen kuoleman käsityksen ja korostaa syvempää todellisuutta, joka liittyy uhraukseen korkeamman tarkoituksen puolesta. Se kytkeytyy edelliseen jakeeseen kärsivällisyydestä ja rukouksesta tunnustamalla, että polku vaatii merkittävää uhrausta, ja se tarjoaa syvällisen näkökulman niiden asemaan, jotka tekevät äärimmäisen uhrauksen, korostaen heidän jatkuvaa olemassaoloaan tavalla, joka on välittömän havaintomme ulottumattomissa.","translations":{"opas":"Älkääkä sanoko »kuolleiksi» niitä, jotka surmataan Jumalan asian tähden. Ei, hehän elävät, vaikka te ette sitä tajua.","clear":"Älkää koskaan sanoko, että ne, jotka on surmattu Allahin asian puolesta, ovat kuolleita – itse asiassa he ovat elossa! Mutta te ette sitä ymmärrä."}},{"verse":155,"commentary_en":"Building on the themes of patience (from Verse 153) and the potential loss of life (from Verse 154), this verse explicitly states that believers will inevitably face trials. These tests may include experiencing fear, hunger, and the loss of possessions, loved ones, or the results of one's efforts. These trials are presented not as punishment, but as part of the process of spiritual growth and establishing one's commitment. Despite these hardships, the verse offers good news specifically to those who are patient during these trials, setting the stage for the description of their admirable response in the next verse.","commentary_fi":"Rakentaen kärsivällisyyden (jae 153) ja mahdollisen hengen menetyksen (jae 154) teemoille, tämä jae toteaa selvästi, että uskovat kohtaavat väistämättä koetuksia. Näihin koetuksiin voi sisältyä pelon, nälän kokeminen sekä omaisuuden, rakkaiden tai omien ponnistelujen tulosten menettäminen. Näitä koetuksia ei esitetä rangaistuksena, vaan osana hengellisen kasvun ja sitoutumisen vahvistamisen prosessia. Näistä vaikeuksista huolimatta jae antaa hyvän uutisen erityisesti niille, jotka ovat kärsivällisiä näiden koetusten aikana, valmistellen maaperää heidän ihailtavan vastauksensa kuvaukselle seuraavassa jakeessa.","arabic":"وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ ۗ وَبَشِّرِ الصَّابِرِينَ","commentary":"Rakentaen kärsivällisyyden (jae 153) ja mahdollisen hengen menetyksen (jae 154) teemoille, tämä jae toteaa selvästi, että uskovat kohtaavat väistämättä koetuksia. Näihin koetuksiin voi sisältyä pelon, nälän kokeminen sekä omaisuuden, rakkaiden tai omien ponnistelujen tulosten menettäminen. Näitä koetuksia ei esitetä rangaistuksena, vaan osana hengellisen kasvun ja sitoutumisen vahvistamisen prosessia. Näistä vaikeuksista huolimatta jae antaa hyvän uutisen erityisesti niille, jotka ovat kärsivällisiä näiden koetusten aikana, valmistellen maaperää heidän ihailtavan vastauksensa kuvaukselle seuraavassa jakeessa.","translations":{"opas":"Totisesti Me koettelemme teitä pelolla, nälällä, omaisuuden, hengen ja sadon menetyksellä. Kuitenkin, Muhammed, vie kärsivällisille riemullinen sanoma.","clear":"Totisesti koettelemme teitä pelolla, nälällä ja omaisuuden, elämän ja sadon menetyksellä. Anna hyviä uutisia niille, jotka kärsivällisesti kestävät –"}},{"verse":156,"commentary_en":"This verse describes the response of those who are patient in the face of the calamities mentioned in the previous verse. When afflicted, their statement reflects a core understanding of their relationship with Allah: acknowledging that they belong to Allah and that their ultimate return is to Him. This declaration is an expression of complete submission, recognition of Allah's sovereignty over all things, and acceptance of divine decree. It is this profound mindset, born of patience and reliance on Allah, that distinguishes those to whom glad tidings are promised in Verse 155.","commentary_fi":"Tämä jae kuvaa niiden vastausta, jotka ovat kärsivällisiä edellisessä jakeessa mainittujen koettelemusten edessä. Kun heitä koettelee onnettomuus, heidän lausuntonsa heijastaa ydinymmärrystä heidän suhteestaan Allahiin: tunnustaen, että he kuuluvat Allahille ja että heidän lopullinen paluunsa on Hänen luokseen. Tämä julistus on ilmaus täydellisestä alistumisesta, Allahin suvereniteetin tunnustamisesta kaiken yli ja jumalallisen määräyksen hyväksymisestä. Juuri tämä syvällinen ajattelutapa, joka syntyy kärsivällisyydestä ja luottamuksesta Allahiin, erottaa ne, joille on luvattu hyvä uutinen jakeessa 155.","arabic":"الَّذِينَ إِذَا أَصَابَتْهُمْ مُصِيبَةٌ قَالُوا إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ","commentary":"Tämä jae kuvaa niiden vastausta, jotka ovat kärsivällisiä edellisessä jakeessa mainittujen koettelemusten edessä. Kun heitä koettelee onnettomuus, heidän lausuntonsa heijastaa ydinymmärrystä heidän suhteestaan Allahiin: tunnustaen, että he kuuluvat Allahille ja että heidän lopullinen paluunsa on Hänen luokseen. Tämä julistus on ilmaus täydellisestä alistumisesta, Allahin suvereniteetin tunnustamisesta kaiken yli ja jumalallisen määräyksen hyväksymisestä. Juuri tämä syvällinen ajattelutapa, joka syntyy kärsivällisyydestä ja luottamuksesta Allahiin, erottaa ne, joille on luvattu hyvä uutinen jakeessa 155.","translations":{"opas":"Niille, jotka koettelemusten heitä kohdatessa sanovat: »Me kuulumme totisesti Jumalalle ja hänen luokseen me palaamme»,","clear":"jotka, kohdatessaan katastrofin, sanovat: ”Totisesti Allahille me kuulumme ja Hänen luokseen me ˹kaikki˺ palaamme.”"}},{"verse":157,"commentary_en":"Concluding this passage, this verse describes the remarkable reward and status for those who demonstrate patience during trials and affirm their belonging and return to Allah, as mentioned in Verses 155 and 156. Such individuals receive blessings and mercy directly from Allah. Furthermore, they are described as the ones who are rightly guided. This verse highlights the immense value of patience and unwavering faith in the face of adversity, showing that these qualities earn divine favor, compassion, and clear guidance, serving as a powerful motivation to endure hardship for Allah's sake. This is presented as a profound return for the patience and sacrifices described in the preceding verses.","commentary_fi":"Päätellen tämän katkelman, tämä jae kuvaa merkittävää palkkiota ja asemaa niille, jotka osoittavat kärsivällisyyttä koetusten aikana ja vahvistavat kuulumisensa ja paluunsa Allahiin, kuten jakeissa 155 ja 156 mainittiin. Tällaiset henkilöt saavat siunauksia ja armoa suoraan Allahilta. Lisäksi heitä kuvataan niiksi, jotka ovat oikein johdatettuja. Tämä jae korostaa kärsivällisyyden ja vankkumattoman uskon valtavaa arvoa vastoinkäymisten edessä, osoittaen, että nämä ominaisuudet ansaitsevat jumalallisen suosion, myötätunnon ja selkeän johdatuksen, toimien voimakkaana motivaationa kestää vaikeuksia Allahin vuoksi. Tämä esitetään syvällisenä vastineena edellisissä jakeissa kuvatulle kärsivällisyydelle ja uhrauksille.","arabic":"أُولَٰئِكَ عَلَيْهِمْ صَلَوَاتٌ مِنْ رَبِّهِمْ وَرَحْمَةٌ ۖ وَأُولَٰئِكَ هُمُ الْمُهْتَدُونَ","commentary":"Päätellen tämän katkelman, tämä jae kuvaa merkittävää palkkiota ja asemaa niille, jotka osoittavat kärsivällisyyttä koetusten aikana ja vahvistavat kuulumisensa ja paluunsa Allahiin, kuten jakeissa 155 ja 156 mainittiin. Tällaiset henkilöt saavat siunauksia ja armoa suoraan Allahilta. Lisäksi heitä kuvataan niiksi, jotka ovat oikein johdatettuja. Tämä jae korostaa kärsivällisyyden ja vankkumattoman uskon valtavaa arvoa vastoinkäymisten edessä, osoittaen, että nämä ominaisuudet ansaitsevat jumalallisen suosion, myötätunnon ja selkeän johdatuksen, toimien voimakkaana motivaationa kestää vaikeuksia Allahin vuoksi. Tämä esitetään syvällisenä vastineena edellisissä jakeissa kuvatulle kärsivällisyydelle ja uhrauksille.","translations":{"opas":"sellaisille tulee siunausta ja laupeutta heidän Herraltaan, ja nämä ovat niitä, jotka ovat oikealla tiellä.","clear":"He ovat niitä, jotka saavat Allahin siunaukset ja armoa. Ja he ovat niitä, jotka ovat ˹oikein˺ ohjattuja."}},{"verse":158,"commentary_en":"This verse addresses a specific ritual during the pilgrimage to the Ka'bah in Mecca. Safa and Marwa are two small hills near the Ka'bah, and walking between them is part of the pilgrimage rites. Before Islam, some people had placed idols on these hills, leading some early Muslims to feel hesitant about performing this walk, fearing it might be associated with those older practices. This verse clarifies that Safa and Marwa are in fact symbols established by Allah, not by pagan tradition. Therefore, walking between them during the pilgrimage (`Hajj` or `Umrah`) is a valid and acceptable act of worship. The verse reassures believers that performing this act, and indeed any voluntary good deed, is recognized and appreciated by Allah, Who is fully aware of our intentions and actions. It shows how Islam purified existing practices, restoring their original purpose as acts devoted purely to Allah.","commentary_fi":"Tämä jae käsittelee tiettyä rituaalia pyhiinvaelluksen aikana Ka'bahille Mekkaan. Safa ja Marwa ovat kaksi pientä kukkulaa lähellä Ka'bahia, ja niiden välillä kävely on osa pyhiinvaellusmenoja. Ennen islamia jotkut ihmiset olivat asettaneet epäjumalia näille kukkuloille, mikä sai jotkut varhaiset muslimit tuntemaan epäröintiä suorittaa tämä kävely, peläten sen liittyvän noihin vanhoihin tapoihin. Tämä jae selventää, että Safa ja Marwa ovat itse asiassa Allahin, eivät pakanallisen perinteen, asettamia symboleja. Siksi niiden välillä kävely pyhiinvaelluksen (`Hajj` tai `Umrah`) aikana on pätevä ja hyväksyttävä palvonnan teko. Jae vakuuttaa uskoville, että tämän teon ja minkä tahansa vapaaehtoisen hyvän teon suorittaminen on Allahin tunnustama ja arvostama. Hän on täysin tietoinen aikomuksistamme ja teoistamme. Tämä osoittaa, kuinka islam puhdisti olemassa olevia käytäntöjä palauttaen niiden alkuperäisen tarkoituksen teoiksi, jotka on omistettu puhtaasti Allahille.","arabic":"إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ ۖ فَمَنْ حَجَّ الْبَيْتَ أَوِ اعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَنْ يَطَّوَّفَ بِهِمَا ۚ وَمَنْ تَطَوَّعَ خَيْرًا فَإِنَّ اللَّهَ شَاكِرٌ عَلِيمٌ","commentary":"Tämä jae käsittelee tiettyä rituaalia pyhiinvaelluksen aikana Ka'bahille Mekkaan. Safa ja Marwa ovat kaksi pientä kukkulaa lähellä Ka'bahia, ja niiden välillä kävely on osa pyhiinvaellusmenoja. Ennen islamia jotkut ihmiset olivat asettaneet epäjumalia näille kukkuloille, mikä sai jotkut varhaiset muslimit tuntemaan epäröintiä suorittaa tämä kävely, peläten sen liittyvän noihin vanhoihin tapoihin. Tämä jae selventää, että Safa ja Marwa ovat itse asiassa Allahin, eivät pakanallisen perinteen, asettamia symboleja. Siksi niiden välillä kävely pyhiinvaelluksen (`Hajj` tai `Umrah`) aikana on pätevä ja hyväksyttävä palvonnan teko. Jae vakuuttaa uskoville, että tämän teon ja minkä tahansa vapaaehtoisen hyvän teon suorittaminen on Allahin tunnustama ja arvostama. Hän on täysin tietoinen aikomuksistamme ja teoistamme. Tämä osoittaa, kuinka islam puhdisti olemassa olevia käytäntöjä palauttaen niiden alkuperäisen tarkoituksen teoiksi, jotka on omistettu puhtaasti Allahille.","translations":{"opas":"Katso, as-Safan ja al-Marwan kukkulat kuuluvat Jumalan muistomerkkeihin, ja sille, joka tekee pyhiinvaelluksen (Kaaban) temppeliin tai käy siellä, ei siis lueta synniksi, jos hän suorittaa kävelyt niiden ympäri (vaikka pakanatkin niin tekevät). Jos joku vapaaehtoisesti tekee hyvää, niin Jumala totisesti muistaa sen, Hän on kaikkitietävä.","clear":"Totisesti ˹kukkulat˺ Ṣafa ja Marwah ovat Allahin symboleja. Joten kuka tahansa suorittaa pyhiinvaelluksen tai pienemmän pyhiinvaelluksen, kävelköön ˹kahden kukkulan˺ välillä. Ja kuka tahansa tekee hyvää vapaaehtoisesti, Allah on todella Kiitollinen, Kaikkitietävä."}},{"verse":159,"commentary_en":"Following the discussion on religious rituals, this verse delivers a strong warning against those who knowingly conceal the clear truths and guidance that Allah has revealed in His scriptures, even after these truths have been clearly explained. Muslims are warned not to fall into this behavior. The verse states that those who deliberately suppress any part of the revealed guidance—despite its clarity in the Book—are cursed by Allah and by all who are entitled to curse. This highlights the seriousness of hiding or distorting divine truth and emphasizes how essential it is in Islam to uphold and share religious knowledge with honesty and integrity.","commentary_fi":"Tämän säkeen taustalla on aiempi keskustelu uskonnollisista rituaaleista, ja se esittää voimakkaan varoituksen niille, jotka tietoisesti salaavat selkeät totuudet ja johdatuksen, jonka Allah on ilmoittanut kirjoissaan, vaikka nämä totuudet on esitetty kaikille selkeästi. Muslimeja varoitetaan, etteivät he syyllistyisi tällaiseen käytökseen. Säkeessä todetaan, että ne, jotka tahallaan kätkevät mitään ilmoitetusta johdatuksesta – vaikka se olisi selvästi esillä Kirjassa – ovat Allahin ja kaikkien niiden kiroamia, joilla on oikeus kirota. Tämä korostaa, kuinka vakavaa on peittää tai vääristää jumalallista totuutta, ja kuinka tärkeää islamissa on pitää kiinni uskonnollisesta tiedosta sekä jakaa sitä rehellisesti ja vilpittömästi.","arabic":"إِنَّ الَّذِينَ يَكْتُمُونَ مَا أَنْزَلْنَا مِنَ الْبَيِّنَاتِ وَالْهُدَىٰ مِنْ بَعْدِ مَا بَيَّنَّاهُ لِلنَّاسِ فِي الْكِتَابِ ۙ أُولَٰئِكَ يَلْعَنُهُمُ اللَّهُ وَيَلْعَنُهُمُ اللَّاعِنُونَ","commentary":"Tämän säkeen taustalla on aiempi keskustelu uskonnollisista rituaaleista, ja se esittää voimakkaan varoituksen niille, jotka tietoisesti salaavat selkeät totuudet ja johdatuksen, jonka Allah on ilmoittanut kirjoissaan, vaikka nämä totuudet on esitetty kaikille selkeästi. Muslimeja varoitetaan, etteivät he syyllistyisi tällaiseen käytökseen. Säkeessä todetaan, että ne, jotka tahallaan kätkevät mitään ilmoitetusta johdatuksesta – vaikka se olisi selvästi esillä Kirjassa – ovat Allahin ja kaikkien niiden kiroamia, joilla on oikeus kirota. Tämä korostaa, kuinka vakavaa on peittää tai vääristää jumalallista totuutta, ja kuinka tärkeää islamissa on pitää kiinni uskonnollisesta tiedosta sekä jakaa sitä rehellisesti ja vilpittömästi.","translations":{"opas":"Ne jotka salaavat selvät todistukset ja Meidän ilmoittamamme johdatuksen, senjälkeen kun olemme selittänyt ne (tässä) Pyhässä kirjassa, heidät kiroaa Jumala ja heitä kiroavat kaikki, joilla on valta kirota,","clear":"Ne, jotka piilottavat selvät todisteet ja ohjauksen, jonka olemme ilmoittaneet – sen jälkeen kun olemme tehneet sen selväksi ihmiskunnalle Kirjassa – Allah ja ˹kaikki˺ tuomitsevat tuomitsevat heidät."}},{"verse":160,"commentary_en":"This verse offers an important exception to the severe warning in the previous verse. It makes it clear that the door to repentance is always open for those who have concealed the truth. If they genuinely regret their actions, correct their behavior, and publicly declare the truth they had previously hidden, then Allah will accept their turning back to Him. Allah is described as being ever-ready to accept repentance and being Most Merciful, emphasizing His boundless grace and willingness to forgive those who sincerely seek His forgiveness and strive to do good.","commentary_fi":"Tämä jae tarjoaa tärkeän poikkeuksen edellisen jakeen ankaralle varoitukselle. Se tekee selväksi, että ovi katumukselle on aina avoin niille, jotka ovat piilottaneet totuuden. Jos he aidosti katuvat tekojaan, korjaavat käytöstään ja julistavat avoimesti totuuden, jonka he olivat aiemmin piilottaneet, niin Allah hyväksyy heidän kääntymisensä Hänen puoleensa. Allahia kuvataan alati valmiiksi hyväksymään katumuksen ja olevan Armeliain, mikä korostaa Hänen rajatonta armoaan ja halukkuuttaan antaa anteeksi niille, jotka vilpittömästi etsivät Hänen anteeksiantoaan ja pyrkivät tekemään hyvää.","arabic":"إِلَّا الَّذِينَ تَابُوا وَأَصْلَحُوا وَبَيَّنُوا فَأُولَٰئِكَ أَتُوبُ عَلَيْهِمْ ۚ وَأَنَا التَّوَّابُ الرَّحِيمُ","commentary":"Tämä jae tarjoaa tärkeän poikkeuksen edellisen jakeen ankaralle varoitukselle. Se tekee selväksi, että ovi katumukselle on aina avoin niille, jotka ovat piilottaneet totuuden. Jos he aidosti katuvat tekojaan, korjaavat käytöstään ja julistavat avoimesti totuuden, jonka he olivat aiemmin piilottaneet, niin Allah hyväksyy heidän kääntymisensä Hänen puoleensa. Allahia kuvataan alati valmiiksi hyväksymään katumuksen ja olevan Armeliain, mikä korostaa Hänen rajatonta armoaan ja halukkuuttaan antaa anteeksi niille, jotka vilpittömästi etsivät Hänen anteeksiantoaan ja pyrkivät tekemään hyvää.","translations":{"opas":"paitsi jos he kääntyvät, tekevät parannuksen ja tuovat totuuden julki. Minä säälin katuvia, koska olen säälivä, armollinen.","clear":"Mitä tulee niihin, jotka tekevät parannuksen, parantavat tapansa ja antavat totuuden tulla tunnetuksi, he ovat niitä, joiden luo minä käännyn ˹anteeksiantona˺, sillä minä olen Katumuksen Hyväksyjä, Armollisin."}},{"verse":161,"commentary_en":"Building on the previous warnings, this verse turns to those who completely reject faith and persist in their denial until death. It declares that such individuals will be cursed by Allah, the angels, and all of humanity. This powerfully emphasizes the seriousness of knowingly rejecting truth and guidance once it has been made clear and evident.","commentary_fi":"Rakentuessaan edellisiin varoituksiin, tämä jae keskittyy niihin, jotka täysin torjuvat uskon ja pysyvät kieltäymyksessään kuolemaansa saakka. Siinä todetaan, että tällaiset ihmiset joutuvat Allahin, enkelien ja koko ihmiskunnan kirouksen kohteeksi. Tämä korostaa voimakkaasti sitä, kuinka vakavaa on hylätä selkeästi esitetty totuus ja johdatus sen jälkeen, kun se on tehty ymmärrettäväksi ja todeksi.","arabic":"إِنَّ الَّذِينَ كَفَرُوا وَمَاتُوا وَهُمْ كُفَّارٌ أُولَٰئِكَ عَلَيْهِمْ لَعْنَةُ اللَّهِ وَالْمَلَائِكَةِ وَالنَّاسِ أَجْمَعِينَ","commentary":"Rakentuessaan edellisiin varoituksiin, tämä jae keskittyy niihin, jotka täysin torjuvat uskon ja pysyvät kieltäymyksessään kuolemaansa saakka. Siinä todetaan, että tällaiset ihmiset joutuvat Allahin, enkelien ja koko ihmiskunnan kirouksen kohteeksi. Tämä korostaa voimakkaasti sitä, kuinka vakavaa on hylätä selkeästi esitetty totuus ja johdatus sen jälkeen, kun se on tehty ymmärrettäväksi ja todeksi.","translations":{"opas":"Niitten yllä, jotka ovat uskottomia ja kuolevat epäuskossaan, lepää totisesti sekä Jumalan ja enkelien että kaikkien ihmisten kirous","clear":"Totisesti ne, jotka eivät usko ja kuolevat epäuskoisina, ovat Allahin, enkelien ja koko ihmiskunnan tuomitsemia."}},{"verse":162,"commentary_en":"This verse describes the consequence for those mentioned in the previous verse—those who reject faith and die in that state. It states that they will abide in a condition of severe punishment, and their suffering will neither be eased nor will they be granted any temporary relief. This serves as a stark warning about the eternal consequences of denying faith and turning away from divine guidance.","commentary_fi":"Tämä jae kuvaa niiden ihmisten kohtaloa, joista edellisessä jakeessa puhutaan – niitä, jotka hylkäävät uskon ja kuolevat siinä tilassa. Siinä todetaan, että he jäävät ankaran rangaistuksen tilaan, eikä heidän kärsimystään helpoteta, eikä heille anneta minkäänlaista tilapäistä helpotusta. Tämä toimii vakavana varoituksena uskon kieltämisen ja jumalallisen johdatuksen hylkäämisen ikuisista seurauksista.","arabic":"خَالِدِينَ فِيهَا ۖ لَا يُخَفَّفُ عَنْهُمُ الْعَذَابُ وَلَا هُمْ يُنْظَرُونَ","commentary":"Tämä jae kuvaa niiden ihmisten kohtaloa, joista edellisessä jakeessa puhutaan – niitä, jotka hylkäävät uskon ja kuolevat siinä tilassa. Siinä todetaan, että he jäävät ankaran rangaistuksen tilaan, eikä heidän kärsimystään helpoteta, eikä heille anneta minkäänlaista tilapäistä helpotusta. Tämä toimii vakavana varoituksena uskon kieltämisen ja jumalallisen johdatuksen hylkäämisen ikuisista seurauksista.","translations":{"opas":"ja se pysyy ikuisesti, eikä heidän rangaistustansa lievennetä eikä heille suoda armonaikaa.","clear":"He ovat Helvetissä ikuisesti. Heidän rangaistustaan ei lievennetä, eikä heitä lykätä ˹siitä˺."}},{"verse":163,"commentary_en":"Transitioning from the warnings about rejecting truth and faith, this verse powerfully reaffirms the central concept of Islam: the absolute oneness of Allah. It declares that the deity you should worship is one and unique; there is no other being worthy of worship but Him. He is further described by two key attributes: Most Gracious and Most Merciful.","commentary_fi":"Siirryttäessä varoituksista totuuden ja uskon hylkäämisestä, tämä jae vahvistaa voimakkaasti islamin keskeisen käsitteen: Allahin täydellisen ykseyden. Se julistaa, että jumaluus, jota teidän tulisi palvoa, on yksi ja ainutlaatuinen; ei ole muuta palvonnan arvoista olentoa kuin Hän. Häntä kuvataan edelleen kahdella keskeisellä ominaisuudella: Armeliain ja Erityisen Armollinen.","arabic":"وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ لَا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ","commentary":"Siirryttäessä varoituksista totuuden ja uskon hylkäämisestä, tämä jae vahvistaa voimakkaasti islamin keskeisen käsitteen: Allahin täydellisen ykseyden. Se julistaa, että jumaluus, jota teidän tulisi palvoa, on yksi ja ainutlaatuinen; ei ole muuta palvonnan arvoista olentoa kuin Hän. Häntä kuvataan edelleen kahdella keskeisellä ominaisuudella: Armeliain ja Erityisen Armollinen.","translations":{"opas":"Teidän Jumalanne on ainoa Jumala; ei ole muuta Jumalaa kuin Hän, laupias, armollinen.","clear":"Teidän Jumalanne on ˹vain˺ yksi Jumala. Ei ole muuta jumalaa ˹palvonnan arvoista˺ kuin Hän – Kaikkein Armollisin, Kaikkein Laupias."}},{"verse":164,"commentary_en":"Following the declaration of Allah's oneness, this verse invites reflection on the natural world as clear evidence of His existence, power, and wisdom. It points to various phenomena: the vastness and intricate design of the heavens and earth, the regular transition between night and day, the ability of ships to navigate the seas for human benefit, the rain that revives dry land and supports diverse life, the multitude of animals spread across the earth, and the movement of winds and clouds. The verse highlights that in all these aspects of creation, there are indeed profound signs and lessons for those who use their intellect and reflect deeply. It suggests that contemplating the wonders of the universe leads to recognizing the one Creator and Sustainer.","commentary_fi":"Allahin ykseyden julistuksen jälkeen tämä jae kutsuu pohtimaan luontoa selkeänä todisteena Hänen olemassaolostaan, voimastaan ja viisaudestaan. Se osoittaa moniin ilmiöihin: taivaiden ja maan laajuus ja monimutkainen suunnittelu, yön ja päivän säännöllinen vaihtelu, laivojen kyky purjehtia merillä ihmiskunnan hyödyksi, sade, jonka Allah lähettää taivaalta, ja elämä, jonka Hän sillä antaa kuolleelle maalle, kaikenlaiset eläimet, jotka Hän on levittänyt ympäri maata, tuulten muutos ja pilvet, joita ne kuljettavat kuin orjiaan taivaan ja maan välillä. Jaen mukaan kaikissa näissä luomakunnan näkökohdissa on todella syvällisiä merkkejä ja oppitunteja ihmisille, jotka käyttävät älyään ja pohtivat syvällisesti. Se viittaa siihen, että maailmankaikkeuden ihmeiden miettiminen johtaa yhden Luojan ja Ylläpitäjän tunnistamiseen.","arabic":"إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ وَالْفُلْكِ الَّتِي تَجْرِي فِي الْبَحْرِ بِمَا يَنْفَعُ النَّاسَ وَمَا أَنْزَلَ اللَّهُ مِنَ السَّمَاءِ مِنْ مَاءٍ فَأَحْيَا بِهِ الْأَرْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيهَا مِنْ كُلِّ دَابَّةٍ وَتَصْرِيفِ الرِّيَاحِ وَالسَّحَابِ الْمُسَخَّرِ بَيْنَ السَّمَاءِ وَالْأَرْضِ لَآيَاتٍ لِقَوْمٍ يَعْقِلُونَ","commentary":"Allahin ykseyden julistuksen jälkeen tämä jae kutsuu pohtimaan luontoa selkeänä todisteena Hänen olemassaolostaan, voimastaan ja viisaudestaan. Se osoittaa moniin ilmiöihin: taivaiden ja maan laajuus ja monimutkainen suunnittelu, yön ja päivän säännöllinen vaihtelu, laivojen kyky purjehtia merillä ihmiskunnan hyödyksi, sade, jonka Allah lähettää taivaalta, ja elämä, jonka Hän sillä antaa kuolleelle maalle, kaikenlaiset eläimet, jotka Hän on levittänyt ympäri maata, tuulten muutos ja pilvet, joita ne kuljettavat kuin orjiaan taivaan ja maan välillä. Jaen mukaan kaikissa näissä luomakunnan näkökohdissa on todella syvällisiä merkkejä ja oppitunteja ihmisille, jotka käyttävät älyään ja pohtivat syvällisesti. Se viittaa siihen, että maailmankaikkeuden ihmeiden miettiminen johtaa yhden Luojan ja Ylläpitäjän tunnistamiseen.","translations":{"opas":"Katso, taivasten ja maan järjestyksessä, yön ja päivän vaihtelussa, laivojen purjehtimisessa merellä niiden kuljettaessa sellaista, joka hyödyttää ihmisiä, vedessä, jonka Jumala taivaasta lähettää ja jolla hän elvyttää maan sen horrostilan jälkeen, kaikenlaisten eläinten leviämisessä yli maan, tuulten suunnassa ja pilvien nöyrässä kulussa taivaan ja maan välillä, on totisesti tunnusmerkkejä (Jumalan kaikkivaltiudesta) ihmisille, joilla on ymmärrystä.","clear":"Totisesti, taivaiden ja maan luomisessa, yön ja päivän vuorottelussa, laivoissa, jotka purjehtivat merellä ihmiskunnan hyödyksi, sateessa, jonka Allah lähettää taivaista elvyttäen maan sen kuoleman jälkeen, kaikenlaisten olentojen levittämisessä ympäriinsä, tuulten vaihtelussa ja pilvissä, jotka ajelehtivat taivaiden ja maan välillä – kaikessa tässä on varmasti merkkejä ymmärtäväisille ihmisille."}},{"verse":165,"commentary_en":"In contrast to those who reflect on creation and recognize Allah's oneness, this verse points out that some people still worship others alongside Allah, treating them as if they had equal status or importance. They may even show them the kind of devotion and love that is due only to Allah. This is contrasted sharply with believers, whose love for Allah is paramount and surpasses all other loves. The verse warns the wrongdoers that if they could only foresee the consequences of their actions on the Day of Judgment, they would realize that all power belongs solely to Allah and that He is severe in retribution. This sets the stage for the verses that follow, which depict a scene from that Day.","commentary_fi":"Toisin kuin ne, jotka pohtivat luomakuntaa ja tunnistavat Allahin ykseyden, tämä jae huomauttaa, että jotkut ihmiset edelleen palvoa muita Allahin rinnalla, kohdellen heitä ikään kuin heillä olisi tasa-arvoinen asema tai tärkeys. He saattavat jopa osoittaa heille sellaista omistautumista ja rakkautta, joka kuuluu vain Allahille. Tätä verrataan jyrkästi uskoviin, joiden rakkaus Allahia kohtaan on ensisijaista ja ylittää kaikki muut rakkaudet. Jae varoittaa väärintekijöitä, että jos he vain voisivat ennakoida tekojensa seuraukset tuomiopäivänä, he ymmärtäisivät, että kaikki valta kuuluu yksinomaan Allahille ja että Hän on ankara koston antaja. Tämä valmistelee maaperää seuraaville jakeille, jotka kuvaavat näkymää tuolta päivältä.","arabic":"وَمِنَ النَّاسِ مَنْ يَتَّخِذُ مِنْ دُونِ اللَّهِ أَنْدَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ ۖ وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِلَّهِ ۗ وَلَوْ يَرَى الَّذِينَ ظَلَمُوا إِذْ يَرَوْنَ الْعَذَابَ أَنَّ الْقُوَّةَ لِلَّهِ جَمِيعًا وَأَنَّ اللَّهَ شَدِيدُ الْعَذَابِ","commentary":"Toisin kuin ne, jotka pohtivat luomakuntaa ja tunnistavat Allahin ykseyden, tämä jae huomauttaa, että jotkut ihmiset edelleen palvoa muita Allahin rinnalla, kohdellen heitä ikään kuin heillä olisi tasa-arvoinen asema tai tärkeys. He saattavat jopa osoittaa heille sellaista omistautumista ja rakkautta, joka kuuluu vain Allahille. Tätä verrataan jyrkästi uskoviin, joiden rakkaus Allahia kohtaan on ensisijaista ja ylittää kaikki muut rakkaudet. Jae varoittaa väärintekijöitä, että jos he vain voisivat ennakoida tekojensa seuraukset tuomiopäivänä, he ymmärtäisivät, että kaikki valta kuuluu yksinomaan Allahille ja että Hän on ankara koston antaja. Tämä valmistelee maaperää seuraaville jakeille, jotka kuvaavat näkymää tuolta päivältä.","translations":{"opas":"Ihmisten joukossa on niitä, jotka Jumalan rinnalle asettavat palveltavikseen muita, joita he rakastavat niin, kuin heidän tulisi vain Jumalaa rakastaa; mutta ne, jotka uskovat, rakastavat Jumalaa yli kaiken. Jospa vain ne, jotka tekevät väärin, käsittäisivät, että kaikki valta kuuluu Jumalalle ja että Jumala on ankara rangaistessaan! He saavat osakseen tuomion (sinä päivänä),","clear":"Yhä on niitä, jotka ottavat muita Allahin vertaisiksi – he rakastavat heitä niin kuin heidän pitäisi rakastaa Allahia – mutta ˹todelliset˺ uskovat rakastavat Allahia vielä enemmän. Jospa väärintekijät vain näkisivät ˹kauhean˺ rangaistuksen, joka heitä odottaa, he varmasti ymmärtäisivät, että kaikki voima kuuluu Allahille ja että Allah on todella ankara rangaistuksessaan."}},{"verse":166,"commentary_en":"Continuing the scene from the Day of Judgment mentioned in the previous verse, this verse describes how those who were followed or worshipped will disassociate themselves from their followers. On that Day, both the followers and those they followed will witness the punishment awaiting them, and any connections, alliances, or relationships they had built on misguided worship will be severed and rendered meaningless. This emphasizes the futility of false allegiances in the face of Allah's ultimate justice.","commentary_fi":"Jatkaen edellisessä jakeessa mainittua Tuomiopäivän kuvausta, tämä jae kertoo, kuinka ne, joita seurattiin tai palvottiin irtisanoutuvat seuraajistaan. Tuona päivänä sekä seuraajat että ne, joita he seurasivat, näkevät heitä odottavan rangaistuksen, ja kaikki heidän rakentamansa yhteydet, liitot tai suhteet, jotka perustuivat harhaanjohtavaan palvontaan, katkeavat ja menettävät merkityksensä. Tämä korostaa väärien liittoumien turhuutta Allahin lopullisen oikeuden edessä.","arabic":"إِذْ تَبَرَّأَ الَّذِينَ اتُّبِعُوا مِنَ الَّذِينَ اتَّبَعُوا وَرَأَوُا الْعَذَابَ وَتَقَطَّعَتْ بِهِمُ الْأَسْبَابُ","commentary":"Jatkaen edellisessä jakeessa mainittua Tuomiopäivän kuvausta, tämä jae kertoo, kuinka ne, joita seurattiin tai palvottiin irtisanoutuvat seuraajistaan. Tuona päivänä sekä seuraajat että ne, joita he seurasivat, näkevät heitä odottavan rangaistuksen, ja kaikki heidän rakentamansa yhteydet, liitot tai suhteet, jotka perustuivat harhaanjohtavaan palvontaan, katkeavat ja menettävät merkityksensä. Tämä korostaa väärien liittoumien turhuutta Allahin lopullisen oikeuden edessä.","translations":{"opas":"jolloin ne, jotka on otettu esikuviksi, luopuvat niistä, jotka seurasivat heitä, jolloin he saavat kokea rangaistuksen ja yhteys heidän välillään katkeaa.","clear":"˹Ajatelkaa päivää˺, jolloin ne, jotka johtivat toisia harhaan, kieltävät seuraajansa – kun he kohtaavat piinan – ja siteet, jotka yhdistivät heidät, katkeavat."}},{"verse":167,"commentary_en":"Concluding this scene of the Day of Judgment, this verse captures the bitter regret of the followers. Seeing those they had followed disown them, they will desperately wish for another chance in earthly life so they could renounce those they once followed. The verse states that Allah will show them the consequences of their worldly actions in a way that fills them with intense remorse. It ends by confirming that they will have no escape from the severe punishment—referred to as the Fire. This serves as a powerful reminder of the importance of making the right choices and establishing a true relationship with Allah in this life, before it is too late.","commentary_fi":"Päättäen tämän Tuomiopäivän kohtauksen, tämä jae kuvaa seuraajien katkeraa katumusta. Nähdessään, kuinka ne, joita he olivat seuranneet, kieltävät heidät, he toivovat epätoivoisesti saavansa vielä yhden mahdollisuuden maalliseen elämään voidakseen hylätä ne, joita he kerran seurasivat. Jae kertoo, että Allah näyttää heille heidän maallisten tekojensa seuraukset tavalla, joka täyttää heidät syvällä katumuksella. Jae päättyy vahvistukseen, että heillä ei ole pakotietä ankarasta rangaistuksesta – viitaten Tuleen. Tämä toimii voimakkaana muistutuksena siitä, kuinka tärkeää on tehdä oikeita valintoja ja rakentaa aito suhde Allahin kanssa tässä elämässä, ennen kuin on liian myöhäistä.","arabic":"وَقَالَ الَّذِينَ اتَّبَعُوا لَوْ أَنَّ لَنَا كَرَّةً فَنَتَبَرَّأَ مِنْهُمْ كَمَا تَبَرَّءُوا مِنَّا ۗ كَذَٰلِكَ يُرِيهِمُ اللَّهُ أَعْمَالَهُمْ حَسَرَاتٍ عَلَيْهِمْ ۖ وَمَا هُمْ بِخَارِجِينَ مِنَ النَّارِ","commentary":"Päättäen tämän Tuomiopäivän kohtauksen, tämä jae kuvaa seuraajien katkeraa katumusta. Nähdessään, kuinka ne, joita he olivat seuranneet, kieltävät heidät, he toivovat epätoivoisesti saavansa vielä yhden mahdollisuuden maalliseen elämään voidakseen hylätä ne, joita he kerran seurasivat. Jae kertoo, että Allah näyttää heille heidän maallisten tekojensa seuraukset tavalla, joka täyttää heidät syvällä katumuksella. Jae päättyy vahvistukseen, että heillä ei ole pakotietä ankarasta rangaistuksesta – viitaten Tuleen. Tämä toimii voimakkaana muistutuksena siitä, kuinka tärkeää on tehdä oikeita valintoja ja rakentaa aito suhde Allahin kanssa tässä elämässä, ennen kuin on liian myöhäistä.","translations":{"opas":"ja ne, jotka olivat seuranneet esikuviaan, sanovat: »Olisipa meillä joku palaamisen mahdollisuus, niin me luopuisimme heistä, kuten he ovat luopuneet meistä.» Niin on Jumala heidän kauhukseen näyttävä heille heidän omat tekonsa, eivätkä he tule pääsemään pois Tulesta.","clear":"˹Harhaan johdetut˺ seuraajat huutavat: ”Jospa meillä olisi toinen mahdollisuus, me kieltäisimme heidät, niin kuin he kielsivät meidät.” Ja niin Allah saa heidät katumaan pahoja tekojaan. Eivätkä he koskaan ˹pääse˺ pois Tulesta."}},{"verse":168,"commentary_en":"This verse addresses all of humanity, granting broad permission to enjoy the good and lawful things available on Earth. It emphasizes that Allah has created these resources for human benefit. The verse calls for rejecting taboos related to food and drink that are based on superstition or irrational cultural practices. Following this permission, the verse warns against following the suggestions of Satan—referred to as \"the evil one.\" It highlights that Satan is a clear and declared enemy to humanity, and his influence must be avoided. This introduces the idea that although many things are permitted, proper guidance is necessary to discern what is truly beneficial and lawful—and that guidance comes from Allah, not from humanity’s enemy.","commentary_fi":"Tämä jae puhuttelee koko ihmiskuntaa ja antaa laajan luvan nauttia maapallon hyvistä ja sallituista asioista. Se korostaa, että Allah on luonut nämä resurssit ihmisen hyödyksi. Jae kehottaa hylkäämään ruokaan ja juomaan liittyvät tabut, jotka perustuvat taikauskoon tai järjettömiin kulttuurikäytäntöihin. Tämän sallitun luvan jälkeen jae varoittaa seuraamasta Saatanan – jota kutsutaan \"pahaksi\" – ehdotuksia. Se tuo esiin, että Saatana on ihmiskunnan selkeä ja julistettu vihollinen, jonka vaikutusta tulee välttää. Tämä johdattaa ajatukseen, että vaikka moni asia on sallittua, tarvitaan oikeaa ohjausta sen erottamiseksi, mikä on todella hyödyllistä ja sallittua – ja tämä ohjaus tulee Allahilta, ei ihmiskunnan viholliselta.","arabic":"يَا أَيُّهَا النَّاسُ كُلُوا مِمَّا فِي الْأَرْضِ حَلَالًا طَيِّبًا وَلَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ","commentary":"Tämä jae puhuttelee koko ihmiskuntaa ja antaa laajan luvan nauttia maapallon hyvistä ja sallituista asioista. Se korostaa, että Allah on luonut nämä resurssit ihmisen hyödyksi. Jae kehottaa hylkäämään ruokaan ja juomaan liittyvät tabut, jotka perustuvat taikauskoon tai järjettömiin kulttuurikäytäntöihin. Tämän sallitun luvan jälkeen jae varoittaa seuraamasta Saatanan – jota kutsutaan \"pahaksi\" – ehdotuksia. Se tuo esiin, että Saatana on ihmiskunnan selkeä ja julistettu vihollinen, jonka vaikutusta tulee välttää. Tämä johdattaa ajatukseen, että vaikka moni asia on sallittua, tarvitaan oikeaa ohjausta sen erottamiseksi, mikä on todella hyödyllistä ja sallittua – ja tämä ohjaus tulee Allahilta, ei ihmiskunnan viholliselta.","translations":{"opas":"Oi ihmiset, syökää kaikkea maan päällä, mikä on sallittua ja hyvää, älkääkä seuratko saatanan jälkiä. Hän on totisesti teidän leppymätön vihollisenne.","clear":"Oi ihmiskunta! Syökää sitä, mikä on luvallista ja hyvää maan päällä, älkääkä seuratko Saatanan jälkiä. Hän on totisesti vannoutunut vihollisenne."}},{"verse":169,"commentary_en":"Building on the previous verse, this highlights the nature of Satan's influence. It explains that Satan prompts people towards actions that are wrong and indecent. Crucially, it also warns that Satan encourages people to speak about Allah without proper knowledge. This includes making declarations about what is permissible or forbidden without divine guidance, linking the issue of lawful food (mentioned in 168) to the source of religious authority. Following Satan means stepping away from truth and proper knowledge regarding Allah's commands.","commentary_fi":"Edelliseen jakeeseen perustuen tämä korostaa Saatanan vaikutuksen luonnetta. Se selittää, että Saatana yllyttää ihmisiä vääriin ja sopimattomiin tekoihin. Ratkaisevasti se myös varoittaa, että Saatana kannustaa ihmisiä puhumaan Allahista ilman asianmukaista tietoa. Tämä sisältää julistuksia siitä, mikä on sallittua tai kiellettyä ilman jumalallista ohjausta, yhdistäen luvallisen ruoan kysymyksen (mainittu jakeessa 168) uskonnollisen auktoriteetin lähteeseen. Saatanan seuraaminen tarkoittaa poikkeamista totuudesta ja asianmukaisesta tiedosta koskien Allahin käskyjä.","arabic":"إِنَّمَا يَأْمُرُكُمْ بِالسُّوءِ وَالْفَحْشَاءِ وَأَنْ تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ","commentary":"Edelliseen jakeeseen perustuen tämä korostaa Saatanan vaikutuksen luonnetta. Se selittää, että Saatana yllyttää ihmisiä vääriin ja sopimattomiin tekoihin. Ratkaisevasti se myös varoittaa, että Saatana kannustaa ihmisiä puhumaan Allahista ilman asianmukaista tietoa. Tämä sisältää julistuksia siitä, mikä on sallittua tai kiellettyä ilman jumalallista ohjausta, yhdistäen luvallisen ruoan kysymyksen (mainittu jakeessa 168) uskonnollisen auktoriteetin lähteeseen. Saatanan seuraaminen tarkoittaa poikkeamista totuudesta ja asianmukaisesta tiedosta koskien Allahin käskyjä.","translations":{"opas":"Hän käskee teitä vain syntiin ja törkeyksiin sekä opettaa väittämään Jumalasta sitä, mitä ette tiedä.","clear":"Hän yllyttää teitä vain tekemään pahaa ja säädyttömyyttä, ja väittämään Allahista sellaista, mitä ette tiedä."}},{"verse":170,"commentary_en":"This verse presents a common human response when confronted with divine revelation: a resistance to change and a preference for tradition over guidance. It describes people who, when asked to follow what Allah has revealed (which includes guidance on what is lawful and right), choose instead to stick to the practices and beliefs they inherited from their ancestors. The verse then critically questions this attitude, asking if they would still follow their forefathers' ways even if those ways lacked wisdom and true guidance. This highlights the importance of using one's reason and seeking true guidance from Allah, rather than blindly adhering to inherited customs, especially in matters of faith and law. This connects directly to the previous verses by showing how Satan's influence can lead to rejecting revealed truth in favor of misguided traditions.","commentary_fi":"Tämä jae esittää yleisen inhimillisen reaktion kohdattaessa jumalallisen ilmoituksen: vastustuksen muutokselle ja perinteiden suosimisen ohjauksen sijaan. Se kuvaa ihmisiä, jotka, kun heitä pyydetään seuraamaan sitä, mitä Allah on ilmoittanut (mukaan lukien ohjaus siitä, mikä on luvallista ja oikein), valitsevat sen sijaan pitäytyä esi-isiltään perimissään tavoissa ja uskomuksissa. Jae kyseenalaistaa sitten kriittisesti tämän asenteen ja kysyy, seuraisivatko he yhä esi-isiensä tapoja, vaikka näillä tavoilla ei olisikaan ollut viisautta ja todellista ohjausta. Tämä korostaa oman järjen käyttämisen ja todellisen ohjauksen etsimisen tärkeyttä Allahilta, sen sijaan että sokeasti noudatettaisiin perittyjä tapoja, erityisesti uskon ja lain asioissa. Tämä yhdistyy suoraan edellisiin jakeisiin näyttämällä, kuinka Saatanan vaikutus voi johtaa ilmoitetun totuuden hylkäämiseen harhaanjohtavien perinteiden hyväksi.","arabic":"وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنْزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ","commentary":"Tämä jae esittää yleisen inhimillisen reaktion kohdattaessa jumalallisen ilmoituksen: vastustuksen muutokselle ja perinteiden suosimisen ohjauksen sijaan. Se kuvaa ihmisiä, jotka, kun heitä pyydetään seuraamaan sitä, mitä Allah on ilmoittanut (mukaan lukien ohjaus siitä, mikä on luvallista ja oikein), valitsevat sen sijaan pitäytyä esi-isiltään perimissään tavoissa ja uskomuksissa. Jae kyseenalaistaa sitten kriittisesti tämän asenteen ja kysyy, seuraisivatko he yhä esi-isiensä tapoja, vaikka näillä tavoilla ei olisikaan ollut viisautta ja todellista ohjausta. Tämä korostaa oman järjen käyttämisen ja todellisen ohjauksen etsimisen tärkeyttä Allahilta, sen sijaan että sokeasti noudatettaisiin perittyjä tapoja, erityisesti uskon ja lain asioissa. Tämä yhdistyy suoraan edellisiin jakeisiin näyttämällä, kuinka Saatanan vaikutus voi johtaa ilmoitetun totuuden hylkäämiseen harhaanjohtavien perinteiden hyväksi.","translations":{"opas":"Kun heille sanotaan: »Noudattakaa, mitä Jumala on ilmaissut», he vastaavat: »Ei, me tahdomme noudattaa niitä tapoja, jotka olemme havainneet isillämme olleen.» Entä silloinkin, kun heidän isänsä eivät mitään ymmärtäneet eivätkä olleet oikealla tiellä?","clear":"Kun heille sanotaan: ”Seuratkaa sitä, minkä Jumala on ilmoittanut,” he vastaavat: ”Emme! Me seuraamme vain sitä, mitä esi-isämme harjoittivat.” Vaikka heidän esi-isillään ei olisi ollut lainkaan ymmärrystä eikä johdatusta, seuraisivatko he yhä?"}},{"verse":171,"commentary_en":"This verse uses a powerful comparison to describe the state of those who reject faith and guidance, particularly those who cling blindly to inherited ways as mentioned in the previous verse. It likens them to animals (specifically sheep or goats) who hear only the sounds and shouts of a shepherd but do not understand the meaning or instruction behind the calls. The verse then describes them as \"deaf, dumb, and blind,\" not necessarily physically, but in terms of their inability or unwillingness to truly listen to, understand, or see the truth of divine guidance. It concludes that because of this state, they lack true wisdom or understanding of spiritual matters.","commentary_fi":"Tämä jae käyttää voimakasta vertausta kuvaamaan niiden tilaa, jotka hylkäävät uskon ja ohjauksen, erityisesti niiden, jotka sokeasti pitävät kiinni perityistä tavoista, kuten edellisessä jakeessa mainittiin. Se vertaa heitä eläimiin (erityisesti lampaisiin tai vuohiin), jotka kuulevat vain paimenen äänet ja huudot, mutta eivät ymmärrä kutsujen takana olevaa merkitystä tai ohjetta. Jae kuvaa heitä sitten \"kuuroiksi, mykiksi ja sokeiksi\", ei välttämättä fyysisesti, vaan kyvyttömyytensä tai haluttomuutensa suhteen todella kuunnella, ymmärtää tai nähdä jumalallisen ohjauksen totuutta. Se päättelee, että tämän tilan vuoksi heiltä puuttuu todellinen viisaus tai ymmärrys hengellisistä asioista.","arabic":"وَمَثَلُ الَّذِينَ كَفَرُوا كَمَثَلِ الَّذِي يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَاءً وَنِدَاءً ۚ صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَعْقِلُونَ","commentary":"Tämä jae käyttää voimakasta vertausta kuvaamaan niiden tilaa, jotka hylkäävät uskon ja ohjauksen, erityisesti niiden, jotka sokeasti pitävät kiinni perityistä tavoista, kuten edellisessä jakeessa mainittiin. Se vertaa heitä eläimiin (erityisesti lampaisiin tai vuohiin), jotka kuulevat vain paimenen äänet ja huudot, mutta eivät ymmärrä kutsujen takana olevaa merkitystä tai ohjetta. Jae kuvaa heitä sitten \"kuuroiksi, mykiksi ja sokeiksi\", ei välttämättä fyysisesti, vaan kyvyttömyytensä tai haluttomuutensa suhteen todella kuunnella, ymmärtää tai nähdä jumalallisen ohjauksen totuutta. Se päättelee, että tämän tilan vuoksi heiltä puuttuu todellinen viisaus tai ymmärrys hengellisistä asioista.","translations":{"opas":"Profeetan suhde niihin, jotka ovat uskottomia, on sama kuin sen, joka kutsuu olentoja, jotka eivät erota muuta kuin äänen ja huudon, jotka ovat kuuroja, mykkiä ja sokeita, niin etteivät mitään ymmärrä.","clear":"Uskottomien esimerkki, jotka eivät vastaa sanansaattajan varoitukseen, on kuin lauma, joka ei ymmärrä paimenen kutsuja ja huutoja. He ovat haluttomasti kuuroja, mykkiä ja sokeita, joten he eivät ymmärrä."}},{"verse":172,"commentary_en":"Shifting focus from the general address to humanity (as in verse 168) and the condition of the disbelievers (verse 171), this verse speaks specifically to the believers. It reiterates the permission to eat the \"good things\" that Allah has provided, but adds that believers must be grateful to Allah. This links the enjoyment of lawful provisions directly to the act of worship. It implies that recognizing Allah as the provider—and expressing gratitude for His blessings—is a fundamental part of truly worshipping Him alone. This verse also sets the stage for the more detailed regulations about forbidden foods that follow.","commentary_fi":"Siirtyen pois yleisestä ihmiskunnalle suunnatusta puhuttelusta (kuten jakeessa 168) ja uskottomien tilasta (jae 171), tämä jae puhuttelee erityisesti uskovia. Se toistaa luvan nauttia niistä \"hyvistä asioista\", joita Allah on antanut, mutta lisää, että uskovien on oltava kiitollisia Allahille. Tämä yhdistää sallittujen lahjojen nauttimisen suoraan palvontaan. Se merkitsee, että Allahin tunnustaminen antajaksi – ja kiitollisuuden osoittaminen Hänen siunauksistaan – on olennainen osa aitoa yksin Allahin palvomista. Tämä jae valmistaa myös tietä yksityiskohtaisemmille määräyksille kielletyistä ruoista, joita seuraavat jakeet käsittelevät.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ وَاشْكُرُوا لِلَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ","commentary":"Siirtyen pois yleisestä ihmiskunnalle suunnatusta puhuttelusta (kuten jakeessa 168) ja uskottomien tilasta (jae 171), tämä jae puhuttelee erityisesti uskovia. Se toistaa luvan nauttia niistä \"hyvistä asioista\", joita Allah on antanut, mutta lisää, että uskovien on oltava kiitollisia Allahille. Tämä yhdistää sallittujen lahjojen nauttimisen suoraan palvontaan. Se merkitsee, että Allahin tunnustaminen antajaksi – ja kiitollisuuden osoittaminen Hänen siunauksistaan – on olennainen osa aitoa yksin Allahin palvomista. Tämä jae valmistaa myös tietä yksityiskohtaisemmille määräyksille kielletyistä ruoista, joita seuraavat jakeet käsittelevät.","translations":{"opas":"Te jotka uskotte, syökää sitä hyvää, jota Me teille suonut olemme, ja kantakaa Jumalalle kiitokseksenne, jos hän on teille se, ketä todella palvelette.","clear":"Oi uskovat! Syökää niistä hyvistä asioista, jotka Me olemme teille antaneet. Ja kiittäkää Jumalaa, jos te palvelette Häntä totisesti yksin."}},{"verse":173,"commentary_en":"Following the general permission to eat lawful things and the instruction to be grateful (verse 172), this verse provides specific details about what is forbidden for believers. It lists four main categories: dead meat, blood, the flesh of swine (pigs), and meat from animals on which a name other than Allah's was invoked at the time of slaughter (For a more comprehensive enumeration of the forbidden kinds of flesh, see Sura 5:3). The verse also includes an important exception: if someone is facing necessity and has no other choice, consuming something from this list is permissible, provided it is not done out of willful disobedience or exceeding the needed amount. This highlights Allah's mercy and forgiveness, showing that the law considers difficult circumstances. The prohibition of meat sacrificed to others reinforces the central theme of worshipping Allah alone, even in the act of eating.","commentary_fi":"Seuraten yleistä lupaa syödä luvallisia asioita ja kehotusta olla kiitollinen (jae 172), tämä jae antaa erityisiä yksityiskohtia siitä, mikä on uskoville kiellettyä. Se listaa neljä pääryhmää: kuollut liha, veri, sianliha ja liha eläimistä, joiden teurastuksen yhteydessä on kutsuttu jotakin muuta nimeä kuin Allahin nimeä (Yksityiskohtaisempi luettelo kielletyistä ruuista löytyy Suurasta 5:3). Jae sisältää myös tärkeän poikkeuksen: jos joku on pakon edessä eikä hänellä ole muuta vaihtoehtoa, jotain tästä luettelosta on sallittua nauttia, edellyttäen ettei sitä tehdä tahallisesta tottelemattomuudesta tai tarvittavan määrän ylittämisestä. Tämä korostaa Allahin armoa ja anteeksiantoa osoittaen, että laki ottaa huomioon vaikeat olosuhteet. Lihan kieltäminen, joka on uhrattu muille kuin Allahille, vahvistaa keskeisen teeman yksin Allahin palvomisesta, jopa syömisen yhteydessä.","arabic":"إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنْزِيرِ وَمَا أُهِلَّ بِهِ لِغَيْرِ اللَّهِ ۖ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ","commentary":"Seuraten yleistä lupaa syödä luvallisia asioita ja kehotusta olla kiitollinen (jae 172), tämä jae antaa erityisiä yksityiskohtia siitä, mikä on uskoville kiellettyä. Se listaa neljä pääryhmää: kuollut liha, veri, sianliha ja liha eläimistä, joiden teurastuksen yhteydessä on kutsuttu jotakin muuta nimeä kuin Allahin nimeä (Yksityiskohtaisempi luettelo kielletyistä ruuista löytyy Suurasta 5:3). Jae sisältää myös tärkeän poikkeuksen: jos joku on pakon edessä eikä hänellä ole muuta vaihtoehtoa, jotain tästä luettelosta on sallittua nauttia, edellyttäen ettei sitä tehdä tahallisesta tottelemattomuudesta tai tarvittavan määrän ylittämisestä. Tämä korostaa Allahin armoa ja anteeksiantoa osoittaen, että laki ottaa huomioon vaikeat olosuhteet. Lihan kieltäminen, joka on uhrattu muille kuin Allahille, vahvistaa keskeisen teeman yksin Allahin palvomisesta, jopa syömisen yhteydessä.","translations":{"opas":"Hän on ainoastaan kieltänyt teitä syömästä itsestään kuolleen tai pedon repimän eläimen lihaa, verta, sianlihaa ja sellaista, jota teurastettaessa on mainittu jonkun toisen kuin Jumalan nimi. Mutta jos jotakuta hätä pakottaa, eikä hänellä ole siihen himoa eikä ole rikollista aikomusta, niin se ei ole mikään synti hänelle; katso, Jumala on armahtavainen ja laupias.","clear":"Hän on kieltänyt teiltä ainoastaan raadon, veren, sianlihan ja sen, mikä on teurastettu jonkun muun kuin Jumalan nimessä. Mutta jos joku on pakotettu välttämättömyydestä – ei halun ajamana eikä ylittäen välitöntä tarvetta – hän ei ole syntinen. Totisesti, Jumala on Anteeksiantava, Kaikkien Armollisin."}},{"verse":174,"commentary_en":"This verse shifts the focus once again, moving from dietary laws to a strong condemnation of those who conceal or distort the truth revealed by Allah in the divine scriptures. It describes such individuals as trading Allah’s revelations for a small worldly gain. The consequence of this act is described in powerful imagery: they are said to \"consume nothing but fire\" in their bellies. On the Day of Resurrection, Allah will neither speak to them nor purify them, signifying total rejection and severe punishment. This verse underscores the gravity of tampering with divine truth and the serious consequences that await those who do so for material benefit.","commentary_fi":"Tämä jae siirtää jälleen kerran fokuksen ruokasäädöksistä voimakkaaseen tuomioon niitä kohtaan, jotka salaavat tai vääristelevät Allahin ilmoittamaa totuutta pyhissä kirjoituksissa. Heitä kuvataan ihmisinä, jotka vaihtavat Allahin ilmestyksen mitättömään maalliseen hyötyyn. Tämän teon seuraus kuvataan voimakkaalla kuvakielellä: heidän sanotaan \"syövän vatsansa täyteen tulta\". Ylösnousemuksen päivänä Allah ei puhu heille eikä puhdista heitä, mikä merkitsee täydellistä hylkäämistä ja ankaraa rangaistusta. Jaekorostaa, kuinka vakavaa on turmella jumalallista totuutta ja kuinka raskaat seuraukset odottavat niitä, jotka tekevät niin maallisen hyödyn vuoksi.","arabic":"إِنَّ الَّذِينَ يَكْتُمُونَ مَا أَنْزَلَ اللَّهُ مِنَ الْكِتَابِ وَيَشْتَرُونَ بِهِ ثَمَنًا قَلِيلًا ۙ أُولَٰئِكَ مَا يَأْكُلُونَ فِي بُطُونِهِمْ إِلَّا النَّارَ وَلَا يُكَلِّمُهُمُ اللَّهُ يَوْمَ الْقِيَامَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ","commentary":"Tämä jae siirtää jälleen kerran fokuksen ruokasäädöksistä voimakkaaseen tuomioon niitä kohtaan, jotka salaavat tai vääristelevät Allahin ilmoittamaa totuutta pyhissä kirjoituksissa. Heitä kuvataan ihmisinä, jotka vaihtavat Allahin ilmestyksen mitättömään maalliseen hyötyyn. Tämän teon seuraus kuvataan voimakkaalla kuvakielellä: heidän sanotaan \"syövän vatsansa täyteen tulta\". Ylösnousemuksen päivänä Allah ei puhu heille eikä puhdista heitä, mikä merkitsee täydellistä hylkäämistä ja ankaraa rangaistusta. Jaekorostaa, kuinka vakavaa on turmella jumalallista totuutta ja kuinka raskaat seuraukset odottavat niitä, jotka tekevät niin maallisen hyödyn vuoksi.","translations":{"opas":"Ne, jotka salaavat jotain Pyhästä kirjasta, joka on Jumalan Ilmoitus, ja vaihtavat sen mitättömän arvoihin, eivät totisesti tule täyttämään vatsaansa muulla kuin tulella. Jumala ei ole puhuva heille Ylösnousemuksen päivänä eikä vapahtava heitä, vaan heitä odottaa tuskallinen rangaistus.","clear":"Totisesti, ne, jotka kätkevät Jumalan ilmoitukset ja vaihtavat ne katoavaan voittoon, eivät nauti muuta kuin tulta vatsaansa. Jumala ei puhu heille Tuomiopäivänä, eikä Hän puhdista heitä. Ja he kärsivät tuskallisen rangaistuksen."}},{"verse":175,"commentary_en":"Continuing the theme of the previous verse, this one highlights the terrible choice made by those who conceal or distort Allah’s revelations. Their action is described as a deliberate transaction in which they exchange Allah’s clear guidance for misguidance and error. Furthermore, they give up the opportunity for Allah’s forgiveness in return for a path that leads to suffering and torment. The verse concludes with a striking exclamation about their audacity—choosing a course that leads directly to the Fire (Hell). This underscores the immense loss they bring upon themselves by rejecting divine guidance.","commentary_fi":"Jatkaen edellisen jakeen teemaa, tämä jae tuo esiin kauhean valinnan, jonka tekevät ne, jotka salaavat tai vääristelevät Allahin ilmoituksia. Heidän tekoaan kuvataan tietoisena vaihtokauppana, jossa he vaihtavat Allahin selkeän johdatuksen harhaan ja eksytykseen. Lisäksi he hylkäävät mahdollisuuden Allahin anteeksiantoon ja valitsevat sen sijaan tien, joka johtaa kärsimykseen ja rangaistukseen. Jae päättyy voimakkaaseen huudahdukseen heidän röyhkeydestään—siitä, että he valitsevat suunnan, joka vie suoraan Tuleen (Helvettiin). Tämä korostaa valtavaa tappiota, jonka he aiheuttavat itselleen hylätessään jumalallisen johdatuksen.","arabic":"أُولَٰئِكَ الَّذِينَ اشْتَرَوُا الضَّلَالَةَ بِالْهُدَىٰ وَالْعَذَابَ بِالْمَغْفِرَةِ ۚ فَمَا أَصْبَرَهُمْ عَلَى النَّارِ","commentary":"Jatkaen edellisen jakeen teemaa, tämä jae tuo esiin kauhean valinnan, jonka tekevät ne, jotka salaavat tai vääristelevät Allahin ilmoituksia. Heidän tekoaan kuvataan tietoisena vaihtokauppana, jossa he vaihtavat Allahin selkeän johdatuksen harhaan ja eksytykseen. Lisäksi he hylkäävät mahdollisuuden Allahin anteeksiantoon ja valitsevat sen sijaan tien, joka johtaa kärsimykseen ja rangaistukseen. Jae päättyy voimakkaaseen huudahdukseen heidän röyhkeydestään—siitä, että he valitsevat suunnan, joka vie suoraan Tuleen (Helvettiin). Tämä korostaa valtavaa tappiota, jonka he aiheuttavat itselleen hylätessään jumalallisen johdatuksen.","translations":{"opas":"Nämä ovat niitä, jotka harhaan käyden ovat Johdatuksesta luopuneet ja vaihtaneet anteeksiannon rangaistukseen; kuinka itsepintaisesta he pyrkivätkään Tuleen!","clear":"He ovat niitä, jotka vaihtavat johdatuksen harhaanjohtamiseen ja anteeksiannon rangaistukseen. Kuinka sinnikkäitä he ovatkaan tulen tavoittelussa!"}},{"verse":176,"commentary_en":"This verse explains the reason for the severe outcome described in the previous verses. It states that the punishment awaits those who reject guidance and distort truth because Allah sent down His Book with truth and without doubt. However, instead of accepting this truth, some people actively look for ways to dispute or create disagreements within it. This behavior leads them into a state of deep division. The verse highlights that rejecting or disputing the clear truth of Allah's revealed word leads to being fundamentally misguided and distant from the intended path.","commentary_fi":"Tämä jae selittää syyn edellisissä jakeissa kuvatulle vakavalle lopputulokselle. Se toteaa, että rangaistus odottaa niitä, jotka hylkäävät ohjauksen ja vääristävät totuutta, koska Allah lähetti Kirjansa totuuden kanssa ja epäilyksettä. Kuitenkin, sen sijaan että hyväksyisivät tämän totuuden, jotkut ihmiset aktiivisesti etsivät tapoja kiistellä tai luoda erimielisyyksiä Kirjan sisällä. Tämä käytös johtaa heidät syvään hajaannukseen. Jae korostaa, että Allahin ilmoittaman sanan selkeän totuuden hylkääminen tai kiistäminen johtaa perusteelliseen harhaan ja etääntymiseen tarkoitetulta polulta.","arabic":"ذَٰلِكَ بِأَنَّ اللَّهَ نَزَّلَ الْكِتَابَ بِالْحَقِّ ۗ وَإِنَّ الَّذِينَ اخْتَلَفُوا فِي الْكِتَابِ لَفِي شِقَاقٍ بَعِيدٍ","commentary":"Tämä jae selittää syyn edellisissä jakeissa kuvatulle vakavalle lopputulokselle. Se toteaa, että rangaistus odottaa niitä, jotka hylkäävät ohjauksen ja vääristävät totuutta, koska Allah lähetti Kirjansa totuuden kanssa ja epäilyksettä. Kuitenkin, sen sijaan että hyväksyisivät tämän totuuden, jotkut ihmiset aktiivisesti etsivät tapoja kiistellä tai luoda erimielisyyksiä Kirjan sisällä. Tämä käytös johtaa heidät syvään hajaannukseen. Jae korostaa, että Allahin ilmoittaman sanan selkeän totuuden hylkääminen tai kiistäminen johtaa perusteelliseen harhaan ja etääntymiseen tarkoitetulta polulta.","translations":{"opas":"ja tämä tapahtuu siksi, että Jumala on lähettänyt Kirjan, joka sisältää totuuden; ne jotka rakentavat riitoja tämän Kirjan johdosta, menevät pitkälle uhmassa.","clear":"Se johtuu siitä, että Jumala on ilmoittanut Kirjan totuudessa. Ja totisesti ne, jotka ovat eri mieltä siitä, ovat täysin uppoutuneita vastustukseen."}},{"verse":177,"commentary_en":"This concluding verse provides a comprehensive definition of true righteousness. It states clearly that righteousness is not merely about physical acts like facing a certain direction during prayer. Instead, it is grounded in core beliefs: faith in Allah, the Last Day (day of judgment), the angels, all the divine Books, and all of Allah's Messengers. Following these beliefs, true righteousness manifests in significant actions: spending one's wealth (even though it is cherished) to help relatives, orphans, the poor, stranded travelers, those who ask for help, and for freeing captives. It also includes consistently performing prayer and giving *zakat* (a form of mandatory charity), fulfilling promises and contracts, and demonstrating firmness and patience during difficult times, suffering, and fear. The verse concludes by identifying those who embody these beliefs and actions as the \"people of truth\" and those who are truly conscious of Allah and fear displeasing Him. This verse summarizes the essence of faith and good conduct as a unified path to righteousness, combining inner conviction with outward action for the benefit of oneself and society.","commentary_fi":"Tämä päätösjae antaa kattavan määritelmän todelliselle vanhurskaudelle. Se toteaa selvästi, että vanhurskaus ei ole vain fyysisiä tekoja, kuten kasvojen kääntäminen tiettyyn suuntaan rukouksen aikana. Sen sijaan se perustuu keskeisiin uskomuksiin: uskoon Allahiin, Viimeiseen Päivään (tuomiopäivä), enkeleihin, kaikkiin jumalallisiin Kirjoihin ja kaikkiin Allahin Sanansaattajiin. Näiden uskomusten jälkeen todellinen vanhurskaus ilmenee merkittävissä teoissa: varallisuuden (vaikka se on arvostettua) antamisessa sukulaisten, orpojen, köyhien, matkalla pulaan joutuneiden, apua pyytävien ja vankien vapauttamisen auttamiseksi. Se sisältää myös rukouksen jatkuvan suorittamisen ja *zakat'in* (pakollisen almuveron) antamisen, tehtyjen sopimusten ja lupausten täyttämisen sekä lujuuden ja kärsivällisyyden osoittamisen vaikeina aikoina, kärsimyksessä ja pelossa. Jae päättyy identifioimalla ne, jotka ilmentävät näitä uskomuksia ja tekoja \"totuuden ihmisiksi\" ja niiksi, jotka ovat todella tietoisia Allahista ja pelkäävät Hänen mielensä pahoittamista. Tämä jae tiivistää uskon ja hyvän käytöksen olemuksen yhtenäisenä polkuna vanhurskauteen, yhdistäen sisäisen vakaumuksen ulkoiseen toimintaan itsensä ja yhteiskunnan hyväksi.","arabic":"لَيْسَ الْبِرَّ أَنْ تُوَلُّوا وُجُوهَكُمْ قِبَلَ الْمَشْرِقِ وَالْمَغْرِبِ وَلَٰكِنَّ الْبِرَّ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَالْمَلَائِكَةِ وَالْكِتَابِ وَالنَّبِيِّينَ وَآتَى الْمَالَ عَلَىٰ حُبِّهِ ذَوِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينَ وَابْنَ السَّبِيلِ وَالسَّائِلِينَ وَفِي الرِّقَابِ وَأَقَامَ الصَّلَاةَ وَآتَى الزَّكَاةَ وَالْمُوفُونَ بِعَهْدِهِمْ إِذَا عَاهَدُوا ۖ وَالصَّابِرِينَ فِي الْبَأْسَاءِ وَالضَّرَّاءِ وَحِينَ الْبَأْسِ ۗ أُولَٰئِكَ الَّذِينَ صَدَقُوا ۖ وَأُولَٰئِكَ هُمُ الْمُتَّقُونَ","commentary":"Tämä päätösjae antaa kattavan määritelmän todelliselle vanhurskaudelle. Se toteaa selvästi, että vanhurskaus ei ole vain fyysisiä tekoja, kuten kasvojen kääntäminen tiettyyn suuntaan rukouksen aikana. Sen sijaan se perustuu keskeisiin uskomuksiin: uskoon Allahiin, Viimeiseen Päivään (tuomiopäivä), enkeleihin, kaikkiin jumalallisiin Kirjoihin ja kaikkiin Allahin Sanansaattajiin. Näiden uskomusten jälkeen todellinen vanhurskaus ilmenee merkittävissä teoissa: varallisuuden (vaikka se on arvostettua) antamisessa sukulaisten, orpojen, köyhien, matkalla pulaan joutuneiden, apua pyytävien ja vankien vapauttamisen auttamiseksi. Se sisältää myös rukouksen jatkuvan suorittamisen ja *zakat'in* (pakollisen almuveron) antamisen, tehtyjen sopimusten ja lupausten täyttämisen sekä lujuuden ja kärsivällisyyden osoittamisen vaikeina aikoina, kärsimyksessä ja pelossa. Jae päättyy identifioimalla ne, jotka ilmentävät näitä uskomuksia ja tekoja \"totuuden ihmisiksi\" ja niiksi, jotka ovat todella tietoisia Allahista ja pelkäävät Hänen mielensä pahoittamista. Tämä jae tiivistää uskon ja hyvän käytöksen olemuksen yhtenäisenä polkuna vanhurskauteen, yhdistäen sisäisen vakaumuksen ulkoiseen toimintaan itsensä ja yhteiskunnan hyväksi.","translations":{"opas":"Hurskautta ei ole se, että käännätte kasvonne Itään tai Länteen, vaan hurskaita ovat ne, jotka uskovat Jumalaan ja Viimeiseen päivään, enkeleihin, Pyhään kirjaan ja profeettoihin ja rakkaudesta Häneen antavat omaisuudestaan omaisilleen, orvoille, köyhille, vaeltajille, kerjäläisille ja orjien vapauttamiseksi sekä harrastavat oikeata rukouselämää, antavat almuja, tehtyään jonkun sopimuksen täyttävät sen, jotka ovat kärsivällisiä ahdistuksessa, vastoinkäymisessä ja puutteen aikana; nämä ovat niitä, jotka ovat vanhurskaita, niin, nämä ovat jumalaapelkääväisiä.","clear":"Vanhurskaus ei ole sitä, että käännytte kasvonne itään tai länteen. Vaan vanhurskaita ovat ne, jotka uskovat Allahiin, Viimeiseen päivään, enkeleihin, kirjoihin ja profeettoihin; jotka antavat hyväntekeväisyyttä rakkaasta omaisuudestaan sukulaisille, orvoille, köyhille, (avuntarpeessa oleville) matkustajille, kerjäläisille ja vankien vapauttamiseksi; jotka pitävät rukouksen, maksavat almuveron ja pitävät antamansa lupaukset; ja jotka ovat kärsivällisiä kärsimyksen, vastoinkäymisten ja taistelun (kuumuudessa) aikoina. Juuri he ovat totuudenmukaisia (uskossaan), ja juuri he ovat tietoisia (Allahista)."}},{"verse":178,"commentary_en":"This verse instructs believers on the principle of qisās—just retribution—in cases of unlawful killing. It emphasizes proportional justice, originally expressed as a free person for a free person, a slave for a slave, and a woman for a woman, reflecting the legal norms of that time. Yet, Allah’s mercy offers a compassionate alternative: if the victim’s family chooses to forgive and accept diyah (financial compensation), this path is both legitimate and honorable. In such cases, the family should seek compensation with fairness, and the offender must pay it promptly and respectfully. This option serves to prevent further bloodshed and encourage reconciliation. The verse warns that any violation of this agreement—through injustice or renewed aggression—will bring severe consequences. Ultimately, this law reflects a balance between justice and mercy, central to building a morally upright and orderly society.","commentary_fi":"Tämä jae ohjeistaa uskovia qisāsin eli oikeudenmukaisen koston periaatteesta laittoman tappamisen tapauksissa. Se korostaa suhteellista oikeudenmukaisuutta, joka ilmaistaan alun perin muotoilulla: vapaa henkilö vapaasta, orja orjasta ja nainen naisesta, mikä heijastaa sen ajan oikeudellisia normeja. Kuitenkin Allahin armo tarjoaa myötätuntoisen vaihtoehdon: jos uhrin perhe päättää antaa anteeksi ja hyväksyä diyahin (taloudellisen korvauksen), tämä tie on sekä sallittu että kunnioitettava. Tällaisessa tapauksessa uhrin perheen tulisi hakea korvausta oikeudenmukaisesti, ja tekijän on maksettava se viipymättä ja arvokkaasti. Tämä vaihtoehto estää lisäverenvuodatusta ja rohkaisee sovintoon. Jaekehottaa myös, että jos joku rikkoo tätä sopimusta – toimien epäoikeudenmukaisesti tai väkivaltaisesti sovinnon jälkeen – hän kohtaa vakavan rangaistuksen. Laki heijastaa oikeuden ja armon tasapainoa, joka on keskeinen moraalisen ja järjestäytyneen yhteiskunnan rakentamisessa.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى ۖ الْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالْأُنْثَىٰ بِالْأُنْثَىٰ ۚ فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ شَيْءٌ فَاتِّبَاعٌ بِالْمَعْرُوفِ وَأَدَاءٌ إِلَيْهِ بِإِحْسَانٍ ۗ ذَٰلِكَ تَخْفِيفٌ مِنْ رَبِّكُمْ وَرَحْمَةٌ ۗ فَمَنِ اعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُ عَذَابٌ أَلِيمٌ","commentary":"Tämä jae ohjeistaa uskovia qisāsin eli oikeudenmukaisen koston periaatteesta laittoman tappamisen tapauksissa. Se korostaa suhteellista oikeudenmukaisuutta, joka ilmaistaan alun perin muotoilulla: vapaa henkilö vapaasta, orja orjasta ja nainen naisesta, mikä heijastaa sen ajan oikeudellisia normeja. Kuitenkin Allahin armo tarjoaa myötätuntoisen vaihtoehdon: jos uhrin perhe päättää antaa anteeksi ja hyväksyä diyahin (taloudellisen korvauksen), tämä tie on sekä sallittu että kunnioitettava. Tällaisessa tapauksessa uhrin perheen tulisi hakea korvausta oikeudenmukaisesti, ja tekijän on maksettava se viipymättä ja arvokkaasti. Tämä vaihtoehto estää lisäverenvuodatusta ja rohkaisee sovintoon. Jaekehottaa myös, että jos joku rikkoo tätä sopimusta – toimien epäoikeudenmukaisesti tai väkivaltaisesti sovinnon jälkeen – hän kohtaa vakavan rangaistuksen. Laki heijastaa oikeuden ja armon tasapainoa, joka on keskeinen moraalisen ja järjestäytyneen yhteiskunnan rakentamisessa.","translations":{"opas":"Teille, jotka uskotte, on määrätty verenkosto murhatapauksissa: vapaa mies vapaasta, orja orjasta ja nainen naisesta, mutta jos joku saa sen jotenkin muuten anteeksi (loukatulta) veljeltä, on se järjestettävä asianmukaisella tavalla ja hyvitettävä runsaalla mitalla.","clear":"Oi uskovaiset! (Laki) kostosta on asetettu teille murhatapauksissa – vapaa mies vapaasta miehestä, orja orjasta ja nainen naisesta. Mutta jos uhri on antanut anteeksi rikoksentekijälle, silloin veriraha on päätettävä oikeudenmukaisesti ja maksu on suoritettava kohteliaasti. Tämä on myönnytys ja armo Herraltanne. Mutta kuka tahansa rikkoo sen jälkeen, tulee kärsimään tuskallisen rangaistuksen."}},{"verse":179,"commentary_en":"Following the previous verse which outlines the law of just retribution (qisas), this verse explains the profound wisdom behind it. It teaches that this law, seemingly about taking a life, actually serves to preserve life for the community as a whole. It achieves this by acting as a strong deterrent against murder; when someone knows the penalty for taking a life is the loss of their own, they are more likely to refrain. Furthermore, by allowing the victim's family justice or compensation, it prevents cycles of endless revenge and vendettas that could lead to many more deaths, as historically happened in some societies. The verse calls upon people of understanding to reflect on this wisdom. Ultimately, the aim is to encourage self-restraint and God-consciousness (taqwa), which acts as an inner safeguard against committing such crimes in the first place and against seeking excessive revenge. This verse highlights how divine law benefits humanity by promoting both justice and the sanctity of life, reinforcing the connection between social order and individual accountability to Allah.","commentary_fi":"Jatkaen edellistä jaetta, joka hahmottelee oikeudenmukaisen koston lain (*qisas*), tämä jae selittää sen syvällisen viisauden. Se opettaa, että tämä laki, joka näyttää koskevan hengen ottamista, itse asiassa palvelee yhteisön elämän säilyttämistä kokonaisuutena. Se saavuttaa tämän toimimalla vahvana pelotteena murhaa vastaan; kun joku tietää rangaistuksen hengen ottamisesta olevan oman hengen menettäminen, he todennäköisemmin pidättäytyvät. Lisäksi antamalla uhrin perheelle oikeuden tai korvauksen, se estää loputtomia koston kierteitä ja verikostoja, jotka voisivat johtaa moniin muihin kuolemiin, kuten historiallisesti on tapahtunut joissakin yhteiskunnissa. Jae kehottaa ymmärtäväisiä ihmisiä pohtimaan tätä viisautta. Lopulta tavoitteena on rohkaista itsehillintää ja Jumalan tietoisuutta (*taqwa*), joka toimii sisäisenä suojelijana tällaisten rikosten tekemistä ja liiallisen koston tavoittelua vastaan. Tämä jae korostaa, kuinka jumalallinen laki hyödyttää ihmiskuntaa edistämällä sekä oikeudenmukaisuutta että elämän pyhyyttä, vahvistaen yhteyttä sosiaalisen järjestyksen ja yksilön vastuullisuuden välillä Allahille.","arabic":"وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تَتَّقُونَ","commentary":"Jatkaen edellistä jaetta, joka hahmottelee oikeudenmukaisen koston lain (*qisas*), tämä jae selittää sen syvällisen viisauden. Se opettaa, että tämä laki, joka näyttää koskevan hengen ottamista, itse asiassa palvelee yhteisön elämän säilyttämistä kokonaisuutena. Se saavuttaa tämän toimimalla vahvana pelotteena murhaa vastaan; kun joku tietää rangaistuksen hengen ottamisesta olevan oman hengen menettäminen, he todennäköisemmin pidättäytyvät. Lisäksi antamalla uhrin perheelle oikeuden tai korvauksen, se estää loputtomia koston kierteitä ja verikostoja, jotka voisivat johtaa moniin muihin kuolemiin, kuten historiallisesti on tapahtunut joissakin yhteiskunnissa. Jae kehottaa ymmärtäväisiä ihmisiä pohtimaan tätä viisautta. Lopulta tavoitteena on rohkaista itsehillintää ja Jumalan tietoisuutta (*taqwa*), joka toimii sisäisenä suojelijana tällaisten rikosten tekemistä ja liiallisen koston tavoittelua vastaan. Tämä jae korostaa, kuinka jumalallinen laki hyödyttää ihmiskuntaa edistämällä sekä oikeudenmukaisuutta että elämän pyhyyttä, vahvistaen yhteyttä sosiaalisen järjestyksen ja yksilön vastuullisuuden välillä Allahille.","translations":{"opas":"Tämä on lievitys ja laupeudenosoitus Herraltamme, mutta sitä, joka tämän jälkeen rikkoo, odottaa tuskallinen rangaistus. Verenkosto varjelee teidän henkeänne, jotta te, joilla on ymmärrystä, karttaisitte pahaa.","clear":"Teille on (turvaa) elämästä (lain) kostossa, oi järkevillä varustetut ihmiset, jotta teistä tulisi tietoisia (Allahista)."}},{"verse":180,"commentary_en":"Continuing the theme of social responsibilities, this verse provides guidance regarding personal wills and inheritance. It states that when a Muslim is nearing death and has property, it is a duty to make a will or bequest (wasiyyah). This will should be in favor of parents and close relatives, to be managed according to fair and reasonable customs. At the time this verse was revealed, specific shares of inheritance had not yet been mandated. Later verses in the Qur'an established fixed shares for parents and other close relatives, making them legal heirs who receive inheritance directly by law. Therefore, this instruction came to apply primarily to relatives who are *not* direct legal heirs under Islamic inheritance law. Making a will for such relatives is seen as a way to strengthen family ties and ensure that those who might otherwise receive nothing are also provided for, reflecting compassion and fairness. This obligation is described as a duty for those who are God-conscious (Allah-fearing), linking proper handling of wealth and family responsibilities to one's relationship with Allah.","commentary_fi":"Jatkaen sosiaalisten vastuiden teemaa, tämä jae antaa ohjeita henkilökohtaisista testamenteista ja perinnöstä. Se toteaa, että kun muslimi lähestyy kuolemaa ja hänellä on omaisuutta, on velvollisuus tehdä testamentti (*wasiyyah*). Tämän testamentin tulisi olla vanhempien ja lähiomaisten hyväksi, hoidettuna kohtuullisten tapojen mukaisesti. Aikana, jolloin tämä jae ilmoitettiin, tiettyjä perintöosuuksia ei ollut vielä määrätty. Myöhemmät jakeet Koraanissa määräsivät kiinteät osuudet vanhemmille ja muille lähiomaisille, tehden heistä laillisia perillisiä, jotka saavat perintönsä suoraan lain nojalla. Siksi tämä ohje koski ensisijaisesti sukulaisia, jotka *eivät* ole suoria laillisia perillisiä islamilaisen perintölain mukaan. Testamentin tekeminen tällaisille sukulaisille nähdään tapana vahvistaa perhesiteitä ja varmistaa, että nekin, jotka muuten eivät saisi mitään, tulevat toimeen, heijastaen myötätuntoa ja oikeudenmukaisuutta. Tämä velvoite kuvataan Jumalaa pelkäävien (*Allah-fearing*) velvollisuudeksi, yhdistäen varallisuuden ja perhevelvollisuuksien asianmukaisen hoitamisen suhteeseen Allahiin.","arabic":"كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ إِنْ تَرَكَ خَيْرًا الْوَصِيَّةُ لِلْوَالِدَيْنِ وَالْأَقْرَبِينَ بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُتَّقِينَ","commentary":"Jatkaen sosiaalisten vastuiden teemaa, tämä jae antaa ohjeita henkilökohtaisista testamenteista ja perinnöstä. Se toteaa, että kun muslimi lähestyy kuolemaa ja hänellä on omaisuutta, on velvollisuus tehdä testamentti (*wasiyyah*). Tämän testamentin tulisi olla vanhempien ja lähiomaisten hyväksi, hoidettuna kohtuullisten tapojen mukaisesti. Aikana, jolloin tämä jae ilmoitettiin, tiettyjä perintöosuuksia ei ollut vielä määrätty. Myöhemmät jakeet Koraanissa määräsivät kiinteät osuudet vanhemmille ja muille lähiomaisille, tehden heistä laillisia perillisiä, jotka saavat perintönsä suoraan lain nojalla. Siksi tämä ohje koski ensisijaisesti sukulaisia, jotka *eivät* ole suoria laillisia perillisiä islamilaisen perintölain mukaan. Testamentin tekeminen tällaisille sukulaisille nähdään tapana vahvistaa perhesiteitä ja varmistaa, että nekin, jotka muuten eivät saisi mitään, tulevat toimeen, heijastaen myötätuntoa ja oikeudenmukaisuutta. Tämä velvoite kuvataan Jumalaa pelkäävien (*Allah-fearing*) velvollisuudeksi, yhdistäen varallisuuden ja perhevelvollisuuksien asianmukaisen hoitamisen suhteeseen Allahiin.","translations":{"opas":"Teille on määrätty, että kun joku teistä on kuolemansairaana ja jättää jälkeensä jotakin omaisuutta, niin hän laatikoon rehellisesti testamentin vanhempien ja lähimpien omaisten hyväksi. Tämä on kaikkien pahaa karttavien velvollisuus.","clear":"On määrätty, että kun kuolema lähestyy ketä tahansa teistä – jos he jättävät jotain arvokasta – on tehtävä testamentti vanhempien ja lähisukulaisten hyväksi oikeudenmukaisesti. (Tämä on) velvollisuus niille, jotka ovat tietoisia (Allahista)."}},{"verse":181,"commentary_en":"This verse addresses the integrity of the will mentioned in the previous verse. It warns that if a person who has knowledge of a will changes its contents after the death of the person who made it, the sin and responsibility for that alteration fall entirely upon the one who makes the change. The deceased person, having fulfilled their duty by making the will, bears no blame for subsequent unauthorized modifications. The verse reinforces this by stating that Allah hears everything and knows everything. This means Allah is aware of the original intentions of the testator, the actions of those who tamper with the will, and all hidden matters. Muslims believe that Allah's attributes, like hearing and knowing all things, are affirmed as they appear in the Qur'an, without likening Allah to His creation or explaining how they occur. Rather, they reflect His majesty and uniqueness in a way beyond human comprehension. This serves as
