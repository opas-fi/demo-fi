minder that the reckoning is inevitable and will be carried out with absolute fairness and precision. This encourages believers to live with awareness of Allah, and to strive sincerely for what is truly lasting and beneficial—in both their worldly life and their eternal one.","commentary_fi":"Tämä jae korostaa palkkiota niille, jotka omaksuvat edellisessä jakeessa kuvatun tasapainoisen näkökulman – niille, jotka tavoittelevat hyvää sekä tässä maailmassa että Tuonpuoleisessa. Jae lupaa, että tällaiset ihmiset saavat palkkionsa molemmissa maailmoissa, mikä heijastaa Allahin oikeudenmukaisuutta ja anteliaisuutta. Jae kuvaa myös Allahia \"nopeaksi tilinteossa\", mikä toimii voimakkaana muistutuksena siitä, että tilinteko on väistämätön ja toteutetaan täydellisellä oikeudenmukaisuudella ja tarkkuudella. Tämä kehottaa uskovia elämään Allahin tietoisuudessa ja pyrkimään vilpittömästi kohti sitä, mikä on todellista, kestävää ja hyödyllistä – sekä tässä maailmassa että ikuisuudessa.","arabic":"أُولَٰئِكَ لَهُمْ نَصِيبٌ مِمَّا كَسَبُوا ۚ وَاللَّهُ سَرِيعُ الْحِسَابِ","commentary":"Tämä jae korostaa palkkiota niille, jotka omaksuvat edellisessä jakeessa kuvatun tasapainoisen näkökulman – niille, jotka tavoittelevat hyvää sekä tässä maailmassa että Tuonpuoleisessa. Jae lupaa, että tällaiset ihmiset saavat palkkionsa molemmissa maailmoissa, mikä heijastaa Allahin oikeudenmukaisuutta ja anteliaisuutta. Jae kuvaa myös Allahia \"nopeaksi tilinteossa\", mikä toimii voimakkaana muistutuksena siitä, että tilinteko on väistämätön ja toteutetaan täydellisellä oikeudenmukaisuudella ja tarkkuudella. Tämä kehottaa uskovia elämään Allahin tietoisuudessa ja pyrkimään vilpittömästi kohti sitä, mikä on todellista, kestävää ja hyödyllistä – sekä tässä maailmassa että ikuisuudessa.","translations":{"opas":"Näille on varattu osansa siitä, mitä ovat ansainneet, sillä Jumala on nopea tilinteossa.","clear":"Juuri he saavat ˹taivaallisen˺ palkinnon hyvästä, mitä ovat tehneet. Varmasti Allah on nopea tilinteossa."}},{"verse":203,"commentary_en":"Continuing the theme of remembering Allah after the main pilgrimage rites, this verse refers to specific days following the Day of Sacrifice (the 10th of Dhu’l-Hijjah), often spent in Mina for rituals like stoning the pillars. It instructs pilgrims to continue remembering Allah during these \"Appointed Days.\" It provides flexibility regarding the duration of stay in Mina; a pilgrim can leave after two days or stay longer, and neither is wrong, provided that their actions are motivated by a conscious desire to do what is right and remain aware of Allah. The verse concludes with a powerful reminder to remain conscious of Allah and to remember that everyone will ultimately be gathered before Him. This serves as an overarching principle for all actions, emphasizing accountability and the return to the Creator.","commentary_fi":"Jatkaen teemaa Allahin muistamisesta pyhiinvaelluksen päärituaalien jälkeen, tämä jae viittaa erityisiin päiviin Uhripäivän (Dhu’l-Hijjahin 10. päivä) jälkeen, jotka usein vietetään Minassa rituaaleissa kuten pylväiden kivittämisessä. Se ohjaa pyhiinvaeltajia jatkamaan Allahin muistamista näinä \"määrättyinä päivinä\". Se tarjoaa joustavuutta Minassa oleskelun kestoon nähden; pyhiinvaeltaja voi lähteä kahden päivän jälkeen tai jäädä pidemmäksi aikaa, eikä kumpikaan ole väärin, edellyttäen että heidän tekonsa motivoituvat tietoisesta halusta tehdä oikein ja pysyä tietoisina Allahista. Jae päättyy voimakkaaseen muistutukseen pysyä tietoisena Allahista ja muistaa, että kaikki kootaan lopulta Hänen eteensä. Tämä toimii yleisenä periaatteena kaikille teoille, korostaen vastuullisuutta ja paluuta Luojaan.","arabic":"وَاذْكُرُوا اللَّهَ فِي أَيَّامٍ مَعْدُودَاتٍ ۚ فَمَنْ تَعَجَّلَ فِي يَوْمَيْنِ فَلَا إِثْمَ عَلَيْهِ وَمَنْ تَأَخَّرَ فَلَا إِثْمَ عَلَيْهِ ۚ لِمَنِ اتَّقَىٰ ۗ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّكُمْ إِلَيْهِ تُحْشَرُونَ","commentary":"Jatkaen teemaa Allahin muistamisesta pyhiinvaelluksen päärituaalien jälkeen, tämä jae viittaa erityisiin päiviin Uhripäivän (Dhu’l-Hijjahin 10. päivä) jälkeen, jotka usein vietetään Minassa rituaaleissa kuten pylväiden kivittämisessä. Se ohjaa pyhiinvaeltajia jatkamaan Allahin muistamista näinä \"määrättyinä päivinä\". Se tarjoaa joustavuutta Minassa oleskelun kestoon nähden; pyhiinvaeltaja voi lähteä kahden päivän jälkeen tai jäädä pidemmäksi aikaa, eikä kumpikaan ole väärin, edellyttäen että heidän tekonsa motivoituvat tietoisesta halusta tehdä oikein ja pysyä tietoisina Allahista. Jae päättyy voimakkaaseen muistutukseen pysyä tietoisena Allahista ja muistaa, että kaikki kootaan lopulta Hänen eteensä. Tämä toimii yleisenä periaatteena kaikille teoille, korostaen vastuullisuutta ja paluuta Luojaan.","translations":{"opas":"Muistelkaa Jumalaa määrättyinä päivinä. Jos joku rientää paria päivää varhemmin, niin ei hänelle sitä viaksi lueta, tai jos joku viivähtää, ei hänellekään sitä syyksi lueta, kunhan hän vain karttaa pahaa. Täyttäkää velvollisuutenne Jumalaa kohtaan ja tietäkää, että teidät kootaan Hänen luokseen.","clear":"Muistakaa Jumalaa ˹näinä˺ määrättyinä päivinä. Joka lähtee nopeasti toisena päivänä, ei tee syntiä, eivätkä ne, jotka jäävät jälkeen ˹kolmanteen asti – tavoitellen lisäpalkkiota˺, niin kauan kuin he ovat tietoisia ˹Herrastaan˺. Ja olkaa tietoisia Jumalasta, ja tietäkää, että Hänen luokseen teidät ˹kaikki˺ kootaan."}},{"verse":204,"commentary_en":"This verse introduces a type of person who is very appealing in their speech. They might sound sincere and even invoke Allah to affirm their inner thoughts or intentions. However, the verse reveals that despite their outward charm, they are in reality the most hostile of adversaries. This highlights the importance of looking beyond smooth words to understand a person's true nature and intentions.","commentary_fi":"Tämä jae esittelee henkilötyypin, jonka puheet voivat olla hyvin kiehtovia. He saattavat kuulostaa vilpittömiltä ja jopa vedota Allahiin vahvistaakseen sisäiset ajatuksensa tai aikeensa. Jae kuitenkin paljastaa, että huolimatta ulkoisesta charmistaan he ovat todellisuudessa kaikkein vihamielisimpiä vastustajia. Tämä korostaa sitä, miten tärkeää on katsoa hienojen sanojen tuolle puolen ymmärtääkseen ihmisen todellisen luonteen ja aikeet.","arabic":"وَمِنَ النَّاسِ مَنْ يُعْجِبُكَ قَوْلُهُ فِي الْحَيَاةِ الدُّنْيَا وَيُشْهِدُ اللَّهَ عَلَىٰ مَا فِي قَلْبِهِ وَهُوَ أَلَدُّ الْخِصَامِ","commentary":"Tämä jae esittelee henkilötyypin, jonka puheet voivat olla hyvin kiehtovia. He saattavat kuulostaa vilpittömiltä ja jopa vedota Allahiin vahvistaakseen sisäiset ajatuksensa tai aikeensa. Jae kuitenkin paljastaa, että huolimatta ulkoisesta charmistaan he ovat todellisuudessa kaikkein vihamielisimpiä vastustajia. Tämä korostaa sitä, miten tärkeää on katsoa hienojen sanojen tuolle puolen ymmärtääkseen ihmisen todellisen luonteen ja aikeet.","translations":{"opas":"Ihmisten joukosta tapaat sellaisenkin, jonka puhe maallisesta elämästä miellyttää sinua ja joka kutsuu Jumalaa sen todistajaksi, mikä on hänen sydämessään, vaikka hän onkin sitkein vastustajasi.","clear":"On olemassa joitakin ˹tekopyhiä˺, jotka tekevät teihin vaikutuksen näkemyksillään maallisista asioista ja julkisesti vetoavat Jumalaan todistajaksi sille, mitä heidän sydämessään on, mutta he ovat pahimpia vastustajianne."}},{"verse":205,"commentary_en":"Following on from the description in the previous verse, this verse describes the actions of the deceptive person when they are not directly facing you or are in a position of influence. It explains that their hidden hostility manifests as actively seeking to spread corruption, harm, and destruction in society, impacting even basic life like agriculture and livestock. This is strongly condemned, as Allah does not approve of mischief or corruption.","commentary_fi":"Jatkumona edellisen jakeen kuvaukselle, tämä jae kuvailee petollisen henkilön tekoja, kun he eivät ole suoraan sinua vastapäätä tai ovat vaikutusvaltaisessa asemassa. Se selittää, että heidän piilotettu vihamielisyytensä ilmenee aktiivisena pyrkimyksenä levittää turmelusta, vahinkoa ja tuhoa yhteiskunnassa, vaikuttaen jopa perustavanlaatuisiin elämänmuotoihin, kuten maanviljelyyn ja karjaan. Tämä tuomitaan voimakkaasti, sillä Allah ei rakasta turmelusta tai pahuutta.","arabic":"وَإِذَا تَوَلَّىٰ سَعَىٰ فِي الْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ الْحَرْثَ وَالنَّسْلَ ۗ وَاللَّهُ لَا يُحِبُّ الْفَسَادَ","commentary":"Jatkumona edellisen jakeen kuvaukselle, tämä jae kuvailee petollisen henkilön tekoja, kun he eivät ole suoraan sinua vastapäätä tai ovat vaikutusvaltaisessa asemassa. Se selittää, että heidän piilotettu vihamielisyytensä ilmenee aktiivisena pyrkimyksenä levittää turmelusta, vahinkoa ja tuhoa yhteiskunnassa, vaikuttaen jopa perustavanlaatuisiin elämänmuotoihin, kuten maanviljelyyn ja karjaan. Tämä tuomitaan voimakkaasti, sillä Allah ei rakasta turmelusta tai pahuutta.","translations":{"opas":"Ja niin pian kuin hän on kääntänyt selkänsä, kiiruhtaa hän saamaan aikaan pahennusta tässä maassa ja levittämään jumalattomuutta turmellakseen sekä kylvöt että karjan, mutta Jumala ei rakasta pahuutta.","clear":"Ja kun he lähtevät ˹luotanne˺, he pyrkivät kaikkialla maassa levittämään pahaa ja tuhoamaan satoa ja karjaa. Jumala ei pidä pahasta."}},{"verse":206,"commentary_en":"This verse completes the portrait of the insincere, hostile person by describing their reaction when confronted with guidance or reminded to be mindful of Allah. Instead of accepting advice, their arrogance drives them deeper into sin and wrongdoing. As a consequence, their ultimate destination is Hell, described here as a terrible resting place, serving as a stern warning about the outcome of persistent arrogance and rejection of truth. This connects back to the previous verses by showing the defiant attitude that stems from their inner corruption and outward deception.","commentary_fi":"Tämä jae täydentää kuvaa epävilpittömästä, vihamielisestä henkilöstä kuvailemalla heidän reaktiotaan, kun heitä kohdataan ohjauksella tai muistutetaan olemaan tietoisia Allahista. Sen sijaan, että he hyväksyisivät neuvon, heidän ylimielisyytensä ajaa heidät syvemmälle syntiin ja väärintekoihin. Seurauksena on, että heidän lopullinen määränpäänsä on Helvetti, jota kuvataan tässä hirvittävänä leposijana, toimien ankarana varoituksena jatkuvan ylimielisyyden ja totuuden hylkäämisen seurauksista. Tämä linkittyy takaisin edellisiin jakeisiin osoittamalla uhmakkaan asenteen, joka kumpuaa heidän sisäisestä turmeluksestaan ja ulkoisesta petoksestaan.","arabic":"وَإِذَا قِيلَ لَهُ اتَّقِ اللَّهَ أَخَذَتْهُ الْعِزَّةُ بِالْإِثْمِ ۚ فَحَسْبُهُ جَهَنَّمُ ۚ وَلَبِئْسَ الْمِهَادُ","commentary":"Tämä jae täydentää kuvaa epävilpittömästä, vihamielisestä henkilöstä kuvailemalla heidän reaktiotaan, kun heitä kohdataan ohjauksella tai muistutetaan olemaan tietoisia Allahista. Sen sijaan, että he hyväksyisivät neuvon, heidän ylimielisyytensä ajaa heidät syvemmälle syntiin ja väärintekoihin. Seurauksena on, että heidän lopullinen määränpäänsä on Helvetti, jota kuvataan tässä hirvittävänä leposijana, toimien ankarana varoituksena jatkuvan ylimielisyyden ja totuuden hylkäämisen seurauksista. Tämä linkittyy takaisin edellisiin jakeisiin osoittamalla uhmakkaan asenteen, joka kumpuaa heidän sisäisestä turmeluksestaan ja ulkoisesta petoksestaan.","translations":{"opas":"Kun hänelle sanotaan: »Pelkää Jumalaa!» vetää ylpeys hänet syntiin. Helvetissä maksetaan hänelle hänen ansionsa mukaan. Mikä surkea olinpaikka!","clear":"Kun heille sanotaan: ”Pelätkää Jumalaa”, ylpeys vie heidät synnin tielle. Helvetistä tulee heidän oikea paikkansa. Mikä paha leposija!"}},{"verse":207,"commentary_en":"In stark contrast to the insincere or worldly-focused individuals mentioned in the preceding verses, this verse introduces a completely different kind of person—one who sells their very self in pursuit of Allah’s pleasure. This individual is entirely devoted, willing to make the ultimate sacrifice out of sincere love and submission to Allah. Their actions are not driven by personal gain, but by a deep desire to earn Allah’s approval. Allah describes Himself as compassionate and kind toward such servants, affirming His special care for those who live with sincerity and devotion. This verse powerfully illustrates the positive outcome of a life centered on faith, highlighting the noble character and reward of one who gives everything for the sake of Allah. It stands as a striking contrast to those who seek only worldly benefit, reminding believers of the honor and divine favor that come with true sincerity.","commentary_fi":"Jyrkässä vastakohdassa aiemmissa jakeissa kuvatuille teeskenteleville tai maailmallisesti suuntautuneille ihmisille tämä jae esittelee täysin toisenlaisen ihmistyypin – henkilön, joka \"myy itsensä\" tavoitellakseen Allahin mielisuosiota. Hän on täysin omistautunut, valmis jopa suurimpaan uhraukseen vilpittömästä rakkaudesta ja alistumisesta Allahiin. Hänen tekonsa eivät perustu henkilökohtaiseen hyötyyn, vaan syvään haluun ansaita Allahin hyväksyntä. Allah kuvaa itseään armolliseksi ja lempeäksi tällaisia palvelijoitaan kohtaan, mikä osoittaa Hänen erityistä huolenpitoaan niitä kohtaan, jotka elävät vilpittömyydessä ja uskollisuudessa. Tämä jae osoittaa voimallisesti, kuinka kaunis ja palkitseva elämä on, kun se perustuu aitoon uskoon ja täydelliseen antautumiseen. Se toimii vaikuttavana vastakohtana niille, jotka tavoittelevat vain maallisia hyötyjä, ja muistuttaa uskovia siitä kunniasta ja jumalallisesta suosista, joka seuraa todellista vilpittömyyttä.","arabic":"وَمِنَ النَّاسِ مَنْ يَشْرِي نَفْسَهُ ابْتِغَاءَ مَرْضَاتِ اللَّهِ ۗ وَاللَّهُ رَءُوفٌ بِالْعِبَادِ","commentary":"Jyrkässä vastakohdassa aiemmissa jakeissa kuvatuille teeskenteleville tai maailmallisesti suuntautuneille ihmisille tämä jae esittelee täysin toisenlaisen ihmistyypin – henkilön, joka \"myy itsensä\" tavoitellakseen Allahin mielisuosiota. Hän on täysin omistautunut, valmis jopa suurimpaan uhraukseen vilpittömästä rakkaudesta ja alistumisesta Allahiin. Hänen tekonsa eivät perustu henkilökohtaiseen hyötyyn, vaan syvään haluun ansaita Allahin hyväksyntä. Allah kuvaa itseään armolliseksi ja lempeäksi tällaisia palvelijoitaan kohtaan, mikä osoittaa Hänen erityistä huolenpitoaan niitä kohtaan, jotka elävät vilpittömyydessä ja uskollisuudessa. Tämä jae osoittaa voimallisesti, kuinka kaunis ja palkitseva elämä on, kun se perustuu aitoon uskoon ja täydelliseen antautumiseen. Se toimii vaikuttavana vastakohtana niille, jotka tavoittelevat vain maallisia hyötyjä, ja muistuttaa uskovia siitä kunniasta ja jumalallisesta suosista, joka seuraa todellista vilpittömyyttä.","translations":{"opas":"Ihmisten joukossa tapaat sellaisenkin, joka myy itsensä (orjaksi) tehdäkseen Jumalalle otollisen työn; ja Jumala on lempeä orjiaan kohtaan.","clear":"Ja on niitä, jotka omistavat elämänsä Jumalan mielihyvälle. Ja Jumala on ikuisesti armollinen ˹palvelijoilleen˺."}},{"verse":208,"commentary_en":"After presenting those who respond to the divine call with disbelief or hypocrisy—and contrasting them with those who receive it with sincere faith—this verse turns directly to the believers. It calls them to enter into full and wholehearted submission to Allah. Islam is not meant to be followed selectively; rather, it must be embraced completely—in every dimension of life: spiritual, moral, social, and personal. The verse then issues a serious warning: do not follow the footsteps of Satan, for he is a clear and declared enemy. This highlights the sharp contrast between two paths: Allah’s path of guidance and Satan’s path of deception. Believers are urged to remain firm and unwavering in their commitment to Allah’s way, resisting all forms of distraction, compromise, and temptation that lead away from truth.","commentary_fi":"Sen jälkeen kun aiemmat jakeet ovat kuvanneet niitä, jotka suhtautuvat jumalalliseen kutsuun epäuskolla tai tekopyhyydellä – ja asettaneet heidät vastakkain niiden kanssa, jotka ottavat sen vastaan vilpittömällä uskolla – tämä jae kääntyy suoraan uskovien puoleen. Siinä kehotetaan astumaan täyteen ja kokonaisvaltaiseen alistumiseen Allahin tahtoon. Islamia ei ole tarkoitettu noudatettavaksi valikoivasti; sen sijaan se on omaksuttava täydellisesti – hengellisesti, moraalisesti, sosiaalisesti ja henkilökohtaisesti. Jae antaa vakavan varoituksen: älkää seuratko Saatanan jalanjälkiä, sillä hän on teille selkeä ja julkinen vihollinen. Tämä tuo esiin jyrkän vastakkainasettelun kahden tien välillä: Allahin johdatuksen tie ja Saatanan harhaanjohtava tie. Uskovia kehotetaan pysymään lujina ja horjumattomina sitoutumisessaan Allahin tielle ja torjumaan kaikki häiriötekijät, kompromissit ja kiusaukset, jotka vievät pois totuudesta.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا ادْخُلُوا فِي السِّلْمِ كَافَّةً وَلَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ","commentary":"Sen jälkeen kun aiemmat jakeet ovat kuvanneet niitä, jotka suhtautuvat jumalalliseen kutsuun epäuskolla tai tekopyhyydellä – ja asettaneet heidät vastakkain niiden kanssa, jotka ottavat sen vastaan vilpittömällä uskolla – tämä jae kääntyy suoraan uskovien puoleen. Siinä kehotetaan astumaan täyteen ja kokonaisvaltaiseen alistumiseen Allahin tahtoon. Islamia ei ole tarkoitettu noudatettavaksi valikoivasti; sen sijaan se on omaksuttava täydellisesti – hengellisesti, moraalisesti, sosiaalisesti ja henkilökohtaisesti. Jae antaa vakavan varoituksen: älkää seuratko Saatanan jalanjälkiä, sillä hän on teille selkeä ja julkinen vihollinen. Tämä tuo esiin jyrkän vastakkainasettelun kahden tien välillä: Allahin johdatuksen tie ja Saatanan harhaanjohtava tie. Uskovia kehotetaan pysymään lujina ja horjumattomina sitoutumisessaan Allahin tielle ja torjumaan kaikki häiriötekijät, kompromissit ja kiusaukset, jotka vievät pois totuudesta.","translations":{"opas":"Te, jotka uskotte, tulkaa kaikki kuuliaisiksi Hänelle älkääkä seuratko saatanan jälkiä. Hän on totisesti teidän ilmeinen vihollisenne.","clear":"Oi uskovat! Astukaa islamiin koko sydämestänne älkääkä seuratko Saatanan askeleita. Totisesti, hän on vannoutunut vihollisenne."}},{"verse":209,"commentary_en":"This verse follows the command for complete submission by warning of the consequences of turning away after receiving clear guidance. It reminds believers that once the truth has been made evident through signs and revelation, knowingly deviating from it is a serious matter. The verse affirms that Allah is Mighty and Wise, indicating that His justice is unchallengeable and His decrees are always based on perfect knowledge and wisdom.","commentary_fi":"Tämä jae seuraa kehotusta täydelliseen alistumiseen varoittamalla seurauksista, jotka kohtaavat niitä, jotka kääntyvät pois tai horjahtavat sen jälkeen, kun totuus on käynyt heille selväksi. Se muistuttaa uskovia siitä, että kun merkkejä ja ilmoitusta on annettu, niistä tietoisesti poikkeaminen on vakava asia. Jae korostaa, että Allah on Mahtava ja Viisas, mikä osoittaa, että Hänen oikeudenmukaisuuttaan ei voida kyseenalaistaa ja että Hänen päätöksensä perustuvat täydelliseen tietoon ja viisauteen.","arabic":"فَإِنْ زَلَلْتُمْ مِنْ بَعْدِ مَا جَاءَتْكُمُ الْبَيِّنَاتُ فَاعْلَمُوا أَنَّ اللَّهَ عَزِيزٌ حَكِيمٌ","commentary":"Tämä jae seuraa kehotusta täydelliseen alistumiseen varoittamalla seurauksista, jotka kohtaavat niitä, jotka kääntyvät pois tai horjahtavat sen jälkeen, kun totuus on käynyt heille selväksi. Se muistuttaa uskovia siitä, että kun merkkejä ja ilmoitusta on annettu, niistä tietoisesti poikkeaminen on vakava asia. Jae korostaa, että Allah on Mahtava ja Viisas, mikä osoittaa, että Hänen oikeudenmukaisuuttaan ei voida kyseenalaistaa ja että Hänen päätöksensä perustuvat täydelliseen tietoon ja viisauteen.","translations":{"opas":"Ja jos te rupeatte luopumaan uskosta, senjälkeen kuin olette saaneet selvät todistukset, niin tietäkää, että Jumala on mahtava ja viisas.","clear":"Jos horjutte selkeiden todisteiden saamisen jälkeen, niin tietäkää, että Jumala on todellakin Kaikkivoipa, Kaikkiviisas."}},{"verse":210,"commentary_en":"This verse challenges the hesitation of those who refuse to submit fully, asking rhetorically: are they waiting until Allah Himself comes to them with the angels before they finally believe? It points to the absurdity of waiting for a dramatic, undeniable manifestation of truth—because when that happens, the time for choice will have ended. That moment would be the Day of Judgment, when all veils are lifted, reality is laid bare, and no further repentance or belief will be accepted. The testing period of this worldly life will be over. Everything will be decisively settled, and all matters will return to Allah for final judgment.","commentary_fi":"Tämä jae kyseenalaistaa niiden epäröinnin, jotka eivät halua täysin alistua Allahille, ja kysyy retorisesti: odottavatko he, että Allah ilmestyy heille enkeleiden kanssa ennen kuin uskovat? Siinä korostetaan, kuinka järjetöntä on odottaa selvää ja väistämätöntä totuuden ilmenemistä – sillä silloin valinnan aika on jo ohi. Tuo hetki on tuomiopäivä, jolloin kaikki verhot poistetaan, todellisuus paljastuu täysin, eikä katumusta tai uskomista enää hyväksytä. Maallinen koetusaika päättyy silloin lopullisesti. Kaikki asiat ratkaistaan lopullisesti, ja kaikki palautetaan Allahin luo Hänen tuomittavakseen.","arabic":"هَلْ يَنْظُرُونَ إِلَّا أَنْ يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِنَ الْغَمَامِ وَالْمَلَائِكَةُ وَقُضِيَ الْأَمْرُ ۚ وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ","commentary":"Tämä jae kyseenalaistaa niiden epäröinnin, jotka eivät halua täysin alistua Allahille, ja kysyy retorisesti: odottavatko he, että Allah ilmestyy heille enkeleiden kanssa ennen kuin uskovat? Siinä korostetaan, kuinka järjetöntä on odottaa selvää ja väistämätöntä totuuden ilmenemistä – sillä silloin valinnan aika on jo ohi. Tuo hetki on tuomiopäivä, jolloin kaikki verhot poistetaan, todellisuus paljastuu täysin, eikä katumusta tai uskomista enää hyväksytä. Maallinen koetusaika päättyy silloin lopullisesti. Kaikki asiat ratkaistaan lopullisesti, ja kaikki palautetaan Allahin luo Hänen tuomittavakseen.","translations":{"opas":"Eivätkö he (epäuskoiset) juuri sitä odota, että Jumala tulisi heidän luokseen pilvien varjossa enkeleineen? Silloinhan asia jo olisi ratkaistu. Ei, kaikki asiat palaavat Jumalan tuomittaviksi.","clear":"Odotavatko he Jumalan ˹Itseään˺ saapuvan heidän luokseen pilvien varjossa yhdessä enkelien kanssa? ˹Jos Hän niin tekisi˺, niin asia ratkaistaisiin ˹heti˺. Ja Jumalalle ˹kaikki˺ asiat palautetaan ˹tuomittavaksi˺."}},{"verse":211,"commentary_en":"This verse draws attention to the historical example of the Children of Israel, who were recipients of divine revelation and numerous clear signs from Allah. Despite being favored with guidance, many among them either altered, ignored, or turned away from these blessings. The verse can be interpreted as a cautionary reminder for the current believing community, not to repeat the errors of those who came before them. Receiving Allah’s guidance is a great responsibility, and turning away from it after recognizing the truth is a serious offense. It ends with a sobering reminder that Allah is severe in punishment—especially for those who knowingly reject or distort His favor after it has been granted. This underlines the importance of preserving divine guidance with sincerity and integrity.","commentary_fi":"Tämä jae kiinnittää huomiota Israelin lasten historialliseen esimerkkiin, jotka saivat osakseen jumalallisen ilmoituksen ja monia selkeitä merkkejä Allahilta. Siitä huolimatta monet heistä muuttivat, sivuuttivat tai hylkäsivät nämä siunaukset ja johdatuksen. Tätä jaetta voidaan tulkita varoittavaksi muistutukseksi nykyiselle uskovalle yhteisölle, ettei se toistaisi niiden virheitä, jotka elivät ennen heitä. Allahin johdatuksen vastaanottaminen on suuri vastuu, ja siitä kääntyminen pois totuuden tunnistamisen jälkeen on vakava rikkomus. Jae päättyy vakavaan muistutukseen: Allah on ankara rangaistuksessaan – erityisesti niitä kohtaan, jotka tietoisesti hylkäävät tai vääristelevät Hänen antamaansa armoa. Tämä korostaa vilpittömän ja eheän uskollisuuden tärkeyttä jumalalliselle johdatukselle.","arabic":"سَلْ بَنِي إِسْرَائِيلَ كَمْ آتَيْنَاهُمْ مِنْ آيَةٍ بَيِّنَةٍ ۗ وَمَنْ يُبَدِّلْ نِعْمَةَ اللَّهِ مِنْ بَعْدِ مَا جَاءَتْهُ فَإِنَّ اللَّهَ شَدِيدُ الْعِقَابِ","commentary":"Tämä jae kiinnittää huomiota Israelin lasten historialliseen esimerkkiin, jotka saivat osakseen jumalallisen ilmoituksen ja monia selkeitä merkkejä Allahilta. Siitä huolimatta monet heistä muuttivat, sivuuttivat tai hylkäsivät nämä siunaukset ja johdatuksen. Tätä jaetta voidaan tulkita varoittavaksi muistutukseksi nykyiselle uskovalle yhteisölle, ettei se toistaisi niiden virheitä, jotka elivät ennen heitä. Allahin johdatuksen vastaanottaminen on suuri vastuu, ja siitä kääntyminen pois totuuden tunnistamisen jälkeen on vakava rikkomus. Jae päättyy vakavaan muistutukseen: Allah on ankara rangaistuksessaan – erityisesti niitä kohtaan, jotka tietoisesti hylkäävät tai vääristelevät Hänen antamaansa armoa. Tämä korostaa vilpittömän ja eheän uskollisuuden tärkeyttä jumalalliselle johdatukselle.","translations":{"opas":"Kysy Israelin lapsilta, kuinka monta selvää tunnusmerkkiä olemme antanut heille. Mutta jos joku vaihtaa pois Jumalan armon, senjälkeen kuin se on tullut hänen osakseen, on Jumala totisesti ankara rankaisemaan.","clear":"Kysy Israelin lapsilta, kuinka monta selvää merkkiä olemme heille antaneet. Ja jokainen, joka vaihtaa Allahin suosion – sen saatuaan – ˹epäuskoon˺, tietäköön, että Allah on totisesti ankara rangaistuksessaan."}},{"verse":212,"commentary_en":"This verse draws a striking contrast between those who reject faith and those who believe. It highlights how the comforts and pleasures of worldly life appear attractive to disbelievers, blinding them to deeper truths and leading them to ridicule those who live with faith and purpose. Their focus is limited to the material and temporary, while believers are anchored in values that transcend this life. The verse reassures believers that on the Day of Resurrection, the situation will be reversed: those who were mindful of Allah and lived righteously will be in a far higher position. It reminds believers that their worth is not determined by worldly status but by their relationship with Allah. Ultimately, the verse affirms that Allah provides abundantly to whom He wills, in this life and the next, in ways beyond human comprehension—underscoring that true success lies in divine favor, not worldly gain.","commentary_fi":"Tämä jae tuo esiin selkeän vastakkainasettelun uskonsa hylkäävien ja uskovien välillä. Se kuvaa, kuinka tämän maailman nautinto ja loisto näyttäytyvät epäuskoisille houkuttelevina, mikä sokaisee heidät syvemmiltä totuuksilta ja saa heidät halveksimaan niitä, jotka elävät uskossa ja tarkoituksessa. He näkevät vain aineellisen ja hetkellisen, kun taas uskovien katse on suunnattu pysyvämpiin arvoihin ja tuonpuoleiseen elämään. Jae lohduttaa uskovia muistuttamalla, että ylösnousemuksen päivänä tilanne kääntyy: ne, jotka elivät Allahia tietoisesti muistaen ja vanhurskaasti, tulevat olemaan korkeammassa asemassa. Se painottaa, että uskovan arvo ei määräydy maallisen aseman mukaan, vaan hänen suhteestaan Allahiin. Lopulta jae vahvistaa, että Allah antaa runsaasti niille, joille Hän tahtoo – sekä tässä elämässä että seuraavassa – tavoilla, joita ihminen ei voi käsittää. Todellinen menestys on siis Allahin suosion saavuttamisessa, ei maallisessa voitossa.","arabic":"زُيِّنَ لِلَّذِينَ كَفَرُوا الْحَيَاةُ الدُّنْيَا وَيَسْخَرُونَ مِنَ الَّذِينَ آمَنُوا ۘ وَالَّذِينَ اتَّقَوْا فَوْقَهُمْ يَوْمَ الْقِيَامَةِ ۗ وَاللَّهُ يَرْزُقُ مَنْ يَشَاءُ بِغَيْرِ حِسَابٍ","commentary":"Tämä jae tuo esiin selkeän vastakkainasettelun uskonsa hylkäävien ja uskovien välillä. Se kuvaa, kuinka tämän maailman nautinto ja loisto näyttäytyvät epäuskoisille houkuttelevina, mikä sokaisee heidät syvemmiltä totuuksilta ja saa heidät halveksimaan niitä, jotka elävät uskossa ja tarkoituksessa. He näkevät vain aineellisen ja hetkellisen, kun taas uskovien katse on suunnattu pysyvämpiin arvoihin ja tuonpuoleiseen elämään. Jae lohduttaa uskovia muistuttamalla, että ylösnousemuksen päivänä tilanne kääntyy: ne, jotka elivät Allahia tietoisesti muistaen ja vanhurskaasti, tulevat olemaan korkeammassa asemassa. Se painottaa, että uskovan arvo ei määräydy maallisen aseman mukaan, vaan hänen suhteestaan Allahiin. Lopulta jae vahvistaa, että Allah antaa runsaasti niille, joille Hän tahtoo – sekä tässä elämässä että seuraavassa – tavoilla, joita ihminen ei voi käsittää. Todellinen menestys on siis Allahin suosion saavuttamisessa, ei maallisessa voitossa.","translations":{"opas":"Maallista elämää ihailevat ne, jotka ovat uskottomia ja pilkkaavat uskovaisia. Mutta ne, jotka täyttävät velvollisuutensa Jumalaa kohtaan, joutuvat Ylösnousemisen päivänä heidän yläpuolelleen. Jumala antaa runsaasti kenelle tahtoo.","clear":"Tämän maailman elämä on tehty houkuttelevaksi epäuskoisille, ja he pilkkaavat uskovia. Ne, jotka ovat tietoisia ˹Allahista˺, ovat heidän yläpuolellaan tuomiopäivänä. Ja Allah antaa ylläpitoa kenelle haluaa ilman rajaa."}},{"verse":213,"commentary_en":"This verse describes the origin of human society and its relationship with divine guidance. It begins by stating that humanity was once a single, united community. Allah revealed the truth from the very beginning to the first human, guiding them toward the right way of life. For a time, humanity remained on this path in harmony. However, as people spread and societies developed, disagreements and divisions emerged—not because the truth was hidden, but due to pride, ambition, and the desire for unjust gain. In response, Allah sent messengers to bring glad tidings and warnings. With them came divine revelation—the Book—as the ultimate reference to judge between people in their disputes. Despite this clear guidance, those who received the Book (such as the People of the Book) continued to differ, often driven by envy, selfishness, or the pursuit of power. Yet, through His grace, Allah guided the believers to the truth regarding the matters that were disputed. The verse ends by affirming that Allah guides whom He wills to the straight path, underscoring both human responsibility and divine mercy.","commentary_fi":"Tämä jae kuvaa ihmiskunnan alkuperää ja sen suhdetta jumalalliseen johdatukseen. Alussa ihmiset muodostivat yhden yhtenäisen yhteisön. Allah paljasti totuuden heti ensimmäiselle ihmiselle ja ohjasi hänet oikealle tielle. Jonkin aikaa ihmiskunta pysyi tällä tiellä ja eli sopusoinnussa. Ajan myötä, kun ihmiset lisääntyivät ja yhteiskunnat kehittyivät, syntyi erimielisyyksiä ja jakautumista. Tämä ei johtunut siitä, ettei totuutta olisi ilmoitettu, vaan ihmisten omasta ylpeydestä, vallanhimosta ja epäoikeudenmukaisesta etujen tavoittelusta. Allah lähetti viestintuojia – profeettoja – ilosanomineen ja varoituksineen, ja heidän mukanaan Kirjan, jumalallisen ilmoituksen, totuuden mittariksi ja ratkaisijaksi ihmisten kiistoihin. Vaikka he saivat selkeän johdatuksen, ne, joille Kirja annettiin (esimerkiksi Kirjan kansat), jatkoivat erimielisyyksiään – usein kateuden, itsekkyyden tai vallanhalun ajamina. Silti Allah, armossaan, johdatti uskovat totuuteen niissä asioissa, joista toiset kiistelivät. Jae päättyy toteamukseen, että Allah johdattaa kenet tahtoo oikealle tielle, korostaen sekä ihmisen vastuuta että jumalallista armoa.","arabic":"كَانَ النَّاسُ أُمَّةً وَاحِدَةً فَبَعَثَ اللَّهُ النَّبِيِّينَ مُبَشِّرِينَ وَمُنْذِرِينَ وَأَنْزَلَ مَعَهُمُ الْكِتَابَ بِالْحَقِّ لِيَحْكُمَ بَيْنَ النَّاسِ فِيمَا اخْتَلَفُوا فِيهِ ۚ وَمَا اخْتَلَفَ فِيهِ إِلَّا الَّذِينَ أُوتُوهُ مِنْ بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَاتُ بَغْيًا بَيْنَهُمْ ۖ فَهَدَى اللَّهُ الَّذِينَ آمَنُوا لِمَا اخْتَلَفُوا فِيهِ مِنَ الْحَقِّ بِإِذْنِهِ ۗ وَاللَّهُ يَهْدِي مَنْ يَشَاءُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ","commentary":"Tämä jae kuvaa ihmiskunnan alkuperää ja sen suhdetta jumalalliseen johdatukseen. Alussa ihmiset muodostivat yhden yhtenäisen yhteisön. Allah paljasti totuuden heti ensimmäiselle ihmiselle ja ohjasi hänet oikealle tielle. Jonkin aikaa ihmiskunta pysyi tällä tiellä ja eli sopusoinnussa. Ajan myötä, kun ihmiset lisääntyivät ja yhteiskunnat kehittyivät, syntyi erimielisyyksiä ja jakautumista. Tämä ei johtunut siitä, ettei totuutta olisi ilmoitettu, vaan ihmisten omasta ylpeydestä, vallanhimosta ja epäoikeudenmukaisesta etujen tavoittelusta. Allah lähetti viestintuojia – profeettoja – ilosanomineen ja varoituksineen, ja heidän mukanaan Kirjan, jumalallisen ilmoituksen, totuuden mittariksi ja ratkaisijaksi ihmisten kiistoihin. Vaikka he saivat selkeän johdatuksen, ne, joille Kirja annettiin (esimerkiksi Kirjan kansat), jatkoivat erimielisyyksiään – usein kateuden, itsekkyyden tai vallanhalun ajamina. Silti Allah, armossaan, johdatti uskovat totuuteen niissä asioissa, joista toiset kiistelivät. Jae päättyy toteamukseen, että Allah johdattaa kenet tahtoo oikealle tielle, korostaen sekä ihmisen vastuuta että jumalallista armoa.","translations":{"opas":"Ihmisten muodostaessa yhden ainoan uskonnollisen yhdyskunnan Jumala lähetti profeettoja ilosanoman tuojiksi ja varoittajiksi ja ilmoitti heidän kauttaan Pyhän kirjan, jonka totuus kykeni ratkaisemaan kaiken, mistä ihmiset kiistelivät. Ja juuri ne, joille Kirja annettiin, riitelivät siitä keskinäisen vihansa vuoksi, vaikka olivat saaneet selvät todistukset. Mutta uskovaisia Jumalan tahto johti siihen totuuteen, josta nuo keskenänsä kiistelivät; sillä Jumala ohjaa kenet tahtoo oikealle tielle.","clear":"Ihmiskunta oli kerran yksi yhteisö ˹uskovia, ennen kuin he menettivät uskonsa˺. Sitten Allah nosti profeettoja hyvien uutisten tuojiksi ja varoittajiksi ja ilmoitti heille Pyhät kirjoitukset totuudessa tuomitsemaan ihmisten välisiä riitoja. Eikä kukaan kiistänyt Pyhiä kirjoituksia paitsi ne ihmiset, jotka olivat saaneet ne sen jälkeen, kun heille oli tullut selviä todisteita – kateudesta. Sitten Allah, armonsa avulla, on ohjannut uskovat totuuteen näiden riitojen suhteen. Ja Allah ohjaa kenet haluaa Suoralle Tielle."}},{"verse":214,"commentary_en":"This verse directly addresses believers, posing a profound question: Do you expect to enter Paradise without facing the kinds of trials and hardships endured by those who believed before you? It describes these past challenges as suffering and adversity so intense that they severely tested the spirit, leading even the Prophet at that time, and the believers with him, to question when Allah's help would arrive. The verse then immediately offers reassurance, declaring that the help of Allah is indeed always near. This highlights that enduring difficult trials and remaining steadfast is a necessary experience to purify and strengthen believers, preparing them for Allah's support and ultimately for the reward of Paradise. It serves as a timeless reminder that the path of faith often involves struggle, and perseverance through these difficulties is key to earning Allah's promise of assistance and ultimate success.","commentary_fi":"Tämä jae puhuttelee suoraan uskovaisia, esittäen syvällisen kysymyksen: Odotatteko pääsevänne Paratiisiin kohtaamatta sellaisia koetuksia ja vaikeuksia, joita edelliset uskovaiset kokivat? Se kuvaa näitä menneitä haasteita niin voimakkaana kärsimyksenä ja vastoinkäymisenä, että ne koettelivat ankarasti henkeä, johtaen jopa sen ajan Profeetan ja hänen kanssaan olleiden uskovien kysymään, milloin Allahin apu saapuisi. Jae tarjoaa sitten heti lohdutusta julistaen, että Allahin apu on todellakin aina lähellä. Tämä korostaa, että vaikeiden koetusten kestämisen ja lujana pysymisen on välttämätön kokemus uskovaisten puhdistamiseksi ja vahvistamiseksi, valmistaen heitä Allahin tukeen ja lopulta Paratiisin palkkioon. Se toimii ajattomana muistutuksena siitä, että uskon polkuun liittyy usein kamppailua, ja lujuus näiden vaikeuksien läpi on avain Allahin lupauksen avusta ja lopullisesta menestyksestä saavuttamiseen.","arabic":"أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَأْتِكُمْ مَثَلُ الَّذِينَ خَلَوْا مِنْ قَبْلِكُمْ ۖ مَسَّتْهُمُ الْبَأْسَاءُ وَالضَّرَّاءُ وَزُلْزِلُوا حَتَّىٰ يَقُولَ الرَّسُولُ وَالَّذِينَ آمَنُوا مَعَهُ مَتَىٰ نَصْرُ اللَّهِ ۗ أَلَا إِنَّ نَصْرَ اللَّهِ قَرِيبٌ","commentary":"Tämä jae puhuttelee suoraan uskovaisia, esittäen syvällisen kysymyksen: Odotatteko pääsevänne Paratiisiin kohtaamatta sellaisia koetuksia ja vaikeuksia, joita edelliset uskovaiset kokivat? Se kuvaa näitä menneitä haasteita niin voimakkaana kärsimyksenä ja vastoinkäymisenä, että ne koettelivat ankarasti henkeä, johtaen jopa sen ajan Profeetan ja hänen kanssaan olleiden uskovien kysymään, milloin Allahin apu saapuisi. Jae tarjoaa sitten heti lohdutusta julistaen, että Allahin apu on todellakin aina lähellä. Tämä korostaa, että vaikeiden koetusten kestämisen ja lujana pysymisen on välttämätön kokemus uskovaisten puhdistamiseksi ja vahvistamiseksi, valmistaen heitä Allahin tukeen ja lopulta Paratiisin palkkioon. Se toimii ajattomana muistutuksena siitä, että uskon polkuun liittyy usein kamppailua, ja lujuus näiden vaikeuksien läpi on avain Allahin lupauksen avusta ja lopullisesta menestyksestä saavuttamiseen.","translations":{"opas":"Vai luuletteko, että saatte astua Paratiisiin, vaikka teille ei ole vielä tapahtunut mitään sellaista kuin niille, jotka ovat nukkuneet pois ennen teitä? Hätä ja vastoinkäymiset kohtasivat heitä; oli kuin maanjäristys olisi viskellyt heitä, niin että Jumalan lähettiläs ja uskovaiset hänen ympärillään huusivat: »Milloin tulee Jumalan apu?» Katso, Jumalan avun täytyy jo olla lähellä.","clear":"Luuletteko, että pääsette Paratiisiin ilman, että teitä koetellaan kuten niitä, jotka olivat ennen teitä? Heitä koettelivat kärsimykset ja vastoinkäymiset, ja heitä ravisteltiin niin ˹väkivaltaisesti˺, että ˹jopa˺ Lähettiläs ja hänen kanssaan olevat uskovat huusivat: ”Milloin Allahin apu tulee?” Totisesti, Allahin apu on ˹aina˺ lähellä."}},{"verse":215,"commentary_en":"This verse responds to a question from early Muslims about what they should spend in charity. It teaches that whatever good is given from one’s wealth should begin with those closest: parents and near relatives, followed by orphans, the needy, and the stranded traveler. This order emphasizes both personal responsibility and broader social concern. The verse encourages generosity that begins at home but extends outward, fostering compassion within families and strengthening society at large. It concludes by reminding us that Allah is fully aware of all the good deeds we do, including what we give in charity and the intentions behind those acts. This implies that our charitable actions—and the motives behind them—are known and will be rewarded. This verse sets the stage for further guidance by addressing specific questions raised by the believers, in the following verses.","commentary_fi":"Tämä jae vastaa varhaisten muslimien esittämään kysymykseen siitä, mitä heidän tulisi antaa hyväntekeväisyyteen. Siinä opetetaan, että kaikki hyvä, mitä omaisuudesta annetaan, tulisi aloittaa lähimmistä: vanhemmista ja lähisukulaisista, ja sen jälkeen orvoista, tarvitsevista ja matkalle joutuneista. Tämä järjestys korostaa sekä henkilökohtaista vastuuta että laajempaa yhteiskunnallista huolenpitoa. Jaetta kehottaa anteliaisuuteen, joka alkaa kodista mutta ulottuu ympäröivään yhteisöön, edistäen myötätuntoa perheissä ja vahvistaen yhteiskuntaa. Jaen lopussa muistutetaan, että Allah tietää kaikki hyvät tekomme, mukaan lukien se, mitä annamme hyväntekeväisyyteen ja millaisin aikomuksin. Tämä tarkoittaa, että hyväntekeväisyytemme ja sen taustalla olevat motiivit ovat Allahin tiedossa ja tulevat palkituiksi. Tämä jae valmistaa tietä lisäohjeille, joita seuraavat jakeet tuovat esiin.","arabic":"يَسْأَلُونَكَ مَاذَا يُنْفِقُونَ ۖ قُلْ مَا أَنْفَقْتُمْ مِنْ خَيْرٍ فَلِلْوَالِدَيْنِ وَالْأَقْرَبِينَ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَابْنِ السَّبِيلِ ۗ وَمَا تَفْعَلُوا مِنْ خَيْرٍ فَإِنَّ اللَّهَ بِهِ عَلِيمٌ","commentary":"Tämä jae vastaa varhaisten muslimien esittämään kysymykseen siitä, mitä heidän tulisi antaa hyväntekeväisyyteen. Siinä opetetaan, että kaikki hyvä, mitä omaisuudesta annetaan, tulisi aloittaa lähimmistä: vanhemmista ja lähisukulaisista, ja sen jälkeen orvoista, tarvitsevista ja matkalle joutuneista. Tämä järjestys korostaa sekä henkilökohtaista vastuuta että laajempaa yhteiskunnallista huolenpitoa. Jaetta kehottaa anteliaisuuteen, joka alkaa kodista mutta ulottuu ympäröivään yhteisöön, edistäen myötätuntoa perheissä ja vahvistaen yhteiskuntaa. Jaen lopussa muistutetaan, että Allah tietää kaikki hyvät tekomme, mukaan lukien se, mitä annamme hyväntekeväisyyteen ja millaisin aikomuksin. Tämä tarkoittaa, että hyväntekeväisyytemme ja sen taustalla olevat motiivit ovat Allahin tiedossa ja tulevat palkituiksi. Tämä jae valmistaa tietä lisäohjeille, joita seuraavat jakeet tuovat esiin.","translations":{"opas":"He kysyvät sinulta, Muhammed, kenelle ja mitä heidän on pois annettava. Sano: »Se, minkä pois lahjoitatte, antakaa vanhemmillenne, läheisille omaisillenne, orvoille, köyhille ja vaeltajille, ja mitä hyvää teette, Jumala tietää sen totisesti.»","clear":"He kysyvät sinulta ˹Oi Profeetta˺, millä ˹tavalla˺ heidän pitäisi lahjoittaa. Sano: ”Kaikki lahjoitukset, jotka annatte, ovat vanhemmille, sukulaisille, orvoille, köyhille ja ˹tarvitseville˺ matkustajille. Kaikki hyvä, mitä teette, on varmasti hyvin Allahin tiedossa.”"}},{"verse":216,"commentary_en":"Following the discussion on charity, this verse states a profound principle: something disliked may, in reality, be beneficial, while something beloved may prove harmful. In the specific context of fighting for a just cause, the verse acknowledges its difficulty but emphasizes its necessity for protecting the community and upholding justice. The message extends beyond the realm of warfare, applying broadly to life's many situations. Human perception is limited, while Allah's knowledge encompasses all outcomes. What appears unfavorable may hold hidden good, and what seems desirable may conceal harm. The verse, therefore, calls for trust in Allah’s wisdom, even when His guidance challenges personal inclinations or comfort.","commentary_fi":"Hyväntekeväisyyden käsittelyn jälkeen tämä jae tuo esiin syvällisen periaatteen: jokin, mikä vaikuttaa epämiellyttävältä, voikin todellisuudessa olla hyödyllistä, kun taas rakastettu asia saattaa osoittautua vahingolliseksi. Oikeudenmukaisen asian puolesta taisteleminen esitetään vaikeana, mutta tarpeellisena keinona yhteisön suojelemiseksi ja oikeuden ylläpitämiseksi. Viesti ei rajoitu pelkästään sodankäyntiin, vaan ulottuu elämän monille alueille. Ihmisen havainnointi on rajallista, kun taas Allahin tieto kattaa kaiken. Se, mikä näyttää pahalta, voi kätkeä sisäänsä hyvää, ja se, mikä tuntuu toivottavalta, voi kätkeä haittaa. Jaen mukaan tulisi siis luottaa Allahin viisauteen, vaikka Hänen ohjauksensa tuntuisikin vastoin omia toiveita tai mukavuutta.","arabic":"كُتِبَ عَلَيْكُمُ الْقِتَالُ وَهُوَ كُرْهٌ لَكُمْ ۖ وَعَسَىٰ أَنْ تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَكُمْ ۖ وَعَسَىٰ أَنْ تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ","commentary":"Hyväntekeväisyyden käsittelyn jälkeen tämä jae tuo esiin syvällisen periaatteen: jokin, mikä vaikuttaa epämiellyttävältä, voikin todellisuudessa olla hyödyllistä, kun taas rakastettu asia saattaa osoittautua vahingolliseksi. Oikeudenmukaisen asian puolesta taisteleminen esitetään vaikeana, mutta tarpeellisena keinona yhteisön suojelemiseksi ja oikeuden ylläpitämiseksi. Viesti ei rajoitu pelkästään sodankäyntiin, vaan ulottuu elämän monille alueille. Ihmisen havainnointi on rajallista, kun taas Allahin tieto kattaa kaiken. Se, mikä näyttää pahalta, voi kätkeä sisäänsä hyvää, ja se, mikä tuntuu toivottavalta, voi kätkeä haittaa. Jaen mukaan tulisi siis luottaa Allahin viisauteen, vaikka Hänen ohjauksensa tuntuisikin vastoin omia toiveita tai mukavuutta.","translations":{"opas":"Teidät on määrätty sotimaan, vaikka se on teille vastenmielistä. Mutta voi sattua, että teillä on vastenmielisyys jotakin asiaa kohtaan, vaikka se on teille hyödyllinen, ja voipa sattua, että teillä on halu johonkin, vaikka se on vahingollista teille. Jumala tietää, mutta te ette tiedä.","clear":"Taisteleminen on tehty teille pakolliseksi ˹uskovat˺, vaikka ette siitä pidäkään. Ehkäpä te inhoatte jotain, mikä on teille hyväksi, ja pidätte jostain, mikä on teille pahaksi. Jumala tietää, mutta te ette tiedä."}},{"verse":217,"commentary_en":"This verse directly answers a question about fighting during the sacred months, a period traditionally held as inviolable. It states clearly that fighting during this time is a serious matter. However, it immediately highlights that other actions are even more serious in the sight of Allah: preventing people from following Allah's path, rejecting faith in Him, obstructing access to the Sacred Mosque (in Mecca), and driving people out of their homes. The verse points out that oppression and persecution are worse than physical fighting or killing. It reveals the ultimate goal of those who oppose the Muslims: to make them abandon their faith. This clarifies that the aggression was initiated by the opponents, not the Muslims, and that the gravity of their actions – religious persecution and obstruction – far outweighs the specific incident of fighting in a sacred month. The verse then sternly warns that anyone who abandons their faith and dies as a disbeliever will lose everything in this life and the hereafter, facing severe consequences. This emphasizes the importance of holding firm to one's faith despite pressure. The subsequent verse offers hope to those who remain steadfast and strive for Allah's cause.","commentary_fi":"Tämä jae vastaa suoraan kysymykseen taistelemisesta pyhien kuukausien aikana, jota ajanjaksoa perinteisesti pidettiin loukkaamattomana. Se toteaa selvästi, että taisteleminen tänä aikana on vakava asia. Kuitenkin se korostaa välittömästi, että toiset teot ovat vieläkin vakavampia Allahin silmissä: ihmisten estäminen seuraamasta Allahin tietä, Hänen kieltämisensä, pääsyn estäminen Pyhään Moskeijaan (Mekassa) ja ihmisten karkottaminen kodeistaan. Jae huomauttaa, että sorto ja vaino ovat pahempia kuin fyysinen taistelu tai tappaminen. Se paljastaa niiden lopullisen tavoitteen, jotka vastustavat muslimeja: saada heidät luopumaan uskostaan. Tämä selventää, että aggressio oli vastustajien, ei muslimien, aloittama, ja että heidän tekojensa (uskonnollisen vainon ja estämisen) vakavuus ylittää selvästi tietyn taistelun pyhässä kuukaudessa. Jae varoittaa sitten ankarasti, että jokainen, joka luopuu uskostaan ja kuolee uskottomana, menettää kaiken tässä elämässä ja tuonpuoleisessa, kohdaten ankarat seuraukset. Tämä korostaa uskoon lujasti pitäytymisen tärkeyttä painostuksesta huolimatta. Seuraava jae tarjoaa toivoa niille, jotka pysyvät lujina ja pyrkivät Allahin asian puolesta.","arabic":"يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيهِ ۖ قُلْ قِتَالٌ فِيهِ كَبِيرٌ ۖ وَصَدٌّ عَنْ سَبِيلِ اللَّهِ وَكُفْرٌ بِهِ وَالْمَسْجِدِ الْحَرَامِ وَإِخْرَاجُ أَهْلِهِ مِنْهُ أَكْبَرُ عِنْدَ اللَّهِ ۚ وَالْفِتْنَةُ أَكْبَرُ مِنَ الْقَتْلِ ۗ وَلَا يَزَالُونَ يُقَاتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَنْ دِينِكُمْ إِنِ اسْتَطَاعُوا ۚ وَمَنْ يَرْتَدِدْ مِنْكُمْ عَنْ دِينِهِ فَيَمُتْ وَهُوَ كَافِرٌ فَأُولَٰئِكَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ ۖ وَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ","commentary":"Tämä jae vastaa suoraan kysymykseen taistelemisesta pyhien kuukausien aikana, jota ajanjaksoa perinteisesti pidettiin loukkaamattomana. Se toteaa selvästi, että taisteleminen tänä aikana on vakava asia. Kuitenkin se korostaa välittömästi, että toiset teot ovat vieläkin vakavampia Allahin silmissä: ihmisten estäminen seuraamasta Allahin tietä, Hänen kieltämisensä, pääsyn estäminen Pyhään Moskeijaan (Mekassa) ja ihmisten karkottaminen kodeistaan. Jae huomauttaa, että sorto ja vaino ovat pahempia kuin fyysinen taistelu tai tappaminen. Se paljastaa niiden lopullisen tavoitteen, jotka vastustavat muslimeja: saada heidät luopumaan uskostaan. Tämä selventää, että aggressio oli vastustajien, ei muslimien, aloittama, ja että heidän tekojensa (uskonnollisen vainon ja estämisen) vakavuus ylittää selvästi tietyn taistelun pyhässä kuukaudessa. Jae varoittaa sitten ankarasti, että jokainen, joka luopuu uskostaan ja kuolee uskottomana, menettää kaiken tässä elämässä ja tuonpuoleisessa, kohdaten ankarat seuraukset. Tämä korostaa uskoon lujasti pitäytymisen tärkeyttä painostuksesta huolimatta. Seuraava jae tarjoaa toivoa niille, jotka pysyvät lujina ja pyrkivät Allahin asian puolesta.","translations":{"opas":"He kysyvät sinulta, Muhammed, onko taisteltava rauhoitetun kuukauden aikana. Sano: »Taisteleminen sen aikana on raskas synti; mutta käännyttäminen Jumalan tieltä, Jumalan kiel~ täminen, Rauhoitetun temppelin häpäiseminen ja kävijöiden ajaminen pois sieltä on vielä pahempaa Jumalan silmissä. Sillä pakanuuteen käännyttäminen on pahempi kuin murha.» He eivät lakkaa sotimasta teitä vastaan, ennenkuin ovat saaneet, mikäli voivat, teidät luopumaan uskonnostanne. Mutta niiden teot, jotka luopuvat uskonnostaan ja kuolevat uskottomuudessaan, tulevat olemaan turhia sekä tässä että tulevassa elämässä, heistä tulee Tulen asukkaita ja he pysyvät siinä iankaikkisesti.","clear":"He kysyvät sinulta ˹oi Profeetta˺ taistelemisesta pyhinä kuukausina. Sano: ”Taisteleminen näiden kuukausien aikana on suuri synti. Mutta ˹muiden˺ estäminen Jumalan tieltä, Hänen hylkäämisensä ja palvojien karkottaminen pyhästä moskeijasta on ˹vielä˺ suurempi ˹synti˺ Jumalan silmissä. Sillä vainoaminen on paljon pahempaa kuin tappaminen. Eivätkä he lakkaa taistelemasta teitä vastaan, ennen kuin he saavat teidät luopumaan uskostanne – jos he pystyvät. Ja kuka tahansa teistä luopuu omasta uskostaan ja kuolee epäuskoisena, heidän tekonsa mitätöityvät tässä elämässä ja tuonpuoleisessa. He ovat niitä, jotka asuvat Tulessa. He tulevat olemaan siellä ikuisesti.”"}},{"verse":218,"commentary_en":"Following the warning in the previous verse about the consequences of abandoning faith under duress, this verse offers comfort and hope. It speaks of those who believed, who were forced to leave their homes (exiled), and who struggled and strove for the sake of Allah. These individuals, who faced immense hardship and persecution for their faith, are assured that they have hope of receiving Allah's mercy. It highlights the great value placed on sincere belief, sacrifice, and striving in the face of opposition. By mentioning Allah's attributes as Oft-Forgiving and Most Merciful, the verse reassures believers that their efforts and struggles are recognized and that Allah is ready to forgive any shortcomings and bestow His abundant mercy upon them. This serves as encouragement for believers to persevere.","commentary_fi":"Edellisen jakeen varoituksen jälkeen uskon hylkäämisen seurauksista pakon edessä, tämä jae tarjoaa lohtua ja toivoa. Se puhuu niistä, jotka uskoivat, jotka joutuivat lähtemään kodeistaan (karkotettiin) ja jotka kamppailivat ja pyrkivät Allahin vuoksi. Näille yksilöille, jotka kohtasivat valtavaa vastoinkäymistä ja vainoa uskonsa tähden, vakuutetaan, että heillä on toivoa saada Allahin armo. Se korostaa vilpittömälle uskolle, uhraukselle ja vastoinkäymisten edessä pyrkimiselle annettua suurta arvoa. Mainitsemalla Allahin ominaisuudet Paljon Anteeksiantavana ja Laupeimpana, jae vakuuttaa uskoville, että heidän ponnistelunsa ja kamppailunsa tunnistetaan ja että Allah on valmis antamaan anteeksi mahdolliset puutteet ja suomaan heille runsaan Armonsa. Tämä toimii rohkaisuna uskoville sinnikkäästi jatkaa.","arabic":"إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ ۚ وَاللَّهُ غَفُورٌ رَحِيمٌ","commentary":"Edellisen jakeen varoituksen jälkeen uskon hylkäämisen seurauksista pakon edessä, tämä jae tarjoaa lohtua ja toivoa. Se puhuu niistä, jotka uskoivat, jotka joutuivat lähtemään kodeistaan (karkotettiin) ja jotka kamppailivat ja pyrkivät Allahin vuoksi. Näille yksilöille, jotka kohtasivat valtavaa vastoinkäymistä ja vainoa uskonsa tähden, vakuutetaan, että heillä on toivoa saada Allahin armo. Se korostaa vilpittömälle uskolle, uhraukselle ja vastoinkäymisten edessä pyrkimiselle annettua suurta arvoa. Mainitsemalla Allahin ominaisuudet Paljon Anteeksiantavana ja Laupeimpana, jae vakuuttaa uskoville, että heidän ponnistelunsa ja kamppailunsa tunnistetaan ja että Allah on valmis antamaan anteeksi mahdolliset puutteet ja suomaan heille runsaan Armonsa. Tämä toimii rohkaisuna uskoville sinnikkäästi jatkaa.","translations":{"opas":"Jotka uskovat ja jotka ovat kotiseutunsa jättäneet vainottuina ja taistelleet Jumalan retkellä, nämä voivat totisesti luottaa Jumalan laupeuteen, sillä Jumala on armollinen ja laupias.","clear":"Totisesti ne, jotka ovat uskoneet, muuttaneet ja ponnistelleet Jumalan tiellä, voivat toivoa Jumalan armoa. Ja Jumala on Kaikkia Antava, Kaikkein Armollisin."}},{"verse":219,"commentary_en":"This verse addresses two separate questions. First, it tackles questions about intoxicants (like wine) and gambling, which were common practices at the time. The response acknowledges that while these may offer some temporary benefits or pleasures, their harm and negative consequences (\"great sin\") are far greater than any perceived profit. This highlights a principle for evaluating matters: weigh the good against the bad, and if the bad predominates, it should be avoided. This was an initial step in a gradual process of discouraging and eventually prohibiting these practices, recognizing they were deeply ingrained social habits. The second question in this verse asks about how much to spend in charity, building on the theme from verse 215. The answer is to spend \"what is beyond your needs,\" meaning what is surplus to one's basic, reasonable requirements and those of one's dependents. This encourages generosity beyond the minimum obligation. The verse concludes by stating that Allah makes His signs and guidance clear in this way so that we may reflect upon our lives. This reflection is further elaborated in the next verse.","commentary_fi":"Tämä jae käsittelee kahta erillistä kysymystä. Ensinnäkin se käsittelee kysymyksiä päihteistä (kuten viinistä) ja rahapeleistä, jotka olivat yleisiä käytäntöjä tuohon aikaan. Vastaus tunnustaa, että vaikka nämä saattavat tarjota joitain väliaikaisia etuja tai nautintoja, niiden haitta ja kielteiset seuraukset (\"suuri synti\") ovat paljon suuremmat kuin mikään koettu hyöty. Tämä korostaa periaatetta asioiden arvioimiseksi: punnitaan hyvää ja pahaa, ja jos paha hallitsee, sitä tulee välttää. Tämä oli alkuaskel asteittaisessa prosessissa, jolla näitä käytäntöjä lannistettiin ja lopulta kiellettiin, tunnustaen niiden olleen syvään juurtuneita yhteiskunnallisia tapoja. Toinen kysymys tässä jakeessa koskee sitä, kuinka paljon tulisi käyttää hyväntekeväisyyteen, jatkaen teemaa jakeesta 215. Vastaus on käyttää \"mitä on yli tarpeidenne\", eli mitä on ylimääräistä omiin perustarpeisiin ja kohtuullisiin vaatimuksiin sekä omien huollettavien tarpeisiin nähden. Tämä rohkaisee anteliaisuuteen yli minimivelvoitteen. Jae päättyy toteamalla, että Allah tekee merkkinsä ja ohjeistuksensa selväksi tällä tavoin, jotta voimme mietiskellä elämäämme. Tämä mietiskelyä tarkennetaan seuraavassa jakeessa.","arabic":"يَسْأَلُونَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِ ۖ قُلْ فِيهِمَا إِثْمٌ كَبِيرٌ وَمَنَافِعُ لِلنَّاسِ وَإِثْمُهُمَا أَكْبَرُ مِنْ نَفْعِهِمَا ۗ وَيَسْأَلُونَكَ مَاذَا يُنْفِقُونَ قُلِ الْعَفْوَ ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ لَعَلَّكُمْ تَتَفَكَّرُونَ","commentary":"Tämä jae käsittelee kahta erillistä kysymystä. Ensinnäkin se käsittelee kysymyksiä päihteistä (kuten viinistä) ja rahapeleistä, jotka olivat yleisiä käytäntöjä tuohon aikaan. Vastaus tunnustaa, että vaikka nämä saattavat tarjota joitain väliaikaisia etuja tai nautintoja, niiden haitta ja kielteiset seuraukset (\"suuri synti\") ovat paljon suuremmat kuin mikään koettu hyöty. Tämä korostaa periaatetta asioiden arvioimiseksi: punnitaan hyvää ja pahaa, ja jos paha hallitsee, sitä tulee välttää. Tämä oli alkuaskel asteittaisessa prosessissa, jolla näitä käytäntöjä lannistettiin ja lopulta kiellettiin, tunnustaen niiden olleen syvään juurtuneita yhteiskunnallisia tapoja. Toinen kysymys tässä jakeessa koskee sitä, kuinka paljon tulisi käyttää hyväntekeväisyyteen, jatkaen teemaa jakeesta 215. Vastaus on käyttää \"mitä on yli tarpeidenne\", eli mitä on ylimääräistä omiin perustarpeisiin ja kohtuullisiin vaatimuksiin sekä omien huollettavien tarpeisiin nähden. Tämä rohkaisee anteliaisuuteen yli minimivelvoitteen. Jae päättyy toteamalla, että Allah tekee merkkinsä ja ohjeistuksensa selväksi tällä tavoin, jotta voimme mietiskellä elämäämme. Tämä mietiskelyä tarkennetaan seuraavassa jakeessa.","translations":{"opas":"He kysyvät sinulta, onko viini ja uhkapeli sallittua. Sano: »Molempiin sisältyy suuri synti, vaikkakin niistä on joitakin etuja ihmisille ; kuitenkin on synti suurempi kuin hyöty.» Vielä he kysyvät, mitä heidän on lahjoitettava pois. Sano: »Se, mitä teillä on liikaa». Niin selittää Jumala tunnusmerkit teille. jotta osaisitte miettiä","clear":"He kysyvät sinulta ˹oi Profeetta˺ päihdyttävistä aineista ja uhkapelistä. Sano: ”Molemmat ovat suuri paha, samoin kuin niistä on jonkin verran hyötyä ihmisille – mutta paha ylittää hyödyn.” He kysyvät ˹myös˺, mitä heidän pitäisi lahjoittaa. Sano: ”Mitä tahansa voitte säästää.” Näin Jumala tekee ilmoituksensa selväksi teille ˹uskovat˺, jotta ehkä voisitte pohtia"}},{"verse":220,"commentary_en":"This verse continues the reflection mentioned at the end of verse 219, urging us to consider the implications of Allah's guidance on both this life and the life to come. It then addresses a new question concerning the treatment of orphans. It instructs that the guiding principle for those caring for orphans should be to do what is best for their welfare and improvement. If guardians find it easier or more practical to mix the orphans' affairs or property with their own, they are reminded that the orphans are their brothers and sisters in faith, implying a responsibility based on kinship and brotherhood. However, it sternly warns against exploiting or harming the orphans' interests under the guise of mixing affairs. Allah, who has perfect knowledge, can distinguish between those who genuinely intend good for the orphans and those who intend harm or mischief. The verse concludes by emphasizing that Allah, in His power and wisdom, could have made matters more difficult for us, but He has provided clear guidance out of His mercy. This serves as a reminder of Allah's grace and the ease He intends for believers, encouraging them to act sincerely according to His guidance, especially concerning the vulnerable.","commentary_fi":"Tämä jae jatkaa jakeen 219 lopussa mainittua mietiskelyä, kehottaen meitä harkitsemaan Allahin ohjeistuksen seurauksia sekä tässä elämässä että tulevassa. Se käsittelee sitten uutta kysymystä orpojen kohtelusta. Se ohjeistaa, että orvoista huolehtivien ohjaavana periaatteena tulisi olla tehdä se, mikä on parasta heidän hyvinvoinnilleen ja parantamisekseen. Jos huoltajat kokevat helpommaksi tai käytännöllisemmäksi sekoittaa orpojen asioita tai omaisuutta omiinsa, heitä muistutetaan, että orvot ovat heidän uskonsisaruksiaan ja -veljiään, mikä merkitsee vastuuta sukulaisuuden ja veljeyden perusteella. Kuitenkin se varoittaa ankarasti orpojen etujen riistämisestä tai vahingoittamisesta asioiden sekoittamisen varjolla. Allah, jolla on täydellinen tieto, voi erottaa ne, jotka vilpittömästi aikovat hyvää orvoille, ja ne, jotka aikovat vahinkoa tai ilkivaltaa. Jae päättyy korostamalla, että Allah, Voimassaan ja Viisaudessaan, olisi voinut tehdä asiat meille vaikeammiksi, mutta Hän on antanut selkeän ohjeistuksen Armostaan. Tämä toimii muistutuksena Allahin armosta ja helpotuksesta, jonka Hän tarkoittaa uskoville, rohkaisten heitä toimimaan vilpittömästi Hänen ohjeistuksensa mukaisesti, erityisesti haavoittuvaisia koskevissa asioissa.","arabic":"فِي الدُّنْيَا وَالْآخِرَةِ ۗ وَيَسْأَلُونَكَ عَنِ الْيَتَامَىٰ ۖ قُلْ إِصْلَاحٌ لَهُمْ خَيْرٌ ۖ وَإِنْ تُخَالِطُوهُمْ فَإِخْوَانُكُمْ ۚ وَاللَّهُ يَعْلَمُ الْمُفْسِدَ مِنَ الْمُصْلِحِ ۚ وَلَوْ شَاءَ اللَّهُ لَأَعْنَتَكُمْ ۚ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ","commentary":"Tämä jae jatkaa jakeen 219 lopussa mainittua mietiskelyä, kehottaen meitä harkitsemaan Allahin ohjeistuksen seurauksia sekä tässä elämässä että tulevassa. Se käsittelee sitten uutta kysymystä orpojen kohtelusta. Se ohjeistaa, että orvoista huolehtivien ohjaavana periaatteena tulisi olla tehdä se, mikä on parasta heidän hyvinvoinnilleen ja parantamisekseen. Jos huoltajat kokevat helpommaksi tai käytännöllisemmäksi sekoittaa orpojen asioita tai omaisuutta omiinsa, heitä muistutetaan, että orvot ovat heidän uskonsisaruksiaan ja -veljiään, mikä merkitsee vastuuta sukulaisuuden ja veljeyden perusteella. Kuitenkin se varoittaa ankarasti orpojen etujen riistämisestä tai vahingoittamisesta asioiden sekoittamisen varjolla. Allah, jolla on täydellinen tieto, voi erottaa ne, jotka vilpittömästi aikovat hyvää orvoille, ja ne, jotka aikovat vahinkoa tai ilkivaltaa. Jae päättyy korostamalla, että Allah, Voimassaan ja Viisaudessaan, olisi voinut tehdä asiat meille vaikeammiksi, mutta Hän on antanut selkeän ohjeistuksen Armostaan. Tämä toimii muistutuksena Allahin armosta ja helpotuksesta, jonka Hän tarkoittaa uskoville, rohkaisten heitä toimimaan vilpittömästi Hänen ohjeistuksensa mukaisesti, erityisesti haavoittuvaisia koskevissa asioissa.","translations":{"opas":"tätä ja tulevaista elämää. He kysyvät sinulta myös, miten on meneteltävä orpojen suhteen. Sano: »Parasta on keventää heidän kohtaloaan». Jos elämänolot yhdistävät teidät heihin, niin ovat he teidän veljiänne. Jumala erottaa sen, joka pahentaa sitä, joka parantaa, ja jos Jumalasi tahtoisi, voisi Hän teidätkin masentaa; Jumala on totisesti mahtava, viisas.","clear":"tämän maailman ja tulevan elämän suhteen. Ja he kysyvät sinulta orvoista. Sano: ”Heidän tilanteensa parantaminen on parasta. Ja jos te teette yhteistyötä heidän kanssaan, he ovat sidoksissa teihin ˹uskossa˺. Ja Allah tietää, kuka aikoo vahingoittaa ja kuka aikoo hyvää. Jos Allah olisi tahtonut, Hän olisi voinut tehdä sen vaikeaksi teille. Varmasti Allah on Kaikkivoipa, Kaikkiviisas.”"}},{"verse":221,"commentary_en":"This verse addresses the foundational relationship of marriage within the Muslim community. It teaches that Muslims should not marry individuals who associate partners with Allah—a practice known as shirk, commonly referring to polytheists or idolaters—unless they come to believe in the One God. Even a believing slave woman, despite her lower social status, is considered better than an idolatrous woman, regardless of her physical attractiveness. This is because the spiritual connection built on shared faith is deeper and more enduring than physical appeal or social rank. Similarly, Muslim women are instructed not to marry men who commit shirk unless they embrace belief. The verse explains that those who reject faith lead others toward misguidance and ultimately the Fire, while Allah calls people toward His mercy, forgiveness, and Paradise. By encouraging marriages built on shared belief, the verse helps preserve the spiritual direction and identity of the Muslim community.","commentary_fi":"Tämä jae käsittelee avioliiton keskeistä merkitystä muslimiyhteisössä. Siinä opetetaan, että muslimien ei tulisi mennä naimisiin sellaisten henkilöiden kanssa, jotka asettavat muita Jumalan rinnalle – tätä kutsutaan shirkiksi, ja se viittaa usein monijumalaisuuteen tai epäjumalanpalvontaan – elleivät nämä henkilöt usko yhteen ainoaan Jumalaan. Vaikka uskovainen orjatar olisi alemmassa sosiaalisessa asemassa, hän on parempi kuin epäjumalia palvova nainen, riippumatta tämän ulkoisesta viehättävyydestä. Tämä johtuu siitä, että jaettu usko tuo syvemmän ja kestävämmän yhteyden kuin pelkkä fyysinen vetovoima tai sosiaalinen asema. Samoin musliminaisia kehotetaan olemaan menemättä naimisiin shirkkiä harjoittavien miesten kanssa, elleivät nämä hyväksy uskoa. Jaessa selitetään, että epäuskoiset johtavat pois Jumalan johdatuksesta ja kohti Tulta, kun taas Allah kutsuu armoonsa, anteeksiantoon ja Paratiisiin. Korostamalla uskoon perustuvaa avioliittoa tämä jae auttaa säilyttämään muslimiyhteisön hengellisen suunnan ja identiteetin.","arabic":"وَلَا تَنْكِحُوا الْمُشْرِكَاتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌ مُؤْمِنَةٌ خَيْرٌ مِنْ مُشْرِكَةٍ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا تُنْكِحُوا الْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا ۚ وَلَعَبْدٌ مُؤْمِنٌ خَيْرٌ مِنْ مُشْرِكٍ وَلَوْ أَعْجَبَكُمْ ۗ أُولَٰئِكَ يَدْعُونَ إِلَى النَّارِ ۖ وَاللَّهُ يَدْعُو إِلَى الْجَنَّةِ وَالْمَغْفِرَةِ بِإِذْنِهِ ۖ وَيُبَيِّنُ آيَاتِهِ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ","commentary":"Tämä jae käsittelee avioliiton keskeistä merkitystä muslimiyhteisössä. Siinä opetetaan, että muslimien ei tulisi mennä naimisiin sellaisten henkilöiden kanssa, jotka asettavat muita Jumalan rinnalle – tätä kutsutaan shirkiksi, ja se viittaa usein monijumalaisuuteen tai epäjumalanpalvontaan – elleivät nämä henkilöt usko yhteen ainoaan Jumalaan. Vaikka uskovainen orjatar olisi alemmassa sosiaalisessa asemassa, hän on parempi kuin epäjumalia palvova nainen, riippumatta tämän ulkoisesta viehättävyydestä. Tämä johtuu siitä, että jaettu usko tuo syvemmän ja kestävämmän yhteyden kuin pelkkä fyysinen vetovoima tai sosiaalinen asema. Samoin musliminaisia kehotetaan olemaan menemättä naimisiin shirkkiä harjoittavien miesten kanssa, elleivät nämä hyväksy uskoa. Jaessa selitetään, että epäuskoiset johtavat pois Jumalan johdatuksesta ja kohti Tulta, kun taas Allah kutsuu armoonsa, anteeksiantoon ja Paratiisiin. Korostamalla uskoon perustuvaa avioliittoa tämä jae auttaa säilyttämään muslimiyhteisön hengellisen suunnan ja identiteetin.","translations":{"opas":"Älkää naiko monijumalaisia naisia, elleivät he käänny uskoon. Uskovainen orjatar on totisesti parempi kuin monijumalainen vapaa nainen, vaikkapa tämä miellyttäisi teitä enemmän. Älkääkä antako tyttäriänne vaimoiksi monijumalaisille, ennenkuin he kääntyvät uskoon. Uskovainen orja on totisesti parempi kuin vapaa monijumalainen, vaikkapa jälkimmäinen miellyttäisi teitä enemmän. Nämä johdattavat teidät Tuleen, mutta Jumala kutsuu Paratiisiin ja armahdukseen ja selittää tunnusmerkkinsä ihmisille, jotta he pitäisivät ne mielessään.","clear":"Älkää menkö naimisiin monijumalaisten naisten kanssa ennen kuin he uskovat; sillä uskova orjanainen on parempi kuin vapaa monijumalainen, vaikka hän saattaisi näyttää teistä miellyttävältä. Ja älkää antako naisianne naimisiin monijumalaisten miesten kanssa ennen kuin he uskovat, sillä uskova orjamies on parempi kuin vapaa monijumalainen, vaikka hän saattaisi näyttää teistä miellyttävältä. He kutsuvat ˹teitä˺ Tuleen, kun taas Allah kutsuu ˹teitä˺ Paratiisiin ja anteeksiantoon armostaan. Hän tekee ilmoituksensa selväksi ihmisille, jotta he ehkä ottaisivat sen huomioon."}},{"verse":222,"commentary_en":"Following the guidelines on who Muslims should marry, this verse addresses matters of physical intimacy within marriage, specifically regarding menstruation. When asked about this, the answer given is that it is an unclean condition. Therefore, men are instructed to keep away from sexual intimacy with their wives during their menstrual periods and not to approach them in that way until they are clean. Once the women have purified themselves (after menstruation), couples may resume physical intimacy in the proper way as ordained by Allah. By following these guidelines and maintaining purity, Muslims demonstrate obedience to Allah, for He loves those who turn to Him in repentance and those who keep themselves pure. This verse transitions the discussion from the selection of a marriage partner to the purity and conduct within the marital relationship itself.","commentary_fi":"Avioliiton valintaa koskevien ohjeiden jälkeen tämä jae käsittelee fyysistä läheisyyttä avioliitossa, erityisesti kuukautisia. Kun tästä kysytään, annettu vastaus on, että se on epäpuhdas tila. Siksi miehiä kehotetaan pysymään erossa seksuaalisesta läheisyydestä vaimojensa kanssa heidän kuukautistensa aikana eivätkä lähestymään heitä sillä tavalla ennen kuin he ovat puhtaita. Kun naiset ovat puhdistautuneet (kuukautisten jälkeen), pariskunnat voivat jatkaa fyysistä läheisyyttä asianmukaisella tavalla, jonka Allah on säätänyt heille. Noudattamalla näitä ohjeita ja ylläpitämällä puhtautta muslimit osoittavat kuuliaisuutta Allahille, sillä Hän rakastaa niitä, jotka kääntyvät Hänen puoleensa jatkuvasti, ja Hän rakastaa niitä, jotka pitävät itsensä puhtaina. Tämä jae siirtää keskustelun avioliittokumppanin valinnasta avioliiton puhtauden ja käytöksen käsittelyyn.","arabic":"وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ ۖ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اللَّهُ ۚ إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ","commentary":"Avioliiton valintaa koskevien ohjeiden jälkeen tämä jae käsittelee fyysistä läheisyyttä avioliitossa, erityisesti kuukautisia. Kun tästä kysytään, annettu vastaus on, että se on epäpuhdas tila. Siksi miehiä kehotetaan pysymään erossa seksuaalisesta läheisyydestä vaimojensa kanssa heidän kuukautistensa aikana eivätkä lähestymään heitä sillä tavalla ennen kuin he ovat puhtaita. Kun naiset ovat puhdistautuneet (kuukautisten jälkeen), pariskunnat voivat jatkaa fyysistä läheisyyttä asianmukaisella tavalla, jonka Allah on säätänyt heille. Noudattamalla näitä ohjeita ja ylläpitämällä puhtautta muslimit osoittavat kuuliaisuutta Allahille, sillä Hän rakastaa niitä, jotka kääntyvät Hänen puoleensa jatkuvasti, ja Hän rakastaa niitä, jotka pitävät itsensä puhtaina. Tämä jae siirtää keskustelun avioliittokumppanin valinnasta avioliiton puhtauden ja käytöksen käsittelyyn.","translations":{"opas":"He kysyvät sinulta, Muhammed, miten on meneteltävä naisen kuukautispuhdistuksen aikana. Sano: »Se on heidän pahoinvointinsa; karttakaa siis naisia puhdistuksen aikana älkääkä lähestykö heitä, ennenkuin ovat puhdistuneet. Mutta kun he ovat puhdistuneet, käykää heidän luonaan, kuten Jumala on määrännyt. Jumala rakastaa totisesti Hänen puoleensa kääntyneitä ja rakastaa niitä, jotka pitävät itseään puhtaina.»","clear":"He kysyvät sinulta ˹oi Profeetta˺ kuukautisista. Sano: ”Varo sen haittaa! Pysykää siis erossa, älkääkä olko sukupuoliyhteydessä vaimojenne kanssa heidän kuukautiskiertonsa aikana, kunnes he ovat puhdistautuneet. Kun he ovat puhdistautuneet, silloin te voitte lähestyä heitä Allahin määräämällä tavalla. Varmasti Allah rakastaa niitä, jotka aina kääntyvät Hänen puoleensa katumuksessa, ja niitä, jotka puhdistavat itsensä.”"}},{"verse":223,"commentary_en":"This verse continues the discussion of marital intimacy, following the previous guidance on purity after menstruation. It uses the metaphor of wives as a \"tilth\"—fertile land—to illustrate the role of marriage in procreation and nurturing future generations. The imagery emphasizes both the physical and generative aspects of intimacy, within a lawful and respectful marital bond. Husbands are told they may approach their wives in the manner they desire, which scholars interpret as allowing flexibility in intimacy, provided it remains within the bounds of mutual respect and dignity. However, this physical relationship is not detached from spiritual responsibility. The verse advises believers to “send forth something good for yourselves,” a phrase open to multiple layers of meaning. One interpretation is that people should ensure the continuation of the human race. Another is that they should strive to raise a righteous generation—children with faith, morality, and humanity. The verse concludes by urging believers to remain mindful of Allah, and to remember that they will ultimately meet Him. This connects the physical dimension of marriage to spiritual awareness and accountability in the Hereafter. It reminds believers that even the intimate parts of life are part of a divinely guided path, contributing to both personal and communal well-being. In this way, marital intimacy is integrated into the broader framework of taqwa (God-consciousness) and worship.","commentary_fi":"Tämä jae jatkaa aviollista läheisyyttä koskevaa aihetta, liittyen edelliseen ohjeeseen puhtaudesta kuukautisten jälkeen. Siinä käytetään vertausta, jossa vaimoja kuvataan \"viljelysmaaksi\" – hedelmälliseksi maaksi – korostamaan avioliiton roolia lisääntymisessä ja tulevien sukupolvien kasvattamisessa. Tämä kuva tuo esiin sekä fyysisen että luovan puolen läheisyydessä, laillisessa ja kunnioittavassa avioliitossa. Miehiä kehotetaan lähestymään vaimojaan niin kuin haluavat, minkä oppineet tulkitsevat tarkoittavan joustavuutta intiimiydessä, kunhan se tapahtuu keskinäisellä kunnioituksella ja arvokkuudella. Fyysinen suhde ei kuitenkaan ole erillinen hengellisestä vastuusta. Jae neuvoo uskovia “lähettämään etukäteen jotakin hyvää itselleen”, mikä on ilmaus, jolla on useita merkityksiä. Yksi tulkinta on, että ihmisen tulisi huolehtia ihmiskunnan jatkuvuudesta. Toinen, syvempi tulkinta on, että tulisi pyrkiä kasvattamaan hurskasta sukupolvea – lapsia, joilla on uskoa, moraalia ja inhimillisyyttä. Jae päättyy kehotukseen pelätä Allahia ja muistaa, että Hänet kohdataan vielä. Tämä yhdistää aviollisen läheisyyden henkiseen tietoisuuteen ja vastuuseen Tuonpuoleisessa. Se muistuttaa, että myös elämän intiimit osa-alueet ovat osa Allahin ohjaamaa tietä, joka edistää yksilön ja yhteisön hyvinvointia. Näin aviollinen läheisyys integroidaan osaksi laajempaa taqwan (Jumalan pelon ja tietoisuuden) ja palvonnan kokonaisuutta.","arabic":"نِسَاؤُكُمْ حَرْثٌ لَكُمْ فَأْتُوا حَرْثَكُمْ أَنَّىٰ شِئْتُمْ ۖ وَقَدِّمُوا لِأَنْفُسِكُمْ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّكُمْ مُلَاقُوهُ ۗ وَبَشِّرِ الْمُؤْمِنِينَ","commentary":"Tämä jae jatkaa aviollista läheisyyttä koskevaa aihetta, liittyen edelliseen ohjeeseen puhtaudesta kuukautisten jälkeen. Siinä käytetään vertausta, jossa vaimoja kuvataan \"viljelysmaaksi\" – hedelmälliseksi maaksi – korostamaan avioliiton roolia lisääntymisessä ja tulevien sukupolvien kasvattamisessa. Tämä kuva tuo esiin sekä fyysisen että luovan puolen läheisyydessä, laillisessa ja kunnioittavassa avioliitossa. Miehiä kehotetaan lähestymään vaimojaan niin kuin haluavat, minkä oppineet tulkitsevat tarkoittavan joustavuutta intiimiydessä, kunhan se tapahtuu keskinäisellä kunnioituksella ja arvokkuudella. Fyysinen suhde ei kuitenkaan ole erillinen hengellisestä vastuusta. Jae neuvoo uskovia “lähettämään etukäteen jotakin hyvää itselleen”, mikä on ilmaus, jolla on useita merkityksiä. Yksi tulkinta on, että ihmisen tulisi huolehtia ihmiskunnan jatkuvuudesta. Toinen, syvempi tulkinta on, että tulisi pyrkiä kasvattamaan hurskasta sukupolvea – lapsia, joilla on uskoa, moraalia ja inhimillisyyttä. Jae päättyy kehotukseen pelätä Allahia ja muistaa, että Hänet kohdataan vielä. Tämä yhdistää aviollisen läheisyyden henkiseen tietoisuuteen ja vastuuseen Tuonpuoleisessa. Se muistuttaa, että myös elämän intiimit osa-alueet ovat osa Allahin ohjaamaa tietä, joka edistää yksilön ja yhteisön hyvinvointia. Näin aviollinen läheisyys integroidaan osaksi laajempaa taqwan (Jumalan pelon ja tietoisuuden) ja palvonnan kokonaisuutta.","translations":{"opas":"Vaimonne ovat teidän vaimonne, käykää vainiollanne mielenne mukaan, mutta suorittakaa myös ensin jotakin hyvää sielujenne puolesta. Pelätkää Jumalaa ja tietäkää, että tulette kohtaamaan hänet. Julista, Muhammed, uskovaisille ilosanomaa!","clear":"Vaimonne ovat kuin peltoja teille, joten lähestykää heitä ˹sopuillen˺, niin kuin teille miellyttää. Ja lähettäkää eteenpäin jotain hyvää itsellenne. Olkaa tietoisia Allahista ja tietäkää, että te tapaatte Hänet. Ja antakaa hyviä uutisia uskoville."}},{"verse":224,"commentary_en":"This verse shifts the focus to the subject of oaths, particularly those sworn in the name of Allah. It teaches that invoking Allah's name should not be used as a pretext to avoid doing what is good, acting with righteousness, or making peace between people. If someone takes an oath that would prevent them from carrying out a beneficial or moral act, it is better to break that oath and do the good deed—then make the prescribed kaffārah (atonement) for the broken oath, as outlined in Islamic law. The verse establishes a key principle: the promotion of goodness, justice, and reconciliation takes precedence over rigidly sticking to an oath that leads to harm or neglect of moral duty. This also reminds believers that Allah is All-Hearing and All-Knowing, emphasizing the seriousness of invoking His name and the need to act with sincerity and accountability. This verse serves as a general guideline on the ethics of oaths before proceeding to specific rulings related to marital relationships in the following verses.","commentary_fi":"Tässä jakeessa siirrytään valojen eli lupausten aiheeseen, erityisesti sellaisiin, jotka vannotaan Allahin nimeen. Jae opettaa, ettei Allahin nimeä tule käyttää tekosyynä kieltäytyä hyvistä teoista, toimimasta oikeudenmukaisesti tai sovittelemasta ihmisten välisiä ristiriitoja. Jos henkilö vannoo valan, joka estää häntä tekemästä jotakin hyvää tai hyödyllistä, on parempi rikkoa tuo vala ja toteuttaa hyvä teko – ja sen jälkeen suorittaa islamin opetusten mukainen kaffārah (hyvitys) rikotusta valasta. Jae asettaa tärkeän periaatteen: hyvyyden, oikeamielisyyden ja sovinnon edistäminen on tärkeämpää kuin pitää kiinni valasta, joka johtaisi vahinkoon tai moraalisen velvollisuuden laiminlyöntiin. Samalla muistutetaan, että Allah kuulee ja tietää kaiken, mikä korostaa vastuullisuutta silloin, kun Hänen nimeään käytetään. Tämä jae toimii yleisenä ohjenuorana vala-asioissa ennen kuin seuraavat jakeet käsittelevät tarkempia määräyksiä avioliittoon liittyen.","arabic":"وَلَا تَجْعَلُوا اللَّهَ عُرْضَةً لِأَيْمَانِكُمْ أَنْ تَبَرُّوا وَتَتَّقُوا وَتُصْلِحُوا بَيْنَ النَّاسِ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ","commentary":"Tässä jakeessa siirrytään valojen eli lupausten aiheeseen, erityisesti sellaisiin, jotka vannotaan Allahin nimeen. Jae opettaa, ettei Allahin nimeä tule käyttää tekosyynä kieltäytyä hyvistä teoista, toimimasta oikeudenmukaisesti tai sovittelemasta ihmisten välisiä ristiriitoja. Jos henkilö vannoo valan, joka estää häntä tekemästä jotakin hyvää tai hyödyllistä, on parempi rikkoa tuo vala ja toteuttaa hyvä teko – ja sen jälkeen suorittaa islamin opetusten mukainen kaffārah (hyvitys) rikotusta valasta. Jae asettaa tärkeän periaatteen: hyvyyden, oikeamielisyyden ja sovinnon edistäminen on tärkeämpää kuin pitää kiinni valasta, joka johtaisi vahinkoon tai moraalisen velvollisuuden laiminlyöntiin. Samalla muistutetaan, että Allah kuulee ja tietää kaiken, mikä korostaa vastuullisuutta silloin, kun Hänen nimeään käytetään. Tämä jae toimii yleisenä ohjenuorana vala-asioissa ennen kuin seuraavat jakeet käsittelevät tarkempia määräyksiä avioliittoon liittyen.","translations":{"opas":"Älkää siten vannoko Jumalan kautta, että se estäisi teitä olemasta hurskaita, pelkäämästä Jumalaa ja tekemästä oikeutta ihmisille: onhan Jumala kuuleva ja tietävä.","clear":"Älkää käyttäkö Allahin nimeä valoissanne tekosyynä olla tekemättä hyvää, varomatta pahaa tai sovittelematta ihmisten välillä. Ja Allah on Kaikkikuuleva, Kaikkitietävä."}},{"verse":225,"commentary_en":"Following the general principle about oaths in t
