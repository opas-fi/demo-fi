skovien asennetta: he sanovat, \"Me kuulemme ja tottelemme\", mikä ilmaisee täydellistä alistumista Allahin ohjeisiin. Tunnustaen inhimilliset puutteensa, he pyytävät Allahin anteeksiantoa ja vahvistavat varmuutensa siitä, että he palaavat Hänen luokseen. Tämä tietoisuus siitä, että elämä päättyy tilivelvollisuuteen Allahille, ohjaa uskovan elämänkatsomusta ja käytöstä. Jae kytkeytyy suuran alkuun, jossa myös puhutaan niistä uskon periaatteista, jotka ohjaavat oikealla tiellä olevia.","arabic":"آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ","commentary":"Tämä jae esittelee viisi uskon ydinkohtaa, joihin jokainen muslimi uskoo: usko Allahiin, Hänen enkeleihinsä, Hänen ilmoitettuihin kirjoihinsa, kaikkiin Hänen lähettiläisiinsä sekä varmuus siitä, että jokainen palaa lopulta Hänen luokseen. Muslimit uskovat, että kaikki profeetat—Aadamista Muhammediin—toivat viestin samasta jumalallisesta lähteestä, eikä heidän välillään tehdä eroa uskon tai kunnioituksen suhteen. Jae kuvaa myös uskovien asennetta: he sanovat, \"Me kuulemme ja tottelemme\", mikä ilmaisee täydellistä alistumista Allahin ohjeisiin. Tunnustaen inhimilliset puutteensa, he pyytävät Allahin anteeksiantoa ja vahvistavat varmuutensa siitä, että he palaavat Hänen luokseen. Tämä tietoisuus siitä, että elämä päättyy tilivelvollisuuteen Allahille, ohjaa uskovan elämänkatsomusta ja käytöstä. Jae kytkeytyy suuran alkuun, jossa myös puhutaan niistä uskon periaatteista, jotka ohjaavat oikealla tiellä olevia.","translations":{"opas":"Profeetta uskoo siihen, minkä hänen Herransa on hänelle ilmoittanut, samoin uskovaiset; jokainen heistä uskoo Jumalaan, Hänen enkeleihinsä ja Hänen lähettiläisiinsä. Me emme tee erotusta Hänen profeettainsa välillä, ja he sanovat: »Me kuulemme ja tottelemme. Sinulla on (meille) anteeksiantamus, oi Herra! Niin, Sinussa on määränpää.»","clear":"Sanansaattaja uskoo ˹vakaasti˺ siihen, mikä hänelle on Herraltaan ilmoitettu, ja niin tekevät uskovaisetkin. He ˹kaikki˺ uskovat Jumalaan, Hänen enkeleihinsä, Hänen kirjoihinsa ja Hänen sanansaattajiinsa. ˹He julistavat:˺ ”Me emme tee eroa Hänen sanansaattajiensa välillä.” Ja he sanovat: ”Me kuulemme ja tottelemme. ˹Anomme˺ Sinun anteeksiantoasi, Herramme! Ja Sinun luoksesi ˹yksin˺ on lopullinen paluu.”"}},{"verse":286,"commentary_en":"This verse offers deep reassurance and emphasizes individual responsibility and Allah’s mercy. It affirms that Allah does not burden any soul with more than it can bear. This is a profound source of comfort for believers, reminding them that Allah fully understands their strengths and limitations. The verse also highlights the principle of personal accountability: each person will be rewarded for the good they do and will bear the consequences of their own misdeeds. Everyone is ultimately responsible for their actions and will stand before Allah individually. Following this framework of justice and divine compassion, the verse transitions into a heartfelt supplication from the believers. They plead with Allah not to hold them accountable for mistakes made out of forgetfulness or error. They also ask not to be tested with heavy burdens like those placed on earlier communities—recognizing the historical consequences faced by those who disobeyed or resisted divine guidance. Furthermore, they beg not to be burdened beyond their capacity, whether physically or spiritually. The supplication continues with a plea for Allah’s pardon, forgiveness, and mercy—acknowledging that ultimate relief and success come only through His grace. It concludes with a declaration of trust in Allah as their Guardian and Protector, and a request for His help against those who oppose the truth. This powerful prayer encapsulates the humility of the believers, their dependence on Allah’s mercy, and their determination to uphold faith with divine support.","commentary_fi":"Tämä jae tarjoaa syvällistä lohtua ja korostaa yksilöllistä vastuuta sekä Allahin armollisuutta. Se vakuuttaa, ettei Allah aseta yhdellekään sielulle taakkaa, joka olisi sen kykyjen ulkopuolella. Tämä on suuri lohdun lähde uskoville, sillä se muistuttaa, että Allah tuntee luotunsa ja heidän vahvuutensa ja rajansa. Jae korostaa myös henkilökohtaista vastuullisuutta: jokainen saa palkkion tekemästään hyvästä ja kantaa vastuun tekemästään pahasta. Jokainen on vastuussa omista teoistaan ja seisoo yksin Allahin edessä. Tämän oikeudenmukaisuuden ja laupeuden periaatteen jälkeen jae siirtyy vilpittömään uskovien rukoukseen. He pyytävät, ettei Allah rankaisisi heitä unohduksesta tai tahattomasta virheestä. He rukoilevat myös, etteivät he joutuisi samanlaisten raskaiden taakkojen alle kuin jotkut aiemmat yhteisöt, jotka kohtasivat ankarat seuraukset tottelemattomuudestaan. Lisäksi he pyytävät, ettei heitä rasitettaisi enempää kuin mitä he kykenevät kantamaan – niin ruumiillisesti kuin henkisesti.","arabic":"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","commentary":"Tämä jae tarjoaa syvällistä lohtua ja korostaa yksilöllistä vastuuta sekä Allahin armollisuutta. Se vakuuttaa, ettei Allah aseta yhdellekään sielulle taakkaa, joka olisi sen kykyjen ulkopuolella. Tämä on suuri lohdun lähde uskoville, sillä se muistuttaa, että Allah tuntee luotunsa ja heidän vahvuutensa ja rajansa. Jae korostaa myös henkilökohtaista vastuullisuutta: jokainen saa palkkion tekemästään hyvästä ja kantaa vastuun tekemästään pahasta. Jokainen on vastuussa omista teoistaan ja seisoo yksin Allahin edessä. Tämän oikeudenmukaisuuden ja laupeuden periaatteen jälkeen jae siirtyy vilpittömään uskovien rukoukseen. He pyytävät, ettei Allah rankaisisi heitä unohduksesta tai tahattomasta virheestä. He rukoilevat myös, etteivät he joutuisi samanlaisten raskaiden taakkojen alle kuin jotkut aiemmat yhteisöt, jotka kohtasivat ankarat seuraukset tottelemattomuudestaan. Lisäksi he pyytävät, ettei heitä rasitettaisi enempää kuin mitä he kykenevät kantamaan – niin ruumiillisesti kuin henkisesti.","translations":{"opas":"Jumala ei ketään rasita yli voimien; mitä kukin on aikaansaanut, on hänen edukseen, ja häntä vastaan nousee vain se, minkä hän itse on aiheuttanut. Herramme, älä rankaise meitä, jos hairahdumme tai rikomme! Herra, älä pane kannettavaksemme sellaista taakkaa, kuin annoit niiden osaksi, jotka ovat ennen meitä eläneet! Herra, älä pakota meitä kantamaan sitä, mihin eivät voimamme riitä! Ole pitkämielinen, anna anteeksi ja armahda meitä! Olet suojelijamme; auta meitä uskottomia vastaan!","clear":"Jumala ei vaadi yhdeltäkään sielulta enempää kuin se jaksaa. Kaikki hyvä koituu sen omaksi hyödyksi ja kaikki paha sen omaksi vahingoksi. ˹Uskovat rukoilevat:˺ ”Herramme! Älä rankaise meitä, jos unohdamme tai teemme virheen. Herramme! Älä aseta taakkaamme sellaista, jonka asetit niille, jotka olivat ennen meitä. Herramme! Älä kuormita meitä sillä, mitä emme jaksa kantaa. Anna meille anteeksi, anna meille armo ja ole meille armollinen. Sinä olet meidän ˹ainoa˺ Suojelijamme. Anna siis meille voitto epäuskoisista.”"}}];
    const translationSources = ["opas","clear"];

    function renderVerses() {
      const container = document.getElementById('verseContainer');
      verses.forEach((verse) => {
        const verseDiv = document.createElement('div');
        verseDiv.classList.add('verse');

        const verseNumber = document.createElement('div');
        verseNumber.classList.add('verse-number');
        verseNumber.textContent = 'Jae ' + verse.verse;

        const arabicText = document.createElement('div');
        arabicText.classList.add('arabic-text');
        arabicText.textContent = verse.arabic;

        const translationLine = document.createElement('div');
        translationLine.classList.add('translation-line');

        const selector = document.createElement('select');
        translationSources.forEach(option => {
          const opt = document.createElement('option');
          opt.value = option;
          opt.textContent = option;
          selector.appendChild(opt);
        });

        const verseText = document.createElement('div');
        verseText.classList.add('verse-text');
        verseText.innerHTML = verse.translations[translationSources[0]] || '';

        selector.addEventListener('change', () => {
          verseText.innerHTML = verse.translations[selector.value] || '';
        });

        translationLine.appendChild(selector);
        translationLine.appendChild(verseText);

        const verseCommentary = document.createElement('div');
        verseCommentary.classList.add('commentary');
        verseCommentary.innerHTML = verse.commentary;

        verseDiv.appendChild(verseNumber);
        // verseDiv.appendChild(arabicText);
        verseDiv.appendChild(translationLine);
        verseDiv.appendChild(verseCommentary);

        container.appendChild(verseDiv);
      });
    }
    renderVerses();
  </script>
</body>
</html>
