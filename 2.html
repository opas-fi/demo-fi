nöyryys. Allah esittää tällaisia vertauksia selkeästi, jotta ihmiset voisivat syvällisesti pohtia tekojaan ja niiden seurauksia. Se vahvistaa aiempien jakeiden viestin: hyvien tekojen on perustuttava aitoon uskoon ja oikeaan käytökseen, jotta niillä olisi pysyvää arvoa.","translations":{"opas":"Toivoisikohan kukaan teistä, että hänellä olisi puutarha, jossa on palmuja ja viiniköynnöksiä sekä kaikenlaisia hedelmiä ja jossa purot solisevat, ja että vanhuus yllättäisi hänet hänen pienten lastensa ollessa vielä turvattomia ja salamoiva hirmumyrsky hävittäisi ja polttaisi poroksi sen (puutarhan)? Näin Jumala selittää teille tunnusmerkkinsä, jotta miettisitte.","clear":"Haluaisiko kukaan teistä omistaa puutarhaa, jossa on palmuja, viiniköynnöksiä ja kaikenlaisia hedelmiä, ja jonka alitse virtaavat joet, ja kun he vanhenevat ja heillä on huollettavia lapsia, tulinen pyörremyrsky iskee puutarhaan polttaen sen kokonaan? Näin Allah selventää ilmoituksensa teille, jotta ehkä pohtisitte."}},{"verse":267,"commentary_en":"Shifting from the manner and intention of giving, this verse addresses the quality of what is given. It directs believers to give in charity from the good and lawful wealth they have earned or from the good produce that Allah has provided from the earth. Allah emphasizes the true source of provision by saying, \"and from that which We have brought forth for you from the earth.\" Upon reflecting on the phrase \"Spend from the good things which you have earned,\" we see that Allah honors and acknowledges human effort. However, earning is not the ultimate source of provision. Rather, the ability to earn is itself a gift from Allah: you can only work because of the energy He grants you, the intellect He bestows, and the earth He has made accessible. The many tools and faculties involved in earning are all blessings from Him. The verse strongly prohibits the practice of giving inferior or unwanted items in charity—things one would not accept for oneself except with reluctance or disdain. This sets a high ethical standard for giving, grounded in respect for both Allah and the recipient. The verse concludes by affirming that Allah is free of all needs and worthy of all praise—reminding us that He does not need our charity, but that its benefit returns to us. This builds on the earlier concept of giving for Allah’s sake by adding the essential dimension of offering the best of what one possesses.","commentary_fi":"Siirtyen pois antamisen tarkoituksesta ja käytöksestä, tämä jae käsittelee lahjoittamisen laatua. Uskovia kehotetaan antamaan hyväntekeväisyyteen siitä hyvästä ja sallitusta omaisuudesta, jonka he ovat ansainneet, tai siitä hyvästä sadosta, jonka Allah on antanut maan päältä. Allah korostaa elatuksen todellista lähdettä sanoessaan: \"ja siitä, mitä Me olemme tuoneet teille esiin maasta.\" Kun pohdimme lausetta \"Antakaa hyvistä asioista, jotka olette ansainneet,\" huomaamme, että Allah kunnioittaa ja tunnustaa ihmisen ponnistelut. Kuitenkin ansaitseminen ei ole elannon varsinainen lähde. Kyky ansaita on itsessään Allahin lahja: voit työskennellä vain siksi, että Hän antaa sinulle voimaa, järkeä ja maan, jonka Hän on tehnyt käyttökelpoiseksi. Kaikki ne välineet ja kyvyt, joita käytät ansaitsemiseen, ovat Hänen siunauksiaan. Jae kieltää jyrkästi sen, että hyväntekeväisyyteen annetaan huonoja tai ei-toivottuja asioita—sellaisia, joita ei itse hyväksyisi kuin vastentahtoisesti tai halveksuen. Tämä asettaa korkean eettisen standardin antamiselle, joka perustuu kunnioitukseen sekä Allahia että vastaanottajaa kohtaan. Jae päättyy muistutukseen, että Allah on täysin riippumaton eikä tarvitse mitään, ja että Hän on ylistyksen arvoinen—eli hyväntekeväisyys ei hyödytä Häntä, vaan hyödyttää antajaa itseään. Tämä syventää aiemmin esiin tuotua ajatusta Allahin vuoksi antamisesta lisäämällä keskeisen näkökulman: annetaan parasta, mitä omistetaan.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا أَنْفِقُوا مِنْ طَيِّبَاتِ مَا كَسَبْتُمْ وَمِمَّا أَخْرَجْنَا لَكُمْ مِنَ الْأَرْضِ ۖ وَلَا تَيَمَّمُوا الْخَبِيثَ مِنْهُ تُنْفِقُونَ وَلَسْتُمْ بِآخِذِيهِ إِلَّا أَنْ تُغْمِضُوا فِيهِ ۚ وَاعْلَمُوا أَنَّ اللَّهَ غَنِيٌّ حَمِيدٌ","commentary":"Siirtyen pois antamisen tarkoituksesta ja käytöksestä, tämä jae käsittelee lahjoittamisen laatua. Uskovia kehotetaan antamaan hyväntekeväisyyteen siitä hyvästä ja sallitusta omaisuudesta, jonka he ovat ansainneet, tai siitä hyvästä sadosta, jonka Allah on antanut maan päältä. Allah korostaa elatuksen todellista lähdettä sanoessaan: \"ja siitä, mitä Me olemme tuoneet teille esiin maasta.\" Kun pohdimme lausetta \"Antakaa hyvistä asioista, jotka olette ansainneet,\" huomaamme, että Allah kunnioittaa ja tunnustaa ihmisen ponnistelut. Kuitenkin ansaitseminen ei ole elannon varsinainen lähde. Kyky ansaita on itsessään Allahin lahja: voit työskennellä vain siksi, että Hän antaa sinulle voimaa, järkeä ja maan, jonka Hän on tehnyt käyttökelpoiseksi. Kaikki ne välineet ja kyvyt, joita käytät ansaitsemiseen, ovat Hänen siunauksiaan. Jae kieltää jyrkästi sen, että hyväntekeväisyyteen annetaan huonoja tai ei-toivottuja asioita—sellaisia, joita ei itse hyväksyisi kuin vastentahtoisesti tai halveksuen. Tämä asettaa korkean eettisen standardin antamiselle, joka perustuu kunnioitukseen sekä Allahia että vastaanottajaa kohtaan. Jae päättyy muistutukseen, että Allah on täysin riippumaton eikä tarvitse mitään, ja että Hän on ylistyksen arvoinen—eli hyväntekeväisyys ei hyödytä Häntä, vaan hyödyttää antajaa itseään. Tämä syventää aiemmin esiin tuotua ajatusta Allahin vuoksi antamisesta lisäämällä keskeisen näkökulman: annetaan parasta, mitä omistetaan.","translations":{"opas":"Te, jotka uskotte, uhratkaa parasta, mitä olette hankkineet, ja sitä, mitä Me olemme kasvattanut teille maasta, älkääkä etsikö huonointa uhritarkoituksiinne, koska ette itsekään ota vastaan sellaista muuten kuin halveksien. Tietäkää, että Jumalan on kaikki, rikkaus ja kunnia.","clear":"Oi uskovat! Lahjoittakaa parasta, mitä olette ansainneet ja mitä Olemme tuottaneet teille maasta. Älkää valitko lahjoitettavaksi arvottomia asioita, joita ette itse hyväksyisi kuin suljetuin silmin. Ja tietäkää, että Allah on Omavarainen, Ylistetty."}},{"verse":268,"commentary_en":"This verse speaks directly to the psychological barriers that can prevent generous giving. It reveals that Satan tries to frighten people with the fear of poverty if they spend in charity. He also encourages them toward indecent or shameful behavior—such as stinginess, hoarding, or pursuing wealth unjustly. In clear contrast, Allah promises forgiveness for shortcomings and abundant bounty to those who follow His path. This highlights a central tension: whether one succumbs to Satan’s fear-mongering or places their trust in Allah’s promise of provision and reward. The verse encourages believers to overcome hesitation and give freely. The verse concludes by affirming that Allah is All-Bountiful and All-Knowing, reassuring believers that He is fully aware of their struggles against temptation and their sincere efforts to do good. This directly connects to the previous verse’s directive to give from the best of what one has, by addressing the inner fear that may hinder generosity.","commentary_fi":"Tämä jae käsittelee suoraan psykologisia esteitä, jotka voivat estää anteliaisuuden. Siinä paljastetaan, että Saatana yrittää pelotella ihmisiä köyhyydellä, jos he antavat hyväntekeväisyyteen. Hän myös yllyttää heitä häpeälliseen tai sopimattomaan käytökseen—kuten saituuteen, omaisuuden hamstraamiseen tai epäoikeudenmukaiseen varallisuuden tavoitteluun.","arabic":"الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُمْ بِالْفَحْشَاءِ ۖ وَاللَّهُ يَعِدُكُمْ مَغْفِرَةً مِنْهُ وَفَضْلًا ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ","commentary":"Tämä jae käsittelee suoraan psykologisia esteitä, jotka voivat estää anteliaisuuden. Siinä paljastetaan, että Saatana yrittää pelotella ihmisiä köyhyydellä, jos he antavat hyväntekeväisyyteen. Hän myös yllyttää heitä häpeälliseen tai sopimattomaan käytökseen—kuten saituuteen, omaisuuden hamstraamiseen tai epäoikeudenmukaiseen varallisuuden tavoitteluun.","translations":{"opas":"Saatana uhkaa teitä köyhyydellä ja houkuttelee teitä halpamaisuuksiin, mutta Jumala lupaa teille anteeksiantonsa ja runsautensa. Jumala sulkee olemukseensa kaiken ja tietää kaiken.","clear":"Paholainen uhkaa teitä köyhyydellä ja kehottaa teitä häpeälliseen tekoon, kun taas Allah lupaa teille anteeksiantoa ja suuria lahjoja Häneltä. Ja Allah on Kaikkialla Runsaskätinen, Kaikkitietävä."}},{"verse":269,"commentary_en":"This verse addresses the gift of wisdom, which can be understood as the ability to perceive, internalize, and apply the deeper truths and guidance revealed by Allah—including principles related to giving and the purpose of life. It states that Allah grants this profound gift to whomever He wills. Whoever receives wisdom has indeed been granted an immense and overflowing benefit. The verse emphasizes that only those with genuine understanding and sound judgment are truly able to grasp the significance of Allah’s guidance—such as the contrast between the path of Allah and the misleading path promoted by Satan mentioned in the previous verse.","commentary_fi":"Tässä jakeessa käsitellään viisauden lahjaa, joka voidaan ymmärtää kykynä havaita, omaksua ja soveltaa Allahin ilmoittamia syvempiä totuuksia ja ohjeita – mukaan lukien anteliaisuuteen ja elämän tarkoitukseen liittyvät periaatteet. Siinä todetaan, että Allah myöntää tämän syvällisen lahjan kenelle tahtoo. Joka saa osakseen viisautta, on todella saanut suuren ja ylitsevuotavan hyvän. Jae korostaa, että vain ne, joilla on aitoa ymmärrystä ja tervettä harkintaa, kykenevät todella käsittämään Allahin ohjauksen merkityksen — kuten Allahin ilmoittama johdatus, joka eroaa täysin siitä harhaanjohtavasta tiestä, jota Saatana edistää.","arabic":"يُؤْتِي الْحِكْمَةَ مَنْ يَشَاءُ ۚ وَمَنْ يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا ۗ وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ","commentary":"Tässä jakeessa käsitellään viisauden lahjaa, joka voidaan ymmärtää kykynä havaita, omaksua ja soveltaa Allahin ilmoittamia syvempiä totuuksia ja ohjeita – mukaan lukien anteliaisuuteen ja elämän tarkoitukseen liittyvät periaatteet. Siinä todetaan, että Allah myöntää tämän syvällisen lahjan kenelle tahtoo. Joka saa osakseen viisautta, on todella saanut suuren ja ylitsevuotavan hyvän. Jae korostaa, että vain ne, joilla on aitoa ymmärrystä ja tervettä harkintaa, kykenevät todella käsittämään Allahin ohjauksen merkityksen — kuten Allahin ilmoittama johdatus, joka eroaa täysin siitä harhaanjohtavasta tiestä, jota Saatana edistää.","translations":{"opas":"Hän antaa viisautta kenelle tahtoo, ja kenelle viisaus on annettu, hän on saanut suuren aarteen, mutta vain ymmärtäväiset ovat tästä täysin selvillä.","clear":"Allah suo viisautta kenelle tahtoo. Ja kenelle on annettu viisaus, hänelle on totisesti suotu suuri etuoikeus. Mutta tätä ei ota huomioon kukaan muu kuin järkevät ihmiset."}},{"verse":270,"commentary_en":"This verse provides both reassurance and warning. It affirms that whatever believers spend—whether through obligatory charity (like Zakat), voluntary donations, or other devotional acts—Allah is fully aware of it. No sincere effort goes unnoticed by Him. The verse also mentions fulfilling vows. A vow refers to voluntarily committing to an extra act of worship that is not obligatory but still legislated by Allah—such as praying more than the five required daily prayers. While making a vow is optional, once made, it becomes a binding duty. This highlights the seriousness of such commitments and the wisdom in not making vows lightly, as one may later struggle to fulfill them. Finally, the verse contrasts the condition of believers with that of wrongdoers. While believers are assured that Allah sees and rewards their sincere deeds, wrongdoers—those who ignore or violate their duties—will have no helpers. This serves as a powerful reminder of personal accountability and Allah’s complete knowledge of our actions.","commentary_fi":"Tämä jae vahvistaa, että kaikki hyväntekeväisyysteot – olipa kyse pakollisesta zakatista, vapaaehtoisesta almuista tai muista hurskaista teoista – ovat täysin Allahin tiedossa. Yksikään vilpitön teko ei jää Häneltä huomaamatta. Jae mainitsee myös lupaukset. Lupaus tarkoittaa vapaaehtoista sitoutumista ylimääräiseen palvontaan, joka ei ole pakollista mutta jonka Allah on säätänyt, kuten ylimääräiset rukoukset pakollisten lisäksi. Lupauksen tekeminen on vapaaehtoista, mutta sen täyttäminen on sitovaa. Tämä muistuttaa siitä, ettei lupauksia tulisi tehdä kevyesti, sillä niiden täyttäminen voi myöhemmin osoittautua vaikeaksi. Lopuksi jae asettaa vastakkain uskovien ja vääryydentekijöiden tilanteen. Uskovat saavat varmuuden siitä, että Allah näkee ja palkitsee heidän vilpittömät tekonsa, kun taas vääryydentekijöillä ei ole auttajia. Tämä toimii vahvana muistutuksena henkilökohtaisesta vastuusta ja Allahin täydellisestä tiedosta.","arabic":"وَمَا أَنْفَقْتُمْ مِنْ نَفَقَةٍ أَوْ نَذَرْتُمْ مِنْ نَذْرٍ فَإِنَّ اللَّهَ يَعْلَمُهُ ۗ وَمَا لِلظَّالِمِينَ مِنْ أَنْصَارٍ","commentary":"Tämä jae vahvistaa, että kaikki hyväntekeväisyysteot – olipa kyse pakollisesta zakatista, vapaaehtoisesta almuista tai muista hurskaista teoista – ovat täysin Allahin tiedossa. Yksikään vilpitön teko ei jää Häneltä huomaamatta. Jae mainitsee myös lupaukset. Lupaus tarkoittaa vapaaehtoista sitoutumista ylimääräiseen palvontaan, joka ei ole pakollista mutta jonka Allah on säätänyt, kuten ylimääräiset rukoukset pakollisten lisäksi. Lupauksen tekeminen on vapaaehtoista, mutta sen täyttäminen on sitovaa. Tämä muistuttaa siitä, ettei lupauksia tulisi tehdä kevyesti, sillä niiden täyttäminen voi myöhemmin osoittautua vaikeaksi. Lopuksi jae asettaa vastakkain uskovien ja vääryydentekijöiden tilanteen. Uskovat saavat varmuuden siitä, että Allah näkee ja palkitsee heidän vilpittömät tekonsa, kun taas vääryydentekijöillä ei ole auttajia. Tämä toimii vahvana muistutuksena henkilökohtaisesta vastuusta ja Allahin täydellisestä tiedosta.","translations":{"opas":"ja mitä almuja annattekin tai uhrilupauksia teette, tietää Jumala sen totisesti, mutta väärin-tekijät jäävät ilman auttajaa.","clear":"Mitä tahansa hyväntekeväisyyttä annatte tai lupauksia teette, Jumala totisesti tietää ne. Ja väärintekijöillä ei ole auttajia."}},{"verse":271,"commentary_en":"This verse continues the discussion on giving charity, building on the previous point about the importance of intention. It explains that while giving charity openly is acceptable, doing so discreetly, particularly for voluntary acts, is often better. Giving charity privately helps ensure sincerity and avoids any potential for showing off or embarrassing the recipient. However, giving charity openly is also good and can encourage others to do the same. Regardless of whether charity is given openly or in secret, Allah is fully aware of the act and the intention behind it. The verse also mentions that giving charity can help purify a person and reduce the burden of their shortcomings.","commentary_fi":"Tämä jae jatkaa keskustelua hyväntekeväisyyden antamisesta, rakentuen edelliseen kohtaan aikomuksen tärkeydestä. Se selittää, että vaikka hyväntekeväisyyden antaminen avoimesti on hyväksyttävää, sen tekeminen huomaamattomasti, erityisesti vapaaehtoisten tekojen osalta, on usein parempi. Hyväntekeväisyyden antaminen yksityisesti auttaa varmistamaan vilpittömyyden ja välttämään mahdollisen ylpeilyn tai vastaanottajan nolaamisen. Kuitenkin hyväntekeväisyyden antaminen avoimesti on myös hyvää ja voi rohkaista muita tekemään samoin. Riippumatta siitä, annetaanko hyväntekeväisyyttä avoimesti vai salassa, Allah on täysin tietoinen teosta ja sen aikomuksesta. Jae mainitsee myös, että hyväntekeväisyyden antaminen voi auttaa puhdistamaan henkilöä ja vähentämään heidän puutteidensa taakkaa.","arabic":"إِنْ تُبْدُوا الصَّدَقَاتِ فَنِعِمَّا هِيَ ۖ وَإِنْ تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَكُمْ ۚ وَيُكَفِّرُ عَنْكُمْ مِنْ سَيِّئَاتِكُمْ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ","commentary":"Tämä jae jatkaa keskustelua hyväntekeväisyyden antamisesta, rakentuen edelliseen kohtaan aikomuksen tärkeydestä. Se selittää, että vaikka hyväntekeväisyyden antaminen avoimesti on hyväksyttävää, sen tekeminen huomaamattomasti, erityisesti vapaaehtoisten tekojen osalta, on usein parempi. Hyväntekeväisyyden antaminen yksityisesti auttaa varmistamaan vilpittömyyden ja välttämään mahdollisen ylpeilyn tai vastaanottajan nolaamisen. Kuitenkin hyväntekeväisyyden antaminen avoimesti on myös hyvää ja voi rohkaista muita tekemään samoin. Riippumatta siitä, annetaanko hyväntekeväisyyttä avoimesti vai salassa, Allah on täysin tietoinen teosta ja sen aikomuksesta. Jae mainitsee myös, että hyväntekeväisyyden antaminen voi auttaa puhdistamaan henkilöä ja vähentämään heidän puutteidensa taakkaa.","translations":{"opas":"Jos te annatte almunne julkisesti, on se hyvä asia, mutta jos te annatte ne salassa köyhille, on se vielä parempi itsellenne ja sovittaa osan pahoista teoistanne. Jumala tietää teidän tekonne.","clear":"Hyväntekeväisyyden antaminen julkisesti on hyvää, mutta köyhille antaminen yksityisesti on teille parempi ja se pyyhkii pois syntinne. Ja Jumala on tietoinen kaikesta, mitä teette."}},{"verse":272,"commentary_en":"This verse addresses the Prophet Muhammad ﷺ, clarifying that his responsibility is to convey the message of Allah, but the guidance of hearts is entirely in Allah’s control. It emphasizes that true faith and guidance are blessings that come only from Allah. The verse then shifts back to the theme of charity, stating that acts of giving can be directed to anyone in need, regardless of their faith, as long as the intention is pure—seeking only Allah’s pleasure. It teaches that whatever good you do, including giving in charity, is ultimately for your own benefit. Spiritually, it elevates your soul and brings reward in the Hereafter. The verse reassures believers that no act of good will go unnoticed or unrewarded, and Allah will never wrong anyone in what they are due.","commentary_fi":"Tämä jae osoitetaan profeetta Muhammadille ﷺ ja selventää, että hänen tehtävänsä on ainoastaan välittää Allahin viesti – mutta sydänten ohjaus on täysin Allahin vallassa. Se korostaa, että todellinen usko ja ohjaus ovat lahjoja, joita Allah antaa kenelle tahtoo. Jae palaa sitten hyväntekeväisyyden teemaan ja kertoo, että avustuksia voidaan antaa kaikille tarvitseville, uskonnosta riippumatta, kunhan aikomus on vilpitön ja pyritään yksinomaan Allahin miellyttämiseen. Jae opettaa, että jokainen tekemäsi hyvä teko – kuten almu – koituu viime kädessä sinun omaksi parhaaksesi. Se puhdistaa sielua ja tuo palkinnon tuonpuoleisessa. Jae vakuuttaa, ettei mikään hyvä teko jää huomaamatta tai palkitsematta, eikä Allah tee kenellekään vääryyttä.","arabic":"لَيْسَ عَلَيْكَ هُدَاهُمْ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ ۗ وَمَا تُنْفِقُوا مِنْ خَيْرٍ فَلِأَنْفُسِكُمْ ۚ وَمَا تُنْفِقُونَ إِلَّا ابْتِغَاءَ وَجْهِ اللَّهِ ۚ وَمَا تُنْفِقُوا مِنْ خَيْرٍ يُوَفَّ إِلَيْكُمْ وَأَنْتُمْ لَا تُظْلَمُونَ","commentary":"Tämä jae osoitetaan profeetta Muhammadille ﷺ ja selventää, että hänen tehtävänsä on ainoastaan välittää Allahin viesti – mutta sydänten ohjaus on täysin Allahin vallassa. Se korostaa, että todellinen usko ja ohjaus ovat lahjoja, joita Allah antaa kenelle tahtoo. Jae palaa sitten hyväntekeväisyyden teemaan ja kertoo, että avustuksia voidaan antaa kaikille tarvitseville, uskonnosta riippumatta, kunhan aikomus on vilpitön ja pyritään yksinomaan Allahin miellyttämiseen. Jae opettaa, että jokainen tekemäsi hyvä teko – kuten almu – koituu viime kädessä sinun omaksi parhaaksesi. Se puhdistaa sielua ja tuo palkinnon tuonpuoleisessa. Jae vakuuttaa, ettei mikään hyvä teko jää huomaamatta tai palkitsematta, eikä Allah tee kenellekään vääryyttä.","translations":{"opas":"Sinun velvollisuutesi, Muhammed, ei ole ohjata heitä (uskottomia), Jumala ohjaa ketä haluaa. Mitä hyvää annattekin pois, on se omaksi parhaaksenne, kun ette sillä muuhun pyri kuin Jumalan kasvojen eteen; ja mitä hyvää uhraattekin, tulee se teille täysin korvatuksi, teidän kärsimättä mitään vääryyttä.","clear":"Sinä et ole vastuussa ihmisten ohjauksesta ˹Oi Profeetta˺—Jumala ohjaa kenet Hän tahtoo. Mitä te ˹uskovat˺ käytätte hyväntekeväisyyteen, se on omaksi hyväksenne – niin kauan kuin teette sen tavoitellen Jumalan mielihyvää. Kaikki, mitä lahjoitatte, maksetaan teille takaisin täysimääräisesti, eikä teitä tulla vääryydellä kohtelemaan."}},{"verse":273,"commentary_en":"This verse describes a specific group of people who are particularly deserving of charity. These are individuals who are in need but are unable to travel or work to earn a living—especially those whose hardship results from their commitment to serving Allah’s cause or the community. The verse highlights their dignity and self-respect: they remain modest and do not beg. Because of their restraint, people unaware of their reality may assume they are self-sufficient. However, the verse suggests that a perceptive person can recognize their situation. A believer is encouraged to develop insight and compassion toward fellow believers—to be able to recognize signs of need without requiring the person to ask. True perceptiveness in faith involves reading the expressions and conditions of others and responding before they are forced to beg. Failing to notice such signs reflects a lack of awareness and sensitivity. This verse concludes by assuring that any good given to these individuals is fully known to Allah, and He will certainly reward it. This continues the theme of sincere and thoughtful charity by identifying those most in need—yet most likely to be overlooked.","commentary_fi":"Tämä jae kuvaa erityistä ihmisryhmää, joka ansaitsee erityisesti almua. He ovat ihmisiä, jotka tarvitsevat apua, mutta eivät kykene matkustamaan tai tekemään työtä elantonsa eteen – erityisesti niitä, joiden vaikea tilanne johtuu heidän omistautumisestaan Allahin asiaan tai yhteisön palvelemiseen. Jae korostaa heidän arvokkuuttaan ja itsearvostustaan: he pysyvät hillittyinä eivätkä kerjää. Tämän pidättyväisyyden vuoksi ulkopuoliset saattavat luulla, ettei heillä ole tarvetta. Jae vihjaa kuitenkin, että tarkkanäköinen uskovainen voi havaita heidän todellisen tilanteensa. Uskovaa kehotetaan kehittämään myötätuntoista tarkkanäköisyyttä toisia uskovia kohtaan – kykyä huomata avuntarve ilman että toinen joutuu pyytämään. Aidon uskon herkkyyteen kuuluu, että kykenee lukemaan lähimmäisensä ilmeitä ja olemusta ja tarjoamaan apua ennen kuin toinen joutuu nöyryytetyksi. Jos ei huomaa tällaisia merkkejä, kyseessä on puute havainnointikyvyssä. Tämä jae päättyy vakuutukseen siitä, että kaikki hyvä, mitä tällaisille ihmisille annetaan, on Allahin tiedossa – ja Hän palkitsee siitä varmasti. Tämä jatkaa aiempaa teemaa vilpittömästä ja harkitusta hyväntekeväisyydestä, osoittamalla, ketkä ovat usein eniten avun tarpeessa, mutta jäävät helposti huomaamatta.","arabic":"لِلْفُقَرَاءِ الَّذِينَ أُحْصِرُوا فِي سَبِيلِ اللَّهِ لَا يَسْتَطِيعُونَ ضَرْبًا فِي الْأَرْضِ يَحْسَبُهُمُ الْجَاهِلُ أَغْنِيَاءَ مِنَ التَّعَفُّفِ تَعْرِفُهُمْ بِسِيمَاهُمْ لَا يَسْأَلُونَ النَّاسَ إِلْحَافًا ۗ وَمَا تُنْفِقُوا مِنْ خَيْرٍ فَإِنَّ اللَّهَ بِهِ عَلِيمٌ","commentary":"Tämä jae kuvaa erityistä ihmisryhmää, joka ansaitsee erityisesti almua. He ovat ihmisiä, jotka tarvitsevat apua, mutta eivät kykene matkustamaan tai tekemään työtä elantonsa eteen – erityisesti niitä, joiden vaikea tilanne johtuu heidän omistautumisestaan Allahin asiaan tai yhteisön palvelemiseen. Jae korostaa heidän arvokkuuttaan ja itsearvostustaan: he pysyvät hillittyinä eivätkä kerjää. Tämän pidättyväisyyden vuoksi ulkopuoliset saattavat luulla, ettei heillä ole tarvetta. Jae vihjaa kuitenkin, että tarkkanäköinen uskovainen voi havaita heidän todellisen tilanteensa. Uskovaa kehotetaan kehittämään myötätuntoista tarkkanäköisyyttä toisia uskovia kohtaan – kykyä huomata avuntarve ilman että toinen joutuu pyytämään. Aidon uskon herkkyyteen kuuluu, että kykenee lukemaan lähimmäisensä ilmeitä ja olemusta ja tarjoamaan apua ennen kuin toinen joutuu nöyryytetyksi. Jos ei huomaa tällaisia merkkejä, kyseessä on puute havainnointikyvyssä. Tämä jae päättyy vakuutukseen siitä, että kaikki hyvä, mitä tällaisille ihmisille annetaan, on Allahin tiedossa – ja Hän palkitsee siitä varmasti. Tämä jatkaa aiempaa teemaa vilpittömästä ja harkitusta hyväntekeväisyydestä, osoittamalla, ketkä ovat usein eniten avun tarpeessa, mutta jäävät helposti huomaamatta.","translations":{"opas":"(Uhrilahjat tulevat) köyhien hyväksi, joita osanotto Jumalan (sota)retkeen estää vaeltamasta ympäri maata (liikeasioissa) ja joita tietämättömät pitävät varakkaina, kun he eivät ole vaateliaita. Sinä erotat heidät tuntomerkeistään: eivät he anoessaan ihmisiltä käy tungettelevaisiksi. Mitä hyvää uhraattekin, tietää Jumala sen totisesti.","clear":"˹Hyväntekeväisyys on˺ niille puutteenalaisille, jotka ovat liian uppoutuneita Jumalan asiaan liikkuakseen maassa ˹työn perässä˺. Ne, jotka eivät tunne heidän tilannettaan, luulevat, ettei heillä ole tarvetta ˹hyväntekeväisyyteen˺, koska he eivät kerjää. Te voitte tunnistaa heidät heidän ulkonäöstään. He eivät kerjää ihmisiltä jatkuvasti. Kaiken mitä annatte hyväntekeväisyyteen, Jumala totisesti tietää."}},{"verse":274,"commentary_en":"This verse concludes the section on the ethics and rewards of charity with a powerful summary. It promises a great reward from Allah for those who give charity from their wealth—regardless of whether they do so by day or night, in secret or openly. This inclusiveness emphasizes that all sincere forms of giving are valued. The verse reassures believers that those who give in this manner will have their reward secured with Allah and will face no fear or grief in the Hereafter. It serves as strong encouragement, offering peace and security as the outcome of sincere charitable acts. This ties back to earlier verses that stressed pure intention, wise giving, and trust in Allah’s promise of reward.","commentary_fi":"Tämä jae päättää hyväntekeväisyyden etiikkaa ja palkkiota käsittelevän jakson vaikuttavalla yhteenvedolla. Siinä Allah lupaa suuren palkkion niille, jotka antavat omaisuudestaan hyväntekeväisyyteen – riippumatta siitä, tapahtuu se päivällä tai yöllä, salassa tai julkisesti. Tämä kattavuus korostaa, että kaikki vilpittömät antamisen muodot ovat arvokkaita. Jae antaa uskoville varmuuden siitä, että tällaiset antajat saavat palkkionsa Allahilta eivätkä kohtaa pelkoa tai surua Tuonpuoleisessa. Se toimii vahvana kannustimena, luvaten rauhaa ja turvaa vilpittömän anteliaisuuden seurauksena. Tämä liittyy aiempiin jakeisiin, jotka painottivat puhdasta aikomusta, harkittua antamista ja luottamusta Allahin palkkioon.","arabic":"الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","commentary":"Tämä jae päättää hyväntekeväisyyden etiikkaa ja palkkiota käsittelevän jakson vaikuttavalla yhteenvedolla. Siinä Allah lupaa suuren palkkion niille, jotka antavat omaisuudestaan hyväntekeväisyyteen – riippumatta siitä, tapahtuu se päivällä tai yöllä, salassa tai julkisesti. Tämä kattavuus korostaa, että kaikki vilpittömät antamisen muodot ovat arvokkaita. Jae antaa uskoville varmuuden siitä, että tällaiset antajat saavat palkkionsa Allahilta eivätkä kohtaa pelkoa tai surua Tuonpuoleisessa. Se toimii vahvana kannustimena, luvaten rauhaa ja turvaa vilpittömän anteliaisuuden seurauksena. Tämä liittyy aiempiin jakeisiin, jotka painottivat puhdasta aikomusta, harkittua antamista ja luottamusta Allahin palkkioon.","translations":{"opas":"Ne, jotka uhraavat varojaan sekä päivin että öin, salaisesti ja julkisesti, löytävät palkkansa Herraltaan, ei heitä pelko vaivaa, eikä heidän tarvitse murehtia.","clear":"Ne, jotka käyttävät omaisuuttaan hyväntekeväisyyteen päivin ja öin, salaa ja julkisesti – heidän palkintonsa on heidän Herransa luona, eikä heillä ole pelkoa, eivätkä he murehdi."}},{"verse":275,"commentary_en":"This verse follows a detailed discussion on charity by introducing a stark contrast: the condemnation of usury (riba). While charity is rooted in generosity and selflessness, usury represents exploitation—charging interest on money lent, regardless of the borrower’s hardship. The connection between the two topics is intentional. Charity involves giving without seeking personal gain, whereas usury seeks profit without effort or risk. Morally, they stand at opposite ends: one uplifts the vulnerable, the other burdens them further. The verse uses a striking image to describe those who engage in usury: as if they are driven to madness by Satan’s touch. This vividly illustrates the spiritual and moral corruption caused by usury (riba). Some people attempt to justify usury by saying, “Trade is just like usury,” but the verse makes a clear distinction: Allah has permitted trade and forbidden usury (riba). Trade involves mutual risk and genuine effort, while usury (riba) guarantees profit to the lender regardless of the borrower’s outcome. For those who practiced usury before receiving this guidance, the verse offers a way out: they may retain what they earned previously, and their case rests with Allah. However, those who continue after receiving the warning are promised the Fire. The verse draws a firm moral and legal boundary between ethical commerce and exploitative lending, warning of serious consequences for those who cross it.","commentary_fi":"Tämä jae seuraa yksityiskohtaista keskustelua almujen antamisesta ja tuo esiin jyrkän vastakohdan: rahan koron (riban) tuomitsemisen. Siinä missä almujen antaminen perustuu anteliaisuuteen ja epäitsekkyyteen, korko edustaa hyväksikäyttöä – voiton vaatimista lainatusta rahasta riippumatta velallisen ahdingosta. Yhteys näiden kahden aiheen välillä on tarkoituksellinen. Almujen antaminen tarkoittaa hyvän tekemistä ilman oman edun tavoittelua, kun taas riba tavoittelee voittoa ilman vaivannäköä tai riskiä. Moraalisesti ne ovat ääripäissä: toinen kohottaa heikkoa, toinen painaa häntä entisestään. Jae käyttää voimakasta kuvaa koron harjoittajista: kuin heidät olisi Saatanan kosketus ajanut hulluuteen. Tämä kielikuva korostaa riban aiheuttamaa hengellistä ja moraalista turmeltuneisuutta. Jotkut yrittävät puolustaa ribaa sanomalla: \"Kauppa on kuin korko,\" mutta jae tekee selkeän eron: Allah on sallinut kaupankäynnin ja kieltänyt riban. Kauppa sisältää molemminpuolista riskiä ja todellista työtä, kun taas riba takaa lainaajalle voiton riippumatta siitä, miten velallinen selviää. Niille, jotka harjoittivat ribaa ennen tämän ohjeen saamista, jae tarjoaa tien ulos: he saavat pitää aiemmin ansaitsemansa, ja heidän asiansa jää Allahin päätettäväksi. Mutta ne, jotka jatkavat varoituksen jälkeen, on tuomittu Tuleen. Jae vetää selvän moraalisen ja laillisen rajan oikeudenmukaisen kaupankäynnin ja hyväksikäyttävän lainauksen välille ja varoittaa vakavista seurauksista, jos tämä raja ylitetään.","arabic":"الَّذِينَ يَأْكُلُونَ الرِّبَا لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ الَّذِي يَتَخَبَّطُهُ الشَّيْطَانُ مِنَ الْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ قَالُوا إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَا ۗ وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا ۚ فَمَنْ جَاءَهُ مَوْعِظَةٌ مِنْ رَبِّهِ فَانْتَهَىٰ فَلَهُ مَا سَلَفَ وَأَمْرُهُ إِلَى اللَّهِ ۖ وَمَنْ عَادَ فَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ","commentary":"Tämä jae seuraa yksityiskohtaista keskustelua almujen antamisesta ja tuo esiin jyrkän vastakohdan: rahan koron (riban) tuomitsemisen. Siinä missä almujen antaminen perustuu anteliaisuuteen ja epäitsekkyyteen, korko edustaa hyväksikäyttöä – voiton vaatimista lainatusta rahasta riippumatta velallisen ahdingosta. Yhteys näiden kahden aiheen välillä on tarkoituksellinen. Almujen antaminen tarkoittaa hyvän tekemistä ilman oman edun tavoittelua, kun taas riba tavoittelee voittoa ilman vaivannäköä tai riskiä. Moraalisesti ne ovat ääripäissä: toinen kohottaa heikkoa, toinen painaa häntä entisestään. Jae käyttää voimakasta kuvaa koron harjoittajista: kuin heidät olisi Saatanan kosketus ajanut hulluuteen. Tämä kielikuva korostaa riban aiheuttamaa hengellistä ja moraalista turmeltuneisuutta. Jotkut yrittävät puolustaa ribaa sanomalla: \"Kauppa on kuin korko,\" mutta jae tekee selkeän eron: Allah on sallinut kaupankäynnin ja kieltänyt riban. Kauppa sisältää molemminpuolista riskiä ja todellista työtä, kun taas riba takaa lainaajalle voiton riippumatta siitä, miten velallinen selviää. Niille, jotka harjoittivat ribaa ennen tämän ohjeen saamista, jae tarjoaa tien ulos: he saavat pitää aiemmin ansaitsemansa, ja heidän asiansa jää Allahin päätettäväksi. Mutta ne, jotka jatkavat varoituksen jälkeen, on tuomittu Tuleen. Jae vetää selvän moraalisen ja laillisen rajan oikeudenmukaisen kaupankäynnin ja hyväksikäyttävän lainauksen välille ja varoittaa vakavista seurauksista, jos tämä raja ylitetään.","translations":{"opas":"Mutta ne, jotka ahnehtivat voittoa koronkiskomisesta, kokevat samanlaisen ylösnousemuksen kuin hän, jonka Saatana on villinnyt tartunnallaan. Tämä sentähden, että he sanovat: »Kauppavoittohan on samaa kuin koronkiskominen.» Mutta Jumala on sallinut kaupan ja kieltänyt koronkiskomisen. Sille, joka saa ojennuksen Herraltaan ja luopuu paheesta, suodaan anteeksi se, mikä jo on mennyttä, ja hänen asiansa ovat Jumalan käsissä. Mutta ne, jotka taas entiseen ryhtyvät, ovat Tulen omia, ja he pysyvät siinä iankaikkisesti.","clear":"Ne, jotka nauttivat korkoa, seisovat ˹tuomiopäivänä˺ kuin ne, jotka Saatana on ajanut hulluuteen kosketuksellaan. Tämä johtuu siitä, että he sanovat: \"Kauppa ei ole erilaista kuin korko.\" Mutta Allah on sallinut kaupankäynnin ja kieltänyt koron. Joka pidättyy – saatuaan varoituksen Herraltaan – saa pitää aiemmat voittonsa, ja heidän asiansa jätetään Allahin huostaan. Mitä tulee niihin, jotka jatkavat, he ovat Tulen asukkaat. He tulevat olemaan siellä ikuisesti."}},{"verse":276,"commentary_en":"Continuing the message from the previous verse, which contrasted usury with trade, this verse highlights a deeper moral contrast—between usury and charity, such as zakat and voluntary giving. It states that Allah removes blessing from usury, while He blesses and multiplies the reward of charitable acts. Outwardly, giving in charity seems to reduce one’s wealth. Yet, in reality, it brings unseen benefits—spiritually and even materially—both for the giver and for society. Usury, on the other hand, may appear profitable, but it ultimately undermines well-being and brings no lasting prosperity. The verse concludes by stating that Allah does not love those who are ungrateful and persist in wrongdoing. Usury can be understood as embodying both traits: ingratitude for Allah’s blessings and injustice toward others. Often, only those with surplus wealth—beyond their basic needs—are in a position to lend at interest. According to the Qur'an, such surplus is a gift from Allah. True gratitude for this bounty involves sharing it with others, just as Allah has been generous to us. But when someone uses their surplus to profit from the hardship of others, they show not thankfulness, but greed—and commit moral wrongdoing. In this light, usury is not simply a financial act; it is a spiritual and ethical failure. This verse reinforces the Qur’anic ethical framework, where generosity, fairness, and compassion are favored over exploitation. It reminds us that our financial choices shape not only society but also our relationship with Allah.","commentary_fi":"Jatkaen edellisen jakeen sanomaa, jossa verrattiin korkoa ja kaupankäyntiä, tämä jae nostaa esiin vielä syvemmän moraalisen vastakkainasettelun – koron ja hyväntekeväisyyden, kuten zakatin ja vapaaehtoisen antamisen, välillä. Siinä todetaan, että Allah vie pois siunauksen korosta, kun taas Hän siunaa ja moninkertaistaa palkkion hyväntekeväisistä teoista. Ulkoisesti hyväntekeväisyys voi näyttää vähentävän varallisuutta, mutta todellisuudessa se tuo näkymättömiä hyötyjä – hengellisesti ja jopa aineellisesti – niin antajalle kuin yhteiskunnalle. Korko taas voi näyttää tuottoisalta, mutta lopulta se heikentää hyvinvointia eikä tuo pysyvää vaurautta. Jae päättyy toteamukseen, että Allah ei rakasta niitä, jotka ovat kiittämättömiä ja jatkavat väärintekoa. Korkoa voi pitää molempien ominaisuuksien ilmentymänä: se osoittaa kiittämättömyyttä Allahin siunauksia kohtaan ja epäoikeudenmukaisuutta muita kohtaan. Usein vain ne, joilla on ylijäämää perustarpeidensa yli, voivat lainata rahaa korolla. Koraanin mukaan tällainen ylijäämä on Allahin lahja. Todellinen kiitollisuus tästä lahjasta ilmenee siinä, että sen jakaa muille, kuten Allah on ollut antelias meitä kohtaan. Mutta jos henkilö käyttää tätä ylijäämää hyötyäkseen toisten vaikeuksista, hän ei osoita kiitollisuutta vaan ahneutta – ja toimii moraalisesti väärin. Tässä valossa korko ei ole pelkkä taloudellinen toimi, vaan hengellinen ja eettinen epäonnistuminen. Tämä jae vahvistaa Koraanin eettistä ajattelua, jossa anteliaisuus, oikeudenmukaisuus ja myötätunto asetetaan etusijalle riiston sijaan. Se muistuttaa meitä siitä, että taloudelliset valinnat vaikuttavat paitsi yhteiskuntaan, myös suhteeseemme Allahiin.","arabic":"يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ ۗ وَاللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ","commentary":"Jatkaen edellisen jakeen sanomaa, jossa verrattiin korkoa ja kaupankäyntiä, tämä jae nostaa esiin vielä syvemmän moraalisen vastakkainasettelun – koron ja hyväntekeväisyyden, kuten zakatin ja vapaaehtoisen antamisen, välillä. Siinä todetaan, että Allah vie pois siunauksen korosta, kun taas Hän siunaa ja moninkertaistaa palkkion hyväntekeväisistä teoista. Ulkoisesti hyväntekeväisyys voi näyttää vähentävän varallisuutta, mutta todellisuudessa se tuo näkymättömiä hyötyjä – hengellisesti ja jopa aineellisesti – niin antajalle kuin yhteiskunnalle. Korko taas voi näyttää tuottoisalta, mutta lopulta se heikentää hyvinvointia eikä tuo pysyvää vaurautta. Jae päättyy toteamukseen, että Allah ei rakasta niitä, jotka ovat kiittämättömiä ja jatkavat väärintekoa. Korkoa voi pitää molempien ominaisuuksien ilmentymänä: se osoittaa kiittämättömyyttä Allahin siunauksia kohtaan ja epäoikeudenmukaisuutta muita kohtaan. Usein vain ne, joilla on ylijäämää perustarpeidensa yli, voivat lainata rahaa korolla. Koraanin mukaan tällainen ylijäämä on Allahin lahja. Todellinen kiitollisuus tästä lahjasta ilmenee siinä, että sen jakaa muille, kuten Allah on ollut antelias meitä kohtaan. Mutta jos henkilö käyttää tätä ylijäämää hyötyäkseen toisten vaikeuksista, hän ei osoita kiitollisuutta vaan ahneutta – ja toimii moraalisesti väärin. Tässä valossa korko ei ole pelkkä taloudellinen toimi, vaan hengellinen ja eettinen epäonnistuminen. Tämä jae vahvistaa Koraanin eettistä ajattelua, jossa anteliaisuus, oikeudenmukaisuus ja myötätunto asetetaan etusijalle riiston sijaan. Se muistuttaa meitä siitä, että taloudelliset valinnat vaikuttavat paitsi yhteiskuntaan, myös suhteeseemme Allahiin.","translations":{"opas":"Jumala tekee koronkiskomisen tyhjäksi, mutta almujen hedelmät Hän tekee moninkertaisiksi. Hän ei rakasta jumalatonta eikä rikollista.","clear":"Allah on tehnyt koron hedelmättömäksi ja hyväntekeväisyyden hedelmälliseksi. Eikä Allah pidä kenestäkään kiittämättömästä pahantekijästä."}},{"verse":277,"commentary_en":"Following the strong condemnation of usury and its practitioners in the preceding verses, this verse shifts focus to a contrasting group: those who live according to the core principles of Islam. It describes believers who have faith, perform righteous deeds, establish regular prayer, and give regular charity (zakat). These acts are presented as foundational to the Islamic way of life and stand in clear opposition to a system based on usury and exploitation. The verse promises that such individuals will receive their reward from Allah and that they will have “no fear, nor shall they grieve.” This expression reflects a deep inner peace and sense of security—both in this life and the next—as a direct result of their commitment to faith, worship, and social responsibility. Charity, in particular, fosters a supportive and compassionate society, making exploitative practices like usury unnecessary. The tranquility described here stands in stark contrast to the moral and emotional instability associated with usury. Instead of anxiety and injustice, a life built on submission to Allah’s guidance and mutual care leads to true contentment and lasting peace.","commentary_fi":"Edellisten jakeiden ankaran tuomion jälkeen, joka kohdistui koron ottajiin ja heidän toimintaansa, tämä jae siirtyy kuvaamaan vastakkaista ihmisryhmää: niitä, jotka elävät islamin ydinarvojen mukaisesti. Siinä kuvataan uskovia, jotka eivät ainoastaan usko, vaan myös tekevät hyviä tekoja, pitävät säännöllisesti rukouksensa ja antavat säännöllistä almua (zakat). Nämä teot nähdään islamilaisen elämän peruspilareina, jotka muodostavat selkeän vastakohdan koronkiskontaan perustuvalle järjestelmälle. Jae lupaa tällaisille ihmisille palkkion Allahilta ja vakuuttaa, että he eivät tunne pelkoa eivätkä murehdi. Tämä ilmaus kuvastaa syvää sisäistä rauhaa ja turvallisuutta – sekä tässä elämässä että tuonpuoleisessa – joka syntyy uskollisuudesta, palvonnasta ja vastuullisuudesta muita kohtaan. Erityisesti hyväntekeväisyys luo hoivaavan ja myötätuntoisen yhteiskunnan, jossa korolle ei ole tarvetta. Tässä luvattu tyyneys ja onnellisuus ovat seurausta elämästä, joka perustuu Allahin tahdon noudattamiseen ja keskinäiseen tukemiseen yhteisössä. Se muodostaa jyrkän vastakohdan sille epävarmuudelle ja levottomuudelle, jota aiemmin kuvattu koronkiskonta aiheuttaa.","arabic":"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","commentary":"Edellisten jakeiden ankaran tuomion jälkeen, joka kohdistui koron ottajiin ja heidän toimintaansa, tämä jae siirtyy kuvaamaan vastakkaista ihmisryhmää: niitä, jotka elävät islamin ydinarvojen mukaisesti. Siinä kuvataan uskovia, jotka eivät ainoastaan usko, vaan myös tekevät hyviä tekoja, pitävät säännöllisesti rukouksensa ja antavat säännöllistä almua (zakat). Nämä teot nähdään islamilaisen elämän peruspilareina, jotka muodostavat selkeän vastakohdan koronkiskontaan perustuvalle järjestelmälle. Jae lupaa tällaisille ihmisille palkkion Allahilta ja vakuuttaa, että he eivät tunne pelkoa eivätkä murehdi. Tämä ilmaus kuvastaa syvää sisäistä rauhaa ja turvallisuutta – sekä tässä elämässä että tuonpuoleisessa – joka syntyy uskollisuudesta, palvonnasta ja vastuullisuudesta muita kohtaan. Erityisesti hyväntekeväisyys luo hoivaavan ja myötätuntoisen yhteiskunnan, jossa korolle ei ole tarvetta. Tässä luvattu tyyneys ja onnellisuus ovat seurausta elämästä, joka perustuu Allahin tahdon noudattamiseen ja keskinäiseen tukemiseen yhteisössä. Se muodostaa jyrkän vastakohdan sille epävarmuudelle ja levottomuudelle, jota aiemmin kuvattu koronkiskonta aiheuttaa.","translations":{"opas":"Katso, ne jotka uskovat ja tekevät hyviä töitä, viettävät rukouselämää ja suorittavat köyhille osuutensa, löytävät totisesti palkkansa Herraltaan; ei mikään pelko vaivaa heitä, eikä heidän tarvitse murehtia.","clear":"Totisesti, ne, jotka uskovat, tekevät hyvää, suorittavat rukouksen ja maksavat almuveroa, saavat palkkionsa Herraltaan, eikä heidän tarvitse pelätä, eivätkä he murhehtia."}},{"verse":278,"commentary_en":"This verse speaks directly to the believers and reinforces the prohibition of usury. It stresses the importance of fearing Allah and being mindful of Him as the guiding motivation for action. The verse then issues a clear and firm command to abandon usury. The phrase “if you are indeed believers” serves as a test of true faith, indicating that giving up usury is a fundamental requirement. This command marked a pivotal moment for the early Muslim community, calling for an immediate shift to a system free from usury. It demonstrates that Islamic faith is meant to guide all aspects of life, including economic transactions.","commentary_fi":"Tämä jae puhuttelee suoraan uskovia ja vahvistaa kiellon, joka koskee korkoa. Se painottaa Allahin pelon ja tietoisuuden merkitystä toiminnan ohjaavana voimana. Jae antaa sitten selkeän ja lujan käskyn: luopukaa korosta. Ilmaus “jos olette todella uskovia” toimii uskon mittarina ja osoittaa, että koron hylkääminen on olennainen osa todellista uskoa. Tämä käsky merkitsi käännekohtaa varhaiselle muslimiyhteisölle, vaatiessaan välitöntä siirtymistä korkovapaaseen järjestelmään. Se osoittaa, että islamilainen usko ohjaa kaikkia elämänalueita, myös taloudellisia suhteita.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَذَرُوا مَا بَقِيَ مِنَ الرِّبَا إِنْ كُنْتُمْ مُؤْمِنِينَ","commentary":"Tämä jae puhuttelee suoraan uskovia ja vahvistaa kiellon, joka koskee korkoa. Se painottaa Allahin pelon ja tietoisuuden merkitystä toiminnan ohjaavana voimana. Jae antaa sitten selkeän ja lujan käskyn: luopukaa korosta. Ilmaus “jos olette todella uskovia” toimii uskon mittarina ja osoittaa, että koron hylkääminen on olennainen osa todellista uskoa. Tämä käsky merkitsi käännekohtaa varhaiselle muslimiyhteisölle, vaatiessaan välitöntä siirtymistä korkovapaaseen järjestelmään. Se osoittaa, että islamilainen usko ohjaa kaikkia elämänalueita, myös taloudellisia suhteita.","translations":{"opas":"Te uskovaiset, pelätkää Jumalaa ja antakaa anteeksi vielä perimätön osa koroista velallisillenne, jos olette oikeita uskovaisia.","clear":"Oi uskovat! Pelätkää Allahia ja luopukaa maksamattomasta korosta, jos olette ˹todellisia˺ uskovia."}},{"verse":279,"commentary_en":"This verse follows the command to abandon usury and outlines the severe consequence of failing to comply. It delivers a powerful warning: those who persist in demanding usurious gains are, in effect, declaring war against Allah and His Messenger. This stark language underscores the seriousness of continuing in a practice that has been clearly forbidden. Yet, the verse immediately offers a path of mercy. If one repents and ceases dealing in usury, they are permitted to recover only their original capital—no more, no less. The guiding principle is stated clearly: “Deal not unjustly, and you shall not be dealt with unjustly.” This ensures fairness for both parties—the lender does not suffer a loss, and the borrower is not burdened by unjust increase. The aim is to promote a just and ethical financial system, rooted in Allah’s guidance, where exploitation is removed and fairness upheld. In contrast, a society built on usury suffers deep moral, emotional, and economic harm—leading to conflict, inequality, and instability.","commentary_fi":"Tämä jae seuraa käskyä luopua korosta ja kuvaa vakavan seurauksen, mikäli tätä käskyä ei noudateta. Se esittää voimakkaan varoituksen: ne, jotka edelleen vaativat korkotuottoja, julistavat käytännössä sodan Allahia ja Hänen lähettilästään vastaan. Tämä ankara ilmaus korostaa, kuinka vakava asia on jatkaa toimintaa, joka on selvästi kielletty. Samalla jae tarjoaa välittömän armollisen vaihtoehdon. Jos ihminen katuu ja luopuu korosta, hänelle sallitaan pääoman palauttaminen – ei enempää eikä vähempää. Periaate ilmaistaan selvästi: \"Älkää tehkö vääryyttä, niin teillekään ei tehdä vääryyttä.\" Tämä takaa oikeudenmukaisuuden molemmille osapuolille: lainanantaja ei kärsi tappiota, eikä lainanottajaa rasiteta epäoikeudenmukaisella lisämaksulla. Tavoitteena on rakentaa oikeudenmukainen ja eettinen talousjärjestelmä, joka perustuu Allahin ohjaukseen – järjestelmä, jossa hyväksikäyttö poistetaan ja reiluus säilyy. Sen sijaan yhteiskunta, joka rakentuu koron varaan, kärsii syvistä moraalisista, tunne-elämän ja talouden ongelmista, jotka johtavat ristiriitoihin, eriarvoisuuteen ja epävakauteen.","arabic":"فَإِنْ لَمْ تَفْعَلُوا فَأْذَنُوا بِحَرْبٍ مِنَ اللَّهِ وَرَسُولِهِ ۖ وَإِنْ تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَالِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ","commentary":"Tämä jae seuraa käskyä luopua korosta ja kuvaa vakavan seurauksen, mikäli tätä käskyä ei noudateta. Se esittää voimakkaan varoituksen: ne, jotka edelleen vaativat korkotuottoja, julistavat käytännössä sodan Allahia ja Hänen lähettilästään vastaan. Tämä ankara ilmaus korostaa, kuinka vakava asia on jatkaa toimintaa, joka on selvästi kielletty. Samalla jae tarjoaa välittömän armollisen vaihtoehdon. Jos ihminen katuu ja luopuu korosta, hänelle sallitaan pääoman palauttaminen – ei enempää eikä vähempää. Periaate ilmaistaan selvästi: \"Älkää tehkö vääryyttä, niin teillekään ei tehdä vääryyttä.\" Tämä takaa oikeudenmukaisuuden molemmille osapuolille: lainanantaja ei kärsi tappiota, eikä lainanottajaa rasiteta epäoikeudenmukaisella lisämaksulla. Tavoitteena on rakentaa oikeudenmukainen ja eettinen talousjärjestelmä, joka perustuu Allahin ohjaukseen – järjestelmä, jossa hyväksikäyttö poistetaan ja reiluus säilyy. Sen sijaan yhteiskunta, joka rakentuu koron varaan, kärsii syvistä moraalisista, tunne-elämän ja talouden ongelmista, jotka johtavat ristiriitoihin, eriarvoisuuteen ja epävakauteen.","translations":{"opas":"Jollette niin tee, niin tietäkää Jumalan ja Hänen lähettiläänsä olevan sodassa teitä vastaan. Mutta jos teette parannuksen, saatte pitää pääoman. Älkää tehkö vääryyttä, niin ei sitä teillekään tehdä.","clear":"Jos ette tee niin, varokaa sotaa Allahin ja Hänen Lähettiläänsä kanssa! Mutta jos te teette parannuksen, saatte pitää pääomanne – aiheuttamatta tai kärsimättä vahinkoa."}},{"verse":280,"commentary_en":"Following the strong directives against usury and the reminder that only the principal may be claimed, this verse addresses situations where a debtor is genuinely unable to repay a loan due to financial hardship. It offers a merciful guideline, instructing creditors to grant the debtor more time until their situation improves and repayment becomes easier. Beyond simply granting a delay, the verse encourages an even better course of action: forgiving the debt altogether as an act of charity. It states that this is \"best for you if you only knew,\" suggesting hidden benefits and rewards for the creditor—perhaps both in this life and certainly in the hereafter. This approach fosters an atmosphere of tolerance and compassion, standing in stark contrast to the harshness of usury. It reinforces the Islamic principle of mutual support and highlights the community’s duty to assist those in genuine difficulty, discouraging any form of harassment or pressure against an insolvent debtor.","commentary_fi":"Koron kieltämisen voimakkaiden käskyjen ja muistutuksen jälkeen, että lainan pääoma on ainoa vaadittava summa, tämä jae käsittelee tilannetta, jossa velallinen on aidosti kykenemätön maksamaan lainaa taloudellisten vaikeuksien vuoksi. Se tarjoaa armollisen ohjeen, kehottaen velkojaa antamaan velalliselle lisäaikaa, kunnes hänen olosuhteensa paranevat ja takaisinmaksu helpottuu. Pelkän lykkäyksen lisäksi jae kannustaa vielä parempaan tekoon: velan anteeksiantoon hyväntekeväisyytenä. Jae toteaa, että tämä on \"parasta teille, jos vain tietäisitte,\" viitaten siihen, että velkoja saa piileviä etuja ja palkintoja – ehkä tässä elämässä, mutta varmasti tuonpuoleisessa. Tämä ajattelutapa luo suvaitsevaisuuden ja myötätunnon ilmapiirin, joka on jyrkässä vastakohdassa koron ankaruuteen. Se vahvistaa islamilaisen keskinäisen tuen periaatetta ja korostaa yhteisön velvollisuutta auttaa niitä, jotka ovat todellisessa ahdingossa, ja vastustaa minkäänlaista häirintää tai painostusta velkojaa kohtaan.","arabic":"وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ ۚ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ ۖ إِنْ كُنْتُمْ تَعْلَمُونَ","commentary":"Koron kieltämisen voimakkaiden käskyjen ja muistutuksen jälkeen, että lainan pääoma on ainoa vaadittava summa, tämä jae käsittelee tilannetta, jossa velallinen on aidosti kykenemätön maksamaan lainaa taloudellisten vaikeuksien vuoksi. Se tarjoaa armollisen ohjeen, kehottaen velkojaa antamaan velalliselle lisäaikaa, kunnes hänen olosuhteensa paranevat ja takaisinmaksu helpottuu. Pelkän lykkäyksen lisäksi jae kannustaa vielä parempaan tekoon: velan anteeksiantoon hyväntekeväisyytenä. Jae toteaa, että tämä on \"parasta teille, jos vain tietäisitte,\" viitaten siihen, että velkoja saa piileviä etuja ja palkintoja – ehkä tässä elämässä, mutta varmasti tuonpuoleisessa. Tämä ajattelutapa luo suvaitsevaisuuden ja myötätunnon ilmapiirin, joka on jyrkässä vastakohdassa koron ankaruuteen. Se vahvistaa islamilaisen keskinäisen tuen periaatetta ja korostaa yhteisön velvollisuutta auttaa niitä, jotka ovat todellisessa ahdingossa, ja vastustaa minkäänlaista häirintää tai painostusta velkojaa kohtaan.","translations":{"opas":"Jos joku (velallinen) on ahdingossa, saakoon lykkäystä, kunnes hänen tilansa paranee, mutta parempi teille olisi antaa velka anteeksi; jospa vain sen tajuaisitte.","clear":"Jos jonkun on vaikea maksaa velkaa takaisin, lykätkää sitä helpompaan ajankohtaan. Ja jos luovutte siitä hyväntekeväisyytenä, se on teille parempi, jos vain tietäisitte."}},{"verse":281,"commentary_en":"This verse serves as a powerful concluding reminder, shifting focus from worldly transactions and their consequences to the ultimate accountability in the hereafter. It urges everyone to \"fear the Day when ye shall be brought back to Allah.\" This refers to the Day of Judgment, when all individuals will stand before Allah to be judged for their actions in this life. The verse emphasizes a fundamental principle of that Day: \"every soul shall be paid what it earned,\" meaning each person will receive the full consequence of their deeds, whether good or bad. Crucially, it adds, \"and none shall be dealt with unjustly.\" This assurance highlights Allah's perfect justice, where no one will be wronged by receiving less reward than they deserve or more punishment than they earned. The reminder about the fearful Day of Judgment can serve as a strong motivation, particularly in the context of financial dealings discussed previously, encouraging people to act justly and charitably, knowing they will be held accountable for their choices regarding wealth and their treatment of others. It underscores that living according to Allah's guidance, is ultimately for one's own benefit on the Day of Reckoning.","commentary_fi":"Tämä jae toimii voimakkaana päätösmuistutuksena, siirtäen huomion pois tämän maailman kaupankäynnistä ja niiden seurauksista kohti lopullista vastuullisuutta tuonpuoleisessa. Se kehottaa kaikkia ”pelkäämään päivää, jolloin teidät palautetaan Allahin luo.” Tämä viittaa Tuomiopäivään, jolloin jokainen seisoo Allahin edessä saadakseen tuomion teoistaan tässä elämässä. Jae korostaa perustavaa periaatetta tuona päivänä: ”jokainen sielu saa sen, mitä se on ansainnut,” eli jokainen saa täydellisen seurauksen teoistaan, olipa ne hyviä tai pahoja. Tärkeänä lisänä todetaan: ”eikä ketään kohdella vääryydellä.” Tämä vakuutus korostaa Allahin täydellistä oikeudenmukaisuutta, jossa kukaan ei joudu kärsimään liian vähästä palkkiosta tai liiallisesta rangaistuksesta. Muistutus pelottavasta Tuomiopäivästä voi toimia vahvana kannustimena, erityisesti aiemmin käsiteltyjen taloudellisten asioiden yhteydessä, rohkaisten ihmisiä toimimaan oikeudenmukaisesti ja hyväntekeväisesti, tietäen että heidät pidetään vastuullisina varallisuuttaan ja toisten kohteluaan koskevista valinnoistaan. Se korostaa, että elämällä Allahin ohjeiden mukaan, on lopulta oma etu Tuomiopäivänä.","arabic":"وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ۖ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ","commentary":"Tämä jae toimii voimakkaana päätösmuistutuksena, siirtäen huomion pois tämän maailman kaupankäynnistä ja niiden seurauksista kohti lopullista vastuullisuutta tuonpuoleisessa. Se kehottaa kaikkia ”pelkäämään päivää, jolloin teidät palautetaan Allahin luo.” Tämä viittaa Tuomiopäivään, jolloin jokainen seisoo Allahin edessä saadakseen tuomion teoistaan tässä elämässä. Jae korostaa perustavaa periaatetta tuona päivänä: ”jokainen sielu saa sen, mitä se on ansainnut,” eli jokainen saa täydellisen seurauksen teoistaan, olipa ne hyviä tai pahoja. Tärkeänä lisänä todetaan: ”eikä ketään kohdella vääryydellä.” Tämä vakuutus korostaa Allahin täydellistä oikeudenmukaisuutta, jossa kukaan ei joudu kärsimään liian vähästä palkkiosta tai liiallisesta rangaistuksesta. Muistutus pelottavasta Tuomiopäivästä voi toimia vahvana kannustimena, erityisesti aiemmin käsiteltyjen taloudellisten asioiden yhteydessä, rohkaisten ihmisiä toimimaan oikeudenmukaisesti ja hyväntekeväisesti, tietäen että heidät pidetään vastuullisina varallisuuttaan ja toisten kohteluaan koskevista valinnoistaan. Se korostaa, että elämällä Allahin ohjeiden mukaan, on lopulta oma etu Tuomiopäivänä.","translations":{"opas":"Ja varokaa sitä päivää, jolloin teidän on palattava Jumalan luo. Silloin on jokainen sielu saapa täyden mitan mukaan, mitä on ansainnut, eikä ketään väärin tuomita.","clear":"Muistakaa päivää, jolloin teidät ˹kaikki˺ palautetaan Allahin luo, jolloin jokaiselle sielulle maksetaan täysi maksu siitä, mitä se on tehnyt, eikä kenellekään tehdä vääryyttä."}},{"verse":282,"commentary_en":"This verse provides comprehensive guidance for transactions involving future obligations, such as contracting a debt for a specified term. It establishes the principle that such agreements should be put in writing, with a clear timeline for fulfillment. The verse instructs that an impartial scribe should write down the agreement accurately. It emphasizes that anyone with the ability to write—a skill granted by Allah—should not refuse to act as a scribe when asked: “Let no scribe refuse to write as Allah has taught him.” This reflects the context in which the verse was revealed, a time when literacy was rare and skilled scribes were in high demand. The person who owes the debt should dictate the terms, and they are reminded to be mindful of Allah and not to conceal or reduce any part of the obligation. The debtor should dictate the wording of the contract, since it will serve as evidence against them: “And let the one who has the obligation dictate.” This ensures fairness, as the debtor is usually the weaker party. If the creditor dictated, they might attempt to set an unfairly early repayment date, and the debtor—out of hesitation or vulnerability—might not object.\nIf the debtor is unable to dictate due to incapacity or weakness, a guardian or representative should do so fairly. The verse also mandates securing witnesses. The standard is two men; if two men are not available, then one man and two women who are trustworthy may serve. The reasoning is that if one woman forgets, the other can remind her, thus preserving the accuracy of the testimony in legal matters. Witnesses are reminded not to refuse when called, as their testimony helps uphold justice and protect rights. The verse also advises not to consider any debt too small to be documented. Writing it down is fairest in the sight of Allah and helps prevent disputes and misunderstandings. For on-the-spot transactions—where goods and payment are exchanged immediately—documentation is not required, though witnesses are still encouraged. The purpose is to stress the value of recording even routine sales, as is common today through invoices. However, this is not obligatory. Similarly, it is not objectionable if neighbors or shopkeepers do not record every frequent transaction between them. The verse concludes by protecting the roles of scribes and witnesses, warning that they must not be harmed for fulfilling their duties. Doing so is considered a sinful act of disobedience to Allah. The verse ends with the reminder: “And be mindful of Allah, and Allah teaches you.” i.e. to remain conscious of Allah, who has full knowledge of all our actions.","commentary_fi":"Tämä jae antaa kattavat ohjeet tulevaisuutta koskeviin velvoitteisiin liittyviin liiketoimiin, kuten velkasopimuksiin määräajaksi. Siinä vahvistetaan periaate, että tällaiset sopimukset tulisi kirjata ylös, ja niille on asetettava selkeä määräaika. Jae ohjeistaa, että puolueettoman kirjurin tulisi kirjoittaa sopimus tarkasti. Korostetaan, että jokaisen, jolla on kirjoitustaito—taito, jonka Allah on antanut—ei tule kieltäytyä toimimasta kirjurina pyydettäessä: ”Älköön yksikään kirjuri kieltäytykö kirjoittamasta, kuten Allah on häntä opettanut.” Tämä heijastaa ajan kontekstia, jolloin lukutaito oli harvinaista ja kirjoitustaitoisia henkilöitä tarvittiin kipeästi. Velallinen, eli velkaa ottava henkilö, tulee sanella sopimuksen ehdot ja häntä muistutetaan olemaan tietoinen Allahista eikä salaamaan tai vähentämään mitään velasta. Velallinen sanelkoon asiakirjan sisällön, koska se toimii todistusaineistona häntä itseään vastaan: ”ja sanelkoon se, jolla on velvollisuus.” Tämä varmistaa oikeudenmukaisuuden, koska velallinen on yleensä heikompi osapuoli. Jos velkoja sanelee ehdot, hän saattaa pyrkiä määräämään kohtuuttoman aikaisen maksupäivän, eikä velallinen uskalla välttämättä sanoa vastaan. Jos velallinen ei kykene sanelemaan heikkouden tai kykenemättömyyden vuoksi, hänen huoltajansa tai edustajansa tulee sanella ehdot oikeudenmukaisesti. Jae vaatii myös todistajien hankkimista. Normina on kaksi miestä. Jos kahta miestä ei ole saatavilla, yksi mies ja kaksi luotettavaa naista riittää. Syyksi mainitaan se, että jos toinen naisista unohtaa jotain, toinen voi muistuttaa häntä—näin varmistetaan todistuksen tarkkuus oikeudellisessa asiassa. Todistajia muistutetaan, ettei heidän tule kieltäytyä, kun heitä pyydetään todistajiksi, sillä se on osa oikeuden ylläpitämistä ja oikeuksien suojelemista. Jae neuvoo olemaan pitämättä mitään velkaa liian pienenä kirjattavaksi. Sen kirjaaminen on Allahin silmissä oikeudenmukaisinta ja auttaa estämään riitoja ja väärinkäsityksiä. Välittömissä kaupoissa, joissa tavara ja maksu vaihtavat omistajaa heti, asiakirjaa ei vaadita, mutta todistajia suositellaan edelleen. Tavoitteena on korostaa kirjaamisen arvoa, jopa arkisten kauppojen osalta, kuten nykyään on tapana laskuilla. Tätä ei kuitenkaan ole tehty pakolliseksi. Samoin ei ole moitittavaa, jos naapureiden tai kauppiaiden välisiä toistuvia pieniä liiketoimia ei kirjata. Jae päättyy suojellen kirjurien ja todistajien roolia, varoittaen, ettei heitä saa vahingoittaa heidän tehtäviensä täyttämisestä. Tällainen teko katsotaan synniksi ja tottelemattomuudeksi Allahia kohtaan. Jae päättyy muistutukseen: \"Ja pelätkää Allahia; Allah opettaa teitä.\" Toisin sanoen: olkaa tietoisia Allahista, joka tietää täydellisesti kaikki tekomme.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَىٰ أَجَلٍ مُسَمًّى فَاكْتُبُوهُ ۚ وَلْيَكْتُبْ بَيْنَكُمْ كَاتِبٌ بِالْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَنْ يَكْتُبَ كَمَا عَلَّمَهُ اللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ الَّذِي عَلَيْهِ الْحَقُّ وَلْيَتَّقِ اللَّهَ رَبَّهُ وَلَا يَبْخَسْ مِنْهُ شَيْئًا ۚ فَإِنْ كَانَ الَّذِي عَلَيْهِ الْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَنْ يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُ بِالْعَدْلِ ۚ وَاسْتَشْهِدُوا شَهِيدَيْنِ مِنْ رِجَالِكُمْ ۖ فَإِنْ لَمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌ وَامْرَأَتَانِ مِمَّنْ تَرْضَوْنَ مِنَ الشُّهَدَاءِ أَنْ تَضِلَّ إِحْدَاهُمَا فَتُذَكِّرَ إِحْدَاهُمَا الْأُخْرَىٰ ۚ وَلَا يَأْبَ الشُّهَدَاءُ إِذَا مَا دُعُوا ۚ وَلَا تَسْأَمُوا أَنْ تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰ أَجَلِهِ ۚ ذَٰلِكُمْ أَقْسَطُ عِنْدَ اللَّهِ وَأَقْوَمُ لِلشَّهَادَةِ وَأَدْنَىٰ أَلَّا تَرْتَابُوا ۖ إِلَّا أَنْ تَكُونَ تِجَارَةً حَاضِرَةً تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوا إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَارَّ كَاتِبٌ وَلَا شَهِيدٌ ۚ وَإِنْ تَفْعَلُوا فَإِنَّهُ فُسُوقٌ بِكُمْ ۗ وَاتَّقُوا اللَّهَ ۖ وَيُعَلِّمُكُمُ اللَّهُ ۗ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ","commentary":"Tämä jae antaa kattavat ohjeet tulevaisuutta koskeviin velvoitteisiin liittyviin liiketoimiin, kuten velkasopimuksiin määräajaksi. Siinä vahvistetaan periaate, että tällaiset sopimukset tulisi kirjata ylös, ja niille on asetettava selkeä määräaika. Jae ohjeistaa, että puolueettoman kirjurin tulisi kirjoittaa sopimus tarkasti. Korostetaan, että jokaisen, jolla on kirjoitustaito—taito, jonka Allah on antanut—ei tule kieltäytyä toimimasta kirjurina pyydettäessä: ”Älköön yksikään kirjuri kieltäytykö kirjoittamasta, kuten Allah on häntä opettanut.” Tämä heijastaa ajan kontekstia, jolloin lukutaito oli harvinaista ja kirjoitustaitoisia henkilöitä tarvittiin kipeästi. Velallinen, eli velkaa ottava henkilö, tulee sanella sopimuksen ehdot ja häntä muistutetaan olemaan tietoinen Allahista eikä salaamaan tai vähentämään mitään velasta. Velallinen sanelkoon asiakirjan sisällön, koska se toimii todistusaineistona häntä itseään vastaan: ”ja sanelkoon se, jolla on velvollisuus.” Tämä varmistaa oikeudenmukaisuuden, koska velallinen on yleensä heikompi osapuoli. Jos velkoja sanelee ehdot, hän saattaa pyrkiä määräämään kohtuuttoman aikaisen maksupäivän, eikä velallinen uskalla välttämättä sanoa vastaan. Jos velallinen ei kykene sanelemaan heikkouden tai kykenemättömyyden vuoksi, hänen huoltajansa tai edustajansa tulee sanella ehdot oikeudenmukaisesti. Jae vaatii myös todistajien hankkimista. Normina on kaksi miestä. Jos kahta miestä ei ole saatavilla, yksi mies ja kaksi luotettavaa naista riittää. Syyksi mainitaan se, että jos toinen naisista unohtaa jotain, toinen voi muistuttaa häntä—näin varmistetaan todistuksen tarkkuus oikeudellisessa asiassa. Todistajia muistutetaan, ettei heidän tule kieltäytyä, kun heitä pyydetään todistajiksi, sillä se on osa oikeuden ylläpitämistä ja oikeuksien suojelemista. Jae neuvoo olemaan pitämättä mitään velkaa liian pienenä kirjattavaksi. Sen kirjaaminen on Allahin silmissä oikeudenmukaisinta ja auttaa estämään riitoja ja väärinkäsityksiä. Välittömissä kaupoissa, joissa tavara ja maksu vaihtavat omistajaa heti, asiakirjaa ei vaadita, mutta todistajia suositellaan edelleen. Tavoitteena on korostaa kirjaamisen arvoa, jopa arkisten kauppojen osalta, kuten nykyään on tapana laskuilla. Tätä ei kuitenkaan ole tehty pakolliseksi. Samoin ei ole moitittavaa, jos naapureiden tai kauppiaiden välisiä toistuvia pieniä liiketoimia ei kirjata. Jae päättyy suojellen kirjurien ja todistajien roolia, varoittaen, ettei heitä saa vahingoittaa heidän tehtäviensä täyttämisestä. Tällainen teko katsotaan synniksi ja tottelemattomuudeksi Allahia kohtaan. Jae päättyy muistutukseen: \"Ja pelätkää Allahia; Allah opettaa teitä.\" Toisin sanoen: olkaa tietoisia Allahista, joka tietää täydellisesti kaikki tekomme.","translations":{"opas":"Te uskovaiset, kun teette maksusitoumuksen määrätyksiajaksi, niin tehkää se kirjallisesti. Kirjuri merkitköön puolueettomasti muistiin keskinäisen sopimuksenne, älköönkä kukaan kirjuri kieltäytykö kirjoittamasta sen mukaan, kuin Jumala on opettanut häntä. Siten siis on hänen kirjoitettava, ja se, joka velaksi ottaa, sanelkoon Herraansa Jumalaa peläten, älköönkä vähintäkään pois jättäkö. Jos kuitenkin velantekijä on älyltään tai vastuultaan vajavainen tai ei itse kykene sanelemaan, silloin hänen etujensa puoltaja sanelkoon sen oikeudenmukaisesti. Kutsukaa tähän tilaisuuteen kaksi mieleistänne miestä todistajiksi. Jollei satu olemaan kahta miestä, todistakoon mies ja kaksi naista niiden joukosta, jotka hyväksytte todistajiksi, jotta jos yhden muisti pettäisi, toinen kuitenkin muistaisi oikein. Ja kun heidät todistajiksi kutsutaan, älkööt he kieltäytykö. Älkää jättäkö kirjoittamatta velkasopimusta, olkoon se pieni tai suuri, ja merkitkää sen eräytymisaika. Tämä on oikeudenmukaisinta Jumalan edessä, varmimmin todistettavissa ja paras tapa välttää keskinäisiä epäluuloja, paitsi milloin kyseessä on liikeasia, jossa tavara siirtyy kädestä käteen. Tällöin ei lueta teille syyksi, jos jätätte kirjoittamatta sen muistiin. Todistajia hankkikaa kuitenkin myydessänne toinen toisellenne, eikä hankaluutta saa tuottaa kirjurille enempää kuin todistajillekaan. Jos teette jotain sellaista, on se totisesti jumalatonta teidän puoleltanne. Pelätkää Jumalaa! Jumala opettaa teitä ja Jumala tietää kaikki.","clear":"Oi uskovaiset! Kun te solmitte lainasopimuksen määräajaksi, kirjatkaa se. Kirjurin tulee pitää oikeutta osapuolten välillä. Kirjuri ei saa kieltäytyä kirjoittamasta, kuten Allah on heille opettanut kirjoittamaan. He kirjoittavat, mitä velallinen sanelee, pitäen Allahin mielessä ja oikaisematta velkaa. Jos velallinen on epäpätevä, heikko tai kykenemätön sanelemaan, antakoon heidän huoltajansa sanella heidän puolestaan oikeudenmukaisesti. Ottakaa kaksi miestä keskuudestanne todistajiksi. Jos kahta miestä ei löydy, silloin todistakoon yksi mies ja kaksi valitsemaanne naista – jotta toinen naisista voi muistuttaa toista, jos tämä unohtaa. Todistajat eivät saa kieltäytyä, kun heidät kutsutaan. Älkää vastustako sopimusten kirjoittamista määräajaksi – olipa summa pieni tai suuri. Tämä on oikeudenmukaisempaa teille Allahin silmissä ja sopivampaa todisteiden vahvistamiseksi ja epäilysten poistamiseksi. Jos kuitenkin teette välittömän kaupan keskenänne, silloin teidän ei tarvitse kirjata sitä, mutta kutsukaa todistajia, kun sopimus on tehty. Älköön kirjurille tai todistajille aiheutuko haittaa. Jos teette niin, olette ylittäneet vakavasti rajojanne. Olkaa tietoisia Allahista, sillä Allah on se, joka opettaa teitä. Ja Allahilla on täydellinen tieto kaikista asioista."}},{"verse":283,"commentary_en":"Building upon the detailed instructions in the previous verse—which addressed transactions during periods of settlement—this verse offers guidance for situations that arise while traveling, when a scribe may not be available. In such cases, it permits the use of a pledge (security) delivered by hand as a practical alternative to a written agreement. The verse then discusses cases of mutual trust: if one party trusts the other, the one who is trusted must honor that trust and fulfill it faithfully. Both the person holding the pledge and the borrower are regarded as trustees in their respective roles, and they are urged to act honestly and remain mindful of Allah, their Lord. It continues by emphasizing the seriousness of concealing testimony, warning that this act stains the heart with sin. The verse ends with a clear reminder: Allah has full knowledge of all actions. Nothing is hidden from Him, and all will be accounted for—reinforcing the theme of responsibility before Allah.","commentary_fi":"Perustuen edellisen jakeen yksityiskohtaisiin ohjeisiin—joka käsitteli liiketoimia vakinaisessa oleskelussa—tämä jae antaa ohjeita tilanteisiin, jotka syntyvät matkalla, kun kirjuri ei ole saatavilla. Tällöin sallitaan pantin antaminen käteen käytännöllisenä vaihtoehtona kirjalliselle sopimukselle. Jae jatkaa käsittelemällä luottamukseen perustuvia tilanteita: jos toinen osapuoli luottaa toiseen, sen, johon luotetaan, tulee täyttää luottamus uskollisesti. Sekä pantin haltijaa että lainanottajaa pidetään luottamustehtävässä, ja heitä kehotetaan toimimaan rehellisesti ja pysymään tietoisina Allahista, Herrastaan. Se korostaa myös todistuksen salaamisen vakavuutta, varoittaen, että tämä teko tahratuttaa sydämen synnillä. Jae päättyy selkeään muistutukseen: Allah tietää kaiken, mitä tehdään. Mikään ei ole Häneltä kätketty, ja kaikesta joudutaan vastuuseen—korostaen vastuullisuuden teemaa Allahin edessä.","arabic":"وَإِنْ كُنْتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ","commentary":"Perustuen edellisen jakeen yksityiskohtaisiin ohjeisiin—joka käsitteli liiketoimia vakinaisessa oleskelussa—tämä jae antaa ohjeita tilanteisiin, jotka syntyvät matkalla, kun kirjuri ei ole saatavilla. Tällöin sallitaan pantin antaminen käteen käytännöllisenä vaihtoehtona kirjalliselle sopimukselle. Jae jatkaa käsittelemällä luottamukseen perustuvia tilanteita: jos toinen osapuoli luottaa toiseen, sen, johon luotetaan, tulee täyttää luottamus uskollisesti. Sekä pantin haltijaa että lainanottajaa pidetään luottamustehtävässä, ja heitä kehotetaan toimimaan rehellisesti ja pysymään tietoisina Allahista, Herrastaan. Se korostaa myös todistuksen salaamisen vakavuutta, varoittaen, että tämä teko tahratuttaa sydämen synnillä. Jae päättyy selkeään muistutukseen: Allah tietää kaiken, mitä tehdään. Mikään ei ole Häneltä kätketty, ja kaikesta joudutaan vastuuseen—korostaen vastuullisuuden teemaa Allahin edessä.","translations":{"opas":"Mutta jos olette matkoilla ettekä voi löytää kirjuria, voitte vastaanottaa pantteja. Ja jos toinen teistä uskoo toiselle jotakin, silloin myös se, jolle on uskottu, täyttäköön sen, johon on sitoutunut, ja pelätköön hän Jumalaa, Herraansa. Älkää salatko todistusta! Jos joku salaa sen, on hänen sydämensä totisesti turmeltunut. Jumala tietää mitä te teette.","clear":"Jos olette matkalla ettekä löydä kirjuria, voidaan ottaa vakuus. Jos luotatte toisiinne, niin ˹vakuutta ei tarvita, mutta˺ velallisen tulee kunnioittaa tätä luottamusta ˹maksamalla velka takaisin˺—ja pelätkööt he Jumalaa, heidän Herraansa. Älkääkä salatko todistusta, sillä kuka sen salaakin, hänen sydämensä ovat totisesti syntiset. Ja Jumala ˹täysin˺ tietää, mitä teette."}},{"verse":284,"commentary_en":"Just as this surah began with a declaration of the core principles of faith, this verse—and the concluding section of the surah—reaffirms the foundational truths upon which Islam is built. It proclaims the ultimate reality of Allah’s sovereignty and knowledge, declaring that everything in the heavens and the earth belongs entirely to Him. It is thus only fitting that humanity should submit to Him in obedience and devotion. The verse then states that Allah is fully aware not only of our outward actions but also of our inner thoughts and intentions—whether we express them openly or keep them hidden. This serves as a powerful reminder that nothing escapes His knowledge, not even the silent stirrings of the heart. To better grasp this, we can reflect on how the soul processes thoughts and intentions. It moves through several stages: a passing notion, a formed idea, a conscious inclination, deliberation, and finally, firm resolve. These are five stages. While the first four are fleeting or uncertain, it is the fifth—where intention becomes definite—that truly demands our attention. Ultimately, Allah will hold everyone accountable for what lies within, just as He does for outward actions. He forgives whom He wills and punishes whom He wills, according to His perfect wisdom and justice. This verse emphasizes both Allah’s complete authority and His capacity for mercy, reminding us of the balance between accountability and divine forgiveness.","commentary_fi":"Kuten tämä suura alkoi uskon keskeisten periaatteiden julistuksella, tämä ja sitä seuraava loppuosa vahvistavat jälleen islamin perustavanlaatuiset totuudet. Jae julistaa Allahin täydellisen herruuden ja tiedon todellisuuden: kaikki, mitä taivaissa ja maassa on, kuuluu kokonaan Hänelle. On siis vain oikein, että ihminen alistuu Hänelle kuuliaisuudessa ja palvonnassa. Jae jatkaa toteamalla, että Allah tietää paitsi ulkoiset tekomme myös sisimmät ajatuksemme ja aikomuksemme—ilmaisimmepa ne ääneen tai pidimme ne salassa. Tämä toimii voimakkaana muistutuksena siitä, ettei mikään jää Häneltä piiloon, ei edes sydämen hiljaiset liikkeet. Tätä voi ymmärtää pohtimalla, miten sielu käsittelee ajatuksia ja aikomuksia. Prosessi etenee useiden vaiheiden kautta: ohimenevä ajatus, muodostunut idea, tietoinen taipumus, harkinta ja lopulta varma päätös. Näitä on viisi vaihetta. Vaikka ensimmäiset neljä ovat lyhytkestoisia tai epämääräisiä, viides—jossa aikomus on selvä—on se, johon meidän on kiinnitettävä huomiota. Lopulta Allah pitää meitä kaikkia tilivelvollisina sisäisistä ja ulkoisista teoistamme. Hän antaa anteeksi kenelle tahtoo ja rankaisee ketä tahtoo, täydellisen viisautensa ja oikeudenmukaisuutensa mukaan. Tämä jae korostaa sekä Allahin täydellistä valtaa että Hänen armeliaisuuttaan, muistuttaen meitä vastuullisuudesta ja mahdollisuudesta saada anteeksianto.","arabic":"لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَإِنْ تُبْدُوا مَا فِي أَنْفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُمْ بِهِ اللَّهُ ۖ فَيَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","commentary":"Kuten tämä suura alkoi uskon keskeisten periaatteiden julistuksella, tämä ja sitä seuraava loppuosa vahvistavat jälleen islamin perustavanlaatuiset totuudet. Jae julistaa Allahin täydellisen herruuden ja tiedon todellisuuden: kaikki, mitä taivaissa ja maassa on, kuuluu kokonaan Hänelle. On siis vain oikein, että ihminen alistuu Hänelle kuuliaisuudessa ja palvonnassa. Jae jatkaa toteamalla, että Allah tietää paitsi ulkoiset tekomme myös sisimmät ajatuksemme ja aikomuksemme—ilmaisimmepa ne ääneen tai pidimme ne salassa. Tämä toimii voimakkaana muistutuksena siitä, ettei mikään jää Häneltä piiloon, ei edes sydämen hiljaiset liikkeet. Tätä voi ymmärtää pohtimalla, miten sielu käsittelee ajatuksia ja aikomuksia. Prosessi etenee useiden vaiheiden kautta: ohimenevä ajatus, muodostunut idea, tietoinen taipumus, harkinta ja lopulta varma päätös. Näitä on viisi vaihetta. Vaikka ensimmäiset neljä ovat lyhytkestoisia tai epämääräisiä, viides—jossa aikomus on selvä—on se, johon meidän on kiinnitettävä huomiota. Lopulta Allah pitää meitä kaikkia tilivelvollisina sisäisistä ja ulkoisista teoistamme. Hän antaa anteeksi kenelle tahtoo ja rankaisee ketä tahtoo, täydellisen viisautensa ja oikeudenmukaisuutensa mukaan. Tämä jae korostaa sekä Allahin täydellistä valtaa että Hänen armeliaisuuttaan, muistuttaen meitä vastuullisuudesta ja mahdollisuudesta saada anteeksianto.","translations":{"opas":"Jumalalle kuuluu kaikki taivaassa ja maan päällä, ja ilmaisetteko vai salaatte, mitä teillä on mielessä, vaatii Jumala teidät tilille siitä. Hän antaa anteeksi kenelle tahtoo ja rankaisee ketä tahtoo, sillä Jumala on kaikkivaltias.","clear":"Jumalalle ˹yksin˺ kuuluu kaikki, mitä taivaissa ja maan päällä on. Paljastattepa te sydämissänne olevan tai salaatte sen, Jumala kutsuu teidät siitä tilille. Hän antaa anteeksi kenelle tahtoo ja rankaisee ketä tahtoo. Ja Jumala on kaikkein kyvykkäin kaikkeen."}},{"verse":285,"commentary_en":"This verse outlines the five core beliefs that every Muslim holds: belief in Allah, His angels, His revealed books, all of His messengers, and the certainty of returning to Him. Muslims believe that all prophets—from Adam to Muhammad—conveyed messages from the same Divine source, and they make no distinction between them in terms of faith and respect. It then describes the attitude of true believers: they say, \"We hear, and we obey,\" expressing full submission to Allah’s guidance. Acknowledging their human limitations, they seek Allah’s forgiveness and affirm their ultimate return to Him. This awareness—that life ends in accountability before Allah—shapes the believer’s perspective and behavior. The verse mirrors themes introduced at the beginning of the surah, grounding its conclusion in the same foundational beliefs.","commentary_fi":"Tämä jae esittelee viisi uskon ydinkohtaa, joihin jokainen muslimi uskoo: usko Allahiin, Hänen enkeleihinsä, Hänen ilmoitettuihin kirjoihinsa, kaikkiin Hänen lähettiläisiinsä sekä varmuus siitä, että jokainen palaa lopulta Hänen luokseen. Muslimit uskovat, että kaikki profeetat—Aadamista Muhammediin—toivat viestin samasta jumalallisesta lähteestä, eikä heidän välillään tehdä eroa uskon tai kunnioituksen suhteen. Jae kuvaa myös u
