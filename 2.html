hat Allah is fully aware of those who turn away from their commitments.","commentary_fi":"Tämä jae siirtyy kertomaan tarinaa Israelin lapsien historiasta Profeetta Mooseksen ajan jälkeen. Se kertoo ajasta, jolloin heidän vanhimpansa pyysivät profeetaltaan, että tämä nimittäisi kuninkaan johtamaan heitä taistelemaan Allahin asian puolesta, väittäen, että heidät oli ajettu kodeistaan ja perheistään. Profeetta kyseenalaisti heidän vilpittömyytensä, kysyen, olisiko mahdollista, että he kieltäytyisivät taistelemasta, jos se todella käskettäisiin. Huolimatta heidän vahvasta valaastaan valmiudesta kärsimystensä vuoksi, kun taistelu määrättiin, useimmat heistä kääntyivät pois, lukuun ottamatta pientä joukkoa. Jae päättyy toteamukseen, että Allah on täysin tietoinen niistä, jotka kääntyvät pois sitoumuksistaan.","arabic":"أَلَمْ تَرَ إِلَى الْمَلَإِ مِنْ بَنِي إِسْرَائِيلَ مِنْ بَعْدِ مُوسَىٰ إِذْ قَالُوا لِنَبِيٍّ لَهُمُ ابْعَثْ لَنَا مَلِكًا نُقَاتِلْ فِي سَبِيلِ اللَّهِ ۖ قَالَ هَلْ عَسَيْتُمْ إِنْ كُتِبَ عَلَيْكُمُ الْقِتَالُ أَلَّا تُقَاتِلُوا ۖ قَالُوا وَمَا لَنَا أَلَّا نُقَاتِلَ فِي سَبِيلِ اللَّهِ وَقَدْ أُخْرِجْنَا مِنْ دِيَارِنَا وَأَبْنَائِنَا ۖ فَلَمَّا كُتِبَ عَلَيْهِمُ الْقِتَالُ تَوَلَّوْا إِلَّا قَلِيلًا مِنْهُمْ ۗ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ","commentary":"Tämä jae siirtyy kertomaan tarinaa Israelin lapsien historiasta Profeetta Mooseksen ajan jälkeen. Se kertoo ajasta, jolloin heidän vanhimpansa pyysivät profeetaltaan, että tämä nimittäisi kuninkaan johtamaan heitä taistelemaan Allahin asian puolesta, väittäen, että heidät oli ajettu kodeistaan ja perheistään. Profeetta kyseenalaisti heidän vilpittömyytensä, kysyen, olisiko mahdollista, että he kieltäytyisivät taistelemasta, jos se todella käskettäisiin. Huolimatta heidän vahvasta valaastaan valmiudesta kärsimystensä vuoksi, kun taistelu määrättiin, useimmat heistä kääntyivät pois, lukuun ottamatta pientä joukkoa. Jae päättyy toteamukseen, että Allah on täysin tietoinen niistä, jotka kääntyvät pois sitoumuksistaan.","translations":{"opas":"Muista israelilaisten vanhimmat Mooseksen aikojen jälkeen, jotka sanoivat eräälle keskuudessaan olevalle profeetalle: »Aseta meille kuningas, niin taistelemme Jumalan asian puolesta». Hän sanoi: »Mutta entä jos jäättekin pois taistelusta, jos taistelu teille määrätään?» He sanoivat: »Miksemme taistelisi Jumalan asian puolesta, kun olemme joka tapauksessa karkoitetut kodeistamme lapsinemme?» Mutta kun heidät määrättiin taistelemaan, kääntyivät he pois, paitsi muutamat harvat. Mutta Jumala tuntee väärintekijät.","clear":"Etkö ole nähnyt niitä Israelin lasten päälliköitä Mooseksen jälkeen? He sanoivat yhdelle profeetoistaan: »Nimittäkää meille kuningas, niin me taistelemme Jumalan asian puolesta.» Hän sanoi: »Ettekö te pelkää taistella, jos teitä käsketään?». He vastasivat: »Kuinka voisimme kieltäytyä taistelemasta Jumalan asian puolesta, kun meidät ajettiin pois kodeistamme ja erotettiin lapsistamme?». Mutta kun heitä käskettiin taistelemaan, he pakenivat, paitsi harvat heistä. Ja Jumalalla on täydellinen tieto väärintekijöistä."}},{"verse":247,"commentary_en":"After the Children of Israel asked for a king, their prophet told them that Allah had appointed Talut (Saul) to lead them. Instead of accepting this divine choice, they objected, claiming others were more deserving because Talut lacked wealth and high social status. Their prophet explained that Allah had chosen him for his knowledge and physical strength—key qualities for leadership, especially in times of battle. He reminded them that Allah grants authority to whomever He wills. This verse highlights that true leadership is based on divine wisdom, not worldly measures like lineage or wealth.","commentary_fi":"Sen jälkeen kun israelilaiset pyysivät kuningasta, heidän profeettansa kertoi, että Allah oli nimittänyt Talutin (Saulin) heidän johtajakseen. He eivät kuitenkaan hyväksyneet tätä valintaa, vaan väittivät, että jotkut muut olisivat sopivampia, koska Talutilla ei ollut rikkautta tai korkeaa asemaa. Profeetta selitti, että Allah oli valinnut hänet hänen tietonsa ja fyysisen voimansa vuoksi—ominaisuudet, jotka ovat tärkeitä erityisesti sodankäynnissä. Hän muistutti, että Allah antaa vallan kenelle tahtoo. Tämä jae korostaa, että todellinen johtajuus perustuu Allahin viisauteen, ei maallisiin mittareihin kuten varallisuuteen tai sukuun.","arabic":"وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ اللَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكًا ۚ قَالُوا أَنَّىٰ يَكُونُ لَهُ الْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِالْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةً مِنَ الْمَالِ ۚ قَالَ إِنَّ اللَّهَ اصْطَفَاهُ عَلَيْكُمْ وَزَادَهُ بَسْطَةً فِي الْعِلْمِ وَالْجِسْمِ ۖ وَاللَّهُ يُؤْتِي مُلْكَهُ مَنْ يَشَاءُ ۚ وَاللَّهُ وَاسِعٌ عَلِيمٌ","commentary":"Sen jälkeen kun israelilaiset pyysivät kuningasta, heidän profeettansa kertoi, että Allah oli nimittänyt Talutin (Saulin) heidän johtajakseen. He eivät kuitenkaan hyväksyneet tätä valintaa, vaan väittivät, että jotkut muut olisivat sopivampia, koska Talutilla ei ollut rikkautta tai korkeaa asemaa. Profeetta selitti, että Allah oli valinnut hänet hänen tietonsa ja fyysisen voimansa vuoksi—ominaisuudet, jotka ovat tärkeitä erityisesti sodankäynnissä. Hän muistutti, että Allah antaa vallan kenelle tahtoo. Tämä jae korostaa, että todellinen johtajuus perustuu Allahin viisauteen, ei maallisiin mittareihin kuten varallisuuteen tai sukuun.","translations":{"opas":"Ja heidän profeettansa sanoi heille: »Katso, Jumala on asettanut Saulin teidän kuninkaaksenne». He kysyivät: »Kuinka hän voi tulla kuninkaaksi meitä hallitsemaan, kun meillä on suuremmat oikeudet kuninkaan arvoon kuin hänellä, eikä hänellä ole edes rikkauttakaan?» Hän vastasi: »Katso, Jumala on valinnut hänet teidän hallitsijaksenne ja runsaasti varustanut hänet tiedolla ja ruumiinvoimilla, sillä Jumala antaa hallitusvallan kenelle tahtoo». Niin, Jumala sulkee kaikki olemukseensa ja tietoonsa.","clear":"Heidän profeettansa sanoi heille: »Jumala on nimittänyt Saulin kuninkaaksenne.» He vastustivat: »Kuinka hän voisi olla kuninkaamme, kun jotkut meistä ovat ansioituneempia kuninkuuteen kuin hän, eikä häntä ole siunattu valtavalla rikkaudella?» Hän vastasi: »Jumala on valinnut hänet teidän ylitsenne ja siunannut hänet tiedolla ja koolla. Jumala antaa kuninkuuden kenelle haluaa. Ja Jumala on kaikkivaltias, kaikkitietävä.»"}},{"verse":248,"commentary_en":"As further evidence of Talut’s (Saul’s) appointment by Allah, their prophet gave them a physical sign: the return of the Ark of the Covenant. This Ark was a sacred object containing relics from the families of Prophet Moses and Prophet Aaron. In it there is peace and reassurance from their Lord. The verse describes the Ark being carried by angels. Their prophet told them this would be a clear sign of Talut’s authority, if they were truly believers. This act of divine intervention was meant to remove any doubt about Talut’s divinely appointed leadership.","commentary_fi":"Lisävahvistuksena siitä, että Talut (Saul) oli Allahin nimittämä johtaja, heidän profeettansa antoi heille fyysisen merkin: liitonarkin paluun. Tämä arkku oli pyhä esine, joka sisälsi jäännöksiä profeetta Mooseksen ja Aaronin perheiltä. Siinä on rauhaa ja varmuutta heidän Herraltaan. Jae kuvaa, kuinka enkelit kantoivat arkkua. Profeetta sanoi, että tämä olisi selvä merkki Talutin auktoriteetista niille, jotka todella uskovat. Tämä jumalallinen väliintulo oli tarkoitettu poistamaan kaikki epäilyt Talutin Allahin määräämästä johtajuudesta.","arabic":"وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ آيَةَ مُلْكِهِ أَنْ يَأْتِيَكُمُ التَّابُوتُ فِيهِ سَكِينَةٌ مِنْ رَبِّكُمْ وَبَقِيَّةٌ مِمَّا تَرَكَ آلُ مُوسَىٰ وَآلُ هَارُونَ تَحْمِلُهُ الْمَلَائِكَةُ ۚ إِنَّ فِي ذَٰلِكَ لَآيَةً لَكُمْ إِنْ كُنْتُمْ مُؤْمِنِينَ","commentary":"Lisävahvistuksena siitä, että Talut (Saul) oli Allahin nimittämä johtaja, heidän profeettansa antoi heille fyysisen merkin: liitonarkin paluun. Tämä arkku oli pyhä esine, joka sisälsi jäännöksiä profeetta Mooseksen ja Aaronin perheiltä. Siinä on rauhaa ja varmuutta heidän Herraltaan. Jae kuvaa, kuinka enkelit kantoivat arkkua. Profeetta sanoi, että tämä olisi selvä merkki Talutin auktoriteetista niille, jotka todella uskovat. Tämä jumalallinen väliintulo oli tarkoitettu poistamaan kaikki epäilyt Talutin Allahin määräämästä johtajuudesta.","translations":{"opas":"Ja heidän profeettansa sanoi heille: »Katso, hänen kuninkuutensa tunnusmerkki on se, että liitonarkki, enkeleiden kantamana, on tuleva luoksenne sisältäen Herranne sekiinan ja Mooseksen sekä Aaronin suvun jälkeensä jättämiä pyhiä esineitä». Tässä on tunnusmerkki teille, jos totisesti olette uskovaisia.","clear":"Heidän profeettansa sanoi heille edelleen: »Saulin kuninkuuden merkki on, että Arkki tulee teidän luoksenne – sisältäen rauhoitusta Herraltanne ja jäänteitä Mooseksen ja Aaronin suvulta, joita enkelit kantavat. Totisesti tässä on merkki teille, jos todella uskotte.»"}},{"verse":249,"commentary_en":"After being appointed king, Talut (Saul) led his army and informed them that Allah would test them with a river: they were not to drink from it except for a small sip. Despite this clear warning, almost all of them failed by drinking their fill, leaving only a small number who passed the test through discipline and obedience. Later, when this group crossed the river and faced the much larger army of their enemy, Goliath, many among them felt overwhelmed and doubted their chances of victory. However, a very small core—those who were certain they would meet Allah—reminded the others that victory comes by Allah’s will, and that Allah is with those who are patient and steadfast. This moment highlights that true strength lies not in numbers, but in faith, discipline, and trust in Allah.","commentary_fi":"Kun Talut (Saul) oli nimitetty kuninkaaksi, hän johti armeijansa ja ilmoitti heille, että Allah koettelisi heitä joella: heidän ei tulisi juoda siitä, paitsi pieni siemaus. Tästä selkeästä varoituksesta huolimatta melkein kaikki epäonnistuivat juomalla itsensä kylläisiksi, ja vain pieni joukko selvisi koetuksesta kurinalaisuudella ja kuuliaisuudella. Myöhemmin, kun tämä ryhmä ylitti joen ja kohtasi paljon suuremman vihollisarmeijan Goljatin johdolla, monet tunsivat itsensä lannistuneiksi ja epäilivät voiton mahdollisuuksiaan. Kuitenkin hyvin pieni ydinjoukko—ne, jotka olivat varmoja kohtaavansa Allahin—muistutti muita, että voitto tulee Allahin tahdosta ja että Allah on kärsivällisten ja lujien kanssa. Tämä hetki korostaa, että todellinen voima ei ole lukumäärässä, vaan uskossa, kurinalaisuudessa ja luottamuksessa Allahiin.","arabic":"فَلَمَّا فَصَلَ طَالُوتُ بِالْجُنُودِ قَالَ إِنَّ اللَّهَ مُبْتَلِيكُمْ بِنَهَرٍ فَمَنْ شَرِبَ مِنْهُ فَلَيْسَ مِنِّي وَمَنْ لَمْ يَطْعَمْهُ فَإِنَّهُ مِنِّي إِلَّا مَنِ اغْتَرَفَ غُرْفَةً بِيَدِهِ ۚ فَشَرِبُوا مِنْهُ إِلَّا قَلِيلًا مِنْهُمْ ۚ فَلَمَّا جَاوَزَهُ هُوَ وَالَّذِينَ آمَنُوا مَعَهُ قَالُوا لَا طَاقَةَ لَنَا الْيَوْمَ بِجَالُوتَ وَجُنُودِهِ ۚ قَالَ الَّذِينَ يَظُنُّونَ أَنَّهُمْ مُلَاقُو اللَّهِ كَمْ مِنْ فِئَةٍ قَلِيلَةٍ غَلَبَتْ فِئَةً كَثِيرَةً بِإِذْنِ اللَّهِ ۗ وَاللَّهُ مَعَ الصَّابِرِينَ","commentary":"Kun Talut (Saul) oli nimitetty kuninkaaksi, hän johti armeijansa ja ilmoitti heille, että Allah koettelisi heitä joella: heidän ei tulisi juoda siitä, paitsi pieni siemaus. Tästä selkeästä varoituksesta huolimatta melkein kaikki epäonnistuivat juomalla itsensä kylläisiksi, ja vain pieni joukko selvisi koetuksesta kurinalaisuudella ja kuuliaisuudella. Myöhemmin, kun tämä ryhmä ylitti joen ja kohtasi paljon suuremman vihollisarmeijan Goljatin johdolla, monet tunsivat itsensä lannistuneiksi ja epäilivät voiton mahdollisuuksiaan. Kuitenkin hyvin pieni ydinjoukko—ne, jotka olivat varmoja kohtaavansa Allahin—muistutti muita, että voitto tulee Allahin tahdosta ja että Allah on kärsivällisten ja lujien kanssa. Tämä hetki korostaa, että todellinen voima ei ole lukumäärässä, vaan uskossa, kurinalaisuudessa ja luottamuksessa Allahiin.","translations":{"opas":"Kun nyt Saul lähti liikkeelle sotajoukkojensa kera, sanoi hän: »Jumala on totisesti koetteleva teitä joelle tultuanne; se, joka juo siitä, ei kuulu minun miehiini (niihin kuuluu se, joka ei maista siitä yhtään) - paitsi se, joka ainoastaan ottaa kulauksen kämmenellään.» ja niin joivat he siitä paitsi muutamat harvat. Ja kun hän ja hänen uskonveljensä olivat kulkeneet puron yli, sanoivat he: »Tänään meillä ei ole voimia Goljatia ja hänen joukkojaan vastaan», mutta ne, jotka uskoivat kohtaavansa Jumalan, huudahtivat: »Kuinka usein onkaan pieni joukko Jumalan avulla voittanut suuren sotaväen!» Onhan Jumala kestävien kanssa.","clear":"Kun Saul lähti armeijansa kanssa, hän varoitti: ”Jumala koettelee teitä joen avulla. Joten se, joka juo siitä ˹täyteen vatsaansa˺, ei ole minun kanssani, ja se, joka ei maista sitä – paitsi kulauksen kämmenestä – on ehdottomasti minun kanssani.” He kaikki joivat ˹täyteen vatsaansa˺ muutamaa lukuun ottamatta! Kun hän ja ˹jäljellä olevat˺ uskolliset hänen kanssaan ylittivät joen, he sanoivat: ”Nyt emme pärjää Goljatille ja hänen sotureilleen.” Mutta ne ˹uskovat˺, jotka olivat varmoja tapaavansa Jumalan, järkeilivät: ”Kuinka monta kertaa pieni joukko onkaan voittanut mahtavan armeijan Jumalan tahdolla! Ja Jumala on ˹aina˺ vankkumattomien kanssa.”"}},{"verse":250,"commentary_en":"As the small, faithful group under Talut (Saul) advanced to face the much larger enemy force led by Goliath, they turned to Allah in sincere prayer. They asked Him to grant them patience and steadfastness in the face of adversity, to keep their feet firm during the battle, and to grant them victory over the disbelieving forces. This prayer reveals their deep reliance on Allah for strength and success, recognizing that true victory comes only from Him.","commentary_fi":"Kun Talutin (Saulin) johdolla ollut pieni ja uskollinen joukko eteni kohtaamaan paljon suuremman vihollisarmeijan, jota johti Jalut (Goliat), he kääntyivät vilpittömässä rukouksessa Allahin puoleen. He pyysivät Allahia antamaan heille kärsivällisyyttä ja lujuutta vastoinkäymisten edessä, pitämään heidän askeleensa vakaina taistelussa ja antamaan heille voiton epäuskoisista joukoista. Tämä rukous kuvastaa heidän syvää luottamustaan Allahiin voiman ja menestyksen lähteenä, tunnustaen, että todellinen voitto tulee ainoastaan Häneltä.","arabic":"وَلَمَّا بَرَزُوا لِجَالُوتَ وَجُنُودِهِ قَالُوا رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","commentary":"Kun Talutin (Saulin) johdolla ollut pieni ja uskollinen joukko eteni kohtaamaan paljon suuremman vihollisarmeijan, jota johti Jalut (Goliat), he kääntyivät vilpittömässä rukouksessa Allahin puoleen. He pyysivät Allahia antamaan heille kärsivällisyyttä ja lujuutta vastoinkäymisten edessä, pitämään heidän askeleensa vakaina taistelussa ja antamaan heille voiton epäuskoisista joukoista. Tämä rukous kuvastaa heidän syvää luottamustaan Allahiin voiman ja menestyksen lähteenä, tunnustaen, että todellinen voitto tulee ainoastaan Häneltä.","translations":{"opas":"Kun he hyökkäsivät Goljatia ja hänen sotajoukkojaan vastaan, he huusivat: »Herra, suo meille lujuutta, vahvista askeleemme ja auta meidät saamaan voitto uskottomasta kansasta!»","clear":"Kun he etenivät kohtaamaan Goljatin ja hänen soturinsa, he rukoilivat: ”Herramme! Suo meille kestävyyttä, vahvista askeleemme ja anna meille voitto epäuskoisista ihmisistä.”"}},{"verse":251,"commentary_en":"The verse narrates the outcome: by Allah’s will, the small group routed the enemy forces. It specifically mentions that David, who was part of Talut’s (Saul’s) army, killed Goliath. Following this victory, Allah granted David kingship and wisdom and taught him as He willed. This shows that victory and authority come from Allah alone, and that Allah chooses whom He blesses with leadership and knowledge. The verse then explains an important universal principle about how groups or nations interact. When any group becomes powerful and strong, it might be tempted to act unjustly or exceed limits. To prevent this, Allah allows another group to rise up and balance the first. This ongoing balance helps stop corruption and chaos from spreading and serves a vital purpose in preventing greater evil. Finally, the verse reminds us that Allah is full of great bounty and favor towards all creation.","commentary_fi":"Jae kertoo lopputuloksen: Allahin tahdosta pieni joukko voitti vihollisjoukot. Siinä mainitaan erityisesti, että Daavid, joka oli osa Talutin (Saul) armeijaa, tappoi Goljatin. Tämän voiton jälkeen Allah antoi Daavidille kuninkuuden ja viisauden ja opetti häntä niin kuin itse tahtoi. Tämä osoittaa, että voitto ja valta tulevat yksin Allahilta, ja että Allah valitsee kenelle Hän siunailee johtajuuden ja tiedon. Jae opettaa myös tärkeän yleisen periaatteen siitä, miten ryhmät tai kansakunnat vuorovaikuttavat. Kun jokin ryhmä tulee voimakkaaksi ja vahvaksi, se saattaa kiusauksessa toimia epäoikeudenmukaisesti tai ylittää rajat. Estääkseen tämän Allah sallii toisen ryhmän nousta ja tasapainottaa ensimmäisen. Tämä jatkuva tasapaino estää korruptiota ja kaaosta leviämästä ja palvelee tärkeää tarkoitusta estää suurempaa pahuutta. Lopuksi jae muistuttaa, että Allah on täynnä suurta hyvyyttä ja armoa koko luomakuntaa kohtaan.","arabic":"فَهَزَمُوهُمْ بِإِذْنِ اللَّهِ وَقَتَلَ دَاوُودُ جَالُوتَ وَآتَاهُ اللَّهُ الْمُلْكَ وَالْحِكْمَةَ وَعَلَّمَهُ مِمَّا يَشَاءُ ۗ وَلَوْلَا دَفْعُ اللَّهِ النَّاسَ بَعْضَهُمْ بِبَعْضٍ لَفَسَدَتِ الْأَرْضُ وَلَٰكِنَّ اللَّهَ ذُو فَضْلٍ عَلَى الْعَالَمِينَ","commentary":"Jae kertoo lopputuloksen: Allahin tahdosta pieni joukko voitti vihollisjoukot. Siinä mainitaan erityisesti, että Daavid, joka oli osa Talutin (Saul) armeijaa, tappoi Goljatin. Tämän voiton jälkeen Allah antoi Daavidille kuninkuuden ja viisauden ja opetti häntä niin kuin itse tahtoi. Tämä osoittaa, että voitto ja valta tulevat yksin Allahilta, ja että Allah valitsee kenelle Hän siunailee johtajuuden ja tiedon. Jae opettaa myös tärkeän yleisen periaatteen siitä, miten ryhmät tai kansakunnat vuorovaikuttavat. Kun jokin ryhmä tulee voimakkaaksi ja vahvaksi, se saattaa kiusauksessa toimia epäoikeudenmukaisesti tai ylittää rajat. Estääkseen tämän Allah sallii toisen ryhmän nousta ja tasapainottaa ensimmäisen. Tämä jatkuva tasapaino estää korruptiota ja kaaosta leviämästä ja palvelee tärkeää tarkoitusta estää suurempaa pahuutta. Lopuksi jae muistuttaa, että Allah on täynnä suurta hyvyyttä ja armoa koko luomakuntaa kohtaan.","translations":{"opas":"Ja Jumalan sallimuksesta he ajoivat heidät pakoon; David surmasi Goljatin, ja Jumala antoi hänelle kuninkuuden ja viisauden ja opetti häntä tahtonsa mukaan. Jollei Jumala masentaisi ihmisiä toistensa kautta, niin olisi maa sekasorron tilassa, mutta Jumala on koko luomakunnan Hyväntekijä.","clear":"Niin he voittivat heidät Jumalan tahdolla, ja Daavid tappoi Goljatin. Ja Jumala siunasi Daavidia kuninkuudella ja viisaudella ja opetti hänelle, mitä Hän tahtoi. Jos Jumala ei olisi torjunut ryhmää ihmisiä toisen ˹voimalla˺, turmelus olisi vallannut maan, mutta Jumala on armollinen kaikille."}},{"verse":252,"commentary_en":"This final verse in the passage affirms that the earlier stories and lessons are “Signs of Allah” — meaning they are divine messages filled with wisdom and guidance for humanity. It stresses that these accounts are true and were revealed to the Prophet Muhammad. By saying, “verily Thou art one of the messengers,” the verse confirms that Muhammad is indeed a messenger chosen by Allah to receive these revelations and to deliver Allah’s guidance to people. This establishes the Prophet’s role as a trustworthy conveyor of Allah’s divine signs.","commentary_fi":"Tämä jakson viimeinen jae vahvistaa, että aiemmat tarinat ja opetukset ovat \"Allahilta merkkejä\" – jumalallisia viestejä, jotka sisältävät viisautta ja ohjausta ihmiskunnalle. Se korostaa, että nämä kertomukset ovat totta ja ne on ilmoitettu profeetta Muhammadille. Sanomalla \"totisesti sinä olet yksi lähettiläistä\" jae vahvistaa, että Muhammad on todellakin Allahin valitsema lähettiläs, jonka tehtävänä on vastaanottaa nämä ilmoitukset ja välittää Allahin ohjaus ihmisille. Tämä osoittaa, että profeetta on luotettava Allahin jumalallisten merkkien välittäjä.","arabic":"تِلْكَ آيَاتُ اللَّهِ نَتْلُوهَا عَلَيْكَ بِالْحَقِّ ۚ وَإِنَّكَ لَمِنَ الْمُرْسَلِينَ","commentary":"Tämä jakson viimeinen jae vahvistaa, että aiemmat tarinat ja opetukset ovat \"Allahilta merkkejä\" – jumalallisia viestejä, jotka sisältävät viisautta ja ohjausta ihmiskunnalle. Se korostaa, että nämä kertomukset ovat totta ja ne on ilmoitettu profeetta Muhammadille. Sanomalla \"totisesti sinä olet yksi lähettiläistä\" jae vahvistaa, että Muhammad on todellakin Allahin valitsema lähettiläs, jonka tehtävänä on vastaanottaa nämä ilmoitukset ja välittää Allahin ohjaus ihmisille. Tämä osoittaa, että profeetta on luotettava Allahin jumalallisten merkkien välittäjä.","translations":{"opas":"Nämä ovat Jumalan tunnusmerkkejä, jotka Me julistamme sinulle, Muhammed, totuudessa, sillä sinä kuulut totisesti Meidän lähettiläittemme joukkoon.","clear":"Nämä ovat Jumalan ilmoituksia, jotka Me luemme sinulle ˹Oi Profeetta˺ totuudessa. Ja sinä olet todella yksi sanansaattajista."}},{"verse":253,"commentary_en":"This verse speaks about the messengers sent by Allah—special individuals chosen to deliver His message. All these messengers were united in conveying the core message of Allah’s oneness and guidance. The verse notes that Allah elevated some messengers above others in rank and status. For example, one messenger was spoken to directly by Allah (commonly understood as Prophet Moses), others were given higher ranks, and Prophet Jesus, the son of Mary, was given clear signs (such as miracles) and was strengthened by the Holy Spirit (understood as the Archangel Gabriel). Despite the clear messages and signs brought by these prophets, their followers and later generations differed in their beliefs—some accepted the faith, while others rejected it. This division sometimes led to conflicts and fighting. Muslims should learn from this and avoid similar divisions and disputes. Furthermore, the verse implies that if Allah had willed, there would be no conflict—just as angels do not differ or rebel. However, Allah created human beings on earth as a test, and the prophets were not sent as enforcers or policemen to force obedience. Instead, they came with clear signs and reasonable arguments inviting people to righteousness. If Allah had so willed, there would have been no fighting. Ultimately, all is within Allah’s control.","commentary_fi":"Tämä jae kertoo Allahin lähettämistä lähettiläistä — erityisistä henkilöistä, jotka on valittu viemään Hänen sanomaansa. Kaikki nämä lähettiläät olivat yhtä mieltä välittämässä Allahin ykseyden ja ohjauksen keskeistä viestiä. Jae mainitsee, että Allah korotti joitakin lähettiläitä muita korkeampaan arvoon ja asemaan. Esimerkiksi yksi lähettiläs puhui suoraan Allahin kanssa (yleisesti ymmärretään olevan profeetta Mooses), toiset saivat korkeamman aseman, ja profeetta Jeesus, Marian poika, sai selkeitä merkkejä (kuten ihmeitä) ja hänet vahvistettiin Pyhällä Hengellä (jota ymmärretään olevan arkkienkeli Gabriel). Huolimatta näiden profeettojen tuomista selkeistä viesteistä ja merkeistä, heidän seuraajansa ja myöhemmät sukupolvet erosivat uskomuksissaan — toiset uskoivat, toiset hylkäsivät uskon. Tämä jakautuminen johti joskus riitoihin ja taisteluihin. Muslimeiden tulisi oppia tästä ja välttää vastaavia erimielisyyksiä ja kiistoja. Lisäksi jae viittaa siihen, että jos Allah olisi niin tahtonut, ei olisi ollut ristiriitoja — aivan kuten enkelit eivät riitele tai kapinoi. Kuitenkin Allah loi ihmiset maan päälle koetukseksi, eikä profeettoja lähetetty valvojina tai poliiseina pakottamaan kuuliaisuutta. Sen sijaan he toivat selkeitä merkkejä ja järkeviä perusteluja kutsuen ihmisiä vanhurskauteen. Jos Allah olisi niin tahtonut, taistelua ei olisi ollut. Lopulta kaikki on Allahin vallassa.","arabic":"تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۘ مِنْهُمْ مَنْ كَلَّمَ اللَّهُ ۖ وَرَفَعَ بَعْضَهُمْ دَرَجَاتٍ ۚ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ ۗ وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلَ الَّذِينَ مِنْ بَعْدِهِمْ مِنْ بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَاتُ وَلَٰكِنِ اخْتَلَفُوا فَمِنْهُمْ مَنْ آمَنَ وَمِنْهُمْ مَنْ كَفَرَ ۚ وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلُوا وَلَٰكِنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ","commentary":"Tämä jae kertoo Allahin lähettämistä lähettiläistä — erityisistä henkilöistä, jotka on valittu viemään Hänen sanomaansa. Kaikki nämä lähettiläät olivat yhtä mieltä välittämässä Allahin ykseyden ja ohjauksen keskeistä viestiä. Jae mainitsee, että Allah korotti joitakin lähettiläitä muita korkeampaan arvoon ja asemaan. Esimerkiksi yksi lähettiläs puhui suoraan Allahin kanssa (yleisesti ymmärretään olevan profeetta Mooses), toiset saivat korkeamman aseman, ja profeetta Jeesus, Marian poika, sai selkeitä merkkejä (kuten ihmeitä) ja hänet vahvistettiin Pyhällä Hengellä (jota ymmärretään olevan arkkienkeli Gabriel). Huolimatta näiden profeettojen tuomista selkeistä viesteistä ja merkeistä, heidän seuraajansa ja myöhemmät sukupolvet erosivat uskomuksissaan — toiset uskoivat, toiset hylkäsivät uskon. Tämä jakautuminen johti joskus riitoihin ja taisteluihin. Muslimeiden tulisi oppia tästä ja välttää vastaavia erimielisyyksiä ja kiistoja. Lisäksi jae viittaa siihen, että jos Allah olisi niin tahtonut, ei olisi ollut ristiriitoja — aivan kuten enkelit eivät riitele tai kapinoi. Kuitenkin Allah loi ihmiset maan päälle koetukseksi, eikä profeettoja lähetetty valvojina tai poliiseina pakottamaan kuuliaisuutta. Sen sijaan he toivat selkeitä merkkejä ja järkeviä perusteluja kutsuen ihmisiä vanhurskauteen. Jos Allah olisi niin tahtonut, taistelua ei olisi ollut. Lopulta kaikki on Allahin vallassa.","translations":{"opas":"Näistä lähettiläistä olemme eräille antanut korkeamman aseman kuin toisille. Ylennettyjen joukossa oli niitä, joiden kanssa Jumala on puhunut, ja toisia, jotka Hän on korkealle korottanut. Olemme antanut Jeesukselle, Marian pojalle, selvät todistukset ja tukenut häntä Pyhyyden hengellä; ja jos Jumala olisi tahtonut, niin ne jotka seurasivat heitä, eivät olisi taistelleet toisiaan vastaan, senjälkeen kuin selvät todistukset olivat tulleet heidän osakseen. Mutta he olivat eripuraisia: heidän keskuudessaan oli uskovaisia ja uskottomia,- ja jos Jumala olisi tahtonut, eivät he olisi taistelleet toisiansa vastaan, mutta Jumala tekee, mitä haluaa.","clear":"Olemme valinneet joitakin noista sanansaattajista toisten yläpuolelle. Allah puhui suoraan joillekin ja korotti joitakin korkeaan asemaan. Jeesukselle, Marian pojalle, annoimme selvät todisteet ja tuimme häntä pyhällä hengellä. Jos Allah olisi tahtonut, seuraavat sukupolvet eivät olisi taistelleet ˹keskenään˺ saatuaan selkeät todisteet. Mutta he erosivat – jotkut uskoivat, kun taas toiset eivät uskoneet. Silti, jos Allah olisi tahtonut, he eivät olisi taistelleet toisiaan vastaan. Mutta Allah tekee mitä tahtoo."}},{"verse":254,"commentary_en":"Following the discussion about the different messengers and the divisions among their followers, this verse now speaks directly to the believers. It urges them to give—spend from the wealth that Allah has provided them—before the coming of a specific Day: the Day of Judgment. On that Day, no bargaining, friendship, or intercession will help. Every individual will be entirely focused on their own soul, and emotional or social ties from this world will no longer hold weight. The verse warns that worldly means of influence or support will be meaningless in the Hereafter. Those who reject faith are described as wrongdoers—people who either harm themselves by turning away from truth or harm others by leading them away from Allah’s guidance. This verse builds a bridge from the earlier discussion of prophets and their communities to a direct ethical call for the present-day believers: to act responsibly, give generously, and prepare for the Day when only sincere faith and deeds will matter.","commentary_fi":"Edellisen jakeen käsiteltyä profeettoja ja heidän seuraajiensa välisiä erimielisyyksiä, tämä jae kääntyy suoraan uskovien puoleen. Siinä kehotetaan käyttämään ja lahjoittamaan siitä omaisuudesta, jonka Allah on antanut elatukseksi — ennen kuin saapuu tietty päivä: Tuomiopäivä. Sinä päivänä kaupankäynti, ystävyys tai esirukoukset eivät hyödytä ketään. Jokainen ihminen keskittyy silloin vain omaan sieluunsa, eikä tämän maailman tunne- tai sosiaalisilla siteillä ole enää merkitystä. Jae varoittaa, että tuona päivänä kaikki maalliset vaikutuskeinot menettävät voimansa. Uskon hylkääviä kutsutaan väärintekijöiksi — he joko vahingoittavat itseään torjumalla totuuden tai vahingoittavat muita johdattamalla heidät pois Allahin ohjauksesta. Tämä jae muodostaa sillan aiemman profeettoja koskevan historiallisen kertomuksen ja nykyisten uskovien eettisen vastuun välillä: kehottaen heitä toimimaan vastuullisesti, olemaan anteliaita ja valmistautumaan päivään, jolloin vain vilpitön usko ja teot merkitsevät.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا أَنْفِقُوا مِمَّا رَزَقْنَاكُمْ مِنْ قَبْلِ أَنْ يَأْتِيَ يَوْمٌ لَا بَيْعٌ فِيهِ وَلَا خُلَّةٌ وَلَا شَفَاعَةٌ ۗ وَالْكَافِرُونَ هُمُ الظَّالِمُونَ","commentary":"Edellisen jakeen käsiteltyä profeettoja ja heidän seuraajiensa välisiä erimielisyyksiä, tämä jae kääntyy suoraan uskovien puoleen. Siinä kehotetaan käyttämään ja lahjoittamaan siitä omaisuudesta, jonka Allah on antanut elatukseksi — ennen kuin saapuu tietty päivä: Tuomiopäivä. Sinä päivänä kaupankäynti, ystävyys tai esirukoukset eivät hyödytä ketään. Jokainen ihminen keskittyy silloin vain omaan sieluunsa, eikä tämän maailman tunne- tai sosiaalisilla siteillä ole enää merkitystä. Jae varoittaa, että tuona päivänä kaikki maalliset vaikutuskeinot menettävät voimansa. Uskon hylkääviä kutsutaan väärintekijöiksi — he joko vahingoittavat itseään torjumalla totuuden tai vahingoittavat muita johdattamalla heidät pois Allahin ohjauksesta. Tämä jae muodostaa sillan aiemman profeettoja koskevan historiallisen kertomuksen ja nykyisten uskovien eettisen vastuun välillä: kehottaen heitä toimimaan vastuullisesti, olemaan anteliaita ja valmistautumaan päivään, jolloin vain vilpitön usko ja teot merkitsevät.","translations":{"opas":"Te, jotka uskotte, uhratkaa siitä, mitä olemme teille suonut, ennenkuin tulee päivä, jolloin ei kaupanteko, ystävyys eikä välitys ole mahdollinen. Uskottomat ovat väärintekijöitä.","clear":"Oi uskovat! Lahjoittakaa siitä, mitä olemme teille antaneet ennen sen päivän saapumista, jolloin ei ole kaupankäyntiä, ystävyyttä eikä välitystä. Ne, jotka eivät usko, ovat ˹todellakin˺ väärintekijöitä."}},{"verse":255,"commentary_en":"This powerful verse, known as Ayat al-Kursi (the Verse of the Throne), summarizes key Islamic beliefs about Allah’s nature and attributes. It begins by affirming that only Allah is worthy of worship. He is described as the Ever-Living and the Sustainer of all existence—unaffected by drowsiness or sleep. Everything in the heavens and the earth belongs to Him, highlighting His absolute ownership and control. The verse emphasizes that no one can intercede with Allah without His permission. It affirms His perfect knowledge of all things—past, present, and future—while human knowledge is limited to what He allows. It also mentions that Allah’s Kursi (commonly translated as \"Seat\" or \"Throne\") extends over the heavens and the earth. Early scholars affirmed that the Kursi is a real entity, but its exact nature is beyond human understanding. Since Allah is absolutely unique—as stated in verse 42:11, “There is nothing like Him”—the Kursi must also be understood in a way that reflects this uniqueness. Just as Allah has attributes like knowledge, hearing, and seeing that are unlike those of creation, so too is His Kursi beyond comparison. The verse concludes by stating that sustaining the heavens and the earth does not tire or burden Him. Truly, He is the Most High and the Most Great. This verse presents a profound summary of Allah’s majesty, authority, and transcendence.","commentary_fi":"Tämä vaikuttava jae, tunnettu nimellä Ayat al-Kursi (Valtaistuimen jae), tiivistää keskeisiä islamilaisia uskomuksia Allahin olemuksesta ja ominaisuuksista. Se alkaa vahvistamalla, että vain Allah on palvonnan arvoinen. Häntä kuvataan Ikuisesti Eläväksi ja Kaiken Ylläpitäjäksi – Hän ei tunne väsymystä eikä unta. Kaikki taivaissa ja maan päällä kuuluu Hänelle, mikä korostaa Hänen täydellistä omistajuuttaan ja hallintavaltaansa. Jae painottaa, ettei kukaan voi esittää esirukousta Allahin edessä ilman Hänen lupaansa. Se vahvistaa, että Allahin tieto kattaa kaiken – menneisyyden, nykyisyyden ja tulevaisuuden – kun taas ihmisten tieto on rajallista ja perustuu vain siihen, mitä Allah sallii heidän tietää. Jae mainitsee myös Allahin Kursin (yleisesti käännetään “istuimeksi” tai “valtaistuimeksi”), joka ulottuu taivaisiin ja maahan. Varhaiset oppineet pitivät Kursia todellisena, mutta sen tarkkaa luonnetta ei voida ymmärtää ihmismielellä. Koska Allah on täysin ainutlaatuinen – kuten jakeessa 42:11 sanotaan: “Ei ole mitään Hänen kaltaistaan” – Kursi tulee ymmärtää samassa valossa. Kuten Allahin tieto, näkö ja kuulo eroavat täysin luotujen vastaavista, myös Hänen istuimensa on vertaansa vailla. Jae päättyy toteamukseen, että taivaiden ja maan ylläpito ei rasita Häntä. Totisesti, Hän on Korkein ja Suurin. Tämä jae muodostaa syvällisen yhteenvedon Allahin majesteetista, vallasta ja ylivertaisuudesta.","arabic":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","commentary":"Tämä vaikuttava jae, tunnettu nimellä Ayat al-Kursi (Valtaistuimen jae), tiivistää keskeisiä islamilaisia uskomuksia Allahin olemuksesta ja ominaisuuksista. Se alkaa vahvistamalla, että vain Allah on palvonnan arvoinen. Häntä kuvataan Ikuisesti Eläväksi ja Kaiken Ylläpitäjäksi – Hän ei tunne väsymystä eikä unta. Kaikki taivaissa ja maan päällä kuuluu Hänelle, mikä korostaa Hänen täydellistä omistajuuttaan ja hallintavaltaansa. Jae painottaa, ettei kukaan voi esittää esirukousta Allahin edessä ilman Hänen lupaansa. Se vahvistaa, että Allahin tieto kattaa kaiken – menneisyyden, nykyisyyden ja tulevaisuuden – kun taas ihmisten tieto on rajallista ja perustuu vain siihen, mitä Allah sallii heidän tietää. Jae mainitsee myös Allahin Kursin (yleisesti käännetään “istuimeksi” tai “valtaistuimeksi”), joka ulottuu taivaisiin ja maahan. Varhaiset oppineet pitivät Kursia todellisena, mutta sen tarkkaa luonnetta ei voida ymmärtää ihmismielellä. Koska Allah on täysin ainutlaatuinen – kuten jakeessa 42:11 sanotaan: “Ei ole mitään Hänen kaltaistaan” – Kursi tulee ymmärtää samassa valossa. Kuten Allahin tieto, näkö ja kuulo eroavat täysin luotujen vastaavista, myös Hänen istuimensa on vertaansa vailla. Jae päättyy toteamukseen, että taivaiden ja maan ylläpito ei rasita Häntä. Totisesti, Hän on Korkein ja Suurin. Tämä jae muodostaa syvällisen yhteenvedon Allahin majesteetista, vallasta ja ylivertaisuudesta.","translations":{"opas":"Ei ole muuta jumalaa kuin Jumala, elävä, iankaikkinen. Häntä ei saa valtaansa uneliaisuus eikä uni; Hänelle kuuluu kaikki, mikä on taivaassa ja maan päällä. Kuka on se, joka astuisi välittäjäksi Hänen edessään Hänen sallimattaan? Hän tietää, mitä heille on vastedes tuleva ja mitä heillä on ollut menneisyydessä, mutta Hänen viisaudestaan he eivät käsitä muuta kuin minkä Hän tahtoo. Hänen valtaistuimensa käsittää taivaat ja maan, eikä niiden voimassapysyttäminen ole Hänelle taakka; niin, Hän on ylhäinen, valtava.","clear":"Allah! Ei ole muuta jumalaa ˹palvonnan arvoista˺ kuin Hän, Ikuisesti Elävä, Kaikkivoipa. Ei torkahdus eikä uni häntä valtaa. Hänelle kuuluu kaikki, mitä on taivaissa ja mitä on maan päällä. Kuka voisi mahdollisesti välittää Hänelle ilman Hänen lupaansa? Hän ˹täysin˺ tietää, mikä on heidän edessään ja mikä on heidän takanaan, mutta kukaan ei voi käsittää Hänen tietoaan – paitsi mitä Hän tahtoo ˹ilmoittaa˺. Hänen valtaistuimensa kattaa taivaat ja maan, eikä kummankaan säilyttäminen väsytä Häntä. Sillä Hän on Korkein, Suurin."}},{"verse":256,"commentary_en":"Building upon the absolute and unique nature of Allah described in the previous verse, this verse establishes a fundamental principle: there is to be no compulsion in matters of religion. This is because the truth of belief in Allah is made distinct and clear from error. Accepting faith is a matter of personal conviction, addressing the human mind, emotions, and inherent nature. True faith involves rejecting \"taghut\" (a term referring to anything that exceeds its bounds and seeks to dominate, including tyranny or false deities) and believing solely in Allah. The verse uses the image of grasping a \"most trustworthy hand-hold\" that never breaks to describe the security and certainty gained by someone who rejects falsehood and believes in Allah. It concludes by reaffirming that Allah hears everything and knows all things, both outwardly expressed and hidden within people's hearts.","commentary_fi":"Rakentaen edellisessä jakeessa kuvatun Allahin ehdottoman ja ainutlaatuisen olemuksen varaan, tämä jae vahvistaa perustavanlaisen periaatteen: uskossa ei saa olla pakkoa. Tämä johtuu siitä, että usko Allahiin on tehty selvästi erottuvaksi harhasta. Uskon hyväksyminen on henkilökohtaisen vakaumuksen asia, joka puhuttelee ihmisen järkeä, tunteita ja synnynnäistä luontoa. Todellinen usko edellyttää tāghūtin – eli kaiken sen, mikä ylittää rajansa ja pyrkii hallitsemaan (kuten tyrannia tai väärät jumalat) – hylkäämistä ja uskomista yksin Allahiin. Jaessa käytetään kuvaa \"lujimmasta otteesta\", joka ei koskaan katkea. Tämä kuvaa sitä varmuutta ja turvaa, jonka saa se, joka torjuu valheen ja uskoo Allahiin. Jaen lopussa vahvistetaan, että Allah kuulee kaiken ja tietää kaiken, niin ulospäin ilmaistun kuin sydämiin kätkeytyvänkin.","arabic":"لَا إِكْرَاهَ فِي الدِّينِ ۖ قَدْ تَبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ۚ فَمَنْ يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِنْ بِاللَّهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ لَا انْفِصَامَ لَهَا ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ","commentary":"Rakentaen edellisessä jakeessa kuvatun Allahin ehdottoman ja ainutlaatuisen olemuksen varaan, tämä jae vahvistaa perustavanlaisen periaatteen: uskossa ei saa olla pakkoa. Tämä johtuu siitä, että usko Allahiin on tehty selvästi erottuvaksi harhasta. Uskon hyväksyminen on henkilökohtaisen vakaumuksen asia, joka puhuttelee ihmisen järkeä, tunteita ja synnynnäistä luontoa. Todellinen usko edellyttää tāghūtin – eli kaiken sen, mikä ylittää rajansa ja pyrkii hallitsemaan (kuten tyrannia tai väärät jumalat) – hylkäämistä ja uskomista yksin Allahiin. Jaessa käytetään kuvaa \"lujimmasta otteesta\", joka ei koskaan katkea. Tämä kuvaa sitä varmuutta ja turvaa, jonka saa se, joka torjuu valheen ja uskoo Allahiin. Jaen lopussa vahvistetaan, että Allah kuulee kaiken ja tietää kaiken, niin ulospäin ilmaistun kuin sydämiin kätkeytyvänkin.","translations":{"opas":"Uskonnossa ei ole mitään pakkoa, oikea tie on selvästi erotettu harhateistä, ja se, joka hylkää saatanan ja uskoo Jumalaan, hän pitää kiinni mitä lujimmasta kädensijasta, joka ei murru. Jumalahan on kuuleva, tietävä.","clear":"Uskonnossa ei saa olla pakkoa, sillä totuus erottuu selvästi valheesta. Joten jokainen, joka luopuu vääristä jumalista ja uskoo Allahiin, on varmasti tarttunut lujimpaan, pettämättömään otteeseen. Ja Allah on Kaikkikuuleva, Kaikkitietävä."}},{"verse":257,"commentary_en":"Following the declaration of “no compulsion in religion” and the clear distinction between truth and error, this verse vividly illustrates the contrasting outcomes of belief and disbelief. It explains that Allah is the protector and guide of those who believe. He brings them out of various forms of darkness—such as ignorance, confusion, and misguidance—into the singular light of faith in Him and adherence to His guidance. In contrast, those who reject faith are supported by false powers (ṭāghūt), a term referring to anything that oversteps its bounds—such as tyrants, false deities, or misleading ideologies. These influences draw them away from the light of innate understanding and divine clarity into multiple layers of darkness. These darknesses may include selfish desires, spiritual deviation, oppression, or blind submission, ultimately leading to loss in the afterlife. The verse powerfully uses the singular word “light” (nūr) to represent the unified and consistent truth of faith, and the plural “darknesses” (ẓulumāt) to express the many divergent paths of falsehood and misguidance.","commentary_fi":"atkaen julistusta “ei pakkoa uskossa” ja selkeää eroa totuuden ja harhan välillä, tämä jae kuvaa elävästi uskon ja epäuskon vastakkaiset seuraukset. Se kertoo, että Allah on uskovien suojelija ja opas. Hän vie heidät pois erilaisista pimeyden muodoista—kuten tietämättömyydestä, hämmennyksestä ja harhasta—kohti uskon valoa, joka merkitsee uskoa Häneen ja sitoutumista Hänen johdatukseensa. Sen sijaan ne, jotka hylkäävät uskon, ovat väärien voimien (ṭāghūt) vaikutuspiirissä. Tämä termi viittaa mihin tahansa, mikä ylittää rajansa—esimerkiksi tyranneihin, epäjumaliin tai harhaanjohtaviin aatteisiin. Ne vievät ihmisen pois luonnollisesta ymmärryksestä ja jumalallisesta selkeydestä, moninkertaiseen pimeyteen. Tämä pimeys voi tarkoittaa halujen orjuutta, hengellistä eksymistä, sortoa tai sokeaa alamaisuutta—ja johtaa lopulta kadotukseen. Jaessa käytetään yksikkömuotoa “valo” (nūr) korostamaan uskon yhtenäistä totuutta, ja monikkomuotoa “pimeydet” (ẓulumāt) kuvaamaan harhan ja eksytyksen moninaisuutta.","arabic":"اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا يُخْرِجُهُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ ۖ وَالَّذِينَ كَفَرُوا أَوْلِيَاؤُهُمُ الطَّاغُوتُ يُخْرِجُونَهُمْ مِنَ النُّورِ إِلَى الظُّلُمَاتِ ۗ أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ","commentary":"atkaen julistusta “ei pakkoa uskossa” ja selkeää eroa totuuden ja harhan välillä, tämä jae kuvaa elävästi uskon ja epäuskon vastakkaiset seuraukset. Se kertoo, että Allah on uskovien suojelija ja opas. Hän vie heidät pois erilaisista pimeyden muodoista—kuten tietämättömyydestä, hämmennyksestä ja harhasta—kohti uskon valoa, joka merkitsee uskoa Häneen ja sitoutumista Hänen johdatukseensa. Sen sijaan ne, jotka hylkäävät uskon, ovat väärien voimien (ṭāghūt) vaikutuspiirissä. Tämä termi viittaa mihin tahansa, mikä ylittää rajansa—esimerkiksi tyranneihin, epäjumaliin tai harhaanjohtaviin aatteisiin. Ne vievät ihmisen pois luonnollisesta ymmärryksestä ja jumalallisesta selkeydestä, moninkertaiseen pimeyteen. Tämä pimeys voi tarkoittaa halujen orjuutta, hengellistä eksymistä, sortoa tai sokeaa alamaisuutta—ja johtaa lopulta kadotukseen. Jaessa käytetään yksikkömuotoa “valo” (nūr) korostamaan uskon yhtenäistä totuutta, ja monikkomuotoa “pimeydet” (ẓulumāt) kuvaamaan harhan ja eksytyksen moninaisuutta.","translations":{"opas":"Jumala on niiden suojelija, jotka uskovat; Hän johtaa heidät pimeydestä valoon. Mutta uskottomien suojelijoita ovat pahat henget; he vetävät heidät valosta pimeyteen. Heistä tulee Tulen asukkaita ja he pysyvät siinä iankaikkisesti.","clear":"Allah on uskovaisten suojelija – Hän johdattaa heidät pimeydestä valoon. Epäuskoisten suojelijat taas ovat valejumalat, jotka johtavat heidät valosta pimeyteen. He ovat tulen asukkaita. He tulevat olemaan siellä ikuisesti."}},{"verse":258,"commentary_en":"This verse recounts a debate between Prophet Abraham and a king who arrogantly argued with him about the existence and authority of Allah. Though the king had been granted worldly power by Allah, he used it to challenge divine authority. When Abraham said, “My Lord is the one who gives life and causes death,” the king claimed he could do the same—likely referring to his ability to pardon or execute people. To refute this superficial claim, Abraham posed a deeper challenge: “Indeed, Allah causes the sun to rise from the east—so bring it up from the west.” This exposed the king’s limitations. His authority extended only over people, not over the laws of nature or creation. Confronted with this irrefutable logic, the disbeliever was silenced. The verse concludes by affirming that Allah does not guide the unjust, particularly those who reject truth out of pride or stubbornness. This story underscores a central message: true power and sovereignty belong only to Allah, and those in positions of power must acknowledge and submit to Him. It continues the theme of divine authority that runs through the preceding verses.","commentary_fi":"Tässä jakeessa kerrotaan keskustelusta profeetta Aabrahamin ja kuninkaan välillä, joka ylimielisesti kiisteli hänen kanssaan Allahista. Vaikka Allah oli antanut kuninkaalle valtaa, tämä käytti sitä kyseenalaistaakseen Jumalan auktoriteetin. Kun Aabraham sanoi: \"Herrani antaa elämän ja aiheuttaa kuoleman\", kuningas väitti voivansa tehdä samoin—viitaten todennäköisesti kykyyn armahtaa tai teloittaa ihmisiä. Aabraham esitti kuitenkin toisen haasteen, joka perustui luonnon universaaliin ilmiöön: \"Allah saa auringon nousemaan idästä—tuo se sinä nousemaan lännestä.\" Tämä paljasti kuninkaan rajoitukset. Hänen valtansa ulottui vain ihmisiin, ei luomakunnan lakeihin. Tämän kiistämättömän todisteen edessä epäuskoinen jäi sanattomaksi. Jaes päättyy toteamukseen, että Allah ei johdata väärintekijöitä, erityisesti niitä, jotka torjuvat totuuden ylpeyden tai itsepäisyyden vuoksi. Tarina korostaa keskeistä sanomaa: todellinen valta kuuluu vain Allahille, ja vallan saaneiden tulisi tunnustaa ja alistua Hänen ylivallalleen.","arabic":"أَلَمْ تَرَ إِلَى الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ إِذْ قَالَ إِبْرَاهِيمُ رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ قَالَ أَنَا أُحْيِي وَأُمِيتُ ۖ قَالَ إِبْرَاهِيمُ فَإِنَّ اللَّهَ يَأْتِي بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ فَبُهِتَ الَّذِي كَفَرَ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ","commentary":"Tässä jakeessa kerrotaan keskustelusta profeetta Aabrahamin ja kuninkaan välillä, joka ylimielisesti kiisteli hänen kanssaan Allahista. Vaikka Allah oli antanut kuninkaalle valtaa, tämä käytti sitä kyseenalaistaakseen Jumalan auktoriteetin. Kun Aabraham sanoi: \"Herrani antaa elämän ja aiheuttaa kuoleman\", kuningas väitti voivansa tehdä samoin—viitaten todennäköisesti kykyyn armahtaa tai teloittaa ihmisiä. Aabraham esitti kuitenkin toisen haasteen, joka perustui luonnon universaaliin ilmiöön: \"Allah saa auringon nousemaan idästä—tuo se sinä nousemaan lännestä.\" Tämä paljasti kuninkaan rajoitukset. Hänen valtansa ulottui vain ihmisiin, ei luomakunnan lakeihin. Tämän kiistämättömän todisteen edessä epäuskoinen jäi sanattomaksi. Jaes päättyy toteamukseen, että Allah ei johdata väärintekijöitä, erityisesti niitä, jotka torjuvat totuuden ylpeyden tai itsepäisyyden vuoksi. Tarina korostaa keskeistä sanomaa: todellinen valta kuuluu vain Allahille, ja vallan saaneiden tulisi tunnustaa ja alistua Hänen ylivallalleen.","translations":{"opas":"Muista hänet, joka kiisteli Aabrahamin kanssa hänen Herrastaan siksi, että Jumala oli antanut hänelle kuningaskunnan. Aabraham sanoi: »Herrani antaa elämän ja kuoleman.» Hän vastasi: »Minäkin annan elämän ja kuoleman.» Silloin Aabraham sanoi: »Katso, Jumala antaa auringon nousta idästä; anna sinä sen nousta lännestä!» ja jumalaton jäi sanattomaksi. Niin, Hän ei johda jumalattomia ihmisiä.","clear":"Etkö sinä ˹oi profeetta˺ tiedä siitä, joka kiisteli Abrahamin kanssa hänen Herrastaan, koska Allah oli antanut hänelle kuninkuuden? ˹Muista˺, kun Abraham sanoi: ”Herrani on se, jolla on voima antaa elämä ja aiheuttaa kuolema.” Hän väitti: ”Minullakin on voima antaa elämä ja aiheuttaa kuolema.” Abraham haastoi ˹hänet˺: ”Allah saa auringon nousemaan idästä. Saa se nousemaan lännestä.” Silloin epäuskoinen hämmästyi. Allah ei johdata väärintekijöitä."}},{"verse":259,"commentary_en":"Continuing the theme of Allah’s power over life and death, this verse presents another vivid example. It tells of a man who passed by a desolate, ruined town and wondered how Allah could ever bring it back to life after such devastation. In response, Allah caused the man to die for a hundred years and then revived him, as a demonstration of divine power. Upon being resurrected, the man was asked how long he thought he had remained in that state. He answered that it felt like a day or part of a day. Allah informed him that he had, in fact, been dead for a hundred years and provided signs to make this clear: his food and drink remained untouched by time, while his donkey had decayed to bones. This miraculous contrast—where time was suspended for some things and accelerated for others—showed that Allah alone governs time. He can preserve or decay as He wills, unaffected by natural laws. Time itself is a creation subject to His command. Then, Allah visibly reassembled the donkey’s bones, clothed them with flesh, and brought it back to life before the man’s eyes. Witnessing this, the man exclaimed, “Now I know that Allah has power over all things.”  This narrative reinforces the concept of Allah's absolute power over creation, including bringing the dead back to life, following the discussion in the previous verse.","commentary_fi":"Jatkaen edellisen jakeen teemaa elämän ja kuoleman ylivallasta, tässä jakeessa esitellään toinen voimakas esimerkki. Siinä kerrotaan miehestä, joka kulki autioituneen, täysin tuhoutuneen kylän ohi ja ihmetteli, kuinka Allah voisi koskaan herättää sen eloon tällaisen hävityksen jälkeen. Vastauksena Allah aiheutti miehen kuoleman sadaksi vuodeksi ja herätti hänet sitten uudelleen eloon, osoittaakseen voimansa. Kun mies herätettiin, häneltä kysyttiin, kuinka kauan hän luuli olleensa poissa. Hän vastasi, että vain päivän tai osan päivästä. Allah ilmoitti hänelle, että hän oli ollut kuolleena sata vuotta ja antoi siitä todisteet: hänen ruokansa ja juomansa olivat säilyneet pilaantumattomina, mutta hänen aasinsa oli hajonnut luurangoksi. Tämä ihmeellinen vastakohta – missä aika oli pysähtynyt joillekin asioille ja kulunut toisille – osoitti, että vain Allah hallitsee aikaa. Hän voi säilyttää tai hajottaa tahtonsa mukaan, ilman luonnonlakien rajoituksia. Aikakin on Allahin luomus ja Hänen käskyjensä alainen. Sitten Allah koottu aasin luut, peitti ne lihalla ja herätti sen henkiin miehen silmien edessä. Tämän nähdessään mies totesi: “Nyt tiedän, että Allahilla on valta kaikkeen.” Tämä kertomus vahvistaa käsitystä Allahin ehdottomasta vallasta luomakunnan yli, mukaan lukien kuolleiden herättämisen henkiin, seuraten edellisen jakeen keskustelua.","arabic":"أَوْ كَالَّذِي مَرَّ عَلَىٰ قَرْيَةٍ وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْيِي هَٰذِهِ اللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ اللَّهُ مِائَةَ عَامٍ ثُمَّ بَعَثَهُ ۖ قَالَ كَمْ لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍ ۖ قَالَ بَلْ لَبِثْتَ مِائَةَ عَامٍ فَانْظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَانْظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ آيَةً لِلنَّاسِ ۖ وَانْظُرْ إِلَى الْعِظَامِ كَيْفَ نُنْشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًا ۚ فَلَمَّا تَبَيَّنَ لَهُ قَالَ أَعْلَمُ أَنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","commentary":"Jatkaen edellisen jakeen teemaa elämän ja kuoleman ylivallasta, tässä jakeessa esitellään toinen voimakas esimerkki. Siinä kerrotaan miehestä, joka kulki autioituneen, täysin tuhoutuneen kylän ohi ja ihmetteli, kuinka Allah voisi koskaan herättää sen eloon tällaisen hävityksen jälkeen. Vastauksena Allah aiheutti miehen kuoleman sadaksi vuodeksi ja herätti hänet sitten uudelleen eloon, osoittaakseen voimansa. Kun mies herätettiin, häneltä kysyttiin, kuinka kauan hän luuli olleensa poissa. Hän vastasi, että vain päivän tai osan päivästä. Allah ilmoitti hänelle, että hän oli ollut kuolleena sata vuotta ja antoi siitä todisteet: hänen ruokansa ja juomansa olivat säilyneet pilaantumattomina, mutta hänen aasinsa oli hajonnut luurangoksi. Tämä ihmeellinen vastakohta – missä aika oli pysähtynyt joillekin asioille ja kulunut toisille – osoitti, että vain Allah hallitsee aikaa. Hän voi säilyttää tai hajottaa tahtonsa mukaan, ilman luonnonlakien rajoituksia. Aikakin on Allahin luomus ja Hänen käskyjensä alainen. Sitten Allah koottu aasin luut, peitti ne lihalla ja herätti sen henkiin miehen silmien edessä. Tämän nähdessään mies totesi: “Nyt tiedän, että Allahilla on valta kaikkeen.” Tämä kertomus vahvistaa käsitystä Allahin ehdottomasta vallasta luomakunnan yli, mukaan lukien kuolleiden herättämisen henkiin, seuraten edellisen jakeen keskustelua.","translations":{"opas":"Tai muistele ihmistä, joka kulki erään raunioiksi sortuneen kaupungin ohi. Hän sanoi: »Kuinka voi Jumala antaa elämän tälle paikalle sen perikadon jälkeen?» Mutta Jumala antoi hänen kuolla sadaksi vuodeksi ja herätti hänet sitten eloon ja sanoi: »Kuinka kauan olet viipynyt täällä?» Hän vastasi: »Olen ehkä viipynyt päivän tai osan päivästä.» Silloin sanoi Jumala: »Ei, olet viipynyt sata vuotta; katso ruokaasi ja juomaasi. Se ei ole pilaantunut, ja katso aasiasi. Tämä on tapahtunut, jotta Me tekisimme sinut tunnusmerkiksi ihmisille. Katso, kuinka Me kokoamme luut ja sitten peitämme ne lihalla.» ja kun tämä selvisi hänelle, sanoi hän: »Minä tiedän, että Jumala on kaikkivaltias.»","clear":"Tai ˹etkö sinä tiedä˺ siitä, joka kulki raunioina olevan kaupungin ohi. Hän ihmetteli: ”Kuinka Allah voisi herättää tämän takaisin eloon tuhonsa jälkeen?” Niinpä Allah antoi hänen kuolla sadaksi vuodeksi ja herätti hänet sitten takaisin eloon. Allah kysyi: ”Kuinka kauan olet ollut ˹tässä tilassa˺?” Hän vastasi: ”Ehkä päivän tai osan päivää.” Allah sanoi: ”Ei! Olet ollut täällä sata vuotta! Katso vain ruokaasi ja juomaasi – ne eivät ole pilaantuneet. ˹Mutta nyt˺ katso ˹aasin˺ jäännöksiä! Ja ˹niinpä˺ Me teimme sinusta merkin ihmiskunnalle. Ja katso aasin luita, kuinka me kokoamme ne yhteen ja verhoamme ne sitten lihalla!” Kun tämä oli tehty hänelle selväksi, hän julisti: ”˹Nyt˺ tiedän, että Allah on kaikkivoipa kaikessa.”"}},{"verse":260,"commentary_en":"This verse returns to Prophet Abraham, who asks Allah to show him how He brings the dead back to life. Allah asks him if he lacks faith, to which Prophet Abraham responds that his faith is strong, but he wishes for this experience to bring greater reassurance and inner peace—something attained through direct, personal observation. In other words, he sought to witness the process of resurrection with his own eyes. In response, Allah instructs Prophet Abraham to take four birds, make sure he is familiar with them, then cut them into pieces and scatter parts of their bodies on different mountain tops. He was then instructed to call the birds back to him. The verse states that they came swiftly to him, fully alive again. This was a direct, visible demonstration of Allah's power to resurrect the dead, showing that He can reassemble and give life to fragmented remains across distances. The verse concludes by reminding us to know that Allah is \"Almighty\" (possessing ultimate power) and \"Wise\" (acting with perfect knowledge and purpose). Like the previous verse, this story serves as another powerful illustration of Allah's absolute power over life and death, confirming that resurrection is entirely within His capability, as He is the source of all creation and life.","commentary_fi":"Tämä jae palaa profeetta Abrahamin kertomukseen, jossa hän pyytää Allahia näyttämään, kuinka Hän herättää kuolleet henkiin. Allah kysyy, puuttuuko häneltä usko, mihin Abraham vastaa, että hänen uskonsa on vahva, mutta hän toivoo tämän kokemuksen tuovan lisää varmuutta ja sisäistä rauhaa – tunnetta, joka saavutetaan suoralla henkilökohtaisella havainnoinnilla. Toisin sanoen hän halusi itse nähdä, miten ylösnousemus tapahtuu.","arabic":"وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ أَرِنِي كَيْفَ تُحْيِي الْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِنْ ۖ قَالَ بَلَىٰ وَلَٰكِنْ لِيَطْمَئِنَّ قَلْبِي ۖ قَالَ فَخُذْ أَرْبَعَةً مِنَ الطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ اجْعَلْ عَلَىٰ كُلِّ جَبَلٍ مِنْهُنَّ جُزْءًا ثُمَّ ادْعُهُنَّ يَأْتِينَكَ سَعْيًا ۚ وَاعْلَمْ أَنَّ اللَّهَ عَزِيزٌ حَكِيمٌ","commentary":"Tämä jae palaa profeetta Abrahamin kertomukseen, jossa hän pyytää Allahia näyttämään, kuinka Hän herättää kuolleet henkiin. Allah kysyy, puuttuuko häneltä usko, mihin Abraham vastaa, että hänen uskonsa on vahva, mutta hän toivoo tämän kokemuksen tuovan lisää varmuutta ja sisäistä rauhaa – tunnetta, joka saavutetaan suoralla henkilökohtaisella havainnoinnilla. Toisin sanoen hän halusi itse nähdä, miten ylösnousemus tapahtuu.","translations":{"opas":"Entä kun Aabraham sanoi: »Herra, näytä minulle, kuinka teet kuolleet eläviksi!» Hän kysyi: »Etkö sinä sitten usko siihen?» Hän vastasi: »Kyllä, mutta jotta sydämeni rauhoittuisi.» Silloin Hän sanoi: »Ota neljä lintua ja leikkaa ne palasiksi, aseta sitten kappale niistä joka vuorelle ja kutsu sitten niitä, niin ne kiiruhtavat luoksesi nopeasti; ja tiedä, että Jumala on mahtava, viisas!»","clear":"Ja muista, kun Abraham sanoi: ”Herrani! Näytä minulle, kuinka annat elämän kuolleille.” Jumala vastasi: ”Etkö usko?” Abraham vastasi: ”Kyllä uskon, mutta vain jotta sydämeni voisi olla vakuuttunut.” Jumala sanoi: ”Ota sitten neljä lintua, kouluta ne tulemaan luoksesi, ˹leikkaa ne sitten palasiksi˺ ja hajota ne eri kukkuloille. Kutsu ne sitten takaisin, ne lentävät luoksesi kiireellä. Ja ˹niin tiedät,˺ että Jumala on Kaikkivaltias, Kaikkitietävä.”"}},{"verse":261,"commentary_en":"This verse begins by offering a beautiful comparison for those who spend their wealth for the sake of Allah. It is like a single grain of corn that grows into seven ears, with each ear bearing a hundred grains. This vivid image illustrates the abundant, multiplying growth and life that results from sincere charity. It emphasizes that Allah can increase this reward many times over for whomever He wills. We understand from this that Allah's bounty is vast and unlimited. The verse concludes by affirming that Allah is All-Bountiful and knows all things, including people's intentions when they give.","commentary_fi":"Tämä jae alkaa kauniilla vertauksella niistä, jotka käyttävät varallisuuttaan Allahin tähden. Se on kuin yksi maissin jyvä, josta kasvaa seitsemän tähkää, ja jokaisessa tähkässä on sata jyvää. Tämä elävä kuva havainnollistaa runsasta ja moninkertaistuvaa kasvua ja elämää, joka syntyy vilpittömästä hyväntekeväisyydestä. Jaek korostaa, että Allah voi moninkertaistaa palkkion kenelle Hän tahtoo. Tästä ymmärrämme, että Allahin anteliaisuus on valtava ja rajaton. Jaek päättyy vakuuttamalla, että Allah on Kaikkiantava ja tietää kaiken – myös ihmisten aikomukset heidän antaessaan.","arabic":"مَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنْبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنْبُلَةٍ مِائَةُ حَبَّةٍ ۗ وَاللَّهُ يُضَاعِفُ لِمَنْ يَشَاءُ ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ","commentary":"Tämä jae alkaa kauniilla vertauksella niistä, jotka käyttävät varallisuuttaan Allahin tähden. Se on kuin yksi maissin jyvä, josta kasvaa seitsemän tähkää, ja jokaisessa tähkässä on sata jyvää. Tämä elävä kuva havainnollistaa runsasta ja moninkertaistuvaa kasvua ja elämää, joka syntyy vilpittömästä hyväntekeväisyydestä. Jaek korostaa, että Allah voi moninkertaistaa palkkion kenelle Hän tahtoo. Tästä ymmärrämme, että Allahin anteliaisuus on valtava ja rajaton. Jaek päättyy vakuuttamalla, että Allah on Kaikkiantava ja tietää kaiken – myös ihmisten aikomukset heidän antaessaan.","translations":{"opas":"Niitten laita, jotka uhraavat omaisuutensa Jumalan asian hyväksi, on sama kuin viljanjyvän, joka kasvattaa seitsemän tähkää ja jokaiseen tähkään sata jyvää, sillä Jumala antaa kenelle tahtoo kaksinkertaisesti; niin, Jumala sulkee itseensä kaiken ja tietää kaikki.","clear":"Niiden vertauskuva, jotka käyttävät omaisuuttaan Jumalan asian hyväksi, on kuin jyvä, joka versoo seitsemän tähkää, joista jokaisessa on sata jyvää. Ja Jumala moninkertaistaa ˹palkkion vielä enemmänkin˺ kenelle tahtoo. Sillä Jumala on Kaikkiaantava, Kaikkitietävä."}},{"verse":262,"commentary_en":"Following the previous verse's powerful image of multiplied reward, this verse explains who receives this generous increase. It specifies that the reward is for those who spend for Allah's cause and, crucially, do not spoil their act of giving by reminding the recipient of their generosity or by causing them harm. This highlights a key principle of faith: the giver should forget their act of giving and avoid displaying it, even to close family members—especially children who may not fully understand the spiritual purpose behind charity. For example, a child who sees their parent giving something to a neighbor might later tease the neighbor’s child or boast about the family’s generosity in a way that humiliates others. The reward for such sincere and discreet giving is assured with Allah. Furthermore, those who give in this respectful manner are promised freedom from fear and grief. This connects to the previous verse by clarifying the conditions under which the potential for manifold increase is fully realized.","commentary_fi":"Edellisen jakeen voimakkaan esimerkin jälkeen moninkertaisesta palkkiosta tämä jae selittää, kenelle tämä antelias palkkio kuuluu. Se täsmentää, että palkkio on niille, jotka käyttävät varallisuuttaan Allahin vuoksi, mutta eivät pilaa lahjaansa muistuttamalla saajaa anteliaisuudestaan tai aiheuttamalla hänelle haittaa. Tämä korostaa uskon hienovaraisuutta: antajan tulisi unohtaa tekonsa eikä tuoda sitä esiin edes perheenjäsenille – erityisesti lapsille, jotka eivät ehkä ymmärrä lahjoittamisen hengellistä tarkoitusta. Esimerkiksi lapsi, joka näkee vanhemman antavan jotain naapurille, saattaa myöhemmin kiusata naapurin lasta tai kerskua perheensä anteliaisuudella tavalla, joka loukkaa muita. Tällaisesta vilpittömästä ja hienotunteisesta antamisesta palkkio on taattu Allahin luona. Lisäksi tällaiset antajat vapautetaan pelosta ja surusta. Tämä jae liittyy edelliseen selittämällä, millä ehdoilla moninkertainen palkkio toteutuu.","arabic":"الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ ثُمَّ لَا يُتْبِعُونَ مَا أَنْفَقُوا مَنًّا وَلَا أَذًى ۙ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","commentary":"Edellisen jakeen voimakkaan esimerkin jälkeen moninkertaisesta palkkiosta tämä jae selittää, kenelle tämä antelias palkkio kuuluu. Se täsmentää, että palkkio on niille, jotka käyttävät varallisuuttaan Allahin vuoksi, mutta eivät pilaa lahjaansa muistuttamalla saajaa anteliaisuudestaan tai aiheuttamalla hänelle haittaa. Tämä korostaa uskon hienovaraisuutta: antajan tulisi unohtaa tekonsa eikä tuoda sitä esiin edes perheenjäsenille – erityisesti lapsille, jotka eivät ehkä ymmärrä lahjoittamisen hengellistä tarkoitusta. Esimerkiksi lapsi, joka näkee vanhemman antavan jotain naapurille, saattaa myöhemmin kiusata naapurin lasta tai kerskua perheensä anteliaisuudella tavalla, joka loukkaa muita. Tällaisesta vilpittömästä ja hienotunteisesta antamisesta palkkio on taattu Allahin luona. Lisäksi tällaiset antajat vapautetaan pelosta ja surusta. Tämä jae liittyy edelliseen selittämällä, millä ehdoilla moninkertainen palkkio toteutuu.","translations":{"opas":"Ne, jotka uhraavat omaisuutensa Jumalan asialle eivätkä jälkeenpäin kadu eivätkä moiti lahjoitustaan, saavat palkkansa Herraltaan: ei heitä mikään pelko vaivaa, eikä heidän tarvitse murehtia.","clear":"Ne, jotka käyttävät omaisuuttaan Jumalan asian hyväksi eivätkä seuraa hyväntekeväisyyttään muistutuksilla anteliaisuudestaan tai loukkaavilla sanoilla – he saavat palkintonsa Herraltaan, eikä heille tule pelkoa, eivätkä he murehdi."}},{"verse":263,"commentary_en":"Building upon the theme of the previous verse, which warned against harming the recipient of charity, this verse emphasizes the importance of good manners and compassion. It states that speaking kind words and forgiving others is better in Allah's sight than giving charity that is followed by hurtful behavior. Kind speech here includes turning down a beggar in a gentle manner, without making them feel ashamed or blamed for asking. If the beggar responds harshly, as people in deep need sometimes do, one should be patient and forgiving. Why? Because a needy person may see that you are well-off and hope for help, and in desperation, they may speak bluntly or even rudely. In such cases, believers are urged to respond with tolerance and mercy. This verse highlights that the manner in which charity is given—and one’s overall conduct—matters greatly. It concludes by reminding us that Allah is free of all needs and is Most Forbearing, setting a divine example of patience and generosity for believers to follow.","commentary_fi":"Jatkaen edellisen jakeen teemaa, joka varoitti aiheuttamasta vahinkoa almuja saadulle, tämä jae korostaa hyvien tapojen ja myötätunnon merkitystä. Se toteaa, että ystävälliset sanat ja toisten virheiden anteeksianto ovat Allahin silmissä parempia kuin almujen antaminen, jota seuraa loukkaava käytös. Ystävällinen puhe tarkoittaa esimerkiksi sitä, että torjut kerjäläisen lempeästi, ilman että nolaat häntä tai moitit hänen pyyntöään. Jos kerjäläinen vastaa tylysti – kuten puutteessa oleva joskus tekee – tulee olla kärsivällinen ja anteeksiantava. Miksi? Koska ihminen, joka näkee että sinulla on varaa auttaa, saattaa toivoa saavansa apua ja turhautuneena puhua suoraan tai jopa töykeästi. Tällaisessa tilanteessa uskovaa kehotetaan suhtautumaan suvaitsevasti ja armollisesti. Jakeen lopussa muistutetaan, että Allah on täysin riippumaton eikä tarvitse mitään, ja että Hän on Äärimmäisen Kärsivällinen. Tämä toimii esimerkkinä uskoville siitä, kuinka toimia lempeydellä ja kärsivällisyydellä – erityisesti niitä kohtaan, jotka elävät puutteessa.","arabic":"قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى ۗ وَاللَّهُ غَنِيٌّ حَلِيمٌ","commentary":"Jatkaen edellisen jakeen teemaa, joka varoitti aiheuttamasta vahinkoa almuja saadulle, tämä jae korostaa hyvien tapojen ja myötätunnon merkitystä. Se toteaa, että ystävälliset sanat ja toisten virheiden anteeksianto ovat Allahin silmissä parempia kuin almujen antaminen, jota seuraa loukkaava käytös. Ystävällinen puhe tarkoittaa esimerkiksi sitä, että torjut kerjäläisen lempeästi, ilman että nolaat häntä tai moitit hänen pyyntöään. Jos kerjäläinen vastaa tylysti – kuten puutteessa oleva joskus tekee – tulee olla kärsivällinen ja anteeksiantava. Miksi? Koska ihminen, joka näkee että sinulla on varaa auttaa, saattaa toivoa saavansa apua ja turhautuneena puhua suoraan tai jopa töykeästi. Tällaisessa tilanteessa uskovaa kehotetaan suhtautumaan suvaitsevasti ja armollisesti. Jakeen lopussa muistutetaan, että Allah on täysin riippumaton eikä tarvitse mitään, ja että Hän on Äärimmäisen Kärsivällinen. Tämä toimii esimerkkinä uskoville siitä, kuinka toimia lempeydellä ja kärsivällisyydellä – erityisesti niitä kohtaan, jotka elävät puutteessa.","translations":{"opas":"Sovinnollinen puhe ja anteeksianto on parempi kuin almu, jota seuraa solvaus; niin, Jumala on ylenpalttisen rikas ja lempeä.","clear":"Ystävälliset sanat ja anteeksianto ovat parempia kuin hyväntekeväisyys, jota seuraa loukkaus. Ja Jumala on Omavarainen, Erittäin Kärsivällinen."}},{"verse":264,"commentary_en":"This verse directly addresses the believers, warning them not to nullify the reward of their charity by boasting about it or causing harm—echoing the theme of the previous verses (262 and 263). It offers a stark comparison: those who spend their wealth not for Allah’s sake, but merely to be seen and praised by others, while lacking true faith in Allah and the Last Day. Such people are likened to a hard, smooth rock covered with a thin layer of soil. When heavy rain falls, the soil is washed away, leaving the bare rock behind—barren and unable to support growth. Similarly, their actions, though they may appear generous outwardly, are devoid of sincere faith and thus leave no lasting spiritual reward. Allah makes their deeds as worthless as dust blown by the wind. This powerful image illustrates that good deeds without sincere intention and faith are hollow. Allah does not guide those who deny belief, nor does He grant reward to actions done for show.","commentary_fi":"Tämä jae osoittaa suoraan uskoville varoituksen: älkää mitätöikö almujenne palkkiota kerskumalla tai aiheuttamalla vahinkoa vastaanottajalle – jatkaen edellisten jakeiden (262 ja 263) teemaa. Jaessa esitetään vahva vertaus: ne, jotka käyttävät varallisuuttaan ei Allahin tähden, vaan vain saadakseen ihmisten kiitosta ja ihailua, eivätkä usko vilpittömästi Allahin ja Tuonpuoleisen päivään. Heidän tekonsa ovat kuin sileä, kova kivi, jonka pinnalla on ohut kerros maata. Kun rankkasade iskee, maa huuhtoutuu pois ja jäljelle jää paljas kivi – hedelmätön ja eloton. Samoin niiden tekojen, jotka tehdään ilman uskoa ja vilpitöntä aikomusta, ulkoinen kauneus ei kanna hedelmää eikä tuo pysyvää palkkiota Allahilta. Allah tekee heidän tekojensa vaikutuksen olemattomaksi, kuin pölyn, jonka tuuli hajottaa. Tämä vertaus korostaa, että ilman uskoa ja puhdasta aikomusta tehdyt hyvät teot ovat tyhjiä. Allah ei johdata niitä, jotka kieltävät uskon.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُبْطِلُوا صَدَقَاتِكُمْ بِالْمَنِّ وَالْأَذَىٰ كَالَّذِي يُنْفِقُ مَالَهُ رِئَاءَ النَّاسِ وَلَا يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۖ فَمَثَلُهُ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٌ فَأَصَابَهُ وَابِلٌ فَتَرَكَهُ صَلْدًا ۖ لَا يَقْدِرُونَ عَلَىٰ شَيْءٍ مِمَّا كَسَبُوا ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ","commentary":"Tämä jae osoittaa suoraan uskoville varoituksen: älkää mitätöikö almujenne palkkiota kerskumalla tai aiheuttamalla vahinkoa vastaanottajalle – jatkaen edellisten jakeiden (262 ja 263) teemaa. Jaessa esitetään vahva vertaus: ne, jotka käyttävät varallisuuttaan ei Allahin tähden, vaan vain saadakseen ihmisten kiitosta ja ihailua, eivätkä usko vilpittömästi Allahin ja Tuonpuoleisen päivään. Heidän tekonsa ovat kuin sileä, kova kivi, jonka pinnalla on ohut kerros maata. Kun rankkasade iskee, maa huuhtoutuu pois ja jäljelle jää paljas kivi – hedelmätön ja eloton. Samoin niiden tekojen, jotka tehdään ilman uskoa ja vilpitöntä aikomusta, ulkoinen kauneus ei kanna hedelmää eikä tuo pysyvää palkkiota Allahilta. Allah tekee heidän tekojensa vaikutuksen olemattomaksi, kuin pölyn, jonka tuuli hajottaa. Tämä vertaus korostaa, että ilman uskoa ja puhdasta aikomusta tehdyt hyvät teot ovat tyhjiä. Allah ei johdata niitä, jotka kieltävät uskon.","translations":{"opas":"Te, jotka uskotte, älkää tehkö tyhjäksi almujanne jälkimoitteilla ja solvauksilla niinkuin se, joka luovuttaa omaisuutensa näyttääkseen ihmisten silmissä hurskaalta, mutta ei usko Jumalaan eikä Viimeiseen päivään; hänen laitansa on sama kuin kivipaaden, jonka päällä on hitunen multaa ja johon sadekuuro lankeaa jättäen sen aivan paljaaksi. Lopulta he eivät saa omakseen mitään tuloistaan. Jumala ei johda uskottomia ihmisiä.","clear":"Oi uskovat! Älkää tuhlatko hyväntekeväisyyttänne muistutuksilla ˹anteliaisuudestanne˺ tai loukkaavilla sanoilla, kuten ne, jotka lahjoittavat omaisuuttaan vain esiintyäkseen eivätkä usko Jumalaan tai Viimeiseen päivään. Heidän vertauskuvansa on kuin kova, karu kallio, jonka päällä on ohut maakerros, johon osuu voimakas sade – jättäen sen vain paljaaksi kiveksi. Sellaiset ihmiset eivät kykene säilyttämään hyväntekeväisyytensä palkintoa. Jumala ei johdata ˹sellaisia˺ epäuskoisia ihmisiä."}},{"verse":265,"commentary_en":"In contrast to the barren rock described in the previous verse, this verse offers a powerful image of the sincere giver. Those who spend their wealth seeking only Allah’s approval and as an affirmation of their own faith are likened to a fertile garden situated on a hill. This garden yields abundantly, doubling its produce with heavy rain, and even a light drizzle—i.e., soft rain—is sufficient for its growth. This illustrates how sincere charity, rooted in faith, is always fruitful and blessed, regardless of the amount given. It produces great results in terms of reward and spiritual growth. The verse concludes by affirming that Allah sees and is fully aware of everything people do, including the sincerity behind their giving. This reinforces the connection to the previous verse by presenting the positive outcome of giving with the right intention, directly contrasting the negative outcome of insincere giving.","commentary_fi":"Vastakohtana edellisessä jakeessa kuvatulle karulle kivelle tämä jae tarjoaa voimakkaan vertauskuvan vilpittömästä antajasta. Ne, jotka käyttävät varojaan etsiäkseen vain Allahin hyväksyntää ja vahvistaakseen omaa uskoaan, verrataan hedelmälliseen puutarhaan, joka sijaitsee mäellä. Tämä puutarha tuottaa runsaan sadon, joka kaksinkertaistuu rankkasateella, ja jopa kevyt tihku – eli pehmeä sade – riittää sen kasvuun. Tämä havainnollistaa, kuinka vilpitön, uskoon perustuva hyväntekeväisyys on aina hedelmällistä ja siunattua, riippumatta annetun määrän suuruudesta. Se tuottaa suurta palkkiota ja henkistä kasvua. Jakeen lopussa todetaan, että Allah näkee ja tietää kaiken, mitä ihmiset tekevät, mukaan lukien heidän anteliaisuutensa vilpittömyys. Tämä vahvistaa yhteyden edelliseen jakeeseen esittämällä vilpittömästä antamisesta seuraavan myönteisen lopputuloksen, joka on suora vastakohta vilpillisen antamisen kielteiselle seuraukselle.","arabic":"وَمَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمُ ابْتِغَاءَ مَرْضَاتِ اللَّهِ وَتَثْبِيتًا مِنْ أَنْفُسِهِمْ كَمَثَلِ جَنَّةٍ بِرَبْوَةٍ أَصَابَهَا وَابِلٌ فَآتَتْ أُكُلَهَا ضِعْفَيْنِ فَإِنْ لَمْ يُصِبْهَا وَابِلٌ فَطَلٌّ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ","commentary":"Vastakohtana edellisessä jakeessa kuvatulle karulle kivelle tämä jae tarjoaa voimakkaan vertauskuvan vilpittömästä antajasta. Ne, jotka käyttävät varojaan etsiäkseen vain Allahin hyväksyntää ja vahvistaakseen omaa uskoaan, verrataan hedelmälliseen puutarhaan, joka sijaitsee mäellä. Tämä puutarha tuottaa runsaan sadon, joka kaksinkertaistuu rankkasateella, ja jopa kevyt tihku – eli pehmeä sade – riittää sen kasvuun. Tämä havainnollistaa, kuinka vilpitön, uskoon perustuva hyväntekeväisyys on aina hedelmällistä ja siunattua, riippumatta annetun määrän suuruudesta. Se tuottaa suurta palkkiota ja henkistä kasvua. Jakeen lopussa todetaan, että Allah näkee ja tietää kaiken, mitä ihmiset tekevät, mukaan lukien heidän anteliaisuutensa vilpittömyys. Tämä vahvistaa yhteyden edelliseen jakeeseen esittämällä vilpittömästä antamisesta seuraavan myönteisen lopputuloksen, joka on suora vastakohta vilpillisen antamisen kielteiselle seuraukselle.","translations":{"opas":"Ne taasen, jotka uhraavat varojaan ikävöiden Jumalan mielisuosiota ja vahvistaakseen sieluaan, ovat kukkulalla sijait~ sevan puutarhan kaltaisia, johon sadekuuro lankeaa, tuottaen kaksinkertaisen sadon. Ja jollei sadekuuro lankea, niin laskeutuu sille ainakin kaste. Jumala näkee, mitä te teette.","clear":"Ja niiden, jotka lahjoittavat omaisuuttaan tavoitellen Allahin mielisuosiota ja uskoen palkinnon olevan varma, esimerkki on kuin puutarha hedelmällisellä kukkulalla: kun rankkasade tulee, se tuottaa kaksinkertaisen sadon. Jos rankkasadetta ei tule, tihkusade riittää. Ja Allah näkee kaiken, mitä teette."}},{"verse":266,"commentary_en":"This verse uses another moving parable to emphasize the value and vulnerability of one’s deeds. It asks whether anyone would wish to own a flourishing garden—with palm trees, vines, and flowing streams, producing abundant fruits—only to see it completely destroyed by a fiery whirlwind at the very moment they become old, weak, and unable to support their dependent children. The lush garden symbolizes a lifetime of good deeds—charity, prayer, devotion—accumulated with apparent care and consistency. The old age and dependent children represent a person in a state of utmost need and vulnerability, symbolizing the time of death or the Day of Judgment, when one most depends on those good deeds to secure salvation. The fiery whirlwind destroying the garden reflects the nullification of those deeds due to harmful intentions such as insincerity, showing off, causing hurt, or following charity with reminders and arrogance, as highlighted in verses 262–265. This parable illustrates how even a lifetime of effort can be undone if not grounded in sincerity and humility. Allah presents such parables clearly so that people may reflect deeply on the consequences of their actions. It reinforces the preceding discussion by warning that good works must be built upon a solid foundation of sincere faith and upright conduct in order to truly endure.","commentary_fi":"Tässä jakeessa esitetään koskettava vertaus, joka korostaa tekojen arvokkuutta mutta myös niiden haavoittuvuutta. Siinä kysytään, haluaisiko kukaan omistaa kukoistavan puutarhan, jossa kasvaa palmuja, köynnöksiä ja virtaa puroja, ja joka tuottaa runsaasti hedelmää—vain nähdäkseen sen tuhoutuvan tulisessa pyörremyrskyssä juuri silloin, kun hän on vanha, heikko eikä kykene huolehtimaan riippuvaisista lapsistaan. Kukoistava puutarha symboloi elinikäisiä hyviä tekoja—lahjoituksia, rukouksia ja omistautumista—joita on kerätty näennäisen huolellisesti ja johdonmukaisesti. Vanhus ja riippuvaiset lapset edustavat ihmisen tilaa suurimmassa avuttomuudessa ja tarpeessa, viitaten kuoleman hetkeen tai Tuomiopäivään, jolloin hän eniten tarvitsee tekojaan pelastukseksi. Pyörremyrsky taas kuvastaa näiden tekojen mitätöitymistä vilpillisyyden, esittämisen halun, toisten loukkaamisen tai lahjoitusten jälkeisen kerskailun seurauksena, kuten jakeissa 262–265 mainittiin. Tämä vertaus osoittaa, kuinka jopa koko elämän pituinen hyveellinen työ voi tuhoutua, ellei sitä tue vilpitön usko ja nöyryys. Allah esittää tällaisia vertauksia selkeästi, jotta ihmiset voisivat syvällisesti pohtia tekojaan ja niiden seurauksia. Se vahvistaa aiempien jakeiden viestin: hyvien tekojen on perustuttava aitoon uskoon ja oikeaan käytökseen, jotta niillä olisi pysyvää arvoa.","arabic":"أَيَوَدُّ أَحَدُكُمْ أَنْ تَكُونَ لَهُ جَنَّةٌ مِنْ نَخِيلٍ وَأَعْنَابٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ لَهُ فِيهَا مِنْ كُلِّ الثَّمَرَاتِ وَأَصَابَهُ الْكِبَرُ وَلَهُ ذُرِّيَّةٌ ضُعَفَاءُ فَأَصَابَهَا إِعْصَارٌ فِيهِ نَارٌ فَاحْتَرَقَتْ ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ لَعَلَّكُمْ تَتَفَكَّرُونَ","commentary":"Tässä jakeessa esitetään koskettava vertaus, joka korostaa tekojen arvokkuutta mutta myös niiden haavoittuvuutta. Siinä kysytään, haluaisiko kukaan omistaa kukoistavan puutarhan, jossa kasvaa palmuja, köynnöksiä ja virtaa puroja, ja joka tuottaa runsaasti hedelmää—vain nähdäkseen sen tuhoutuvan tulisessa pyörremyrskyssä juuri silloin, kun hän on vanha, heikko eikä kykene huolehtimaan riippuvaisista lapsistaan. Kukoistava puutarha symboloi elinikäisiä hyviä tekoja—lahjoituksia, rukouksia ja omistautumista—joita on kerätty näennäisen huolellisesti ja johdonmukaisesti. Vanhus ja riippuvaiset lapset edustavat ihmisen tilaa suurimmassa avuttomuudessa ja tarpeessa, viitaten kuoleman hetkeen tai Tuomiopäivään, jolloin hän eniten tarvitsee tekojaan pelastukseksi. Pyörremyrsky taas kuvastaa näiden tekojen mitätöitymistä vilpillisyyden, esittämisen halun, toisten loukkaamisen tai lahjoitusten jälkeisen kerskailun seurauksena, kuten jakeissa 262–265 mainittiin. Tämä vertaus osoittaa, kuinka jopa koko elämän pituinen hyveellinen työ voi tuhoutua, ellei sitä tue vilpitön usko ja
