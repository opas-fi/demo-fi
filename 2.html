eräistä kysymystään edellisessä jakeessa, profeetta Mooseksen kansa pyysi häntä rukoilemaan Allahia selvittämään, minkälaisesta hiehosta oli kyse. Tämä osoittaa, että he tekivät asiasta monimutkaisempaa kuin alkuperäinen käsky vaati. Profeetta Mooses välitti Allahin vastauksen: hiehon ei pitäisi olla liian vanha eikä liian nuori, vaan keski-ikäinen. Hän sitten toisti käskyn: \"Nyt tehkää, mitä teille on käsketty!\" Selvennyksestä huolimatta he jatkoivat tarkempien yksityiskohtien etsimistä sen sijaan, että olisivat yksinkertaisesti toteuttaneet tehtävän.","arabic":"قَالُوا ادْعُ لَنَا رَبَّكَ يُبَيِّنْ لَنَا مَا هِيَ ۚ قَالَ إِنَّهُ يَقُولُ إِنَّهَا بَقَرَةٌ لَا فَارِضٌ وَلَا بِكْرٌ عَوَانٌ بَيْنَ ذَٰلِكَ ۖ فَافْعَلُوا مَا تُؤْمَرُونَ","commentary":"Seuraten heidän alkuperäistä kysymystään edellisessä jakeessa, profeetta Mooseksen kansa pyysi häntä rukoilemaan Allahia selvittämään, minkälaisesta hiehosta oli kyse. Tämä osoittaa, että he tekivät asiasta monimutkaisempaa kuin alkuperäinen käsky vaati. Profeetta Mooses välitti Allahin vastauksen: hiehon ei pitäisi olla liian vanha eikä liian nuori, vaan keski-ikäinen. Hän sitten toisti käskyn: \"Nyt tehkää, mitä teille on käsketty!\" Selvennyksestä huolimatta he jatkoivat tarkempien yksityiskohtien etsimistä sen sijaan, että olisivat yksinkertaisesti toteuttaneet tehtävän.","translations":{"opas":"Silloin sanoivat he: »Rukoile Jumalaasi puolestamme, että Hän näyttäisi meille, millainen hiehon tulee olla.» Hän vastasi: »Hän sanoo totisesti: Sen tulee olla lehmä, jolla ei vielä ole ollut vasikkaa, mutta joka ei myöskään ole liian nuori, vaan siltä väliltä. Tehkää siis, mitä teille on käsketty.»","clear":"He sanoivat: ”Pyydä Herraltasi selventämään meille, millainen ˹lehmän˺ tulisi olla!” Hän vastasi: ”Allah sanoo: ’Lehmän ei pitäisi olla vanha eikä nuori, vaan siltä väliltä. Tehkää siis niin kuin teille on käsketty!’”"}},{"verse":69,"commentary_en":"Continuing the dialogue from the previous verse, the people of Prophet Moses asked for further clarification, specifically about the color of the heifer. Prophet Moses conveyed Allah's response: it should be a yellow heifer, bright and pleasing in appearance. This specification further narrowed down the options and made finding the required animal more difficult. This question about color, following the question about age, illustrates their persistent questioning and tendency to make the simple divine command increasingly complex for themselves.","commentary_fi":"Jatkuen edellisessä jakeessa aloitetusta vuoropuhelusta, profeetta Mooseksen kansa pyysi lisäselvennystä, erityisesti hiehon väristä. Profeetta Mooses välitti Allahin vastauksen: sen pitäisi olla keltainen hieho, kirkas ja miellyttävä ulkonäöltään.Tämä tarkennus kavensi vaihtoehtoja entisestään ja vaikeutti vaaditun eläimen löytämistä. Tämä kysymys väristä, ikää koskevan kysymyksen jälkeen, kuvastaa heidän jatkuvaa kyseenalaistamistaan ja taipumustaan tehdä yksinkertaisesta jumalallisesta käskystä yhä monimutkaisempi itselleen.","arabic":"قَالُوا ادْعُ لَنَا رَبَّكَ يُبَيِّنْ لَنَا مَا لَوْنُهَا ۚ قَالَ إِنَّهُ يَقُولُ إِنَّهَا بَقَرَةٌ صَفْرَاءُ فَاقِعٌ لَوْنُهَا تَسُرُّ النَّاظِرِينَ","commentary":"Jatkuen edellisessä jakeessa aloitetusta vuoropuhelusta, profeetta Mooseksen kansa pyysi lisäselvennystä, erityisesti hiehon väristä. Profeetta Mooses välitti Allahin vastauksen: sen pitäisi olla keltainen hieho, kirkas ja miellyttävä ulkonäöltään.Tämä tarkennus kavensi vaihtoehtoja entisestään ja vaikeutti vaaditun eläimen löytämistä. Tämä kysymys väristä, ikää koskevan kysymyksen jälkeen, kuvastaa heidän jatkuvaa kyseenalaistamistaan ja taipumustaan tehdä yksinkertaisesta jumalallisesta käskystä yhä monimutkaisempi itselleen.","translations":{"opas":"Silloin he sanoivat: »Rukoile Herraasi puolestamme, jotta hän selittää meille, millainen sen tulee olla väriltään.» Hän vastasi: »Hän sanoo totisesti: Sen tulee olla ruskeanpunainen, kirkas väriltään, joka miellyttää katsojaa.»","clear":"He sanoivat: ”Pyydä Herraltasi täsmentämään meille sen väri.” Hän vastasi: ”Allah sanoo: ’Sen pitäisi olla kirkkaan keltainen lehmä – miellyttävä nähdä.’”"}},{"verse":70,"commentary_en":"This verse continues the story about the command given to the Israelites to sacrifice a cow. After being told the cow should be of a specific age and color (described in previous verses), they ask Prophet Moses again to seek further clarification from Allah. They explain that many cows look similar to them, making it hard to choose, and express a hope to be guided in finding the right one, if Allah wills. This shows their ongoing difficulty and hesitation in fulfilling the simple command, leading them to ask for increasingly specific details.","commentary_fi":"Tämä jae jatkaa kertomusta käskystä, joka annettiin israelilaisille uhrata lehmä. Saatuaan tiedon lehmän iästä ja väristä (jotka kuvailtiin aiemmissa jakeissa), he pyytävät profeetta Moosesta uudelleen etsimään lisäselvennystä Allahilta. He selittävät, että monet lehmät näyttävät samanlaisilta, mikä vaikeuttaa valintaa, ja ilmaisevat toivovansa opastusta oikean löytämiseksi, jos Allah niin sallii. Tämä osoittaa heidän jatkuvan vaikeutensa ja epäröintinsä yksinkertaisen käskyn täyttämisessä, mikä saa heidät pyytämään yhä tarkempia yksityiskohtia.","arabic":"قَالُوا ادْعُ لَنَا رَبَّكَ يُبَيِّنْ لَنَا مَا هِيَ إِنَّ الْبَقَرَ تَشَابَهَ عَلَيْنَا وَإِنَّا إِنْ شَاءَ اللَّهُ لَمُهْتَدُونَ","commentary":"Tämä jae jatkaa kertomusta käskystä, joka annettiin israelilaisille uhrata lehmä. Saatuaan tiedon lehmän iästä ja väristä (jotka kuvailtiin aiemmissa jakeissa), he pyytävät profeetta Moosesta uudelleen etsimään lisäselvennystä Allahilta. He selittävät, että monet lehmät näyttävät samanlaisilta, mikä vaikeuttaa valintaa, ja ilmaisevat toivovansa opastusta oikean löytämiseksi, jos Allah niin sallii. Tämä osoittaa heidän jatkuvan vaikeutensa ja epäröintinsä yksinkertaisen käskyn täyttämisessä, mikä saa heidät pyytämään yhä tarkempia yksityiskohtia.","translations":{"opas":"He sanoivat: »Huuda Herraasi puolestamme, niin hän näyttää meille, mikä on se oikea hieho; monet hiehothan näyttävät meistä toistensa kaltaisilta, mutta jos Jumala tahtoo, voimme varmasti osua oikeaan.»","clear":"He sanoivat jälleen: ”Rukoile Herraasi, jotta Hän selittäisi meille, millainen lehmä on, sillä kaikki lehmät näyttävät meistä samalta. Sitten, Jumalan suosiolla, meidät ohjataan ˹oikeaan˺.”"}},{"verse":71,"commentary_en":"Responding to their request for more clarity in the previous verse, Prophet Moses relays the final, very specific description from Allah: the cow should be one that has not been used for farming or watering fields, and must be completely healthy and without any flaws. Upon receiving this precise description, they acknowledge that Prophet Moses has finally given them the necessary details. They then proceed to sacrifice the cow, but they did so reluctantly, highlighting their continued hesitation and lack of full willingness to obey the command despite all the clarifications.","commentary_fi":"Vastauksena heidän pyyntöönsä saada lisää selvyyttä edellisessä jakeessa, profeetta Mooses välittää Allahin viimeisen, hyvin tarkan kuvauksen: lehmän tulisi olla sellainen, jota ei ole käytetty viljelyyn tai peltojen kasteluun, ja sen on oltava täysin terve ja virheetön. Saatuaan tämän tarkan kuvauksen he myöntävät, että profeetta Mooses on vihdoin antanut heille tarvittavat tiedot. Sitten he uhraavat lehmän, mutta he tekivät sen vastahakoisesti, korostaen heidän jatkuvaa epäröintiään ja täyden halukkuuden puutetta totella käskyä kaikista selvennyksistä huolimatta.","arabic":"قَالَ إِنَّهُ يَقُولُ إِنَّهَا بَقَرَةٌ لَا ذَلُولٌ تُثِيرُ الْأَرْضَ وَلَا تَسْقِي الْحَرْثَ مُسَلَّمَةٌ لَا شِيَةَ فِيهَا ۚ قَالُوا الْآنَ جِئْتَ بِالْحَقِّ ۚ فَذَبَحُوهَا وَمَا كَادُوا يَفْعَلُونَ","commentary":"Vastauksena heidän pyyntöönsä saada lisää selvyyttä edellisessä jakeessa, profeetta Mooses välittää Allahin viimeisen, hyvin tarkan kuvauksen: lehmän tulisi olla sellainen, jota ei ole käytetty viljelyyn tai peltojen kasteluun, ja sen on oltava täysin terve ja virheetön. Saatuaan tämän tarkan kuvauksen he myöntävät, että profeetta Mooses on vihdoin antanut heille tarvittavat tiedot. Sitten he uhraavat lehmän, mutta he tekivät sen vastahakoisesti, korostaen heidän jatkuvaa epäröintiään ja täyden halukkuuden puutetta totella käskyä kaikista selvennyksistä huolimatta.","translations":{"opas":"Mooses vastasi: »Hän sanoo: Totisesti on sen oltava ikeestä vapaa hieho, jota ei ole käytetty maan kyntämiseen eikä pellon kastelemiseen, ilman vammaa ja vikaa.» Silloin he sanoivat: »Nyt ilmaisit kaiken totuuden.» Sen jälkeen he teurastivat hiehon, mutta olivat olleet vähällä lyödä laimin Jumalan määräykset.","clear":"Hän vastasi: ”Jumala sanoo: ’Sen ei pitäisi olla käytettynä kyntämään maata eikä kastelemaan peltoja; terve ja virheetön.’” He sanoivat: ”Nyt olet tullut totuuden kanssa.” Silti he teurastivat sen epäröiden!"}},{"verse":72,"commentary_en":"This verse reveals the reason behind the seemingly strange command to sacrifice a specific cow. The context shifts to a prior event where a man had been murdered among the Israelites, and they were arguing and blaming each other for the crime, with the true killer hidden. Allah states that He intended to expose what they were concealing, connecting the sacrifice of the cow to the resolution of this unsolved murder.","commentary_fi":"Tämä jae paljastaa syyn näennäisesti outoon käskyyn uhrata tietty lehmä. Yhteys siirtyy aiempaan tapahtumaan, jossa israelilaisten keskuudessa oli murhattu mies, ja he riitelivät ja syyttelivät toisiaan rikoksesta, samalla kun todellinen murhaaja oli kätkettynä. Allah ilmoittaa aikovansa paljastaa sen, mitä he piilottivat, yhdistäen lehmän uhraamisen tämän ratkaisemattoman murhan selvittämiseen.","arabic":"وَإِذْ قَتَلْتُمْ نَفْسًا فَادَّارَأْتُمْ فِيهَا ۖ وَاللَّهُ مُخْرِجٌ مَا كُنْتُمْ تَكْتُمُونَ","commentary":"Tämä jae paljastaa syyn näennäisesti outoon käskyyn uhrata tietty lehmä. Yhteys siirtyy aiempaan tapahtumaan, jossa israelilaisten keskuudessa oli murhattu mies, ja he riitelivät ja syyttelivät toisiaan rikoksesta, samalla kun todellinen murhaaja oli kätkettynä. Allah ilmoittaa aikovansa paljastaa sen, mitä he piilottivat, yhdistäen lehmän uhraamisen tämän ratkaisemattoman murhan selvittämiseen.","translations":{"opas":"Ja muistatteko, kun olitte surmanneet miehen ja kiistelitte toistenne kanssa syyllisyydestä, mutta Jumala tahtoi tuoda ilmi, mitä te salailitte.","clear":"˹Tämä on˺ kun mies tapettiin ja te riitelitte siitä, kuka tappaja oli, mutta Jumala paljasti sen, minkä te salaisitte."}},{"verse":73,"commentary_en":"Following the sacrifice of the cow (as described in Verse 71), this verse describes the divine instruction given to the Israelites: to strike the body of the murdered man with a piece of the sacrificed animal. When they did this, Allah brought the dead man back to life. This miraculous act, performed using a piece of the cow, served to reveal the murderer and solve the dispute mentioned in the previous verse. This was a demonstration of Allah's power to bring the dead back to life and a sign for them to witness, encouraging them to understand and reflect on His capabilities and wisdom.","commentary_fi":"Lehmän uhraamisen jälkeen (kuten jakeessa 71 kuvattiin), tämä jae kuvaa jumalallista ohjetta, joka annettiin israelilaisille: lyödä kuolleen miehen ruumista palalla uhratusta eläimestä. Selityksessä kerrotaan, että heidän tehdessään tämän, Allah palautti kuolleen miehen henkiin. Tämä ihmeellinen teko, joka suoritettiin käyttämällä palaa lehmästä, palveli murhaajan paljastamiseksi ja edellisessä jakeessa mainitun riidan ratkaisemiseksi. Selitys korostaa, että tämä oli osoitus Allahin kyvystä palauttaa kuolleet henkiin ja merkki heille todistaa, kannustaen heitä ymmärtämään ja pohtimaan Hänen kykyjään ja viisauttaan.","arabic":"فَقُلْنَا اضْرِبُوهُ بِبَعْضِهَا ۚ كَذَٰلِكَ يُحْيِي اللَّهُ الْمَوْتَىٰ وَيُرِيكُمْ آيَاتِهِ لَعَلَّكُمْ تَعْقِلُونَ","commentary":"Lehmän uhraamisen jälkeen (kuten jakeessa 71 kuvattiin), tämä jae kuvaa jumalallista ohjetta, joka annettiin israelilaisille: lyödä kuolleen miehen ruumista palalla uhratusta eläimestä. Selityksessä kerrotaan, että heidän tehdessään tämän, Allah palautti kuolleen miehen henkiin. Tämä ihmeellinen teko, joka suoritettiin käyttämällä palaa lehmästä, palveli murhaajan paljastamiseksi ja edellisessä jakeessa mainitun riidan ratkaisemiseksi. Selitys korostaa, että tämä oli osoitus Allahin kyvystä palauttaa kuolleet henkiin ja merkki heille todistaa, kannustaen heitä ymmärtämään ja pohtimaan Hänen kykyjään ja viisauttaan.","translations":{"opas":"ja niin Me sanoimme: »Koskettakaa ruumista jollakin osalla uhrattavaa hiehoa!» Sillä tavalla Jumala herättää kuolleet eloon ja näyttää teille tunnusmerkkejään, jotta olisitte ymmärtäväisiä.","clear":"Niinpä Me annoimme ohjeen: ”Lyökää kuollutta ruumista lehmän palalla.” Näin ˹helposti˺ Jumala herättää kuolleet eloon, näyttäen teille Hänen merkkejään, jotta ymmärtäisitte."}},{"verse":74,"commentary_en":"This verse reflects on the reaction and spiritual state of the Israelites *after* witnessing the incredible sign of the dead man being brought back to life using a piece of the cow. Despite seeing this clear demonstration of Allah's power and being given a solution to their problem, their hearts became hard. The verse describes their hearts as being as hard as rocks, or even harder. It uses the examples of different types of rocks – those that yield rivers, those that split to let water flow, and even those that crumble out of awe of Allah – to highlight how their hearts remained unmoved and unresponsive, unlike even inanimate rocks which can show signs of change or yielding. The verse concludes with a reminder that Allah is fully aware of all their actions.","commentary_fi":"Tämä jae pohtii israelilaisten reaktiota ja henkistä tilaa *sen jälkeen*, kun he olivat nähneet uskomattoman merkin kuolleen miehen herättämisestä henkiin lehmän palalla. Vaikka he näkivät tämän selkeän osoituksen Allahin voimasta ja saivat ratkaisun ongelmaansa, heidän sydämensä kovettuivat. Jae kuvaa heidän sydämiään yhtä koviksi kuin kalliot, tai jopa kovemmiksi. Se käyttää esimerkkejä erilaisista kallioista – niistä, joista virtaa jokia, niistä, jotka halkeavat päästääkseen vettä virtaamaan, ja jopa niistä, jotka murenevat kunnioituksesta Allahia kohtaan – korostaakseen, kuinka heidän sydämensä pysyivät liikuttumattomina ja vastaamattomina, toisin kuin jopa elottomat kalliot, jotka voivat osoittaa merkkejä muutoksesta tai taipumisesta. Jae päättyy muistutukseen, että Allah on täysin tietoinen kaikista heidän teoistaan.","arabic":"ثُمَّ قَسَتْ قُلُوبُكُمْ مِنْ بَعْدِ ذَٰلِكَ فَهِيَ كَالْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً ۚ وَإِنَّ مِنَ الْحِجَارَةِ لَمَا يَتَفَجَّرُ مِنْهُ الْأَنْهَارُ ۚ وَإِنَّ مِنْهَا لَمَا يَشَّقَّقُ فَيَخْرُجُ مِنْهُ الْمَاءُ ۚ وَإِنَّ مِنْهَا لَمَا يَهْبِطُ مِنْ خَشْيَةِ اللَّهِ ۗ وَمَا اللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ","commentary":"Tämä jae pohtii israelilaisten reaktiota ja henkistä tilaa *sen jälkeen*, kun he olivat nähneet uskomattoman merkin kuolleen miehen herättämisestä henkiin lehmän palalla. Vaikka he näkivät tämän selkeän osoituksen Allahin voimasta ja saivat ratkaisun ongelmaansa, heidän sydämensä kovettuivat. Jae kuvaa heidän sydämiään yhtä koviksi kuin kalliot, tai jopa kovemmiksi. Se käyttää esimerkkejä erilaisista kallioista – niistä, joista virtaa jokia, niistä, jotka halkeavat päästääkseen vettä virtaamaan, ja jopa niistä, jotka murenevat kunnioituksesta Allahia kohtaan – korostaakseen, kuinka heidän sydämensä pysyivät liikuttumattomina ja vastaamattomina, toisin kuin jopa elottomat kalliot, jotka voivat osoittaa merkkejä muutoksesta tai taipumisesta. Jae päättyy muistutukseen, että Allah on täysin tietoinen kaikista heidän teoistaan.","translations":{"opas":"Senkin jälkeen paatuivat sydämenne ja tulivat kivikoviksi, jopa kiveäkin kovemmaksi, sillä kivien joukossa on totisesti sellaisia, joista purot kohisevat esiin, sellaisia, jotka halkeavat, niin että vesi virtaa niistä, ja sellaisia, jotka Jumalan edessä syöksyvät maahan pelosta. Mutta Jumalalta ei jää salaan mitään, mitä teette.","clear":"Silti sydämenne kovettuivat kuin kivi tai vieläkin kovemmiksi, sillä joistakin kivistä pulppuaa jokia, toiset halkeavat, vuodattaen vettä, kun taas toiset nöyrtyvät Jumalan kunnioituksesta. Eikä Jumala ole koskaan tietämätön siitä, mitä te teette."}},{"verse":75,"commentary_en":"This verse addresses the believers, prompting reflection on whether they should expect that some among the Children of Israel will accept their message. It highlights a historical pattern where some individuals from among them, even after hearing and understanding the Divine word, deliberately altered its meaning. This deliberate distortion, despite clear understanding, casts doubt on the likelihood of them embracing the new message with sincerity, suggesting a deep-seated reluctance to accept truth that contradicts their desires.","commentary_fi":"Tämä jae kääntyy uskovien puoleen ja kehottaa pohtimaan, tulisiko heidän odottaa, että jotkut Israelin lapsista hyväksyvät heidän sanomansa. Se korostaa historiallista kaavaa, jossa jotkut yksilöt heidän joukostaan, jopa kuultuaan ja ymmärrettyään jumalallisen sanan, muuttivat sen merkitystä tarkoituksellisesti. Tämä tarkoituksellinen vääristely, selvästä ymmärryksestä huolimatta, herättää epäilyksiä heidän todennäköisyydestään omaksua uusi sanoma vilpittömästi, vihjaten syvään juurtuneesta vastahakoisuudesta hyväksyä totuus, joka on ristiriidassa heidän toiveidensa kanssa.","arabic":"أَفَتَطْمَعُونَ أَنْ يُؤْمِنُوا لَكُمْ وَقَدْ كَانَ فَرِيقٌ مِنْهُمْ يَسْمَعُونَ كَلَامَ اللَّهِ ثُمَّ يُحَرِّفُونَهُ مِنْ بَعْدِ مَا عَقَلُوهُ وَهُمْ يَعْلَمُونَ","commentary":"Tämä jae kääntyy uskovien puoleen ja kehottaa pohtimaan, tulisiko heidän odottaa, että jotkut Israelin lapsista hyväksyvät heidän sanomansa. Se korostaa historiallista kaavaa, jossa jotkut yksilöt heidän joukostaan, jopa kuultuaan ja ymmärrettyään jumalallisen sanan, muuttivat sen merkitystä tarkoituksellisesti. Tämä tarkoituksellinen vääristely, selvästä ymmärryksestä huolimatta, herättää epäilyksiä heidän todennäköisyydestään omaksua uusi sanoma vilpittömästi, vihjaten syvään juurtuneesta vastahakoisuudesta hyväksyä totuus, joka on ristiriidassa heidän toiveidensa kanssa.","translations":{"opas":"Toivotteko te, että he (juutalaiset) uskovat teitä? Johan osa heistä aikanaan kuuli Jumalan sanan, ja ymmärrettyäänkin sen he vääristelivät sitä vastoin parempaa tietoaan.","clear":"Odotatteko ˹uskovat yhä˺ heidän olevan teille uskollisia, vaikka osa heistä kuuli Jumalan sanan, ja sitten tietoisesti turmeli sen ymmärrettyään sen?"}},{"verse":76,"commentary_en":"Following from the previous verse which mentioned distortion, this verse describes the two-faced behavior of some individuals. When they encounter believers, they outwardly claim to believe. However, in private, they express concern about revealing knowledge from their own scriptures that might support the Muslim claims, fearing it could be used against them in arguments before Allah. This illustrates a level of calculated hypocrisy and a desire to conceal truths that might validate the message brought by Prophet Muhammad. It questions the believers' understanding of this deceptive strategy.","commentary_fi":"Jatkaen edellisestä jakeesta, jossa mainittiin vääristely, tämä jae kuvaa joidenkin yksilöiden kaksinaamaista käyttäytymistä. Kohdatessaan uskovia he väittävät ulkoisesti uskovansa. Kuitenkin yksityisesti he ilmaisevat huolta omista kirjoituksistaan peräisin olevan tiedon paljastamisesta, joka saattaisi tukea muslimien väitteitä, peläten sitä voitavan käyttää heitä vastaan väittelyissä Allahin edessä. Tämä kuvaa harkittua tekopyhyyttä ja halua salata totuuksia, jotka saattaisivat vahvistaa profeetta Muhammadin tuomaa sanomaa. Se kyseenalaistaa uskovien ymmärryksen tästä petollisesta strategiasta.","arabic":"وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَا بَعْضُهُمْ إِلَىٰ بَعْضٍ قَالُوا أَتُحَدِّثُونَهُمْ بِمَا فَتَحَ اللَّهُ عَلَيْكُمْ لِيُحَاجُّوكُمْ بِهِ عِنْدَ رَبِّكُمْ ۚ أَفَلَا تَعْقِلُونَ","commentary":"Jatkaen edellisestä jakeesta, jossa mainittiin vääristely, tämä jae kuvaa joidenkin yksilöiden kaksinaamaista käyttäytymistä. Kohdatessaan uskovia he väittävät ulkoisesti uskovansa. Kuitenkin yksityisesti he ilmaisevat huolta omista kirjoituksistaan peräisin olevan tiedon paljastamisesta, joka saattaisi tukea muslimien väitteitä, peläten sitä voitavan käyttää heitä vastaan väittelyissä Allahin edessä. Tämä kuvaa harkittua tekopyhyyttä ja halua salata totuuksia, jotka saattaisivat vahvistaa profeetta Muhammadin tuomaa sanomaa. Se kyseenalaistaa uskovien ymmärryksen tästä petollisesta strategiasta.","translations":{"opas":"Kun he tapaavat uskovaisia, he sanovat: »Me uskomme.» Mutta kun he ovat toistensa seurassa, he sanovat: »Kerrotteko heille(muslimeille), mitä Jumala on ilmoittanut teille, että he siitä kiistelisivät kanssanne Herranne edessä. Ettekö te tätä ymmärrä?»","clear":"Kun he tapaavat uskovat, he sanovat: ”Me uskomme.” Mutta yksityisesti he sanovat ˹toisilleen˺: ”Paljastatteko uskoville tiedon, jonka Jumala on teille ilmoittanut, jotta he voisivat käyttää sitä teitä vastaan Herranne edessä? Ettekö te ymmärrä?”"}},{"verse":77,"commentary_en":"This verse directly follows and responds to the scheming described in the previous one. It serves as a rhetorical question directed at those who plot and hide information. It emphasizes that Allah is fully aware of everything, whether it is openly declared or kept secret in their hearts and private gatherings. This reminds everyone that attempts to conceal truth or maintain hypocrisy are ultimately futile before the All-Knowing.","commentary_fi":"Tämä jae seuraa suoraan ja vastaa edellisessä jakeessa kuvattuun juonitteluun. Se toimii retorisena kysymyksenä niille, jotka suunnittelevat ja salaavat tietoa. Se korostaa, että Allah on täysin tietoinen kaikesta, olipa se sitten avoimesti julistettua tai salattua heidän sydämissään ja yksityisissä kokoontumisissaan. Tämä muistuttaa kaikkia siitä, että yritykset salata totuutta tai ylläpitää tekopyhyyttä ovat lopulta turhia Kaikkitietävän edessä.","arabic":"أَوَلَا يَعْلَمُونَ أَنَّ اللَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ","commentary":"Tämä jae seuraa suoraan ja vastaa edellisessä jakeessa kuvattuun juonitteluun. Se toimii retorisena kysymyksenä niille, jotka suunnittelevat ja salaavat tietoa. Se korostaa, että Allah on täysin tietoinen kaikesta, olipa se sitten avoimesti julistettua tai salattua heidän sydämissään ja yksityisissä kokoontumisissaan. Tämä muistuttaa kaikkia siitä, että yritykset salata totuutta tai ylläpitää tekopyhyyttä ovat lopulta turhia Kaikkitietävän edessä.","translations":{"opas":"Eivätkö he sitten älyä, että Jumala tietää, mitä he salaavat ja mitä julistavat?","clear":"Eivätkö he tiedä, että Jumala on tietoinen siitä, mitä he salaavat ja mitä he paljastavat?"}},{"verse":78,"commentary_en":"Moving from the learned individuals discussed earlier, this verse introduces another group among the Children of Israel: those who are unlettered and do not truly understand their scriptures. Their understanding is based on speculation and personal desires rather than divine knowledge. This highlights that their misconceptions and expectations (as seen in subsequent verses) stem not from scriptural understanding but from wishful thinking and assumptions.","commentary_fi":"Siirtyen aiemmin keskustelluista oppineista yksilöistä, tämä jae esittelee toisen ryhmän Israelin lasten joukossa: ne, jotka ovat lukutaidottomia eivätkä todella ymmärrä kirjoituksiaan. Heidän ymmärryksensä perustuu spekulaatioon ja henkilökohtaisiin toiveisiin pikemminkin kuin jumalalliseen tietoon. Tämä korostaa, että heidän väärinkäsityksensä ja odotuksensa (kuten nähdään seuraavissa jakeissa) eivät johdu kirjoitusten ymmärryksestä vaan toiveajattelusta ja oletuksista.","arabic":"وَمِنْهُمْ أُمِّيُّونَ لَا يَعْلَمُونَ الْكِتَابَ إِلَّا أَمَانِيَّ وَإِنْ هُمْ إِلَّا يَظُنُّونَ","commentary":"Siirtyen aiemmin keskustelluista oppineista yksilöistä, tämä jae esittelee toisen ryhmän Israelin lasten joukossa: ne, jotka ovat lukutaidottomia eivätkä todella ymmärrä kirjoituksiaan. Heidän ymmärryksensä perustuu spekulaatioon ja henkilökohtaisiin toiveisiin pikemminkin kuin jumalalliseen tietoon. Tämä korostaa, että heidän väärinkäsityksensä ja odotuksensa (kuten nähdään seuraavissa jakeissa) eivät johdu kirjoitusten ymmärryksestä vaan toiveajattelusta ja oletuksista.","translations":{"opas":"Heidän joukossaan on oppimattomiakin, jotka eivät tunne Pyhää kirjaa muuta kuin kuulopuheista. Heille se on vain arvelua. Voi niitä, jotka kirjoittavat kirjoituksensa omin käsin ja sanovat: »Tämä on Jumalalta», hankkiakseen itsellensä siten pientä ansiota!","clear":"Ja heidän joukossaan on lukutaidottomia, jotka eivät tiedä mitään Kirjoituksista paitsi valheita, ja ˹niinpä˺ he ˹toiveikkaasti˺ spekuloivat."}},{"verse":79,"commentary_en":"This verse addresses a different group, likely religious leaders or scholars, who actively manipulate and falsify their scriptures. It condemns those who deliberately write falsehoods and claim they are from Allah, doing so for worldly gain, which the verse describes as a \"miserable price.\" This is a strong warning against corrupting religious texts for personal benefit, highlighting the severe consequences both for the act of writing the falsehood and for the material profit derived from it. This contrasts with the ignorance mentioned in the previous verse by focusing on deliberate deception by the knowledgeable.","commentary_fi":"Tämä jae käsittelee eri ryhmää, luultavasti uskonnollisia johtajia tai oppineita, jotka manipuloivat ja väärentävät aktiivisesti kirjoituksiaan. Se tuomitsee ne, jotka tarkoituksellisesti kirjoittavat valheita ja väittävät niiden olevan Allahilta, tehden niin maallisen hyödyn vuoksi, jota jae kuvaa \"kurjaksi hinnaksi\". Tämä on voimakas varoitus uskonnollisten tekstien korruptoimisesta henkilökohtaisen hyödyn tähden, korostaen vakavia seurauksia sekä valheiden kirjoittamisesta että siitä saadusta aineellisesta hyödystä. Tämä eroaa edellisessä jakeessa mainitusta tietämättömyydestä keskittyen tietoisten henkilöiden tarkoitukselliseen pettämiseen.","arabic":"فَوَيْلٌ لِلَّذِينَ يَكْتُبُونَ الْكِتَابَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَٰذَا مِنْ عِنْدِ اللَّهِ لِيَشْتَرُوا بِهِ ثَمَنًا قَلِيلًا ۖ فَوَيْلٌ لَهُمْ مِمَّا كَتَبَتْ أَيْدِيهِمْ وَوَيْلٌ لَهُمْ مِمَّا يَكْسِبُونَ","commentary":"Tämä jae käsittelee eri ryhmää, luultavasti uskonnollisia johtajia tai oppineita, jotka manipuloivat ja väärentävät aktiivisesti kirjoituksiaan. Se tuomitsee ne, jotka tarkoituksellisesti kirjoittavat valheita ja väittävät niiden olevan Allahilta, tehden niin maallisen hyödyn vuoksi, jota jae kuvaa \"kurjaksi hinnaksi\". Tämä on voimakas varoitus uskonnollisten tekstien korruptoimisesta henkilökohtaisen hyödyn tähden, korostaen vakavia seurauksia sekä valheiden kirjoittamisesta että siitä saadusta aineellisesta hyödystä. Tämä eroaa edellisessä jakeessa mainitusta tietämättömyydestä keskittyen tietoisten henkilöiden tarkoitukselliseen pettämiseen.","translations":{"opas":"Voi heitä heidän käsiensä kirjoituksen tähden, ja voi heitä heidän ansionsa tähden!","clear":"Voi niitä, jotka vääristelevät Kirjoituksia omin käsin ja sanovat sitten: ”Tämä on Jumalalta” – tavoitellen ohikiitävää hyötyä! Voi heitä siitä, mitä heidän kätensä ovat kirjoittaneet, ja voi heitä siitä, mitä he ovat ansainneet."}},{"verse":80,"commentary_en":"This verse addresses a false claim made by some among the Children of Israel: that they would only face punishment in the Fire for a limited number of days, if at all, due to a perceived special status with Allah. The response instructed here is a challenge: Do they have a specific, unbroken promise from Allah to this effect? Or are they simply making claims about Allah without any basis or knowledge? This directly questions the foundation of their assertion, suggesting it is based on unfounded assumption rather than divine revelation.","commentary_fi":"Tämä jae käsittelee joidenkin Israelin lasten tekemää väärää väitettä: että he kohtaisivat rangaistusta Tulessa vain rajoitetun määrän päiviä, jos lainkaan, johtuen havaitsemastaan erityisasemasta Allahin luona. Tässä ohjeistettu vastaus on haaste: Onko heillä tähän liittyvä erityinen, rikkumaton lupaus Allahilta? Vai esittävätkö he vain väitteitä Allahista ilman mitään perustetta tai tietoa? Tämä kyseenalaistaa suoraan heidän väitteensä perustan, vihjaten sen perustuvan perusteettomaan oletukseen eikä jumalalliseen ilmoitukseen.","arabic":"وَقَالُوا لَنْ تَمَسَّنَا النَّارُ إِلَّا أَيَّامًا مَعْدُودَةً ۚ قُلْ أَتَّخَذْتُمْ عِنْدَ اللَّهِ عَهْدًا فَلَنْ يُخْلِفَ اللَّهُ عَهْدَهُ ۖ أَمْ تَقُولُونَ عَلَى اللَّهِ مَا لَا تَعْلَمُونَ","commentary":"Tämä jae käsittelee joidenkin Israelin lasten tekemää väärää väitettä: että he kohtaisivat rangaistusta Tulessa vain rajoitetun määrän päiviä, jos lainkaan, johtuen havaitsemastaan erityisasemasta Allahin luona. Tässä ohjeistettu vastaus on haaste: Onko heillä tähän liittyvä erityinen, rikkumaton lupaus Allahilta? Vai esittävätkö he vain väitteitä Allahista ilman mitään perustetta tai tietoa? Tämä kyseenalaistaa suoraan heidän väitteensä perustan, vihjaten sen perustuvan perusteettomaan oletukseen eikä jumalalliseen ilmoitukseen.","translations":{"opas":"He sanovat: »Ei tuli meitä ahdista kuin joinakuina päivinä.» Sano: »Oletteko tehneet sopimuksen Jumalan kanssa? - liittoansa Jumala kylläkään ei riko - vai puhutteko jotain Jumalasta noin vain, vaikk'ette tiedäkään?»","clear":"˹Osa˺ juutalaisista väittää: ”Tuli ei kosketa meitä kuin muutaman päivän ajan.” Sano, ˹Oi Profeetta,˺ ”Oletteko ottaneet lupauksen Jumalalta – sillä Jumala ei koskaan riko sanaansa – vai sanotteko te ˹vain˺ Jumalasta sellaista, mitä ette tiedä?”"}},{"verse":81,"commentary_en":"This verse provides a definitive principle, serving as a direct refutation of the claim in the previous verse. It states clearly that eternal punishment in the Fire is for those who actively pursue evil (\"seek gain in evil\") and whose sins completely surround and engulf them. The imagery suggests that their wrongdoing has become their dominant characteristic and way of life. This establishes a universal rule of consequence for actions, overriding any claim of special privilege based on lineage or group identity.","commentary_fi":"Tämä jae tarjoaa lopullisen periaatteen, joka toimii suorana vastineena edellisessä jakeessa esitettyyn väitteeseen. Se toteaa selvästi, että ikuinen rangaistus Tulessa on niille, jotka aktiivisesti tavoittelevat pahaa (\"etsivät hyötyä pahassa\") ja joiden synnit ympäröivät ja nielevät heidät täysin. Kuvasto viittaa siihen, että heidän väärintekonsa on tullut heidän hallitsevaksi ominaisuudekseen ja elämäntavakseen. Tämä vahvistaa yleisen säännön tekojen seurauksista, ohittaen kaikki erityisoikeutta koskevat väitteet, jotka perustuvat sukulinjaan tai ryhmäidentiteettiin.","arabic":"بَلَىٰ مَنْ كَسَبَ سَيِّئَةً وَأَحَاطَتْ بِهِ خَطِيئَتُهُ فَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ","commentary":"Tämä jae tarjoaa lopullisen periaatteen, joka toimii suorana vastineena edellisessä jakeessa esitettyyn väitteeseen. Se toteaa selvästi, että ikuinen rangaistus Tulessa on niille, jotka aktiivisesti tavoittelevat pahaa (\"etsivät hyötyä pahassa\") ja joiden synnit ympäröivät ja nielevät heidät täysin. Kuvasto viittaa siihen, että heidän väärintekonsa on tullut heidän hallitsevaksi ominaisuudekseen ja elämäntavakseen. Tämä vahvistaa yleisen säännön tekojen seurauksista, ohittaen kaikki erityisoikeutta koskevat väitteet, jotka perustuvat sukulinjaan tai ryhmäidentiteettiin.","translations":{"opas":"Eivät asiat ole niin, vaan ne, jotka ovat omaksuneet pahan ja joita heidän syntinsä piirittävät, joutuvat Tulen omiksi ja jäävät siihen iankaikkisesti.","clear":"Vaan ei! Ne, jotka tekevät pahaa ja ovat uppoutuneet syntiin, ovat Tulen asukkaita. He tulevat olemaan siellä ikuisesti."}},{"verse":82,"commentary_en":"Following the previous verse's description of the fate of evildoers, this verse presents the contrasting outcome for those who believe and perform good deeds. It states that such individuals are destined for the Garden (Paradise) and will reside there eternally. This highlights the fundamental Islamic principle that salvation and eternal bliss are attained through genuine faith accompanied by righteous actions, providing a clear contrast to the misguided claims and actions described earlier in the passage.","commentary_fi":"Edellisen jakeen kuvaamaa pahantekijöiden kohtaloa seuraten tämä jae esittelee vastakkaisen lopputuloksen niille, jotka uskovat ja tekevät hyviä tekoja. Se toteaa, että tällaiset yksilöt on määrätty Puutarhaan (Paratiisiin) ja he asuvat siellä ikuisesti. Tämä korostaa perustavanlaatuista islamilaista periaatetta, jonka mukaan pelastus ja ikuinen autuus saavutetaan aidon uskon ja siihen liittyvien vanhurskaiden tekojen kautta, tarjoten selvän vastakohdan aiemmin kappaleessa kuvatuille harhaanjohtaville väitteille ja teoille.","arabic":"وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ ۖ هُمْ فِيهَا خَالِدُونَ","commentary":"Edellisen jakeen kuvaamaa pahantekijöiden kohtaloa seuraten tämä jae esittelee vastakkaisen lopputuloksen niille, jotka uskovat ja tekevät hyviä tekoja. Se toteaa, että tällaiset yksilöt on määrätty Puutarhaan (Paratiisiin) ja he asuvat siellä ikuisesti. Tämä korostaa perustavanlaatuista islamilaista periaatetta, jonka mukaan pelastus ja ikuinen autuus saavutetaan aidon uskon ja siihen liittyvien vanhurskaiden tekojen kautta, tarjoten selvän vastakohdan aiemmin kappaleessa kuvatuille harhaanjohtaville väitteille ja teoille.","translations":{"opas":"Mutta niistä, jotka uskovat ja tekevät hyviä töitä, tulee Paratiisin asukkaita ikuisiksi ajoiksi.","clear":"Ja ne, jotka uskovat ja tekevät hyvää, ovat Paratiisin asukkaita. He tulevat olemaan siellä ikuisesti."}},{"verse":83,"commentary_en":"This verse shifts focus to the covenant Allah took from them, which included essential moral and spiritual principles: worshipping only Allah, showing kindness to relatives, orphans, and the needy, speaking kindly to all, establishing prayer, and giving charity. These universal values affirm that Allah’s religion has remained consistent throughout human history, with Islam confirming and upholding the core teachings of earlier revelations. However, the verse points out that despite agreeing to this covenant, most turned away, with only a few remaining faithful—illustrating a recurring pattern of breaking their commitment to Allah. This sets the stage for the discussion of further violations to follow.","commentary_fi":"Tämä jae siirtää huomion siihen liittoon, jonka Allah teki heidän kanssaan. Liitto sisälsi keskeisiä moraalisia ja hengellisiä periaatteita: ainoastaan Allahin palvomisen, ystävällisyyden osoittamisen sukulaisia, orpoja ja köyhiä kohtaan, lempeän puheen kaikille ihmisille, rukouksen toimeenpanon ja almuveron antamisen. Nämä universaalit arvot vahvistavat sen, että Allahin uskonto on pysynyt samanlaisena ihmiskunnan historian läpi, ja islam vahvistaa sekä ylläpitää aiempien ilmoitusten ydinsisällön. Jaessa todetaan kuitenkin, että vaikka he olivat tämän liiton tehneet, suurin osa kääntyi siitä pois, vain harvojen pysyessä uskollisina – mikä kuvastaa toistuvaa kaavaa liiton rikkomisesta Allahin kanssa. Tämä toimii johdantona seuraaville rikkomuksille, joita tullaan käsittelemään.","arabic":"وَإِذْ أَخَذْنَا مِيثَاقَ بَنِي إِسْرَائِيلَ لَا تَعْبُدُونَ إِلَّا اللَّهَ وَبِالْوَالِدَيْنِ إِحْسَانًا وَذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَقُولُوا لِلنَّاسِ حُسْنًا وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ ثُمَّ تَوَلَّيْتُمْ إِلَّا قَلِيلًا مِنْكُمْ وَأَنْتُمْ مُعْرِضُونَ","commentary":"Tämä jae siirtää huomion siihen liittoon, jonka Allah teki heidän kanssaan. Liitto sisälsi keskeisiä moraalisia ja hengellisiä periaatteita: ainoastaan Allahin palvomisen, ystävällisyyden osoittamisen sukulaisia, orpoja ja köyhiä kohtaan, lempeän puheen kaikille ihmisille, rukouksen toimeenpanon ja almuveron antamisen. Nämä universaalit arvot vahvistavat sen, että Allahin uskonto on pysynyt samanlaisena ihmiskunnan historian läpi, ja islam vahvistaa sekä ylläpitää aiempien ilmoitusten ydinsisällön. Jaessa todetaan kuitenkin, että vaikka he olivat tämän liiton tehneet, suurin osa kääntyi siitä pois, vain harvojen pysyessä uskollisina – mikä kuvastaa toistuvaa kaavaa liiton rikkomisesta Allahin kanssa. Tämä toimii johdantona seuraaville rikkomuksille, joita tullaan käsittelemään.","translations":{"opas":"Entä kun Me solmimme liiton israelilaisten kanssa sanoen: »Teidän ei tule palvella ketään muuta kuin Jumalaa, kohdelkaa hyvin vanhempianne ja omaisianne, isättömiä ja köyhiä, hyvä olkoon puheenne kaikille ihmisille, harjoittakaa rukoilemista ja antakaa almuja!» Mutta te käännyitte pois ja luovuitte, muutamia lukuunottamatta.","clear":"Ja ˹muistakaa˺, kun otimme liiton Israelin lapsilta ˹sanoen˺: ”Palvokaa ainoastaan Jumalaa; olkaa ystävällisiä vanhemmille, sukulaisille, orvoille ja köyhille; puhukaa ystävällisesti ihmisille; suorittakaa rukous; ja maksakaa almuvero.” Mutta te ˹israelilaiset˺ käännyitte pois – muutamaanne lukuun ottamatta – ja olitte välinpitämättömiä."}},{"verse":84,"commentary_en":"Continuing the discussion of the covenant mentioned in the previous verse, this verse highlights specific prohibitions that were part of it: they were forbidden from shedding each other's blood and from expelling their own people from their homes. It emphasizes that they formally agreed to this covenant and could even bear witness to its terms. This sets the stage for the following verses which will contrast this solemn pledge with their later actions where they engaged in violence and expulsion against their own people.","commentary_fi":"Jatkaen edellisessä jakeessa mainittua liittoa, tämä jae korostaa tiettyjä kieltoja, jotka kuuluivat siihen: heiltä oli kielletty vuodattamasta toistensa verta ja karkottamasta omia ihmisiään kodeistaan. Se korostaa, että he virallisesti suostuivat tähän liittoon ja saattoivat jopa todistaa sen ehdoista. Tämä luo pohjan seuraaville jakeille, jotka asettavat tämän juhlallisen lupauksen vastakohtana heidän myöhemmille teoilleen, joissa he harjoittivat väkivaltaa ja karkotusta omia ihmisiään vastaan.","arabic":"وَإِذْ أَخَذْنَا مِيثَاقَكُمْ لَا تَسْفِكُونَ دِمَاءَكُمْ وَلَا تُخْرِجُونَ أَنْفُسَكُمْ مِنْ دِيَارِكُمْ ثُمَّ أَقْرَرْتُمْ وَأَنْتُمْ تَشْهَدُونَ","commentary":"Jatkaen edellisessä jakeessa mainittua liittoa, tämä jae korostaa tiettyjä kieltoja, jotka kuuluivat siihen: heiltä oli kielletty vuodattamasta toistensa verta ja karkottamasta omia ihmisiään kodeistaan. Se korostaa, että he virallisesti suostuivat tähän liittoon ja saattoivat jopa todistaa sen ehdoista. Tämä luo pohjan seuraaville jakeille, jotka asettavat tämän juhlallisen lupauksen vastakohtana heidän myöhemmille teoilleen, joissa he harjoittivat väkivaltaa ja karkotusta omia ihmisiään vastaan.","translations":{"opas":"Entä kun Me solmimme liiton kanssanne sanoen: »Alkää vuodattako toistenne verta, älkääkä karkoittako toisianne kodeistanne», ja te vahvistitte sen omalla todistuksellanne?","clear":"Ja muistakaa, kun teimme liiton teidän kanssanne, ettette vuodattaisi toistenne verta ettekä karkottaisi toisianne kodeistanne, te annoitte lupauksenne ja todistitte sen."}},{"verse":85,"commentary_en":"This verse highlights a pattern of behavior where some among the Children of Israel were reminded of solemn promises they made to Allah. Despite these promises, they engaged in practices like killing and exiling their own people, even assisting others against them, in violation of their covenant. Yet, if their fellow Israelites were taken captive by others, they would ransom them, which *was* in accordance with their scripture. The verse points out the contradiction in this selective adherence: believing in one part of their scripture (ransoming captives) while rejecting others (not shedding their own blood or exiling their people). For such actions, the verse warns of disgrace in this life and severe punishment on the Day of Judgment, emphasizing that Allah is fully aware of what they do. This verse connects to the previous ones by continuing the theme of recalling the covenant with Allah and highlighting deviations from it.","commentary_fi":"Tämä jae korostaa käyttäytymismallia, jossa osaa Israelin lapsista muistutettiin heidän Allahille antamistaan juhlallisista lupauksista. Näistä lupauksista huolimatta he syyllistyivät tekoihin, kuten omien ihmistensä tappamiseen ja karkottamiseen, jopa avustaen toisia heitä vastaan, rikkoen näin liittonsa. Kuitenkin, jos heidän israelilaisiaan joutui toisten vangiksi, he lunastivat heidät, mikä *oli* heidän pyhien kirjoitustensa mukaista. Jae huomauttaa ristiriitaisuudesta tässä valikoivassa noudattamisessa: uskottiin yhteen osaan heidän kirjoituksiaan (vankien lunastaminen) samalla kun torjuttiin toiset (ei oman veren vuodattamista tai kansalaisten karkottamista). Tällaisista teoista jae varoittaa häpeästä tässä elämässä ja ankarasta rangaistuksesta tuomiopäivänä, korostaen, että Allah on täysin tietoinen heidän teoistaan. Tämä jae kytkeytyy edellisiin, jatkaen teemaa Allahin kanssa tehdyn liiton muistuttamisesta ja poikkeamien korostamisesta.","arabic":"ثُمَّ أَنْتُمْ هَٰؤُلَاءِ تَقْتُلُونَ أَنْفُسَكُمْ وَتُخْرِجُونَ فَرِيقًا مِنْكُمْ مِنْ دِيَارِهِمْ تَظَاهَرُونَ عَلَيْهِمْ بِالْإِثْمِ وَالْعُدْوَانِ وَإِنْ يَأْتُوكُمْ أُسَارَىٰ تُفَادُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ ۚ أَفَتُؤْمِنُونَ بِبَعْضِ الْكِتَابِ وَتَكْفُرُونَ بِبَعْضٍ ۚ فَمَا جَزَاءُ مَنْ يَفْعَلُ ذَٰلِكَ مِنْكُمْ إِلَّا خِزْيٌ فِي الْحَيَاةِ الدُّنْيَا ۖ وَيَوْمَ الْقِيَامَةِ يُرَدُّونَ إِلَىٰ أَشَدِّ الْعَذَابِ ۗ وَمَا اللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ","commentary":"Tämä jae korostaa käyttäytymismallia, jossa osaa Israelin lapsista muistutettiin heidän Allahille antamistaan juhlallisista lupauksista. Näistä lupauksista huolimatta he syyllistyivät tekoihin, kuten omien ihmistensä tappamiseen ja karkottamiseen, jopa avustaen toisia heitä vastaan, rikkoen näin liittonsa. Kuitenkin, jos heidän israelilaisiaan joutui toisten vangiksi, he lunastivat heidät, mikä *oli* heidän pyhien kirjoitustensa mukaista. Jae huomauttaa ristiriitaisuudesta tässä valikoivassa noudattamisessa: uskottiin yhteen osaan heidän kirjoituksiaan (vankien lunastaminen) samalla kun torjuttiin toiset (ei oman veren vuodattamista tai kansalaisten karkottamista). Tällaisista teoista jae varoittaa häpeästä tässä elämässä ja ankarasta rangaistuksesta tuomiopäivänä, korostaen, että Allah on täysin tietoinen heidän teoistaan. Tämä jae kytkeytyy edellisiin, jatkaen teemaa Allahin kanssa tehdyn liiton muistuttamisesta ja poikkeamien korostamisesta.","translations":{"opas":"ja te kuitenkin surmaatte toisianne ja ajatte osan lähimmäisiänne mieron tielle, tukien toisianne synnissä ja ilkitöissä heitä vastaan. Sotavankeudesta te kylläkin heitä lunastelette, mutta vääryyttähän oli jo se, että heidät karkoititte. Uskotteko siis vain osaan Pyhästä kirjasta ja hylkäätte toisen osan? Mikä muu on sellaisten palkka, jotka niin tekevät, kuin häpeä maallisessa elämässä; ja Ylösnousemuksen päivänä tuomitaan heidät perin julmaan rangaistukseen, sillä Jumala ei ole välinpitämätön siitä, mitä te teette.","clear":"Mutta katso, te tapatte toisianne ja karkotatte osan kansastanne kodeistaan, auttaen toisianne synnissä ja vääryydessä; ja kun nuo karkotetut tulevat luoksenne vankeina, te silti lunastatte heidät – vaikka heidän karkottamisensa oli teille laitonta. Uskotteko osaan Kirjoituksista ja hylkäätte loput? Onko niiden palkka, jotka näin tekevät keskuudessanne, muuta kuin häpeä tässä maailmanelämässä ja ankarin rangaistus tuomiopäivänä? Sillä Allah ei ole koskaan tietämätön siitä, mitä te teette."}},{"verse":86,"commentary_en":"Following the previous verse’s mention of violating their covenant for worldly gain, this verse highlights the underlying motivation behind such actions. It explains that they traded the blessings and rewards of the Hereafter for the temporary benefits of this world. As a result of prioritizing worldly life in this way, the verse warns of a severe and unrelenting punishment in the Hereafter, with no support or relief. This verse thus reveals the deeper spiritual cost of the selective obedience and covenant-breaking described in verse 85.","commentary_fi":"Edellisen jakeen kuvatessa liiton rikkomista maallisten hyötyjen vuoksi, tämä jae paljastaa tällaisen toiminnan taustalla olevan motiivin. Se selittää, että he vaihtoivat Tuonpuoleisen siunaukset ja palkkiot tämän maailman hetkellisiin etuihin. Tämän maallisen elämän asettamisesta etusijalle seuraa kova ja hellittämätön rangaistus Tuonpuoleisessa, ilman tukea tai helpotusta. Näin jae tuo esiin valikoivan kuuliaisuuden ja liiton rikkomisen syvemmän hengellisen hinnan, josta puhuttiin jakeessa 85.","arabic":"أُولَٰئِكَ الَّذِينَ اشْتَرَوُا الْحَيَاةَ الدُّنْيَا بِالْآخِرَةِ ۖ فَلَا يُخَفَّفُ عَنْهُمُ الْعَذَابُ وَلَا هُمْ يُنْصَرُونَ","commentary":"Edellisen jakeen kuvatessa liiton rikkomista maallisten hyötyjen vuoksi, tämä jae paljastaa tällaisen toiminnan taustalla olevan motiivin. Se selittää, että he vaihtoivat Tuonpuoleisen siunaukset ja palkkiot tämän maailman hetkellisiin etuihin. Tämän maallisen elämän asettamisesta etusijalle seuraa kova ja hellittämätön rangaistus Tuonpuoleisessa, ilman tukea tai helpotusta. Näin jae tuo esiin valikoivan kuuliaisuuden ja liiton rikkomisen syvemmän hengellisen hinnan, josta puhuttiin jakeessa 85.","translations":{"opas":"He ovat niitä, jotka keinottelevat itselleen tämän maailman elämää tulevan kustannuksella; heidän rangaistustaan ei lievennetä, eikä kukaan ole puoltava heitä.","clear":"Nämä ovat niitä, jotka vaihtavat tulevan elämän tämän maailman elämään. Niinpä heidän rangaistustaan ei lievennetä, eikä heitä auteta."}},{"verse":87,"commentary_en":"This verse begins by reminding the Children of Israel of the long line of divine guidance sent to them, starting with Prophet Moses, who received the Torah, and continuing with subsequent messengers, including Prophet Jesus, who was given clear signs and supported by the holy spirit (understood in Islam as the Angel Gabriel). It then directly challenges their historical reaction to these messengers. Despite receiving such continuous guidance, their response was often arrogance and rejection when the message did not align with their personal desires or expectations. This history included accusing some messengers of lying and even killing others. This verse sets the stage for discussing their reaction to the final messenger, Prophet Muhammad, in the verses that follow, by highlighting a recurring pattern of resistance to divine messages throughout their history.","commentary_fi":"Tämä jae alkaa muistuttamalla Israelin lapsia heille lähetetystä pitkästä jumalallisen johdatuksen ketjusta, alkaen Profeetta Mooseksesta, joka sai Tooran, ja jatkuen peräkkäisillä lähettiläillä, mukaan lukien Profeetta Jeesus, jolle annettiin selviä tunnusmerkkejä ja jota vahvistettiin pyhällä hengellä (Islamilaisessa ymmärryksessä enkeli Gabrielilla). Sitten se haastaa suoraan heidän historiallisen reaktionsa näihin lähettiläisiin. Tästä jatkuvasta johdatuksesta huolimatta heidän vastauksensa oli usein ylimielisyyttä ja torjuntaa, kun sanoma ei ollut heidän henkilökohtaisten toiveidensa tai odotustensa mukainen. Tämä historia sisälsi syytöksiä joidenkin lähettiläiden valehtelusta ja jopa toisten tappamista. Tämä jae luo pohjan heidän reaktionsa käsittelylle lopulliseen lähettilääseen, Profeetta Muhammadiin, seuraavissa jakeissa, korostamalla toistuvaa vastarinnan mallia jumalallisille sanomille heidän historiansa aikana.","arabic":"وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ وَقَفَّيْنَا مِنْ بَعْدِهِ بِالرُّسُلِ ۖ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ ۗ أَفَكُلَّمَا جَاءَكُمْ رَسُولٌ بِمَا لَا تَهْوَىٰ أَنْفُسُكُمُ اسْتَكْبَرْتُمْ فَفَرِيقًا كَذَّبْتُمْ وَفَرِيقًا تَقْتُلُونَ","commentary":"Tämä jae alkaa muistuttamalla Israelin lapsia heille lähetetystä pitkästä jumalallisen johdatuksen ketjusta, alkaen Profeetta Mooseksesta, joka sai Tooran, ja jatkuen peräkkäisillä lähettiläillä, mukaan lukien Profeetta Jeesus, jolle annettiin selviä tunnusmerkkejä ja jota vahvistettiin pyhällä hengellä (Islamilaisessa ymmärryksessä enkeli Gabrielilla). Sitten se haastaa suoraan heidän historiallisen reaktionsa näihin lähettiläisiin. Tästä jatkuvasta johdatuksesta huolimatta heidän vastauksensa oli usein ylimielisyyttä ja torjuntaa, kun sanoma ei ollut heidän henkilökohtaisten toiveidensa tai odotustensa mukainen. Tämä historia sisälsi syytöksiä joidenkin lähettiläiden valehtelusta ja jopa toisten tappamista. Tämä jae luo pohjan heidän reaktionsa käsittelylle lopulliseen lähettilääseen, Profeetta Muhammadiin, seuraavissa jakeissa, korostamalla toistuvaa vastarinnan mallia jumalallisille sanomille heidän historiansa aikana.","translations":{"opas":"Olemmehan totisesti antanut Moosekselle Pyhän kirjan ja lähettänyt profeetat hänen jälkeensä, ja Me olemme antanut Jeesukselle, Marian pojalle, selvät todistukset ja tukenut häntä Pyhällä hengellä . Mutta joka kerta kun profeetta on tullut luoksenne, tuoden mukanaan sellaista, mikä ei teitä miellytä, olette käyneet röyhkeiksi ja pitäneet toisia heistä valehtelijoina, toisia surmanneetkin.","clear":"Totisesti, Me annoimme Moosekselle Kirjan ja lähetimme hänen jälkeensä peräkkäisiä sanansaattajia. Ja Me annoimme Jeesukselle, Marian pojalle, selvät todisteet ja tuimme häntä pyhällä hengellä. Miksi joka kerta, kun sanansaattaja tulee luoksenne ˹israelilaiset˺ tuoden jotain, mistä ette pidä, te muututte ylimielisiksi, hyläten osan ja tappaen toiset?"}},{"verse":88,"commentary_en":"This verse addresses a claim made by some among the Children of Israel when they were called to accept Prophet Muhammad and the message of the Qur'an. They responded by saying, \"Our hearts are sealed,\" implying either sufficiency in their existing knowledge or an inability to comprehend the new message. The verse firmly refutes this claim, stating that it was not an inherent condition but a consequence of their own disbelief and rejection of the truth. Their hearts became unreceptive because they turned away first. As a result, Allah distanced them, and their faith is described as minimal. This verse highlights their initial reaction to the call of Islam and exposes the weakness of their justification for rejection, setting the stage for further rebuttals in the verses that follow.","commentary_fi":"Tämä jae käsittelee joidenkin Israelin lasten esittämää väitettä, kun heitä kehotettiin hyväksymään profeetta Muhammed ja Koraanin sanoma. He vastasivat sanomalla: \"Sydämemme ovat sinetöidyt\", viitaten joko siihen, että heidän nykyinen tietonsa riittää, tai että he eivät kykene ymmärtämään uutta sanomaa. Jae torjuu tämän väitteen voimakkaasti ja selventää, ettei kyse ole synnynnäisestä tilasta, vaan seurausta heidän epäuskostaan ja totuuden torjumisesta. Heidän sydämensä sulkeutuivat, koska he itse kieltäytyivät ensin. Tämän seurauksena Allah loitonsi heidät, ja heidän uskonsa kuvataan hyvin vähäiseksi. Tämä jae tuo esiin heidän alkuperäisen reaktionsa islamin kutsuun ja paljastaa heidän hylkäyksensä perustelujen heikkouden, valmistellen lukijaa seuraavissa jakeissa esitettäviin vastaväitteisiin.","arabic":"وَقَالُوا قُلُوبُنَا غُلْفٌ ۚ بَلْ لَعَنَهُمُ اللَّهُ بِكُفْرِهِمْ فَقَلِيلًا مَا يُؤْمِنُونَ","commentary":"Tämä jae käsittelee joidenkin Israelin lasten esittämää väitettä, kun heitä kehotettiin hyväksymään profeetta Muhammed ja Koraanin sanoma. He vastasivat sanomalla: \"Sydämemme ovat sinetöidyt\", viitaten joko siihen, että heidän nykyinen tietonsa riittää, tai että he eivät kykene ymmärtämään uutta sanomaa. Jae torjuu tämän väitteen voimakkaasti ja selventää, ettei kyse ole synnynnäisestä tilasta, vaan seurausta heidän epäuskostaan ja totuuden torjumisesta. Heidän sydämensä sulkeutuivat, koska he itse kieltäytyivät ensin. Tämän seurauksena Allah loitonsi heidät, ja heidän uskonsa kuvataan hyvin vähäiseksi. Tämä jae tuo esiin heidän alkuperäisen reaktionsa islamin kutsuun ja paljastaa heidän hylkäyksensä perustelujen heikkouden, valmistellen lukijaa seuraavissa jakeissa esitettäviin vastaväitteisiin.","translations":{"opas":"He sanovat: »Sydämemme ovat ympärileikkaamattomia.» Niin, Jumala on kironnut heidät heidän epäuskonsa tähden, sillä vähän on heidän joukossaan niitä, jotka uskovat.","clear":"He sanovat: ”Sydämemme ovat vastaanottavaiset!” Itse asiassa Allah on tuominnut heidät heidän epäuskoisuutensa vuoksi. Heillä on vain vähän uskoa."}},{"verse":89,"commentary_en":"This verse points out another inconsistency in the behavior of some among the Children of Israel regarding the advent of the Qur'an. They had previously anticipated the coming of a prophet and a book that would confirm their scriptures, and had even spoken about this with the pagan Arabs, expecting that this advent would bring them victory over their enemies. However, when the Qur'an came through Prophet Muhammad, fulfilling the description of a book confirming their own scriptures, they refused to believe in it, despite recognizing its truth. The verse condemns this denial of something they knew to be true and calls down Allah's curse upon those who actively disbelieve. This highlights their denial not just as a matter of ignorance, but as a conscious rejection of a known truth, linking their past anticipation to their current denial.","commentary_fi":"Tämä jae osoittaa toisen epäjohdonmukaisuuden joidenkin Israelin lasten käyttäytymisessä koskien Koraanin tuloa. He olivat aiemmin ennakoineet profeetan ja kirjan tulemista, joka vahvistaisi heidän kirjoituksensa, ja olivat jopa puhuneet tästä pakanallisten arabien kanssa, odottaen, että tämä tulo toisi heille voiton vihollisistaan. Kuitenkin, kun Koraani tuli Profeetta Muhammadin kautta, täyttäen kuvauksen heidän omia kirjoituksiaan vahvistavasta kirjasta, he kieltäytyivät uskomaan siihen, vaikka tunnustivat sen totuuden. Jae tuomitsee tämän kieltämisen jostakin, minkä he tiesivät olevan totta, ja kutsuu Allahin kirouksen niiden ylle, jotka aktiivisesti epäuskoon. Tämä korostaa heidän kieltämistään ei pelkästään tietämättömyytenä, vaan tietoisena totuuden torjumisena, yhdistäen heidän menneen ennakoinnin heidän nykyiseen kieltämiseensä.","arabic":"وَلَمَّا جَاءَهُمْ كِتَابٌ مِنْ عِنْدِ اللَّهِ مُصَدِّقٌ لِمَا مَعَهُمْ وَكَانُوا مِنْ قَبْلُ يَسْتَفْتِحُونَ عَلَى الَّذِينَ كَفَرُوا فَلَمَّا جَاءَهُمْ مَا عَرَفُوا كَفَرُوا بِهِ ۚ فَلَعْنَةُ اللَّهِ عَلَى الْكَافِرِينَ","commentary":"Tämä jae osoittaa toisen epäjohdonmukaisuuden joidenkin Israelin lasten käyttäytymisessä koskien Koraanin tuloa. He olivat aiemmin ennakoineet profeetan ja kirjan tulemista, joka vahvistaisi heidän kirjoituksensa, ja olivat jopa puhuneet tästä pakanallisten arabien kanssa, odottaen, että tämä tulo toisi heille voiton vihollisistaan. Kuitenkin, kun Koraani tuli Profeetta Muhammadin kautta, täyttäen kuvauksen heidän omia kirjoituksiaan vahvistavasta kirjasta, he kieltäytyivät uskomaan siihen, vaikka tunnustivat sen totuuden. Jae tuomitsee tämän kieltämisen jostakin, minkä he tiesivät olevan totta, ja kutsuu Allahin kirouksen niiden ylle, jotka aktiivisesti epäuskoon. Tämä korostaa heidän kieltämistään ei pelkästään tietämättömyytenä, vaan tietoisena totuuden torjumisena, yhdistäen heidän menneen ennakoinnin heidän nykyiseen kieltämiseensä.","translations":{"opas":"Ja kun heille tuli Pyhä kirja Jumalalta , vahvistaen toisen, minkä he jo omistivat, - olivathan he vastikään rukoilleet itselleen voittoa epäuskoisista - kun siis nyt se, minkä he tunsivat todeksi, tuli heidän osalleen, eivät he uskoneet sitä. Jumalan kirous uskottomien yli!","clear":"Vaikka he aiemmin rukoilivat voittoa ˹Profeetan avulla˺ monijumalaisista, kun heille tuli Jumalalta Kirja, jonka he tunnistivat vahvistavan heidän ˹käsissään olevan˺ pyhän kirjoituksen, he hylkäsivät sen. Olkoon siis Jumalan tuomio epäuskoisten yllä."}},{"verse":90,"commentary_en":"This verse highlights the spiritual loss of those who denied the Qur'an and reveals the underlying motive behind their rejection. They exchanged faith for disbelief at a worthless price. The main reason for their denial, according to the verse, was envy: they resented that Allah, in His grace, chose Prophet Muhammad, one of His servants, to receive the revelation. Their refusal to accept someone chosen by Allah reflects arrogance and narrow-mindedness. As a result, they incurred Allah’s wrath more than once. Their envy ultimately led them to rejection, earning them a humiliating punishment. This verse exposes the internal spiritual corruption—envy—that fueled their outward denial and emphasizes its serious consequences.","commentary_fi":"Tämä jae tuo esiin niiden hengellisen menetyksen, jotka kielsivät Koraanin, ja paljastaa heidän torjuntansa taustalla olevan motiivin. He vaihtoivat uskonsa epäuskoon mitättömään hintaan. Jakeen mukaan heidän torjuntansa pääasiallinen syy oli kateus: he eivät sietäneet sitä, että Allah armossaan valitsi Profeetta Muhammadin—yhden palvelijoistaan—saamaan ilmoituksen. Heidän kieltäytymisensä hyväksyä Allahin valitsema henkilö kuvastaa ylpeyttä ja ahdasmielisyyttä. Tämän seurauksena he joutuivat Allahin vihan kohteeksi useammin kuin kerran. Heidän kateutensa johti lopulta uskon hylkäämiseen ja toi heille nöyryyttävän rangaistuksen. Tämä jae paljastaa ulkoisen torjunnan taustalla olevan sisäisen hengellisen turmeluksen—kateuden—ja korostaa sen vakavia seurauksia.","arabic":"بِئْسَمَا اشْتَرَوْا بِهِ أَنْفُسَهُمْ أَنْ يَكْفُرُوا بِمَا أَنْزَلَ اللَّهُ بَغْيًا أَنْ يُنَزِّلَ اللَّهُ مِنْ فَضْلِهِ عَلَىٰ مَنْ يَشَاءُ مِنْ عِبَادِهِ ۖ فَبَاءُوا بِغَضَبٍ عَلَىٰ غَضَبٍ ۚ وَلِلْكَافِرِينَ عَذَابٌ مُهِينٌ","commentary":"Tämä jae tuo esiin niiden hengellisen menetyksen, jotka kielsivät Koraanin, ja paljastaa heidän torjuntansa taustalla olevan motiivin. He vaihtoivat uskonsa epäuskoon mitättömään hintaan. Jakeen mukaan heidän torjuntansa pääasiallinen syy oli kateus: he eivät sietäneet sitä, että Allah armossaan valitsi Profeetta Muhammadin—yhden palvelijoistaan—saamaan ilmoituksen. Heidän kieltäytymisensä hyväksyä Allahin valitsema henkilö kuvastaa ylpeyttä ja ahdasmielisyyttä. Tämän seurauksena he joutuivat Allahin vihan kohteeksi useammin kuin kerran. Heidän kateutensa johti lopulta uskon hylkäämiseen ja toi heille nöyryyttävän rangaistuksen. Tämä jae paljastaa ulkoisen torjunnan taustalla olevan sisäisen hengellisen turmeluksen—kateuden—ja korostaa sen vakavia seurauksia.","translations":{"opas":"Mihin surkuteltavaan hintaan ovatkaan he myyneet sielunsa hylätessään Jumalan ilmoituksen, katsoessaan karsaasti sitä, että Jumala armonsa runsaudesta lähettää ilmestyksiään kenelle tahtoo palvelijoittensa joukossa! He ovat koonneet ylitsensä vihaa vihan päälle. Uskottomia odottaa häpeällinen rangaistus.","clear":"Kurjaa on hinta, jolla he ovat myyneet sielunsa – kieltäen Jumalan ilmoituksen ja paheksuen Jumalaa Hänen suodessaan armonsa kenelle tahansa palvelijoistaan Hän tahtoo! He ovat ansainneet vihan vihan päälle. Ja sellaiset epäuskoiset kärsivät nöyryyttävän rangaistuksen."}},{"verse":91,"commentary_en":"This verse presents the argument used by some among the Children of Israel when called upon to believe in the Qur'an: \"We believe in what was sent down to us,\" referring to their own scriptures. However, as the verse points out, they rejected everything else, including the Qur'an, even though it is the truth and confirms the revelations they already possess—highlighting the inconsistency in their stance. Prophet Muhammad is instructed to challenge their claim by asking, \"Why then did you kill Allah’s prophets before, if you were true believers?\" This powerful question, based on their own history, directly contradicts their claim of faith in their scriptures and prophets, preparing the way for the following verses which give specific examples.","commentary_fi":"Tämä jae esittää väitteen, jota jotkut Israelin lasten joukosta käyttivät, kun heitä kehotettiin uskomaan Koraaniin: \"Me uskomme siihen, mikä on lähetetty meille\", viitaten heidän omiin kirjoituksiinsa. Kuitenkin, kuten jae osoittaa, he hylkäsivät kaiken muun, mukaan lukien Koraanin, vaikka se on totta ja vahvistaa ne ilmestykset, jotka he jo omistavat – mikä paljastaa ristiriidan heidän kannassaan. Profeetta Muhammadin käsketään haastaa heidän väitteensä kysymällä: \"Miksi sitten tapoitte Allahin profeettoja aiemmin, jos olitte todellisia uskovia?\" Tämä voimakas kysymys, joka perustuu heidän omaan historiaansa, kumoaa suoraan heidän väitteensä uskosta kirjoituksiinsa ja profeettoihinsa, ja valmistaa seuraavat jakeet, jotka tarjoavat konkreettisia esimerkkejä.","arabic":"وَإِذَا قِيلَ لَهُمْ آمِنُوا بِمَا أَنْزَلَ اللَّهُ قَالُوا نُؤْمِنُ بِمَا أُنْزِلَ عَلَيْنَا وَيَكْفُرُونَ بِمَا وَرَاءَهُ وَهُوَ الْحَقُّ مُصَدِّقًا لِمَا مَعَهُمْ ۗ قُلْ فَلِمَ تَقْتُلُونَ أَنْبِيَاءَ اللَّهِ مِنْ قَبْلُ إِنْ كُنْتُمْ مُؤْمِنِينَ","commentary":"Tämä jae esittää väitteen, jota jotkut Israelin lasten joukosta käyttivät, kun heitä kehotettiin uskomaan Koraaniin: \"Me uskomme siihen, mikä on lähetetty meille\", viitaten heidän omiin kirjoituksiinsa. Kuitenkin, kuten jae osoittaa, he hylkäsivät kaiken muun, mukaan lukien Koraanin, vaikka se on totta ja vahvistaa ne ilmestykset, jotka he jo omistavat – mikä paljastaa ristiriidan heidän kannassaan. Profeetta Muhammadin käsketään haastaa heidän väitteensä kysymällä: \"Miksi sitten tapoitte Allahin profeettoja aiemmin, jos olitte todellisia uskovia?\" Tämä voimakas kysymys, joka perustuu heidän omaan historiaansa, kumoaa suoraan heidän väitteensä uskosta kirjoituksiinsa ja profeettoihinsa, ja valmistaa seuraavat jakeet, jotka tarjoavat konkreettisia esimerkkejä.","translations":{"opas":"Kun heille sanotaan: »Uskokaa siihen, mitä Jumala on tuonut ilmi», he vastaavat: »Me uskomme siihen, mitä meille on ilmoitettu. Ja kohta he torjuvat sen, mikä myöhemmin on ilmoitettu, vaikka se on itse totuus, vahvistus siihen, minkä he jo omistavat.","clear":"Kun heille sanotaan: ”Uskokaa siihen, minkä Jumala on ilmoittanut”, he vastaavat: ”Me uskomme vain siihen, mikä meille lähetettiin”, ja he kieltävät sen, mikä tuli sen jälkeen, vaikka se on totuus, joka vahvistaa heidän omat Pyhät kirjoituksensa! Kysy ˹heiltä, oi Profeetta˺: ”Miksi sitten tapoitte Jumalan profeetat aikaisemmin, jos olette ˹todella˺ uskovia?”"}},{"verse":92,"commentary_en":"Continuing the challenge posed in the previous verse (\"Why then have you killed Allah's prophets... if you were true believers?\"), this verse provides a specific example of their historical behavior that contradicts their claim of faith in what was sent to them. It reminds them that Prophet Moses came to them with clear signs and proofs of his prophethood and Allah's message. Despite this, after Moses left them temporarily, they worshipped the calf. This act of worshipping something other than Allah, while Prophet Moses was still alive and after receiving clear guidance, fundamentally undermines their claim of believing in the revelations given to them. This serves as strong evidence against their assertion in Verse 91.","commentary_fi":"Jatkaen edellisessä jakeessa esitettyä haastetta (\"Miksi sitten olette tappaneet Allahin profeettoja... jos todella uskotte?\"), tämä jae tarjoaa konkreettisen esimerkin heidän historiallisesta käyttäytymisestään, joka on ristiriidassa heidän väitteensä kanssa uskoa siihen, mitä heille lähetettiin. Se muistuttaa heitä siitä, että Profeetta Mooses tuli heidän luokseen selvin tunnusmerkein ja todistein hänen profeetan asemastaan ja Allahin sanomasta. Tästä huolimatta, kun Mooses poistui tilapäisesti heidän luotaan, he palvoivat vasikkaa. Tämä teko, jossa palvottiin jotain muuta kuin Allahia, samalla kun Profeetta Mooses oli vielä elossa ja selkeän johdatuksen saamisen jälkeen, heikentää perustavanlaatuisesti heidän väitettään siitä, että he uskovat heille annettuihin ilmoituksiin. Tämä toimii vahvana todisteena heidän väitettään vastaan Jakeessa 91.","arabic":"وَلَقَدْ جَاءَكُمْ مُوسَىٰ بِالْبَيِّنَاتِ ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِنْ بَعْدِهِ وَأَنْتُمْ ظَالِمُونَ","commentary":"Jatkaen edellisessä jakeessa esitettyä haastetta (\"Miksi sitten olette tappaneet Allahin profeettoja... jos todella uskotte?\"), tämä jae tarjoaa konkreettisen esimerkin heidän historiallisesta käyttäytymisestään, joka on ristiriidassa heidän väitteensä kanssa uskoa siihen, mitä heille lähetettiin. Se muistuttaa heitä siitä, että Profeetta Mooses tuli heidän luokseen selvin tunnusmerkein ja todistein hänen profeetan asemastaan ja Allahin sanomasta. Tästä huolimatta, kun Mooses poistui tilapäisesti heidän luotaan, he palvoivat vasikkaa. Tämä teko, jossa palvottiin jotain muuta kuin Allahia, samalla kun Profeetta Mooses oli vielä elossa ja selkeän johdatuksen saamisen jälkeen, heikentää perustavanlaatuisesti heidän väitettään siitä, että he uskovat heille annettuihin ilmoituksiin. Tämä toimii vahvana todisteena heidän väitettään vastaan Jakeessa 91.","translations":{"opas":"Sano (heille, Muhammed): »Miksi te surmasitte Jumalan profeettoja jo muinoin, jos muka olitte uskovaisia?»","clear":"Totisesti Mooses tuli luoksenne selvin todistein, sitten te palvoitte vasikkaa hänen poissa ollessaan toimien väärin."}},{"verse":93,"commentary_en":"This verse presents another historical example involving Prophet Moses that challenges the claim of faith made in Verse 91. It recalls the solemn covenant Allah took with them at Mount Sinai, where the mountain was raised above them as a powerful reminder to accept the divine law with seriousness and obedience. Despite their outward commitment, their true attitude was revealed in the statement: \"We hear, and we disobey.\" The verse further explains that their earlier worship of the calf left a deep mark on their hearts, reflecting how their lack of faith allowed love for the idol to become deeply rooted. Prophet Muhammad is then instructed to declare how terrible the consequences of such \"faith\" must be if it leads to disobedience and contradiction. This verse further exposes the shallowness of their claimed faith by referencing their historical actions and mindset, setting the stage for the next verse’s challenge about the hereafter.","commentary_fi":"Tämä jae esittää toisen historiallisen esimerkin, joka liittyy profeetta Moosekseen ja haastaa jakeessa 91 esitetyn uskon väitteen. Siinä muistutetaan vakavasta liitosta, jonka Allah teki heidän kanssaan Siinain vuorella – niin merkittävä tapahtuma, että vuori kohotettiin heidän ylleen voimallisena muistutuksena siitä, että heidän tuli ottaa Jumalan laki vakavasti ja kuuliaisesti vastaan. Huolimatta ulkoisesta sitoumuksestaan heidän todellinen asenteensa paljastui sanoissa: \"Me kuulimme, mutta kapinoimme.\" Jaessa kerrotaan myös, että heidän aikaisempi vasikanpalvontansa jätti syvän jäljen heidän sydämiinsä, mikä osoittaa, kuinka epäusko antoi epäjumalan rakkauden juurtua heihin. Profeetta Muhammadin käsketään sitten julistaa, kuinka hirvittäviä ovatkaan sellaisen \"uskon\" seuraukset, jos se johtaa tällaiseen tottelemattomuuteen ja ristiriitaisuuteen. Tämä jae paljastaa entisestään heidän väitetyn uskonsa tyhjyyden viittaamalla heidän menneisiin tekoihinsa ja asenteisiinsa, valmistellen seuraavaa jaetta, jossa heitä haastetaan tuonpuoleisesta.","arabic":"وَإِذْ أَخَذْنَا مِيثَاقَكُمْ وَرَفَعْنَا فَوْقَكُمُ الطُّورَ خُذُوا مَا آتَيْنَاكُمْ بِقُوَّةٍ وَاسْمَعُوا ۖ قَالُوا سَمِعْنَا وَعَصَيْنَا وَأُشْرِبُوا فِي قُلُوبِهِمُ الْعِجْلَ بِكُفْرِهِمْ ۚ قُلْ بِئْسَمَا يَأْمُرُكُمْ بِهِ إِيمَانُكُمْ إِنْ كُنْتُمْ مُؤْمِنِينَ","commentary":"Tämä jae esittää toisen historiallisen esimerkin, joka liittyy profeetta Moosekseen ja haastaa jakeessa 91 esitetyn uskon väitteen. Siinä muistutetaan vakavasta liitosta, jonka Allah teki heidän kanssaan Siinain vuorella – niin merkittävä tapahtuma, että vuori kohotettiin heidän ylleen voimallisena muistutuksena siitä, että heidän tuli ottaa Jumalan laki vakavasti ja kuuliaisesti vastaan. Huolimatta ulkoisesta sitoumuksestaan heidän todellinen asenteensa paljastui sanoissa: \"Me kuulimme, mutta kapinoimme.\" Jaessa kerrotaan myös, että heidän aikaisempi vasikanpalvontansa jätti syvän jäljen heidän sydämiinsä, mikä osoittaa, kuinka epäusko antoi epäjumalan rakkauden juurtua heihin. Profeetta Muhammadin käsketään sitten julistaa, kuinka hirvittäviä ovatkaan sellaisen \"uskon\" seuraukset, jos se johtaa tällaiseen tottelemattomuuteen ja ristiriitaisuuteen. Tämä jae paljastaa entisestään heidän väitetyn uskonsa tyhjyyden viittaamalla heidän menneisiin tekoihinsa ja asenteisiinsa, valmistellen seuraavaa jaetta, jossa heitä haastetaan tuonpuoleisesta.","translations":{"opas":"Mooseskin tuli luoksenne mukanaan selvät todistukset (Jumalan kaikkivaltiudesta), mutta kun hän oli poissa, te teitte vasikankuvan palvoaksenne, koska olitte jumalattomia.","clear":"Ja kun otimme liittonne ja nostimme vuoren ylitsenne ˹sanoen˺: ”Pitäkää lujasti kiinni siitä ˹Pyhästä kirjoituksesta˺, jonka olemme teille antaneet, ja totelkaa”, he vastasivat: ”Me kuulemme ja olemme tottelemattomia.” Vasikan rakkaus oli juurtunut heidän sydämiinsä heidän epäuskon takia. Sano, ˹oi Profeetta,˺: ”Kuinka pahaa on se, mihin teidän ˹niin sanottu˺ uskonne teitä yllyttää, jos te ˹todella˺ uskotte ˹Tooraan˺!”"}},{"verse":94,"commentary_en":"This verse addresses a claim made by some among the Children of Israel—that Paradise, the final abode with Allah, is reserved exclusively for them. This assertion aimed to elevate their status and possibly weaken the faith of Muslims. In response, Prophet Muhammad is instructed to challenge their claim: “If the Last Home with Allah is truly for you alone, and not for others, then wish for death—if you are truthful.\" The logic is clear: if they genuinely believed they were guaranteed salvation, they would not fear death, which would bring them to their promised reward. Their reluctance to do so reveals the insincerity of their claim. The verse effectively exposes the contradiction between their words and actions—particularly in light of their history of covenant-breaking and rejection of prophets—suggesting that such behavior is inconsistent with those who are truly favored by Allah.","commentary_fi":"Tämä jae käsittelee joidenkin israelilaisten esittämää väitettä, että Paratiisi – Allahin luona oleva viimeinen asuinpaikka – olisi varattu yksinomaan heille. Tällaisella väitteellä he pyrkivät korostamaan erityisasemaansa ja mahdollisesti horjuttamaan muslimien uskoa. Vastauksena tähän väitteeseen Profeetta Muhammedia kehotetaan haastamaan heidät: \"Jos viimeinen koti Allahin luona on todella vain teitä varten eikä kenellekään muulle, niin toivokaa kuolemaa – jos puhutte totta.\" Logiikka on selvä: jos he todella uskoisivat olevansa taatun pelastuksen saajia, he eivät pelkäisi kuolemaa, joka veisi heidät tuohon luvattuun palkintoon. Se, etteivät he halua sitä, paljastaa heidän väitteensä vilpillisyyden. Jaessa paljastuu ristiriita heidän sanojensa ja tekojensa välillä – erityisesti kun otetaan huomioon heidän historiansa liiton rikkomisessa ja profeettojen torjumisessa – mikä viittaa siihen, että heidän käytöksensä ei vastaa sellaisten ihmisten käytöstä, jotka todella nauttivat Allahin erityistä suosiota.","arabic":"قُلْ إِنْ كَانَتْ لَكُمُ الدَّارُ الْآخِرَةُ عِنْدَ اللَّهِ خَالِصَةً مِنْ دُونِ النَّاسِ فَتَمَنَّوُا الْمَوْتَ إِنْ كُنْتُمْ صَادِقِينَ","commentary":"Tämä jae käsittelee joidenkin israelilaisten esittämää väitettä, että Paratiisi – Allahin luona oleva viimeinen asuinpaikka – olisi varattu yksinomaan heille. Tällaisella väitteellä he pyrkivät korostamaan erityisasemaansa ja mahdollisesti horjuttamaan muslimien uskoa. Vastauksena tähän väitteeseen Profeetta Muhammedia kehotetaan haastamaan heidät: \"Jos viimeinen koti Allahin luona on todella vain teitä varten eikä kenellekään muulle, niin toivokaa kuolemaa – jos puhutte totta.\" Logiikka on selvä: jos he todella uskoisivat olevansa taatun pelastuksen saajia, he eivät pelkäisi kuolemaa, joka veisi heidät tuohon luvattuun palkintoon. Se, etteivät he halua sitä, paljastaa heidän väitteensä vilpillisyyden. Jaessa paljastuu ristiriita heidän sanojensa ja tekojensa välillä – erityisesti kun otetaan huomioon heidän historiansa liiton rikkomisessa ja profeettojen torjumisessa – mikä viittaa siihen, että heidän käytöksensä ei vastaa sellaisten ihmisten käytöstä, jotka todella nauttivat Allahin erityistä suosiota.","translations":{"opas":"Entä kun Me solmimme liiton kanssanne (Siinain) vuoren kohotessa ylitsenne ja sanoimme: »Pysykää lujasti siinä, minkä olemme ilmoittanut teille, ja kuulkaa (sanojamme) »! He vastasivat: »Me kuulemme ja uhmailemme». Heidän sydämensä kiintyi vasikan palvontaan, ja he hylkäsivät Meidän liittomme. Sano (heille): »Surkeata on se, mitä uskonne teille tarjoaa, jos muka olette uskovaisia.» Sano: »Jos tulevan elämän asumukset Jumalan luona ovat todella tarkoitetut ainoastaan teille eikä muille ihmisille (kuten väitätte), niin toivokaa itsellenne kuolemaa (sillä onhan teidän halattava majan muuttoa), jos pysytte totuudessa.»","clear":"Sano, [oi Profeetta,] ”Jos iankaikkinen tuonpuoleinen koti Jumalan luona on yksinomaan teidän [israeliittien] eikä muiden ihmisten, niin toivokaa kuolemaa, jos puheenne on totta!”"}},{"verse":95,"commentary_en":"Following a challenge in the previous verse for those who claim paradise is exclusively theirs to wish for death if their claim is true, this verse explains their unwillingness to do so. It tells us that they will never wish for death because of the deeds they have committed in this life. Their actions have led them to a state where they fear what awaits them after death. This indicates that they are aware of their wrongdoing. The verse concludes by stating that Allah has full knowledge of those who commit wrong.","commentary_fi":"Edellisen jakeen haasteen jälkeen niille, jotka väittävät Paratiisin kuuluvan yksin heille, toivoa kuolemaa, jos heidän väitteensä pitää paikkansa, tämä jae selittää heidän haluttomuutensa tehdä niin. Se kertoo, etteivät he koskaan toivo kuolemaa tekojensa vuoksi, joita he ovat tehneet tässä elämässä. Heidän tekonsa ovat johtaneet tilaan, jossa he pelkäävät sitä, mikä heitä odottaa kuoleman jälkeen. Tämä osoittaa, että he ovat tietoisia väärinteoistaan. Jae päättyy toteamukseen, että Allah tietää täysin ne, jotka tekevät väärin.","arabic":"وَلَنْ يَتَمَنَّوْهُ أَبَدًا بِمَا قَدَّمَتْ أَيْدِيهِمْ ۗ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ","commentary":"Edellisen jakeen haasteen jälkeen niille, jotka väittävät Paratiisin kuuluvan yksin heille, toivoa kuolemaa, jos heidän väitteensä pitää paikkansa, tämä jae selittää heidän haluttomuutensa tehdä niin. Se kertoo, etteivät he koskaan toivo kuolemaa tekojensa vuoksi, joita he ovat tehneet tässä elämässä. Heidän tekonsa ovat johtaneet tilaan, jossa he pelkäävät sitä, mikä heitä odottaa kuoleman jälkeen. Tämä osoittaa, että he ovat tietoisia väärinteoistaan. Jae päättyy toteamukseen, että Allah tietää täysin ne, jotka tekevät väärin.","translations":{"opas":"Mutta he eivät tule koskaan halajamaan sitä, koske he pelkäävät kättensä töiden seurauksia. Jumala tuntee väärintekijät.","clear":"Mutta he eivät koskaan toivo sitä sen tähden, mitä heidän kätensä ovat tehneet. Ja Jumalalla on [täydellinen] tieto väärintekijöistä."}},{"verse":96,"commentary_en":"Continuing from the previous verse about their fear of death, this verse highlights their strong desire for worldly life. It points out that they are among the most attached to life, even more so than people who do not believe in Allah. It mentions that some might wish to live for a thousand years, but emphasizes that a long life will not protect them from punishment. The verse concludes by affirming Allah's complete awareness of everything they do, reinforcing that their actions are known and accounted for.","commentary_fi":"Jatkaen edellisestä jakeesta, joka käsitteli heidän kuolemanpelkoaan, tämä jae korostaa heidän voimakasta halua maalliseen elämään. Se huomauttaa, että he kuuluvat niihin, jotka ovat kaikkein kiintyneimpiä elämään, jopa enemmän kuin ihmiset, jotka eivät usko Allahiin. Se mainitsee, että jotkut saattavat toivoa elävänsä tuhat vuotta, mutta korostaa, ettei pitkä elämä suojaa heitä rangaistukselta. Jae päättyy vahvistamalla Allahin täydellisen tietoisuuden kaikesta, mitä he tekevät, mikä vahvistaa, että heidän tekonsa ovat tiedossa ja niistä pidetään kirjaa.","arabic":"وَلَتَجِدَنَّهُمْ أَحْرَصَ النَّاسِ عَلَىٰ حَيَاةٍ وَمِنَ الَّذِينَ أَشْرَكُوا ۚ يَوَدُّ أَحَدُهُمْ لَوْ يُعَمَّرُ أَلْفَ سَنَةٍ وَمَا هُوَ بِمُزَحْزِحِهِ مِنَ الْعَذَابِ أَنْ يُعَمَّرَ ۗ وَاللَّهُ بَصِيرٌ بِمَا يَعْمَلُونَ","commentary":"Jatkaen edellisestä jakeesta, joka käsitteli heidän kuolemanpelkoaan, tämä jae korostaa heidän voimakasta halua maalliseen elämään. Se huomauttaa, että he kuuluvat niihin, jotka ovat kaikkein kiintyneimpiä elämään, jopa enemmän kuin ihmiset, jotka eivät usko Allahiin. Se mainitsee, että jotkut saattavat toivoa elävänsä tuhat vuotta, mutta korostaa, ettei pitkä elämä suojaa heitä rangaistukselta. Jae päättyy vahvistamalla Allahin täydellisen tietoisuuden kaikesta, mitä he tekevät, mikä vahvistaa, että heidän tekonsa ovat tiedossa ja niistä pidetään kirjaa.","translations":{"opas":"ja sinä havaitset heidät kiintyneiksi tähän elämään enemmän kuin muut ihmiset, enemmän kuin itse epäjumalanpalvelijatkaan. Moni heistä toivoisi elävänsä tuhat vuotta; mutta eihän lainkaan vapauttaisi häntä rangaistuksesta se, että elämä pidennettäisiin. Jumala näkee, mitä he tekevät.","clear":"Sinä löydät heidän varmasti takertuvan elämään innokkaammin kuin kukaan muu kansa, jopa enemmän kuin monijumalaiset. Jokainen heistä toivoo elävänsä tuhat vuotta. Mutta vaikka he eläisivät niin kauan, se ei pelastaisi heitä rangaistukselta. Ja Jumala näkee kaiken, mitä he tekevät."}},{"verse":97,"commentary_en":"This verse addresses a specific claim made by some that the Angel Gabriel was their enemy. It instructs Prophet Muhammad to state clearly that Gabriel delivers the revelation (the Qur'an) to his heart by the permission of Allah. It clarifies that the Qur'an confirms the scriptures revealed before it and serves as a source of guidance and good news for those who believe. This challenges the idea of enmity towards an angel who acts purely by divine command.","commentary_fi":"Tämä jae käsittelee tiettyä väitettä, jonka jotkut esittivät, että Enkeli Gabriel oli heidän vihollisensa. Se ohjeistaa Profeetta Muhammadia toteamaan selvästi, että Gabriel tuo ilmoituksen (Koraanin) hänen sydämeensä Allahin luvalla. Se selventää, että Koraani vahvistaa ennen sitä paljastetut kirjoitukset ja toimii opastuksena ja ilosanomana niille, jotka uskovat. Tämä kyseenalaistaa ajatuksen vihamielisyydestä enkeliä kohtaan, joka toimii puhtaasti jumalallisella käskyllä.","arabic":"قُلْ مَنْ كَانَ عَدُوًّا لِجِبْرِيلَ فَإِنَّهُ نَزَّلَهُ عَلَىٰ قَلْبِكَ بِإِذْنِ اللَّهِ مُصَدِّقًا لِمَا بَيْنَ يَدَيْهِ وَهُدًى وَبُشْرَىٰ لِلْمُؤْمِنِينَ","commentary":"Tämä jae käsittelee tiettyä väitettä, jonka jotkut esittivät, että Enkeli Gabriel oli heidän vihollisensa. Se ohjeistaa Profeetta Muhammadia toteamaan selvästi, että Gabriel tuo ilmoituksen (Koraanin) hänen sydämeensä Allahin luvalla.
