 Se selventää, että Koraani vahvistaa ennen sitä paljastetut kirjoitukset ja toimii opastuksena ja ilosanomana niille, jotka uskovat. Tämä kyseenalaistaa ajatuksen vihamielisyydestä enkeliä kohtaan, joka toimii puhtaasti jumalallisella käskyllä.","translations":{"opas":"Sano (ihmisille, Muhammed): »Jos joku on Gabrielin vihollinen, niin tietäköön, että juuri Gabriel Jumalan toimesta on tämän Kirjoituksen valaissut sydämellesi vahvistaakseen sillä, mitä oli ilmoitettu ennen sitä, opastukseksi ja ilosanomaksi uskovaisille.»","clear":"Sano, [oi Profeetta,] ”Joka on Gabrielin vihollinen, hänen tulee tietää, että hän on ilmoittanut tämän [Koraanin] sydämeesi Jumalan tahdosta, vahvistaen sen, mikä oli ennen sitä – oppaaksi ja hyviä uutisia uskoville.”"}},{"verse":98,"commentary_en":"Building on the previous verse which addressed the claim about enmity towards Gabriel, this verse broadens the principle. It states that anyone who shows enmity towards Allah, His angels, His messengers, and specifically mentions Gabriel and Michael, will find that Allah is an enemy to those who reject faith. It underscores the unity of belief in Allah, His messengers, and His angels, and warns that opposing any of them is a sign of rejecting faith itself, which incurs Allah's displeasure.","commentary_fi":"Rakentaen edelliseen jakeeseen, joka käsitteli väitettä vihamielisyydestä Gabrielia kohtaan, tämä jae laajentaa periaatetta. Se toteaa, että jokainen, joka osoittaa vihamielisyyttä Allahiin, Hänen enkeleihinsä, Hänen lähettiläisiinsä ja mainitsee erityisesti Gabrielin ja Mikaelin, huomaa, että Allah on vihollinen niille, jotka hylkäävät uskon. Se korostaa uskon yhtenäisyyttä Allahiin, Hänen lähettiläisiinsä ja Hänen enkeleihinsä ja varoittaa, että yhdenkin heistä vastustaminen on merkki itse uskon hylkäämisestä, mikä aiheuttaa Allahin mielipahan.","arabic":"مَنْ كَانَ عَدُوًّا لِلَّهِ وَمَلَائِكَتِهِ وَرُسُلِهِ وَجِبْرِيلَ وَمِيكَالَ فَإِنَّ اللَّهَ عَدُوٌّ لِلْكَافِرِينَ","commentary":"Rakentaen edelliseen jakeeseen, joka käsitteli väitettä vihamielisyydestä Gabrielia kohtaan, tämä jae laajentaa periaatetta. Se toteaa, että jokainen, joka osoittaa vihamielisyyttä Allahiin, Hänen enkeleihinsä, Hänen lähettiläisiinsä ja mainitsee erityisesti Gabrielin ja Mikaelin, huomaa, että Allah on vihollinen niille, jotka hylkäävät uskon. Se korostaa uskon yhtenäisyyttä Allahiin, Hänen lähettiläisiinsä ja Hänen enkeleihinsä ja varoittaa, että yhdenkin heistä vastustaminen on merkki itse uskon hylkäämisestä, mikä aiheuttaa Allahin mielipahan.","translations":{"opas":"Jos joku on Jumalan, hänen enkeleittensä, apostoleittensa ja Gabrielin tai Mikaelin vihollinen, niin totisesti Jumala (itse) on uskottomien vihollinen.","clear":"Joka on Jumalan, Hänen enkeliensä, Hänen lähettiensä, Gabrielin ja Mikaelin vihollinen, [tietäköön, että] Jumala on varmasti epäuskoisten vihollinen."}},{"verse":99,"commentary_en":"This verse reassures Prophet Muhammad about the truth of the revelations he has received, describing them as clear signs. It then characterizes those who reject these clear signs as \"perverse\" or evildoers. This implies that rejecting such clear truth is not due to lack of clarity in the message, but rather stems from a negative disposition or resistance to accepting it. It sets the stage for the following verses which detail some of the actions stemming from this rejection.","commentary_fi":"Tämä jae rauhoittaa Profeetta Muhammadia saamansa ilmoituksen totuudesta, kuvaten niitä selvinä merkkeinä. Se luonnehtii sitten niitä, jotka hylkäävät nämä selvät merkit, \"moraalittomiksi\" tai väärämielisiksi. Tämä viittaa siihen, että tällaisen selvän totuuden hylkääminen ei johdu sanoman selkeyden puutteesta, vaan pikemminkin negatiivisesta asenteesta tai vastustuksesta hyväksyä sitä. Se valmistelee seuraavia jakeita, jotka yksityiskohtaisesti kuvaavat joitakin tämän hylkäämisen seurauksena syntyviä tekoja.","arabic":"وَلَقَدْ أَنْزَلْنَا إِلَيْكَ آيَاتٍ بَيِّنَاتٍ ۖ وَمَا يَكْفُرُ بِهَا إِلَّا الْفَاسِقُونَ","commentary":"Tämä jae rauhoittaa Profeetta Muhammadia saamansa ilmoituksen totuudesta, kuvaten niitä selvinä merkkeinä. Se luonnehtii sitten niitä, jotka hylkäävät nämä selvät merkit, \"moraalittomiksi\" tai väärämielisiksi. Tämä viittaa siihen, että tällaisen selvän totuuden hylkääminen ei johdu sanoman selkeyden puutteesta, vaan pikemminkin negatiivisesta asenteesta tai vastustuksesta hyväksyä sitä. Se valmistelee seuraavia jakeita, jotka yksityiskohtaisesti kuvaavat joitakin tämän hylkäämisen seurauksena syntyviä tekoja.","translations":{"opas":"Olemmehan totisesti ilmaissut kauttasi selvät tunnusmerkit, eivätkä ketkään muut kuin turmeltuneet kiellä niitä.","clear":"Totisesti, Me olemme lähettäneet sinulle [oi Profeetta] selviä ilmoituksia. [Mutta] kukaan ei kiellä niitä paitsi kapinalliset."}},{"verse":100,"commentary_en":"Following the description of those who reject clear signs as perverse, this verse highlights a specific behavior attributed to some among the people of the Book (referring to the Israelites in this context): breaking covenants. It asks rhetorically if it is not true that whenever they make a solemn pledge, some of them break it. The verse then asserts that the reality is that most of them lack faith, suggesting that this lack of faith is the underlying reason for their inconsistency and tendency to break promises. This point leads into the next verse which gives a clear example of this behavior.","commentary_fi":"Seuraillen kuvausta niistä, jotka hylkäävät selvät merkit, moraalittomina, tämä jae korostaa tiettyä käytöstä, joka liittyy joihinkin Kirjan ihmisten (tässä yhteydessä viitaten israelilaisiin): liittojen rikkomista. Se kysyy retorisesti, eikö ole totta, että aina kun he tekevät juhlallisen lupauksen, joku heidän joukostaan heittää sen syrjään? Jae sitten väittää, että todellisuus on, että useimmilta heistä puuttuu usko, mikä viittaa siihen, että tämä uskon puute on perustavanlaatuinen syy heidän epäjohdonmukaisuuteensa ja taipumukseensa rikkoa lupauksia. Tämä kohta johdattaa seuraavaan jakeeseen, joka antaa selkeän esimerkin tästä käytöksestä.","arabic":"أَوَكُلَّمَا عَاهَدُوا عَهْدًا نَبَذَهُ فَرِيقٌ مِنْهُمْ ۚ بَلْ أَكْثَرُهُمْ لَا يُؤْمِنُونَ","commentary":"Seuraillen kuvausta niistä, jotka hylkäävät selvät merkit, moraalittomina, tämä jae korostaa tiettyä käytöstä, joka liittyy joihinkin Kirjan ihmisten (tässä yhteydessä viitaten israelilaisiin): liittojen rikkomista. Se kysyy retorisesti, eikö ole totta, että aina kun he tekevät juhlallisen lupauksen, joku heidän joukostaan heittää sen syrjään? Jae sitten väittää, että todellisuus on, että useimmilta heistä puuttuu usko, mikä viittaa siihen, että tämä uskon puute on perustavanlaatuinen syy heidän epäjohdonmukaisuuteensa ja taipumukseensa rikkoa lupauksia. Tämä kohta johdattaa seuraavaan jakeeseen, joka antaa selkeän esimerkin tästä käytöksestä.","translations":{"opas":"Käykö aina niin, että kun teette liiton, osa teistä hylkää sen? Totisesti useimmat heistä eivät usko.","clear":"Miksi joka kerta, kun he tekevät liiton, joukko heistä heittää sen syrjään? Itse asiassa suurin osa heistä ei usko."}},{"verse":101,"commentary_en":"This verse provides a specific example of the behavior mentioned in the previous verse – the breaking of covenants and rejection of truth. It describes what happened when a messenger from Allah (Prophet Muhammad), confirming the scriptures they already possessed, came to them. Some of the people of the Book rejected this new scripture (the Qur'an), metaphorically \"throwing the Book of Allah behind their backs.\" This is depicted as a careless and dismissive act, as if they were entirely unfamiliar with such divine guidance, despite their history of receiving revelation. This shows a rejection not just of the new message, but implicitly, of the principles within their own scriptures that mandated believing in later messengers.","commentary_fi":"Tämä jae tarjoaa konkreettisen esimerkin edellisessä jakeessa mainitusta käytöksestä – liittojen rikkomisesta ja totuuden hylkäämisestä. Se kuvaa, mitä tapahtui, kun Allahin lähettiläs (Profeetta Muhammad), vahvistaen heidän jo omistamansa kirjoitukset, tuli heidän luokseen. Osa Kirjan ihmisistä hylkäsi tämän uuden kirjoituksen (Koraanin) metaforisesti \"heittämällä Allahin Kirjan selkänsä taakse\". Tämä kuvataan välinpitämättömänä ja vähättelevänä tekona, ikään kuin he olisivat olleet täysin tuntemattomia tällaiselle jumalalliselle ohjaukselle, huolimatta heidän historiastaan vastaanottaa ilmoituksia. Tämä osoittaa hylkäämisen paitsi uutta sanomaa kohtaan, myös epäsuorasti omien kirjoitustensa periaatteita kohtaan, jotka määräsivät uskomaan myöhempiin lähettiläisiin.","arabic":"وَلَمَّا جَاءَهُمْ رَسُولٌ مِنْ عِنْدِ اللَّهِ مُصَدِّقٌ لِمَا مَعَهُمْ نَبَذَ فَرِيقٌ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ كِتَابَ اللَّهِ وَرَاءَ ظُهُورِهِمْ كَأَنَّهُمْ لَا يَعْلَمُونَ","commentary":"Tämä jae tarjoaa konkreettisen esimerkin edellisessä jakeessa mainitusta käytöksestä – liittojen rikkomisesta ja totuuden hylkäämisestä. Se kuvaa, mitä tapahtui, kun Allahin lähettiläs (Profeetta Muhammad), vahvistaen heidän jo omistamansa kirjoitukset, tuli heidän luokseen. Osa Kirjan ihmisistä hylkäsi tämän uuden kirjoituksen (Koraanin) metaforisesti \"heittämällä Allahin Kirjan selkänsä taakse\". Tämä kuvataan välinpitämättömänä ja vähättelevänä tekona, ikään kuin he olisivat olleet täysin tuntemattomia tällaiselle jumalalliselle ohjaukselle, huolimatta heidän historiastaan vastaanottaa ilmoituksia. Tämä osoittaa hylkäämisen paitsi uutta sanomaa kohtaan, myös epäsuorasti omien kirjoitustensa periaatteita kohtaan, jotka määräsivät uskomaan myöhempiin lähettiläisiin.","translations":{"opas":"Ja kun Jumalan lähettiläs tulee heidän luokseen vahvistaen sen, minkä he jo omistavat, niin osa heistä, jotka olivat saaneet Pyhän kirjan, heittää Jumalan kirjan selkänsä taakse, aivankuin eivät tietäisi mitään.","clear":"Nyt, kun Jumalalta on tullut heille sanansaattaja – vahvistaen heidän omat Pyhät Kirjoituksensa – jotkut Kirjan ihmisistä heittävät Jumalan Kirjan selkänsä taakse ikään kuin eivät tietäisi."}},{"verse":102,"commentary_en":"Instead of accepting the divine revelation of the Qur’an, which confirmed their own scriptures, this verse explains that some among them chose to follow myths and falsehoods associated with Prophet Solomon—specifically tales spread by devils who falsely claimed he practiced magic. The verse makes clear that Prophet Solomon did not engage in disbelief or magic; rather, it was the devils who committed blasphemy by teaching magic to people. It refers to a historical episode involving two angels, Harut and Marut, in Babylon. These angels were sent as a test and clearly warned people not to learn magic or fall into disbelief. Despite the warning, some learned harmful practices, such as creating conflict between spouses. However, the verse emphasizes a key principle: nothing can cause harm except by Allah’s permission. Those who pursued such knowledge only harmed themselves, gaining no real benefit—especially not in the Hereafter. They were fully aware that those who engage in such dealings would have no share in the reward of the afterlife. In doing so, they effectively sold their souls for a miserable price.","commentary_fi":"Sen sijaan, että he olisivat hyväksyneet jumalallisen ilmoituksen, Koraanin, joka vahvisti heidän omat kirjoituksensa, tämä jae selittää, että jotkut heistä valitsivat seurata myyttejä ja valheita, jotka liitettiin profeetta Salomoniin – erityisesti tarinoita, joita levittivät paholaiset väittäen virheellisesti, että Salomo harjoitti taikuutta. Jaessa tehdään selväksi, ettei Profeetta Solomon syyllistynyt epäuskoon tai taikuuteen; päinvastoin, paholaiset olivat niitä, jotka syyllistyivät jumalanpilkkaan opettamalla ihmisille taikuutta. Siinä viitataan myös historialliseen tapahtumaan, jossa kaksi enkeliä, Harut ja Marut, lähetettiin Babyloniaan koetukseksi. Nämä enkelit varoittivat ihmisiä selvästi olemaan oppimatta taikuutta tai lankeamatta epäuskoon. Varoituksista huolimatta jotkut oppivat haitallisia käytäntöjä, kuten puolisoiden välisen eripuran aiheuttamista. Jaessa kuitenkin korostetaan keskeistä periaatetta: mikään ei voi aiheuttaa vahinkoa ilman Allahin lupaa. Ne, jotka tavoittelivat tällaista tietoa, vahingoittivat lopulta vain itseään, eivätkä saaneet siitä todellista hyötyä – erityisesti eivät tuonpuoleisessa. He tiesivät, että ne, jotka harjoittavat tällaisia asioita, eivät saa osakseen mitään palkintoa tuonpuoleisessa. Näin he käytännössä myivät sielunsa mitättömään hintaan.","arabic":"وَاتَّبَعُوا مَا تَتْلُو الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ ۖ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنْزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ ۚ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَا إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ ۖ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ ۚ وَمَا هُمْ بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلَّا بِإِذْنِ اللَّهِ ۚ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنْفَعُهُمْ ۚ وَلَقَدْ عَلِمُوا لَمَنِ اشْتَرَاهُ مَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ ۚ وَلَبِئْسَ مَا شَرَوْا بِهِ أَنْفُسَهُمْ ۚ لَوْ كَانُوا يَعْلَمُونَ","commentary":"Sen sijaan, että he olisivat hyväksyneet jumalallisen ilmoituksen, Koraanin, joka vahvisti heidän omat kirjoituksensa, tämä jae selittää, että jotkut heistä valitsivat seurata myyttejä ja valheita, jotka liitettiin profeetta Salomoniin – erityisesti tarinoita, joita levittivät paholaiset väittäen virheellisesti, että Salomo harjoitti taikuutta. Jaessa tehdään selväksi, ettei Profeetta Solomon syyllistynyt epäuskoon tai taikuuteen; päinvastoin, paholaiset olivat niitä, jotka syyllistyivät jumalanpilkkaan opettamalla ihmisille taikuutta. Siinä viitataan myös historialliseen tapahtumaan, jossa kaksi enkeliä, Harut ja Marut, lähetettiin Babyloniaan koetukseksi. Nämä enkelit varoittivat ihmisiä selvästi olemaan oppimatta taikuutta tai lankeamatta epäuskoon. Varoituksista huolimatta jotkut oppivat haitallisia käytäntöjä, kuten puolisoiden välisen eripuran aiheuttamista. Jaessa kuitenkin korostetaan keskeistä periaatetta: mikään ei voi aiheuttaa vahinkoa ilman Allahin lupaa. Ne, jotka tavoittelivat tällaista tietoa, vahingoittivat lopulta vain itseään, eivätkä saaneet siitä todellista hyötyä – erityisesti eivät tuonpuoleisessa. He tiesivät, että ne, jotka harjoittavat tällaisia asioita, eivät saa osakseen mitään palkintoa tuonpuoleisessa. Näin he käytännössä myivät sielunsa mitättömään hintaan.","translations":{"opas":"Ja he noudattavat sitä, mitä saatanat vääristelivät Salomon hallituksen aikana. Kuitenkaan ei Salomo ollut uskoton, vaan saatanat olivat luopioita sekä opettivat ihmisille noituutta ja sellaista, mikä oli ilmaistu molemmille Baabelin enkeleille Haarutille ja Maarutille. Nämä kaksi eivät sentään opettaneet ketään sanomatta: »Me olemme teille vain kiusaukseksi; älkää siis epäilkö (Jumalan johdatusta).» Noilta kahdelta he oppivat sellaista, jolla he kylvävät eripuraisuutta miehen ja hänen vaimonsa välille; mutta eivät he vahingoita silläkään ketään Jumalan sallimatta. Kuitenkin he oppivat sellaista, joka vahingoittaa heitä eikä hyödytä. Totta kai he tietävät, että sillä, joka hankkii loitsuja, ei totisesti ole mitään (hyvää) osaa kuolemanjälkeisessä elämässä. Mistä surkeasta hinnasta myyvätkään he sielunsa; jospa he vain tietäisivät sen!","clear":"He seurasivat sen sijaan taikuutta, jota paholaiset edistivät Salomon hallituskaudella. Salomo ei koskaan ollut epäuskoinen, vaan paholaiset olivat epäuskoisia. He opettivat taikuutta ihmisille, sekä sen, mikä oli ilmoitettu kahdelle enkelille, Hârûtille ja Mârûtille Babylonissa. Nämä kaksi enkeliä eivät koskaan opettaneet kenellekään sanomatta: ”Olemme vain koe teille, joten älkää hylätkö uskoanne.” Kuitenkin ihmiset oppivat taikuutta, joka aiheutti riidan jopa miehen ja vaimon välille; vaikka heidän taikansa ei voinut vahingoittaa ketään paitsi Jumalan tahdosta. He oppivat sen, mikä vahingoitti heitä eikä hyödyttänyt heitä – vaikka he jo tiesivät, että sillä, joka ostaa taikuutta, ei olisi osuutta tuonpuoleisessa. Kurja totisesti oli hinta, jolla he myivät sielunsa, jos he vain olisivat tienneet!"}},{"verse":103,"commentary_en":"Following the description of the harmful path taken by some, involving magic and disbelief, this verse presents the alternative. It states that if they had maintained their faith in Allah and His messengers, and guarded themselves against evil (specifically the evil described in the previous verse, like magic and following falsehoods), the reward they would have received from Allah would have been far better than anything they gained or sought through their actions. The phrase \"if they but knew\" implies that they did not fully grasp the immense value of faith and righteousness compared to the worthless price for which they sold their souls, as mentioned in the previous verse.","commentary_fi":"Kuvaamatta haitallista polkua, jonka jotkut valitsivat, mukaan lukien taikuus ja epäusko, tämä jae esittää vaihtoehdon. Se toteaa, että jos he olisivat säilyttäneet uskonsa Allahiin ja Hänen lähettiläisiinsä ja varjelleet itsensä pahalta (erityisesti edellisessä jakeessa kuvatulta pahalta, kuten taikuudelta ja valheiden seuraamiselta), palkka, jonka he olisivat saaneet Allahilta, olisi ollut paljon parempi kuin mikään, mitä he saavuttivat tai etsivät teoillaan. Lause \"jos vain olisivat tienneet\" viittaa siihen, etteivät he täysin ymmärtäneet uskon ja vanhurskauden suunnattoman suurta arvoa verrattuna arvottomaan hintaan, jolla he myivät sielunsa, kuten edellisessä jakeessa mainittiin.","arabic":"وَلَوْ أَنَّهُمْ آمَنُوا وَاتَّقَوْا لَمَثُوبَةٌ مِنْ عِنْدِ اللَّهِ خَيْرٌ ۖ لَوْ كَانُوا يَعْلَمُونَ","commentary":"Kuvaamatta haitallista polkua, jonka jotkut valitsivat, mukaan lukien taikuus ja epäusko, tämä jae esittää vaihtoehdon. Se toteaa, että jos he olisivat säilyttäneet uskonsa Allahiin ja Hänen lähettiläisiinsä ja varjelleet itsensä pahalta (erityisesti edellisessä jakeessa kuvatulta pahalta, kuten taikuudelta ja valheiden seuraamiselta), palkka, jonka he olisivat saaneet Allahilta, olisi ollut paljon parempi kuin mikään, mitä he saavuttivat tai etsivät teoillaan. Lause \"jos vain olisivat tienneet\" viittaa siihen, etteivät he täysin ymmärtäneet uskon ja vanhurskauden suunnattoman suurta arvoa verrattuna arvottomaan hintaan, jolla he myivät sielunsa, kuten edellisessä jakeessa mainittiin.","translations":{"opas":"Mutta jos he olisivat uskoneet ja karttaneet pahaa, niin olisi palkkio Jumalalta ollut parempi. Jospa he vain tietäisivät sen!","clear":"Jos he olisivat vain olleet uskollisia ja tietoisia Jumalasta, olisi palkka Jumalalta ollut parempi, jos he vain olisivat tienneet!"}},{"verse":104,"commentary_en":"This verse guides believers on how to address Prophet Muhammad (peace be upon him). It instructs them to use clear and respectful language, specifically advising against using words that could be misinterpreted or twisted to convey disrespect. This advice was given in the context of some individuals from other communities using ambiguous words with potentially offensive double meanings when speaking to the Prophet. This verse highlights Allah's care and protection for the Prophet and the believers against such subtle hostility. It also includes a warning of severe consequences for those who deny the truth.","commentary_fi":"Tämä jae opastaa uskovaisia siinä, miten heidän tulee puhutella profeetta Muhammadia (rauha hänelle). Se kehottaa heitä käyttämään selkeää ja kunnioittavaa kieltä ja erityisesti neuvomaan välttämään sanoja, jotka voitaisiin tulkita väärin tai vääristää ilmaisemaan epäkunnioitusta. Tämä neuvo annettiin tilanteessa, jossa jotkut toisista yhteisöistä käyttivät moniselitteisiä sanoja puhuessaan Profeetalle mahdollisesti loukkaavine kaksoismerkityksineen. Tämä jae korostaa Allahin huolenpitoa ja suojaa Profeetalle ja uskovaisille tällaista hienovaraista vihamielisyyttä vastaan. Se sisältää myös varoituksen vakavista seurauksista niille, jotka kieltävät totuuden.","arabic":"يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقُولُوا رَاعِنَا وَقُولُوا انْظُرْنَا وَاسْمَعُوا ۗ وَلِلْكَافِرِينَ عَذَابٌ أَلِيمٌ","commentary":"Tämä jae opastaa uskovaisia siinä, miten heidän tulee puhutella profeetta Muhammadia (rauha hänelle). Se kehottaa heitä käyttämään selkeää ja kunnioittavaa kieltä ja erityisesti neuvomaan välttämään sanoja, jotka voitaisiin tulkita väärin tai vääristää ilmaisemaan epäkunnioitusta. Tämä neuvo annettiin tilanteessa, jossa jotkut toisista yhteisöistä käyttivät moniselitteisiä sanoja puhuessaan Profeetalle mahdollisesti loukkaavine kaksoismerkityksineen. Tämä jae korostaa Allahin huolenpitoa ja suojaa Profeetalle ja uskovaisille tällaista hienovaraista vihamielisyyttä vastaan. Se sisältää myös varoituksen vakavista seurauksista niille, jotka kieltävät totuuden.","translations":{"opas":"Te jotka uskotte, älkää sanoko (Profeetalle): »Ota vaari meistä», vaan sanokaa: »Katso meihin», ja olkaa te kuulijoita. Niin, uskottomia odottaa tuskallinen rangaistus.","clear":"Oi uskovaiset! Älkää sanoko: ”Râ’ina.” [Paimentakaa meitä!] Vaan sanokaa: ”Unẓurna,” [Huolehtikaa meistä!] ja kuunnelkaa tarkkaavaisesti. Ja epäuskoiset kärsivät tuskallisen rangaistuksen."}},{"verse":105,"commentary_en":"Following the instruction on respectful communication in the previous verse, this verse addresses the attitude of some individuals from other religious groups (referred to as People of the Book) and idolaters towards the Muslims. It states that, from the perspective presented in the Qur'an, some among these groups did not wish for Muslims to receive blessings or revelations from Allah. This is stemming from a sense of resentment or envy that Allah had chosen Prophet Muhammad and his followers for His final message. The verse affirms that Allah bestows His mercy and grace upon whom He chooses, emphasizing His boundless generosity, which is seen by Muslims as the greatest blessing.","commentary_fi":"Edellisessä jakeessa annetun kunnioittavaa kommunikaatiota koskevan ohjeen jälkeen tämä jae käsittelee joidenkin toisiin uskontokuntiin (joita kutsutaan Kirjan Kansaksi) ja epäjumalanpalvojiin kuuluvien henkilöiden asennetta muslimeja kohtaan. Siinä todetaan, että Qur’anissa esitetyn näkökulman mukaan jotkut näistä ryhmistä eivät toivoneet muslimeille siunauksia tai ilmoituksia Allahilta. Tämän kuvataan johtuvan kaunan tai kateuden tunteesta siitä, että Allah oli valinnut profeetta Muhammadin ja hänen seuraajansa lopullista sanomaansa varten. Jae vahvistaa, että Allah suo armonsa ja suosionsa kenelle tahtoo, korostaen Hänen rajatonta anteliaisuuttaan, jota muslimit pitävät suurimpana siunauksena.","arabic":"مَا يَوَدُّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَلَا الْمُشْرِكِينَ أَنْ يُنَزَّلَ عَلَيْكُمْ مِنْ خَيْرٍ مِنْ رَبِّكُمْ ۗ وَاللَّهُ يَخْتَصُّ بِرَحْمَتِهِ مَنْ يَشَاءُ ۚ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ","commentary":"Edellisessä jakeessa annetun kunnioittavaa kommunikaatiota koskevan ohjeen jälkeen tämä jae käsittelee joidenkin toisiin uskontokuntiin (joita kutsutaan Kirjan Kansaksi) ja epäjumalanpalvojiin kuuluvien henkilöiden asennetta muslimeja kohtaan. Siinä todetaan, että Qur’anissa esitetyn näkökulman mukaan jotkut näistä ryhmistä eivät toivoneet muslimeille siunauksia tai ilmoituksia Allahilta. Tämän kuvataan johtuvan kaunan tai kateuden tunteesta siitä, että Allah oli valinnut profeetta Muhammadin ja hänen seuraajansa lopullista sanomaansa varten. Jae vahvistaa, että Allah suo armonsa ja suosionsa kenelle tahtoo, korostaen Hänen rajatonta anteliaisuuttaan, jota muslimit pitävät suurimpana siunauksena.","translations":{"opas":"Eivät uskottomat niiden joukossa, joilla on Pyhä kirja, eivätkä monijumalaiset soisi, että mitään hyvää lähetetään teille Herraltanne, mutta osoittaessaan laupeutta Jumala valitsee kenet tahtoo; niin, Jumala on rajaton armonsa runsaudessa.","clear":"Kirjan ihmisten ja monijumalaisten epäuskoiset eivät haluaisi, että saisitte mitään siunausta Herraltanne, mutta Jumala valitsee kenet haluaa armoonsa. Ja Jumala on äärettömän anteliaisuuden Herra."}},{"verse":106,"commentary_en":"This verse addresses concerns raised about changes to certain religious rulings or revelations during the time of Prophet Muhammad. Critics questioned the divine origin of Islam, especially in light of changes such as the shift in the direction of prayer (qiblah). The verse responds by affirming that Allah has the authority to replace or modify His revelations with something better or similar, emphasizing His absolute power and wisdom in guiding humanity. This principle is presented as a definitive answer to dispel such doubts.","commentary_fi":"Tämä jae käsittelee huolia, joita heräsi joidenkin uskonnollisten määräysten tai ilmoitusten muutoksista profeetta Muhammadin aikana. Arvostelijat kyseenalaistivat islamin jumalallisen alkuperän, erityisesti rukoussunnan (qibla) suunnan muutoksen vuoksi. Jae vastaa tähän korostamalla, että Allahilla on valta korvata tai muuttaa ilmoituksiaan johonkin parempaan tai samankaltaiseen, painottaen Hänen ehdotonta valtaansa ja viisauttaan ihmiskunnan ohjaamisessa. Tämä periaate esitetään lopullisena vastauksena hälventämään tällaiset epäilykset.","arabic":"مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُنْسِهَا نَأْتِ بِخَيْرٍ مِنْهَا أَوْ مِثْلِهَا ۗ أَلَمْ تَعْلَمْ أَنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","commentary":"Tämä jae käsittelee huolia, joita heräsi joidenkin uskonnollisten määräysten tai ilmoitusten muutoksista profeetta Muhammadin aikana. Arvostelijat kyseenalaistivat islamin jumalallisen alkuperän, erityisesti rukoussunnan (qibla) suunnan muutoksen vuoksi. Jae vastaa tähän korostamalla, että Allahilla on valta korvata tai muuttaa ilmoituksiaan johonkin parempaan tai samankaltaiseen, painottaen Hänen ehdotonta valtaansa ja viisauttaan ihmiskunnan ohjaamisessa. Tämä periaate esitetään lopullisena vastauksena hälventämään tällaiset epäilykset.","translations":{"opas":"Kumotessamme jonkun kohdan ilmoituksestamme tai antaessamme sen unohtua me asetamme paremman tai samanlaisen tilalle. Etkö tiedä, että Jumala on joka asiassa kaikkivaltias?","clear":"Jos Me kumoomme jakeen tai annamme sen unohtua, Me korvaamme sen paremmalla tai samankaltaisella. Etkö tiedä, että Jumala on kaikkivoipa?"}},{"verse":107,"commentary_en":"Building on the concept of Allah's absolute authority mentioned in the previous verse regarding the replacement of revelations, this verse further emphasizes Allah's complete control and ownership over all creation – the heavens and the earth. It reminds believers that Allah alone is their protector and helper. This serves as a reminder and a potential caution to Muslims, perhaps indicating that some were being affected by the criticisms from other groups and might be looking elsewhere for support or reassurance.","commentary_fi":"Jatkossa edellisessä jakeessa mainitusta Allahin ehdottomasta vallasta ilmoitusten korvaamisessa, tämä jae korostaa edelleen Allahin täydellistä kontrollia ja omistusta kaikkeen luomakuntaan – taivaisiin ja maahan. Se muistuttaa uskovaisia siitä, että Allah yksin on heidän suojelijansa ja auttajansa. Tämä toimii muistutuksena ja mahdollisena varoituksena muslimeille, ehkäpä osoittaen, että jotkut olivat joutuneet muiden ryhmien kritiikin vaikutukseen ja saattoivat etsiä tukea tai varmuutta muualta.","arabic":"أَلَمْ تَعْلَمْ أَنَّ اللَّهَ لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۗ وَمَا لَكُمْ مِنْ دُونِ اللَّهِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ","commentary":"Jatkossa edellisessä jakeessa mainitusta Allahin ehdottomasta vallasta ilmoitusten korvaamisessa, tämä jae korostaa edelleen Allahin täydellistä kontrollia ja omistusta kaikkeen luomakuntaan – taivaisiin ja maahan. Se muistuttaa uskovaisia siitä, että Allah yksin on heidän suojelijansa ja auttajansa. Tämä toimii muistutuksena ja mahdollisena varoituksena muslimeille, ehkäpä osoittaen, että jotkut olivat joutuneet muiden ryhmien kritiikin vaikutukseen ja saattoivat etsiä tukea tai varmuutta muualta.","translations":{"opas":"Etkö tiedä, että taivasten ja maan yliherruus kuuluu Jumalalle? Paitsi Jumalaa ei teillä ole ketään suojelijaa eikä auttajaa.","clear":"Etkö tiedä, että taivaiden ja maan valtakunta kuuluu ˹vain˺ Jumalalle, eikä sinulla ole muuta suojelijaa tai auttajaa kuin Jumala?"}},{"verse":108,"commentary_en":"This verse cautions Muslims not to question Prophet Muhammad in the same manner the people of Prophet Moses questioned him in the past. Earlier parts of the surah describe the persistent questioning and disobedience of the Israelites toward Moses, serving as a warning against repeating such behavior. The verse ends by stating clearly that abandoning faith after having believed is a serious deviation from the right path.","commentary_fi":"Tämä jae varoittaa muslimeja olemasta kyseenalaistamatta profeetta Muhammadia samalla tavalla kuin Mooseksen kansa oli aiemmin kyseenalaistanut häntä. Suuran aiemmissa osissa kuvataan israelilaisten jatkuvaa kyselyä ja tottelemattomuutta Moosesta kohtaan, mikä toimii varoituksena olla toistamatta samanlaista käytöstä. Jae päättyy selkeään toteamukseen, että uskon hylkääminen uskomisen jälkeen on vakava poikkeama oikealta tieltä.","arabic":"أَمْ تُرِيدُونَ أَنْ تَسْأَلُوا رَسُولَكُمْ كَمَا سُئِلَ مُوسَىٰ مِنْ قَبْلُ ۗ وَمَنْ يَتَبَدَّلِ الْكُفْرَ بِالْإِيمَانِ فَقَدْ ضَلَّ سَوَاءَ السَّبِيلِ","commentary":"Tämä jae varoittaa muslimeja olemasta kyseenalaistamatta profeetta Muhammadia samalla tavalla kuin Mooseksen kansa oli aiemmin kyseenalaistanut häntä. Suuran aiemmissa osissa kuvataan israelilaisten jatkuvaa kyselyä ja tottelemattomuutta Moosesta kohtaan, mikä toimii varoituksena olla toistamatta samanlaista käytöstä. Jae päättyy selkeään toteamukseen, että uskon hylkääminen uskomisen jälkeen on vakava poikkeama oikealta tieltä.","translations":{"opas":"Vai tahdotteko tehdä kysymyksiä profeetallenne samalla tavalla, kuin muinoin kyseltiin kaikenlaista Moosekselta? Huomatkoon se, joka valitsee epäuskon uskon asemesta, että hän eksyy oikealta tieltä.","clear":"Vai aioitteko te ˹uskovat˺ pyytää Lähettilästänne sellaista, mitä Moosesta pyydettiin aiemmin? Mutta joka vaihtaa uskon epäuskoon, on todella poikennut oikealta tieltä."}},{"verse":109,"commentary_en":"Returning to the theme of the attitudes of other religious groups, this verse highlights that, from the Qur'anic perspective, many among the People of the Book wished for Muslims to abandon their faith and return to disbelief. This desire is portrayed as stemming from deep-rooted resentment and envy, even after the truth of Islam had become clear to them. In response to such hostility and scheming, the verse instructs Muslims to show forgiveness and patience, trusting that Allah will ultimately bring about His will, reaffirming His absolute power.","commentary_fi":"Palaten muiden uskontokuntien asenteiden teemaan tämä jae korostaa, että Koraanin näkökulmasta monet Kirjan kansoista toivoivat muslimien hylkäävän uskonsa ja palaavan epäuskoon. Tämä toive esitetään kumpuavan syvästä kaunasta ja kateudesta, vaikka islamin totuus oli heille käynyt selväksi. Tällaisen vihamielisyyden ja juonittelun edessä jae kehottaa muslimeja osoittamaan anteeksiantoa ja kärsivällisyyttä, luottaen siihen, että Allah toteuttaa lopulta tahtonsa, vahvistaen Hänen ehdotonta valtaansa.","arabic":"وَدَّ كَثِيرٌ مِنْ أَهْلِ الْكِتَابِ لَوْ يَرُدُّونَكُمْ مِنْ بَعْدِ إِيمَانِكُمْ كُفَّارًا حَسَدًا مِنْ عِنْدِ أَنْفُسِهِمْ مِنْ بَعْدِ مَا تَبَيَّنَ لَهُمُ الْحَقُّ ۖ فَاعْفُوا وَاصْفَحُوا حَتَّىٰ يَأْتِيَ اللَّهُ بِأَمْرِهِ ۗ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","commentary":"Palaten muiden uskontokuntien asenteiden teemaan tämä jae korostaa, että Koraanin näkökulmasta monet Kirjan kansoista toivoivat muslimien hylkäävän uskonsa ja palaavan epäuskoon. Tämä toive esitetään kumpuavan syvästä kaunasta ja kateudesta, vaikka islamin totuus oli heille käynyt selväksi. Tällaisen vihamielisyyden ja juonittelun edessä jae kehottaa muslimeja osoittamaan anteeksiantoa ja kärsivällisyyttä, luottaen siihen, että Allah toteuttaa lopulta tahtonsa, vahvistaen Hänen ehdotonta valtaansa.","translations":{"opas":"Monet niiden joukossa, joilla on Pyhä kirja, toivoisivat voivansa saattaa teidät taas epäuskoisiksi sen jälkeen, kun te kerran olette tulleet uskoon, koska he ovat kateellisia, vaikka totuus onkin selvinnyt heille. Olkaa heitä kohtaan sääliväisiä ja kärsivällisiä , kunnes Jumala sanoo sanansa. Katso, Jumala on totisesti kaikkivoipa.","clear":"Monet Kirjan ihmisistä toivovat, että he voisivat kääntää teidät ˹uskovat˺ takaisin epäuskoon kateudestaan, sen jälkeen kun totuus on tehty heille selväksi. Antakaa heille anteeksi ja kärsikää heidän kanssaan, kunnes Jumala antaa tuomionsa. Totisesti, Jumala on kaikkivoipa kaikessa."}},{"verse":110,"commentary_en":"Following the instructions to deal with external challenges through patience and forgiveness, this verse directs believers towards strengthening their internal faith and community by emphasizing core Islamic practices. It commands steadfastness in prayer and giving regular charity (zakat). These practices are ways for Muslims to connect with Allah and invest their efforts in actions that will benefit them in the afterlife. The verse provides reassurance that all good deeds are known to and recorded by Allah, encouraging Muslims to focus on their relationship with Him and their righteous conduct as a means of resilience and spiritual growth.","commentary_fi":"Seuraten ohjeita ulkoisiin haasteisiin vastaamisesta kärsivällisyydellä ja anteeksiannolla, tämä jae ohjaa uskovaiset vahvistamaan sisäistä uskoaan ja yhteisöään korostamalla keskeisiä Islamilaisia käytäntöjä. Se käskee pysymään lujana rukouksessa ja antamaan säännöllisesti almuja (zakat). Nämä käytännöt ovat tapoja muslimeille yhdistyä Allahiin ja sijoittaa ponnistelunsa tekoihin, jotka hyödyttävät heitä tuonpuoleisessa elämässä. Jae antaa varmuuden siitä, että kaikki hyvät teot ovat Allahin tiedossa ja ne tallennetaan, rohkaisten muslimeja keskittymään suhteeseensa Häneen ja oikeamieliseen käytökseensä joustavuuden ja henkisen kasvun keinona.","arabic":"وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ ۚ وَمَا تُقَدِّمُوا لِأَنْفُسِكُمْ مِنْ خَيْرٍ تَجِدُوهُ عِنْدَ اللَّهِ ۗ إِنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ","commentary":"Seuraten ohjeita ulkoisiin haasteisiin vastaamisesta kärsivällisyydellä ja anteeksiannolla, tämä jae ohjaa uskovaiset vahvistamaan sisäistä uskoaan ja yhteisöään korostamalla keskeisiä Islamilaisia käytäntöjä. Se käskee pysymään lujana rukouksessa ja antamaan säännöllisesti almuja (zakat). Nämä käytännöt ovat tapoja muslimeille yhdistyä Allahiin ja sijoittaa ponnistelunsa tekoihin, jotka hyödyttävät heitä tuonpuoleisessa elämässä. Jae antaa varmuuden siitä, että kaikki hyvät teot ovat Allahin tiedossa ja ne tallennetaan, rohkaisten muslimeja keskittymään suhteeseensa Häneen ja oikeamieliseen käytökseensä joustavuuden ja henkisen kasvun keinona.","translations":{"opas":"Rukoilkaa säännöllisesti ja antakaa almuja! Kaiken hyvän, minkä teette sieluanne varten, te löydätte Jumalan luona. Jumala näkee, mitä ikinä te teette.","clear":"Suorittakaa rukous ja maksakaa almuvero. Kaiken hyvän, minkä lähetätte itsellenne edellä, te ˹varmasti˺ löydätte ˹palkkionne˺ Jumalan luota. Totisesti, Jumala näkee kaiken, mitä teette."}},{"verse":111,"commentary_en":"Moving from instructions for believers, the Sura now addresses claims made by some individuals from Jewish and Christian communities regarding salvation. This verse states that these individuals claimed that only those who identified as Jews or Christians would enter Paradise. The verse dismisses these claims as mere assertions and challenges them to produce proof or evidence to support their statement, highlighting the principle that such significant claims require substantiation.","commentary_fi":"Siirtyen uskovaisille annettavista ohjeista, Sura käsittelee nyt joidenkin juutalaisten ja kristittyjen yhteisöjen yksilöiden esittämiä väitteitä pelastuksesta. Tämä jae toteaa, että nämä yksilöt väittivät, että vain ne, jotka tunnistautuivat juutalaisiksi tai kristityiksi, pääsevät Paratiisiin. Jae torjuu nämä väitteet pelkkinä toteamuksina ja haastaa heidät esittämään todisteita tai näyttöä väitteensä tueksi, korostaen periaatetta, että tällaiset merkittävät väitteet edellyttävät perusteita.","arabic":"وَقَالُوا لَنْ يَدْخُلَ الْجَنَّةَ إِلَّا مَنْ كَانَ هُودًا أَوْ نَصَارَىٰ ۗ تِلْكَ أَمَانِيُّهُمْ ۗ قُلْ هَاتُوا بُرْهَانَكُمْ إِنْ كُنْتُمْ صَادِقِينَ","commentary":"Siirtyen uskovaisille annettavista ohjeista, Sura käsittelee nyt joidenkin juutalaisten ja kristittyjen yhteisöjen yksilöiden esittämiä väitteitä pelastuksesta. Tämä jae toteaa, että nämä yksilöt väittivät, että vain ne, jotka tunnistautuivat juutalaisiksi tai kristityiksi, pääsevät Paratiisiin. Jae torjuu nämä väitteet pelkkinä toteamuksina ja haastaa heidät esittämään todisteita tai näyttöä väitteensä tueksi, korostaen periaatetta, että tällaiset merkittävät väitteet edellyttävät perusteita.","translations":{"opas":"Sanovatpa he: »Eivät ketkään muut pääse Paratiisiin kuin juutalaiset ja kristityt.» Sellainen on heidän mielihalunsa. Sano: »Esittäkää todistukset väitteenne puolesta, jos tahdotte pysyä totuudessa.»","clear":"Juutalaiset ja kristityt väittävät kumpikin, että paratiisiin eivät pääse muut kuin heidän omaan uskoonsa kuuluvat. Nämä ovat heidän halujaan. Vastaa, ˹oi Profeetta,˺ ”Näyttäkää ˹minulle˺ todisteenne, jos se, mitä sanotte, on totta.”"}},{"verse":112,"commentary_en":"This verse directly refutes the exclusive claims made in the previous verse (111) and establishes a fundamental principle in Islam regarding salvation and reward. It states that anyone who completely submits themselves to Allah and performs good deeds will receive their reward from their Lord. Salvation is based on sincere submission to Allah and righteous actions, not on affiliation with a particular group or lineage. It emphasizes that true faith is expressed through both internal conviction and outward good deeds, leading to a state where believers will have no fear or grief in the Hereafter.","commentary_fi":"Tämä jae kumoaa suoraan edellisessä jakeessa (111) esitetyt yksinomaiset väitteet ja asettaa Islamin perusperiaatteen pelastuksesta ja palkinnosta. Se toteaa, että jokainen, joka täysin alistuu Allahille ja tekee hyvää, saa palkkansa Herraltaan. Pelastus perustuu vilpittömään alistumiseen Allahille ja oikeamielisiin tekoihin, ei tiettyyn ryhmään tai sukulinjaan kuulumiseen. Se korostaa, että todellinen usko ilmaistaan sekä sisäisen vakaumuksen että ulkoisten hyvien tekojen kautta, johtaen tilaan, jossa uskovaisilla ei ole pelkoa eikä murhetta tuonpuoleisessa elämässä.","arabic":"بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُ لِلَّهِ وَهُوَ مُحْسِنٌ فَلَهُ أَجْرُهُ عِنْدَ رَبِّهِ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","commentary":"Tämä jae kumoaa suoraan edellisessä jakeessa (111) esitetyt yksinomaiset väitteet ja asettaa Islamin perusperiaatteen pelastuksesta ja palkinnosta. Se toteaa, että jokainen, joka täysin alistuu Allahille ja tekee hyvää, saa palkkansa Herraltaan. Pelastus perustuu vilpittömään alistumiseen Allahille ja oikeamielisiin tekoihin, ei tiettyyn ryhmään tai sukulinjaan kuulumiseen. Se korostaa, että todellinen usko ilmaistaan sekä sisäisen vakaumuksen että ulkoisten hyvien tekojen kautta, johtaen tilaan, jossa uskovaisilla ei ole pelkoa eikä murhetta tuonpuoleisessa elämässä.","translations":{"opas":"Toisin käy sen, joka uskossa alistuu Jumalan tahtoon tehden hyvää; hän saa palkan Herraltansa: ei mikään pelko valtaa heitä, eikä heidän tarvitse murehtia.","clear":"Mutta ei! Joka alistuu Jumalalle ja tekee hyvää, saa palkintonsa Herransa luona. Eikä heillä ole pelkoa, eivätkä he sure."}},{"verse":113,"commentary_en":"This verse highlights the disagreements and mutual criticisms between some members of the Jewish and Christian communities, where each accused the other of lacking a true foundation for their beliefs. Yet both groups claimed to follow scriptures revealed by Allah. The verse also draws a parallel between these disputes and the remarks of those \"without knowledge\" (understood as the Arab idolaters), who, observing these conflicts, dismissed both groups altogether. It concludes by affirming that Allah will be the ultimate judge of these disputes on the Day of Judgment, underscoring that the final authority in such matters belongs to Allah alone.","commentary_fi":"Tämä jae tuo esiin erimielisyydet ja keskinäiset syytökset joidenkin juutalaisten ja kristittyjen välillä, joissa kumpikin syytti toista siitä, ettei heidän uskonsa perustuisi todelliseen perustaan. Silti molemmat ryhmät väittivät seuraavansa Allahin ilmoittamia kirjoituksia. Jae vetää myös rinnastuksen näiden kiistojen ja niiden \"tietämättömien\" (ymmärretään arabipakanaiksi) väitteiden välille, jotka tarkkailivat näitä ristiriitoja ja torjuivat molemmat ryhmät kokonaan. Lopuksi todetaan, että Allah tulee olemaan näiden kiistojen lopullinen tuomari Tuomiopäivänä, korostaen, että tällaisissa asioissa viimeinen sana kuuluu yksin Allahille.","arabic":"وَقَالَتِ الْيَهُودُ لَيْسَتِ النَّصَارَىٰ عَلَىٰ شَيْءٍ وَقَالَتِ النَّصَارَىٰ لَيْسَتِ الْيَهُودُ عَلَىٰ شَيْءٍ وَهُمْ يَتْلُونَ الْكِتَابَ ۗ كَذَٰلِكَ قَالَ الَّذِينَ لَا يَعْلَمُونَ مِثْلَ قَوْلِهِمْ ۚ فَاللَّهُ يَحْكُمُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ","commentary":"Tämä jae tuo esiin erimielisyydet ja keskinäiset syytökset joidenkin juutalaisten ja kristittyjen välillä, joissa kumpikin syytti toista siitä, ettei heidän uskonsa perustuisi todelliseen perustaan. Silti molemmat ryhmät väittivät seuraavansa Allahin ilmoittamia kirjoituksia. Jae vetää myös rinnastuksen näiden kiistojen ja niiden \"tietämättömien\" (ymmärretään arabipakanaiksi) väitteiden välille, jotka tarkkailivat näitä ristiriitoja ja torjuivat molemmat ryhmät kokonaan. Lopuksi todetaan, että Allah tulee olemaan näiden kiistojen lopullinen tuomari Tuomiopäivänä, korostaen, että tällaisissa asioissa viimeinen sana kuuluu yksin Allahille.","translations":{"opas":"Juutalaiset sanovat: »Kristityt eivät noudata todellisia perusteita», ja kristityt sanovat: »Juutalaisilla ei ole oikeaa perustusta»; kuitenkin he lukevat Pyhää kirjaa. Samalla tavalla ovat puhuneet nekin, jotka eivät mitään tiedä. Mutta Ylösnousemuksen päivänä Jumala on ratkaiseva heidän välisensä kiistaasiat.","clear":"Juutalaiset sanovat: ”Kristityillä ei ole mitään perustaa”, ja kristityt sanovat: ”Juutalaisilla ei ole mitään perustaa”, vaikka molemmat lukevat Pyhiä kirjoituksia. Ja ne ˹pakanat˺, joilla ei ole tietoa, sanovat samaa ˹uskovista˺. Totisesti Allah tuomitsee heidän välillään tuomiopäivänä heidän riidastaan."}},{"verse":114,"commentary_en":"This verse highlights the great injustice of those who prevent others from remembering Allah's name in places of worship or who actively seek to damage or destroy these places. It explains that such actions are deeply wrong and those who commit them deserve consequences both in this life and the next.","commentary_fi":"Tämä jae korostaa suurta vääryyttä niille, jotka estävät muita muistamasta Allahin nimeä rukouspaikoissa tai jotka aktiivisesti pyrkivät vahingoittamaan tai tuhoamaan näitä paikkoja. Se selittää, että tällaiset teot ovat syvästi vääriä ja että ne, jotka niihin syyllistyvät, ansaitsevat seurauksia sekä tässä maailmassa että tuonpuoleisessa.","arabic":"وَمَنْ أَظْلَمُ مِمَّنْ مَنَعَ مَسَاجِدَ اللَّهِ أَنْ يُذْكَرَ فِيهَا اسْمُهُ وَسَعَىٰ فِي خَرَابِهَا ۚ أُولَٰئِكَ مَا كَانَ لَهُمْ أَنْ يَدْخُلُوهَا إِلَّا خَائِفِينَ ۚ لَهُمْ فِي الدُّنْيَا خِزْيٌ وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيمٌ","commentary":"Tämä jae korostaa suurta vääryyttä niille, jotka estävät muita muistamasta Allahin nimeä rukouspaikoissa tai jotka aktiivisesti pyrkivät vahingoittamaan tai tuhoamaan näitä paikkoja. Se selittää, että tällaiset teot ovat syvästi vääriä ja että ne, jotka niihin syyllistyvät, ansaitsevat seurauksia sekä tässä maailmassa että tuonpuoleisessa.","translations":{"opas":"Kuka tekee suurempaa vääryyttä kuin se, joka estää toisia lähestymästä Jumalan pyhäkköjä, jottei niissä Hänen nimeään mainittaisi, ja aiheuttaa niiden sortumisen. Heille itselleen ei voi suoda pääsyä niihin muuten kuin pelosta vavisten.","clear":"Kuka tekee enemmän väärin kuin ne, jotka estävät Allahin nimen mainitsemisen Hänen palvontapaikoissaan ja pyrkivät tuhoamaan ne? Sellaisilla ihmisillä ei ole oikeutta mennä näihin paikkoihin paitsi peläten. Heille on häpeä tässä maailmassa, ja he kärsivät valtavan rangaistuksen tuonpuoleisessa."}},{"verse":115,"commentary_en":"This verse continues the discussion of places and directions of worship, emphasizing Allah's boundless nature: east, west, north, south—all directions and places belong to Him. It offers reassurance regarding the legitimacy of the prayer direction, especially in light of the change Muslims experienced in this regard. The verse clarifies that such changes are not grounds for dispute; wherever one turns in sincere devotion, they are turning toward Allah. It concludes by affirming Allah's limitless bounty and His complete knowledge of all things, assuring that sincere worship, regardless of direction, is known and accepted by Him. Regarding the phrase \"there is the presence of Allah\" or \"the face of Allah\" used in some translations, Muslims affirm this attribute as it appears in the Qur’an, without likening Allah to His creation or attempting to explain its nature. It reflects His majesty and uniqueness in a way beyond human comprehension, and His attributes are accepted as revealed, without metaphorical interpretation or anthropomorphism.","commentary_fi":"Tämä jae jatkaa keskustelua palvontapaikoista ja rukouksen suunnista, korostaen Allahin rajattomuutta: itä, länsi, pohjoinen, etelä – kaikki suunnat ja paikat kuuluvat Hänelle. Jae tarjoaa lohtua rukouksen suunnan oikeellisuudesta, erityisesti ottaen huomioon muslimien kokemuksen suunnan muutoksesta. Se selventää, ettei tällainen muutos ole kiistelyn aihe; minne tahansa ihminen kääntyy vilpittömässä hartaudessa, hän kääntyy kohti Allahia. Jae päättyy vahvistamalla Allahin rajattoman armon ja Hänen täydellisen tietämyksensä kaikesta, vakuuttaen, että vilpitön palvonta, riippumatta suunnasta, tunnetaan ja hyväksytään Hänen toimesta. Mitä tulee joissakin käännöksissä esiintyvään ilmaukseen \"Allahin läsnäolo\" tai \"Allahin kasvot\", muslimit hyväksyvät tämän ominaisuuden sellaisena kuin se esiintyy Koraanissa, vertaamatta Allahia Hänen luotuihinsa tai yrittämättä selittää, miten se ilmenee. Se heijastaa Hänen majesteettisuuttaan ja ainutlaatuisuuttaan tavalla, joka ylittää inhimillisen ymmärryksen, ja Hänen ominaisuutensa hyväksytään sellaisina kuin ne on ilmoitettu, ilman vertauskuvallista tulkintaa tai inhimillistämistä.","arabic":"وَلِلَّهِ الْمَشْرِقُ وَالْمَغْرِبُ ۚ فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ ۚ إِنَّ اللَّهَ وَاسِعٌ عَلِيمٌ","commentary":"Tämä jae jatkaa keskustelua palvontapaikoista ja rukouksen suunnista, korostaen Allahin rajattomuutta: itä, länsi, pohjoinen, etelä – kaikki suunnat ja paikat kuuluvat Hänelle. Jae tarjoaa lohtua rukouksen suunnan oikeellisuudesta, erityisesti ottaen huomioon muslimien kokemuksen suunnan muutoksesta. Se selventää, ettei tällainen muutos ole kiistelyn aihe; minne tahansa ihminen kääntyy vilpittömässä hartaudessa, hän kääntyy kohti Allahia. Jae päättyy vahvistamalla Allahin rajattoman armon ja Hänen täydellisen tietämyksensä kaikesta, vakuuttaen, että vilpitön palvonta, riippumatta suunnasta, tunnetaan ja hyväksytään Hänen toimesta. Mitä tulee joissakin käännöksissä esiintyvään ilmaukseen \"Allahin läsnäolo\" tai \"Allahin kasvot\", muslimit hyväksyvät tämän ominaisuuden sellaisena kuin se esiintyy Koraanissa, vertaamatta Allahia Hänen luotuihinsa tai yrittämättä selittää, miten se ilmenee. Se heijastaa Hänen majesteettisuuttaan ja ainutlaatuisuuttaan tavalla, joka ylittää inhimillisen ymmärryksen, ja Hänen ominaisuutensa hyväksytään sellaisina kuin ne on ilmoitettu, ilman vertauskuvallista tulkintaa tai inhimillistämistä.","translations":{"opas":"Heitä odottaa häpeä tässä elämässä ja kauhea rangaistus tulevassa.","clear":"Allahille kuuluu itä ja länsi, joten minne tahansa käännytkään, olet kääntynyt ˹kohti˺ Allahia. Totisesti Allah on Kaikenkattava, Kaikkitietävä."}},{"verse":116,"commentary_en":"This verse addresses a misconception held by some groups who claimed that Allah has a son. This idea was present among Christians, some Jews who held a similar belief about Prophet Ezra, and some Arab idolaters who considered angels to be daughters of Allah. The verse strongly refutes this idea, declaring \"Glory be to Him!\" to emphasize Allah's absolute transcendence and freedom from any human-like relationships or limitations. It asserts that everything in the heavens and on earth belongs to Allah and is subservient to Him, highlighting His unique sovereignty and the fact that He does not need offspring or partners.","commentary_fi":"Tämä jae käsittelee väärinkäsitystä, jota jotkut ryhmät pitivät yllä ja jotka väittivät, että Allahilla on poika. Tämä ajatus oli läsnä kristittyjen, joidenkin juutalaisten (jotka pitivät vastaavaa uskomusta profeetta Ezrasta) ja joidenkin arabialaisepäjumalanpalvojien keskuudessa (jotka pitivät enkeleitä Allahin tyttärinä). Jae torjuu voimakkaasti tämän ajatuksen, julistaen \"Kunnia olkoon Hänelle!\" korostaakseen Allahin ehdotonta transsendenssia ja vapautta kaikista ihmismäisistä suhteista tai rajoituksista. Se vahvistaa, että kaikki taivaissa ja maan päällä kuuluu Allahille ja on Hänelle alisteista, korostaen Hänen ainutlaatuista suvereniteettiaan ja sitä tosiasiaa, ettei Hän tarvitse jälkeläisiä tai kumppaneita.","arabic":"وَقَالُوا اتَّخَذَ اللَّهُ وَلَدًا ۗ سُبْحَانَهُ ۖ بَلْ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ كُلٌّ لَهُ قَانِتُونَ","commentary":"Tämä jae käsittelee väärinkäsitystä, jota jotkut ryhmät pitivät yllä ja jotka väittivät, että Allahilla on poika. Tämä ajatus oli läsnä kristittyjen, joidenkin juutalaisten (jotka pitivät vastaavaa uskomusta profeetta Ezrasta) ja joidenkin arabialaisepäjumalanpalvojien keskuudessa (jotka pitivät enkeleitä Allahin tyttärinä). Jae torjuu voimakkaasti tämän ajatuksen, julistaen \"Kunnia olkoon Hänelle!\" korostaakseen Allahin ehdotonta transsendenssia ja vapautta kaikista ihmismäisistä suhteista tai rajoituksista. Se vahvistaa, että kaikki taivaissa ja maan päällä kuuluu Allahille ja on Hänelle alisteista, korostaen Hänen ainutlaatuista suvereniteettiaan ja sitä tosiasiaa, ettei Hän tarvitse jälkeläisiä tai kumppaneita.","translations":{"opas":"Jumalalle kuuluu Itä ja Länsi, ja mihin käännyttekin, ovat Jumalan kasvot siellä; katso, Jumala sulkee olemukseensa kaiken ja tietää kaiken.","clear":"He sanovat: ”Allahilla on jälkeläisiä.” Kunnia olkoon Hänelle! Itse asiassa Hänelle kuuluu kaikki, mitä on taivaissa ja maassa – kaikki ovat Hänen tahtonsa alaisia."}},{"verse":117,"commentary_en":"Continuing the theme of Allah's unique nature and power, this verse further explains that Allah is the sole Originator of everything in the universe. It describes His absolute power of creation: when He decides something is to exist, He simply says \"Be,\" and it comes into being instantly. This reflects Allah's direct, absolute, and omnipotent will in creation, without needing intermediaries. This concept reinforces the idea of Allah's uniqueness and refutes any notion of Him having a son or partners, as His creative power is absolute and immediate.","commentary_fi":"Jatkamalla teemaa Allahin ainutlaatuisesta luonnosta ja voimasta, tämä jae selittää edelleen, että Allah on ainoa kaiken alkulähde universumissa. Se kuvaa Hänen ehdotonta luomisen voimaansa: kun Hän päättää jonkin olevan olemassa, Hän yksinkertaisesti sanoo \"Ole\", ja se on. Tämä heijastaa Allahin suoraa, ehdotonta ja kaikkivoipaa tahtoa luomisessa, ilman välittäjiä. Tämä käsite vahvistaa ajatusta Allahin ainutlaatuisuudesta ja torjuu kaikki käsitykset siitä, että Hänellä olisi poika tai kumppaneita, sillä Hänen luomisvoimansa on ehdoton ja välitön.","arabic":"بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ ۖ وَإِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُنْ فَيَكُونُ","commentary":"Jatkamalla teemaa Allahin ainutlaatuisesta luonnosta ja voimasta, tämä jae selittää edelleen, että Allah on ainoa kaiken alkulähde universumissa. Se kuvaa Hänen ehdotonta luomisen voimaansa: kun Hän päättää jonkin olevan olemassa, Hän yksinkertaisesti sanoo \"Ole\", ja se on. Tämä heijastaa Allahin suoraa, ehdotonta ja kaikkivoipaa tahtoa luomisessa, ilman välittäjiä. Tämä käsite vahvistaa ajatusta Allahin ainutlaatuisuudesta ja torjuu kaikki käsitykset siitä, että Hänellä olisi poika tai kumppaneita, sillä Hänen luomisvoimansa on ehdoton ja välitön.","translations":{"opas":"Sanovatpa he: »Jumala on ottanut itselleen Pojan». Ei, Hänelle yksin kunnia! Totisesti kaikki taivaassa ja maan päällä on Hänen; kaikki ovat Hänelle kuuliaiset.","clear":"˹Hän on˺ taivaiden ja maan Alkuunpanija! Kun Hän päättää asiasta, Hän yksinkertaisesti käskee sitä: ”Ole!” Ja se on!"}},{"verse":118,"commentary_en":"This verse speaks about people who lack true understanding and challenge why Allah does not speak directly to them or show them specific miraculous signs. This attitude is not new and that previous nations made similar demands of their prophets, such as when the Israelites asked Prophet Moses to see Allah directly. The verse points out that the hearts and attitudes of those who make such demands are similar across different times. It then clarifies that Allah has indeed provided clear signs, but these signs are most apparent and beneficial to those who already possess sincere faith and conviction in their hearts. Faith enables one to recognize and appreciate the meaning and purpose of these signs.","commentary_fi":"Tämä jae puhuu ihmisistä, joilta puuttuu todellinen ymmärrys ja jotka kyseenalaistavat, miksi Allah ei puhu suoraan heille tai näytä heille erityisiä ihmeellisiä merkkejä. Tämä asenne ei ole uusi ja että aikaisemmat kansat esittivät samanlaisia vaatimuksia profeetoilleen, kuten silloin, kun israelilaiset pyysivät profeetta Moosesta näkemään Allahin suoraan. Jae osoittaa, että niiden sydämet ja asenteet, jotka esittävät tällaisia vaatimuksia, ovat samanlaisia eri aikoina. Sitten se selventää, että Allah on todellakin antanut selviä merkkejä, mutta nämä merkit ovat selkeimpiä ja hyödyllisimpiä niille, joilla on jo vilpitön usko ja vakaumus sydämissään. Usko mahdollistaa näiden merkkien merkityksen ja tarkoituksen tunnistamisen ja arvostamisen.","arabic":"وَقَالَ الَّذِينَ لَا يَعْلَمُونَ لَوْلَا يُكَلِّمُنَا اللَّهُ أَوْ تَأْتِينَا آيَةٌ ۗ كَذَٰلِكَ قَالَ الَّذِينَ مِنْ قَبْلِهِمْ مِثْلَ قَوْلِهِمْ ۘ تَشَابَهَتْ قُلُوبُهُمْ ۗ قَدْ بَيَّنَّا الْآيَاتِ لِقَوْمٍ يُوقِنُونَ","commentary":"Tämä jae puhuu ihmisistä, joilta puuttuu todellinen ymmärrys ja jotka kyseenalaistavat, miksi Allah ei puhu suoraan heille tai näytä heille erityisiä ihmeellisiä merkkejä. Tämä asenne ei ole uusi ja että aikaisemmat kansat esittivät samanlaisia vaatimuksia profeetoilleen, kuten silloin, kun israelilaiset pyysivät profeetta Moosesta näkemään Allahin suoraan. Jae osoittaa, että niiden sydämet ja asenteet, jotka esittävät tällaisia vaatimuksia, ovat samanlaisia eri aikoina. Sitten se selventää, että Allah on todellakin antanut selviä merkkejä, mutta nämä merkit ovat selkeimpiä ja hyödyllisimpiä niille, joilla on jo vilpitön usko ja vakaumus sydämissään. Usko mahdollistaa näiden merkkien merkityksen ja tarkoituksen tunnistamisen ja arvostamisen.","translations":{"opas":"Hän on taivaan ja maan Luoja; kun Hän päättää jonkun asian, sanoo Hän ainoastaan »Tapahdu!» ja niin tapahtuu. Mutta ne jotka eivät mitään tiedä, sanovat: »Miksi ei Jumala puhu meille, tai miksi emme saa tunnusmerkkiä?» Niin puhuivat nekin, jotka ennen heitä elivät; heidän sydämensä ovat samankaltaiset. Me olemme osoittanut merkit ihmisille, jotka pysyvät varmoissa tiedoissa.","clear":"Ne, joilla ei ole tietoa, sanovat: ”Kunpa Allah puhuisi meille tai meille tulisi merkki!” Samaa sanoivat ne, jotka tulivat ennen. Heidän sydämensä ovat kaikki samanlaisia. Totisesti, olemme tehneet merkit selviksi ihmisille, joilla on varma usko."}},{"verse":119,"commentary_en":"Addressing Prophet Muhammad, this verse defines his role and responsibilities. It states that he was sent with the truth as a bringer of good news to those who believe and obey Allah, and as a warner to those who reject His message. The Prophet’s mission is to convey this message, but he is not accountable for the ultimate fate of those who disbelieve and face punishment.","commentary_fi":"Tämä jae puhuu profeetta Muhammadille ja määrittelee hänen roolinsa ja vastuunsa. Siinä todetaan, että hänet on lähetetty totuuden kanssa tuomaan hyvää sanomaa niille, jotka uskovat ja tottelevat Allahia, sekä varoittamaan niitä, jotka hylkäävät Hänen sanomansa. Profeetan tehtävänä on välittää tämä viesti, mutta hän ei ole vastuussa niiden lopullisesta kohtalosta, jotka eivät usko ja joutuvat rangaistukseen.","arabic":"إِنَّا أَرْسَلْنَاكَ بِالْحَقِّ بَشِيرًا وَنَذِيرًا ۖ وَلَا تُسْأَلُ عَنْ أَصْحَابِ الْجَحِيمِ","commentary":"Tämä jae puhuu profeetta Muhammadille ja määrittelee hänen roolinsa ja vastuunsa. Siinä todetaan, että hänet on lähetetty totuuden kanssa tuomaan hyvää sanomaa niille, jotka uskovat ja tottelevat Allahia, sekä varoittamaan niitä, jotka hylkäävät Hänen sanomansa. Profeetan tehtävänä on välittää tämä viesti, mutta hän ei ole vastuussa niiden lopullisesta kohtalosta, jotka eivät usko ja joutuvat rangaistukseen.","translations":{"opas":"Sinut, Muhammed, olemme lähettänyt totuuden ilmoittajaksi, ilosanoman julistajaksi ja varoittajaksi, eikä sinun tarvitse olla vastuussa Helvetin tuleen joutuvista.","clear":"Olemme totisesti lähettäneet sinut totuuden kanssa ˹Oi Profeetta˺ hyvien uutisten tuojana ja varoittajana. Eikä sinua pidetä vastuullisena helvetin asukkaista."}},{"verse":120,"commentary_en":"This verse reveals the deep-seated desire of some among the Jews and Christians during that time for Prophet Muhammad to abandon his faith and adopt theirs. It states that they would not be satisfied with him unless he followed their religious path. The verse instructs the Prophet to state clearly that \"The Guidance of Allah—that is the (only) Guidance,\" emphasizing that the true and complete guidance comes solely from Allah. It sternly warns the Prophet (and by extension, Muslims) against compromising their faith or following the desires of others after having received divine knowledge, stating that doing so would leave them without protection or help from Allah.","commentary_fi":"Tämä jae paljastaa joidenkin juutalaisten ja kristittyjen keskuudessa tuona aikana vallinneen syvään juurtuneen toiveen, että profeetta Muhammad luopuisi uskostaan ja omaksuisi heidän uskontonsa. Se toteaa, etteivät he olisi tyytyväisiä häneen, ellei hän seuraisi heidän uskonnollista polkuaan. Jae ohjeistaa profeettaa sanomaan selvästi: \"Allahin opastus – se on (ainoastaan) opastus\", korostaen, että todellinen ja täydellinen opastus tulee yksinomaan Allahilta. Se varoittaa ankarasti profeettaa (ja laajemminkin muslimeja) vaarantamasta uskoaan tai seuraamasta muiden toiveita saatuaan jumalallista tietoa, todeten, että niin tekemällä he jäisivät ilman Allahin suojaa tai apua.","arabic":"وَلَنْ تَرْضَىٰ عَنْكَ الْيَهُودُ وَلَا النَّصَارَىٰ حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْ ۗ قُلْ إِنَّ هُدَى اللَّهِ هُوَ الْهُدَىٰ ۗ وَلَئِنِ اتَّبَعْتَ أَهْوَاءَهُمْ بَعْدَ الَّذِي جَاءَكَ مِنَ الْعِلْمِ ۙ مَا لَكَ مِنَ اللَّهِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ","commentary":"Tämä jae paljastaa joidenkin juutalaisten ja kristittyjen keskuudessa tuona aikana vallinneen syvään juurtuneen toiveen, että profeetta Muhammad luopuisi uskostaan ja omaksuisi heidän uskontonsa. Se toteaa, etteivät he olisi tyytyväisiä häneen, ellei hän seuraisi heidän uskonnollista polkuaan. Jae ohjeistaa profeettaa sanomaan selvästi: \"Allahin opastus – se on (ainoastaan) opastus\", korostaen, että todellinen ja täydellinen opastus tulee yksinomaan Allahilta. Se varoittaa ankarasti profeettaa (ja laajemminkin muslimeja) vaarantamasta uskoaan tai seuraamasta muiden toiveita saatuaan jumalallista tietoa, todeten, että niin tekemällä he jäisivät ilman Allahin suojaa tai apua.","translations":{"opas":"Mutta juutalaiset ja kristityt eivät mielisty sinuun, paitsi ehkä kun noudattaisit heidän oppiaan. Sano: »Jumalan oma ohjaus on totisesti oikea Johdatus.» Ja jos sinä seuraat heidän pyyteitään kaiken sen jälkeen, mikä on osaksesi tullut, et sinä totisesti ole löytävä suojelijaa etkä auttajaa Jumalassa.","clear":"Juutalaiset ja kristityt eivät ole koskaan tyytyväisiä sinuun, ennen kuin seuraat heidän uskoaan. Sano: \"Jumalan johdatus on ainoa ˹oikea˺ johdatus.\" Ja jos seuraisit heidän halujaan ˹kaiken˺ sen tiedon jälkeen, joka on tullut sinulle, ei olisi ketään, joka suojelisi tai auttaisi sinua Jumalaa vastaan."}},{"verse":121,"commentary_en":"Following the warning in the previous verse, this verse highlights the sincere and pious individuals among the People of the Book. These are those who recite the Scripture with honesty and genuine intent, and are therefore more inclined to accept the truth when they recognize it. In contrast, those who persist in rejecting faith are described as the true losers.","commentary_fi":"Edelliseen varoitukseen jatkona tämä jae tuo esiin hurskaat ja vilpittömät ihmiset Kirjan saaneiden joukossa. He ovat niitä, jotka lukevat Pyhää kirjaa rehellisesti ja vilpittömin aikomuksin, ja siksi he ovat alttiimpia hyväksymään totuuden sen tunnistaessaan. Sen sijaan niitä, jotka jatkuvasti torjuvat uskon, kuvataan todellisiksi häviäjiksi.","arabic":"الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَتْلُونَهُ حَقَّ تِلَاوَتِهِ أُولَٰئِكَ يُؤْمِنُونَ بِهِ ۗ وَمَنْ يَكْفُرْ بِهِ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ","commentary":"Edelliseen varoitukseen jatkona tämä jae tuo esiin hurskaat ja vilpittömät ihmiset Kirjan saaneiden joukossa. He ovat niitä, jotka lukevat Pyhää kirjaa rehellisesti ja vilpittömin aikomuksin, ja siksi he ovat alttiimpia hyväksymään totuuden sen tunnistaessaan. Sen sijaan niitä, jotka jatkuvasti torjuvat uskon, kuvataan todellisiksi häviäjiksi.","translations":{"opas":"Ne, joille Pyhän kirjan olemme antanut ja jotka lukevat sitä, niinkuin sitä lukea tulee, uskovat siihen, mutta ne jotka kieltävät sen, ovat kadotuksen omat.","clear":"Ne, joille olemme antaneet Kirjan, seuraavat sitä, kuten sitä tulee seurata. Juuri he ˹todella˺ uskovat siihen. Mitä tulee niihin, jotka hylkäävät sen, juuri he ovat häviäjiä."}},{"verse":122,"commentary_en":"This verse is a direct address to the Children of Israel (descendants of Prophet Jacob, also known as Israel). It reminds them of the many favors and blessings Allah has bestowed upon them throughout their history. This appeal urges them to remember their special status as recipients and carriers of Allah’s message. This reminder sets the stage for the warning that follows.","commentary_fi":"Tämä jae on suora puhe Israelin lapsille (profeetta Jaakobin jälkeläisille, joita kutsutaan myös Israelin kansaksi). Se muistuttaa heitä monista Allahin myöntämistä suosionosoituksista ja siunauksista heidän historiansa aikana. Tämä kehotus kannustaa heitä muistamaan erityisasemansa Allahin sanoman vastaanottajina ja välittäjinä. Tämä muistutus valmistaa tietä seuraavalle varoitukselle.","arabic":"يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَنِّي فَضَّلْتُكُمْ عَلَى الْعَالَمِينَ","commentary":"Tämä jae on suora puhe Israelin lapsille (profeetta Jaakobin jälkeläisille, joita kutsutaan myös Israelin kansaksi). Se muistuttaa heitä monista Allahin myöntämistä suosionosoituksista ja siunauksista heidän historiansa aikana. Tämä kehotus kannustaa heitä muistamaan erityisasemansa Allahin sanoman vastaanottajina ja välittäjinä. Tämä muistutus valmistaa tietä seuraavalle varoitukselle.","translations":{"opas":"Israelilaiset, muistakaa armoani, jota Minä olen teidän ylitsenne vuodattanut, sekä että olen korottanut teidät kaikkien luotujen yli.","clear":"Oi Israelin lapset! Muistakaa suosiotani teitä kohtaan ja kuinka kunnioitin teitä muiden yläpuolella."}},{"verse":123,"commentary_en":"Concluding the appeal to the Children of Israel and the broader discussion, this verse delivers a solemn warning about the Day of Judgment. It emphasizes that on that Day, every soul will be accountable for its own deeds. No soul can help another, no ransom or compensation will be accepted, intercession will only benefit with Allah’s permission, and no external aid will be available. This serves as a reminder against the belief held by some among the Children of Israel that their descent from Abraham would \"ransom\" them on the Day of Judgment—a belief refuted in the following verse.","commentary_fi":"Päättäen vetoomuksen Israelin lapsille ja laajemman keskustelun, tämä jae antaa vakavan varoituksen Tuomiopäivästä. Se korostaa, että sinä päivänä jokainen sielu on vastuussa omista teoistaan. Mikään sielu ei voi auttaa toista, ei lunnaat tai korvaukset hyväksytä, välitys on hyödyllistä vain Allahin luvalla, eikä ulkopuolista apua ole saatavilla. Tämä muistuttaa niitä uskomuksia, joita jotkut Israelin lapsista pitivät siitä, että heidän Abrahamilta polveutumisensa lunastaisi heidät Tuomiopäivänä – uskomus, joka kumotaan seuraavassa jaessa.","arabic":"وَاتَّقُوا يَوْمًا لَا تَجْزِي نَفْسٌ عَنْ نَفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا عَدْلٌ وَلَا تَنْفَعُهَا شَفَاعَةٌ وَلَا هُمْ يُنْصَرُونَ","commentary":"Päättäen vetoomuksen Israelin lapsille ja laajemman keskustelun, tämä jae antaa vakavan varoituksen Tuomiopäivästä. Se korostaa, että sinä päivänä jokainen sielu on vastuussa omista teoistaan. Mikään sielu ei voi auttaa toista, ei lunnaat tai korvaukset hyväksytä, välitys on hyödyllistä vain Allahin luvalla, eikä ulkopuolista apua ole saatavilla. Tämä muistuttaa niitä uskomuksia, joita jotkut Israelin lapsista pitivät siitä, että heidän Abrahamilta polveutumisensa lunastaisi heidät Tuomiopäivänä – uskomus, joka kumotaan seuraavassa jaessa.","translations":{"opas":"Ja pelätkää sitä päivää, jolloin yksikään sielu ei voi tehdä vähäisintäkään toisen puolesta, jolloin ei mitään lunnaita oteta vastaan eikä mitään välitystä hyväksytä, eikä kukaan saa toiselta mitään apua.","clear":"Ja varokaa Päivää, jolloin yksikään sielu ei ole avuksi toiselle. Ei lunnaita oteta, ei välitystä hyväksytä eikä apua anneta."}},{"verse":124,"commentary_en":"This verse reminds us of Prophet Abraham, a highly respected figure in Islam, who was tested by Allah with specific commands and successfully fulfilled them. The Qur’an details the severe trials Abraham endured. After these tests, Allah promised to make him a leader for all humanity, a model of righteousness to be followed. Abraham, being human, asked whether this leadership would extend to his descendants. Allah replied that the promise applies only to those among his offspring who do good. This emphasizes a core principle: closeness to Allah and leadership in faith depend on sincere belief and righteous deeds, not merely on family lineage. Those who turn away from righteousness, associate partners with Allah, or cause harm are excluded from this promise. Thus, the divine promise of leadership applies only to Abraham’s righteous descendants, excluding wrongdoers—including the misguided Israelites and the polytheistic Ishmaelites.","commentary_fi":"Tämä jae muistuttaa meitä profeetta Abrahamista, islamissa erittäin arvostetusta hahmosta, jota Allah koetteli erityisillä käskyillä, ja joka onnistuneesti täytti ne. Koraani kuvaa Abrahamin läpikäymiä ankaria koettelemuksia. Näiden koeteltuaan Allah lupasi tehdä hänestä johtajan koko ihmiskunnalle, esikuvaksi vanhurskaudessa. Abraham, ollen ihminen, kysyi, ulottuuko tämä johtajuus myös hänen jälkeläisiinsä. Allah vastasi, että lupaus koskee vain niitä hänen jälkeläisistään, jotka tekevät hyvää. Tämä korostaa keskeistä periaatetta: läheisyys Allahin kanssa ja uskonnollinen johtajuus perustuvat vilpittömään uskoon ja vanhurskaisiin tekoihin, eivät pelkästään sukulinjaan. Ne, jotka kääntyvät pois vanhurskaudesta, asettavat Allahin rinnalle kumppaneita tai aiheuttavat vahinkoa, suljetaan pois tästä lupauksesta. Näin ollen jumalallinen lupaus johtajuudesta koskee ainoastaan Abrahamin vanhurskaita jälkeläisiä, poissulkien väärintekijät – mukaan lukien harhautuneet israelilaiset ja monijumalaiset ismaililaiset.","arabic":"وَإِذِ ابْتَلَىٰ إِبْرَاهِيمَ رَبُّهُ بِكَلِمَاتٍ فَأَتَمَّهُنَّ ۖ قَالَ إِنِّي جَاعِلُكَ لِلنَّاسِ إِمَامًا ۖ قَالَ وَمِنْ ذُرِّيَّتِي ۖ قَالَ لَا يَنَالُ عَهْدِي الظَّالِمِينَ","commentary":"Tämä jae muistuttaa meitä profeetta Abrahamista, islamissa erittäin arvostetusta hahmosta, jota Allah koetteli erityisillä käskyillä, ja joka onnistuneesti täytti ne. Koraani kuvaa Abrahamin läpikäymiä ankaria koettelemuksia. Näiden koeteltuaan Allah lupasi tehdä hänestä johtajan koko ihmiskunnalle, esikuvaksi vanhurskaudessa. Abraham, ollen ihminen, kysyi, ulottuuko tämä johtajuus myös hänen jälkeläisiinsä. Allah vastasi, että lupaus koskee vain niitä hänen jälkeläisistään, jotka tekevät hyvää. Tämä korostaa keskeistä periaatetta: läheisyys Allahin kanssa ja uskonnollinen johtajuus perustuvat vilpittömään uskoon ja vanhurskaisiin tekoihin, eivät pelkästään sukulinjaan. Ne, jotka kääntyvät pois vanhurskaudesta, asettavat Allahin rinnalle kumppaneita tai aiheuttavat vahinkoa, suljetaan pois tästä lupauksesta. Näin ollen jumalallinen lupaus johtajuudesta koskee ainoastaan Abrahamin vanhurskaita jälkeläisiä, poissulkien väärintekijät – mukaan lukien harhautuneet israelilaiset ja monijumalaiset ismaililaiset.","translations":{"opas":"Entä kun Herra koetteli Aabrahamia käskyillään, ja tämä täytti ne? Hän sanoi: »Tahdon totisesti tehdä sinut ihmisten uskonnolliseksi johtajaksi.» Aabraham kysyi: »Teetkö samoin (ihmisten uskonnollisen johtajat) jälkeläisistäni?» Hän vastasi: »Minun liittoni ei ulotu väärämielisiin.»","clear":"˹Muistakaa˺ kun Abrahamia koetteli hänen Herransa ˹tietyillä˺ käskyillä, jotka hän täytti. Jumala sanoi: \"Teen sinusta varmasti esikuvan ihmisille.\" Abraham kysyi: \"Entä jälkeläiseni?\" Jumala vastasi: \"Liittoni ei ulotu väärintekijöihin.\""}},{"verse":125,"commentary_en":"Following the mention of Prophet Abraham's status, this verse speaks about the Ka'bah in Makkah, a central and sacred building for Muslims. It tells us that Allah designated this House as a gathering place and a sanctuary for people, where they should find peace and security. Muslims are instructed to take the place where Prophet Abraham stood as a place for prayer. The verse also mentions a covenant made with Prophet Abraham and his son, Prophet Ishmael. They were tasked with purifying this House, making it ready and sacred for those who would come to perform various acts of worship there, such as circling it, staying for spiritual devotion, or praying by bowing and prostrating. This shows the historical significance of the Ka'bah as a place dedicated to the worship of Allah from the time of Prophet Abraham and Prophet Ishmael.","commentary_fi":"Profeetta Abrahamin aseman mainitsemisen jälkeen tämä jae puhuu Ka'basta Mekassa, joka on muslimeille keskeinen ja pyhä rakennus. Se kertoo meille, että Allah määräsi tämän Talon kokoontumispaikaksi ja turvapaikaksi ihmisille, jossa heidän tulisi löytää rauha ja turvallisuus. Muslimeja on käsketty rukoilemaan Profeetta Abrahamin seisomapaikalla. Jae mainitsee myös liiton, joka tehtiin Profeetta Abrahamin ja hänen poikansa, Profeetta Ishmaelin kanssa. Heidät määrättiin puhdistamaan tämä Talo, tekemään siitä valmis ja pyhä niille, jotka tulisivat suorittamaan siellä erilaisia palvonnan tekoja, kuten sen kiertäminen, hengelliseen omistautumiseen jääminen tai rukoilu kumartamalla ja prostratoitumalla. Tämä osoittaa Ka'ban historiallisen merkityksen paikana, joka on omistettu Allahin palvonnalle Profeetta Abrahamin ja Profeetta Ishmaelin ajoista lähtien.","arabic":"وَإِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِلنَّاسِ وَأَمْنًا وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى ۖ وَعَهِدْنَا إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ أَنْ طَهِّرَا بَيْتِيَ لِلطَّائِفِينَ وَالْعَاكِفِينَ وَالرُّكَّعِ السُّجُودِ","commentary":"Profeetta Abrahamin aseman mainitsemisen jälkeen tämä jae puhuu Ka'basta Mekassa, joka on muslimeille keskeinen ja pyhä rakennus. Se kertoo meille, että Allah määräsi tämän Talon kokoontumispaikaksi ja turvapaikaksi ihmisille, jossa heidän tulisi löytää rauha ja turvallisuus. Muslimeja on käsketty rukoilemaan Profeetta Abrahamin seisomapaikalla. Jae mainitsee myös liiton, joka tehtiin Profeetta Abrahamin ja hänen poikansa, Profeetta Ishmaelin kanssa. Heidät määrättiin puhdistamaan tämä Talo, tekemään siitä valmis ja pyhä niille, jotka tulisivat suorittamaan siellä erilaisia palvonnan tekoja, kuten sen kiertäminen, hengelliseen omistautumiseen jääminen tai rukoilu kumartamalla ja prostratoitumalla. Tämä osoittaa Ka'ban historiallisen merkityksen paikana, joka on omistettu Allahin palvonnalle Profeetta Abrahamin ja Profeetta Ishmaelin ajoista lähtien.","translations":{"opas":"Entä kun Me määräsimme temppelin (Mekassa) ihmisten pyhäköksi ja turvapaikaksi sanoen: »Ottakaa rukoushuoneeksenne paikka, mihin Aabraham pysähtyi (rukoilemaan)»? Me velvoitimme Aabrahamin ja Ismaelin puhdistamaan pyhäkön niille, jotka kulkueissa käyvät sen ympäri, jotka vetäytyvät sinne mietiskelyyn, jotka siellä kumartavat ja heittäytyvät maahan.","clear":"Ja ˹muistakaa˺ kun teimme Pyhästä Huoneesta keskuksen ja pyhäkön ihmisille ˹sanoen˺: \"˹Voitte˺ ottaa Abrahamin seisontapaikan rukouspaikaksi.\" Ja me uskoimme Abrahamin ja Ismaelin puhdistamaan Huoneeni niitä varten, jotka kiertävät sitä, jotka mietiskelevät siinä ja jotka kumartavat ja lankeavat maahan ˹rukouksessa˺."}},{"verse":126,"commentary_en":"This verse continues the account related to the Ka'bah and the city of Makkah. Prophet Abraham prays for the city to become a place of peace and security, asking Allah to provide for \"those among them who believe in Allah and the Last Day.\" Allah states that He will grant enjoyment in this life even to those who reject faith, but their final destination will be the Fire. When Abraham inquired about who deserved world leadership, it was made clear that only his truly believing and righteous children—excluding the wrongdoers—were worthy. Allah clarified the difference between religious leadership and worldly provision. Only the faithful are entitled to religious leadership, while both believers and unbelievers may receive provision in this life. Therefore, abundant material wealth should not be mistaken as a sign of Allah’s pleasure or divine appointment for religious guidance. This verse links to the previous ones by showing Abraham’s concern for the future of Makkah and its people after he and Prophet Ishmael built the Ka'bah.","commentary_fi":"Tämä jae jatkaa kertomusta Ka’abasta ja Makan kaupungista. Profeetta Abraham rukoilee, että kaupunki tulisi rauhan ja turvallisuuden paikaksi, pyytäen Allahia huolehtimaan \"niistä, jotka uskovat Allahiin ja Viimeiseen Päivään\". Allah ilmoittaa, että Hän antaa nautinnon tästä elämästä myös niille, jotka hylkäävät uskon, mutta heidän lopullinen määränpäänsä on Tuli. Kun Abraham tiedusteli, kuka ansaitsee maailman johtajuuden, hänelle tehtiin selväksi, että vain hänen todella uskovat ja vanhurskaat jälkeläisensä – pois sulkien väärintekijät – ovat siihen kelvollisia. Allah selvensi eron uskonnollisen johtajuuden ja maallisen toimeentulon välillä. Vain uskovat ovat oikeutettuja uskonnolliseen johtajuuteen, kun taas sekä uskoville että ei-uskoville voidaan myöntää toimeentulo tässä elämässä. Siksi runsasta aineellista rikkautta ei tulisi tulkita merkkinä Allahin mielihyvästä tai jumalallisesta tehtävästä uskonnollisena ohjaajana. Tämä jae liittyy edellisiin osoittaen Abrahamin huolen Makan kaupungin ja sen asukkaiden tulevaisuudesta sen jälkeen, kun hän ja profeetta Ishmael rakensivat Ka’aban.","arabic":"وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ اجْعَلْ هَٰذَا بَلَدًا آمِنًا وَارْزُقْ أَهْلَهُ مِنَ الثَّمَرَاتِ مَنْ آمَنَ مِنْهُمْ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۖ قَالَ وَمَنْ كَفَرَ فَأُمَتِّعُهُ قَلِيلًا ثُمَّ أَضْطَرُّهُ إِلَىٰ عَذَابِ النَّارِ ۖ وَبِئْسَ الْمَصِيرُ","commentary":"Tämä jae jatkaa kertomusta Ka’abasta ja Makan kaupungista. Profeetta Abraham rukoilee, että kaupunki tulisi rauhan ja turvallisuuden paikaksi, pyytäen Allahia huolehtimaan \"niistä, jotka uskovat Allahiin ja Viimeiseen Päivään\". Allah ilmoittaa, että Hän antaa nautinnon tästä elämästä myös niille, jotka hylkäävät uskon, mutta heidän lopullinen määränpäänsä on Tuli. Kun Abraham tiedusteli, kuka ansaitsee maailman johtajuuden, hänelle tehtiin selväksi, että vain hänen todella uskovat ja vanhurskaat jälkeläisensä – pois sulkien väärintekijät – ovat siihen kelvollisia. Allah selvensi eron uskonnollisen johtajuuden ja maallisen toimeentulon välillä. Vain uskovat ovat oikeutettuja uskonnolliseen johtajuuteen, kun taas sekä uskoville että ei-uskoville voidaan myöntää toimeentulo tässä elämässä. Siksi runsasta aineellista rikkautta ei tulisi tulkita merkkinä Allahin mielihyvästä tai jumalallisesta tehtävästä uskonnollisena ohjaajana. Tämä jae liittyy edellisiin osoittaen Abrahamin huolen Makan kaupungin ja sen asukkaiden tulevaisuudesta sen jälkeen, kun hän ja profeetta Ishmael rakensivat Ka’aban.","translations":{"opas":"Entä kun Aabraham sanoi: »Herrani, tee tämä turvalliseksi seuduksi ja suo hedelmiäsi sen asukkaille, jos he uskovat Jumalaan ja Viimeiseen päivään?» Hän vastasi: »Senkin, joka on epäuskoinen, annan Minä nauttia lyhyen ajan; sitten olen syöksevä hänet Tulen kidutukseen, joka on surkea matkan pää.»","clear":"Ja ˹muistakaa˺ kun Abraham sanoi: \"Herrani, tee tämä kaupunki ˹Mekka˺ turvalliseksi ja anna hedelmiä sen asukkaille – niille heidän joukostaan, jotka uskovat Jumalaan ja Viimeiseen Päivään.\" Hän vastasi: \"Mitä tulee niihin, jotka eivät usko, annan heidän nauttia itsestään hetken aikaa, sitten tuomitsen heidät Tulen piinaan. Mikä paha määränpää!\""}},{"verse":127,"commentary_en":"This verse brings us directly into the scene of Prophet Abraham and Prophet Ishmael working together to lay the foundations of the Ka'bah. While engaged in this momentous task, they offered a heartfelt prayer. Their first request was that Allah accept this service from them. They acknowledged Allah as the All-Hearing and All-Knowing, recognizing that He hears their prayer and is fully aware of their intentions and efforts. This reflects their humility and dedication to performing the work solely for Allah’s sake, hoping for His acceptance. This prayer begins a series of supplications recorded in the following verses, all made during the building of the sacred House.","commentary_fi":"Tämä jae vie meidät suoraan kohtaukseen, jossa profeetta Abraham ja profeetta Ishmael yhdessä nostavat Ka’aban perustuksia. Tämän merkittävän tehtävän aikana he esittivät vilpittömän rukouksen. Ensimmäinen pyyntö oli, että Allah hyväksyisi heidän työnsä. He tunnustivat Allahin Kaikkikuulevaksi ja Kaikkitietäväksi, ymmärtäen, että Hän kuulee heidän rukouksensa ja on täysin tietoinen heidän aikeistaan ja ponnisteluistaan. Tämä osoittaa heidän nöyryytensä ja omistautumisensa tekemään työn pelkästään Allahin tähden, toivoen Hänen hyväksyntäänsä. Tämä rukous aloittaa sarjan rukouksia, jotka on tallennettu seuraavissa jakeissa, kaikki esitetty heidän rakentaessaan pyhää Taloa.","arabic":"وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ
