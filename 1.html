<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Fatiha (Avauksen suura)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Al-Fatiha (Avauksen suura)</h1>
    <div id="verseContainer"></div>
  </div>
  <script>
    const verses = [{"verse":1,"commentary_en":"This opening verse is a phrase that Muslims use to begin many actions, including reading the Qur’an. It teaches the importance of starting with the name of Allah—the Arabic word for God, used by Muslims and also by Arabic-speaking Christians and Jews. In this verse, Allah is introduced with two of His most beautiful and significant names: al-Rahman (the Most Gracious) and al-Rahim (the Most Merciful). These names express the vastness and depth of Allah’s compassion, which encompasses all creation. Starting with this phrase reminds believers to recognize and be mindful of Allah before beginning any task.","commentary_fi":"Tämä aloitusjae on lause, jota muslimit käyttävät monien tekojen alussa, kuten Koraanin lukemisessa. Se opettaa aloittamaan Allahin nimissä—Allah on arabiankielinen sana Jumalalle, jota käyttävät muslimit sekä myös arabiankieliset kristityt ja juutalaiset. Tässä jakeessa Allah esitellään kahdella Hänen kauneimmista ja merkittävimmistä nimistään: ar-Rahman (Ylimaallinen Armahtaja) ja ar-Rahim (Erityisen Laupias). Nämä nimet kuvaavat Allahin laajaa ja syvää armoa, joka ulottuu kaikkeen luotuun. Tämän lauseen käyttäminen muistuttaa uskovaa siitä, että tulee tunnustaa ja olla tietoinen Allahista ennen minkä tahansa asian aloittamista.","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","commentary":"Tämä aloitusjae on lause, jota muslimit käyttävät monien tekojen alussa, kuten Koraanin lukemisessa. Se opettaa aloittamaan Allahin nimissä—Allah on arabiankielinen sana Jumalalle, jota käyttävät muslimit sekä myös arabiankieliset kristityt ja juutalaiset. Tässä jakeessa Allah esitellään kahdella Hänen kauneimmista ja merkittävimmistä nimistään: ar-Rahman (Ylimaallinen Armahtaja) ja ar-Rahim (Erityisen Laupias). Nämä nimet kuvaavat Allahin laajaa ja syvää armoa, joka ulottuu kaikkeen luotuun. Tämän lauseen käyttäminen muistuttaa uskovaa siitä, että tulee tunnustaa ja olla tietoinen Allahista ennen minkä tahansa asian aloittamista.","translations":{"opas":"﻿Aloitan JUMALAN, laupiaan Armahtajan, nimeen.","clear":"Jumalan, armeliaimman ja laupiaimman, nimeen."}},{"verse":2,"commentary_en":"Following the invocation of Allah's name and mercy, this verse teaches us to offer praise to Him. Praising Allah is a natural response to recognizing His vast kindness and understanding that He is the source of all blessings. He is also the Sustainer—meaning He continually provides for, governs, and maintains all that exists. The phrase “Lord of all the worlds” emphasizes that Allah is the sole Creator, Owner, and Ruler of everything in the universe—whether seen or unseen. It highlights Allah’s unique and complete authority over all of creation.","commentary_fi":"Allahin nimen ja armon mainitsemisen jälkeen tämä jae ohjaa meitä ylistämään Häntä. Allahin ylistäminen on luonnollinen reaktio, kun ihminen tunnistaa Hänen valtavan armonsa ja ymmärtää, että Hän on kaikkien siunausten lähde. Hän on myös Ylläpitäjä—eli Hän huolehtii jatkuvasti kaikesta olemassa olevasta, hallinnoi ja ylläpitää sitä. Ilmaus \"maailmojen Herra\" korostaa, että Allah on kaiken Luoja, Omistaja ja Hallitsija—näkyvän ja näkymättömän maailmankaikkeuden. Tämä korostaa Allahin ainutlaatuista ja täydellistä valtaa kaikkeen luotuun.","arabic":"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","commentary":"Allahin nimen ja armon mainitsemisen jälkeen tämä jae ohjaa meitä ylistämään Häntä. Allahin ylistäminen on luonnollinen reaktio, kun ihminen tunnistaa Hänen valtavan armonsa ja ymmärtää, että Hän on kaikkien siunausten lähde. Hän on myös Ylläpitäjä—eli Hän huolehtii jatkuvasti kaikesta olemassa olevasta, hallinnoi ja ylläpitää sitä. Ilmaus \"maailmojen Herra\" korostaa, että Allah on kaiken Luoja, Omistaja ja Hallitsija—näkyvän ja näkymättömän maailmankaikkeuden. Tämä korostaa Allahin ainutlaatuista ja täydellistä valtaa kaikkeen luotuun.","translations":{"opas":"Ylistys Jumalalle, maailmojen Valtiaalle,","clear":"Kaikki ylistys on Jumalalle, maailmojen Herralle,"}},{"verse":3,"commentary_en":"This verse repeats two of Allah’s most beautiful names—al-Rahman (the Most Gracious) and al-Rahim (the Most Merciful)—right after declaring His Lordship over all creation. This repetition highlights the deep bond between Allah and His creation, a relationship rooted in mercy, compassion, and care. It reminds us that even though Allah is the supreme Creator and Ruler, His dealings with the world are filled with kindness and love. This inspires believers to respond with sincere gratitude and constant praise.","commentary_fi":"Tässä jakeessa toistetaan kaksi Allahin kauneinta nimeä—ar-Rahman (Ylimaallinen Armahtaja) ja ar-Rahim (Erityisen Laupias)—heti sen jälkeen, kun Hänet on kuvattu kaikkien maailmojen Herraksi. Tämä toisto korostaa syvää yhteyttä Allahin ja Hänen luotujensa välillä, suhdetta joka perustuu armoon, myötätuntoon ja huolenpitoon. Se muistuttaa, että vaikka Allah on kaiken Luoja ja Hallitsija, Hänen vuorovaikutuksensa maailman kanssa on täynnä lempeyttä ja rakkautta. Tämä herättää uskovissa syvää kiitollisuutta ja jatkuvaa ylistystä.","arabic":"الرَّحْمَٰنِ الرَّحِيمِ","commentary":"Tässä jakeessa toistetaan kaksi Allahin kauneinta nimeä—ar-Rahman (Ylimaallinen Armahtaja) ja ar-Rahim (Erityisen Laupias)—heti sen jälkeen, kun Hänet on kuvattu kaikkien maailmojen Herraksi. Tämä toisto korostaa syvää yhteyttä Allahin ja Hänen luotujensa välillä, suhdetta joka perustuu armoon, myötätuntoon ja huolenpitoon. Se muistuttaa, että vaikka Allah on kaiken Luoja ja Hallitsija, Hänen vuorovaikutuksensa maailman kanssa on täynnä lempeyttä ja rakkautta. Tämä herättää uskovissa syvää kiitollisuutta ja jatkuvaa ylistystä.","translations":{"opas":"armolahjojen Antajalle, laupiaalle Ohjaajalle ja Siunaajalle,","clear":"armeliaimman ja laupiaimman,"}},{"verse":4,"commentary_en":"This verse introduces one of the core beliefs in Islam: the Day of Judgment. By describing Allah as the “Master of the Day of Judgment,” it affirms that He alone will have full authority on the day when every person will be held accountable for their actions in this life. Belief in this final reckoning shifts our focus beyond just worldly concerns. It encourages people to act ethically, take responsibility for their choices, and live with the understanding that true justice—perfect and complete—will ultimately come from Allah.","commentary_fi":"Tämä jae esittelee yhden islamin keskeisistä uskonkappaleista: Ylösnousemuksen ja Tuomiopäivän. Kun Allahia kuvataan \"Tuomiopäivän Hallitsijaksi\", se vahvistaa, että vain Hänellä on täysi valta sinä päivänä, jolloin jokainen ihminen joutuu vastuuseen teoistaan tässä elämässä. Uskolla tähän tulevaan todellisuuteen on tärkeä vaikutus: se siirtää ihmisen huomion pelkän ajallisen elämän ulkopuolelle. Se rohkaisee moraaliseen vastuullisuuteen, antaa elämälle syvemmän tarkoituksen ja tuo varmuuden siitä, että täydellinen oikeudenmukaisuus tullaan lopulta toteuttamaan Allahin toimesta.","arabic":"مَالِكِ يَوْمِ الدِّينِ","commentary":"Tämä jae esittelee yhden islamin keskeisistä uskonkappaleista: Ylösnousemuksen ja Tuomiopäivän. Kun Allahia kuvataan \"Tuomiopäivän Hallitsijaksi\", se vahvistaa, että vain Hänellä on täysi valta sinä päivänä, jolloin jokainen ihminen joutuu vastuuseen teoistaan tässä elämässä. Uskolla tähän tulevaan todellisuuteen on tärkeä vaikutus: se siirtää ihmisen huomion pelkän ajallisen elämän ulkopuolelle. Se rohkaisee moraaliseen vastuullisuuteen, antaa elämälle syvemmän tarkoituksen ja tuo varmuuden siitä, että täydellinen oikeudenmukaisuus tullaan lopulta toteuttamaan Allahin toimesta.","translations":{"opas":"jonka hallussa yksin on Tilinteon päivä.","clear":"Tuomiopäivän Valtiaalle."}},{"verse":5,"commentary_en":"This verse marks a major shift—from recognizing who Allah is (in verses 1–4) to expressing our personal response and commitment. It is a direct and powerful statement: “You alone we worship, and You alone we ask for help.” With these words, we affirm that all acts of devotion, obedience, and worship are directed solely to Allah. At the same time, we declare that we rely on Him alone for guidance, support, and strength. This idea lies at the heart of Islamic monotheism, emphasizing complete dependence on Allah. It frees the believer from being spiritually or morally dependent on anything or anyone else.","commentary_fi":"Tämä jae merkitsee merkittävää siirtymää: siirrytään siitä, kuka Allah on (jakeet 1–4), siihen, miten me itse suhtaudumme Häneen. Se on suora ja voimakas julistus: “Yksin Sinua me palvomme ja Yksin Sinulta me apua pyydämme.” Näillä sanoilla vahvistamme, että kaikki palvonta, kuuliaisuus ja omistautuminen kohdistuvat yksin Allahiin. Samalla tunnustamme, että haemme apua, tukea ja johdatusta yksinomaan Häneltä. Tämä periaate on islamilaisen monoteismin ydin: täydellinen riippuvuus Allahista. Se vapauttaa uskovan henkisestä ja moraalisesta riippuvuudesta muihin kuin Allahiin.","arabic":"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","commentary":"Tämä jae merkitsee merkittävää siirtymää: siirrytään siitä, kuka Allah on (jakeet 1–4), siihen, miten me itse suhtaudumme Häneen. Se on suora ja voimakas julistus: “Yksin Sinua me palvomme ja Yksin Sinulta me apua pyydämme.” Näillä sanoilla vahvistamme, että kaikki palvonta, kuuliaisuus ja omistautuminen kohdistuvat yksin Allahiin. Samalla tunnustamme, että haemme apua, tukea ja johdatusta yksinomaan Häneltä. Tämä periaate on islamilaisen monoteismin ydin: täydellinen riippuvuus Allahista. Se vapauttaa uskovan henkisestä ja moraalisesta riippuvuudesta muihin kuin Allahiin.","translations":{"opas":"Sinua ainoata palvelemme, Sinua huudamme avuksi.","clear":"Sinua ˹yksin˺ me palvomme ja Sinulta ˹yksin˺ me pyydämme apua."}},{"verse":6,"commentary_en":"After expressing our devotion and reliance on Allah in the previous verse, this verse turns into a heartfelt plea for guidance. We ask Allah to show us the “straight path”—the way of truth, goodness, and balance that leads to success both in this life and in the hereafter. This prayer reflects a deep awareness that human beings cannot find or remain on the right path without Allah’s help. It emphasizes our need for divine direction and prepares us for the next verse, which further explains what this “straight path” looks like.","commentary_fi":"Edellisen jakeen omistautumisen ja riippuvuuden ilmaisun jälkeen tämä jae muuttuu vilpittömäksi rukoukseksi johdatuksesta. Pyydämme Allahia ohjaamaan meidät \"suoraa tietä\". Tämä suora tie merkitsee totuuden, hyvyyden ja tasapainon tietä, joka johtaa menestykseen sekä tässä elämässä että tuonpuoleisessa. Tämä rukous kuvastaa ymmärrystä siitä, että ihminen ei omin voimin pysty löytämään tai pysymään oikealla tiellä ilman Allahin johdatusta. Jaetta seuraava jae selventää, millainen tämä suora tie on.","arabic":"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","commentary":"Edellisen jakeen omistautumisen ja riippuvuuden ilmaisun jälkeen tämä jae muuttuu vilpittömäksi rukoukseksi johdatuksesta. Pyydämme Allahia ohjaamaan meidät \"suoraa tietä\". Tämä suora tie merkitsee totuuden, hyvyyden ja tasapainon tietä, joka johtaa menestykseen sekä tässä elämässä että tuonpuoleisessa. Tämä rukous kuvastaa ymmärrystä siitä, että ihminen ei omin voimin pysty löytämään tai pysymään oikealla tiellä ilman Allahin johdatusta. Jaetta seuraava jae selventää, millainen tämä suora tie on.","translations":{"opas":"Ohjaa meidät oikeata tietä,","clear":"Johdata meidät oikealle tielle,"}},{"verse":7,"commentary_en":"This final verse clarifies the nature of the \"straight way\" sought in the previous verse. It is described as the path of those whom Allah has blessed and favored with His guidance and grace. This path is contrasted with two other paths: the path of those who have incurred Allah's displeasure, often due to rejecting or deviating from the truth after knowing it, and the path of those who have gone astray, often due to ignorance, heedlessness, or misguidance. This verse defines the desired path as one that leads to receiving Allah's grace and protection from deviation and displeasure.","commentary_fi":"Tämä viimeinen jae selventää edellisessä jakeessa pyydetyn \"suoran tien\" luonnetta. Se kuvataan niiden polkuna, joita Allah on siunannut ja suosinut ohjauksellaan ja armollaan. Tätä polkua verrataan kahteen muuhun polkuun: niiden polkuun, jotka ovat joutuneet Allahin epämiellyttäväksi, usein torjumalla tai poikkeamalla totuudesta sen tietämisen jälkeen, ja niiden polkuun, jotka ovat eksyneet, usein tietämättömyyden, huolimattomuuden tai harhaannuksen vuoksi. Tämä jae määrittää toivotun polun sellaiseksi, joka johtaa Allahin armon vastaanottamiseen ja suojeluun poikkeamilta ja epämiellyttävyydeltä.","arabic":"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ","commentary":"Tämä viimeinen jae selventää edellisessä jakeessa pyydetyn \"suoran tien\" luonnetta. Se kuvataan niiden polkuna, joita Allah on siunannut ja suosinut ohjauksellaan ja armollaan. Tätä polkua verrataan kahteen muuhun polkuun: niiden polkuun, jotka ovat joutuneet Allahin epämiellyttäväksi, usein torjumalla tai poikkeamalla totuudesta sen tietämisen jälkeen, ja niiden polkuun, jotka ovat eksyneet, usein tietämättömyyden, huolimattomuuden tai harhaannuksen vuoksi. Tämä jae määrittää toivotun polun sellaiseksi, joka johtaa Allahin armon vastaanottamiseen ja suojeluun poikkeamilta ja epämiellyttävyydeltä.","translations":{"opas":"niiden tietä, joiden osana on Sinun mielisuosiosi ei niiden tietä, jotka ovat Sinun vihasi alaisia, eikä niiden,jotka harhaan eksyvät.","clear":"niiden tielle, joita olet siunannut – ei niiden, joihin olet tyytymätön, eikä niiden, jotka ovat harhautuneet."}}];
    const translationSources = ["opas","clear"];

    function renderVerses() {
      const container = document.getElementById('verseContainer');
      verses.forEach((verse) => {
        const verseDiv = document.createElement('div');
        verseDiv.classList.add('verse');

        const verseNumber = document.createElement('div');
        verseNumber.classList.add('verse-number');
        verseNumber.textContent = 'Jae ' + verse.verse;

        const arabicText = document.createElement('div');
        arabicText.classList.add('arabic-text');
        arabicText.textContent = verse.arabic;

        const translationLine = document.createElement('div');
        translationLine.classList.add('translation-line');

        const selector = document.createElement('select');
        translationSources.forEach(option => {
          const opt = document.createElement('option');
          opt.value = option;
          opt.textContent = option;
          selector.appendChild(opt);
        });

        const verseText = document.createElement('div');
        verseText.classList.add('verse-text');
        verseText.innerHTML = verse.translations[translationSources[0]] || '';

        selector.addEventListener('change', () => {
          verseText.innerHTML = verse.translations[selector.value] || '';
        });

        translationLine.appendChild(selector);
        translationLine.appendChild(verseText);

        const verseCommentary = document.createElement('div');
        verseCommentary.classList.add('commentary');
        verseCommentary.innerHTML = verse.commentary;

        verseDiv.appendChild(verseNumber);
        // verseDiv.appendChild(arabicText);
        verseDiv.appendChild(translationLine);
        verseDiv.appendChild(verseCommentary);

        container.appendChild(verseDiv);
      });
    }
    renderVerses();
  </script>
</body>
</html>
